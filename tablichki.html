<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Таблицы немецкого</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f5f5b">
<style>
  :root { --bg:#eff1ec; --surface:#fbfaf7; --surface-2:#ffffff; --ink:#202422; --ink-muted:#5b615c;
    --ink-faint:#8b918a; --accent:#1f5f5b; --accent-ink:#ffffff; --line:#dde0d9;
    --ok:#2e7d43; --ok-bg:#e5f2e8; --err:#b3402a; --err-bg:#fbeae6;
    --shadow:0 1px 2px rgba(32,36,34,0.06),0 6px 16px rgba(32,36,34,0.05); }
  :root[data-theme="dark"] { --bg:#14181a; --surface:#1c2224; --surface-2:#202729; --ink:#edefea; --ink-muted:#9ba39c;
    --ink-faint:#6d746e; --accent:#4fb3a9; --accent-ink:#0d1413; --line:#2a3234;
    --ok:#6fce8a; --ok-bg:#17281c; --err:#e8836b; --err-bg:#2b1a16;
    --shadow:0 1px 2px rgba(0,0,0,0.3),0 8px 24px rgba(0,0,0,0.35); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#14181a; --surface:#1c2224; --surface-2:#202729;
    --ink:#edefea; --ink-muted:#9ba39c; --ink-faint:#6d746e; --accent:#4fb3a9; --accent-ink:#0d1413; --line:#2a3234;
    --ok:#6fce8a; --ok-bg:#17281c; --err:#e8836b; --err-bg:#2b1a16;
    --shadow:0 1px 2px rgba(0,0,0,0.3),0 8px 24px rgba(0,0,0,0.35); } }
  * { box-sizing:border-box; } body { margin:0; }
  .lp { background:var(--bg); color:var(--ink); font-family:-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
    max-width:860px; margin:0 auto; padding:24px 16px 64px; line-height:1.5; min-height:100vh; }
  .lp h1 { font-family:Georgia,"Iowan Old Style","Palatino Linotype","Times New Roman",serif; text-wrap:balance; margin:0 0 6px; }
  .backbar{ position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:10px;
    padding:10px 14px; background:rgba(31,95,91,0.96); backdrop-filter:blur(8px); box-shadow:0 1px 8px rgba(0,0,0,0.18); }
  @media (prefers-color-scheme: dark){ .backbar{ background:rgba(20,26,28,0.96); border-bottom:1px solid #2a3234; } }
  .backbar a.bb-link{ display:inline-flex; align-items:center; gap:7px; color:#fff; text-decoration:none;
    font-weight:600; font-size:14.5px; padding:7px 14px; border-radius:999px;
    border:1px solid rgba(255,255,255,0.32); background:rgba(255,255,255,0.10); }
  .backbar span.bb-title{ color:#fff; font-weight:700; font-size:14.5px; opacity:.9; }
  .подзаг { color:var(--ink-muted); font-size:14.5px; margin:0 0 18px; }
  .кат-список { display:flex; flex-direction:column; gap:10px; margin:0 0 8px; }
  .кат { display:flex; align-items:center; gap:14px; padding:15px 16px; border-radius:16px; cursor:pointer;
    background:var(--surface); color:var(--ink); border:1px solid var(--line); box-shadow:var(--shadow);
    font:inherit; text-align:left; width:100%; }
  .кат { text-decoration:none; }
  .кат-список { margin-top:18px; }
  [hidden] { display:none !important; }
  .кн { text-decoration:none; display:inline-flex; align-items:center; }
  .слушать { color:inherit; font:inherit; background:none; border:0; cursor:pointer; padding:2px 4px; }
  .подсказка { display:block; color:var(--ink-muted); margin-top:4px; }
  .табл th[scope="row"] { text-align:left; white-space:normal; }
  .кат .знак { font-size:26px; }
  .кат b { font-size:16.5px; display:block; }
  .кат span.пояс { display:block; font-size:13px; color:var(--ink-muted); margin-top:2px; }
  .режимы { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin:14px 0 16px; }
  .режимы button { font:inherit; font-size:13px; font-weight:700; padding:12px 4px; min-height:56px;
    border-radius:14px; cursor:pointer; background:var(--surface); color:var(--ink); border:1px solid var(--line); }
  .режимы button.вкл { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .карта { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px 12px;
    box-shadow:var(--shadow); margin-bottom:14px; }
  .карта h2 { font-size:18px; margin:0 0 4px; font-family:Georgia,"Iowan Old Style",serif; }
  .карта .под { font-size:13px; color:var(--ink-muted); margin:0 0 12px; }
  .обёртка { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  table.табл { border-collapse:collapse; width:100%; min-width:480px; font-size:15px; }
  table.табл th, table.табл td { border:1px solid var(--line); padding:10px 8px; text-align:center; }
  table.табл th { background:var(--surface-2); font-size:12.5px; color:var(--ink-muted); white-space:nowrap; }
  table.табл input { font:inherit; font-family:Georgia,"Iowan Old Style",serif; font-size:15px; width:100%;
    padding:6px 4px; border:1px solid var(--line); border-radius:8px; background:var(--surface-2); color:var(--ink); text-align:center; }
  table.табл td.ок { background:var(--ok-bg); }
  table.табл td.ошибка { background:var(--err-bg); }
  .советы { font-size:13.5px; line-height:1.55; color:var(--ink); margin:12px 0 0; padding:0 0 0 4px; }
  .советы li { margin-bottom:7px; }
  .низ { display:flex; gap:9px; flex-wrap:wrap; margin-top:12px; }
  .кн { font:inherit; font-size:14.5px; font-weight:700; padding:12px 18px; border-radius:13px; cursor:pointer;
    border:none; background:var(--accent); color:var(--accent-ink); min-height:46px; }
  .кн.тихая { background:transparent; color:var(--ink); border:1px solid var(--line); font-weight:600; }
  .итог { font-size:14px; font-weight:700; margin-top:10px; }
  .итог.хорошо { color:var(--ok); } .итог.плохо { color:var(--err); }
  @media(max-width:520px) {
    table.табл { min-width:0; font-size:14px; }
    table.табл th, table.табл td { padding:7px 3px; }
    table.табл th { white-space:normal; }
    table.табл input { min-width:2.6em; font-size:16px; }
  }
</style>
</head>
<body>
<div class="backbar">
  <a class="bb-link" id="назад" href="index.html">← Главная</a>
  <span class="bb-title">Таблицы</span>
</div>
<main class="lp" id="экран"></main>
<script src="tema.js"></script>
<script>
const КАТЕГОРИИ = [{"id":"artikeli","имя":"Склонение определённых артиклей","знак":"📐","подзаголовок":"der · die · das · die во всех четырёх падежах","шапка":["Падеж","м. род","ср. род","ж. род","мн. число"],"строки":[["Nominativ (кто? что?)","der","das","die","die"],["Akkusativ (кого? что?)","den","das","die","die"],["Dativ (кому? чему?)","dem","dem","der","den"],["Genitiv (чей?)","des","des","der","der"]],"озвучивать_столбец0":false,"советы":["<b>Akkusativ</b> — меняется только мужской род: der → <b>den</b>. Остальные как в Nominativ.","<b>Dativ</b> — м. и ср. род <b>dem</b>, ж. род <b>der</b>, мн. число <b>den</b> (к слову во мн. ч. иногда +n: den Kindern).","<b>Genitiv</b> — м. и ср. род <b>des</b>, ж. и мн. <b>der</b>; к слову м./ср. рода всегда +s или +es: des Hundes, des Kindes.","Для <b>ein</b> и <b>kein</b> смотри таблицу «Притяжательные (mein…)»."]},{"id":"mestoimeniya","имя":"Личные местоимения","знак":"👤","подзаголовок":"я · меня · мне — Nominativ, Akkusativ, Dativ","шапка":["Лицо","Nominativ","Akkusativ","Dativ"],"строки":[["я","ich","mich","mir"],["ты","du","dich","dir"],["он / она / оно","er / sie / es","ihn / sie / es","ihm / ihr / ihm"],["мы","wir","uns","uns"],["вы (друзья)","ihr","euch","euch"],["они / Вы","sie / Sie","sie / Sie","ihnen / Ihnen"]],"озвучивать_столбец0":false,"советы":["По этим же строчкам меняется возвратное <b>sich</b>: mich/dich/sich, mir/dir/sich, uns, euch, sich.","Akkusativ — «<b>кого?</b>»: Ich sehe <b>dich</b>. Dativ — «<b>кому?</b>»: Ich helfe <b>dir</b>.","ihm / ihm / ihn — он; ihr / ihr / sie — она: аккузатив «её» выглядит как номинатив, не путай."]},{"id":"prityazhatelnye","имя":"Притяжательные (mein…)","знак":"💌","подзаголовок":"mein · dein · sein · ihr · unser · euer — как ein","шапка":["Падеж","м. род","ср. род","ж. род","мн. число"],"строки":[["Nominativ","mein","mein","meine","meine"],["Akkusativ","meinen","mein","meine","meine"],["Dativ","meinem","meinem","meiner","meinen"],["Genitiv","meines","meines","meiner","meiner"]],"озвучивать_столбец0":false,"советы":["Показано <b>mein</b>; все остальные склоняются так же: <b>dein</b> (твой), <b>sein</b> (его), <b>ihr</b> (её / их / Ваш), <b>unser</b> (наш), <b>euer</b> (ваш).","Это ровно склонение <b>ein/kein</b>: окончания те же (mein<b>en</b>, mein<b>em</b>, mein<b>es</b>…).","Nominativ одним списком: <b>mein, dein, sein, ihr, unser, euer, ihr/Sie</b> — про каждого «чей?»."]},{"id":"predlogi","имя":"Предлоги с падежами","знак":"🧭","подзаголовок":"какой предлог — какой падеж","шапка":["Предлог","Падеж","Пример"],"строки":[["für","Akkusativ","für dich — для тебя"],["ohne","Akkusativ","ohne Zucker — без сахара"],["gegen","Akkusativ","gegen die Wand — против стены"],["um","Akkusativ","um den Tisch — вокруг стола"],["durch","Akkusativ","durch den Park — через парк"],["bis","Akkusativ","bis zum Bahnhof — до вокзала"],["mit","Dativ","mit dem Bus — на автобусе"],["nach","Dativ","nach der Arbeit — после работы"],["aus","Dativ","aus dem Haus — из дома"],["bei","Dativ","bei mir — у меня"],["seit","Dativ","seit einem Jahr — уже год"],["von","Dativ","von der Ärztin — от врача"],["zu","Dativ","zur Ordination — к врачу (в приёмную)"],["in","куда? Akk / где? Dat","in den Park / im Park"],["an","куда? Akk / где? Dat","an die Wand / an der Wand"],["auf","куда? Akk / где? Dat","auf den Tisch / auf dem Tisch"],["vor","куда? Akk / где? Dat","vor den Spiegel / vor dem Spiegel"],["hinter","куда? Akk / где? Dat","hinter das Haus / hinter dem Haus"],["unter","куда? Akk / где? Dat","unter den Tisch / unter dem Tisch"],["neben","куда? Akk / где? Dat","neben den Stuhl / neben dem Stuhl"],["zwischen","куда? Akk / где? Dat","zwischen die Bücher / zwischen den Büchern"]],"озвучивать_столбец0":true,"советы":["Фокус «<b>куда?</b>» — Akkusativ (движение куда-то), фокус «<b>где?</b>» — Dativ (место). Это Wechselpräpositionen — предлоги перемены.","Мини-история для запоминания Dativ: <b>mit-nach-aus-bei-seit-von-zu</b> — «с, после, из, у, с (тех пор), от, к».","После <b>mit</b> — всегда Dativ: mit <b>dem</b> Bus (дословно «с автобусом»)."]},{"id":"voprosy","имя":"Вопросительные слова","знак":"❓","подзаголовок":"wer · was · wo · wohin · wem…","шапка":["Слово","Перевод","Пример"],"строки":[["wer?","кто?","Wer ist das?"],["was?","что?","Was ist das?"],["wen?","кого? (Akk)","Wen siehst du?"],["wem?","кому? (Dat)","Wem hilfst du?"],["wessen?","чей? (Gen)","Wessen Buch ist das?"],["wo?","где?","Wo wohnst du?"],["wohin?","куда?","Wohin gehst du?"],["woher?","откуда?","Woher kommst du?"],["wann?","когда?","Wann kommst du?"],["wie?","как?","Wie heißt du?"],["wie viel?","сколько?","Wie viel kostet das?"],["warum?","почему?","Warum lernst du Deutsch?"],["welcher?","который? какой?","Welcher Bus fährt zum Krankenhaus?"]],"озвучивать_столбец0":true,"советы":["<b>wohin / woher / wo</b>: куда (движение туда) / откуда (оттуда) / где (на месте).","<b>wen / wem / wessen</b> — это «wer» в трёх падежах: кого / кому / чей.","Вопрос с предлогом — одним словом: <b>woran</b> (во что?), <b>worüber</b> (о чём?), <b>wofür</b> (для чего?), <b>wohin</b> (куда?)."]}];
const ЗВУК = {"der":"der.mp3","das":"das.mp3","die":"die.mp3","den":"den.mp3","dem":"dem.mp3","des":"des.mp3","ich":"ich.mp3","mich":"mich.mp3","mir":"mir.mp3","du":"du.mp3","dich":"dich.mp3","dir":"dir.mp3","er / sie / es":"er___sie___es.mp3","ihn / sie / es":"ihn___sie___es.mp3","ihm / ihr / ihm":"ihm___ihr___ihm.mp3","wir":"wir.mp3","uns":"uns.mp3","ihr":"ihr.mp3","euch":"euch.mp3","sie / Sie":"sie___Sie.mp3","ihnen / Ihnen":"ihnen___Ihnen.mp3","mein":"mein.mp3","meine":"meine.mp3","meinen":"meinen.mp3","meinem":"meinem.mp3","meiner":"meiner.mp3","meines":"meines.mp3","für":"fuer.mp3","ohne":"ohne.mp3","gegen":"gegen.mp3","um":"um.mp3","durch":"durch.mp3","bis":"bis.mp3","mit":"mit.mp3","nach":"nach.mp3","aus":"aus.mp3","bei":"bei.mp3","seit":"seit.mp3","von":"von.mp3","zu":"zu.mp3","in":"in.mp3","an":"an.mp3","auf":"auf.mp3","vor":"vor.mp3","hinter":"hinter.mp3","unter":"unter.mp3","neben":"neben.mp3","zwischen":"zwischen.mp3","wer":"wer.mp3","was":"was.mp3","wen":"wen.mp3","wem":"wem.mp3","wessen":"wessen.mp3","wo":"wo.mp3","wohin":"wohin.mp3","woher":"woher.mp3","wann":"wann.mp3","wie":"wie.mp3","wie viel":"wie_viel.mp3","warum":"warum.mp3","welcher":"welcher.mp3"};
const экран = document.getElementById('экран');
const назад = document.getElementById('назад');
let таблица, режим, этап, группы, плеер;

function список(){
  назад.href = 'index.html';
  назад.textContent = '← Главная';
  экран.innerHTML = `<h1>Таблицы немецкого</h1>
    <div class="кат-список">
      <a class="кат" href="glagoly.html"><span class="знак">🔁</span><span><b>Глаголы</b>
        <span class="пояс">Обычные, особые, модальные и с чередованием гласной</span></span></a>
      ${КАТЕГОРИИ.map(к=>`<a class="кат" href="#${к.id}"><span class="знак">${к.знак}</span>
        <span><b>${к.имя}</b><span class="пояс">${к.подзаголовок}</span></span></a>`).join('')}
    </div>`;
}

function фрагменты(к){
  const строки = к.id === 'artikeli' || к.id === 'prityazhatelnye';
  const списокСлов = к.озвучивать_столбец0;
  if (строки || списокСлов) return к.строки.map((строка,r)=>({
    имя: строка[0],
    поля: (списокСлов ? [1] : к.шапка.slice(1).map((_,i)=>i+1)).map(c=>[r,c])
  }));
  return к.шапка.slice(1).map((имя,i)=>({имя, поля: к.строки.map((_,r)=>[r,i+1])}));
}

function навигация(){
  таблица = КАТЕГОРИИ.find(к=>location.hash === '#' + к.id);
  if (таблица) {
    назад.href = '#';
    назад.textContent = '← Все таблицы';
    группы = фрагменты(таблица);
    режим = 'смотреть';
    этап = 0;
    рисовать();
  } else {
    список();
  }
  window.scrollTo(0, 0);
  const заголовок = экран.querySelector('h1');
  заголовок.tabIndex = -1;
  заголовок.focus({preventScroll:true});
}

function озвучить(файл){
  if (localStorage.getItem('nemeckiy_zvuk_выкл') === '1') return;
  if (плеер) плеер.pause();
  плеер = new Audio('zvuk/tablichki/' + файл);
  плеер.play().catch(()=>{});
}

function сетка(поля = []){
  const ряды = поля.length ? [...new Set(поля.map(([r])=>r))] : таблица.строки.map((_,r)=>r);
  const столбцы = поля.length ? [0, ...new Set(поля.map(([,c])=>c))] : таблица.шапка.map((_,c)=>c);
  const ввод = new Set(поля.map(([r,c])=>r+':'+c));
  return `<div class="обёртка"><table class="табл">
    <thead><tr>${столбцы.map(c=>`<th scope="col">${таблица.шапка[c]}</th>`).join('')}</tr></thead>
    <tbody>${ряды.map(r=>{
      const строка = таблица.строки[r];
      return `<tr>${столбцы.map(c=>{
        const ячейка = строка[c];
        if (ввод.has(r+':'+c)) return `<td><input data-r="${r}" data-c="${c}" aria-label="${строка[0]} — ${таблица.шапка[c]}" autocomplete="off" autocapitalize="none" spellcheck="false"><small class="подсказка" hidden></small></td>`;
        const файл = ЗВУК[ядрышко(ячейка)];
        const содержимое = файл ? `<button type="button" class="слушать" data-sound="${файл}">${ячейка} <span aria-hidden="true">🔊</span></button>` : ячейка;
        return c === 0 ? `<th scope="row" class="строка-имя">${содержимое}</th>` : `<td>${содержимое}</td>`;
      }).join('')}</tr>`;
    }).join('')}</tbody></table></div>`;
}

function ядрышко(т){ return т.replace(/\?$/, '').trim(); }
function норм(т){ return т.normalize('NFC').trim().toLowerCase().replace(/\s*\/\s*/g,'/').replace(/\s+/g,' '); }

function рисовать(){
  const всеПоля = группы.flatMap(г=>г.поля);
  const фрагмент = группы[этап];
  const полная = этап === группы.length;
  const память = режим === 'учить';
  const поля = режим === 'впиши' || (память && полная) ? всеПоля : память && фрагмент ? фрагмент.поля : [];
  const готово = память && этап > группы.length;
  const названиеЭтапа = полная ? 'Вся таблица по памяти' : фрагмент?.имя;
  экран.innerHTML = `<h1>${таблица.знак} ${таблица.имя}</h1>
    <p class="подзаг">${таблица.подзаголовок}</p>
    <nav class="режимы" aria-label="Режим">
      ${[['смотреть','📋 Таблица'],['учить','🧠 По памяти'],['впиши','✍️ Впиши всё']]
        .map(([ключ,имя])=>`<button type="button" data-mode="${ключ}" aria-pressed="${режим===ключ}" class="${режим===ключ?'вкл':''}">${имя}</button>`).join('')}
    </nav>
    <section class="карта">
      ${готово ? '<h2>Таблица выучена</h2><div class="низ"><button class="кн" id="повтор">Повторить</button><a class="кн тихая" href="#">Все таблицы</a></div>' :
      поля.length ? `<form id="упражнение">
        ${память ? `<p class="под">Шаг ${этап+1} из ${группы.length+1}</p><h2>${названиеЭтапа}</h2>` : ''}
        ${сетка(поля)}
        <div class="низ"><button class="кн" type="submit">Проверить</button>
          <button class="кн тихая" id="подсказки" type="button">Показать ответы</button>
          ${память ? '<button class="кн" id="дальше" type="button" hidden>Дальше →</button>' : ''}
        </div>
        <p class="итог" id="итог" role="status"></p>
      </form>` : `${сетка()}
        <div class="низ"><button class="кн" id="начать">Начать заучивание →</button></div>
        <ol class="советы">${таблица.советы.map(s=>`<li>${s}</li>`).join('')}</ol>`}
    </section>`;
  экран.querySelectorAll('[data-mode]').forEach(к=>к.onclick = ()=>перейти(к.dataset.mode));
  экран.querySelectorAll('[data-sound]').forEach(к=>к.onclick = ()=>озвучить(к.dataset.sound));
  for (const id of ['начать','повтор']) {
    const кнопка = document.getElementById(id);
    if (кнопка) кнопка.onclick = ()=>перейти('учить');
  }
  const форма = document.getElementById('упражнение');
  if (!форма) return;
  const входы = [...форма.querySelectorAll('input')];
  const дальше = document.getElementById('дальше');
  const итог = document.getElementById('итог');
  const ответ = поле=>таблица.строки[+поле.dataset.r][+поле.dataset.c];
  форма.onsubmit = событие=>{
    событие.preventDefault();
    let верных = 0;
    for (const поле of входы) {
      const верно = норм(поле.value) === норм(ответ(поле));
      поле.parentElement.classList.toggle('ок', верно);
      поле.parentElement.classList.toggle('ошибка', !верно);
      поле.setAttribute('aria-invalid', String(!верно));
      if (верно) верных++;
    }
    итог.textContent = `Верно ${верных} из ${входы.length}`;
    итог.className = 'итог ' + (верных === входы.length ? 'хорошо' : 'плохо');
    if (дальше) дальше.hidden = верных !== входы.length;
  };
  форма.oninput = событие=>{
    if (дальше) дальше.hidden = true;
    событие.target.parentElement.classList.remove('ок','ошибка');
    событие.target.removeAttribute('aria-invalid');
  };
  document.getElementById('подсказки').onclick = ()=>{
    for (const поле of входы) {
      const подсказка = поле.nextElementSibling;
      подсказка.textContent = ответ(поле);
      подсказка.hidden = !подсказка.hidden;
    }
    document.getElementById('подсказки').textContent =
      входы[0].nextElementSibling.hidden ? 'Показать ответы' : 'Скрыть ответы';
  };
  if (дальше) дальше.onclick = ()=>{
    этап++;
    рисовать();
    экран.querySelector('input, #повтор')?.focus();
  };
}

function перейти(куда){
  режим = куда;
  этап = 0;
  рисовать();
  экран.querySelector('input, [aria-pressed="true"]')?.focus();
}

window.addEventListener('hashchange', навигация);
навигация();
</script>
</body>
