ядок слов не трогает: Ich komme nicht, denn ich bin krank. weil отправляет глагол в конец: Ich komme nicht, weil ich krank bin. Смысл одинаковый. В разговоре немцы чаще говорят weil, в письме — оба. Если торопитесь и боитесь запутаться — говорите denn, это не ошибка.","ти":8,"пи":2,"подтема":"Придаточные: weil, dass, wenn — глагол в конец"},{"id":"81c4e7f9fa","тема":"Порядок слов","знак":"📐","вид":"правило","раздел":"da, so … dass, sodass","урок":"urok40","урокИмя":"Урок 41","html":"<b>da</b> — «так как»: то же, что weil, но звучит официальнее и чаще стоит <b>в начале</b> фразы. Типично для выписки.<br>\n      <b>so … dass</b> — «настолько …, что»; <b>sodass</b> — «так что» (следствие). Оба — глагол в конец.","текст":"da — «так как»: то же, что weil, но звучит официальнее и чаще стоит в начале фразы. Типично для выписки. so … dass — «настолько …, что»; sodass — «так что» (следствие). Оба — глагол в конец.","ти":8,"пи":2,"подтема":"Придаточные: weil, dass, wenn — глагол в конец"},{"id":"fa7721e41c","тема":"Разное","знак":"📎","вид":"правило","раздел":"weil — потому что","урок":"urok25","урокИмя":"Урок 26","html":"Отвечает на вопрос <b>warum?</b> (почему?). Самое частое слово этой четвёрки.<br><br>\n      И отдельно: на вопрос «почему?» можно ответить <b>одним придаточным</b>, без главного — как по-русски: <i>— Warum nehmen Sie das Medikament? — <b>Weil</b> mein Blutdruck zu hoch <b>ist</b>.</i>","текст":"Отвечает на вопрос warum? (почему?). Самое частое слово этой четвёрки. И отдельно: на вопрос «почему?» можно ответить одним придаточным, без главного — как по-русски: — Warum nehmen Sie das Medikament? — Weil mein Blutdruck zu hoch ist.","ти":8,"пи":2,"подтема":"Придаточные: weil, dass, wenn — глагол в конец"},{"id":"b2e19f5947","тема":"Разное","знак":"📎","вид":"правило","раздел":"⭐ Два предложения — одно","урок":"urok38","урокИмя":"Урок 39","html":"Три правила:<br>\n      1. Относительное слово стоит <b>сразу после</b> существительного, про которое говорим.<br>\n      2. Придаточное с двух сторон отделяется <b>запятыми</b>.<br>\n      3. <b class=\"hl\">Глагол уходит в самый конец</b> придаточного — как после dass и weil.","текст":"Три правила: 1. Относительное слово стоит сразу после существительного, про которое говорим. 2. Придаточное с двух сторон отделяется запятыми. 3. Глагол уходит в самый конец придаточного — как после dass и weil.","ти":8,"пи":2,"подтема":"Придаточные: weil, dass, wenn — глагол в конец"},{"id":"30734c21f0","тема":"Разное","знак":"📎","вид":"правило","раздел":"falls и sonst","урок":"urok40","урокИмя":"Урок 41","html":"<b>falls</b> — «если, на случай если»: почти то же, что wenn, но подчёркивает, что это может и не случиться. Для инструкций пациенту — идеально.<br>\n      <b>sonst</b> — «иначе, а то»: что будет, если не выполнить совет. Глагол сразу после sonst.","текст":"falls — «если, на случай если»: почти то же, что wenn, но подчёркивает, что это может и не случиться. Для инструкций пациенту — идеально. sonst — «иначе, а то»: что будет, если не выполнить совет. Глагол сразу после sonst.","ти":8,"пи":2,"подтема":"Придаточные: weil, dass, wenn — глагол в конец"},{"id":"4dfbba7b44","тема":"Прошедшее время","знак":"⏮","вид":"правило","раздел":"⭐ Partizip I: die blutende Wunde","урок":"urok42","урокИмя":"Урок 43","html":"<b class=\"hl\">Инфинитив + d</b>: bluten → blutend, schlafen → schlafend, steigen → steigend. Плюс окончание прилагательного: <i>die blutend<b>e</b> Wunde</i>.<br>\n      Смысл — предмет <b>сам делает</b> это <b>сейчас</b>: рана кровоточит → кровоточащая рана.","текст":"Инфинитив + d: bluten → blutend, schlafen → schlafend, steigen → steigend. Плюс окончание прилагательного: die blutende Wunde. Смысл — предмет сам делает это сейчас: рана кровоточит → кровоточащая рана.","ти":8,"пи":3,"подтема":"Союзы, которые ничего не ломают: und, aber, oder"},{"id":"142d091ba8","тема":"Приставки","знак":"🔗","вид":"правило","раздел":"⭐ Richtig oder falsch — Пако и остальные","урок":"dasha8","урокИмя":"Занятие 8 с Дашей","html":"<b>-los = «без»</b>. <i>die Arbeit</i> — работа → <b>arbeitslos</b> — безработный (дословно «безработный»). Как в русском приставка «без-»: <i>kinderlos</i> — бездетный.<br>\n      🇦🇹 Даша рассказала: в Германии и Австрии <b>студент не считается безработным</b> — учёба тоже занятость. Поэтому про Пако «arbeitslos» — неверно: <i>Paco ist Student</i>.","текст":"-los = «без». die Arbeit — работа → arbeitslos — безработный (дословно «безработный»). Как в русском приставка «без-»: kinderlos — бездетный. 🇦🇹 Даша рассказала: в Германии и Австрии студент не считается безработным — учёба тоже занятость. Поэтому про Пако «arbeitslos» — неверно: Paco ist Student.","ти":8,"пи":3,"подтема":"Союзы, которые ничего не ломают: und, aber, oder"},{"id":"0d97943f77","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"⭐ Richtig oder falsch — Пако и остальные","урок":"dasha8","урокИмя":"Занятие 8 с Дашей","html":"<b>sprechen</b> меняет гласную: <i>ich spreche — du <b>sprichst</b> — er <b>spricht</b></i>. Язык — без предлога и без артикля: <i>Er spricht Englisch</i>.","текст":"sprechen меняет гласную: ich spreche — du sprichst — er spricht. Язык — без предлога и без артикля: Er spricht Englisch.","ти":8,"пи":3,"подтема":"Союзы, которые ничего не ломают: und, aber, oder"},{"id":"aa7d29137a","тема":"Артикли и род","знак":"🎨","вид":"ловушка","раздел":"Животные: пара есть не у всех","урок":"polya8","урокИмя":"Занятие 8 Полины","html":"<span class=\"big\">У собаки женской формы нет вообще</span>\n      <b>der Hund</b> — это и пёс, и собака. Если надо уточнить, спрашивают отдельно:\n      «это он или она?». А вот у кошки пара есть, только наоборот — основное слово женское:\n      <b>die Katze</b> (кошка) и <b>der Kater</b> (кот).","текст":"У собаки женской формы нет вообще der Hund — это и пёс, и собака. Если надо уточнить, спрашивают отдельно: «это он или она?». А вот у кошки пара есть, только наоборот — основное слово женское: die Katze (кошка) и der Kater (кот).","ти":8,"пи":3,"подтема":"Союзы, которые ничего не ломают: und, aber, oder"},{"id":"0b1ce2b452","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"Пять союзов, которые ничего не ломают","урок":"urok23","урокИмя":"Урок 24","html":"<b class=\"hl\">und</b> (и), <b class=\"hl\">aber</b> (но), <b class=\"hl\">oder</b> (или), <b class=\"hl\">denn</b> (потому что, ведь), <b class=\"hl\">sondern</b> (а — после «не»). Первые буквы складываются в <b>ADUSO</b>.<br><br>\n      Главное свойство: они стоят <b>на «нулевом» месте</b> и порядок слов не трогают. После них — обычное предложение, глагол на втором месте: <i>…, <b>denn</b> ich <b>bin</b> krank</i>.","текст":"und (и), aber (но), oder (или), denn (потому что, ведь), sondern (а — после «не»). Первые буквы складываются в ADUSO. Главное свойство: они стоят на «нулевом» месте и порядок слов не трогают. После них — обычное предложение, глагол на втором месте: …, denn ich bin krank.","ти":8,"пи":3,"подтема":"Союзы, которые ничего не ломают: und, aber, oder"},{"id":"97560b9fad","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"⚠️ aber или sondern — оба «но/а»","урок":"urok23","урокИмя":"Урок 24","html":"<b class=\"hl\">aber</b> — «но», когда второе <b>добавляется</b> к первому: отёк есть, <b>но</b> не болит.<br>\n      <b class=\"hl\">sondern</b> — «а», когда второе <b>заменяет</b> первое, и перед ним обязательно отрицание (<i>nicht, kein</i>): <b>не</b> тромбоз, <b>а</b> ушиб.","текст":"aber — «но», когда второе добавляется к первому: отёк есть, но не болит. sondern — «а», когда второе заменяет первое, и перед ним обязательно отрицание (nicht, kein): не тромбоз, а ушиб.","ти":8,"пи":3,"подтема":"Союзы, которые ничего не ломают: und, aber, oder"},{"id":"e12bc04d25","тема":"Порядок слов","знак":"📐","вид":"ловушка","раздел":"Пять союзов, которые ничего не ломают","урок":"urok23","урокИмя":"Урок 24","html":"<span class=\"big\">denn и weil значат одно, а порядок слов разный</span>\n      <b>denn</b> — порядок обычный: <i>denn ich bin krank</i>. <b>weil</b> — глагол уезжает в самый конец: <i>weil ich krank bin</i>. weil — тема A2; пока говори через denn — не ошибёшься.","текст":"denn и weil значат одно, а порядок слов разный denn — порядок обычный: denn ich bin krank. weil — глагол уезжает в самый конец: weil ich krank bin. weil — тема A2; пока говори через denn — не ошибёшься.","ти":8,"пи":3,"подтема":"Союзы, которые ничего не ломают: und, aber, oder"},{"id":"dc87b18146","тема":"Порядок слов","знак":"📐","вид":"правило","раздел":"entweder … oder — либо … либо","урок":"urok41","урокИмя":"Урок 42","html":"Выбор из двух. Внутри фразы порядок слов обычный. Если <b>entweder</b> стоит <b>в самом начале</b>, глагол может встать сразу за ним: <i>Entweder <b>nehmen</b> Sie …</i> (можно и <i>Entweder Sie nehmen …</i> — оба варианта правильные).","текст":"Выбор из двух. Внутри фразы порядок слов обычный. Если entweder стоит в самом начале, глагол может встать сразу за ним: Entweder nehmen Sie … (можно и Entweder Sie nehmen … — оба варианта правильные).","ти":8,"пи":3,"подтема":"Союзы, которые ничего не ломают: und, aber, oder"},{"id":"23ecd12998","тема":"Разное","знак":"📎","вид":"правило","раздел":"zwar … aber — хотя и …, но","урок":"urok41","урокИмя":"Урок 42","html":"«Да, это так, но…». <b>zwar</b> стоит внутри первой части (после глагола), вторая часть начинается с <b>aber</b>. Мягче, чем obwohl из урока 40.","текст":"«Да, это так, но…». zwar стоит внутри первой части (после глагола), вторая часть начинается с aber. Мягче, чем obwohl из урока 40.","ти":8,"пи":3,"подтема":"Союзы, которые ничего не ломают: und, aber, oder"},{"id":"6d91990677","тема":"Разное","знак":"📎","вид":"правило","раздел":"⭐⭐ Дуплекс и Befund","урок":"urok57","урокИмя":"Урок 58","html":"Herold: дуплекс отвечает на <b>два вопроса</b>. 1) Глубокие вены проходимы? — сжимается ли вена датчиком (<i>Kompressionssonographie</i>), меняется ли кровоток с дыханием. 2) Состоятельны ли клапаны ствола? — есть ли <b>Reflux</b> при пробе Вальсальвы (<i>Valsalva-Pressversuch</i>); где он кончается — <b>distaler Insuffizienzpunkt</b>, это и есть стадия по Hach.<br>\n      Обследование варикоза — <b>стоя</b>. Старые функциональные пробы (Trendelenburg, Perthes) вытеснены дуплексом.","текст":"Herold: дуплекс отвечает на два вопроса. 1) Глубокие вены проходимы? — сжимается ли вена датчиком (Kompressionssonographie), меняется ли кровоток с дыханием. 2) Состоятельны ли клапаны ствола? — есть ли Reflux при пробе Вальсальвы (Valsalva-Pressversuch); где он кончается — distaler Insuffizienzpunkt, это и есть стадия по Hach. Обследование варикоза — стоя. Старые функциональные пробы (Trendelenburg, Perthes) вытеснены дуплексом.","ти":8,"пи":3,"подтема":"Союзы, которые ничего не ломают: und, aber, oder"},{"id":"28497b4753","тема":"Порядок слов","знак":"📐","вид":"правило","раздел":"Анкета второй женщины — Герда Никкельс","урок":"dasha10","урокИмя":"Занятие 10 с Дашей","html":"<b>geschieden</b> — разведён(а): <i>nicht mehr verheiratet</i>, «больше не женат». Три слова для семейного положения: <i>verheiratet</i> — женат/замужем, <i>ledig</i> — холост, не замужем, <i>geschieden</i> — разведён.<br>\n      <b>Familienname</b> — фамилия, <b>Familienstand</b> — семейное положение. Гриша их перепутал, Даша разобрала.","текст":"geschieden — разведён(а): nicht mehr verheiratet, «больше не женат». Три слова для семейного положения: verheiratet — женат/замужем, ledig — холост, не замужем, geschieden — разведён. Familienname — фамилия, Familienstand — семейное положение. Гриша их перепутал, Даша разобрала.","ти":8,"пи":4,"подтема":"Куда ставить nicht"},{"id":"b6f2de2791","тема":"Числа, время, даты","знак":"🔢","вид":"правило","раздел":"Числа «задом наперёд» (21–99)","урок":"dasha1","урокИмя":"Занятие 1 с Дашей","html":"<b>После сотни — снова слева направо:</b> 105 = <i>hundertfünf</i>, 128 = <i>hundert</i> + «задом наперёд» хвост <i>achtundzwanzig</i>. Сотни и тысячи по той же схеме.","текст":"После сотни — снова слева направо: 105 = hundertfünf, 128 = hundert + «задом наперёд» хвост achtundzwanzig. Сотни и тысячи по той же схеме.","ти":9,"пи":0,"подтема":"Числа: «задом наперёд»"},{"id":"7e48084406","тема":"Числа, время, даты","знак":"🔢","вид":"ловушка","раздел":"Числа «задом наперёд» (21–99)","урок":"dasha1","урокИмя":"Занятие 1 с Дашей","html":"<span class=\"big\">Главное правило: единицы ПЕРЕД десятками</span>\n      21 = «один и двадцать» → <b>einundzwanzig</b>. Союз <b>und</b> остаётся внутри слова. Всё пишется <b>одним словом</b> — до миллиона. От миллиона отдельно: <i>eine Million</i>.","текст":"Главное правило: единицы ПЕРЕД десятками 21 = «один и двадцать» → einundzwanzig. Союз und остаётся внутри слова. Всё пишется одним словом — до миллиона. От миллиона отдельно: eine Million.","ти":9,"пи":0,"подтема":"Числа: «задом наперёд»"},{"id":"dfa6ccbaab","тема":"Числа, время, даты","знак":"🔢","вид":"правило","раздел":"🏷 Как читать цены","урок":"polya12","урокИмя":"Занятие 12 Полины","html":"<b>Правило Даши.</b> Запятую в цене <span class=\"hl\">не читаем — вместо неё говорим «Euro»</span>, а слово «Cent» в конце уже не нужно.<br>\n      • <b>9,99 €</b> → neun Euro neunundneunzig<br>\n      • <b>5,60 €</b> → fünf Euro sechzig<br>\n      • <b>0,50 €</b> → fünfzig Cent — если евро нет совсем, центы называем<br><br>\n      И помним урок про числа: двузначное «задом наперёд» — 99 = neun<b>und</b>neunzig, «девять-и-девяносто».","текст":"Правило Даши. Запятую в цене не читаем — вместо неё говорим «Euro», а слово «Cent» в конце уже не нужно. • 9,99 € → neun Euro neunundneunzig • 5,60 € → fünf Euro sechzig • 0,50 € → fünfzig Cent — если евро нет совсем, центы называем И помним урок про числа: двузначное «задом наперёд» — 99 = neunundneunzig, «девять-и-девяносто».","ти":9,"пи":0,"подтема":"Числа: «задом наперёд»"},{"id":"47fd05cffa","тема":"Числа, время, даты","знак":"🔢","вид":"правило","раздел":"Zahlen 0–20 — числа","урок":"urok2","урокИмя":"Урок 3","html":"<b>0–12</b> — отдельные слова, их учат наизусть. <b>13–19</b> собираются, как по-русски «три-надцать»: сначала единицы, потом <i>zehn</i> (десять): <i>drei + zehn = dreizehn</i>. <b>20</b> — <i>zwanzig</i>.<br><br>\n      Пригодятся сразу: возраст, номер телефона, кабинет, время приёма.","текст":"0–12 — отдельные слова, их учат наизусть. 13–19 собираются, как по-русски «три-надцать»: сначала единицы, потом zehn (десять): drei + zehn = dreizehn. 20 — zwanzig. Пригодятся сразу: возраст, номер телефона, кабинет, время приёма.","ти":9,"пи":0,"подтема":"Числа: «задом наперёд»"},{"id":"16f272f452","тема":"Числа, время, даты","знак":"🔢","вид":"правило","раздел":"Десятки: 20–100","урок":"urok5","урокИмя":"Урок 6","html":"Почти все на <b class=\"hl\">-zig</b>. Три исключения в написании: <b>dreißig</b> (30, через -ßig), <b>sechzig</b> (60, без -s), <b>siebzig</b> (70, без -en).","текст":"Почти все на -zig. Три исключения в написании: dreißig (30, через -ßig), sechzig (60, без -s), siebzig (70, без -en).","ти":9,"пи":0,"подтема":"Числа: «задом наперёд»"},{"id":"6c44460fca","тема":"Числа, время, даты","знак":"🔢","вид":"правило","раздел":"Сотни, тысячи, год","урок":"urok5","урокИмя":"Урок 6","html":"Годы до 2000 читают <b class=\"hl\">сотнями</b>: 1980 — не «тысяча девятьсот», а «девятнадцать сотен восемьдесят» — <b>neunzehnhundertachtzig</b>. С 2000 — обычным числом: <i>zweitausendsechsundzwanzig</i>.","текст":"Годы до 2000 читают сотнями: 1980 — не «тысяча девятьсот», а «девятнадцать сотен восемьдесят» — neunzehnhundertachtzig. С 2000 — обычным числом: zweitausendsechsundzwanzig.","ти":9,"пи":0,"подтема":"Числа: «задом наперёд»"},{"id":"4e5512bd96","тема":"Числа, время, даты","знак":"🔢","вид":"правило","раздел":"Числа и проценты вслух","урок":"urok56","урокИмя":"Урок 57","html":"Десятичная запятая — <b>Komma</b>, не «Punkt»: <i>0,1 %</i> — <i>null Komma eins Prozent</i>. Большие числа — одним словом: <i>20 536</i> — <i>zwanzigtausendfünfhundertsechsunddreißig</i>. Годы до 2000 — сотнями (<i>neunzehnhundertneunundneunzig</i>), после — тысячами (<i>zweitausendneun</i>). <i>p &lt; 0,05</i> — <i>p kleiner als null Komma null fünf</i>.","текст":"Десятичная запятая — Komma, не «Punkt»: 0,1 % — null Komma eins Prozent. Большие числа — одним словом: 20 536 — zwanzigtausendfünfhundertsechsunddreißig. Годы до 2000 — сотнями (neunzehnhundertneunundneunzig), после — тысячами (zweitausendneun). p &lt; 0,05 — p kleiner als null Komma null fünf.","ти":9,"пи":0,"подтема":"Числа: «задом наперёд»"},{"id":"43c43a561f","тема":"Артикли и род","знак":"🎨","вид":"ловушка","раздел":"🏷 Как читать цены","урок":"polya12","урокИмя":"Занятие 12 Полины","html":"<span class=\"big\">Ошибка с занятия</span>\n      Полина сказала: <s>Es ist billig für den Bett.</s> Даша поправила: <b>für ein Bett</b>. Две причины: кровать — <b>das Bett</b>, средний род, поэтому «den» не подходит вообще; и речь о кровати вообще, «для кровати такая цена — дёшево», — поэтому неопределённый артикль <b>ein</b>.","текст":"Ошибка с занятия Полина сказала: Es ist billig für den Bett. Даша поправила: für ein Bett. Две причины: кровать — das Bett, средний род, поэтому «den» не подходит вообще; и речь о кровати вообще, «для кровати такая цена — дёшево», — поэтому неопределённый артикль ein.","ти":9,"пи":0,"подтема":"Числа: «задом наперёд»"},{"id":"67b328ce9b","тема":"Разное","знак":"📎","вид":"правило","раздел":"Номер телефона","урок":"urok2","урокИмя":"Урок 3","html":"Номер диктуют <b>по одной цифре</b> или парами (парами — это числа больше двадцати, они будут в уроке 5). Мобильный — <b>das Handy</b> [хэнди], номера начинаются с <i>015…, 016…, 017…</i>.<br><br>\n      Не расслышал — не стесняйся переспросить: <i>Noch einmal, bitte</i> или <i>Langsamer, bitte</i>. Немцы сами диктуют номер медленно и повторяют.","текст":"Номер диктуют по одной цифре или парами (парами — это числа больше двадцати, они будут в уроке 5). Мобильный — das Handy [хэнди], номера начинаются с 015…, 016…, 017…. Не расслышал — не стесняйся переспросить: Noch einmal, bitte или Langsamer, bitte. Немцы сами диктуют номер медленно и повторяют.","ти":9,"пи":0,"подтема":"Числа: «задом наперёд»"},{"id":"b1f78457ac","тема":"Разное","знак":"📎","вид":"правило","раздел":"Числа в работе врача","урок":"urok5","урокИмя":"Урок 6","html":"Давление читают через <b>zu</b>: <i>hundertzwanzig zu achtzig</i> — «120 на 80». Рост — в метрах: <i>eins achtzig</i> (1,80).","текст":"Давление читают через zu: hundertzwanzig zu achtzig — «120 на 80». Рост — в метрах: eins achtzig (1,80).","ти":9,"пи":0,"подтема":"Числа: «задом наперёд»"},{"id":"1c9656c003","тема":"Числа, время, даты","знак":"🔢","вид":"правило","раздел":"«С … по …» и год","урок":"urok6","урокИмя":"Урок 7","html":"«С первого по десятое» — <b>vom</b> … <b>bis zum</b> …: <i>vom ersten bis zum zehnten Juli</i>.<br><br>\n      <b class=\"hl\">Год — без предлога:</b> не «in 1980», а просто <i>Ich bin 1980 geboren</i>. Годы до 2000 читают сотнями: <i>neunzehnhundertachtzig</i>.","текст":"«С первого по десятое» — vom … bis zum …: vom ersten bis zum zehnten Juli. Год — без предлога: не «in 1980», а просто Ich bin 1980 geboren. Годы до 2000 читают сотнями: neunzehnhundertachtzig.","ти":9,"пи":1,"подтема":"Порядковые и даты"},{"id":"3857984805","тема":"Разное","знак":"📎","вид":"ловушка","раздел":"Переезд и регистрация","урок":"urok15","урокИмя":"Урок 16","html":"<span class=\"big\">Anmeldung — обязательно, в течение двух недель</span>\n      После въезда нужно зарегистрироваться по месту жительства в <b>Bürgeramt</b> (районная служба). Хозяин квартиры даёт для этого бумагу — <b>Wohnungsgeberbestätigung</b>. После первой регистрации по почте приходит налоговый номер (<i>Steuer-ID</i>), а его спросит работодатель — то есть клиника.","текст":"Anmeldung — обязательно, в течение двух недель После въезда нужно зарегистрироваться по месту жительства в Bürgeramt (районная служба). Хозяин квартиры даёт для этого бумагу — Wohnungsgeberbestätigung. После первой регистрации по почте приходит налоговый номер (Steuer-ID), а его спросит работодатель — то есть клиника.","ти":9,"пи":1,"подтема":"Порядковые и даты"},{"id":"b388e06b63","тема":"Разное","знак":"📎","вид":"правило","раздел":"⭐⭐ Передать пациента врачу скорой","урок":"urok58","урокИмя":"Урок 59","html":"Схема <b>ISBAR</b>, принятая в немецкоязычных клиниках: <b>I</b>dentifikation (кто), <b>S</b>ituation (что случилось), <b>B</b>ackground (предыстория, болезни, аллергии), <b>A</b>ssessment (состояние сейчас), <b>R</b>ecommendation (что дальше). Коротко, по порядку, с цифрами.","текст":"Схема ISBAR, принятая в немецкоязычных клиниках: Identifikation (кто), Situation (что случилось), Background (предыстория, болезни, аллергии), Assessment (состояние сейчас), Recommendation (что дальше). Коротко, по порядку, с цифрами.","ти":9,"пи":1,"подтема":"Порядковые и даты"},{"id":"dfefb12b4b","тема":"Модальные глаголы","знак":"🔑","вид":"правило","раздел":"⭐⭐ Фразы для каждой части","урок":"urok56","урокИмя":"Урок 57","html":"<b>Заметьте:</b> <i>Ich möchte Ihnen … <b>vorstellen</b></i> — «представить», а не <i>zeigen</i>. <i>Wie Sie wissen</i> — вежливо опереться на знания зала. <i>Es zeigte sich, dass …</i> и <i>Zusammenfassend kann man feststellen, dass …</i> — после <i>dass</i> глагол в конец.","текст":"Заметьте: Ich möchte Ihnen … vorstellen — «представить», а не zeigen. Wie Sie wissen — вежливо опереться на знания зала. Es zeigte sich, dass … и Zusammenfassend kann man feststellen, dass … — после dass глагол в конец.","ти":9,"пи":2,"подтема":"Который час"},{"id":"37898818d4","тема":"Глагол: спряжение","знак":"🔤","вид":"ловушка","раздел":"Частые ошибки","урок":"urok44","урокИмя":"Урок 45","html":"<span class=\"big\">⚠️ Er soll krank sein</span><br>\n      Это <b>не</b> «он должен быть больным», а «<b>говорят</b>, он болен». Если на обходе коллега говорит <i>Die Patientin soll gestern gestürzt sein</i> — это сведения с чужих слов, их надо уточнить.","текст":"⚠️ Er soll krank sein Это не «он должен быть больным», а «говорят, он болен». Если на обходе коллега говорит Die Patientin soll gestern gestürzt sein — это сведения с чужих слов, их надо уточнить.","ти":9,"пи":2,"подтема":"Который час"},{"id":"9745de875e","тема":"Числа, время, даты","знак":"🔢","вид":"правило","раздел":"🎓 Разговор про экзамен и план","урок":"polya14","урокИмя":"Занятие 14 Полины","html":"<b>Сдавать четыре части в один день или в разные?</b> Даша: в один день. «Я не вижу смысла растягивать удовольствие». Полина добавила: кататься туда-сюда через пол-Москвы тоже нет смысла. Перерыв между частями, как поняла Полина, небольшой. К Sprechen и Schreiben готовимся параллельно.<br><br>\n      <b>Что сложнее всего.</b> Чаще всего у всех — <b>Hören</b> (слушание) и <b>Sprechen</b> (говорение). К речи на слух надо привыкать: Даша вспомнила, как на первой лекции в университете почти не понимала профессора, а через несколько лекций — уже 99%. «Чем больше слушаете, тем легче». Полина рассказала: песенку про овощи она поначалу вообще не разобрала — там «rot» и «grün» звучат иначе, чем в учебнике. Даша: «нормально, привыкают все».<br><br>\n      <b>Как это на A2.</b> В Hören нужно <b>отмечать</b> ответы, а не писать. <b>Schreiben</b> — письмо на <b>20–30 слов</b> («начало и конец — уже 10 слов, в серединке два-три предложения»); на B1 письмо побольше, на B2 — эссе. Даша: «самое сложное там — понять задание». <b>Sprechen</b>: 15 минут, сидят комиссия и партнёр (такой же сдающий, как ты); минуты на болтовню комиссии вычитаются, и на тебя остаётся 5–7 минут. Если не понял партнёра — «можете повторить? скажите по-другому?» — это разрешено.<br><br>\n      <b>План Полины.</b> Полина посчитала: A2 — в 2027 году, а <b>в марте 2028 подавать документы</b> на профессиональный экзамен для врачей (слово на записи смазано), значит <b>C1 нужен где-то в декабре 2027 — январе 2028</b> («прям край»). Даша: «C1 сдать — не значит иметь уровень C1. Экзамен — это наработка на экзамен». Знакомые Даши, только начавшие учить B2, сдали C1 на «четвёрку» — это сдача. «Единица — самая лучшая оценка в Германии и в Австрии».<br><br>\n      <b>Сколько ещё учиться.</b> У Даши на A1 — <b>22 лекции</b>, сегодня они на <b>восьмой</b>: осталось около 14. Закончат A1 примерно <b>до ноября</b>. A2 займёт <b>3–4 месяца</b>, но готовиться к экзамену можно параллельно. Даша сознательно вводит темы раньше, чем в методичках: <b>Genitiv</b> — вместе с Akkusativ и Dativ, «зачем его выкидывать, когда он есть в тексте», и <b>союзы</b> — сразу, «чем больше союзов понимаешь, тем больше понимаешь предложение».","текст":"Сдавать четыре части в один день или в разные? Даша: в один день. «Я не вижу смысла растягивать удовольствие». Полина добавила: кататься туда-сюда через пол-Москвы тоже нет смысла. Перерыв между частями, как поняла Полина, небольшой. К Sprechen и Schreiben готовимся параллельно. Что сложнее всего. Чаще всего у всех — Hören (слушание) и Sprechen (говорение). К речи на слух надо привыкать: Даша вспомнила, как на первой лекции в университете почти не понимала профессора, а через несколько лекций — уже 99%. «Чем больше слушаете, тем легче». Полина рассказала: песенку про овощи она поначалу вообще не разобрала — там «rot» и «grün» звучат иначе, чем в учебнике. Даша: «нормально, привыкают все». Как это на A2. В Hören нужно отмечать ответы, а не писать. Schreiben — письмо на 20–30 слов («начало и конец — уже 10 слов, в серединке два-три предложения»); на B1 письмо побольше, на B2 — эссе. Даша: «самое сложное там — понять задание». Sprechen: 15 минут, сидят комиссия и партнёр (такой же сдающий, как ты); минуты на болтовню комиссии вычитаются, и на тебя остаётся 5–7 минут. Если не понял партнёра — «можете повторить? скажите по-другому?» — это разрешено. План Полины. Полина посчитала: A2 — в 2027 году, а в марте 2028 подавать документы на профессиональный экзамен для врачей (слово на записи смазано), значит C1 нужен где-то в декабре 2027 — январе 2028 («прям край»). Даша: «C1 сдать — не значит иметь уровень C1. Экзамен — это наработка на экзамен». Знакомые Даши, только начавшие учить B2, сдали C1 на «четвёрку» — это сдача. «Единица — самая лучшая оценка в Германии и в Австрии». Сколько ещё учиться. У Даши на A1 — 22 лекции, сегодня они на восьмой: осталось около 14. Закончат A1 примерно до ноября. A2 займёт 3–4 месяца, но готовиться к экзамену можно параллельно. Даша сознательно вводит темы раньше, чем в методичках: Genitiv — вместе с Akkusativ и Dativ, «зачем его выкидывать, когда он есть в тексте», и союзы — сразу, «чем больше союзов понимаешь, тем больше понимаешь предложение».","ти":9,"пи":2,"подтема":"Который час"},{"id":"e5bb599f84","тема":"Числа, время, даты","знак":"🔢","вид":"правило","раздел":"«Который час?» и полные часы","урок":"urok10","урокИмя":"Урок 11","html":"Спросить время: <b class=\"hl\">Wie spät ist es?</b> или <b>Wie viel Uhr ist es?</b> Ответ: <b>Es ist … Uhr</b> (сейчас … часов). Слово <b>Uhr</b> = «часов», не забывай его — и оно не бывает во множественном.","текст":"Спросить время: Wie spät ist es? или Wie viel Uhr ist es? Ответ: Es ist … Uhr (сейчас … часов). Слово Uhr = «часов», не забывай его — и оно не бывает во множественном.","ти":9,"пи":2,"подтема":"Который час"},{"id":"864da84589","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"Части суток","урок":"urok10","урокИмя":"Урок 11","html":"Все мужского рода, кроме <b>die Nacht</b>. <b class=\"hl\">Ловушка:</b> <i>morgen</i> — завтра, а <i>der Morgen</i> — утро. Поэтому «завтра утром» — не «morgen Morgen», а <b>morgen früh</b>.","текст":"Все мужского рода, кроме die Nacht. Ловушка: morgen — завтра, а der Morgen — утро. Поэтому «завтра утром» — не «morgen Morgen», а morgen früh.","ти":9,"пи":2,"подтема":"Который час"},{"id":"76b12c4684","тема":"Устойчивые выражения","знак":"🔗","вид":"правило","раздел":"Наречия частотности","урок":"dasha1","урокИмя":"Занятие 1 с Дашей","html":"<b>Устойчивые выражения:</b> <b class=\"hl\">ab und zu</b> и <b class=\"hl\">hin und wieder</b> — оба «время от времени, порой».<br>\n      <b>Кратность:</b> <i>Mal</i> = раз → <b>einmal / zweimal / dreimal pro Woche</b> (раз/два/три раза в неделю).","текст":"Устойчивые выражения: ab und zu и hin und wieder — оба «время от времени, порой». Кратность: Mal = раз → einmal / zweimal / dreimal pro Woche (раз/два/три раза в неделю).","ти":9,"пи":2,"подтема":"Который час"},{"id":"57f7bcf43e","тема":"Разное","знак":"📎","вид":"правило","раздел":"⭐ Наречия времени — как часто что-то происходит","урок":"polya7","урокИмя":"Занятие 7 Полины","html":"Я расставил их <b>по убыванию частоты</b> — от «всегда» до «никогда». Так их запоминать проще, чем вразнобой: получается шкала.","текст":"Я расставил их по убыванию частоты — от «всегда» до «никогда». Так их запоминать проще, чем вразнобой: получается шкала.","ти":9,"пи":2,"подтема":"Который час"},{"id":"d42818c9ef","тема":"Разное","знак":"📎","вид":"правило","раздел":"⭐ Наречия времени — как часто что-то происходит","урок":"polya7","урокИмя":"Занятие 7 Полины","html":"<b>Куда ставить наречие в предложении?</b> Проще всего — <b class=\"hl\">сразу после глагола</b>:<br>\n      <i>Ich lerne <b>immer</b> am Abend</i> · <i>Ich gehe <b>manchmal</b> ins Kino</i> · <i>Er kommt <b>selten</b> zu spät</i>.<br><br>\n      Можно и в начало предложения, но тогда глагол по-прежнему остаётся на втором месте: <i><b>Manchmal</b> gehe ich ins Kino</i> — обрати внимание, <i>ich</i> и <i>gehe</i> поменялись местами.","текст":"Куда ставить наречие в предложении? Проще всего — сразу после глагола: Ich lerne immer am Abend · Ich gehe manchmal ins Kino · Er kommt selten zu spät. Можно и в начало предложения, но тогда глагол по-прежнему остаётся на втором месте: Manchmal gehe ich ins Kino — обрати внимание, ich и gehe поменялись местами.","ти":9,"пи":2,"подтема":"Который час"},{"id":"dc3fc6e8c1","тема":"Разное","знак":"📎","вид":"правило","раздел":"«-schmerzen»: боль в каждой части тела","урок":"urok4","урокИмя":"Урок 5","html":"Часть тела + <i>Schmerzen</i> = одно длинное слово. Выучил 6 частей тела — получил 6 жалоб. Для флеболога пригодится ещё одно: <b>Beinschmerzen</b> — боли в ногах.","текст":"Часть тела + Schmerzen = одно длинное слово. Выучил 6 частей тела — получил 6 жалоб. Для флеболога пригодится ещё одно: Beinschmerzen — боли в ногах.","ти":9,"пи":2,"подтема":"Который час"},{"id":"ee005d9b24","тема":"Разное","знак":"📎","вид":"правило","раздел":"⭐ Схема анамнеза: 8 частей","урок":"urok47","урокИмя":"Урок 48","html":"Порядок, которого ждут на экзамене и в немецкой клинике. Выучите названия частей — они же потом станут заголовками в выписке (Arztbrief).","текст":"Порядок, которого ждут на экзамене и в немецкой клинике. Выучите названия частей — они же потом станут заголовками в выписке (Arztbrief).","ти":9,"пи":2,"подтема":"Который час"},{"id":"550b5c84a1","тема":"Разное","знак":"📎","вид":"правило","раздел":"⭐ Пять частей беседы","урок":"urok51","урокИмя":"Урок 52","html":"В конце — <b>решение</b>: рекомендация врача, но выбор за пациентом, время подумать, бланк, подпись.","текст":"В конце — решение: рекомендация врача, но выбор за пациентом, время подумать, бланк, подпись.","ти":9,"пи":2,"подтема":"Который час"},{"id":"0045b88850","тема":"Числа, время, даты","знак":"🔢","вид":"правило","раздел":"Времена года (die Jahreszeiten)","урок":"urok6","урокИмя":"Урок 7","html":"Все четыре — мужского рода: <b>der</b> Frühling, <b>der</b> Sommer, <b>der</b> Herbst, <b>der</b> Winter. «Летом, зимой» — <b>im</b> + сезон: <i>im Sommer</i>.","текст":"Все четыре — мужского рода: der Frühling, der Sommer, der Herbst, der Winter. «Летом, зимой» — im + сезон: im Sommer.","ти":9,"пи":3,"подтема":"Дни, месяцы, времена года"},{"id":"3349b16c87","тема":"Числа, время, даты","знак":"🔢","вид":"правило","раздел":"Месяцы (die Monate)","урок":"urok6","урокИмя":"Урок 7","html":"Почти как в русском — узнаёшь сразу. Все мужского рода (<b>der</b>). Внимание на <b>März</b> — с умляутом.<br><br>\n      <b class=\"hl\">Juni и Juli</b> на слух легко спутать. По телефону немцы для ясности говорят <i>Juno</i> и <i>Julei</i> — как <i>zwo</i> вместо <i>zwei</i>.","текст":"Почти как в русском — узнаёшь сразу. Все мужского рода (der). Внимание на März — с умляутом. Juni и Juli на слух легко спутать. По телефону немцы для ясности говорят Juno и Julei — как zwo вместо zwei.","ти":9,"пи":3,"подтема":"Дни, месяцы, времена года"},{"id":"e15cc887d7","тема":"Приставки","знак":"🔗","вид":"правило","раздел":"🖼 Описание картинки","урок":"dasha5","урокИмя":"Занятие 5 с Дашей","html":"<b>ankreuzen</b> — отдельная приставка «an» отрывается и уходит в конец предложения\n      (это называется отделяемая приставка, ещё встретите не раз). В словаре глагол стоит\n      целиком: <b>ankreuzen</b> — отмечать крестиком.","текст":"ankreuzen — отдельная приставка «an» отрывается и уходит в конец предложения (это называется отделяемая приставка, ещё встретите не раз). В словаре глагол стоит целиком: ankreuzen — отмечать крестиком.","ти":10,"пи":0,"подтема":"Отделяемые приставки: улетают в конец"},{"id":"94624d6584","тема":"Приставки","знак":"🔗","вид":"ловушка","раздел":"🖼 Описание картинки","урок":"dasha5","урокИмя":"Занятие 5 с Дашей","html":"<span class=\"big\">im Vordergrund vs im Hintergrund</span>\n      <b>vor</b> — «перед», <b>hinter</b> — «за». Разница только в приставке:<br>\n      <b>im Vordergrund</b> — на переднем плане (то, что ближе).<br>\n      <b>im Hintergrund</b> — на заднем плане (то, что дальше).","текст":"im Vordergrund vs im Hintergrund vor — «перед», hinter — «за». Разница только в приставке: im Vordergrund — на переднем плане (то, что ближе). im Hintergrund — на заднем плане (то, что дальше).","ти":10,"пи":0,"подтема":"Отделяемые приставки: улетают в конец"},{"id":"b2ca834018","тема":"Приставки","знак":"🔗","вид":"ловушка","раздел":"🖼 Описание картинки","урок":"polya10","урокИмя":"Занятие 10 Полины","html":"<span class=\"big\">На переднем плане vs на заднем плане</span>\n      <b>im Vordergrund</b> — на переднем плане (то, что ближе всего к нам).<br>\n      <b>im Hintergrund</b> — на заднем плане (то, что дальше).<br><br>\n      Разница только в приставке: <b>vor</b> (перед) и <b>hinter</b> (за).","текст":"На переднем плане vs на заднем плане im Vordergrund — на переднем плане (то, что ближе всего к нам). im Hintergrund — на заднем плане (то, что дальше). Разница только в приставке: vor (перед) и hinter (за).","ти":10,"пи":0,"подтема":"Отделяемые приставки: улетают в конец"},{"id":"26b9714161","тема":"Приставки","знак":"🔗","вид":"правило","раздел":"Стакан, чашка и «находиться»","урок":"polya11","урокИмя":"Занятие 11 Полины","html":"<b>sich befinden</b> — «находиться», красивый вариант вместо простого <b>ist</b>. Это возвратный глагол — к нему вернёмся отдельной темой. Полина спросила, почему в словаре <i>sich befinden</i>, а в предложении <i>sie befindet sich</i>. Так же, как с отделяемой приставкой: в словаре <i>aufstehen</i>, а в предложении <i>er steht … auf</i>. <b>sich</b> в предложении встаёт после глагола.","текст":"sich befinden — «находиться», красивый вариант вместо простого ist. Это возвратный глагол — к нему вернёмся отдельной темой. Полина спросила, почему в словаре sich befinden, а в предложении sie befindet sich. Так же, как с отделяемой приставкой: в словаре aufstehen, а в предложении er steht … auf. sich в предложении встаёт после глагола.","ти":10,"пи":0,"подтема":"Отделяемые приставки: улетают в конец"},{"id":"123e3dd090","тема":"Приставки","знак":"🔗","вид":"правило","раздел":"🧩 Отступление про приставки","урок":"polya15","урокИмя":"Занятие 15 Полины","html":"Слово <b>verspielt</b> («игривый») в тексте запутало: Полина знает <i>spielen</i> — «играть», а с приставкой <i>ver-</i> получилось прилагательное. Даша согласилась, что это одна из самых сложных тем: приставка иногда меняет смысл глагола совсем, а иногда почти не меняет. Её примеры: <i>sehen</i> и <i>ansehen</i> — оба про «смотреть», <i>bieten</i> и <i>anbieten</i> — оба про «предлагать». Пока просто учить слова целиком, не пытаясь угадать по корню.","текст":"Слово verspielt («игривый») в тексте запутало: Полина знает spielen — «играть», а с приставкой ver- получилось прилагательное. Даша согласилась, что это одна из самых сложных тем: приставка иногда меняет смысл глагола совсем, а иногда почти не меняет. Её примеры: sehen и ansehen — оба про «смотреть», bieten и anbieten — оба про «предлагать». Пока просто учить слова целиком, не пытаясь угадать по корню.","ти":10,"пи":0,"подтема":"Отделяемые приставки: улетают в конец"},{"id":"62c4c77e4e","тема":"Приставки","знак":"🔗","вид":"правило","раздел":"Описание картинки — новый навык","урок":"polya6","урокИмя":"Занятие 6 Полины","html":"Даша дала два выражения и велела записать: их используют всегда, когда описывают картинку.<br><br>\n      Плюс важная мелочь: <b class=\"hl\">auf dem Bild</b> — «на картинке», всегда так (не <i>in der Bild</i>). И глагол <b class=\"hl\">ansehen</b> — смотреть <b>на</b> что-то: приставка <i>an-</i> даёт направленность.","текст":"Даша дала два выражения и велела записать: их используют всегда, когда описывают картинку. Плюс важная мелочь: auf dem Bild — «на картинке», всегда так (не in der Bild). И глагол ansehen — смотреть на что-то: приставка an- даёт направленность.","ти":10,"пи":0,"подтема":"Отделяемые приставки: улетают в конец"},{"id":"34826060e2","тема":"Общение и обращение","знак":"💬","вид":"правило","раздел":"С чего начали: как отвечать на «как дела»","урок":"dasha3","урокИмя":"Занятие 3 с Дашей","html":"Тут есть одна логика, которую стоит понять сразу, и дальше она будет работать всегда.<br><br>\n      Когда тебя спрашивают <b>Wie geht es <span class=\"hl\">dir</span>?</b> — это буквально «как оно идёт <b>тебе</b>?». Не «как ты», а «как <b>тебе</b> идётся». Поэтому и отвечаешь ты не «я хорошо», а <b>Mir geht es gut</b> — «<b>мне</b> идётся хорошо».<br><br>\n      То есть в вопросе <b class=\"hl\">dir</b> (тебе) → в ответе <b class=\"hl\">mir</b> (мне). Вежливо спросят <b>Ihnen</b> (Вам) — отвечаешь всё равно <b>mir</b>, потому что говоришь про себя.","текст":"Тут есть одна логика, которую стоит понять сразу, и дальше она будет работать всегда. Когда тебя спрашивают Wie geht es dir? — это буквально «как оно идёт тебе?». Не «как ты», а «как тебе идётся». Поэтому и отвечаешь ты не «я хорошо», а Mir geht es gut — «мне идётся хорошо». То есть в вопросе dir (тебе) → в ответе mir (мне). Вежливо спросят Ihnen (Вам) — отвечаешь всё равно mir, потому что говоришь про себя.","ти":11,"пи":0,"подтема":"Приветствие и прощание"},{"id":"67cbee2fa0","тема":"Общение и обращение","знак":"💬","вид":"правило","раздел":"Herr и Frau — обращение","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"В немецком к человеку обращаются как в английском — «мистер» и «миссис»:<br>\n      <b>Herr</b> + фамилия = господин, <b>Frau</b> + фамилия = госпожа.<br><br>\n      Так обращаются <b>и к молодым, и к пожилым</b> — везде, где обстановка формальная:\n      университет, госучреждение, врач. Даша говорит, ей самой всегда говорят «Frau Jablokowa».","текст":"В немецком к человеку обращаются как в английском — «мистер» и «миссис»: Herr + фамилия = господин, Frau + фамилия = госпожа. Так обращаются и к молодым, и к пожилым — везде, где обстановка формальная: университет, госучреждение, врач. Даша говорит, ей самой всегда говорят «Frau Jablokowa».","ти":11,"пи":0,"подтема":"Приветствие и прощание"},{"id":"f0b4665ff9","тема":"Общение и обращение","знак":"💬","вид":"ловушка","раздел":"Herr и Frau — обращение","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"<span class=\"big\">У Frau три значения сразу</span>\n      <b>die Frau</b> — это и «госпожа», и «женщина», и «жена». Одно слово на всё.\n      А вот у мужчин для каждого случая своё отдельное слово.","текст":"У Frau три значения сразу die Frau — это и «госпожа», и «женщина», и «жена». Одно слово на всё. А вот у мужчин для каждого случая своё отдельное слово.","ти":11,"пи":0,"подтема":"Приветствие и прощание"},{"id":"ff4763f945","тема":"Общение и обращение","знак":"💬","вид":"правило","раздел":"Приветствия по времени суток","урок":"urok1","урокИмя":"Урок 2","html":"<b>Guten Morgen</b> — примерно до 10–11 утра. <b>Guten Tag</b> — днём; это самое нейтральное вежливое «здравствуйте», им не ошибёшься нигде. <b>Guten Abend</b> — примерно с шести вечера. <b>Hallo</b> — со знакомыми и в быту; коллегам тоже можно.<br><br>\n      Коллеги утром часто говорят просто <b>Morgen!</b> — это сокращённое «Guten Morgen».<br><br>\n      <b class=\"hl\">Ловушка:</b> <b>Gute Nacht</b> — это НЕ приветствие. Так говорят только на прощание, поздно вечером или перед сном. Пришёл вечером — <i>Guten Abend</i>.","текст":"Guten Morgen — примерно до 10–11 утра. Guten Tag — днём; это самое нейтральное вежливое «здравствуйте», им не ошибёшься нигде. Guten Abend — примерно с шести вечера. Hallo — со знакомыми и в быту; коллегам тоже можно. Коллеги утром часто говорят просто Morgen! — это сокращённое «Guten Morgen». Ловушка: Gute Nacht — это НЕ приветствие. Так говорят только на прощание, поздно вечером или перед сном. Пришёл вечером — Guten Abend.","ти":11,"пи":0,"подтема":"Приветствие и прощание"},{"id":"211ec504bb","тема":"Общение и обращение","знак":"💬","вид":"правило","раздел":"Как здороваются в разных регионах","урок":"urok1","урокИмя":"Урок 2","html":"Немецкий звучит в трёх странах, и здороваются там по-разному. <b>Guten Tag</b> понимают везде — это безопасный вариант. Но местные приветствия надо узнавать на слух.","текст":"Немецкий звучит в трёх странах, и здороваются там по-разному. Guten Tag понимают везде — это безопасный вариант. Но местные приветствия надо узнавать на слух.","ти":11,"пи":0,"подтема":"Приветствие и прощание"},{"id":"9af8b9a483","тема":"Общение и обращение","знак":"💬","вид":"правило","раздел":"Как попрощаться","урок":"urok1","урокИмя":"Урок 2","html":"<b>Tschüss</b> — по-свойски, <b>Auf Wiedersehen</b> — вежливо. Но в живой речи чаще звучит «до…» — <b>bis</b> плюс когда увидимся: <i>bis gleich</i> — через минуты, <i>bis später</i> — ещё сегодня, <i>bis morgen</i> — завтра, <i>bis bald</i> — скоро, но неизвестно когда.<br><br>\n      <b class=\"hl\">По телефону</b> говорят не «Auf Wiedersehen» (до свидания — «до увидения»), а <b>Auf Wiederhören</b> — «до услышания».","текст":"Tschüss — по-свойски, Auf Wiedersehen — вежливо. Но в живой речи чаще звучит «до…» — bis плюс когда увидимся: bis gleich — через минуты, bis später — ещё сегодня, bis morgen — завтра, bis bald — скоро, но неизвестно когда. По телефону говорят не «Auf Wiedersehen» (до свидания — «до увидения»), а Auf Wiederhören — «до услышания».","ти":11,"пи":0,"подтема":"Приветствие и прощание"},{"id":"f3ccc61527","тема":"Общение и обращение","знак":"💬","вид":"правило","раздел":"«Как дела?» — и что отвечать","урок":"urok1","урокИмя":"Урок 2","html":"<b>Wie geht es Ihnen?</b> — вежливо (на Вы). <b>Wie geht's?</b> — по-свойски (на ты). Дословно — «как идёт?», поэтому ответ <i>Es geht</i> («идёт») значит «так себе».<br><br>\n      Ответили — верните вопрос: <b>Und Ihnen?</b> (А у Вас?) или <b>Und dir?</b> (А у тебя?). Без этого звучит невежливо.<br><br>\n      В Германии на этот вопрос нередко отвечают по правде. Это не пустой ритуал, как американское <i>How are you</i>.","текст":"Wie geht es Ihnen? — вежливо (на Вы). Wie geht's? — по-свойски (на ты). Дословно — «как идёт?», поэтому ответ Es geht («идёт») значит «так себе». Ответили — верните вопрос: Und Ihnen? (А у Вас?) или Und dir? (А у тебя?). Без этого звучит невежливо. В Германии на этот вопрос нередко отвечают по правде. Это не пустой ритуал, как американское How are you.","ти":11,"пи":0,"подтема":"Приветствие и прощание"},{"id":"77e1515d6c","тема":"Общение и обращение","знак":"💬","вид":"правило","раздел":"«Ты» и «Вы»: du или Sie?","урок":"urok1","урокИмя":"Урок 2","html":"<b>Sie</b> (всегда с большой буквы) — вежливо: незнакомые взрослые, пациенты, начальство, магазин, любое учреждение.<br>\n      <b>du</b> — по-свойски: друзья, семья, дети. Часто — коллеги одного уровня.<br><br>\n      <b>Кто предлагает перейти на «ты»?</b> Старший — по возрасту или по должности. Сами не начинайте: подождите, пока предложат.<br><br>\n      <b>Хорошая новость:</b> с <i>Sie</i> глагол стоит в словарной форме — <i>Sie heißen, Sie kommen, Sie wohnen</i>. Выучил слово — уже можешь вежливо спросить.","текст":"Sie (всегда с большой буквы) — вежливо: незнакомые взрослые, пациенты, начальство, магазин, любое учреждение. du — по-свойски: друзья, семья, дети. Часто — коллеги одного уровня. Кто предлагает перейти на «ты»? Старший — по возрасту или по должности. Сами не начинайте: подождите, пока предложат. Хорошая новость: с Sie глагол стоит в словарной форме — Sie heißen, Sie kommen, Sie wohnen. Выучил слово — уже можешь вежливо спросить.","ти":11,"пи":1,"подтема":"du или Sie"},{"id":"40b0ef4db0","тема":"Общение и обращение","знак":"💬","вид":"правило","раздел":"Почему без этого звучишь грубо","урок":"urok26","урокИмя":"Урок 27","html":"В русском вежливость делают словами: «пожалуйста», «не могли бы вы». В немецком для этого есть <b>отдельная форма глагола</b> — Konjunktiv II. Без неё фраза звучит как приказ, даже если вы улыбаетесь.<br><br>\n      Сравните три пары. Слева — то, что технически правильно, но режет ухо. Справа — то, как говорят на самом деле:","текст":"В русском вежливость делают словами: «пожалуйста», «не могли бы вы». В немецком для этого есть отдельная форма глагола — Konjunktiv II. Без неё фраза звучит как приказ, даже если вы улыбаетесь. Сравните три пары. Слева — то, что технически правильно, но режет ухо. Справа — то, как говорят на самом деле:","ти":11,"пи":2,"подтема":"Вежливые просьбы"},{"id":"9d342cd934","тема":"Числа, время, даты","знак":"🔢","вид":"ловушка","раздел":"Правило чтения: ei или ie","урок":"dasha1","урокИмя":"Занятие 1 с Дашей","html":"<span class=\"big\">На этом Григорий спотыкался — Даша объяснила отдельно</span>\n      <b>ei</b> = «ай» (сначала e, потом i) · <b>ie</b> = долгое «и» (сначала i, потом e).<br>\n      Даша призналась, что сама несколько месяцев не могла это запомнить в начале — это нормально.","текст":"На этом Григорий спотыкался — Даша объяснила отдельно ei = «ай» (сначала e, потом i) · ie = долгое «и» (сначала i, потом e). Даша призналась, что сама несколько месяцев не могла это запомнить в начале — это нормально.","ти":12,"пи":0,"подтема":"Произношение"},{"id":"805d81ef0b","тема":"Произношение и письмо","знак":"🗣","вид":"правило","раздел":"Три главных принципа","урок":"urok0","урокИмя":"Урок 1","html":"<b>1. Чёткость.</b> Читается почти как написано, ничего не «проглатываем».<br>\n      <b>2. Согласные не смягчаются.</b> Перед е/и согласная твёрдая: Tisch = «тыш». Исключение — L, всегда мягкая (ль).<br>\n      <b>3. Звонкие в конце оглушаются:</b> b→п, d→т, g→к. Hund → «хунт», Tag → «так».","текст":"1. Чёткость. Читается почти как написано, ничего не «проглатываем». 2. Согласные не смягчаются. Перед е/и согласная твёрдая: Tisch = «тыш». Исключение — L, всегда мягкая (ль). 3. Звонкие в конце оглушаются: b→п, d→т, g→к. Hund → «хунт», Tag → «так».","ти":12,"пи":0,"подтема":"Произношение"},{"id":"9d7a032b0f","тема":"Произношение и письмо","знак":"🗣","вид":"правило","раздел":"Сложные слова — читать с конца","урок":"urok23","урокИмя":"Урок 24","html":"Немцы склеивают слова в одно: <i>krank + das Haus = <b>das Krankenhaus</b></i>. Три правила:<br>\n      1️⃣ <b>Главное слово — последнее</b>, остальные говорят «какое». <i>Arbeitszimmer</i> — комната (для работы).<br>\n      2️⃣ <b>Род — по последнему слову</b>: <i>der Krampf + die Ader = <b>die</b> Krampfader</i>.<br>\n      3️⃣ Иногда между частями вставляется «клей» <b>-s-</b> или <b>-n-</b>: <i>Arbeit<b>s</b>zimmer, Kompression<b>s</b>strumpf, Krank<b>en</b>haus</i>.<br>\n      Ударение — на первую часть.","текст":"Немцы склеивают слова в одно: krank + das Haus = das Krankenhaus. Три правила: 1️⃣ Главное слово — последнее, остальные говорят «какое». Arbeitszimmer — комната (для работы). 2️⃣ Род — по последнему слову: der Krampf + die Ader = die Krampfader. 3️⃣ Иногда между частями вставляется «клей» -s- или -n-: Arbeitszimmer, Kompressionsstrumpf, Krankenhaus. Ударение — на первую часть.","ти":12,"пи":0,"подтема":"Произношение"},{"id":"6a5080c4d9","тема":"Слова, которые путают","знак":"⚠️","вид":"ловушка","раздел":"Дифтонги: две буквы — один звук","урок":"urok0","урокИмя":"Урок 1","html":"Не путай: <b>ei</b> = «ай» (Wein), а <b>ie</b> = долгое «и» (Liebe). Это разные звуки!","текст":"Не путай: ei = «ай» (Wein), а ie = долгое «и» (Liebe). Это разные звуки!","ти":12,"пи":0,"подтема":"Произношение"},{"id":"69d598e477","тема":"Разное","знак":"📎","вид":"правило","раздел":"Долгие и краткие гласные","урок":"urok0","урокИмя":"Урок 1","html":"<b>Долгая</b>, если: удвоена (Staat), после неё h (Bahn), открытый слог. <b>Краткая</b>, если после неё 2+ согласные (Kopf). Меняет смысл: <i>Staat</i> (государство) ≠ <i>Stadt</i> (город)!","текст":"Долгая, если: удвоена (Staat), после неё h (Bahn), открытый слог. Краткая, если после неё 2+ согласные (Kopf). Меняет смысл: Staat (государство) ≠ Stadt (город)!","ти":12,"пи":0,"подтема":"Произношение"},{"id":"8287ed8a11","тема":"Разное","знак":"📎","вид":"правило","раздел":"Как читать объявление","урок":"urok15","урокИмя":"Урок 16","html":"Объявления пишут сокращениями — место на сайте платное. Вот расшифровка того, что встретишь почти в каждом:","текст":"Объявления пишут сокращениями — место на сайте платное. Вот расшифровка того, что встретишь почти в каждом:","ти":12,"пи":0,"подтема":"Произношение"},{"id":"b424887bf6","тема":"Разное","знак":"📎","вид":"правило","раздел":"Анализы и как читать сокращения","урок":"urok52","урокИмя":"Урок 53","html":"Немцы читают сокращения <b>по немецким названиям букв</b> — не «эс-эр-бэ», а <b>цэ-эр-пэ</b>. Без этого вас не поймут в отделении.","текст":"Немцы читают сокращения по немецким названиям букв — не «эс-эр-бэ», а цэ-эр-пэ. Без этого вас не поймут в отделении.","ти":12,"пи":0,"подтема":"Произношение"},{"id":"28398ae4e2","тема":"Общение и обращение","знак":"💬","вид":"правило","раздел":"⭐ Как устроено письмо","урок":"polya17","урокИмя":"Занятие 17 Полины","html":"Даша: в письме <b>три главные части</b>.<br>\n      <b>1. Обращение</b> — и после него <b>запятая</b>: <i>Hallo Herr Schmidt,</i><br>\n      <b>2. Основной текст</b> — со следующей строки; первое слово с <b>маленькой</b> буквы (кроме существительных и вежливого <i>Sie</i>), ведь предложение продолжает обращение.<br>\n      <b>3. Прощание</b> — <i>Schöne Grüße</i>, <i>Liebe Grüße</i>, официально <i>Mit freundlichen Grüßen</i> — и <b>подпись</b> отдельной строкой, без точки.","текст":"Даша: в письме три главные части. 1. Обращение — и после него запятая: Hallo Herr Schmidt, 2. Основной текст — со следующей строки; первое слово с маленькой буквы (кроме существительных и вежливого Sie), ведь предложение продолжает обращение. 3. Прощание — Schöne Grüße, Liebe Grüße, официально Mit freundlichen Grüßen — и подпись отдельной строкой, без точки.","ти":12,"пи":1,"подтема":"Сложные слова и письмо"},{"id":"9dffce2c2a","тема":"Разное","знак":"📎","вид":"правило","раздел":"⭐⭐ Стадии: Hach, CEAP, Widmer","урок":"urok57","урокИмя":"Урок 58","html":"<b>CVI по Widmer</b> (немецкоязычная классика): I — обратимые отёки, Corona phlebectatica; II — стойкие отёки, гиперпигментация, липодерматосклероз, Atrophie blanche, Stauungsekzem; III — открытая или зажившая язва.<br>\n      Herold честно пишет, что CEAP «для практики сложновата», — но в письмах и на конференциях её используют постоянно, а вам, флебологу, она привычна.","текст":"CVI по Widmer (немецкоязычная классика): I — обратимые отёки, Corona phlebectatica; II — стойкие отёки, гиперпигментация, липодерматосклероз, Atrophie blanche, Stauungsekzem; III — открытая или зажившая язва. Herold честно пишет, что CEAP «для практики сложновата», — но в письмах и на конференциях её используют постоянно, а вам, флебологу, она привычна.","ти":12,"пи":1,"подтема":"Сложные слова и письмо"},{"id":"9822835083","тема":"Предлоги","знак":"🧭","вид":"правило","раздел":"⭐ Вызвать скорую","урок":"urok58","урокИмя":"Урок 59","html":"<b>Номера:</b> в Австрии (и Швейцарии) скорая — <b>144</b>, в Германии — <b>112</b>; 112 работает по всей ЕС. В Австрии скорую называют просто <b>die Rettung</b>: <i>Ruf die Rettung!</i><br>\n      <b>Что сказать</b> — «пять W»: <i>Wo?</i> (где), <i>Was?</i> (что случилось), <i>Wie viele?</i> (сколько пострадавших), <i>Welche Verletzungen / Beschwerden?</i>, <i>Warten</i> — ждать вопросов и не класть трубку первым.","текст":"Номера: в Австрии (и Швейцарии) скорая — 144, в Германии — 112; 112 работает по всей ЕС. В Австрии скорую называют просто die Rettung: Ruf die Rettung! Что сказать — «пять W»: Wo? (где), Was? (что случилось), Wie viele? (сколько пострадавших), Welche Verletzungen / Beschwerden?, Warten — ждать вопросов и не класть трубку первым.","ти":13,"пи":0,"подтема":"Неотложная помощь"},{"id":"6749411db0","тема":"Разное","знак":"📎","вид":"правило","раздел":"⭐⭐ Анафилаксия","урок":"urok58","урокИмя":"Урок 59","html":"<b>Лечение по Herold:</b> уложить <b>flach</b>, ноги поднять, кислород; <b>остановить введение</b> аллергена, иглу оставить; большой венозный доступ. <b>Адреналин 0,3–0,5 мг внутримышечно</b> (при угрозе декомпенсации — 0,1 мг в/в дробно); быстро объём (взрослым 2–3 л за 30 мин); преднизолон, антигистаминные. Наблюдение <b>не менее 24 часов</b>: до 20 % реакций — двухфазные.","текст":"Лечение по Herold: уложить flach, ноги поднять, кислород; остановить введение аллергена, иглу оставить; большой венозный доступ. Адреналин 0,3–0,5 мг внутримышечно (при угрозе декомпенсации — 0,1 мг в/в дробно); быстро объём (взрослым 2–3 л за 30 мин); преднизолон, антигистаминные. Наблюдение не менее 24 часов: до 20 % реакций — двухфазные.","ти":13,"пи":0,"подтема":"Неотложная помощь"},{"id":"fcdc5f0dc3","тема":"Разное","знак":"📎","вид":"правило","раздел":"⭐ Реанимация: команды","урок":"urok58","урокИмя":"Урок 59","html":"По Herold: сразу вызвать скорую (144), без лишних измерений — <b>массаж сердца</b> (Herzdruckmassage) глубиной 5–6 см, 100–120 в минуту, <b>30 : 2</b> с вдохами, меняться каждые 2 минуты, как можно раньше — <b>AED</b>. На вдохи не готов — только компрессии тоже допустимо. Команды — короткие, в повелительном наклонении на Sie.","текст":"По Herold: сразу вызвать скорую (144), без лишних измерений — массаж сердца (Herzdruckmassage) глубиной 5–6 см, 100–120 в минуту, 30 : 2 с вдохами, меняться каждые 2 минуты, как можно раньше — AED. На вдохи не готов — только компрессии тоже допустимо. Команды — короткие, в повелительном наклонении на Sie.","ти":13,"пи":0,"подтема":"Неотложная помощь"},{"id":"28ce049585","тема":"Прошедшее время","знак":"⏮","вид":"ловушка","раздел":"Анамнез в прошедшем — твой рабочий блок","урок":"urok19","урокИмя":"Урок 20","html":"<span class=\"big\">Ловушка из урока 12 никуда не делась: seit</span>\n      Если болит <b>до сих пор</b> — настоящее время: <i>Ich <b>habe</b> seit drei Wochen Schmerzen</i>. Если прошло — Präteritum и <b>lang</b>: <i>Ich <b>hatte</b> drei Wochen lang Schmerzen</i>. «Hatte … seit» — ошибка.","текст":"Ловушка из урока 12 никуда не делась: seit Если болит до сих пор — настоящее время: Ich habe seit drei Wochen Schmerzen. Если прошло — Präteritum и lang: Ich hatte drei Wochen lang Schmerzen. «Hatte … seit» — ошибка.","ти":13,"пи":1,"подтема":"Жалобы и анамнез"},{"id":"ae18028dea","тема":"Слова, которые путают","знак":"⚠️","вид":"правило","раздел":"S — что говорит пациент","урок":"urok50","урокИмя":"Урок 51","html":"Слова пациента не выдают за факт — их <b>пересказывают</b>: berichtet, dass … · klagt über + Akk · gibt an, dass … · erwähnte. <b>Устно</b> в клинике говорят обычным Präsens (как здесь), <b>письменно</b> — Konjunktiv I: <i>sie habe, die Beschwerden bestünden</i> (урок 43). Связки для перечисления: <b>des Weiteren</b>, <b>außerdem</b>, <b>ferner</b> — «кроме того».","текст":"Слова пациента не выдают за факт — их пересказывают: berichtet, dass … · klagt über + Akk · gibt an, dass … · erwähnte. Устно в клинике говорят обычным Präsens (как здесь), письменно — Konjunktiv I: sie habe, die Beschwerden bestünden (урок 43). Связки для перечисления: des Weiteren, außerdem, ferner — «кроме того».","ти":13,"пи":1,"подтема":"Жалобы и анамнез"},{"id":"4da7c16efe","тема":"Устойчивые выражения","знак":"🔗","вид":"правило","раздел":"🩺 Рекомендации и анамнез","урок":"urok45","урокИмя":"Урок 46","html":"Рекомендации до и после ЭВЛК почти целиком строятся на этих союзах. А в анамнезе и выписке они показывают, <b>что за чем шло</b> — это и есть логика диагноза (перелёт → боли → отёк).","текст":"Рекомендации до и после ЭВЛК почти целиком строятся на этих союзах. А в анамнезе и выписке они показывают, что за чем шло — это и есть логика диагноза (перелёт → боли → отёк).","ти":13,"пи":1,"подтема":"Жалобы и анамнез"},{"id":"635cbe40b9","тема":"Разное","знак":"📎","вид":"правило","раздел":"Живот и спина","урок":"urok48","урокИмя":"Урок 49","html":"Для живота пациент лежит на спине, руки вдоль тела, колени согнуты: <b>die Knie anziehen</b>. Симптом раздражения брюшины по-немецки — <b>Loslassschmerz</b>: больнее, когда отпускаешь. Почки — поколачивание: <b>abklopfen</b>.","текст":"Для живота пациент лежит на спине, руки вдоль тела, колени согнуты: die Knie anziehen. Симптом раздражения брюшины по-немецки — Loslassschmerz: больнее, когда отпускаешь. Почки — поколачивание: abklopfen.","ти":13,"пи":1,"подтема":"Жалобы и анамнез"},{"id":"d3242a1c44","тема":"Разное","знак":"📎","вид":"правило","раздел":"Анамнез одной строкой","урок":"urok50","урокИмя":"Урок 51","html":"Если в разделе анамнеза ничего особенного — не перечисляйте всё подряд. Формула из учебника: <b>unauffällig bis auf …</b> — без особенностей, кроме… Ещё три рабочие формулы: <b>… ergab …</b> (показал), <b>… ist bekannt</b> (известна), <b>… wird verneint</b> (пациент отрицает).","текст":"Если в разделе анамнеза ничего особенного — не перечисляйте всё подряд. Формула из учебника: unauffällig bis auf … — без особенностей, кроме… Ещё три рабочие формулы: … ergab … (показал), … ist bekannt (известна), … wird verneint (пациент отрицает).","ти":13,"пи":1,"подтема":"Жалобы и анамнез"},{"id":"6b2c91198f","тема":"Разное","знак":"📎","вид":"правило","раздел":"Главная фраза приёма: «где болит?»","урок":"urok9","урокИмя":"Урок 10","html":"Два способа сказать про боль:<br>\n      1. Глагол <b class=\"hl\">wehtun</b> (болеть): <i>Der Kopf <b>tut weh</b></i> — голова болит. Вопрос: <i>Wo tut es weh?</i> Если болит несколько — <i>Die Beine <b>tun</b> weh</i>.<br>\n      2. <b class=\"hl\">…schmerzen</b> — приклей часть тела спереди: Kopf<b>schmerzen</b> (головная боль), Rücken<b>schmerzen</b> (боль в спине), Bauch<b>schmerzen</b> (в животе).","текст":"Два способа сказать про боль: 1. Глагол wehtun (болеть): Der Kopf tut weh — голова болит. Вопрос: Wo tut es weh? Если болит несколько — Die Beine tun weh. 2. …schmerzen — приклей часть тела спереди: Kopfschmerzen (головная боль), Rückenschmerzen (боль в спине), Bauchschmerzen (в животе).","ти":13,"пи":1,"подтема":"Жалобы и анамнез"},{"id":"2dca32dd48","тема":"Местоимения","знак":"🧩","вид":"правило","раздел":"Начало и конец осмотра","урок":"urok48","урокИмя":"Урок 49","html":"Не «разденьтесь», а «освободите от одежды»: <b>sich freimachen</b>, <b>den Oberkörper freimachen</b>. Бельё оставить — <b>anbehalten</b>. Кушетка — <b>die Untersuchungsliege</b>. В конце — спросить, не хочет ли пациент что-то показать, и разрешить одеться: <b>sich anziehen</b>. Если пациент ещё на анамнезе спрашивает «что у меня?», честный ответ — фраза z3.","текст":"Не «разденьтесь», а «освободите от одежды»: sich freimachen, den Oberkörper freimachen. Бельё оставить — anbehalten. Кушетка — die Untersuchungsliege. В конце — спросить, не хочет ли пациент что-то показать, и разрешить одеться: sich anziehen. Если пациент ещё на анамнезе спрашивает «что у меня?», честный ответ — фраза z3.","ти":13,"пи":2,"подтема":"Осмотр и обследование"},{"id":"81d3b7e478","тема":"Местоимения","знак":"🧩","вид":"правило","раздел":"⭐⭐ Дуплекс вен: описание","урок":"urok52","урокИмя":"Урок 53","html":"Ваш ежедневный протокол по-немецки. Главный признак тромбоза — вена <b>не сжимается</b> датчиком: <b>nicht komprimierbar</b> или <b>lässt sich nicht komprimieren</b> (sich lassen — урок 28). Рефлюкс — <b>der Reflux</b>, устье и остиальный клапан — <b>die Mündung, die Mündungsklappe</b>, диаметр — <b>der Durchmesser</b>, «составляет» — <b>beträgt</b>.","текст":"Ваш ежедневный протокол по-немецки. Главный признак тромбоза — вена не сжимается датчиком: nicht komprimierbar или lässt sich nicht komprimieren (sich lassen — урок 28). Рефлюкс — der Reflux, устье и остиальный клапан — die Mündung, die Mündungsklappe, диаметр — der Durchmesser, «составляет» — beträgt.","ти":13,"пи":2,"подтема":"Осмотр и обследование"},{"id":"e8941a88cc","тема":"Разное","знак":"📎","вид":"правило","раздел":"Сначала посмотри, где стоит слово","урок":"urok24","урокИмя":"Урок 25","html":"Прилагательное бывает в двух положениях, и от этого зависит всё.<br><br>\n      1️⃣ <b class=\"hl\">После глагола</b> (ist, wird, bleibt) — <span class=\"hl\">окончания нет вообще</span>. Слово стоит голым, как в словаре:<br>\n      <i>Das Bein ist <b>dick</b>. Der Schmerz ist <b>stark</b>.</i><br><br>\n      2️⃣ <b class=\"hl\">Перед существительным</b> — <span class=\"hl\">окончание есть всегда</span>. Голым прилагательное там не стоит никогда:<br>\n      <i>das <b>dicke</b> Bein, ein <b>starker</b> Schmerz.</i><br><br>\n      Хорошая новость: первый случай — половина всего, что вы говорите, и там учить нечего.","текст":"Прилагательное бывает в двух положениях, и от этого зависит всё. 1️⃣ После глагола (ist, wird, bleibt) — окончания нет вообще. Слово стоит голым, как в словаре: Das Bein ist dick. Der Schmerz ist stark. 2️⃣ Перед существительным — окончание есть всегда. Голым прилагательное там не стоит никогда: das dicke Bein, ein starker Schmerz. Хорошая новость: первый случай — половина всего, что вы говорите, и там учить нечего.","ти":13,"пи":2,"подтема":"Осмотр и обследование"},{"id":"6a9e641092","тема":"Разное","знак":"📎","вид":"правило","раздел":"⭐⭐ Осмотр ног и УЗИ","урок":"urok48","урокИмя":"Урок 49","html":"Ваш главный осмотр. Варикоз смотрят <b>стоя</b> — об этом стоит сказать пациенту, иначе он ляжет сам. Отёк с ямкой — <b>eine Delle bleibt</b>, в выписке — <b>Ödem mit Dellenbildung</b>. При подозрении на тромбоз: боль при сдавлении икры (<b>Wadendruckschmerz</b>), разница в окружности голеней (<b>der Umfang</b>), покраснение и жар. Проба Вальсальвы на УЗИ — «потужьтесь, как в туалете»: <b>pressen wie beim Stuhlgang</b>.","текст":"Ваш главный осмотр. Варикоз смотрят стоя — об этом стоит сказать пациенту, иначе он ляжет сам. Отёк с ямкой — eine Delle bleibt, в выписке — Ödem mit Dellenbildung. При подозрении на тромбоз: боль при сдавлении икры (Wadendruckschmerz), разница в окружности голеней (der Umfang), покраснение и жар. Проба Вальсальвы на УЗИ — «потужьтесь, как в туалете»: pressen wie beim Stuhlgang.","ти":13,"пи":2,"подтема":"Осмотр и обследование"},{"id":"3d9021736e","тема":"Разное","знак":"📎","вид":"правило","раздел":"Подготовить пациента к КТ и МРТ","урок":"urok52","урокИмя":"Урок 53","html":"Перед КТ с контрастом — спросить про <b>реакцию на контраст</b> и проверить <b>почки</b>; предупредить про тепло. Перед МРТ — <b>металл в теле</b> (кардиостимулятор, протез), <b>боязнь замкнутого пространства</b> (Platzangst), шум. <b>vertragen</b> — переносить (лекарство).","текст":"Перед КТ с контрастом — спросить про реакцию на контраст и проверить почки; предупредить про тепло. Перед МРТ — металл в теле (кардиостимулятор, протез), боязнь замкнутого пространства (Platzangst), шум. vertragen — переносить (лекарство).","ти":13,"пи":2,"подтема":"Осмотр и обследование"},{"id":"21c1910453","тема":"Приставки","знак":"🔗","вид":"правило","раздел":"⭐⭐ A — оценка и дифференциальный диагноз","урок":"urok50","урокИмя":"Урок 51","html":"Порядок из учебника: сначала <b>самый вероятный</b> диагноз, потом остальные по убыванию. К каждому — что говорит <b>за</b> и что <b>против</b>, включая отрицательные находки. Рабочие формулы:<br>\n      • <b>Der Befund deutet am ehesten auf … hin</b> — больше всего похоже на… (hindeuten — приставка в конец)<br>\n      • <b>Dafür / Dagegen spricht …</b> — за / против говорит… (sprechen für / gegen + Akk)<br>\n      • <b>Differenzialdiagnostisch kommt … in Betracht</b> — устойчивая пара, урок 46<br>\n      • <b>… ist eher unwahrscheinlich, da …</b> · <b>… konnten wir ausschließen</b>","текст":"Порядок из учебника: сначала самый вероятный диагноз, потом остальные по убыванию. К каждому — что говорит за и что против, включая отрицательные находки. Рабочие формулы: • Der Befund deutet am ehesten auf … hin — больше всего похоже на… (hindeuten — приставка в конец) • Dafür / Dagegen spricht … — за / против говорит… (sprechen für / gegen + Akk) • Differenzialdiagnostisch kommt … in Betracht — устойчивая пара, урок 46 • … ist eher unwahrscheinlich, da … · … konnten wir ausschließen","ти":13,"пи":3,"подтема":"Диагноз, лечение, операция"},{"id":"8aae4ebb0d","тема":"Местоимения","знак":"🧩","вид":"правило","раздел":"После вмешательства","урок":"urok51","урокИмя":"Урок 52","html":"Что делать и <b>когда срочно звонить</b> — это тоже часть разъяснения. <b>sich melden</b> — дать о себе знать, позвонить.","текст":"Что делать и когда срочно звонить — это тоже часть разъяснения. sich melden — дать о себе знать, позвонить.","ти":13,"пи":3,"подтема":"Диагноз, лечение, операция"},{"id":"001b225d6c","тема":"Произношение и письмо","знак":"🗣","вид":"правило","раздел":"🩺 Врач рассуждает о диагнозе","урок":"urok44","урокИмя":"Урок 45","html":"Красная отёчная нога: рожа или тромбоз? Так звучит дифференциальный диагноз вслух — вся шкала из раздела 2, плюс <i>soll</i> для сведений от родственников и <i>will</i> для слов пациента, которым не очень верят.","текст":"Красная отёчная нога: рожа или тромбоз? Так звучит дифференциальный диагноз вслух — вся шкала из раздела 2, плюс soll для сведений от родственников и will для слов пациента, которым не очень верят.","ти":13,"пи":3,"подтема":"Диагноз, лечение, операция"},{"id":"ae4ddf999c","тема":"Слова, которые путают","знак":"⚠️","вид":"правило","раздел":"Начало и диагноз","урок":"urok51","урокИмя":"Урок 52","html":"<b>jemanden über etwas aufklären</b> — разъяснить кому-то что-то (über + Akk). Сразу разрешите перебивать — так пациент спросит, а не промолчит.","текст":"jemanden über etwas aufklären — разъяснить кому-то что-то (über + Akk). Сразу разрешите перебивать — так пациент спросит, а не промолчит.","ти":13,"пи":3,"подтема":"Диагноз, лечение, операция"},{"id":"1c127d88a4","тема":"Слова, которые путают","знак":"⚠️","вид":"правило","раздел":"Как проходит вмешательство","урок":"urok51","урокИмя":"Урок 52","html":"Ход вмешательства в немецком описывают <b>пассивом</b>: важно, что происходит, а не кто делает — <b>wird … durchgeführt</b>, <b>wird … verschlossen</b>, <b>wird … eingeführt</b> (урок 35). В разговоре можно и проще: «wir verschließen die Vene».","текст":"Ход вмешательства в немецком описывают пассивом: важно, что происходит, а не кто делает — wird … durchgeführt, wird … verschlossen, wird … eingeführt (урок 35). В разговоре можно и проще: «wir verschließen die Vene».","ти":13,"пи":3,"подтема":"Диагноз, лечение, операция"},{"id":"5f4a6b23cd","тема":"Устойчивые выражения","знак":"🔗","вид":"ловушка","раздел":"Доклад целиком: ЭВЛК","урок":"urok56","урокИмя":"Урок 57","html":"<span class=\"big\">Цифры условные</span> Это учебный пример, а не настоящее исследование: число пациентов и проценты придуманы для упражнения. Для своего доклада подставьте свои данные.","текст":"Цифры условные Это учебный пример, а не настоящее исследование: число пациентов и проценты придуманы для упражнения. Для своего доклада подставьте свои данные.","ти":13,"пи":3,"подтема":"Диагноз, лечение, операция"},{"id":"c5e237b706","тема":"Устойчивые выражения","знак":"🔗","вид":"правило","раздел":"⭐ Какой бывает варикоз","урок":"urok57","урокИмя":"Урок 58","html":"<b>die Varikose</b> (или <i>Varikosis</i>) — болезнь, <b>die Varizen</b> — сами расширенные вены, <b>die Krampfadern</b> — то же самое по-простому (так говорят пациенты).<br>\n      • <b>primär</b> (≈95 %) — клапаны поверхностных вен не закрываются, причины «изнутри» (наследственность — у половины, возраст, беременность, работа стоя/сидя);<br>\n      • <b>sekundär</b> (≈5 %) — обходные пути после тромбоза глубоких вен.<br>\n      Виды: <b>Stammvarikose</b> (ствол БПВ/МПВ), <b>Seitenastvarikose</b> (притоки), <b>retikuläre Varizen</b> (2–4 мм, сеточка), <b>Besenreiser</b> (&lt; 1 мм, «веник» — дословно «прутья метлы»).","текст":"die Varikose (или Varikosis) — болезнь, die Varizen — сами расширенные вены, die Krampfadern — то же самое по-простому (так говорят пациенты). • primär (≈95 %) — клапаны поверхностных вен не закрываются, причины «изнутри» (наследственность — у половины, возраст, беременность, работа стоя/сидя); • sekundär (≈5 %) — обходные пути после тромбоза глубоких вен. Виды: Stammvarikose (ствол БПВ/МПВ), Seitenastvarikose (притоки), retikuläre Varizen (2–4 мм, сеточка), Besenreiser (&lt; 1 мм, «веник» — дословно «прутья метлы»).","ти":13,"пи":3,"подтема":"Диагноз, лечение, операция"},{"id":"b157cb8cd6","тема":"Разное","знак":"📎","вид":"правило","раздел":"🩺 Рекомендации пациенту","урок":"urok39","урокИмя":"Урок 40","html":"На выписке и на приёме: что важно делать, о чём не забывать, от чего отказаться и зачем это нужно.","текст":"На выписке и на приёме: что важно делать, о чём не забывать, от чего отказаться и зачем это нужно.","ти":13,"пи":3,"подтема":"Диагноз, лечение, операция"},{"id":"2d0c49f798","тема":"Разное","знак":"📎","вид":"правило","раздел":"⭐⭐ Шкала уверенности","урок":"urok44","урокИмя":"Урок 45","html":"Одна и та же фраза — от «уверен» до «исключено». Врачу эта шкала нужна каждый день: так говорят о диагнозе, пока нет результатов обследования.","текст":"Одна и та же фраза — от «уверен» до «исключено». Врачу эта шкала нужна каждый день: так говорят о диагнозе, пока нет результатов обследования.","ти":13,"пи":3,"подтема":"Диагноз, лечение, операция"},{"id":"41706a6511","тема":"Разное","знак":"📎","вид":"правило","раздел":"Болезни, операции, лекарства, аллергии","урок":"urok47","урокИмя":"Урок 48","html":"Для флеболога здесь три обязательных вопроса: <b>был ли тромбоз</b>, <b>гормоны или противозачаточные</b> и <b>аллергия на лекарства</b>. После «если да» — уточнение: <i>Wenn ja, welche? Wenn ja, wann und warum?</i>","текст":"Для флеболога здесь три обязательных вопроса: был ли тромбоз, гормоны или противозачаточные и аллергия на лекарства. После «если да» — уточнение: Wenn ja, welche? Wenn ja, wann und warum?","ти":13,"пи":3,"подтема":"Диагноз, лечение, операция"},{"id":"383c593a40","тема":"Разное","знак":"📎","вид":"правило","раздел":"⭐ Разговор о диагнозе: 5 шагов","урок":"urok49","урокИмя":"Урок 50","html":"Не начинайте с диагноза. Сначала узнайте, что пациент уже знает и чего боится, — тогда объяснение попадёт в цель. Последний шаг экзаменаторы любят особенно: не «вы поняли?», а «расскажите своими словами».","текст":"Не начинайте с диагноза. Сначала узнайте, что пациент уже знает и чего боится, — тогда объяснение попадёт в цель. Последний шаг экзаменаторы любят особенно: не «вы поняли?», а «расскажите своими словами».","ти":13,"пи":3,"подтема":"Диагноз, лечение, операция"},{"id":"7e9d007744","тема":"Разное","знак":"📎","вид":"правило","раздел":"⭐ Правила: кто, когда, что","урок":"urok51","урокИмя":"Урок 52","html":"Законное вмешательство держится на двух опорах: <b>медицинское показание</b> (Indikation) и <b>согласие пациента</b> (Einwilligung). А согласию обязательно предшествует разъяснение. Главное из учебника:","текст":"Законное вмешательство держится на двух опорах: медицинское показание (Indikation) и согласие пациента (Einwilligung). А согласию обязательно предшествует разъяснение. Главное из учебника:","ти":13,"пи":3,"подтема":"Диагноз, лечение, операция"},{"id":"6c647dc7c6","тема":"Разное","знак":"📎","вид":"правило","раздел":"Анатомия: три системы вен","урок":"urok57","урокИмя":"Урок 58","html":"На ноге три системы (Herold):<br>\n      <b>1. Поверхностная</b> (epifaszial) — <i>V. saphena magna</i> от внутренней лодыжки до <b>Crosse</b> (<i>Venenstern</i>, устье под паховой складкой) и <i>V. saphena parva</i> на задней поверхности голени. В разговоре с пациентом — <b>große / kleine Rosenvene</b>.<br>\n      <b>2. Глубокая</b> — несёт около 90 % венозного оттока, главный мотор — <b>мышечная помпа</b> икры (и суставная).<br>\n      <b>3. Перфоранты</b> — соединяют поверхностные вены с глубокими; группы Dodd (бедро), Boyd (под коленом), Cockett (нижняя треть голени изнутри).<br>\n      <b>Клапаны</b> пропускают кровь только вверх и внутрь — «по принципу патерностера».","текст":"На ноге три системы (Herold): 1. Поверхностная (epifaszial) — V. saphena magna от внутренней лодыжки до Crosse (Venenstern, устье под паховой складкой) и V. saphena parva на задней поверхности голени. В разговоре с пациентом — große / kleine Rosenvene. 2. Глубокая — несёт около 90 % венозного оттока, главный мотор — мышечная помпа икры (и суставная). 3. Перфоранты — соединяют поверхностные вены с глубокими; группы Dodd (бедро), Boyd (под коленом), Cockett (нижняя треть голени изнутри). Клапаны пропускают кровь только вверх и внутрь — «по принципу патерностера».","ти":13,"пи":3,"подтема":"Диагноз, лечение, операция"},{"id":"1e73dbea6a","тема":"Разное","знак":"📎","вид":"правило","раздел":"Лечение","урок":"urok57","урокИмя":"Урок 58","html":"<b>Консервативно:</b> компрессионный трикотаж — обычно хватает класса II (по Herold около 30 мм рт. ст. на лодыжке); ходить и лежать — хорошо, сидеть и стоять — плохо («SS schlecht, LL gut»); тепло расширяет вены — без сауны и долгого солнца, холодный душ полезен.<br>\n      <b>Оперативно</b> (при жалобах; обязательное условие — проходимые глубокие вены): <i>Crossektomie</i> + <i>Stripping</i>, перевязка несостоятельных перфорантов, удаление притоков (<i>Miniphlebektomie</i>); <b>эндовенозно</b> — <i>Lasertherapie</i> и <i>Radiofrequenzablation</i> в тумесцентной анестезии.<br>\n      <b>Склеротерапия</b> — <i>Sklerosierung</i>, в разговоре с пациентом <b>Verödung</b> («запаивание»): ретикулярные вены, Besenreiser, мелкие притоки.","текст":"Консервативно: компрессионный трикотаж — обычно хватает класса II (по Herold около 30 мм рт. ст. на лодыжке); ходить и лежать — хорошо, сидеть и стоять — плохо («SS schlecht, LL gut»); тепло расширяет вены — без сауны и долгого солнца, холодный душ полезен. Оперативно (при жалобах; обязательное условие — проходимые глубокие вены): Crossektomie + Stripping, перевязка несостоятельных перфорантов, удаление притоков (Miniphlebektomie); эндовенозно — Lasertherapie и Radiofrequenzablation в тумесцентной анестезии. Склеротерапия — Sklerosierung, в разговоре с пациентом Verödung («запаивание»): ретикулярные вены, Besenreiser, мелкие притоки.","ти":13,"пи":3,"подтема":"Диагноз, лечение, операция"},{"id":"1c873b8010","тема":"Прошедшее время","знак":"⏮","вид":"правило","раздел":"O — что нашли вы","урок":"urok50","урокИмя":"Урок 51","html":"Сначала клиника, потом аппаратные методы. Время — Präteritum: <b>zeigte sich</b>, <b>fanden sich</b>, <b>waren</b>, <b>ergab</b>. Отрицательные находки — тоже: «боли в икре не было».","текст":"Сначала клиника, потом аппаратные методы. Время — Präteritum: zeigte sich, fanden sich, waren, ergab. Отрицательные находки — тоже: «боли в икре не было».","ти":13,"пи":4,"подтема":"Выписка, доклад, документы"},{"id":"0ff92ed356","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"P — что предлагаете","урок":"urok50","урокИмя":"Урок 51","html":"Решение принимает старший — вы <b>предлагаете</b>: würde … vorschlagen (урок 26). Условие без wenn: <b>Sollte</b> die Patientin einverstanden sein, <b>würde</b> ich … — глагол на первое место (урок 33). В конце — спросить согласия.","текст":"Решение принимает старший — вы предлагаете: würde … vorschlagen (урок 26). Условие без wenn: Sollte die Patientin einverstanden sein, würde ich … — глагол на первое место (урок 33). В конце — спросить согласия.","ти":13,"пи":4,"подтема":"Выписка, доклад, документы"},{"id":"c7ea0d6679","тема":"Падежи","знак":"📦","вид":"правило","раздел":"⭐⭐ Схема SOAP и первая фраза","урок":"urok50","урокИмя":"Урок 51","html":"<b>Первая фраза</b> всегда одна и та же: кто, сколько лет, с чем пришёл. Возраст — прилагательным: <b>eine 46-jährige Patientin</b> (окончания — урок 24), «с чем пришёл» — придаточным с <b>die sich wegen … vorstellt</b> (урок 38; wegen + Genitiv — урок 37).","текст":"Первая фраза всегда одна и та же: кто, сколько лет, с чем пришёл. Возраст — прилагательным: eine 46-jährige Patientin (окончания — урок 24), «с чем пришёл» — придаточным с die sich wegen … vorstellt (урок 38; wegen + Genitiv — урок 37).","ти":13,"пи":4,"подтема":"Выписка, доклад, документы"},{"id":"72ef76a632","тема":"Разное","знак":"📎","вид":"правило","раздел":"⭐⭐ Схема SOAP и первая фраза","урок":"urok50","урокИмя":"Урок 51","html":"Учебник советует строить доклад по американской схеме <b>SOAP</b> — четыре буквы, четыре части. Главное — коротко: коллега должен за минуту получить полную картину. Важные находки называют, даже если они отрицательные («тромбоза нет»).","текст":"Учебник советует строить доклад по американской схеме SOAP — четыре буквы, четыре части. Главное — коротко: коллега должен за минуту получить полную картину. Важные находки называют, даже если они отрицательные («тромбоза нет»).","ти":13,"пи":4,"подтема":"Выписка, доклад, документы"},{"id":"c3b489e851","тема":"Разное","знак":"📎","вид":"правило","раздел":"⭐ Правила хорошего доклада","урок":"urok56","урокИмя":"Урок 57","html":"Четыре правила из учебника (пересказ):<br>\n      <b>1.</b> Короткие, простые предложения. Лучше пропустить деталь — её можно показать на слайде.<br>\n      <b>2.</b> Без двусмысленностей, намёков и <b>шуток</b>: юмор на чужом языке переносится очень плохо.<br>\n      <b>3.</b> Время от времени убеждайтесь, что вас понимают.<br>\n      <b>4.</b> Чёткая структура — шесть частей:","текст":"Четыре правила из учебника (пересказ): 1. Короткие, простые предложения. Лучше пропустить деталь — её можно показать на слайде. 2. Без двусмысленностей, намёков и шуток: юмор на чужом языке переносится очень плохо. 3. Время от времени убеждайтесь, что вас понимают. 4. Чёткая структура — шесть частей:","ти":13,"пи":4,"подтема":"Выписка, доклад, документы"},{"id":"1250554da0","тема":"Разное","знак":"📎","вид":"правило","раздел":"Слова презентации","урок":"urok56","урокИмя":"Урок 57","html":"<b>die Folie</b> — слайд (в учебнике ещё старое <i>das Dia</i>; по-английски «Slide» в немецкой речи лучше не вставлять). <b>die Abbildung</b> — рисунок, «Abb.» в статьях. <b>die Fortbildung</b> — повышение квалификации, в т. ч. доклады внутри клиники.","текст":"die Folie — слайд (в учебнике ещё старое das Dia; по-английски «Slide» в немецкой речи лучше не вставлять). die Abbildung — рисунок, «Abb.» в статьях. die Fortbildung — повышение квалификации, в т. ч. доклады внутри клиники.","ти":13,"пи":4,"подтема":"Выписка, доклад, документы"},{"id":"bcee534a66","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"Проверить, что пациент понял","урок":"urok49","урокИмя":"Урок 50","html":"«Haben Sie mich verstanden?» звучит как экзамен для пациента: виноват он, если не понял. Вежливо — взять ответственность на себя: <b>Habe ich mich verständlich ausgedrückt?</b> — понятно ли <b>я</b> объяснил. Лучший способ — попросить пересказать. И открытый вопрос в конце: не «есть вопросы?», а <b>какие у вас вопросы?</b>","текст":"«Haben Sie mich verstanden?» звучит как экзамен для пациента: виноват он, если не понял. Вежливо — взять ответственность на себя: Habe ich mich verständlich ausgedrückt? — понятно ли я объяснил. Лучший
