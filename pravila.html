<script>
/* ============================================================
   FSRS-5 — расписание повторений, как в Anki.

   Алгоритм открытый (лицензия MIT), реализация здесь своя.
   Смысл: у каждого слова считаются три величины —
     S (stability)      сколько дней слово продержится в памяти,
     D (difficulty)     насколько оно трудное, от 1 до 10,
     R (retrievability) вероятность вспомнить его прямо сейчас.
   Слово показывается, когда R падает до 90%. Не раньше — иначе
   зубрёжка впустую, и не позже — иначе забудется совсем.
   ============================================================ */
window.ФСРС = (function(){
"use strict";

var W = [0.40255,1.18385,3.173,15.69105,7.1949,0.5345,1.4604,0.0046,1.54575,
         0.1192,1.01925,1.9395,0.11,0.29605,2.2698,0.2315,2.9898,0.51655,0.6621];

var DECAY  = -0.5;
var FACTOR = Math.pow(0.9, 1 / DECAY) - 1;     // 19/81 — чтобы R(S,S)=0.9
var ЦЕЛЬ   = 0.9;                              // желаемая доля вспоминаний
var МАКС   = 3650;                             // дальше десяти лет не планируем

// оценки: 1 снова · 2 трудно · 3 хорошо · 4 легко
function зажать(x, лево, право){ return Math.min(право, Math.max(лево, x)); }

function вероятность(дней, S){ return Math.pow(1 + FACTOR * дней / S, DECAY); }
function интервал(S){
  var д = S / FACTOR * (Math.pow(ЦЕЛЬ, 1 / DECAY) - 1);
  return зажать(Math.round(д), 1, МАКС);
}

function S0(G){ return W[G - 1]; }
function D0(G){ return зажать(W[4] - Math.exp(W[5] * (G - 1)) + 1, 1, 10); }

function новаяD(D, G){
  var сдвиг = -W[6] * (G - 3);
  var D1 = D + сдвиг * (10 - D) / 9;                  // трудные меняются медленнее
  return зажать(W[7] * D0(4) + (1 - W[7]) * D1, 1, 10);  // тянем к среднему
}

function SприУспехе(D, S, R, G){
  var трудно = (G === 2) ? W[15] : 1;
  var легко  = (G === 4) ? W[16] : 1;
  return S * (1 + Math.exp(W[8]) * (11 - D) * Math.pow(S, -W[9]) *
              (Math.exp(W[10] * (1 - R)) - 1) * трудно * легко);
}

function SприПровале(D, S, R){
  var новое = W[11] * Math.pow(D, -W[12]) * (Math.pow(S + 1, W[13]) - 1) *
              Math.exp(W[14] * (1 - R));
  return Math.min(новое, S);        // после провала прочность не растёт
}

var ДЕНЬ = 86400000;
function сегодня(){ var d = new Date(); d.setHours(0,0,0,0); return d.getTime(); }
function дней(от, до){ return Math.max(0, Math.round((до - от) / ДЕНЬ)); }

/* Принимает прежнее состояние (или null для нового слова) и оценку,
   возвращает новое состояние. */
function ответ(сост, G){
  var н = сегодня();
  if (!сост || !сост.S){
    return {
      S: S0(G), D: D0(G),
      due: н + интервал(S0(G)) * ДЕНЬ,
      last: н, reps: 1, lapses: G === 1 ? 1 : 0
    };
  }
  var прошло = дней(сост.last, н);
  var R = вероятность(прошло, сост.S);
  var S = (G === 1) ? SприПровале(сост.D, сост.S, R)
                    : SприУспехе(сост.D, сост.S, R, G);
  return {
    S: S, D: новаяD(сост.D, G),
    due: н + интервал(S) * ДЕНЬ,
    last: н, reps: (сост.reps || 0) + 1,
    lapses: (сост.lapses || 0) + (G === 1 ? 1 : 0)
  };
}

/* Что будет, если нажать эту кнопку — чтобы подписать её «через 4 дня». */
function прогноз(сост, G){
  var н = ответ(сост, G);
  return Math.max(1, Math.round((н.due - сегодня()) / ДЕНЬ));
}

function пора(сост){ return !сост || !сост.due || сост.due <= сегодня(); }

/* Слово считается выученным, когда держится в памяти не меньше трёх недель. */
function выучено(сост){ return !!(сост && сост.S >= 21); }
function проблемное(сост){ return !!(сост && (сост.lapses || 0) >= 6); }

function словами(дни){
  if (дни < 1) return 'сегодня';
  if (дни === 1) return 'завтра';
  if (дни < 30) return 'через ' + дни + ' ' + скл(дни, 'день','дня','дней');
  if (дни < 365){ var м = Math.round(дни / 30); return 'через ' + м + ' ' + скл(м,'месяц','месяца','месяцев'); }
  var г = (дни / 365).toFixed(1).replace('.0','');
  return 'через ' + г + ' ' + скл(Math.round(дни/365), 'год','года','лет');
}
function скл(n, a, b, c){ n = Math.abs(n) % 100; var d = n % 10;
  if (n > 10 && n < 20) return c; if (d > 1 && d < 5) return b; if (d === 1) return a; return c; }

return { ответ: ответ, прогноз: прогноз, пора: пора, выучено: выучено,
         проблемное: проблемное, словами: словами, сегодня: сегодня,
         интервал: интервал, вероятность: вероятность, ДЕНЬ: ДЕНЬ };
})();
</script>

<script>
const ПРАВИЛА = [{"id":"f3ef84ccf2","тема":"Множественное число","знак":"➕","вид":"правило","раздел":"Цвета (die Farbe)","урок":"dasha1","урокИмя":"Занятие 1 с Дашей","html":"Слово «цвет» — <b class=\"hl\">die Farbe</b> (женский род), множественное <b class=\"hl\">die Farben</b>. Но это <b>не</b> общее правило: множественное число в немецком — отдельная сложная тема с кучей окончаний.<br><br>\n      <b>Не путать:</b> <i>gelb</i> (жёлтый) ≠ <i>Geld</i> (деньги).<br>\n      <b>Мнемоника:</b> Schwarzkopf = <i>schwarz</i> + <i>Kopf</i> = «чёрная голова» (отсюда и эмблема).","текст":"Слово «цвет» — die Farbe (женский род), множественное die Farben. Но это не общее правило: множественное число в немецком — отдельная сложная тема с кучей окончаний. Не путать: gelb (жёлтый) ≠ Geld (деньги). Мнемоника: Schwarzkopf = schwarz + Kopf = «чёрная голова» (отсюда и эмблема)."},{"id":"28b69492f7","тема":"Множественное число","знак":"➕","вид":"ловушка","раздел":"⭐ Правило, которое Даша просила запомнить «раз и навсегда»","урок":"dasha3","урокИмя":"Занятие 3 с Дашей","html":"<span class=\"big\">Если в глаголе меняется буква — она меняется только у du и er/sie/es</span>\n      Это самое полезное правило всего занятия. Оно избавляет от половины сомнений.<br><br>\n      Смотри: у некоторых глаголов при спряжении <b>меняется гласная внутри слова</b> (не окончание, а сама буква в середине). Так вот — это происходит <b>только в двух местах</b>:<br><br>\n      ✅ у <b class=\"hl\">du</b> (ты)<br>\n      ✅ у <b class=\"hl\">er / sie / es</b> (он / она / оно)<br><br>\n      ❌ У <b>ich</b>, <b>wir</b>, <b>ihr</b>, <b>sie</b>, <b>Sie</b> внутри слова <b>никогда ничего не меняется</b>. Они спрягаются по обычным правилам.<br><br>\n      Даша сказала это так: <i>«множественное число никогда не трогается»</i>. У модальных глаголов есть небольшое отличие — там меняется ещё и в <i>ich</i>. Но у обычных глаголов правило работает железно.","текст":"Если в глаголе меняется буква — она меняется только у du и er/sie/es Это самое полезное правило всего занятия. Оно избавляет от половины сомнений. Смотри: у некоторых глаголов при спряжении меняется гласная внутри слова (не окончание, а сама буква в середине). Так вот — это происходит только в двух местах: ✅ у du (ты) ✅ у er / sie / es (он / она / оно) ❌ У ich, wir, ihr, sie, Sie внутри слова никогда ничего не меняется. Они спрягаются по обычным правилам. Даша сказала это так: «множественное число никогда не трогается». У модальных глаголов есть небольшое отличие — там меняется ещё и в ich. Но у обычных глаголов правило работает железно."},{"id":"4d0041bdee","тема":"Множественное число","знак":"➕","вид":"правило","раздел":"🩺 Wien, Wein и Vene — три слова, которые тебе точно нужны","урок":"dasha3","урокИмя":"Занятие 3 с Дашей","html":"Итог: <b>Wien</b> — город (пишется с большой буквы, как все города). <b>der Wein</b> — вино. <b>die Vene</b> — вена, а во множественном <b>die Venen</b> с <b>-n</b> на конце. Последние два — твои рабочие слова.","текст":"Итог: Wien — город (пишется с большой буквы, как все города). der Wein — вино. die Vene — вена, а во множественном die Venen с -n на конце. Последние два — твои рабочие слова."},{"id":"deeea0335f","тема":"Множественное число","знак":"➕","вид":"правило","раздел":"tun и wissen","урок":"polya5","урокИмя":"Занятие 5 Полины","html":"<b>tun</b> — делать, <b>wissen</b> — знать. У <b>wissen</b> в единственном числе меняется корень: <i>ich weiß, du weißt, er weiß</i> — и только во множественном возвращается <i>wiss-</i>.","текст":"tun — делать, wissen — знать. У wissen в единственном числе меняется корень: ich weiß, du weißt, er weiß — и только во множественном возвращается wiss-."},{"id":"54428b9580","тема":"Множественное число","знак":"➕","вид":"правило","раздел":"Вся семья","урок":"polya5","урокИмя":"Занятие 5 Полины","html":"<b>Обрати внимание:</b> <i>die Geschwister</i> — это «братья и сёстры» одним словом, всегда во множественном. Такого слова в русском нет.<br>\n      Не путать: <b>Enkel/Enkelin</b> — внук/внучка, а <b>Neffe/Nichte</b> — племянник/племянница.","текст":"Обрати внимание: die Geschwister — это «братья и сёстры» одним словом, всегда во множественном. Такого слова в русском нет. Не путать: Enkel/Enkelin — внук/внучка, а Neffe/Nichte — племянник/племянница."},{"id":"36e27e9e2c","тема":"Множественное число","знак":"➕","вид":"правило","раздел":"Что оказалось трудным","урок":"polya7","урокИмя":"Занятие 7 Полины","html":"Обрати внимание на множественное: <b class=\"hl\">das Wort → die Wörter</b> (с умляутом и окончанием -er). В немецком множественное число почти всегда просто запоминается — общего правила нет. Кроме одного случая, до которого дойдём в разделе 10.","текст":"Обрати внимание на множественное: das Wort → die Wörter (с умляутом и окончанием -er). В немецком множественное число почти всегда просто запоминается — общего правила нет. Кроме одного случая, до которого дойдём в разделе 10."},{"id":"b74d1a3b2e","тема":"Множественное число","знак":"➕","вид":"правило","раздел":"Фильмы и выписывание фраз","урок":"polya7","урокИмя":"Занятие 7 Полины","html":"<b class=\"hl\">aufschreiben</b> — записывать. Отделяемая приставка <b>auf-</b> улетает в конец: <i>Ich schreibe einige Sätze <b>auf</b></i>. Ты это правило уже видела.<br><br>\n      И ещё одно множественное: <b class=\"hl\">der Satz → die Sätze</b> (предложение → предложения).","текст":"aufschreiben — записывать. Отделяемая приставка auf- улетает в конец: Ich schreibe einige Sätze auf. Ты это правило уже видела. И ещё одно множественное: der Satz → die Sätze (предложение → предложения)."},{"id":"4c9a616294","тема":"Множественное число","знак":"➕","вид":"правило","раздел":"⭐ Множественное от -in: единственное железное правило","урок":"polya7","урокИмя":"Занятие 7 Полины","html":"Если существительное женского рода кончается на <b class=\"hl\">-in</b>, то множественное образуется <b>всегда одинаково</b>: добавляем <b class=\"hl\">-nen</b>.<br><br>\n      <i>die Lehrerin → die Lehrerin<b>nen</b></i>. Сто процентов, без исключений.","текст":"Если существительное женского рода кончается на -in, то множественное образуется всегда одинаково: добавляем -nen. die Lehrerin → die Lehrerinnen. Сто процентов, без исключений."},{"id":"6300099fce","тема":"Множественное число","знак":"➕","вид":"правило","раздел":"Множественное от -in","урок":"polya8","урокИмя":"Занятие 8 Полины","html":"Если слово уже женское и кончается на <span class=\"hl\">-in</span>, то во множественном числе\n      добавляем <span class=\"hl\">-nen</span>. Получается <span class=\"hl\">-innen</span>.<br><br>\n      Это <b>единственное железное правило</b> во всём множественном числе — здесь исключений нет.","текст":"Если слово уже женское и кончается на -in, то во множественном числе добавляем -nen. Получается -innen. Это единственное железное правило во всём множественном числе — здесь исключений нет."},{"id":"1bbe9b2c09","тема":"Множественное число","знак":"➕","вид":"правило","раздел":"⭐⭐ Новая тема: множественное число","урок":"polya8","урокИмя":"Занятие 8 Полины","html":"<b>Плохая новость сразу:</b> одного правила на все случаи в немецком нет.\n      Даша прямо сказала — когда встречаете новое существительное, <b>сразу учите его вместе\n      со множественным числом</b>. Как одно слово.<br><br>\n      <b>Хорошая новость:</b> вариантов не бесконечно много. Их всего несколько, и их можно уложить в голове.","текст":"Плохая новость сразу: одного правила на все случаи в немецком нет. Даша прямо сказала — когда встречаете новое существительное, сразу учите его вместе со множественным числом. Как одно слово. Хорошая новость: вариантов не бесконечно много. Их всего несколько, и их можно уложить в голове."},{"id":"80c61805e7","тема":"Множественное число","знак":"➕","вид":"правило","раздел":"⭐⭐ Новая тема: множественное число","урок":"polya8","урокИмя":"Занятие 8 Полины","html":"<b>Что поменялось в этих двух предложениях:</b><br>\n      1️⃣ Артикль: <b>der</b> → <b>die</b> (во множественном он всегда <b>die</b>)<br>\n      2️⃣ Само слово: <b>Stift</b> → <b>Stifte</b><br>\n      3️⃣ Глаголы: <b>ist</b> → <b>sind</b>, <b>kostet</b> → <b>kosten</b>","текст":"Что поменялось в этих двух предложениях: 1️⃣ Артикль: der → die (во множественном он всегда die) 2️⃣ Само слово: Stift → Stifte 3️⃣ Глаголы: ist → sind, kostet → kosten"},{"id":"9e800d1426","тема":"Множественное число","знак":"➕","вид":"правило","раздел":"⭐⭐ Новая тема: множественное число","урок":"polya8","урокИмя":"Занятие 8 Полины","html":"<b>Множественное число — это всегда артикль die.</b> Дальше два случая:<br><br>\n      <b>Случай 1. Слово не меняется</b> — меняется только артикль.<br>\n      <span style=\"color:var(--pk)\">das Zimmer → die Zimmer</span><br><br>\n      <b>Случай 2. Слово меняется.</b> И тут три варианта:<br>\n      • добавилось <b>окончание</b> — <span style=\"color:var(--pk)\">der Tisch → die Tische</span><br>\n      • поменялась <b>гласная в корне</b> — <span style=\"color:var(--pk)\">der Apfel → die Äpfel</span><br>\n      • и то, и другое сразу — <span style=\"color:var(--pk)\">das Buch → die Bücher</span>","текст":"Множественное число — это всегда артикль die. Дальше два случая: Случай 1. Слово не меняется — меняется только артикль. das Zimmer → die Zimmer Случай 2. Слово меняется. И тут три варианта: • добавилось окончание — der Tisch → die Tische • поменялась гласная в корне — der Apfel → die Äpfel • и то, и другое сразу — das Buch → die Bücher"},{"id":"31618da9c0","тема":"Множественное число","знак":"➕","вид":"ловушка","раздел":"⭐⭐ Новая тема: множественное число","урок":"polya8","урокИмя":"Занятие 8 Полины","html":"<span class=\"big\">И ещё исключения</span>\n      Бывают слова, где форма меняется совсем непредсказуемо. Их немного, и Даша сказала просто:\n      встретили — запомнили.","текст":"И ещё исключения Бывают слова, где форма меняется совсем непредсказуемо. Их немного, и Даша сказала просто: встретили — запомнили."},{"id":"074952b68c","тема":"Множественное число","знак":"➕","вид":"ловушка","раздел":"🗂 Карточки профессий от Даши","урок":"polya8","урокИмя":"Занятие 8 Полины","html":"<span class=\"big\">Что означают чёрточки после слова</span>\n      На карточках после каждой профессии стоит пометка вроде <b>der Bäcker, --</b> или <b>der Pilot, -en</b>.\n      Это <b>множественное число</b> — ровно та тема, которую Даша открыла в конце занятия.<br><br>\n      <b>--</b> → слово не меняется: <i>der Bäcker → die Bäcker</i><br>\n      <b>-e</b> → добавляем -e: <i>der Detektiv → die Detektive</i><br>\n      <b>-en</b> → добавляем -en: <i>der Pilot → die Piloten</i><br>\n      <b>-̈e</b> → умляут и -e: <i>der Arzt → die Ärzte</i>","текст":"Что означают чёрточки после слова На карточках после каждой профессии стоит пометка вроде der Bäcker, -- или der Pilot, -en. Это множественное число — ровно та тема, которую Даша открыла в конце занятия. -- → слово не меняется: der Bäcker → die Bäcker -e → добавляем -e: der Detektiv → die Detektive -en → добавляем -en: der Pilot → die Piloten -̈e → умляут и -e: der Arzt → die Ärzte"},{"id":"a7c02eaff4","тема":"Множественное число","знак":"➕","вид":"правило","раздел":"Температура","урок":"urok16","урокИмя":"Урок 16","html":"<b>Grad</b> [грат] — градус, и после числа он <b class=\"hl\">не меняется</b>: <i>zehn Grad</i>, <i>dreißig Grad</i> — никакого «Grade». Минус так и говорят — <b>minus</b>.<br><br>\n      Мелочь, на которой спотыкаются: с числом больше одного глагол во множественном — <i><b>Es sind</b> zehn Grad</i>, но <i><b>Es ist</b> null Grad</i>.","текст":"Grad [грат] — градус, и после числа он не меняется: zehn Grad, dreißig Grad — никакого «Grade». Минус так и говорят — minus. Мелочь, на которой спотыкаются: с числом больше одного глагол во множественном — Es sind zehn Grad, но Es ist null Grad."},{"id":"d580b8ec9c","тема":"Множественное число","знак":"➕","вид":"правило","раздел":"Множественное число — есть логика","урок":"urok9","урокИмя":"Урок 9","html":"У пар органов множественное нужно постоянно (обе ноги, обе руки). Частые окончания: <b class=\"hl\">-e</b> (der Arm → die Arme), <b class=\"hl\">-e + умляут</b> (die Hand → die Hände, der Fuß → die Füße), <b class=\"hl\">-en</b> (das Auge → die Augen). Учи форму вместе со словом.","текст":"У пар органов множественное нужно постоянно (обе ноги, обе руки). Частые окончания: -e (der Arm → die Arme), -e + умляут (die Hand → die Hände, der Fuß → die Füße), -en (das Auge → die Augen). Учи форму вместе со словом."},{"id":"8583ecb53c","тема":"Модальные глаголы","знак":"🔑","вид":"правило","раздел":"Что такое модальный глагол","урок":"dasha2","урокИмя":"Занятие 2 с Дашей","html":"Модальный глагол не называет действие сам — он показывает <b>отношение</b> к действию: <i>могу</i> делать, <i>должен</i> делать, <i>хочу</i> делать, <i>можно</i> делать. Само действие остаётся вторым глаголом.","текст":"Модальный глагол не называет действие сам — он показывает отношение к действию: могу делать, должен делать, хочу делать, можно делать. Само действие остаётся вторым глаголом."},{"id":"6dc8594bff","тема":"Модальные глаголы","знак":"🔑","вид":"ловушка","раздел":"⚠️ Правило порядка слов — главное на уроке","урок":"dasha2","урокИмя":"Занятие 2 с Дашей","html":"<span class=\"big\">Смысловой глагол уходит в САМЫЙ КОНЕЦ и не спрягается</span>\n      Даша повторяла это несколько раз: спрягается только модальный глагол (он на 2-м месте), а второй глагол встаёт в конец предложения в инфинитиве — в той форме, в которой он в словаре.","текст":"Смысловой глагол уходит в САМЫЙ КОНЕЦ и не спрягается Даша повторяла это несколько раз: спрягается только модальный глагол (он на 2-м месте), а второй глагол встаёт в конец предложения в инфинитиве — в той форме, в которой он в словаре."},{"id":"0af86686d3","тема":"Модальные глаголы","знак":"🔑","вид":"правило","раздел":"sollen — следует, велено","урок":"dasha2","урокИмя":"Занятие 2 с Дашей","html":"Разница с müssen: <b>müssen</b> — внутренняя необходимость («мне надо»), <b>sollen</b> — чужое указание («мне сказали, велено»). Врач пациенту: <i>Sie sollen viel laufen</i> — это рекомендация врача.","текст":"Разница с müssen: müssen — внутренняя необходимость («мне надо»), sollen — чужое указание («мне сказали, велено»). Врач пациенту: Sie sollen viel laufen — это рекомендация врача."},{"id":"db1ac5b54f","тема":"Модальные глаголы","знак":"🔑","вид":"правило","раздел":"dürfen — можно, разрешено","урок":"dasha2","урокИмя":"Занятие 2 с Дашей","html":"Разница с können: <b>können</b> — физическая возможность/умение, <b>dürfen</b> — <b>разрешение</b>. <i>Darf ich…?</i> = «Можно мне…?» — вежливая просьба, врачу нужна постоянно.","текст":"Разница с können: können — физическая возможность/умение, dürfen — разрешение. Darf ich…? = «Можно мне…?» — вежливая просьба, врачу нужна постоянно."},{"id":"45e5e73773","тема":"Модальные глаголы","знак":"🔑","вид":"ловушка","раздел":"möchten — хотел бы (вежливо)","урок":"dasha2","урокИмя":"Занятие 2 с Дашей","html":"<b>Для врача важнее всех:</b> <i>wollen</i> звучит требовательно («я хочу»), а <b>möchten</b> — вежливо («я хотел бы»). С пациентами и коллегами используй <b>möchten</b>.","текст":"Для врача важнее всех: wollen звучит требовательно («я хочу»), а möchten — вежливо («я хотел бы»). С пациентами и коллегами используй möchten."},{"id":"a596e22fed","тема":"Модальные глаголы","знак":"🔑","вид":"правило","раздел":"Повторили модальные глаголы","урок":"dasha3","урокИмя":"Занятие 3 с Дашей","html":"Их <b class=\"hl\">шесть</b>. Григорий назвал все шесть сам — Даша осталась довольна. Плюс отдельно всплыл седьмой, <i>mögen</i>, с интересной историей (см. ниже).","текст":"Их шесть. Григорий назвал все шесть сам — Даша осталась довольна. Плюс отдельно всплыл седьмой, mögen, с интересной историей (см. ниже)."},{"id":"4a5cac3124","тема":"Модальные глаголы","знак":"🔑","вид":"правило","раздел":"Повторили модальные глаголы","урок":"dasha3","урокИмя":"Занятие 3 с Дашей","html":"И главное про модальные, что уже было: когда модальный стоит с другим глаголом, <b class=\"hl\">второй глагол уезжает в самый конец предложения и стоит там в начальной форме</b> (с окончанием -en).","текст":"И главное про модальные, что уже было: когда модальный стоит с другим глаголом, второй глагол уезжает в самый конец предложения и стоит там в начальной форме (с окончанием -en)."},{"id":"5f05485685","тема":"Модальные глаголы","знак":"🔑","вид":"ловушка","раздел":"Повторили модальные глаголы","урок":"dasha3","урокИмя":"Занятие 3 с Дашей","html":"<span class=\"big\">Осторожно: sollen и müssen — оба «должен», но по-разному</span>\n      <b>müssen</b> — «обязан», жёсткая необходимость. Так надо, деваться некуда.<br>\n      <b>sollen</b> — «следует, нужно». Мягче: так правильно, так советуют, так положено.<br><br>\n      И ещё: <b>dürfen</b> — это не «я разрешаю», а <b>«мне разрешено»</b>. Разрешение получаю я, а не выдаю.","текст":"Осторожно: sollen и müssen — оба «должен», но по-разному müssen — «обязан», жёсткая необходимость. Так надо, деваться некуда. sollen — «следует, нужно». Мягче: так правильно, так советуют, так положено. И ещё: dürfen — это не «я разрешаю», а «мне разрешено». Разрешение получаю я, а не выдаю."},{"id":"350a1f9c6c","тема":"Модальные глаголы","знак":"🔑","вид":"правило","раздел":"⭐⭐ Карта: три вида глаголов","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"<b>Что вообще происходит.</b> Глагол в немецком меняет хвостик в зависимости от того, кто действует.\n      «Я живу», «ты живёшь», «он живёт» — по-немецки это тоже три разных хвостика.<br><br>\n      Даша разложила <b>все глаголы немецкого языка</b> на три кучки. Это и есть вся тема целиком:<br><br>\n      1️⃣ <span class=\"hl\">Правильные</span> — 90–95% всех глаголов. Просто добавляем окончание, больше ничего.<br>\n      2️⃣ <span class=\"hl\">С изменяемой гласной</span> — те же окончания, но внутри слова меняется буква.<br>\n      3️⃣ <span class=\"hl\">Пять исключений</span> — sein, haben, werden, wissen, tun. Их просто заучиваем.<br><br>\n      Плюс отдельно стоят <b>модальные глаголы</b> — их вы разобрали на прошлом занятии.","текст":"Что вообще происходит. Глагол в немецком меняет хвостик в зависимости от того, кто действует. «Я живу», «ты живёшь», «он живёт» — по-немецки это тоже три разных хвостика. Даша разложила все глаголы немецкого языка на три кучки. Это и есть вся тема целиком: 1️⃣ Правильные — 90–95% всех глаголов. Просто добавляем окончание, больше ничего. 2️⃣ С изменяемой гласной — те же окончания, но внутри слова меняется буква. 3️⃣ Пять исключений — sein, haben, werden, wissen, tun. Их просто заучиваем. Плюс отдельно стоят модальные глаголы — их вы разобрали на прошлом занятии."},{"id":"dd51b733d0","тема":"Модальные глаголы","знак":"🔑","вид":"правило","раздел":"⚠️ mögen больше не модальный","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"<b>Что случилось.</b> Раньше <b>mögen</b> (нравиться) был модальным глаголом — то есть после него\n      ставили второй глагол. <b>В современном немецком так уже не говорят.</b><br><br>\n      Но формы у него остались старые, модальные — поэтому в таблицах он выглядит как неправильный.","текст":"Что случилось. Раньше mögen (нравиться) был модальным глаголом — то есть после него ставили второй глагол. В современном немецком так уже не говорят. Но формы у него остались старые, модальные — поэтому в таблицах он выглядит как неправильный."},{"id":"bd5af3d675","тема":"Модальные глаголы","знак":"🔑","вид":"правило","раздел":"⚠️ mögen больше не модальный","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"<b>А как сказать «мне нравится что-то делать»?</b> Через слово <b>gern</b> — оно как раз для этого.\n      <i>Ich schwimme gern</i> = я плаваю с удовольствием = мне нравится плавать.\n      Именно поэтому <b>gern</b> встречается почти в каждом предложении упражнения.","текст":"А как сказать «мне нравится что-то делать»? Через слово gern — оно как раз для этого. Ich schwimme gern = я плаваю с удовольствием = мне нравится плавать. Именно поэтому gern встречается почти в каждом предложении упражнения."},{"id":"38322fc62a","тема":"Модальные глаголы","знак":"🔑","вид":"ловушка","раздел":"⚠️ mögen больше не модальный","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"<span class=\"big\">Правило простое</span>\n      После <b>mögen</b> ставим <b>существительное</b>, а не глагол.<br>\n      ✅ Ich mag Musik. (мне нравится музыка)<br>\n      ❌ Ich mag schwimmen. — так больше не говорят","текст":"Правило простое После mögen ставим существительное, а не глагол. ✅ Ich mag Musik. (мне нравится музыка) ❌ Ich mag schwimmen. — так больше не говорят"},{"id":"a3313633a0","тема":"Модальные глаголы","знак":"🔑","вид":"правило","раздел":"⚠️ «Люблю» и «нравится» — три разных способа","урок":"urok14","урокИмя":"Урок 14","html":"1️⃣ <b class=\"hl\">gern</b> + глагол = «люблю что-то делать»: <i>Ich esse <b>gern</b> Fisch</i> — буквально «я ем охотно рыбу». Самый частый способ.<br>\n      2️⃣ <b class=\"hl\">mögen</b> = «любить» про сам продукт: <i>Ich <b>mag</b> Käse</i>. Это седьмой модальный глагол — родной брат <i>möchten</i>, который был у Даши.<br>\n      3️⃣ <b class=\"hl\">schmecken</b> = «быть вкусным» — про еду, которая уже во рту.","текст":"1️⃣ gern + глагол = «люблю что-то делать»: Ich esse gern Fisch — буквально «я ем охотно рыбу». Самый частый способ. 2️⃣ mögen = «любить» про сам продукт: Ich mag Käse. Это седьмой модальный глагол — родной брат möchten, который был у Даши. 3️⃣ schmecken = «быть вкусным» — про еду, которая уже во рту."},{"id":"92f9d9268f","тема":"Модальные глаголы","знак":"🔑","вид":"ловушка","раздел":"Модальные глаголы — умляут исчезает","урок":"urok19","урокИмя":"Урок 19","html":"<span class=\"big\">Главное правило раздела: точки над буквой пропадают</span>\n      Модальные из занятия с Дашей в прошедшем времени <b>теряют умляут</b>:<br><br>\n      k<b>ö</b>nnen → k<b>o</b>nnte &nbsp;·&nbsp; m<b>ü</b>ssen → m<b>u</b>sste &nbsp;·&nbsp; d<b>ü</b>rfen → d<b>u</b>rfte &nbsp;·&nbsp; m<b>ö</b>gen → m<b>o</b>chte<br><br>\n      А <i>wollen</i> и <i>sollen</i> умляута и не имели — у них просто добавляется <b>-te</b>.","текст":"Главное правило раздела: точки над буквой пропадают Модальные из занятия с Дашей в прошедшем времени теряют умляут: können → konnte &nbsp;·&nbsp; müssen → musste &nbsp;·&nbsp; dürfen → durfte &nbsp;·&nbsp; mögen → mochte А wollen и sollen умляута и не имели — у них просто добавляется -te."},{"id":"e10bafbc01","тема":"Модальные глаголы","знак":"🔑","вид":"правило","раздел":"Как это устроено — одно правило на всех","урок":"urok19","урокИмя":"Урок 19","html":"Схема простая: <b class=\"hl\">основа + te + окончание</b>. И самое приятное — <b>ich и er/sie/es всегда одинаковые</b>, окончания у них нет вообще.<br><br>\n      Поэтому таблицу можно не зубрить: помнишь одну форму — достаешь остальные.\n    </div>\n    <table class=\"casetab\">\n      <tr><th>лицо</th><th>окончание</th><th>пример (können)</th></tr>\n      <tr><td class=\"lbl\">ich</td><td><span class=\"wohin\">—</span></td><td>ich konnte</td></tr>\n      <tr><td class=\"lbl\">du</td><td>-st</td><td>du konntest</td></tr>\n      <tr><td class=\"lbl\">er / sie / es</td><td><span class=\"wohin\">—</span></td><td>er konnte</td></tr>\n      <tr><td class=\"lbl\">wir</td><td>-n</td><td>wir konnten</td></tr>\n      <tr><td class=\"lbl\">ihr</td><td>-t</td><td>ihr konntet</td></tr>\n      <tr><td class=\"lbl\">sie / Sie</td><td>-n</td><td>sie konnten</td></tr>\n    </table>\n    <div class=\"grid2\" id=\"konnte\">","текст":"Схема простая: основа + te + окончание. И самое приятное — ich и er/sie/es всегда одинаковые, окончания у них нет вообще. Поэтому таблицу можно не зубрить: помнишь одну форму — достаешь остальные. лицоокончаниепример (können) ich—ich konnte du-stdu konntest er / sie / es—er konnte wir-nwir konnten ihr-tihr konntet sie / Sie-nsie konnten"},{"id":"9f56d18db2","тема":"Модальные глаголы","знак":"🔑","вид":"правило","раздел":"⭐ Что когда употреблять — короткое правило","урок":"urok19","урокИмя":"Урок 19","html":"Чтобы не путаться, держи в голове ровно это:<br><br>\n      <b class=\"hl\">war, hatte, модальные</b> → в разговоре <b>Präteritum</b>. Всегда.<br>\n      <b class=\"hl\">все остальные глаголы</b> → в разговоре <b>Perfekt</b> (урок 12), в письменном тексте — Präteritum (раздел 9).<br><br>\n      То есть в одном предложении они спокойно уживаются: <i>Ich <b>war</b> beim Arzt und <b>habe</b> Tabletten <b>bekommen</b>.</i>","текст":"Чтобы не путаться, держи в голове ровно это: war, hatte, модальные → в разговоре Präteritum. Всегда. все остальные глаголы → в разговоре Perfekt (урок 12), в письменном тексте — Präteritum (раздел 9). То есть в одном предложении они спокойно уживаются: Ich war beim Arzt und habe Tabletten bekommen."},{"id":"f83398d337","тема":"Прошедшее время","знак":"⏮","вид":"правило","раздел":"Зачем нужен Perfekt","урок":"urok12","урокИмя":"Урок 12","html":"В немецком есть два прошедших времени. В <b>разговоре</b> почти всегда используют <b class=\"hl\">Perfekt</b> — его и учим. Второе (Präteritum) живёт в книгах и отчётах; из него в речи берут только <i>war</i> (был) и <i>hatte</i> (имел) — их разберём позже.<br><br>\n      Для тебя это <b>язык анамнеза</b>: всё, что пациент рассказывает о случившемся, идёт в Perfekt.","текст":"В немецком есть два прошедших времени. В разговоре почти всегда используют Perfekt — его и учим. Второе (Präteritum) живёт в книгах и отчётах; из него в речи берут только war (был) и hatte (имел) — их разберём позже. Для тебя это язык анамнеза: всё, что пациент рассказывает о случившемся, идёт в Perfekt."},{"id":"d3712c2e4f","тема":"Прошедшее время","знак":"⏮","вид":"правило","раздел":"⚠️ Формула — рамка тебе уже знакома","урок":"urok12","урокИмя":"Урок 12","html":"Спрягается <b>haben</b> или <b>sein</b> (стоит на 2-м месте), а <b class=\"hl\">Partizip II не меняется никогда</b> — просто ставится в конец. Одна форма на все лица.","текст":"Спрягается haben или sein (стоит на 2-м месте), а Partizip II не меняется никогда — просто ставится в конец. Одна форма на все лица."},{"id":"4739cba145","тема":"Прошедшее время","знак":"⏮","вид":"правило","раздел":"⚠️ Зачем нужно второе прошедшее время","урок":"urok19","урокИмя":"Урок 19","html":"Верхняя строка каждой пары грамматически не ошибка, но так не говорят. Нижняя — то, что ты услышишь в кабинете и скажешь сам.","текст":"Верхняя строка каждой пары грамматически не ошибка, но так не говорят. Нижняя — то, что ты услышишь в кабинете и скажешь сам."},{"id":"55b42c2cfd","тема":"Прошедшее время","знак":"⏮","вид":"ловушка","раздел":"⚠️ Зачем нужно второе прошедшее время","урок":"urok19","урокИмя":"Урок 19","html":"<span class=\"big\">Для этих слов правило переворачивается</span>\n      У <b>sein</b>, <b>haben</b> и <b>модальных глаголов</b> форма Perfekt в живой речи звучит тяжело и book-ish. Немцы вместо неё говорят Präteritum. Послушай обе пары подряд — разница слышна сразу:","текст":"Для этих слов правило переворачивается У sein, haben и модальных глаголов форма Perfekt в живой речи звучит тяжело и book-ish. Немцы вместо неё говорят Präteritum. Послушай обе пары подряд — разница слышна сразу:"},{"id":"f8396b29d9","тема":"Прошедшее время","знак":"⏮","вид":"правило","раздел":"sein → war","урок":"urok19","урокИмя":"Урок 19","html":"Самая нужная форма во всём уроке. <b class=\"hl\">war</b> = «был». Обрати внимание на главное: <b>ich</b> и <b>er</b> — <b class=\"hl\">одинаковые, без окончания</b>. Это не случайность, а общее правило Präteritum (раздел 6).","текст":"Самая нужная форма во всём уроке. war = «был». Обрати внимание на главное: ich и er — одинаковые, без окончания. Это не случайность, а общее правило Präteritum (раздел 6)."},{"id":"522aabd69d","тема":"Прошедшее время","знак":"⏮","вид":"правило","раздел":"haben → hatte","урок":"urok19","урокИмя":"Урок 19","html":"<b class=\"hl\">hatte</b> = «имел». Здесь тоже <b>ich</b> и <b>er</b> совпадают. И запомни двойное <b>tt</b> — на письме легко потерять.<br><br>\n      Для врача это рабочая лошадка: <i>hatten Sie…?</i> — «было ли у Вас…?»","текст":"hatte = «имел». Здесь тоже ich и er совпадают. И запомни двойное tt — на письме легко потерять. Для врача это рабочая лошадка: hatten Sie…? — «было ли у Вас…?»"},{"id":"ebcb91c584","тема":"Прошедшее время","знак":"⏮","вид":"ловушка","раздел":"⚠️ konnte или könnte — одна точка меняет смысл","урок":"urok19","урокИмя":"Урок 19","html":"<span class=\"big\">Это разные вещи, и путать их неловко</span>\n      <b>konnte</b> (без точек) — <b>прошедшее время</b>: «я не <b>мог</b>». Факт о прошлом.<br>\n      <b>könnte</b> (с точками) — <b>вежливое предположение</b>: «я <b>мог бы</b>». Это Konjunktiv, отдельная тема A2, до неё дойдём.<br><br>\n      На слух разница тоже есть — послушай обе кнопки подряд. В медицинском разговоре это важно: <i>Ich konnte nicht schlafen</i> (не спал — жалоба) и <i>Ich könnte…</i> (я бы мог — предложение) звучат совсем по-разному для собеседника.","текст":"Это разные вещи, и путать их неловко konnte (без точек) — прошедшее время: «я не мог». Факт о прошлом. könnte (с точками) — вежливое предположение: «я мог бы». Это Konjunktiv, отдельная тема A2, до неё дойдём. На слух разница тоже есть — послушай обе кнопки подряд. В медицинском разговоре это важно: Ich konnte nicht schlafen (не спал — жалоба) и Ich könnte… (я бы мог — предложение) звучат совсем по-разному для собеседника."},{"id":"43ad30cf99","тема":"Прошедшее время","знак":"⏮","вид":"правило","раздел":"Präteritum в письме — язык выписки","урок":"urok19","урокИмя":"Урок 19","html":"А вот в <b>Arztbrief</b> (врачебном письме, выписке) Präteritum используется <b class=\"hl\">для всех глаголов подряд</b> — это стандартный письменный стиль. Тебе это понадобится на Fachsprachprüfung, где надо писать заключение.<br><br>\n      Пока просто посмотри, как это выглядит — подробно разберём, когда дойдём до документации.","текст":"А вот в Arztbrief (врачебном письме, выписке) Präteritum используется для всех глаголов подряд — это стандартный письменный стиль. Тебе это понадобится на Fachsprachprüfung, где надо писать заключение. Пока просто посмотри, как это выглядит — подробно разберём, когда дойдём до документации."},{"id":"62c4c77e4e","тема":"Приставки","знак":"🔗","вид":"правило","раздел":"Описание картинки — новый навык","урок":"polya6","урокИмя":"Занятие 6 Полины","html":"Даша дала два выражения и велела записать: их используют всегда, когда описывают картинку.<br><br>\n      Плюс важная мелочь: <b class=\"hl\">auf dem Bild</b> — «на картинке», всегда так (не <i>in der Bild</i>). И глагол <b class=\"hl\">ansehen</b> — смотреть <b>на</b> что-то: приставка <i>an-</i> даёт направленность.","текст":"Даша дала два выражения и велела записать: их используют всегда, когда описывают картинку. Плюс важная мелочь: auf dem Bild — «на картинке», всегда так (не in der Bild). И глагол ansehen — смотреть на что-то: приставка an- даёт направленность."},{"id":"67bf5b2e79","тема":"Приставки","знак":"🔗","вид":"правило","раздел":"⚠️ Приставка убегает в конец","урок":"polya8","урокИмя":"Занятие 8 Полины","html":"У некоторых глаголов есть <b>отделяемая приставка</b>. В предложении она отрывается от глагола\n      и уезжает в самый конец.<br><br>\n      <b>aufräumen</b> → Sie räumt <span class=\"hl\">auf</span>.<br>\n      <b>anrufen</b> → Sie ruft viel <span class=\"hl\">an</span>.<br><br>\n      <b>Но есть спасение:</b> если рядом стоит модальный глагол (können, müssen, wollen),\n      то приставка никуда не убегает и глагол остаётся целым.","текст":"У некоторых глаголов есть отделяемая приставка. В предложении она отрывается от глагола и уезжает в самый конец. aufräumen → Sie räumt auf. anrufen → Sie ruft viel an. Но есть спасение: если рядом стоит модальный глагол (können, müssen, wollen), то приставка никуда не убегает и глагол остаётся целым."},{"id":"a441fdb1ef","тема":"Приставки","знак":"🔗","вид":"правило","раздел":"⚠️ Приставка убегает в конец","урок":"polya8","урокИмя":"Занятие 8 Полины","html":"<b>Хитрость от Даши:</b> у глагола <b>anrufen</b> (звонить) есть брат-близнец <b>telefonieren</b> —\n      у него приставка не отделяется. Можно сказать проще: <b>Sie telefoniert viel.</b>","текст":"Хитрость от Даши: у глагола anrufen (звонить) есть брат-близнец telefonieren — у него приставка не отделяется. Можно сказать проще: Sie telefoniert viel."},{"id":"89304b44d1","тема":"Приставки","знак":"🔗","вид":"ловушка","раздел":"⚠️ Приставка убегает в конец","урок":"polya8","урокИмя":"Занятие 8 Полины","html":"<span class=\"big\">Почему «auf» уезжает в конец предложения</span>\n      Полина возмутилась: «Они что, не могут одним словом сказать?» Нет, не могут — это устройство языка.","текст":"Почему «auf» уезжает в конец предложения Полина возмутилась: «Они что, не могут одним словом сказать?» Нет, не могут — это устройство языка."},{"id":"b62ccd85db","тема":"Приставки","знак":"🔗","вид":"правило","раздел":"Когда ge- НЕ ставится","урок":"urok12","урокИмя":"Урок 12","html":"Два случая, оба тебе пригодятся постоянно:<br><br>\n      1️⃣ Глаголы на <b class=\"hl\">-ieren</b> (почти все из латыни — то есть половина медицинских): <i>operieren → operiert</i>, <i>telefonieren → telefoniert</i>. <b>Приставки ge- нет.</b><br><br>\n      2️⃣ Глаголы с <b class=\"hl\">неотделяемой приставкой</b> (be-, ver-, er-, ent-, emp-, ge-, miss-, zer-): <i>besuchen → besucht</i>, <i>verstehen → verstanden</i>. Тоже <b>без ge-</b>.","текст":"Два случая, оба тебе пригодятся постоянно: 1️⃣ Глаголы на -ieren (почти все из латыни — то есть половина медицинских): operieren → operiert, telefonieren → telefoniert. Приставки ge- нет. 2️⃣ Глаголы с неотделяемой приставкой (be-, ver-, er-, ent-, emp-, ge-, miss-, zer-): besuchen → besucht, verstehen → verstanden. Тоже без ge-."},{"id":"157ce75756","тема":"Приставки","знак":"🔗","вид":"правило","раздел":"Отделяемые приставки: ge- прячется внутрь","урок":"urok12","урокИмя":"Урок 12","html":"У глаголов с отделяемой приставкой (an-, auf-, ein-, mit-, aus-, zu-) частица <b class=\"hl\">-ge-</b> встаёт <b>между приставкой и корнем</b>: <i>an<b>ge</b>rufen</i>, <i>auf<b>ge</b>standen</i>. Слово пишется слитно.","текст":"У глаголов с отделяемой приставкой (an-, auf-, ein-, mit-, aus-, zu-) частица -ge- встаёт между приставкой и корнем: angerufen, aufgestanden. Слово пишется слитно."},{"id":"551bc0cfae","тема":"Приставки","знак":"🔗","вид":"правило","раздел":"Отделяемые приставки: приставка улетает в конец","урок":"urok13","урокИмя":"Урок 13","html":"Помнишь <i>aufstehen</i>, <i>einatmen</i> из урока 12? В команде приставка <b class=\"hl\">отрывается и встаёт в самый конец</b>:<br>\n      <i>auf<b>stehen</b> → <b>Stehen</b> Sie bitte <b class=\"hl\">auf</b>.</i><br><br>\n      Для тебя это критично: половина команд на осмотре — именно такие глаголы (<i>einatmen, ausatmen, ausziehen, anrufen</i>).","текст":"Помнишь aufstehen, einatmen из урока 12? В команде приставка отрывается и встаёт в самый конец: aufstehen → Stehen Sie bitte auf. Для тебя это критично: половина команд на осмотре — именно такие глаголы (einatmen, ausatmen, ausziehen, anrufen)."},{"id":"6fa73dbe36","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"Времена: в немецком их всего три","урок":"dasha3","урокИмя":"Занятие 3 с Дашей","html":"Сегодня занимаемся <b>Präsens</b> — настоящим временем. Что такое «спряжение»? Ровно то же самое, что в русском: <i>я дела<b>ю</b>, ты дела<b>ешь</b>, он дела<b>ет</b></i>. Окончание глагола меняется в зависимости от того, <b>кто</b> действует. По-немецки принцип точно такой же.","текст":"Сегодня занимаемся Präsens — настоящим временем. Что такое «спряжение»? Ровно то же самое, что в русском: я делаю, ты делаешь, он делает. Окончание глагола меняется в зависимости от того, кто действует. По-немецки принцип точно такой же."},{"id":"9a1cb87c07","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"⭐⭐ Главное: все глаголы делятся на три категории","урок":"dasha3","урокИмя":"Занятие 3 с Дашей","html":"Вот схема, ради которой было всё занятие. Даша разложила все немецкие глаголы на три кучки — и это сразу снимает страх, потому что первая кучка почти всё и покрывает.\n    </div>\n    <table class=\"casetab\">\n      <tr><th>Категория</th><th>Сколько их</th><th>Что делают</th></tr>\n      <tr><td class=\"lbl\"><b>1. Правильные</b></td><td><b>90–95%</b></td><td>просто добавляют окончание</td></tr>\n      <tr><td class=\"lbl\"><b>2. С изменяемой гласной</b><br><span style=\"font-size:11px\">Vokalwechselverben</span></td><td>небольшой список</td><td>окончание + меняют букву внутри</td></tr>\n      <tr><td class=\"lbl\"><b>3. Исключения</b></td><td>около пяти</td><td>своя форма, просто учим</td></tr>\n    </table>\n    <div class=\"link-box\" style=\"margin-top:14px\">\n      💡 <b>Почему это радостная новость.</b> Девять из десяти глаголов — первая категория. То есть выучив одно правило, ты уже умеешь спрягать <b>почти любой</b> немецкий глагол. Вторая категория — это список, который просто заучивается. Третья — пять штук, их знают наизусть все.","текст":"Вот схема, ради которой было всё занятие. Даша разложила все немецкие глаголы на три кучки — и это сразу снимает страх, потому что первая кучка почти всё и покрывает. КатегорияСколько ихЧто делают 1. Правильные90–95%просто добавляют окончание 2. С изменяемой гласной Vokalwechselverbenнебольшой списококончание + меняют букву внутри 3. Исключенияоколо пятисвоя форма, просто учим 💡 Почему это радостная новость. Девять из десяти глаголов — первая категория. То есть выучив одно правило, ты уже умеешь спрягать почти любой немецкий глагол. Вторая категория — это список, который просто заучивается. Третья — пять штук, их знают наизусть все."},{"id":"23d3091bdf","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"Категория 1: правильные глаголы — одно правило на всё","урок":"dasha3","урокИмя":"Занятие 3 с Дашей","html":"Сначала два слова, которые надо понимать:<br><br>\n      <b class=\"hl\">Инфинитив</b> — это глагол в словарной форме, как он записан в словаре. У немецких глаголов он почти всегда кончается на <b>-en</b>: <i>machen</i> (делать), <i>kommen</i> (приходить).<br>\n      <b class=\"hl\">Основа</b> — это глагол <b>без этого -en</b>. У <i>machen</i> основа <b>mach-</b>. У <i>kommen</i> — <b>komm-</b>.<br><br>\n      А дальше всё просто: <b>берём основу и прилепляем окончание</b>. Окончаний всего четыре разных: <b>-e, -st, -t, -en</b>.\n    </div>\n    <table class=\"casetab\">\n      <tr><th>Кто</th><th>Окончание</th><th>machen (делать)</th></tr>\n      <tr><td class=\"lbl\">ich (я)</td><td><b>-e</b></td><td>ich mach<b>e</b></td></tr>\n      <tr><td class=\"lbl\">du (ты)</td><td><b>-st</b></td><td>du mach<b>st</b></td></tr>\n      <tr><td class=\"lbl\">er / sie / es (он/она/оно)</td><td><b>-t</b></td><td>er mach<b>t</b></td></tr>\n      <tr><td class=\"lbl\">wir (мы)</td><td><b>-en</b></td><td>wir mach<b>en</b></td></tr>\n      <tr><td class=\"lbl\">ihr (вы, свои)</td><td><b>-t</b></td><td>ihr mach<b>t</b></td></tr>\n      <tr><td class=\"lbl\">sie / Sie (они / Вы)</td><td><b>-en</b></td><td>sie mach<b>en</b></td></tr>\n    </table>\n    <div class=\"grid2\" id=\"machen\">","текст":"Сначала два слова, которые надо понимать: Инфинитив — это глагол в словарной форме, как он записан в словаре. У немецких глаголов он почти всегда кончается на -en: machen (делать), kommen (приходить). Основа — это глагол без этого -en. У machen основа mach-. У kommen — komm-. А дальше всё просто: берём основу и прилепляем окончание. Окончаний всего четыре разных: -e, -st, -t, -en. КтоОкончаниеmachen (делать) ich (я)-eich mache du (ты)-stdu machst er / sie / es (он/она/оно)-ter macht wir (мы)-enwir machen ihr (вы, свои)-tihr macht sie / Sie (они / Вы)-ensie machen"},{"id":"88d0764ec6","тема":"Глагол: спряжение","знак":"🔤","вид":"ловушка","раздел":"Категория 1: правильные глаголы — одно правило на всё","урок":"dasha3","урокИмя":"Занятие 3 с Дашей","html":"<span class=\"big\">Две подсказки, которые снимают путаницу</span>\n      1️⃣ <b>У du ВСЕГДА -st.</b> Это самая надёжная примета во всём немецком. Видишь <i>du</i> — жди <b>-st</b>. Даша повторила это раз пять за занятие.<br><br>\n      2️⃣ <b>wir и sie/Sie — это просто инфинитив.</b> Ничего не меняем, берём словарную форму как есть: <i>wir machen</i>, <i>sie machen</i>. Ноль работы.<br><br>\n      Григорий на занятии пару раз путал <b>ich</b> и <b>ihr</b> (<i>ich wohne</i> / <i>ihr wohnt</i>) — это частая путаница, тут просто внимание: у <b>ihr</b> на конце <b>-t</b>, у <b>ich</b> — <b>-e</b>.","текст":"Две подсказки, которые снимают путаницу 1️⃣ У du ВСЕГДА -st. Это самая надёжная примета во всём немецком. Видишь du — жди -st. Даша повторила это раз пять за занятие. 2️⃣ wir и sie/Sie — это просто инфинитив. Ничего не меняем, берём словарную форму как есть: wir machen, sie machen. Ноль работы. Григорий на занятии пару раз путал ich и ihr (ich wohne / ihr wohnt) — это частая путаница, тут просто внимание: у ihr на конце -t, у ich — -e."},{"id":"51f223b680","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"⭐ Категория 2: глаголы, которые меняют гласную","урок":"dasha3","урокИмя":"Занятие 3 с Дашей","html":"Эти глаголы делают <b>две вещи сразу</b>:<br>\n      1️⃣ добавляют обычные окончания, как все нормальные глаголы;<br>\n      2️⃣ <b class=\"hl\">плюс меняют гласную внутри слова</b> — и только у <b>du</b> и <b>er/sie/es</b>, как мы договорились в разделе 4.<br><br>\n      <b>Как понять, что глагол из этой группы?</b> Никак. Честно. Даша прямо сказала: <i>«У нас нет никаких указателей на то, что глагол будет относиться к этой категории. Просто мы их заучиваем»</i>. Списка не избежать — но он небольшой, около сорока штук, и Даша пришлёт карточки.","текст":"Эти глаголы делают две вещи сразу: 1️⃣ добавляют обычные окончания, как все нормальные глаголы; 2️⃣ плюс меняют гласную внутри слова — и только у du и er/sie/es, как мы договорились в разделе 4. Как понять, что глагол из этой группы? Никак. Честно. Даша прямо сказала: «У нас нет никаких указателей на то, что глагол будет относиться к этой категории. Просто мы их заучиваем». Списка не избежать — но он небольшой, около сорока штук, и Даша пришлёт карточки."},{"id":"644a96878b","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"⭐ Категория 2: глаголы, которые меняют гласную","урок":"dasha3","урокИмя":"Занятие 3 с Дашей","html":"<b>Важно не потерять окончание.</b> Григорий на занятии сказал <i>«du спрехт»</i> — забыл про <b>-st</b>. Даша поправила: меняем гласную <b>И</b> добавляем окончание. Оба действия, не одно вместо другого. Правильно — <b>du sprichst</b>.","текст":"Важно не потерять окончание. Григорий на занятии сказал «du спрехт» — забыл про -st. Даша поправила: меняем гласную И добавляем окончание. Оба действия, не одно вместо другого. Правильно — du sprichst."},{"id":"1365fb26d1","тема":"Глагол: спряжение","знак":"🔤","вид":"ловушка","раздел":"⭐ Категория 2: глаголы, которые меняют гласную","урок":"dasha3","урокИмя":"Занятие 3 с Дашей","html":"<span class=\"big\">Зато когда ты уже знаешь, что глагол из этой группы — работают два чётких правила</span>\n      1️⃣ Если в инфинитиве <b class=\"hl\">e</b> → меняется на <b>i</b> или на <b>ie</b><br>\n      2️⃣ Если в инфинитиве <b class=\"hl\">a</b> → меняется на <b>ä</b> (a с точками)","текст":"Зато когда ты уже знаешь, что глагол из этой группы — работают два чётких правила 1️⃣ Если в инфинитиве e → меняется на i или на ie 2️⃣ Если в инфинитиве a → меняется на ä (a с точками)"},{"id":"2fb1e4f062","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"Категория 3: глаголы-исключения (их всего пять)","урок":"dasha3","урокИмя":"Занятие 3 с Дашей","html":"Эти не подчиняются никаким правилам вообще — ни обычным, ни «с изменяемой гласной». У них свои формы, которые просто заучивают наизусть. Хорошая новость: их пять, и два из них ты уже знаешь.","текст":"Эти не подчиняются никаким правилам вообще — ни обычным, ни «с изменяемой гласной». У них свои формы, которые просто заучивают наизусть. Хорошая новость: их пять, и два из них ты уже знаешь."},{"id":"de38ec6030","тема":"Глагол: спряжение","знак":"🔤","вид":"ловушка","раздел":"⚠️ Мелкие исключения: когда буква добавляется или пропадает","урок":"dasha3","урокИмя":"Занятие 3 с Дашей","html":"<span class=\"big\">Случай 1: основа кончается на -t или -d → добавляется лишняя e</span>\n      Возьми <b>arbeiten</b> (работать), основа <b>arbeit-</b>. Попробуй сказать «arbeitst» — язык сломается. Поэтому вставляют <b class=\"hl\">-e-</b> для передышки:<br><br>\n      du arbeit<b>e</b>st &nbsp;·&nbsp; er arbeit<b>e</b>t &nbsp;·&nbsp; ihr arbeit<b>e</b>t<br><br>\n      А у <i>ich arbeite</i>, <i>wir arbeiten</i> ничего лишнего не нужно — там и так удобно.","текст":"Случай 1: основа кончается на -t или -d → добавляется лишняя e Возьми arbeiten (работать), основа arbeit-. Попробуй сказать «arbeitst» — язык сломается. Поэтому вставляют -e- для передышки: du arbeitest &nbsp;·&nbsp; er arbeitet &nbsp;·&nbsp; ihr arbeitet А у ich arbeite, wir arbeiten ничего лишнего не нужно — там и так удобно."},{"id":"a554d473fe","тема":"Глагол: спряжение","знак":"🔤","вид":"ловушка","раздел":"⚠️ Мелкие исключения: когда буква добавляется или пропадает","урок":"dasha3","урокИмя":"Занятие 3 с Дашей","html":"<span class=\"big\">Случай 2: основа кончается на -z, -s, -ß → у du пропадает s</span>\n      У <b>tanzen</b> (танцевать) основа <b>tanz-</b>. По правилу у <i>du</i> должно быть <b>-st</b>, получилось бы «tanzst» — два свистящих подряд, неудобно. Поэтому <b class=\"hl\">s выбрасывают</b>, остаётся только <b>-t</b>:<br><br>\n      du tanz<b>t</b> — и это совпадает с формой <i>er tanzt</i>.<br><br>\n      То же самое с <b>heißen</b> (зваться): <i>du heißt</i>. Ты это уже говорил в первом уроке — <i>Wie heißt du?</i>","текст":"Случай 2: основа кончается на -z, -s, -ß → у du пропадает s У tanzen (танцевать) основа tanz-. По правилу у du должно быть -st, получилось бы «tanzst» — два свистящих подряд, неудобно. Поэтому s выбрасывают, остаётся только -t: du tanzt — и это совпадает с формой er tanzt. То же самое с heißen (зваться): du heißt. Ты это уже говорил в первом уроке — Wie heißt du?"},{"id":"87fdcee1e9","тема":"Глагол: спряжение","знак":"🔤","вид":"ловушка","раздел":"⚠️ Мелкие исключения: когда буква добавляется или пропадает","урок":"dasha3","урокИмя":"Занятие 3 с Дашей","html":"<span class=\"big\">Случай 3: глаголы на -eln → у ich выпадает e</span>\n      Глаголы вроде <b>bügeln</b> (гладить), <b>sammeln</b> (собирать), <b>lächeln</b> (улыбаться), <b>googeln</b> (гуглить). У формы <i>ich</i> буква <b>e</b> перед <b>l</b> <b class=\"hl\">выпадает</b>:<br><br>\n      <i>ich büg<b>l</b>e</i> (не «bügele») &nbsp;·&nbsp; <i>ich samm<b>l</b>e</i><br><br>\n      Всё остальное спрягается обычно.","текст":"Случай 3: глаголы на -eln → у ich выпадает e Глаголы вроде bügeln (гладить), sammeln (собирать), lächeln (улыбаться), googeln (гуглить). У формы ich буква e перед l выпадает: ich bügle (не «bügele») &nbsp;·&nbsp; ich sammle Всё остальное спрягается обычно."},{"id":"43a469606b","тема":"Глагол: спряжение","знак":"🔤","вид":"ловушка","раздел":"⭐⭐ Карта: три вида глаголов","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"<span class=\"big\">Хорошая новость</span>\n      Кучка №1 — это почти все глаголы. Кучки №2 и №3 вместе занимают 5–10%.\n      То есть выучить надо два правила и пять слов, а всё остальное работает само.","текст":"Хорошая новость Кучка №1 — это почти все глаголы. Кучки №2 и №3 вместе занимают 5–10%. То есть выучить надо два правила и пять слов, а всё остальное работает само."},{"id":"bde83f7e93","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"Правильные глаголы: шесть окончаний","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"Берём глагол, отрезаем <span class=\"hl\">-en</span> — получилась <b>основа</b>.\n      К ней приклеиваем хвостик. Всё.<br><br>\n      wohn<b>en</b> (жить) → основа <b>wohn</b>","текст":"Берём глагол, отрезаем -en — получилась основа. К ней приклеиваем хвостик. Всё. wohnen (жить) → основа wohn"},{"id":"7e7b20745c","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"Правильные глаголы: шесть окончаний","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"Обратите внимание: у <b>wir</b> и у <b>sie/Sie</b> окончание <span class=\"hl\">-en</span> —\n      это ровно тот же вид, что и сам глагол в словаре (инфинитив). Ничего придумывать не надо.\n      А у <b>er</b> и у <b>ihr</b> хвостик одинаковый — <span class=\"hl\">-t</span>.","текст":"Обратите внимание: у wir и у sie/Sie окончание -en — это ровно тот же вид, что и сам глагол в словаре (инфинитив). Ничего придумывать не надо. А у er и у ihr хвостик одинаковый — -t."},{"id":"376d5490bc","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"⭐ Глаголы, меняющие гласную","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"Вторая кучка. Окончания те же самые, что у правильных — но внутри слова меняется буква.<br><br>\n      <b>Всего два правила:</b><br>\n      1️⃣ Если в глаголе <span class=\"hl\">e</span> → она станет <span class=\"hl\">i</span> или <span class=\"hl\">ie</span><br>\n      2️⃣ Если в глаголе <span class=\"hl\">a</span> → она станет <span class=\"hl\">ä</span><br><br>\n      Григорий на занятии так и сформулировал: «чисто два правила — если e, меняем на i, если a, меняем на ä». Даша подтвердила.","текст":"Вторая кучка. Окончания те же самые, что у правильных — но внутри слова меняется буква. Всего два правила: 1️⃣ Если в глаголе e → она станет i или ie 2️⃣ Если в глаголе a → она станет ä Григорий на занятии так и сформулировал: «чисто два правила — если e, меняем на i, если a, меняем на ä». Даша подтвердила."},{"id":"752be9a315","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"⭐ Пять глаголов-исключений","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"Третья кучка, самая маленькая. Пять глаголов, которые спрягаются «как хотят».\n      Никакого правила тут нет — <b>просто заучиваем</b>, как таблицу умножения.","текст":"Третья кучка, самая маленькая. Пять глаголов, которые спрягаются «как хотят». Никакого правила тут нет — просто заучиваем, как таблицу умножения."},{"id":"eaea187d9b","тема":"Глагол: спряжение","знак":"🔤","вид":"ловушка","раздел":"⭐ Пять глаголов-исключений","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"<span class=\"big\">Первые два — самые важные</span>\n      <b>sein</b> (быть) и <b>haben</b> (иметь) встречаются в речи чаще всех остальных глаголов вместе взятых.\n      Их надо знать так, чтобы просыпаться ночью и рассказывать. Домашка как раз про них.","текст":"Первые два — самые важные sein (быть) и haben (иметь) встречаются в речи чаще всех остальных глаголов вместе взятых. Их надо знать так, чтобы просыпаться ночью и рассказывать. Домашка как раз про них."},{"id":"8e3102c508","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"⚠️ Буква добавляется или убегает","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"<b>Это не четвёртая кучка.</b> Глаголы обычные, правильные — просто немцам было\n      неудобно выговаривать, и они чуть-чуть подправили окончание. Чисто для благозвучия.","текст":"Это не четвёртая кучка. Глаголы обычные, правильные — просто немцам было неудобно выговаривать, и они чуть-чуть подправили окончание. Чисто для благозвучия."},{"id":"5333a06bf2","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"⚠️ Буква добавляется или убегает","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"Григорий спросил: «есть какой-нибудь перечень вот таких приколов?»<br>\n      Ответ Даши: <b>отдельного списка нет</b>. Это почти всегда глаголы, у которых основа кончается на\n      <span class=\"hl\">-t</span> или <span class=\"hl\">-d</span> (arbeiten, warten, finden), плюс tanzen.\n      Остальное встретится по ходу.","текст":"Григорий спросил: «есть какой-нибудь перечень вот таких приколов?» Ответ Даши: отдельного списка нет. Это почти всегда глаголы, у которых основа кончается на -t или -d (arbeiten, warten, finden), плюс tanzen. Остальное встретится по ходу."},{"id":"9c3ccd5740","тема":"Глагол: спряжение","знак":"🔤","вид":"ловушка","раздел":"⚠️ Буква добавляется или убегает","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"<span class=\"big\">Случай 1: основа кончается на -t → добавляем e</span>\n      arbeit<b>en</b> → основа <b>arbeit</b>. Если приклеить обычное окончание, выйдет\n      «arbeitt» — две «т» подряд. Поэтому вставляют <b>e</b>: du arbeit<b>e</b>st, er arbeit<b>e</b>t.","текст":"Случай 1: основа кончается на -t → добавляем e arbeiten → основа arbeit. Если приклеить обычное окончание, выйдет «arbeitt» — две «т» подряд. Поэтому вставляют e: du arbeitest, er arbeitet."},{"id":"0d15844e92","тема":"Глагол: спряжение","знак":"🔤","вид":"ловушка","раздел":"⚠️ Буква добавляется или убегает","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"<span class=\"big\">Случай 2: tanzen у du → выбрасываем s</span>\n      По правилу должно быть «du tanz<b>st</b>» — но там уже есть свистящий звук.\n      Поэтому <b>s</b> убирают: <b>du tanzt</b>. Только у <b>du</b>, только у этого глагола-типа.","текст":"Случай 2: tanzen у du → выбрасываем s По правилу должно быть «du tanzst» — но там уже есть свистящий звук. Поэтому s убирают: du tanzt. Только у du, только у этого глагола-типа."},{"id":"dda66583dc","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"werden — становиться","урок":"polya5","урокИмя":"Занятие 5 Полины","html":"<b>werden</b> = «становиться». Обрати внимание на форму <b class=\"hl\">ihr werdet</b> — здесь добавляется лишнее <b>-e-</b>, потому что основа кончается на -d.","текст":"werden = «становиться». Обрати внимание на форму ihr werdet — здесь добавляется лишнее -e-, потому что основа кончается на -d."},{"id":"463ef3ed51","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"Правильные глаголы — для сравнения","урок":"polya5","урокИмя":"Занятие 5 Полины","html":"Эти ведут себя предсказуемо: корень не меняется, только окончания <b class=\"hl\">-e, -st, -t, -en, -t, -en</b>.","текст":"Эти ведут себя предсказуемо: корень не меняется, только окончания -e, -st, -t, -en, -t, -en."},{"id":"882708fada","тема":"Глагол: спряжение","знак":"🔤","вид":"ловушка","раздел":"⭐ После haben — всегда Akkusativ","урок":"polya6","урокИмя":"Занятие 6 Полины","html":"<span class=\"big\">Правило без исключений, Полина спросила про него сама</span>\n      После <b>haben</b> — <b>всегда Akkusativ</b>. И в <b>95% случаев</b> там будет неопределённый артикль.<br><br>\n      Логика простая: <i>иметь</i> — кого? что? Это и есть вопросы винительного падежа.<br>\n      Мужской род в Akkusativ даёт <b class=\"hl\">einen</b>.","текст":"Правило без исключений, Полина спросила про него сама После haben — всегда Akkusativ. И в 95% случаев там будет неопределённый артикль. Логика простая: иметь — кого? что? Это и есть вопросы винительного падежа. Мужской род в Akkusativ даёт einen."},{"id":"44bc6f1a2b","тема":"Глагол: спряжение","знак":"🔤","вид":"ловушка","раздел":"⚠️ Почему в «Kinderbücher haben viele Bilder» нет артикля","урок":"polya7","урокИмя":"Занятие 7 Полины","html":"<span class=\"big\">Две причины сразу</span>\n      1️⃣ <b>Неопределённого артикля во множественном числе просто НЕ СУЩЕСТВУЕТ.</b> <i>ein</i> есть только в единственном числе. Во множественном ставить нечего.<br><br>\n      2️⃣ Определённый артикль <i>die</i> тут тоже не нужен: определённый ставят, когда говорят о <b>конкретных</b> предметах. А здесь мысль общая — «у детских книг вообще есть картинки», не о каких-то определённых картинках.<br><br>\n      Плюс рядом уже стоит слово <b>viele</b> («много») — оно само по себе показывает количество, артикль становится лишним.","текст":"Две причины сразу 1️⃣ Неопределённого артикля во множественном числе просто НЕ СУЩЕСТВУЕТ. ein есть только в единственном числе. Во множественном ставить нечего. 2️⃣ Определённый артикль die тут тоже не нужен: определённый ставят, когда говорят о конкретных предметах. А здесь мысль общая — «у детских книг вообще есть картинки», не о каких-то определённых картинках. Плюс рядом уже стоит слово viele («много») — оно само по себе показывает количество, артикль становится лишним."},{"id":"5f3e91e6d3","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"Глагол sein (быть) — выучить наизусть","урок":"urok1","урокИмя":"Урок 1","html":"<b>sein</b> — самый важный глагол. В немецком его нельзя опускать: не «я врач», а «я <b class=\"hl\">есть</b> врач» — <i>Ich bin Arzt</i>. Формы учат наизусть.","текст":"sein — самый важный глагол. В немецком его нельзя опускать: не «я врач», а «я есть врач» — Ich bin Arzt. Формы учат наизусть."},{"id":"67e453199a","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"Правильные глаголы: ge + основа + t","урок":"urok12","урокИмя":"Урок 12","html":"Самая большая группа. Схема простая: <b class=\"hl\">ge</b> + основа + <b class=\"hl\">t</b>. <i>machen → <b>ge</b>mach<b>t</b></i>.<br>\n      Если основа кончается на -t или -d, вставляем <b>-e-</b> для удобства: <i>arbeiten → gearbei<b>te</b>t</i>, <i>warten → gewar<b>te</b>t</i>.","текст":"Самая большая группа. Схема простая: ge + основа + t. machen → gemacht. Если основа кончается на -t или -d, вставляем -e- для удобства: arbeiten → gearbeitet, warten → gewartet."},{"id":"2807b15cf8","тема":"Глагол: спряжение","знак":"🔤","вид":"ловушка","раздел":"haben или sein? — главный вопрос","урок":"urok12","урокИмя":"Урок 12","html":"<span class=\"big\">По умолчанию — haben. Через sein только два случая</span>\n      1️⃣ <b>Движение из точки А в точку Б:</b> gehen, kommen, fahren, laufen, stürzen (упасть).<br>\n      2️⃣ <b>Смена состояния:</b> einschlafen (заснуть), aufstehen (встать), werden (стать), passieren (случиться).<br>\n      Плюс отдельно запомнить: <b>sein</b> и <b>bleiben</b> тоже идут с sein.","текст":"По умолчанию — haben. Через sein только два случая 1️⃣ Движение из точки А в точку Б: gehen, kommen, fahren, laufen, stürzen (упасть). 2️⃣ Смена состояния: einschlafen (заснуть), aufstehen (встать), werden (стать), passieren (случиться). Плюс отдельно запомнить: sein и bleiben тоже идут с sein."},{"id":"ee277b975e","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"Форма на du — для дома","урок":"urok13","урокИмя":"Урок 13","html":"Рецепт: берёшь форму <b>du</b> в настоящем времени и <b class=\"hl\">отрезаешь -st</b>. Больше ничего.<br>\n      <i>du komm<b>st</b> → <b>Komm!</b></i> &nbsp;·&nbsp; <i>du geh<b>st</b> → <b>Geh!</b></i><br><br>\n      Если основа кончается на -t или -d, добавляем <b>-e</b>, иначе не выговорить: <i>du wartest → <b>Warte!</b></i>","текст":"Рецепт: берёшь форму du в настоящем времени и отрезаешь -st. Больше ничего. du kommst → Komm! &nbsp;·&nbsp; du gehst → Geh! Если основа кончается на -t или -d, добавляем -e, иначе не выговорить: du wartest → Warte!"},{"id":"f31e20fe28","тема":"Глагол: спряжение","знак":"🔤","вид":"ловушка","раздел":"sein и haben — единственные исключения","урок":"urok13","урокИмя":"Урок 13","html":"<span class=\"big\">Выучить наизусть — обе фразы говорят пациенту каждый день</span>\n      <b>sein</b> ведёт себя не как все: <i>Seien Sie…</i> (не «Sein Sie»!), <i>Sei…</i>, <i>Seid…</i><br>\n      <b>haben</b> в форме Sie обычное, а в du теряет -e: <i>Hab keine Angst!</i>","текст":"Выучить наизусть — обе фразы говорят пациенту каждый день sein ведёт себя не как все: Seien Sie… (не «Sein Sie»!), Sei…, Seid… haben в форме Sie обычное, а в du теряет -e: Hab keine Angst!"},{"id":"2a634f4866","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"Голод, жажда, аппетит","урок":"urok14","урокИмя":"Урок 14","html":"Обрати внимание: по-немецки не «я голоден», а <b class=\"hl\">«я имею голод»</b> — <i>Ich <b>habe</b> Hunger</i>. Тот же глагол <b>haben</b>, что в уроке 4 («у меня болит»). Немцы вообще многие состояния строят через haben.","текст":"Обрати внимание: по-немецки не «я голоден», а «я имею голод» — Ich habe Hunger. Тот же глагол haben, что в уроке 4 («у меня болит»). Немцы вообще многие состояния строят через haben."},{"id":"247e9baf18","тема":"Глагол: спряжение","знак":"🔤","вид":"ловушка","раздел":"⚠️ essen и trinken — один обычный, один хамелеон","урок":"urok14","урокИмя":"Урок 14","html":"<span class=\"big\">essen — из тех самых глаголов-хамелеонов (урок 8)</span>\n      В формах <b>du</b> и <b>er/sie/es</b> корневая <b>e меняется на i</b>: <i>du <b>i</b>sst</i>, <i>er <b>i</b>sst</i>. И заметь: у <i>du</i> и <i>er</i> форма получается <b>одинаковая</b> — <i>isst</i>. Это единственная сложность темы.<br><br>\n      А <b>trinken</b> — обычный, спрягается как <i>machen</i> из урока 3. Никаких сюрпризов.","текст":"essen — из тех самых глаголов-хамелеонов (урок 8) В формах du и er/sie/es корневая e меняется на i: du isst, er isst. И заметь: у du и er форма получается одинаковая — isst. Это единственная сложность темы. А trinken — обычный, спрягается как machen из урока 3. Никаких сюрпризов."},{"id":"15eacaca22","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"Прогноз: что будет завтра","урок":"urok16","урокИмя":"Урок 16","html":"Будущее время в разговорной погоде делается глаголом <b class=\"hl\">werden</b> = «становиться»: <i>Morgen <b>wird</b> es kalt</i> — «завтра станет холодно».<br><br>\n      Это тот самый <i>werden</i>, который Полина проходила у Даши в списке глаголов-исключений. Пока достаточно запомнить одну форму — <b>wird</b> (для es), её хватает на всю погоду.","текст":"Будущее время в разговорной погоде делается глаголом werden = «становиться»: Morgen wird es kalt — «завтра станет холодно». Это тот самый werden, который Полина проходила у Даши в списке глаголов-исключений. Пока достаточно запомнить одну форму — wird (для es), её хватает на всю погоду."},{"id":"ea3ac4e340","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"sein (быть) — самый неправильный","урок":"urok8","урокИмя":"Урок 8","html":"У <b>sein</b> формы вообще не похожи на инфинитив — их просто <b class=\"hl\">учат наизусть</b>, как «я есмь, ты еси» в старорусском. Зато он нужен постоянно: в немецком нельзя сказать «я врач», только «я <i>есть</i> врач» — <i>Ich bin Arzt</i>.","текст":"У sein формы вообще не похожи на инфинитив — их просто учат наизусть, как «я есмь, ты еси» в старорусском. Зато он нужен постоянно: в немецком нельзя сказать «я врач», только «я есть врач» — Ich bin Arzt."},{"id":"5396aaf5a1","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"haben (иметь)","урок":"urok8","урокИмя":"Урок 8","html":"<b>haben</b> почти правильный — «ломаются» только две формы: <b class=\"hl\">du hast</b> и <b class=\"hl\">er hat</b> (выпадает <i>b</i>). Остальные как обычно. Для врача глагол №1: все жалобы пациента идут через «у меня есть…».","текст":"haben почти правильный — «ломаются» только две формы: du hast и er hat (выпадает b). Остальные как обычно. Для врача глагол №1: все жалобы пациента идут через «у меня есть…»."},{"id":"b6f2de2791","тема":"Числа, время, даты","знак":"🔢","вид":"правило","раздел":"Числа «задом наперёд» (21–99)","урок":"dasha1","урокИмя":"Занятие 1 с Дашей","html":"<b>После сотни — снова слева направо:</b> 105 = <i>hundertfünf</i>, 128 = <i>hundert</i> + «задом наперёд» хвост <i>achtundzwanzig</i>. Сотни и тысячи по той же схеме.","текст":"После сотни — снова слева направо: 105 = hundertfünf, 128 = hundert + «задом наперёд» хвост achtundzwanzig. Сотни и тысячи по той же схеме."},{"id":"7e48084406","тема":"Числа, время, даты","знак":"🔢","вид":"ловушка","раздел":"Числа «задом наперёд» (21–99)","урок":"dasha1","урокИмя":"Занятие 1 с Дашей","html":"<span class=\"big\">Главное правило: единицы ПЕРЕД десятками</span>\n      21 = «один и двадцать» → <b>einundzwanzig</b>. Союз <b>und</b> остаётся внутри слова. Всё пишется <b>одним словом</b> — до миллиона. От миллиона отдельно: <i>eine Million</i>.","текст":"Главное правило: единицы ПЕРЕД десятками 21 = «один и двадцать» → einundzwanzig. Союз und остаётся внутри слова. Всё пишется одним словом — до миллиона. От миллиона отдельно: eine Million."},{"id":"a1034ad06a","тема":"Числа, время, даты","знак":"🔢","вид":"правило","раздел":"Порядковые числительные","урок":"dasha1","урокИмя":"Занятие 1 с Дашей","html":"Правило в два пункта: числа <b class=\"hl\">0–19</b> → окончание <b class=\"hl\">-te</b>; от <b class=\"hl\">20</b> → окончание <b class=\"hl\">-ste</b>. Всегда в самый конец слова, в середину ничего не вставляется: <i>vierundzwanzig<b>ste</b></i>.","текст":"Правило в два пункта: числа 0–19 → окончание -te; от 20 → окончание -ste. Всегда в самый конец слова, в середину ничего не вставляется: vierundzwanzigste."},{"id":"b1e047a80a","тема":"Числа, время, даты","знак":"🔢","вид":"ловушка","раздел":"Порядковые числительные","урок":"dasha1","урокИмя":"Занятие 1 с Дашей","html":"<b>4 исключения (наизусть):</b> 1 → <b>erste</b> (не «einte»), 3 → <b>dritte</b>, 7 → <b>siebte</b> (теряет -en), 8 → <b>achte</b> (одна t).","текст":"4 исключения (наизусть): 1 → erste (не «einte»), 3 → dritte, 7 → siebte (теряет -en), 8 → achte (одна t)."},{"id":"28f0a2c4f5","тема":"Числа, время, даты","знак":"🔢","вид":"правило","раздел":"Времена года и месяцы — предлог im","урок":"dasha1","урокИмя":"Занятие 1 с Дашей","html":"Все времена года и все месяцы — <b class=\"hl\">мужского рода (der)</b>. С ними используем предлог <b class=\"hl\">im</b>.","текст":"Все времена года и все месяцы — мужского рода (der). С ними используем предлог im."},{"id":"9d342cd934","тема":"Числа, время, даты","знак":"🔢","вид":"ловушка","раздел":"Правило чтения: ei или ie","урок":"dasha1","урокИмя":"Занятие 1 с Дашей","html":"<span class=\"big\">На этом Григорий спотыкался — Даша объяснила отдельно</span>\n      <b>ei</b> = «ай» (сначала e, потом i) · <b>ie</b> = долгое «и» (сначала i, потом e).<br>\n      Даша призналась, что сама несколько месяцев не могла это запомнить в начале — это нормально.","текст":"На этом Григорий спотыкался — Даша объяснила отдельно ei = «ай» (сначала e, потом i) · ie = долгое «и» (сначала i, потом e). Даша призналась, что сама несколько месяцев не могла это запомнить в начале — это нормально."},{"id":"f1087969b6","тема":"Числа, время, даты","знак":"🔢","вид":"правило","раздел":"«Который час?» и полные часы","урок":"urok10","урокИмя":"Урок 10","html":"Спросить время: <b class=\"hl\">Wie spät ist es?</b> или <b>Wie viel Uhr ist es?</b> Ответ: <b>Es ist … Uhr</b> (сейчас … часов). Слово <b>Uhr</b> = «часов», не забывай его.","текст":"Спросить время: Wie spät ist es? или Wie viel Uhr ist es? Ответ: Es ist … Uhr (сейчас … часов). Слово Uhr = «часов», не забывай его."},{"id":"0b6f5e64a3","тема":"Числа, время, даты","знак":"🔢","вид":"правило","раздел":"Официальное время (24 часа) — для расписаний","урок":"urok10","урокИмя":"Урок 10","html":"В расписаниях, у врача, на вокзале — <b>всегда 24 часа</b>, и читается просто: <b class=\"hl\">часы + Uhr + минуты</b>. 14:30 = <i>vierzehn Uhr dreißig</i>. Ошибиться невозможно — это твой рабочий формат.","текст":"В расписаниях, у врача, на вокзале — всегда 24 часа, и читается просто: часы + Uhr + минуты. 14:30 = vierzehn Uhr dreißig. Ошибиться невозможно — это твой рабочий формат."},{"id":"08cdeba338","тема":"Числа, время, даты","знак":"🔢","вид":"ловушка","раздел":"⚠️ Ловушка вторая: этажи сдвинуты на один","урок":"urok15","урокИмя":"Урок 15","html":"<span class=\"big\">der erste Stock — это наш ВТОРОЙ этаж</span>\n      Первый этаж у немцев не считается «первым»: он называется <b>das Erdgeschoss</b> (буквально «земляной этаж»). Счёт начинается с того, что выше:<br><br>\n      Erdgeschoss = наш 1-й &nbsp;·&nbsp; erster Stock = наш 2-й &nbsp;·&nbsp; zweiter Stock = наш 3-й<br><br>\n      Ты это уже видел в уроке 5 с порядковыми числами. Здесь оно становится практическим: «квартира im dritten Stock» — это подъём на четыре этажа. Без лифта — существенно.","текст":"der erste Stock — это наш ВТОРОЙ этаж Первый этаж у немцев не считается «первым»: он называется das Erdgeschoss (буквально «земляной этаж»). Счёт начинается с того, что выше: Erdgeschoss = наш 1-й &nbsp;·&nbsp; erster Stock = наш 2-й &nbsp;·&nbsp; zweiter Stock = наш 3-й Ты это уже видел в уроке 5 с порядковыми числами. Здесь оно становится практическим: «квартира im dritten Stock» — это подъём на четыре этажа. Без лифта — существенно."},{"id":"b84a8896bf","тема":"Числа, время, даты","знак":"🔢","вид":"ловушка","раздел":"⚠️ Ловушка третья, самая дорогая: Kaltmiete или Warmmiete","урок":"urok15","урокИмя":"Урок 15","html":"<span class=\"big\">В объявлении почти всегда пишут холодную — она меньше</span>\n      <b>Kaltmiete</b> [кальтмитэ] — «холодная» аренда, <b>только за квадратные метры</b>. Отопление, вода, вывоз мусора сюда НЕ входят.<br>\n      <b>Nebenkosten</b> [нэбэнкостэн] — те самые «побочные расходы» сверху, обычно 150–350 € в месяц.<br>\n      <b>Warmmiete</b> [вармитэ] — «тёплая», то есть Kaltmiete + Nebenkosten. <b>Вот это ты реально платишь.</b><br><br>\n      И третья сумма при въезде: <b>Kaution</b> (залог) — по закону до трёх холодных аренд, возвращается при выезде. То есть на старте нужно иметь примерно четыре месячных платежа сразу.","текст":"В объявлении почти всегда пишут холодную — она меньше Kaltmiete [кальтмитэ] — «холодная» аренда, только за квадратные метры. Отопление, вода, вывоз мусора сюда НЕ входят. Nebenkosten [нэбэнкостэн] — те самые «побочные расходы» сверху, обычно 150–350 € в месяц. Warmmiete [вармитэ] — «тёплая», то есть Kaltmiete + Nebenkosten. Вот это ты реально платишь. И третья сумма при въезде: Kaution (залог) — по закону до трёх холодных аренд, возвращается при выезде. То есть на старте нужно иметь примерно четыре месячных платежа сразу."},{"id":"a8768598d3","тема":"Числа, время, даты","знак":"🔢","вид":"правило","раздел":"13–19 — «цифра + zehn»","урок":"urok5","урокИмя":"Урок 5","html":"Берём единицу и приклеиваем <b class=\"hl\">-zehn</b> (десять): drei + zehn = <i>dreizehn</i> (13). Мелкие изменения: 16 <i>sechzehn</i> (без -s), 17 <i>siebzehn</i> (без -en).","текст":"Берём единицу и приклеиваем -zehn (десять): drei + zehn = dreizehn (13). Мелкие изменения: 16 sechzehn (без -s), 17 siebzehn (без -en)."},{"id":"16f272f452","тема":"Числа, время, даты","знак":"🔢","вид":"правило","раздел":"Десятки: 20–100","урок":"urok5","урокИмя":"Урок 5","html":"Почти все на <b class=\"hl\">-zig</b>. Три исключения в написании: <b>dreißig</b> (30, через -ßig), <b>sechzig</b> (60, без -s), <b>siebzig</b> (70, без -en).","текст":"Почти все на -zig. Три исключения в написании: dreißig (30, через -ßig), sechzig (60, без -s), siebzig (70, без -en)."},{"id":"4fe3497bdf","тема":"Числа, время, даты","знак":"🔢","вид":"ловушка","раздел":"ГЛАВНАЯ ЛОВУШКА: числа «задом наперёд»","урок":"urok5","урокИмя":"Урок 5","html":"В двузначных немцы называют <b>сначала единицы, потом десятки</b>, через <b>und</b> (и). 24 = буквально «четыре-и-двадцать» → <b>vierundzwanzig</b>. Всё одним словом. И eins теряет -s: 21 = <b>einundzwanzig</b>.","текст":"В двузначных немцы называют сначала единицы, потом десятки, через und (и). 24 = буквально «четыре-и-двадцать» → vierundzwanzig. Всё одним словом. И eins теряет -s: 21 = einundzwanzig."},{"id":"1057480d89","тема":"Числа, время, даты","знак":"🔢","вид":"правило","раздел":"Порядковые числительные: какой по счёту?","урок":"urok5","урокИмя":"Урок 5","html":"Обычное число отвечает «сколько?», порядковое — «<b>какой по счёту?</b>» (первый, второй, третий). Правило простое:\n      от 1 до 19 добавляем <b class=\"hl\">-te</b>, от 20 и выше — <b class=\"hl\">-ste</b>. Перед словом почти всегда стоит артикль <i>der/die/das</i>.","текст":"Обычное число отвечает «сколько?», порядковое — «какой по счёту?» (первый, второй, третий). Правило простое: от 1 до 19 добавляем -te, от 20 и выше — -ste. Перед словом почти всегда стоит артикль der/die/das."},{"id":"8f27c0acc2","тема":"Числа, время, даты","знак":"🔢","вид":"правило","раздел":"Порядковые числительные: какой по счёту?","урок":"urok5","урокИмя":"Урок 5","html":"От 20 — окончание <b class=\"hl\">-ste</b>: der zwanzig<b>ste</b>, der einundzwanzig<b>ste</b>, der hundert<b>ste</b>.","текст":"От 20 — окончание -ste: der zwanzigste, der einundzwanzigste, der hundertste."},{"id":"d8e85a13bf","тема":"Числа, время, даты","знак":"🔢","вид":"ловушка","раздел":"Порядковые числительные: какой по счёту?","урок":"urok5","урокИмя":"Урок 5","html":"Запомни 4 исключения (учат наизусть): <b>1 — erste</b> (не «einte»), <b>3 — dritte</b>, <b>7 — siebte</b> (без -en), <b>8 — achte</b> (одна t).","текст":"Запомни 4 исключения (учат наизусть): 1 — erste (не «einte»), 3 — dritte, 7 — siebte (без -en), 8 — achte (одна t)."},{"id":"a9acab7126","тема":"Числа, время, даты","знак":"🔢","вид":"ловушка","раздел":"Порядковые в работе врача","урок":"urok5","урокИмя":"Урок 5","html":"Важный нюанс про этажи: <b>der erste Stock = наш «второй этаж»</b> (первый над землёй). Наш первый этаж немцы зовут <i>Erdgeschoss</i> (земляной этаж).","текст":"Важный нюанс про этажи: der erste Stock = наш «второй этаж» (первый над землёй). Наш первый этаж немцы зовут Erdgeschoss (земляной этаж)."},{"id":"d2ac687593","тема":"Числа, время, даты","знак":"🔢","вид":"правило","раздел":"Даты и «первое, второе…» (порядковые)","урок":"urok6","урокИмя":"Урок 6","html":"Числа-порядковые: до 19 — число + <b>-te</b> (der vier<b>te</b> = четвёртый), от 20 — число + <b>-ste</b> (der zwanzig<b>ste</b>). Исключения: <b class=\"hl\">erste</b> (1), <b class=\"hl\">dritte</b> (3), <b class=\"hl\">siebte</b> (7), <b class=\"hl\">achte</b> (8). Дата: <i>am + порядковое + месяц</i> → <i>am zehnten Oktober</i>. Подробно порядковые разберём отдельно — пока хватит для дат.","текст":"Числа-порядковые: до 19 — число + -te (der vierte = четвёртый), от 20 — число + -ste (der zwanzigste). Исключения: erste (1), dritte (3), siebte (7), achte (8). Дата: am + порядковое + месяц → am zehnten Oktober. Подробно порядковые разберём отдельно — пока хватит для дат."},{"id":"f7624989c3","тема
