eißt не меняется: Das heißt, ein Blutgerinnsel verschließt eine Vene.","ти":14,"пи":8,"подтема":"Слова занятия"},{"id":"0a5f60e68a","тема":"Общение и обращение","знак":"💬","вид":"правило","раздел":"⭐ Слова с двойным дном","урок":"urok55","урокИмя":"Урок 56","html":"<b>«Я не могу отличить голову от садового забора».</b> Так араб у Шами сказал врачу — это не бред и не психиатрия, а обычное арабское выражение: «я растерян». По-немецки: <i>Ich bin durcheinander.</i><br><br>\n      <b>Фрау Айдоган и «печень».</b> Турчанка давно жалуется на боль в печени, ей много раз делали биопсию и лапароскопию — ничего. Решение книги: турецкое <i>ciğer</i> — это и печень, и «нутро», душа. «Болит печень» могло значить «мне тяжело, одиноко, грустно». Спросить про настроение было бы дешевле и полезнее.<br><br>\n      <b>Herr H. и свинина.</b> Мусульманин оставил мясо на тарелке, медсестра успокоила: «это не свинина». А он просто вегетарианец. Вера у всех проживается по-разному — <b>спросите, а не решайте за пациента</b>.<br><br>\n      <b>abnehmen.</b> <i>Blut abnehmen</i> — брать кровь, но <i>abnehmen</i> ещё и «худеть». Пациент может перепутать с <i>wegnehmen</i> — «отнимать» (пример из гл. 10 учебника): «зачем вы хотите забрать мою кровь?»","текст":"«Я не могу отличить голову от садового забора». Так араб у Шами сказал врачу — это не бред и не психиатрия, а обычное арабское выражение: «я растерян». По-немецки: Ich bin durcheinander. Фрау Айдоган и «печень». Турчанка давно жалуется на боль в печени, ей много раз делали биопсию и лапароскопию — ничего. Решение книги: турецкое ciğer — это и печень, и «нутро», душа. «Болит печень» могло значить «мне тяжело, одиноко, грустно». Спросить про настроение было бы дешевле и полезнее. Herr H. и свинина. Мусульманин оставил мясо на тарелке, медсестра успокоила: «это не свинина». А он просто вегетарианец. Вера у всех проживается по-разному — спросите, а не решайте за пациента. abnehmen. Blut abnehmen — брать кровь, но abnehmen ещё и «худеть». Пациент может перепутать с wegnehmen — «отнимать» (пример из гл. 10 учебника): «зачем вы хотите забрать мою кровь?»","ти":14,"пи":8,"подтема":"Слова занятия"},{"id":"1c2857a393","тема":"Произношение и письмо","знак":"🗣","вид":"правило","раздел":"Слова занятия","урок":"dasha10","урокИмя":"Занятие 10 с Дашей","html":"<b>laut ↔ leise</b> — громко ↔ тихо (и прилагательные, и наречия). <b>hier ↔ dort</b> — здесь ↔ там.<br>\n      <b>schlecht</b> читается «шлехт» (Гриша говорил «шляхт»). <b>Hans</b> — «Ханс», не «Ганс».<br>\n      <b>Geld</b> (деньги) похоже на <i>Gold</i> — золото. <b>glücklich</b> — счастливый (Гриша: «как клюква»).","текст":"laut ↔ leise — громко ↔ тихо (и прилагательные, и наречия). hier ↔ dort — здесь ↔ там. schlecht читается «шлехт» (Гриша говорил «шляхт»). Hans — «Ханс», не «Ганс». Geld (деньги) похоже на Gold — золото. glücklich — счастливый (Гриша: «как клюква»).","ти":14,"пи":8,"подтема":"Слова занятия"},{"id":"69677dcccb","тема":"Слова, которые путают","знак":"⚠️","вид":"правило","раздел":"⚠️ Ошибки занятия","урок":"dasha10","урокИмя":"Занятие 10 с Дашей","html":"1. Нет глагола → <b>ist</b>. 2. <i>sie</i> (она) → <b>ist</b>, не sind. 3. Двое → <b>sind</b>.\n      4. «Не дома» — состояние → <b>ist</b>. 5. Боль «имеют» → <b>hast</b>. 6. Хобби «являются» → <b>sind</b>.<br>\n      И перевод: <i>Wer hat eine Idee?</i> — «<b>у кого</b> есть идея?», а не «у нас есть идея»: <i>wer</i> — кто.","текст":"1. Нет глагола → ist. 2. sie (она) → ist, не sind. 3. Двое → sind. 4. «Не дома» — состояние → ist. 5. Боль «имеют» → hast. 6. Хобби «являются» → sind. И перевод: Wer hat eine Idee? — «у кого есть идея?», а не «у нас есть идея»: wer — кто.","ти":14,"пи":8,"подтема":"Слова занятия"},{"id":"45af70d851","тема":"Слова, которые путают","знак":"⚠️","вид":"ловушка","раздел":"Новые глаголы — и три разбора, где легко перепутать","урок":"dasha3","урокИмя":"Занятие 3 с Дашей","html":"<span class=\"big\">Разбор 1: kennen или können — одна точка меняет смысл</span>\n      <b>kennen</b> (без точек над o) — <b>знать</b> кого-то или что-то. <i>Ich kenne Eva</i> — я знаю Еву.<br>\n      <b>können</b> (с точками) — <b>мочь, уметь</b>. Это модальный глагол.<br><br>\n      Слова похожи на вид, но это совершенно разные вещи. Даша специально остановилась: «не забываем, это не können, здесь нет смешной о».","текст":"Разбор 1: kennen или können — одна точка меняет смысл kennen (без точек над o) — знать кого-то или что-то. Ich kenne Eva — я знаю Еву. können (с точками) — мочь, уметь. Это модальный глагол. Слова похожи на вид, но это совершенно разные вещи. Даша специально остановилась: «не забываем, это не können, здесь нет смешной о».","ти":14,"пи":8,"подтема":"Слова занятия"},{"id":"ea61394435","тема":"Слова, которые путают","знак":"⚠️","вид":"ловушка","раздел":"Новые глаголы — и три разбора, где легко перепутать","урок":"dasha3","урокИмя":"Занятие 3 с Дашей","html":"<span class=\"big\">Разбор 2: wohnen или leben — оба «жить»</span>\n      <b>wohnen</b> — жить <b>где-то физически</b>: город, страна, квартира. Про адрес.<br>\n      <b>leben</b> — про жизнь <b>вообще</b>, более отвлечённо: «жить счастливо», «жить хорошо».<br><br>\n      Даша успокоила: если перепутать — <b>ошибкой не будет</b>, их можно употреблять как синонимы. <i>Ich wohne in Moskau</i> и <i>Ich lebe in Moskau</i> — оба правильно.","текст":"Разбор 2: wohnen или leben — оба «жить» wohnen — жить где-то физически: город, страна, квартира. Про адрес. leben — про жизнь вообще, более отвлечённо: «жить счастливо», «жить хорошо». Даша успокоила: если перепутать — ошибкой не будет, их можно употреблять как синонимы. Ich wohne in Moskau и Ich lebe in Moskau — оба правильно.","ти":14,"пи":8,"подтема":"Слова занятия"},{"id":"f1a7fb197e","тема":"Слова, которые путают","знак":"⚠️","вид":"ловушка","раздел":"Новые глаголы — и три разбора, где легко перепутать","урок":"dasha3","урокИмя":"Занятие 3 с Дашей","html":"<span class=\"big\">Разбор 3: studieren или lernen — оба «учиться»</span>\n      <b>studieren</b> — учиться <b>в университете</b>, на специальности. Область применения узкая: только про вуз. <i>Ich studiere Physik</i> — я учусь на физика.<br>\n      <b>lernen</b> — <b>учить что-то</b>: предмет, язык, материал. <i>Du lernst Deutsch</i> — ты учишь немецкий.","текст":"Разбор 3: studieren или lernen — оба «учиться» studieren — учиться в университете, на специальности. Область применения узкая: только про вуз. Ich studiere Physik — я учусь на физика. lernen — учить что-то: предмет, язык, материал. Du lernst Deutsch — ты учишь немецкий.","ти":14,"пи":8,"подтема":"Слова занятия"},{"id":"3c5291ab5c","тема":"Слова, которые путают","знак":"⚠️","вид":"правило","раздел":"Диалоги","урок":"urok16","урокИмя":"Урок 17","html":"Коллеги в немецких клиниках часто на <i>du</i> — поэтому <i>Nimm meinen</i> (урок 13), а не <i>Nehmen Sie</i>. С пациентами — только <i>Sie</i>.","текст":"Коллеги в немецких клиниках часто на du — поэтому Nimm meinen (урок 13), а не Nehmen Sie. С пациентами — только Sie.","ти":14,"пи":8,"подтема":"Слова занятия"},{"id":"5308ecf413","тема":"Устойчивые выражения","знак":"🔗","вид":"правило","раздел":"⭐ Уменьшительное -chen и выражения из текста","урок":"dasha11","урокИмя":"Занятие 11 с Дашей","html":"<b>sich gegenseitig unterstützen</b> — поддерживать друг друга. <i>gegen</i> — против, <i>die Seite</i> — сторона: «с обеих сторон». Гриша: «очень немецкое слово».<br>\n      <b>ins Gespräch kommen</b> — разговориться, начать разговор. <i>das Gespräch</i> — от <i>sprechen</i> (говорить).<br>\n      <b>stolz auf</b> — гордиться чем-то, всегда с <b>auf</b>: <i>stolz auf meine Arbeit, stolz auf meine Noten</i>.<br>\n      <b>erschöpft</b> = <i>sehr müde</i>, вымотанный. <b>entdecken</b> — открывать для себя новое (не дверь!).","текст":"sich gegenseitig unterstützen — поддерживать друг друга. gegen — против, die Seite — сторона: «с обеих сторон». Гриша: «очень немецкое слово». ins Gespräch kommen — разговориться, начать разговор. das Gespräch — от sprechen (говорить). stolz auf — гордиться чем-то, всегда с auf: stolz auf meine Arbeit, stolz auf meine Noten. erschöpft = sehr müde, вымотанный. entdecken — открывать для себя новое (не дверь!).","ти":14,"пи":8,"подтема":"Слова занятия"},{"id":"a74762dce1","тема":"Устойчивые выражения","знак":"🔗","вид":"правило","раздел":"Диалоги","урок":"urok20","урокИмя":"Урок 21","html":"<i>Was kann ich für Sie tun?</i> — дословно «что я могу для Вас сделать?», стандартное «чем могу помочь?» в любом магазине и в регистратуре.","текст":"Was kann ich für Sie tun? — дословно «что я могу для Вас сделать?», стандартное «чем могу помочь?» в любом магазине и в регистратуре.","ти":14,"пи":8,"подтема":"Слова занятия"},{"id":"3840ba3df2","тема":"Разное","знак":"📎","вид":"правило","раздел":"⚠️ Ошибки занятия","урок":"dasha11","урокИмя":"Занятие 11 с Дашей","html":"1. «Из» — <b>aus</b>. 2. Томас — это «он» → <b>ist</b> (Гриша спросил: «бист — ты?»). 3. Много дел — <b>viel zu tun</b>. 4. Продавать — <b>verkaufen</b>, продавщица — <b>Verkäuferin</b>; <i>ankaufen</i> — это скупать.","текст":"1. «Из» — aus. 2. Томас — это «он» → ist (Гриша спросил: «бист — ты?»). 3. Много дел — viel zu tun. 4. Продавать — verkaufen, продавщица — Verkäuferin; ankaufen — это скупать.","ти":14,"пи":8,"подтема":"Слова занятия"},{"id":"24c2da8e13","тема":"Разное","знак":"📎","вид":"правило","раздел":"⭐⭐ Упражнение: 25 предложений","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"<b>Как этим пользоваться.</b> Сначала прочитайте немецкую строчку и попробуйте перевести сами.\n      Только потом смотрите на перевод под ней. Так упражнение работает второй раз.","текст":"Как этим пользоваться. Сначала прочитайте немецкую строчку и попробуйте перевести сами. Только потом смотрите на перевод под ней. Так упражнение работает второй раз.","ти":14,"пи":8,"подтема":"Слова занятия"},{"id":"395a29cb51","тема":"Разное","знак":"📎","вид":"правило","раздел":"Новые слова из игры","урок":"dasha6","урокИмя":"Занятие 6 с Дашей","html":"<b>Пары, которые удобно учить вместе</b>, как советовала Даша: <b>schwer</b> — сложно / <b>leicht</b> — легко; <b>richtig</b> — правильно / <b>falsch</b> — неправильно; <b>verheiratet</b> — женат / <b>ledig</b> — не женат.<br>\n      <b>der Arbeitsplatz</b> = die Arbeit (работа) + der Platz (место) — «место работы». Род — по последнему слову: der.<br>\n      <b>lang</b> — длинный, а <b>wie lange</b> — «как долго»: <i>Wie lange hast du Pause?</i>","текст":"Пары, которые удобно учить вместе, как советовала Даша: schwer — сложно / leicht — легко; richtig — правильно / falsch — неправильно; verheiratet — женат / ledig — не женат. der Arbeitsplatz = die Arbeit (работа) + der Platz (место) — «место работы». Род — по последнему слову: der. lang — длинный, а wie lange — «как долго»: Wie lange hast du Pause?","ти":14,"пи":8,"подтема":"Слова занятия"},{"id":"f3b6d9088d","тема":"Разное","знак":"📎","вид":"правило","раздел":"Полезные слова с урока","урок":"polya5","урокИмя":"Занятие 5 Полины","html":"<b>Хоть где-то логика:</b> <i>die Frage</i> (вопрос) → <i>fragen</i> (спрашивать), <i>die Antwort</i> (ответ) → <i>antworten</i> (отвечать). Существительное и глагол — одного корня.","текст":"Хоть где-то логика: die Frage (вопрос) → fragen (спрашивать), die Antwort (ответ) → antworten (отвечать). Существительное и глагол — одного корня.","ти":14,"пи":8,"подтема":"Слова занятия"},{"id":"6725e672da","тема":"Разное","знак":"📎","вид":"правило","раздел":"Слова из разговора","урок":"polya8","урокИмя":"Занятие 8 Полины","html":"<b>manchmal</b> и <b>ab und zu</b> — это одно и то же: «иногда», «время от времени».\n      Даша напомнила: можно говорить и так, и так, они взаимозаменяемы.","текст":"manchmal и ab und zu — это одно и то же: «иногда», «время от времени». Даша напомнила: можно говорить и так, и так, они взаимозаменяемы.","ти":14,"пи":8,"подтема":"Слова занятия"},{"id":"b834388327","тема":"Разное","знак":"📎","вид":"правило","раздел":"Диалоги","урок":"urok15","урокИмя":"Урок 16","html":"<i>Auf Wiederhören!</i> — «до свидания» по телефону: «до нового слышания», ведь увидеться нельзя. Вживую — <i>Auf Wiedersehen</i>.","текст":"Auf Wiederhören! — «до свидания» по телефону: «до нового слышания», ведь увидеться нельзя. Вживую — Auf Wiedersehen.","ти":14,"пи":8,"подтема":"Слова занятия"},{"id":"361d12f199","тема":"Разное","знак":"📎","вид":"правило","раздел":"Лучевая диагностика: слова","урок":"urok52","урокИмя":"Урок 53","html":"УЗИ: датчик — <b>der Schallkopf</b>, гипоэхогенный — <b>echoarm</b> (echoreich, echofrei). КТ: срезы — <b>die Schichten</b>, светлее — hyperdens, темнее — hypodens. МРТ — магнитное поле. Защита от излучения — свинцовый фартук. Контраст может вызвать <b>Unverträglichkeitsreaktion</b> — реакцию непереносимости.","текст":"УЗИ: датчик — der Schallkopf, гипоэхогенный — echoarm (echoreich, echofrei). КТ: срезы — die Schichten, светлее — hyperdens, темнее — hypodens. МРТ — магнитное поле. Защита от излучения — свинцовый фартук. Контраст может вызвать Unverträglichkeitsreaktion — реакцию непереносимости.","ти":14,"пи":8,"подтема":"Слова занятия"},{"id":"a596e22fed","тема":"Модальные глаголы","знак":"🔑","вид":"правило","раздел":"Повторили модальные глаголы","урок":"dasha3","урокИмя":"Занятие 3 с Дашей","html":"Их <b class=\"hl\">шесть</b>. Григорий назвал все шесть сам — Даша осталась довольна. Плюс отдельно всплыл седьмой, <i>mögen</i>, с интересной историей (см. ниже).","текст":"Их шесть. Григорий назвал все шесть сам — Даша осталась довольна. Плюс отдельно всплыл седьмой, mögen, с интересной историей (см. ниже).","ти":15,"пи":0,"подтема":"Похожие слова"},{"id":"4a5cac3124","тема":"Модальные глаголы","знак":"🔑","вид":"правило","раздел":"Повторили модальные глаголы","урок":"dasha3","урокИмя":"Занятие 3 с Дашей","html":"И главное про модальные, что уже было: когда модальный стоит с другим глаголом, <b class=\"hl\">второй глагол уезжает в самый конец предложения и стоит там в начальной форме</b> (с окончанием -en).","текст":"И главное про модальные, что уже было: когда модальный стоит с другим глаголом, второй глагол уезжает в самый конец предложения и стоит там в начальной форме (с окончанием -en).","ти":15,"пи":0,"подтема":"Похожие слова"},{"id":"5f05485685","тема":"Модальные глаголы","знак":"🔑","вид":"ловушка","раздел":"Повторили модальные глаголы","урок":"dasha3","урокИмя":"Занятие 3 с Дашей","html":"<span class=\"big\">Осторожно: sollen и müssen — оба «должен», но по-разному</span>\n      <b>müssen</b> — «обязан», жёсткая необходимость. Так надо, деваться некуда.<br>\n      <b>sollen</b> — «следует, нужно». Мягче: так правильно, так советуют, так положено.<br><br>\n      И ещё: <b>dürfen</b> — это не «я разрешаю», а <b>«мне разрешено»</b>. Разрешение получаю я, а не выдаю.","текст":"Осторожно: sollen и müssen — оба «должен», но по-разному müssen — «обязан», жёсткая необходимость. Так надо, деваться некуда. sollen — «следует, нужно». Мягче: так правильно, так советуют, так положено. И ещё: dürfen — это не «я разрешаю», а «мне разрешено». Разрешение получаю я, а не выдаю.","ти":15,"пи":0,"подтема":"Похожие слова"},{"id":"dbfafc2b63","тема":"Прошедшее время","знак":"⏮","вид":"правило","раздел":"⭐ behandelnd или behandelt?","урок":"urok42","урокИмя":"Урок 43","html":"Одна буква меняет смысл на противоположный. <b>der behandelnde Arzt</b> — врач, который <b>лечит</b> (лечащий). <b>der behandelte Patient</b> — пациент, которого <b>лечили</b>. Вопрос простой: кто действует сам — Partizip I, над кем действуют — Partizip II.","текст":"Одна буква меняет смысл на противоположный. der behandelnde Arzt — врач, который лечит (лечащий). der behandelte Patient — пациент, которого лечили. Вопрос простой: кто действует сам — Partizip I, над кем действуют — Partizip II.","ти":15,"пи":0,"подтема":"Похожие слова"},{"id":"ee277b975e","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"Форма на du — для дома","урок":"urok13","урокИмя":"Урок 14","html":"Рецепт: берёшь форму <b>du</b> в настоящем времени и <b class=\"hl\">отрезаешь -st</b>. Больше ничего.<br>\n      <i>du komm<b>st</b> → <b>Komm!</b></i> &nbsp;·&nbsp; <i>du geh<b>st</b> → <b>Geh!</b></i><br><br>\n      Если основа кончается на -t или -d, добавляем <b>-e</b>, иначе не выговорить: <i>du wartest → <b>Warte!</b></i>","текст":"Рецепт: берёшь форму du в настоящем времени и отрезаешь -st. Больше ничего. du kommst → Komm! &nbsp;·&nbsp; du gehst → Geh! Если основа кончается на -t или -d, добавляем -e, иначе не выговорить: du wartest → Warte!","ти":15,"пи":0,"подтема":"Похожие слова"},{"id":"064036662b","тема":"Артикли и род","знак":"🎨","вид":"ловушка","раздел":"Тренировка: расставили артикли","урок":"polya10","урокИмя":"Занятие 10 Полины","html":"<span class=\"big\">Банан — особый случай</span>\n      Предложение было «она покупает бананы» — то есть какое-то неопределённое количество, без счёта. А у множественного числа неопределённого артикля нет вообще (правило из раздела 1). Поэтому здесь артикля не будет совсем: <b>Sie kauft Bananen.</b> Это тот самый нулевой артикль, о котором говорили на занятии 8.","текст":"Банан — особый случай Предложение было «она покупает бананы» — то есть какое-то неопределённое количество, без счёта. А у множественного числа неопределённого артикля нет вообще (правило из раздела 1). Поэтому здесь артикля не будет совсем: Sie kauft Bananen. Это тот самый нулевой артикль, о котором говорили на занятии 8.","ти":15,"пи":0,"подтема":"Похожие слова"},{"id":"9b0934db3c","тема":"Предлоги","знак":"🧭","вид":"ловушка","раздел":"⚠️ Пары, которые путают все","урок":"urok20","урокИмя":"Урок 21","html":"<span class=\"big\">nach или zu? aus или von?</span>\n      <b>nach</b> — в город и страну, а ещё домой: <i>nach Berlin, nach Deutschland, nach Hause</i>.<br>\n      <b>zu</b> — к человеку и в учреждение: <i>zum Arzt, zur Apotheke, zu meiner Mutter</i>. «Дома» — тоже с zu: <i>zu Hause</i>.<br><br>\n      <b>aus</b> — из страны, города, здания: <i>aus Russland, aus dem Krankenhaus</i>.<br>\n      <b>von</b> — от человека, с места: <i>vom Arzt, von meiner Mutter</i>.<br><br>\n      И вечная ловушка из урока 12: <b>seit</b> + то, что длится до сих пор → <b>настоящее время</b>: <i>Ich wohne seit zwei Jahren hier</i>.","текст":"nach или zu? aus или von? nach — в город и страну, а ещё домой: nach Berlin, nach Deutschland, nach Hause. zu — к человеку и в учреждение: zum Arzt, zur Apotheke, zu meiner Mutter. «Дома» — тоже с zu: zu Hause. aus — из страны, города, здания: aus Russland, aus dem Krankenhaus. von — от человека, с места: vom Arzt, von meiner Mutter. И вечная ловушка из урока 12: seit + то, что длится до сих пор → настоящее время: Ich wohne seit zwei Jahren hier.","ти":15,"пи":0,"подтема":"Похожие слова"},{"id":"a593f493b2","тема":"Порядок слов","знак":"📐","вид":"ловушка","раздел":"🎧 Марк рассказывает — richtig или falsch","урок":"dasha7","урокИмя":"Занятие 7 с Дашей","html":"<span class=\"big\">Где Гриша ошибся</span>\n      Услышал «Frankfurt» вместо «<b>Freiburg</b>» — города звучат очень похоже. Марк сказал, что семья живёт в Freiburg.<br>\n      Про самого Марка: он говорит <i>Ich nicht</i> — «я нет» (не актёр, как родители, дедушка и сестра), и учится на физика в Штутгарте.","текст":"Где Гриша ошибся Услышал «Frankfurt» вместо «Freiburg» — города звучат очень похоже. Марк сказал, что семья живёт в Freiburg. Про самого Марка: он говорит Ich nicht — «я нет» (не актёр, как родители, дедушка и сестра), и учится на физика в Штутгарте.","ти":15,"пи":0,"подтема":"Похожие слова"},{"id":"a4e6f0435d","тема":"Произношение и письмо","знак":"🗣","вид":"правило","раздел":"💶 Дёшево или дорого: billig, günstig, teuer","урок":"polya12","урокИмя":"Занятие 12 Полины","html":"<b>sehr teuer или zu teuer?</b> Это не одно и то же. <b>sehr teuer</b> — «очень дорого», но купить можно. <b>zu teuer</b> — «<span class=\"hl\">слишком</span> дорого», то есть не куплю. В диалоге покупательница сначала говорит «sehr teuer», а потом твёрдо — «zu teuer».<br><br>\n      <b>billig и günstig.</b> Даша дала их как синонимы, и в магазине так и есть. Маленький оттенок (моё добавление): <b>billig</b> иногда звучит как «дешёвка, низкое качество», а <b>günstig</b> — всегда хорошо: «выгодно, по хорошей цене». Если хочешь похвалить цену — бери günstig.","текст":"sehr teuer или zu teuer? Это не одно и то же. sehr teuer — «очень дорого», но купить можно. zu teuer — «слишком дорого», то есть не куплю. В диалоге покупательница сначала говорит «sehr teuer», а потом твёрдо — «zu teuer». billig и günstig. Даша дала их как синонимы, и в магазине так и есть. Маленький оттенок (моё добавление): billig иногда звучит как «дешёвка, низкое качество», а günstig — всегда хорошо: «выгодно, по хорошей цене». Если хочешь похвалить цену — бери günstig.","ти":15,"пи":0,"подтема":"Похожие слова"},{"id":"45239df4ce","тема":"Слова, которые путают","знак":"⚠️","вид":"ловушка","раздел":"💶 Дёшево или дорого: billig, günstig, teuer","урок":"polya12","урокИмя":"Занятие 12 Полины","html":"<span class=\"big\">schön или schon?</span>\n      Вопрос Полины: как не перепутать «красивый» и «уже». Разница в одной точке и в звуке: <b>schön</b> [шён] — красивый, с ö; <b>schon</b> [шон] — уже, обычное o.","текст":"schön или schon? Вопрос Полины: как не перепутать «красивый» и «уже». Разница в одной точке и в звуке: schön [шён] — красивый, с ö; schon [шон] — уже, обычное o.","ти":15,"пи":0,"подтема":"Похожие слова"},{"id":"357dd1de1f","тема":"Разное","знак":"📎","вид":"правило","раздел":"Стакан, чашка и «находиться»","урок":"polya11","урокИмя":"Занятие 11 Полины","html":"<b>das Glas</b> — стеклянный стакан. <b>der Becher</b> — стаканчик или кружка: пластиковый, бумажный, «стаканчик кофе с собой». <b>die Tasse</b> — чашка с ручкой.","текст":"das Glas — стеклянный стакан. der Becher — стаканчик или кружка: пластиковый, бумажный, «стаканчик кофе с собой». die Tasse — чашка с ручкой.","ти":15,"пи":0,"подтема":"Похожие слова"},{"id":"daf915b35b","тема":"Разное","знак":"📎","вид":"правило","раздел":"⚠️ aufräumen или putzen","урок":"polya8","урокИмя":"Занятие 8 Полины","html":"<b>aufräumen</b> — навести порядок: разложить вещи по местам. Ребёнок раскидал игрушки, вы за ним убрали — это <b>aufräumen</b>.<br><br>\n      <b>putzen</b> — почистить, помыть. Помыли пол, пропылесосили, надраили ванну — это <b>putzen</b>.\n      Даша назвала это «генеральной уборкой».","текст":"aufräumen — навести порядок: разложить вещи по местам. Ребёнок раскидал игрушки, вы за ним убрали — это aufräumen. putzen — почистить, помыть. Помыли пол, пропылесосили, надраили ванну — это putzen. Даша назвала это «генеральной уборкой».","ти":15,"пи":0,"подтема":"Похожие слова"},{"id":"1386c95898","тема":"Разное","знак":"📎","вид":"ловушка","раздел":"⚠️ aufräumen или putzen","урок":"polya8","урокИмя":"Занятие 8 Полины","html":"<span class=\"big\">Два разных вида уборки</span>\n      Полина спросила: «А убирать и прибираться — это не мыть?» Оказалось, у немцев это два глагола.","текст":"Два разных вида уборки Полина спросила: «А убирать и прибираться — это не мыть?» Оказалось, у немцев это два глагола.","ти":15,"пи":0,"подтема":"Похожие слова"},{"id":"1d1a3f43ef","тема":"Разное","знак":"📎","вид":"правило","раздел":"Пара или один глагол","урок":"urok46","урокИмя":"Урок 47","html":"Часто у пары есть простой близнец: <i>eine Entscheidung treffen = entscheiden</i>, <i>einen Antrag stellen = beantragen</i>. В разговоре годится и то, и другое. В письме — в выписке, в заявлении — пары звучат солиднее, и немцы их любят: это и есть «письменный стиль».","текст":"Часто у пары есть простой близнец: eine Entscheidung treffen = entscheiden, einen Antrag stellen = beantragen. В разговоре годится и то, и другое. В письме — в выписке, в заявлении — пары звучат солиднее, и немцы их любят: это и есть «письменный стиль».","ти":15,"пи":0,"подтема":"Похожие слова"},{"id":"0dbb5ba7ec","тема":"Устойчивые выражения","знак":"🔗","вид":"правило","раздел":"Устойчивые выражения","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"<b>spazieren gehen</b> — два глагола, которые ходят парой. Отдельно <i>spazieren</i> не используют,\n      только вместе с <i>gehen</i>. Переводится «идти гулять».<br><br>\n      <b>Urlaub machen</b> — дословно «делать отпуск», а по-русски «ездить в отпуск».\n      Даша рассказала, что видела в Вене табличку на двери врачебного кабинета: <i>Wir machen Urlaub</i>.","текст":"spazieren gehen — два глагола, которые ходят парой. Отдельно spazieren не используют, только вместе с gehen. Переводится «идти гулять». Urlaub machen — дословно «делать отпуск», а по-русски «ездить в отпуск». Даша рассказала, что видела в Вене табличку на двери врачебного кабинета: Wir machen Urlaub.","ти":16,"пи":0,"подтема":"Выражения и обороты"},{"id":"1b6f043eef","тема":"Устойчивые выражения","знак":"🔗","вид":"ловушка","раздел":"Устойчивые выражения","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"<span class=\"big\">На поезде = «с поездом»</span>\n      Мы говорим «<b>на</b> поезде, <b>на</b> машине, <b>на</b> автобусе».<br>\n      Немцы говорят дословно «<b>с</b> поездом» — <b>mit dem Zug</b>. Всегда предлог <b>mit</b>, для любого транспорта.","текст":"На поезде = «с поездом» Мы говорим «на поезде, на машине, на автобусе». Немцы говорят дословно «с поездом» — mit dem Zug. Всегда предлог mit, для любого транспорта.","ти":16,"пи":0,"подтема":"Выражения и обороты"},{"id":"e0f6ff8e6b","тема":"Устойчивые выражения","знак":"🔗","вид":"правило","раздел":"Совет мамы","урок":"polya7","урокИмя":"Занятие 7 Полины","html":"<b class=\"hl\">am besten</b> = «лучше всего». Это <b>превосходная степень</b> прилагательного — целая тема, до которой Даша обещала дойти отдельно. Пока просто запомни выражение целиком: <i>So geht es am besten</i> — «так оно лучше всего идёт».","текст":"am besten = «лучше всего». Это превосходная степень прилагательного — целая тема, до которой Даша обещала дойти отдельно. Пока просто запомни выражение целиком: So geht es am besten — «так оно лучше всего идёт».","ти":16,"пи":0,"подтема":"Выражения и обороты"},{"id":"e5fe869d78","тема":"Устойчивые выражения","знак":"🔗","вид":"правило","раздел":"Почему нельзя переводить дословно","урок":"urok30","урокИмя":"Урок 31","html":"Каждый из этих глаголов надо учить не отдельно, а сразу вместе с предлогом и падежом — как одну неразрывную фразу. Сравните, что происходит по-русски и по-немецки:","текст":"Каждый из этих глаголов надо учить не отдельно, а сразу вместе с предлогом и падежом — как одну неразрывную фразу. Сравните, что происходит по-русски и по-немецки:","ти":16,"пи":0,"подтема":"Выражения и обороты"},{"id":"ac7ad5f0bb","тема":"Устойчивые выражения","знак":"🔗","вид":"правило","раздел":"⭐ Почему нельзя переводить дословно","урок":"urok46","урокИмя":"Урок 47","html":"В паре главное — <b>существительное</b>, а глагол почти ничего не значит сам по себе, он просто «приклеен». Поэтому русский глагол в переводе обычно не подходит: принимать решение — не <i>nehmen</i>, а <b>treffen</b>; задать вопрос — не <i>fragen</i>, а <b>stellen</b>; оказать помощь — <b>leisten</b>. Учить такие пары только <b>целиком</b>, как одно слово.","текст":"В паре главное — существительное, а глагол почти ничего не значит сам по себе, он просто «приклеен». Поэтому русский глагол в переводе обычно не подходит: принимать решение — не nehmen, а treffen; задать вопрос — не fragen, а stellen; оказать помощь — leisten. Учить такие пары только целиком, как одно слово.","ти":16,"пи":0,"подтема":"Выражения и обороты"},{"id":"5f3c364eeb","тема":"Устойчивые выражения","знак":"🔗","вид":"правило","раздел":"Сокращения","урок":"urok54","урокИмя":"Урок 55","html":"Из таблицы 13.1 учебника и из флебологии. Пишут сокращением — читают целиком.","текст":"Из таблицы 13.1 учебника и из флебологии. Пишут сокращением — читают целиком.","ти":16,"пи":0,"подтема":"Выражения и обороты"},{"id":"a682a33f7b","тема":"Разное","знак":"📎","вид":"правило","раздел":"glauben — верить, казаться","урок":"dasha5","урокИмя":"Занятие 5 с Дашей","html":"<b>glauben</b> переводится двояко: «верить» (во что-то) и «казаться» («мне кажется»).\n      Оба значения — один и тот же глагол, разница только в русском переводе.","текст":"glauben переводится двояко: «верить» (во что-то) и «казаться» («мне кажется»). Оба значения — один и тот же глагол, разница только в русском переводе.","ти":17,"пи":0,"подтема":"Другое"},{"id":"e3483e64cd","тема":"Разное","знак":"📎","вид":"правило","раздел":"🎧 Кристиану звонят","урок":"polya17","урокИмя":"Занятие 17 Полины","html":"<b>der Schlüssel</b> — ключ, <b>der Schrankschlüssel</b> — ключ от шкафа (der Schrank + der Schlüssel). <b>Stifte</b> — ручки, карандаши. <b>Briefpapier</b> — бумага для писем. <b>wieder</b> — снова.","текст":"der Schlüssel — ключ, der Schrankschlüssel — ключ от шкафа (der Schrank + der Schlüssel). Stifte — ручки, карандаши. Briefpapier — бумага для писем. wieder — снова.","ти":17,"пи":0,"подтема":"Другое"},{"id":"8b938dd106","тема":"Разное","знак":"📎","вид":"правило","раздел":"Форма на ihr и «давайте…» (wir)","урок":"urok13","урокИмя":"Урок 14","html":"<b>ihr</b> совпадает с обычным настоящим временем, просто выбрасываем само слово <i>ihr</i>: <i>ihr kommt → <b class=\"hl\">Kommt!</b></i>. Учить отдельно нечего.","текст":"ihr совпадает с обычным настоящим временем, просто выбрасываем само слово ihr: ihr kommt → Kommt!. Учить отдельно нечего.","ти":17,"пи":0,"подтема":"Другое"},{"id":"5f48dfcb77","тема":"Разное","знак":"📎","вид":"правило","раздел":"lassen — три значения","урок":"urok28","урокИмя":"Урок 29","html":"<b>1. Поручить, добиться, чтобы сделал кто-то другой</b> — не сам, а через кого-то:","текст":"1. Поручить, добиться, чтобы сделал кто-то другой — не сам, а через кого-то:","ти":17,"пи":0,"подтема":"Другое"},{"id":"af7e1b5260","тема":"Разное","знак":"📎","вид":"правило","раздел":"⭐⭐ Самые нужные пары","урок":"urok46","урокИмя":"Урок 47","html":"Удобно запоминать по глаголам: у одного глагола — целое семейство пар.","текст":"Удобно запоминать по глаголам: у одного глагола — целое семейство пар.","ти":17,"пи":0,"подтема":"Другое"},{"id":"fae0d0c976","тема":"Разное","знак":"📎","вид":"правило","раздел":"Альтернативы","урок":"urok51","урокИмя":"Урок 52","html":"Альтернативы обязательны — и «ничего не делать» тоже альтернатива. У каждой — плюс и минус. <b>allerdings</b> — «правда, однако»: смягчённое «но».","текст":"Альтернативы обязательны — и «ничего не делать» тоже альтернатива. У каждой — плюс и минус. allerdings — «правда, однако»: смягчённое «но».","ти":17,"пи":0,"подтема":"Другое"}];
const ТАБЛИЦЫ = [{"id": "таб_обычный", "имя": "Обычные глаголы: окончания в настоящем времени", "знак": "🔤", "тема": "Глагол: спряжение", "слова": "спряжение обычный правильный слабый глагол окончания machen lernen arbeiten reisen präsens настоящее время", "шапка": ["", "окончание", "machen — делать", "lernen — учить", "wohnen — жить (где-то)", "kaufen — покупать", "arbeiten — работать", "reisen — путешествовать"], "строки": [["ich", "<b>-e</b>", "mache", "lerne", "wohne", "kaufe", "arbeite", "reise"], ["du", "<b>-st</b>", "machst", "lernst", "wohnst", "kaufst", "arbeitest", "reist"], ["er/sie/es", "<b>-t</b>", "macht", "lernt", "wohnt", "kauft", "arbeitet", "reist"], ["wir", "<b>-en</b>", "machen", "lernen", "wohnen", "kaufen", "arbeiten", "reisen"], ["ihr", "<b>-t</b>", "macht", "lernt", "wohnt", "kauft", "arbeitet", "reist"], ["sie/Sie", "<b>-en</b>", "machen", "lernen", "wohnen", "kaufen", "arbeiten", "reisen"]], "пояснение": "Таких глаголов больше всего. Берём инфинитив, убираем <b>-en</b> — получаем основу (mach<s>en</s> → mach) — и приклеиваем окончания: <b>-e, -st, -t, -en, -t, -en</b>. Гласная внутри не меняется ни у кого. wir и sie/Sie всегда совпадают с инфинитивом.<br><br>Две поправки:<br>• основа кончается на <b>-t, -d</b> (arbeiten, finden) — перед -st и -t вставляется <b>-e-</b>, иначе не выговорить: <i>du arbeit<b>e</b>st, er arbeit<b>e</b>t</i>;<br>• основа кончается на <b>-s, -ß, -z</b> (reisen, heißen, tanzen) — у du лишняя s выпадает: <i>du reist, du heißt</i>, а не «heißst».<br><br>Прошедшее — основа + <b>-te</b> (machte, lernte), Perfekt — <b>ge…t</b> (hat gemacht).", "куда": "zubr.html?набор=обычные_формы&режим=спряжение", "кудаИмя": "Заучить таблицу в тренажёре"}, {"id": "таб_особые", "имя": "Глаголы-исключения: sein, haben, werden, wissen, tun", "знак": "⚡", "тема": "Глагол: спряжение", "слова": "глаголы исключения особые неправильные sein haben werden wissen tun спряжение настоящее", "шапка": ["", "sein — быть", "haben — иметь", "werden — становиться", "wissen — знать", "tun — делать"], "строки": [["ich", "bin", "habe", "werde", "weiß", "tue"], ["du", "bist", "hast", "wirst", "weißt", "tust"], ["er/sie/es", "ist", "hat", "wird", "weiß", "tut"], ["wir", "sind", "haben", "werden", "wissen", "tun"], ["ihr", "seid", "habt", "werdet", "wisst", "tut"], ["sie/Sie", "sind", "haben", "werden", "wissen", "tun"]], "пояснение": "Эти пять по правилам не выводятся — их учат наизусть.<br><br><b>sein</b> — самый неправильный глагол немецкого: формы вообще не напоминают инфинитив. Главная ловушка — <b>ihr seid</b>, а не «sind».<br><b>haben</b> ломается только у du и er: hab<b>st</b> → <b>hast</b>, hab<b>t</b> → <b>hat</b> (выпадает b).<br><b>werden</b>: du wir<b>st</b> (без d), er wir<b>d</b> (без -t). Прошедшее — wurde.<br><b>wissen</b> ведёт себя как модальный: ich wei<b>ß</b> и er wei<b>ß</b> — одинаково и без окончания.<br><b>tun</b> — единственный на -un: wir tun, sie tun, без лишнего -en.", "куда": "zubr.html?набор=особые_глаголы&режим=спряжение", "кудаИмя": "Заучить таблицу в тренажёре"}, {"id": "таб_модальные", "имя": "Модальные глаголы", "знак": "🔑", "тема": "Глагол: спряжение", "слова": "модальные глаголы können müssen dürfen sollen wollen mögen möchten можно должен хочу", "шапка": ["", "können — мочь, уметь", "müssen — быть должным", "dürfen — иметь право, можно", "sollen — следует, должен по чужому указанию", "wollen — хотеть", "mögen — нравиться, любить", "möchten — хотелось бы (вежливо)"], "строки": [["ich", "kann", "muss", "darf", "soll", "will", "mag", "möchte"], ["du", "kannst", "musst", "darfst", "sollst", "willst", "magst", "möchtest"], ["er/sie/es", "kann", "muss", "darf", "soll", "will", "mag", "möchte"], ["wir", "können", "müssen", "dürfen", "sollen", "wollen", "mögen", "möchten"], ["ihr", "könnt", "müsst", "dürft", "sollt", "wollt", "mögt", "möchtet"], ["sie/Sie", "können", "müssen", "dürfen", "sollen", "wollen", "mögen", "möchten"]], "пояснение": "<b>Главное правило:</b> у модальных <b>ich и er/sie/es — одна и та же форма и БЕЗ окончания</b>: ich kann, er kann. Исключение — möchte: там окончание -e.<br><br>В единственном числе гласная меняется (können → <b>ka</b>nn), во множественном возвращается инфинитив: wir können, sie können. У <b>sollen</b> гласная не меняется вовсе.<br><br>Прошедшее — без умляута плюс -te: konnte, musste, durfte, wollte, sollte, mochte.<br>Второй глагол уходит в конец и стоит в инфинитиве: <i>Ich muss heute arbeiten.</i>", "куда": "zubr.html?набор=модальные&режим=спряжение", "кудаИмя": "Заучить таблицу в тренажёре"}, {"id": "таб_сильные", "имя": "Сильные глаголы: меняют гласную", "знак": "🔀", "тема": "Глагол: спряжение", "слова": "сильные глаголы меняют гласную умляут du er sprechen fahren нерегулярные три формы", "шапка": ["Глагол", "ты (du)", "он (er)", "прошедшее", "Perfekt", "тип"], "строки": [["sprechen — говорить", "sprichst", "spricht", "sprach", "hat gesprochen", "e → i"], ["essen — есть, кушать", "isst", "isst", "aß", "hat gegessen", "e → i"], ["geben — давать", "gibst", "gibt", "gab", "hat gegeben", "e → i"], ["nehmen — брать", "nimmst", "nimmt", "nahm", "hat genommen", "e → i"], ["helfen — помогать", "hilfst", "hilft", "half", "hat geholfen", "e → i"], ["treffen — встречать", "triffst", "trifft", "traf", "hat getroffen", "e → i"], ["vergessen — забывать", "vergisst", "vergisst", "vergaß", "hat vergessen", "e → i"], ["werfen — бросать", "wirfst", "wirft", "warf", "hat geworfen", "e → i"], ["sterben — умирать", "stirbst", "stirbt", "starb", "ist gestorben", "e → i"], ["sehen — видеть", "siehst", "sieht", "sah", "hat gesehen", "e → ie"], ["lesen — читать", "liest", "liest", "las", "hat gelesen", "e → ie"], ["empfehlen — рекомендовать, советовать", "empfiehlst", "empfiehlt", "empfahl", "hat empfohlen", "e → ie"], ["fahren — ехать", "fährst", "fährt", "fuhr", "ist gefahren", "a → ä"], ["schlafen — спать", "schläfst", "schläft", "schlief", "hat geschlafen", "a → ä"], ["tragen — носить", "trägst", "trägt", "trug", "hat getragen", "a → ä"], ["waschen — мыть, стирать", "wäschst", "wäscht", "wusch", "hat gewaschen", "a → ä"], ["fallen — падать", "fällst", "fällt", "fiel", "ist gefallen", "a → ä"], ["halten — держать, останавливаться", "hältst", "hält", "hielt", "hat gehalten", "a → ä"], ["lassen — оставлять, позволять", "lässt", "lässt", "ließ", "hat gelassen", "a → ä"], ["schlagen — бить, ударять", "schlägst", "schlägt", "schlug", "hat geschlagen", "a → ä"], ["laufen — бежать, ходить пешком", "läufst", "läuft", "lief", "ist gelaufen", "au → äu"]], "пояснение": "Гласная меняется <b>только у du и er/sie/es</b>. ich, wir, ihr, sie — как у обычного глагола: <i>ich spreche, wir sprechen</i>.<br><br>Четыре типа замены: <b>e → i</b> (sprechen → spricht), <b>e → ie</b> (sehen → sieht), <b>a → ä</b> (fahren → fährt), <b>au → äu</b> (laufen → läuft).<br><br>Если корень кончается на s, ss, ß или z — <b>du и er совпадают</b>: du isst = er isst.<br>В прошедшем (Präteritum) гласная меняется у всех лиц, а у ich и er окончания нет: ich sprach, er sprach.<br>Perfekt у сильных кончается на <b>-en</b>, а не на -t. Движение и смена состояния — с <b>sein</b>.", "куда": "zubr.html?набор=сильные_формы&режим=спряжение", "кудаИмя": "Заучить таблицу в тренажёре"}, {"id": "таб_опред", "имя": "Определённый артикль по падежам", "знак": "🎨", "тема": "Артикли и род", "слова": "определённый артикль der die das den dem des падежи склонение таблица", "шапка": ["Падеж", "вопрос", "муж.", "жен.", "ср.", "мн."], "строки": [["Nominativ", "кто? что?", "<b>der</b>", "die", "das", "die"], ["Akkusativ", "кого? что?", "<b>den</b>", "die", "das", "die"], ["Dativ", "кому? чему?", "<b>dem</b>", "der", "<b>dem</b>", "den + -n"], ["Genitiv", "чей? чья?", "<b>des</b> + -s", "der", "<b>des</b> + -s", "der"]], "пояснение": "Запоминать проще не всю таблицу, а <b>что меняется</b>:<br>• в Akkusativ меняется <b>только мужской род</b>: der → den;<br>• в Dativ три формы: dem (муж. и ср.), der (жен.), den (мн.), и к слову во множественном прибавляется <b>-n</b>: <i>mit den Kinder<b>n</b></i>;<br>• в Genitiv две: des (муж. и ср., и к слову -s или -es: <i>des Hund<b>es</b></i>) и der (жен. и мн.).<br><br>Падеж почти всегда решает предлог или глагол: <i>mit</i> → Dativ, <i>für</i> → Akkusativ, <i>gehören</i> → Dativ, <i>mögen</i> → Akkusativ."}, {"id": "таб_неопред", "имя": "Неопределённый артикль по падежам", "знак": "🎨", "тема": "Артикли и род", "слова": "неопределённый артикль ein eine einen einem einer eines kein mein падежи склонение", "шапка": ["Падеж", "муж.", "жен.", "ср.", "мн."], "строки": [["Nominativ", "ein", "eine", "ein", "— (нет)"], ["Akkusativ", "<b>einen</b>", "eine", "ein", "— (нет)"], ["Dativ", "<b>einem</b>", "<b>einer</b>", "<b>einem</b>", "— (нет)"], ["Genitiv", "<b>eines</b> + -s", "<b>einer</b>", "<b>eines</b> + -s", "— (нет)"]], "пояснение": "Окончания <b>те же, что у определённого артикля</b>, просто на основе ein-. В Akkusativ меняется только мужской род: ein → einen.<br><br>Так же склоняются <b>kein</b> и все притяжательные: mein, dein, sein, ihr, unser, euer. Во множественном числе неопределённого артикля нет вообще — но <b>keine</b> и <b>meine</b> есть.<br><br>⭐ Железное правило: после <b>haben</b>, <b>brauchen</b> и оборота <b>es gibt</b> почти всегда стоит неопределённый артикль в Akkusativ: <i>Ich habe einen Hund. Es gibt einen Lesesaal.</i>"}, {"id": "таб_прилаг", "имя": "Окончания прилагательных", "знак": "🖌", "тема": "Артикли и род", "слова": "прилагательные окончания склонение guter gute guten gutes после артикля", "шапка": ["Падеж", "после der / die / das", "после ein / kein / mein", "без артикля"], "строки": [["Nom. муж.", "der neu<b>e</b>", "ein neu<b>er</b>", "gut<b>er</b> Wein"], ["Nom. жен.", "die neu<b>e</b>", "eine neu<b>e</b>", "gut<b>e</b> Milch"], ["Nom. ср.", "das neu<b>e</b>", "ein neu<b>es</b>", "gut<b>es</b> Bier"], ["Akk. муж.", "den neu<b>en</b>", "einen neu<b>en</b>", "gut<b>en</b> Wein"], ["Dativ", "dem / der neu<b>en</b>", "einem / einer neu<b>en</b>", "gut<b>em</b> / gut<b>er</b>"], ["Мн. число", "die neu<b>en</b>", "keine neu<b>en</b>", "gut<b>e</b> Ärzte"]], "пояснение": "<b>Правило одного сигнала:</b> род и падеж должен показать кто-то один. Артикль показал (der) — прилагательное отдыхает: <b>-e</b> или <b>-en</b>. Артикль молчит (ein одинаков у муж. и ср.) — прилагательное договаривает за него: <b>-er</b>, <b>-es</b>. Артикля нет совсем — прилагательное берёт его окончание себе.<br><br>И ещё: <b>после глагола окончания нет вообще</b> — <i>Das Bein ist dick</i>, а перед существительным есть всегда — <i>das dick<b>e</b> Bein</i>.<br><br>Больше половины всех случаев — скучное <b>-en</b>.", "куда": "lessons/urok24_interactive.html", "кудаИмя": "Урок 25 целиком"}, {"id": "таб_местоим", "имя": "Личные местоимения по падежам", "знак": "👤", "тема": "Местоимения", "слова": "местоимения ich mich mir du dich dir er ihn ihm личные падежи", "шапка": ["Кто (Nom.)", "Кого (Akk.)", "Кому (Dat.)"], "строки": [["ich — я", "mich", "mir"], ["du — ты", "dich", "dir"], ["er — он", "ihn", "ihm"], ["sie — она", "sie", "ihr"], ["es — оно", "es", "ihm"], ["wir — мы", "uns", "uns"], ["ihr — вы (свои)", "euch", "euch"], ["sie — они", "sie", "ihnen"], ["Sie — Вы (вежл.)", "Sie", "Ihnen"]], "пояснение": "Вежливое <b>Sie</b> всегда с большой буквы — и этим отличается от «они».<br><br>Дательный нужен чаще, чем кажется: <i>Wie geht es <b>dir</b>? · Das gefällt <b>mir</b>. · Ich helfe <b>Ihnen</b>. · Es tut <b>mir</b> leid.</i><br><br>Глаголы, которые всегда требуют Dativ: <b>helfen, danken, gefallen, gehören, passen, wehtun</b>."}, {"id": "таб_предлоги", "имя": "Предлоги и падежи", "знак": "🔗", "тема": "Предлоги", "слова": "предлоги падежи akkusativ dativ wechsel für mit in auf куда где", "шапка": ["Всегда Akkusativ", "Всегда Dativ", "И то, и то (Wechsel)"], "строки": [["für — для", "mit — с", "in — в"], ["ohne — без", "nach — после, в (город)", "auf — на (сверху)"], ["durch — через", "aus — из", "an — у, на (вертикально)"], ["gegen — против", "bei — у, при", "über — над"], ["um — вокруг, в (час)", "von — от", "unter — под"], ["bis — до", "zu — к", "vor / hinter — перед / за"], ["entlang — вдоль", "seit — с (времени)", "neben / zwischen — рядом / между"]], "пояснение": "Третий столбец — главное место для ошибок. Эти предлоги берут падеж <b>по вопросу</b>:<br>• <b>wohin? (куда?)</b> — движение к цели → <b>Akkusativ</b>: <i>Ich lege das Buch auf <b>den</b> Tisch.</i><br>• <b>wo? (где?)</b> — место → <b>Dativ</b>: <i>Das Buch liegt auf <b>dem</b> Tisch.</i><br><br>Сращения, которые надо просто знать: <b>im</b> = in dem, <b>am</b> = an dem, <b>zum</b> = zu dem, <b>zur</b> = zu der, <b>ins</b> = in das, <b>vom</b> = von dem, <b>beim</b> = bei dem."}, {"id": "таб_вопросы", "имя": "Вопросительные слова и падеж", "знак": "❓", "тема": "Вопросы", "слова": "вопросы wer wen wem wessen wo wohin woher wann warum wie w-fragen", "шапка": ["Слово", "Перевод", "Падеж / смысл"], "строки": [["wer?", "кто?", "Nominativ"], ["wen?", "кого?", "Akkusativ"], ["wem?", "кому?", "Dativ"], ["wessen?", "чей? чья? чьё?", "Genitiv"], ["wo?", "где?", "Dativ — место"], ["wohin?", "куда?", "Akkusativ — движение"], ["woher?", "откуда?", "Dativ — <i>aus dem Haus</i>"], ["wann?", "когда?", "обычно Dativ: <i>am Montag</i>"], ["warum?", "почему?", "ответ через weil или denn"], ["wie?", "как?", "<i>wie viel</i> — сколько"], ["welcher?", "какой?", "меняется по родам: welche, welches"]], "пояснение": "Запоминалка: <b>-hin</b> — «туда» (движение, Akkusativ), <b>-her</b> — «оттуда» (Dativ).<br><br>В вопросе со словом-вопросом глагол стоит <b>вторым</b>: <i>Wohin <b>gehst</b> du?</i> А если вопросительного слова нет — глагол выходит <b>на первое место</b>: <i><b>Gehst</b> du nach Hause?</i>"}, {"id": "таб_perfekt", "имя": "Прошедшее время: haben или sein", "знак": "⏮", "тема": "Прошедшее время", "слова": "perfekt прошедшее haben sein partizip причастие gemacht gegangen war hatte", "шапка": ["С haben", "С sein"], "строки": [["почти все глаголы", "<b>движение</b>: gehen, fahren, kommen, laufen"], ["<i>Ich <b>habe</b> gearbeitet.</i>", "<i>Ich <b>bin</b> gefahren.</i>"], ["<i>Er <b>hat</b> gegessen.</i>", "<i>Er <b>ist</b> gekommen.</i>"], ["все с прямым дополнением", "<b>смена состояния</b>: aufstehen, einschlafen, sterben, werden"], ["<i>Sie <b>hat</b> das Buch gelesen.</i>", "<i>Sie <b>ist</b> aufgestanden.</i>"], ["", "плюс три особых: <b>sein, bleiben, passieren</b>"]], "пояснение": "Perfekt = <b>haben или sein</b> (на втором месте) + <b>Partizip II</b> (в самом конце).<br><br>Как получить Partizip II:<br>• обычный глагол: <b>ge-</b> + основа + <b>-t</b> → machen → <b>gemacht</b>;<br>• сильный глагол: <b>ge-</b> + основа + <b>-en</b>, часто с новой гласной → sprechen → <b>gesprochen</b>;<br>• глаголы на <b>-ieren</b> и с неотделяемой приставкой (be-, ver-, er-) — <b>без ge-</b>: studieren → <b>studiert</b>, verstehen → <b>verstanden</b>;<br>• отделяемая приставка — ge- встаёт <b>внутрь</b>: aufstehen → auf<b>ge</b>standen.<br><br>В разговоре о прошлом немцы берут Perfekt, а <b>war</b> и <b>hatte</b> — в форме Präteritum: <i>Ich <b>war</b> beim Arzt</i>, а не «ich bin gewesen»."}, {"id": "таб_konjunktiv", "имя": "Вежливость: hätte, wäre, könnte, würde", "знак": "🙏", "тема": "Глагол: спряжение", "слова": "вежливость konjunktiv hätte wäre könnte würde möchte если бы сослагательное", "шапка": ["", "haben", "sein", "können", "werden"], "строки": [["ich", "hätte", "wäre", "könnte", "würde"], ["du", "hättest", "wärst", "könntest", "würdest"], ["er / sie / es", "hätte", "wäre", "könnte", "würde"], ["wir", "hätten", "wären", "könnten", "würden"], ["ihr", "hättet", "wärt", "könntet", "würdet"], ["sie / Sie", "hätten", "wären", "könnten", "würden"]], "пояснение": "По-немецки вежливость — это <b>форма глагола</b>, а не слово «пожалуйста». <i>Ich will einen Termin</i> звучит как требование; <i>Ich <b>hätte</b> gern einen Termin</i> — нормально.<br><br>У остальных глаголов берут <b>würde + инфинитив</b>: <i>Ich <b>würde</b> gern mehr lernen.</i> ⚠️ Но с haben и sein так не говорят — там свои формы: hätte, wäre.<br><br>Готовые обороты: <b>Könnten Sie bitte …?</b> · <b>Wäre es möglich, …?</b> · <b>An Ihrer Stelle würde ich …</b> · <b>Es wäre besser, wenn …</b><br><br>Второе применение — «если бы»: <i>Wenn ich Zeit <b>hätte</b>, <b>würde</b> ich kommen</i> (а времени нет). Сравни: <i>Wenn ich Zeit <b>habe</b>, komme ich</i> — это про то, что бывает.", "куда": "lessons/urok26_interactive.html", "кудаИмя": "Урок 27 целиком"}, {"id": "таб_порядок", "имя": "Порядок слов", "знак": "📐", "тема": "Порядок слов", "слова": "порядок слов глагол на втором месте придаточное weil dass рамка вопрос", "шапка": ["Тип предложения", "Где глагол", "Пример"], "строки": [["Обычное", "<b>вторым</b>", "Ich <b>lerne</b> heute Deutsch."], ["С обстоятельством впереди", "всё равно <b>вторым</b>", "Heute <b>lerne</b> ich Deutsch."], ["Вопрос со словом", "<b>вторым</b>", "Wann <b>lernst</b> du Deutsch?"], ["Вопрос без слова", "<b>первым</b>", "<b>Lernst</b> du Deutsch?"], ["С модальным", "модальный вторым, смысловой <b>в конец</b>", "Ich <b>muss</b> heute Deutsch <b>lernen</b>."], ["Прошедшее (Perfekt)", "haben/sein вторым, причастие <b>в конец</b>", "Ich <b>habe</b> Deutsch <b>gelernt</b>."], ["Придаточное (weil, dass, wenn)", "<b>в самый конец</b>", "…, weil ich Deutsch <b>lerne</b>."], ["Придаточное впереди", "«глагол, запятая, глагол»", "Weil ich krank <b>bin</b>, <b>komme</b> ich nicht."]], "пояснение": "Главное правило немецкого: <b>в обычном предложении глагол стоит вторым</b> — не вторым словом, а вторым <i>членом</i>. Поставил что-то вперёд — подлежащее уходит за глагол.<br><br>Второе правило — <b>рамка</b>: если глаголов два, первый стоит вторым, а второй уезжает в самый конец. Между ними — всё остальное.<br><br>И третье: после <b>weil, dass, wenn, als, ob</b> глагол уходит в конец. А <b>und, aber, oder, denn, sondern</b> порядок слов <b>не трогают</b>.", "куда": "lessons/urok25_interactive.html", "кудаИмя": "Урок 26 целиком"}, {"id": "таб_числа", "имя": "Числа: десятки и правило «задом наперёд»", "знак": "🔢", "тема": "Числа, время, даты", "слова": "числа десятки zwanzig dreißig числительные задом наперёд einundzwanzig", "шапка": ["Число", "Немецкий", "Число", "Немецкий"], "строки": [["10", "zehn", "60", "sechzig"], ["20", "zwanzig", "70", "sieb<b>zig</b> (без -en!)"], ["30", "drei<b>ß</b>ig (через ß!)", "80", "achtzig"], ["40", "vierzig", "90", "neunzig"], ["50", "fünfzig", "100", "(ein)hundert"]], "пояснение": "Двузначные числа немцы говорят <b>задом наперёд</b>: сначала единицы, потом «и», потом десятки.<br>21 = <b>einundzwanzig</b> («один-и-двадцать») · 35 = fünfunddreißig · 98 = achtundneunzig.<br><br>Три ловушки в самих десятках: <b>dreißig</b> пишется через <b>ß</b>, <b>sechzig</b> теряет -s (не «sechszig»), <b>siebzig</b> теряет -en (не «siebenzig»).<br><br>Цены читают так: запятую не произносят, вместо неё говорят «Euro»: <b>9,99 €</b> → <i>neun Euro neunundneunzig</i>."}, {"id": "таб_время", "имя": "Дни, месяцы, времена года", "знак": "📅", "тема": "Числа, время, даты", "слова": "дни недели месяцы времена года montag januar frühling календарь", "шапка": ["Дни недели", "Месяцы", "Времена года и части суток"], "строки": [["der Montag — понедельник", "der Januar", "der Frühling — весна"], ["der Dienstag — вторник", "der Februar", "der Sommer — лето"], ["der Mittwoch — среда", "der März", "der Herbst — осень"], ["der Donnerstag — четверг", "der April", "der Winter — зима"], ["der Freitag — пятница", "der Mai", "der Morgen — утро"], ["der Samstag — суббота", "der Juni / Juli", "der Mittag — полдень"], ["der Sonntag — воскресенье", "August … Dezember", "der Abend / die Nacht"]], "пояснение": "Все дни, месяцы и времена года — <b>мужского рода</b>. Единственное исключение в этом списке: <b>die Nacht</b> — ночь, женского.<br><br>«В понедельник» — <b>am</b> Montag. «В январе» — <b>im</b> Januar. «Летом» — <b>im</b> Sommer. «Утром» — <b>am</b> Morgen, но <b>in der</b> Nacht.<br><br>«По понедельникам» (регулярно) — одним словом с маленькой буквы: <b>montags</b>."}];

function нарисовать(){
  const а = разобратьАдрес();
  if (запрос){ поиск(); return; }

  if (а.т !== undefined && а.п !== undefined){
    const ти = +а.т, пи = +а.п, т = ДЕРЕВО[ти], п = т && т.под[пи];
    if (!п){ location.hash = ''; return; }

  }
  // «учить подряд»: одна тема, несколько тем или всё
  if (а.подряд !== undefined){
    const темы = а.подряд === 'все' ? ДЕРЕВО.map((_, i) => i) : а.подряд.split(',').map(Number).filter(i => ДЕРЕВО[i]);

    показатьЧасти(['прСписок']); оживитьТаблицы(); return;
  }
  // уровень 2: подтемы одной темы
  if (а.т !== undefined){
    const ти = +а.т, т = ДЕРЕВО[ти];
    if (!т){ location.hash = ''; return; }
    $('прКрошки').innerHTML = `<a href="#">Правила</a>`;

      const н = правилаПодтемы(ти, пи).length, таб = (п.таблицы || []).length;

    }).join('');
    показатьЧасти(['прУчить','прТемы']); return;
  }
  // уровень 1: темы
  $('прКрошки').innerHTML = '';
  $('прЗаголовок').textContent = 'Правила';
  $('прУчить').innerHTML = кнопкиУчить('#подряд=все', true);
  $('прТемы').innerHTML = ДЕРЕВО.map((т, ти) => {
    const н = правилаТемы(ти).length; if (!н) return '';

function скл(n, од, дв, мн){
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return мн;
  if (b > 1 && b < 5) return дв;
  if (b === 1) return од;
  return мн;
}

const ПРОФИЛЬ = localStorage.getItem('nemeckiy_profile') || 'grigoriy';
const КЛЮЧ = ид => `nemeckiy_pf_${ПРОФИЛЬ}_${ид}`;

function сост(ид){
  try{ return JSON.parse(localStorage.getItem(КЛЮЧ(ид)) || 'null'); }catch(e){ return null; }
}
function сохранить(ид, с){
  try{ localStorage.setItem(КЛЮЧ(ид), JSON.stringify(с)); }catch(e){}
}
function пораПравилу(п){ return ФСРС.пора(сост(п.id)); }

function сводкаПравил(){
  let пора = 0, знакомых = 0, усвоено = 0;
  ПРАВИЛА.forEach(п => {
    const с = сост(п.id);
    if (с) { знакомых++; if (ФСРС.выучено(с)) усвоено++; }
    if (ФСРС.пора(с)) пора++;
  });
  return {пора, знакомых, усвоено, всего: ПРАВИЛА.length};
}

function нарисоватьРежим(){
  const с = сводкаПравил();
  $('прРежим').innerHTML =
    `<button id="прСтарт">🔁 Повторять правила<small>${
      с.пора ? `на сегодня: ${с.пора}` : 'на сегодня всё пройдено'}</small></button>` +
    (с.знакомых ? `<button class="тихая" id="прСброс">Прогресс<small>${
      с.усвоено} усвоено из ${с.знакомых}</small></button>` : '');
  $('прСтарт').onclick = начатьПовтор;
  const сброс = $('прСброс');
  if (сброс) сброс.onclick = () => {
    alert(`Правил всего: ${с.всего}
Начато: ${с.знакомых}
Усвоено (держится больше 3 недель): ${с.усвоено}
Ждут повторения сегодня: ${с.пора}`);
  };
}

let очередь = [], текущее = null, показано = 0;

function начатьПовтор(){
  // сначала те, у кого пришёл срок; если таких нет — берём новые
  const пора = ПРАВИЛА.filter(пораПравилу);
  очередь = пора.length ? пора.slice(0, 20)
                        : ПРАВИЛА.filter(п => !сост(п.id)).slice(0, 10);
  if (!очередь.length){
    alert('Все правила повторены. Возвращайтесь завтра.');
    return;
  }
  показано = 0;
  document.querySelector('.пр-поиск').hidden = true;
  показатьЧасти([]);
  $('прЗаголовок').textContent = '🔁 Повторение правил'; $('прКрошки').innerHTML = '';
  $('прПовтор').hidden = false;
  дальше();
}

function выйтиИзПовтора(){
  document.querySelector('.пр-поиск').hidden = false;
  $('прПовтор').hidden = true;
  нарисоватьРежим();
  нарисовать();
}

function дальше(){
  if (!очередь.length){
    $('прПовтор').innerHTML =
      `<div class="пв"><div class="пв-вопрос">Готово</div>
       <div class="пв-откуда">Повторено правил: ${показано}</div>
       <div class="пр-режим"><button id="прВыход">Вернуться к справочнику</button></div></div>`;
    $('прВыход').onclick = выйтиИзПовтора;
    return;
  }
  текущее = очередь[0];
  const п = текущее;
  $('прПовтор').innerHTML =
    `<div class="пв">
      <div class="пв-счёт">Осталось: ${очередь.length}</div>
      <div class="пв-тема">${п.знак} ${п.тема}</div>
      <div class="пв-вопрос">${п.раздел || 'Правило'}</div>
      <div class="пв-откуда">${п.урокИмя}${п.вид === 'ловушка' ? ' · ⚠️ ловушка' : ''}</div>
      <div class="пр-режим">
        <button id="прПоказать">Вспомнили? Показать правило</button>
        <button class="тихая" id="прСтоп">Закончить</button>
      </div>
    </div>`;
  $('прПоказать').onclick = показатьОтвет;
  $('прСтоп').onclick = выйтиИзПовтора;
}

function показатьОтвет(){
  const п = текущее;
  const с = сост(п.id);
  // прогноз(состояние, оценка) отдаёт число дней, словами() — человеческий вид
  const подпись = о => {
    try{ return `<small>${ФСРС.словами(ФСРС.прогноз(с, о))}</small>`; }
    catch(e){ return ''; }
  };
  $('прПовтор').innerHTML =
    `<div class="пв">
      <div class="пв-счёт">Осталось: ${очередь.length}</div>
      <div class="пв-тема">${п.знак} ${п.тема}</div>
      <div class="пв-вопрос">${п.раздел || 'Правило'}</div>
      <div class="пв-откуда"><a href="${ссылка(п.урок)}" style="color:var(--accent)">${п.урокИмя} →</a></div>
      <div class="пв-тело ${п.вид === 'ловушка' ? 'ловушка' : ''}">${п.html}</div>
      <div class="пв-оценки">
        <button class="забыл" data-о="1">Забыл${подпись(1)}</button>
        <button data-о="3">Вспомнил${подпись(3)}</button>
        <button class="легко" data-о="4">Легко${подпись(4)}</button>
      </div>
    </div>`;
  $('прПовтор').querySelectorAll('[data-о]').forEach(b => {
    b.onclick = () => оценитьПравило(+b.dataset.о);
  });
}

function оценитьПравило(оценка){
  const п = текущее;
  сохранить(п.id, ФСРС.ответ(сост(п.id), оценка));
  показано++;
  очередь.shift();
  if (оценка === 1) очередь.push(п);      // забыл — вернём в конец пачки
  дальше();
}

нарисоватьРежим();
нарисовать();
</script>
