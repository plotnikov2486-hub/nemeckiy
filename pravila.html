глагола <b>anrufen</b> (звонить) есть брат-близнец <b>telefonieren</b> —\n      у него приставка не отделяется. Можно сказать проще: <b>Sie telefoniert viel.</b>","текст":"Хитрость от Даши: у глагола anrufen (звонить) есть брат-близнец telefonieren — у него приставка не отделяется. Можно сказать проще: Sie telefoniert viel.","ти":0,"пи":3,"подтема":"Буква добавляется или пропадает"},{"id":"89304b44d1","тема":"Приставки","знак":"🔗","вид":"ловушка","раздел":"⚠️ Приставка убегает в конец","урок":"polya8","урокИмя":"Занятие 8 Полины","html":"<span class=\"big\">Почему «auf» уезжает в конец предложения</span>\n      Полина возмутилась: «Они что, не могут одним словом сказать?» Нет, не могут — это устройство языка.","текст":"Почему «auf» уезжает в конец предложения Полина возмутилась: «Они что, не могут одним словом сказать?» Нет, не могут — это устройство языка.","ти":0,"пи":3,"подтема":"Буква добавляется или пропадает"},{"id":"8e3102c508","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"⚠️ Буква добавляется или убегает","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"<b>Это не четвёртая кучка.</b> Глаголы обычные, правильные — просто немцам было\n      неудобно выговаривать, и они чуть-чуть подправили окончание. Чисто для благозвучия.","текст":"Это не четвёртая кучка. Глаголы обычные, правильные — просто немцам было неудобно выговаривать, и они чуть-чуть подправили окончание. Чисто для благозвучия.","ти":0,"пи":3,"подтема":"Буква добавляется или пропадает"},{"id":"5333a06bf2","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"⚠️ Буква добавляется или убегает","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"Григорий спросил: «есть какой-нибудь перечень вот таких приколов?»<br>\n      Ответ Даши: <b>отдельного списка нет</b>. Это почти всегда глаголы, у которых основа кончается на\n      <span class=\"hl\">-t</span> или <span class=\"hl\">-d</span> (arbeiten, warten, finden), плюс tanzen.\n      Остальное встретится по ходу.","текст":"Григорий спросил: «есть какой-нибудь перечень вот таких приколов?» Ответ Даши: отдельного списка нет. Это почти всегда глаголы, у которых основа кончается на -t или -d (arbeiten, warten, finden), плюс tanzen. Остальное встретится по ходу.","ти":0,"пи":3,"подтема":"Буква добавляется или пропадает"},{"id":"9c3ccd5740","тема":"Глагол: спряжение","знак":"🔤","вид":"ловушка","раздел":"⚠️ Буква добавляется или убегает","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"<span class=\"big\">Случай 1: основа кончается на -t → добавляем e</span>\n      arbeit<b>en</b> → основа <b>arbeit</b>. Если приклеить обычное окончание, выйдет\n      «arbeitt» — две «т» подряд. Поэтому вставляют <b>e</b>: du arbeit<b>e</b>st, er arbeit<b>e</b>t.","текст":"Случай 1: основа кончается на -t → добавляем e arbeiten → основа arbeit. Если приклеить обычное окончание, выйдет «arbeitt» — две «т» подряд. Поэтому вставляют e: du arbeitest, er arbeitet.","ти":0,"пи":3,"подтема":"Буква добавляется или пропадает"},{"id":"0d15844e92","тема":"Глагол: спряжение","знак":"🔤","вид":"ловушка","раздел":"⚠️ Буква добавляется или убегает","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"<span class=\"big\">Случай 2: tanzen у du → выбрасываем s</span>\n      По правилу должно быть «du tanz<b>st</b>» — но там уже есть свистящий звук.\n      Поэтому <b>s</b> убирают: <b>du tanzt</b>. Только у <b>du</b>, только у этого глагола-типа.","текст":"Случай 2: tanzen у du → выбрасываем s По правилу должно быть «du tanzst» — но там уже есть свистящий звук. Поэтому s убирают: du tanzt. Только у du, только у этого глагола-типа.","ти":0,"пи":3,"подтема":"Буква добавляется или пропадает"},{"id":"359c36f902","тема":"Разное","знак":"📎","вид":"правило","раздел":"💭 Своё мнение: Ich finde …","урок":"polya12","урокИмя":"Занятие 12 Полины","html":"<b>finden</b> — «находить». Но у немцев это ещё и главный способ сказать своё мнение: <b>Ich finde es billig</b> — буквально «я нахожу это дешёвым», по смыслу «по-моему, это дёшево». Даша попросила сразу начать им пользоваться.<br><br>\n      Продавец в диалоге спрашивает <b>Finden Sie?</b> — «Вы так считаете?». А согласиться с кем-то — <b>Das denke ich auch</b>: «я тоже так думаю».<br>\n      <b>ziemlich</b> — «довольно»: ziemlich billig — довольно дёшево.","текст":"finden — «находить». Но у немцев это ещё и главный способ сказать своё мнение: Ich finde es billig — буквально «я нахожу это дешёвым», по смыслу «по-моему, это дёшево». Даша попросила сразу начать им пользоваться. Продавец в диалоге спрашивает Finden Sie? — «Вы так считаете?». А согласиться с кем-то — Das denke ich auch: «я тоже так думаю». ziemlich — «довольно»: ziemlich billig — довольно дёшево.","ти":0,"пи":3,"подтема":"Буква добавляется или пропадает"},{"id":"384f7092b2","тема":"Множественное число","знак":"➕","вид":"правило","раздел":"Когда Konjunktiv I не отличить","урок":"urok43","урокИмя":"Урок 44","html":"Во множественном числе Konjunktiv I часто совпадает с обычной формой: <i>sie haben</i> = <i>sie haben</i>. Тогда берут <b>Konjunktiv II</b> (урок 26): <i>Sie sagen, sie <b>hätten</b> keine Zeit</i>. Пример — последняя фраза раздела 3.","текст":"Во множественном числе Konjunktiv I часто совпадает с обычной формой: sie haben = sie haben. Тогда берут Konjunktiv II (урок 26): Sie sagen, sie hätten keine Zeit. Пример — последняя фраза раздела 3.","ти":0,"пи":4,"подтема":"Вежливость: hätte, wäre, könnte, würde"},{"id":"45e5e73773","тема":"Модальные глаголы","знак":"🔑","вид":"ловушка","раздел":"möchten — хотел бы (вежливо)","урок":"dasha2","урокИмя":"Занятие 2 с Дашей","html":"<b>Для врача важнее всех:</b> <i>wollen</i> звучит требовательно («я хочу»), а <b>möchten</b> — вежливо («я хотел бы»). С пациентами и коллегами используй <b>möchten</b>.","текст":"Для врача важнее всех: wollen звучит требовательно («я хочу»), а möchten — вежливо («я хотел бы»). С пациентами и коллегами используй möchten.","ти":0,"пи":4,"подтема":"Вежливость: hätte, wäre, könnte, würde"},{"id":"ebcb91c584","тема":"Прошедшее время","знак":"⏮","вид":"ловушка","раздел":"⚠️ konnte или könnte — одна точка меняет смысл","урок":"urok19","урокИмя":"Урок 20","html":"<span class=\"big\">Это разные вещи, и путать их неловко</span>\n      <b>konnte</b> (без точек) — <b>прошедшее время</b>: «я не <b>мог</b>». Факт о прошлом.<br>\n      <b>könnte</b> (с точками) — <b>вежливое предположение</b>: «я <b>мог бы</b>». Это Konjunktiv, отдельная тема A2, до неё дойдём.<br><br>\n      На слух разница тоже есть — послушай обе кнопки подряд. В медицинском разговоре это важно: <i>Ich konnte nicht schlafen</i> (не спал — жалоба) и <i>Ich könnte…</i> (я бы мог — предложение) звучат совсем по-разному для собеседника.","текст":"Это разные вещи, и путать их неловко konnte (без точек) — прошедшее время: «я не мог». Факт о прошлом. könnte (с точками) — вежливое предположение: «я мог бы». Это Konjunktiv, отдельная тема A2, до неё дойдём. На слух разница тоже есть — послушай обе кнопки подряд. В медицинском разговоре это важно: Ich konnte nicht schlafen (не спал — жалоба) и Ich könnte… (я бы мог — предложение) звучат совсем по-разному для собеседника.","ти":0,"пи":4,"подтема":"Вежливость: hätte, wäre, könnte, würde"},{"id":"02a900937b","тема":"Прошедшее время","знак":"⏮","вид":"правило","раздел":"Konjunktiv I: формы","урок":"urok54","урокИмя":"Урок 55","html":"В письме почти всегда 3-е лицо — это удобно: <b>основа инфинитива + e</b>: sie nehm<b>e</b>, er geb<b>e</b> an. Особые: <b>sei</b> (sein), <b>habe</b> (haben). Прошлое — <b>habe / sei + Partizip II</b>: sie habe gehabt, es sei aufgetreten. Если форма совпадает с обычной (sie treten auf) — берут Konjunktiv II (träten auf / würden auftreten); таблица 13.3 учебника.","текст":"В письме почти всегда 3-е лицо — это удобно: основа инфинитива + e: sie nehme, er gebe an. Особые: sei (sein), habe (haben). Прошлое — habe / sei + Partizip II: sie habe gehabt, es sei aufgetreten. Если форма совпадает с обычной (sie treten auf) — берут Konjunktiv II (träten auf / würden auftreten); таблица 13.3 учебника.","ти":0,"пи":4,"подтема":"Вежливость: hätte, wäre, könnte, würde"},{"id":"6474870af3","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"würde + инфинитив — палочка-выручалочка","урок":"urok26","урокИмя":"Урок 27","html":"У остальных глаголов своя форма Konjunktiv II есть, но звучит она старомодно (<i>ich käme, ich ginge</i>) — немцы так почти не говорят. Вместо этого берут <b>würde</b> и ставят нужный глагол в конец, в инфинитиве:<br><br>\n      <i>Ich <b>würde</b> gern mehr Deutsch <b>lernen</b>.</i> — Я бы с удовольствием больше учил немецкий.<br><br>\n      ⚠️ Но: с <b>haben</b> и <b>sein</b> так <span class=\"hl\">не делают</span>. Там всегда свои формы: <b>hätte</b>, <b>wäre</b>. Сказать «würde haben» — типичная ошибка иностранца.","текст":"У остальных глаголов своя форма Konjunktiv II есть, но звучит она старомодно (ich käme, ich ginge) — немцы так почти не говорят. Вместо этого берут würde и ставят нужный глагол в конец, в инфинитиве: Ich würde gern mehr Deutsch lernen. — Я бы с удовольствием больше учил немецкий. ⚠️ Но: с haben и sein так не делают. Там всегда свои формы: hätte, wäre. Сказать «würde haben» — типичная ошибка иностранца.","ти":0,"пи":4,"подтема":"Вежливость: hätte, wäre, könnte, würde"},{"id":"893206aa5d","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"⭐ Формы Konjunktiv I","урок":"urok43","урокИмя":"Урок 44","html":"На практике нужна почти только <b>3-е лицо единственного числа</b> (er, sie — пациент). Правило: <b>основа инфинитива + -e</b>, без изменения гласной: <i>hab-en → er hab<b>e</b></i>, <i>könn-en → er könn<b>e</b></i>, <i>nehm-en → er nehm<b>e</b></i> (не «nimmt»!). Особый только <b>sein</b>: <i>er <b>sei</b>, sie <b>seien</b></i>.","текст":"На практике нужна почти только 3-е лицо единственного числа (er, sie — пациент). Правило: основа инфинитива + -e, без изменения гласной: hab-en → er habe, könn-en → er könne, nehm-en → er nehme (не «nimmt»!). Особый только sein: er sei, sie seien.","ти":0,"пи":4,"подтема":"Вежливость: hätte, wäre, könnte, würde"},{"id":"2b298b18ab","тема":"Порядок слов","знак":"📐","вид":"правило","раздел":"Смягчить: Konjunktiv II","урок":"urok59","урокИмя":"Урок 60","html":"Предложение вместо приказа: <i>Wäre es nicht sinnvoller, …?</i> · <i>Könnten wir überlegen, ob …?</i> · <i>Ich würde vorschlagen, …</i> (урок <a href=\"urok26_interactive.html\">26</a>). Слова-«смягчители»: <i>vielleicht, eher, etwas, eventuell</i>.","текст":"Предложение вместо приказа: Wäre es nicht sinnvoller, …? · Könnten wir überlegen, ob …? · Ich würde vorschlagen, … (урок 26). Слова-«смягчители»: vielleicht, eher, etwas, eventuell.","ти":0,"пи":4,"подтема":"Вежливость: hätte, wäre, könnte, würde"},{"id":"12530fb0bc","тема":"Общение и обращение","знак":"💬","вид":"правило","раздел":"Вопросы для знакомства (вежливо, Sie)","урок":"urok1","урокИмя":"Урок 2","html":"С русской фамилией пригодятся последние три: у немца ваша фамилия с первого раза не запишется. <b>Wie bitte?</b> — «простите, как?» — ваш главный спасательный круг, когда не расслышали.","текст":"С русской фамилией пригодятся последние три: у немца ваша фамилия с первого раза не запишется. Wie bitte? — «простите, как?» — ваш главный спасательный круг, когда не расслышали.","ти":0,"пи":4,"подтема":"Вежливость: hätte, wäre, könnte, würde"},{"id":"de53360530","тема":"Общение и обращение","знак":"💬","вид":"правило","раздел":"Вежливые просьбы и вопросы","урок":"urok26","урокИмя":"Урок 27","html":"<b>Шкала вежливости</b> — от прямого к самому мягкому:<br>\n      <i>Geben Sie mir…</i> (приказ) → <i>Können Sie mir… geben?</i> (нормально) → <b><i>Könnten Sie mir bitte… geben?</i></b> (вежливо) → <i>Wäre es möglich, dass…?</i> (очень вежливо, для начальства и незнакомых).<br><br>\n      В кабинете врача рабочая середина — <b>Könnten Sie bitte…</b> и <b>Würden Sie bitte…</b>","текст":"Шкала вежливости — от прямого к самому мягкому: Geben Sie mir… (приказ) → Können Sie mir… geben? (нормально) → Könnten Sie mir bitte… geben? (вежливо) → Wäre es möglich, dass…? (очень вежливо, для начальства и незнакомых). В кабинете врача рабочая середина — Könnten Sie bitte… и Würden Sie bitte…","ти":0,"пи":4,"подтема":"Вежливость: hätte, wäre, könnte, würde"},{"id":"c15d75d72b","тема":"Общение и обращение","знак":"💬","вид":"правило","раздел":"⭐⭐ Лестница вежливости","урок":"urok48","урокИмя":"Урок 49","html":"В уроке 13 мы учили команды осмотра в повелительном наклонении. Для экзамена этого мало: учебник прямо пишет, что <b>лучше всего — Konjunktiv II</b> (урок 26). Одну и ту же просьбу можно сказать на пяти ступенях — от грубой до самой вежливой. Ступень 2 годится внутри осмотра, когда пациент уже знает, что происходит. Первую просьбу в разговоре (раздеться, лечь) говорите на ступени 3–5.","текст":"В уроке 13 мы учили команды осмотра в повелительном наклонении. Для экзамена этого мало: учебник прямо пишет, что лучше всего — Konjunktiv II (урок 26). Одну и ту же просьбу можно сказать на пяти ступенях — от грубой до самой вежливой. Ступень 2 годится внутри осмотра, когда пациент уже знает, что происходит. Первую просьбу в разговоре (раздеться, лечь) говорите на ступени 3–5.","ти":0,"пи":4,"подтема":"Вежливость: hätte, wäre, könnte, würde"},{"id":"cd05f6c99a","тема":"Общение и обращение","знак":"💬","вид":"правило","раздел":"⭐⭐ Лестница вежливости","урок":"urok48","урокИмя":"Урок 49","html":"<b>Три ловушки порядка слов.</b> 1) <b>sich</b> не пропадает: Legen Sie <b>sich</b> hin (урок 18). 2) Отделяемая приставка уходит в конец: Ziehen Sie bitte die Knie <b>an</b>. 3) На ступени 5 — оборот с zu (урок 39), и zu встаёт <b>внутрь</b> отделяемого глагола: hin<b>zu</b>legen, frei<b>zu</b>machen, aus<b>zu</b>ziehen, an<b>zu</b>ziehen.","текст":"Три ловушки порядка слов. 1) sich не пропадает: Legen Sie sich hin (урок 18). 2) Отделяемая приставка уходит в конец: Ziehen Sie bitte die Knie an. 3) На ступени 5 — оборот с zu (урок 39), и zu встаёт внутрь отделяемого глагола: hinzulegen, freizumachen, auszuziehen, anzuziehen.","ти":0,"пи":4,"подтема":"Вежливость: hätte, wäre, könnte, würde"},{"id":"6974774e9a","тема":"Общение и обращение","знак":"💬","вид":"правило","раздел":"⭐⭐ Лестница вежливости","урок":"urok48","урокИмя":"Урок 49","html":"<b>Объявляйте каждое действие</b> до того, как прикоснулись: «сейчас я пропальпирую живот», «будет холодно». Простое настоящее время или werden + gleich (урок 34).","текст":"Объявляйте каждое действие до того, как прикоснулись: «сейчас я пропальпирую живот», «будет холодно». Простое настоящее время или werden + gleich (урок 34).","ти":0,"пи":4,"подтема":"Вежливость: hätte, wäre, könnte, würde"},{"id":"32c790086a","тема":"Общение и обращение","знак":"💬","вид":"правило","раздел":"Культуры слышат по-разному: «чай» и «пианино»","урок":"urok55","урокИмя":"Урок 56","html":"<b>Чай.</b> Китаец в гостях у немецкой подруги. Она предлагает чай — он отвечает <i>„Nein, danke.“</i> Она чай не делает. Потом спрашивает ещё раз — и он говорит <i>„Ja, gern!“</i> Для него первое «нет» — вежливость: гость не должен утруждать хозяйку, хозяйка сама решает. Для неё «нет» — это просто «нет», и ей обидно всё время угадывать.<br><br>\n      <b>Пианино.</b> Японец и немец — соседи. Немец часто играет на пианино, японцу это мешает. На лестнице японец говорит: <i>„Sie üben fleißig.“</i> — «вы усердно занимаетесь». Он имел в виду «играйте потише», а немец услышал комплимент и радостно ответил, что теперь даже берёт уроки.","текст":"Чай. Китаец в гостях у немецкой подруги. Она предлагает чай — он отвечает „Nein, danke.“ Она чай не делает. Потом спрашивает ещё раз — и он говорит „Ja, gern!“ Для него первое «нет» — вежливость: гость не должен утруждать хозяйку, хозяйка сама решает. Для неё «нет» — это просто «нет», и ей обидно всё время угадывать. Пианино. Японец и немец — соседи. Немец часто играет на пианино, японцу это мешает. На лестнице японец говорит: „Sie üben fleißig.“ — «вы усердно занимаетесь». Он имел в виду «играйте потише», а немец услышал комплимент и радостно ответил, что теперь даже берёт уроки.","ти":0,"пи":4,"подтема":"Вежливость: hätte, wäre, könnte, würde"},{"id":"9262387d78","тема":"Местоимения","знак":"🧩","вид":"правило","раздел":"sich в приказе: Setzen Sie sich — Setz dich","урок":"urok13","урокИмя":"Урок 14","html":"У возвратных глаголов («садиться», «ложиться», «успокаиваться») частица <i>sich</i> меняется вместе с формой:<br>\n      <b class=\"hl\">Sie → sich</b>: <i>Setzen Sie <b>sich</b>.</i> &nbsp;·&nbsp; <b class=\"hl\">du → dich</b>: <i>Setz <b>dich</b>!</i> &nbsp;·&nbsp; <b class=\"hl\">ihr → euch</b>: <i>Setzt <b>euch</b>!</i>","текст":"У возвратных глаголов («садиться», «ложиться», «успокаиваться») частица sich меняется вместе с формой: Sie → sich: Setzen Sie sich. &nbsp;·&nbsp; du → dich: Setz dich! &nbsp;·&nbsp; ihr → euch: Setzt euch!","ти":0,"пи":5,"подтема":"Приказ: Kommen Sie! Komm!"},{"id":"ec5f6ccf00","тема":"Порядок слов","знак":"📐","вид":"правило","раздел":"bitte, mal, doch — чтобы не звучать как приказ по казарме","урок":"urok13","урокИмя":"Урок 14","html":"Голый императив в немецком звучит <b>жёстко</b>. Врачу нужно мягко — для этого три словечка:<br><br>\n      <b class=\"hl\">bitte</b> — «пожалуйста». Ставится сразу после Sie или в конец. <b>Добавляй всегда.</b><br>\n      <b class=\"hl\">mal</b> — «-ка»: «покажите-ка». Делает просьбу лёгкой, необязательной.<br>\n      <b class=\"hl\">doch</b> — «да вы садитесь же», дружеское подбадривание.<br><br>\n      Послушай, как одна и та же фраза теплеет:","текст":"Голый императив в немецком звучит жёстко. Врачу нужно мягко — для этого три словечка: bitte — «пожалуйста». Ставится сразу после Sie или в конец. Добавляй всегда. mal — «-ка»: «покажите-ка». Делает просьбу лёгкой, необязательной. doch — «да вы садитесь же», дружеское подбадривание. Послушай, как одна и та же фраза теплеет:","ти":0,"пи":5,"подтема":"Приказ: Kommen Sie! Komm!"},{"id":"15abe4f663","тема":"Порядок слов","знак":"📐","вид":"правило","раздел":"bitte, mal, doch — чтобы не звучать как приказ по казарме","урок":"urok13","урокИмя":"Урок 14","html":"<b>Ещё вежливее — вопросом.</b> С пожилым пациентом или с коллегой старше тебя приказ заменяют просьбой: <b class=\"hl\">Könnten Sie bitte…?</b> (не могли бы Вы…?), <b class=\"hl\">Würden Sie bitte…?</b> Грамматику этих форм разберём позже — пока просто запомни фразы целиком, смысловой глагол как всегда уходит в конец.","текст":"Ещё вежливее — вопросом. С пожилым пациентом или с коллегой старше тебя приказ заменяют просьбой: Könnten Sie bitte…? (не могли бы Вы…?), Würden Sie bitte…? Грамматику этих форм разберём позже — пока просто запомни фразы целиком, смысловой глагол как всегда уходит в конец.","ти":0,"пи":5,"подтема":"Приказ: Kommen Sie! Komm!"},{"id":"9f363a39a9","тема":"Общение и обращение","знак":"💬","вид":"правило","раздел":"Три формы приказа","урок":"urok13","урокИмя":"Урок 14","html":"В русском мы говорим «идите» (вежливо) и «иди» (своим). В немецком то же самое, только форм <b>три</b> — по числу тех, к кому обращаешься:<br><br>\n      <b class=\"hl\">Sie</b> — пациент, коллега, любой чужой взрослый. <b>Твоя рабочая форма, 95% времени.</b><br>\n      <b class=\"hl\">du</b> — Полина, Вика, друзья.<br>\n      <b class=\"hl\">ihr</b> — несколько своих сразу («ребята, идите»).<br><br>\n      Один глагол <i>kommen</i> — три команды:","текст":"В русском мы говорим «идите» (вежливо) и «иди» (своим). В немецком то же самое, только форм три — по числу тех, к кому обращаешься: Sie — пациент, коллега, любой чужой взрослый. Твоя рабочая форма, 95% времени. du — Полина, Вика, друзья. ihr — несколько своих сразу («ребята, идите»). Один глагол kommen — три команды:","ти":0,"пи":5,"подтема":"Приказ: Kommen Sie! Komm!"},{"id":"e7283007fa","тема":"Разное","знак":"📎","вид":"ловушка","раздел":"⚠️ Форма на Sie — формула из двух слов","урок":"urok13","урокИмя":"Урок 14","html":"<span class=\"big\">Ловушка: приказ и вопрос выглядят ОДИНАКОВО</span>\n      <i>Kommen Sie?</i> и <i>Kommen Sie!</i> — те же два слова в том же порядке. Различает только <b>интонация</b>: в вопросе голос идёт вверх, в команде — вниз. Послушай обе кнопки подряд и поймай разницу.","текст":"Ловушка: приказ и вопрос выглядят ОДИНАКОВО Kommen Sie? и Kommen Sie! — те же два слова в том же порядке. Различает только интонация: в вопросе голос идёт вверх, в команде — вниз. Послушай обе кнопки подряд и поймай разницу.","ти":0,"пи":5,"подтема":"Приказ: Kommen Sie! Komm!"},{"id":"fd9dcef0cb","тема":"Местоимения","знак":"🧩","вид":"ловушка","раздел":"⚠️ Ловушка первая: русское «-ся» здесь не подсказчик","урок":"urok18","урокИмя":"Урок 19","html":"<span class=\"big\">Совпадает примерно в половине случаев — на это нельзя опираться</span>\n      Соблазн простой: раз по-русски с «-ся», значит и в немецком с <i>sich</i>. Это работает не всегда, причём в обе стороны:<br><br>\n      ✅ <i>freuen <b>sich</b></i> — радовать<b>ся</b>. Совпало.<br>\n      ❌ <i><b>sich</b> erholen</i> — отдыхать. По-русски <b>без</b> «-ся», а в немецком <i>sich</i> обязателен.<br>\n      ❌ <i>lernen</i> — учить<b>ся</b>. По-русски с «-ся», а в немецком <i>sich</i> <b>нет</b>.<br>\n      ❌ <i>beginnen</i> — начинать<b>ся</b>. Тоже без <i>sich</i>.<br><br>\n      Вывод: возвратность — это <b>свойство конкретного немецкого глагола</b>, его учат вместе со словом. Увидел в словаре <i>sich</i> — запоминай сразу с ним.","текст":"Совпадает примерно в половине случаев — на это нельзя опираться Соблазн простой: раз по-русски с «-ся», значит и в немецком с sich. Это работает не всегда, причём в обе стороны: ✅ freuen sich — радоваться. Совпало. ❌ sich erholen — отдыхать. По-русски без «-ся», а в немецком sich обязателен. ❌ lernen — учиться. По-русски с «-ся», а в немецком sich нет. ❌ beginnen — начинаться. Тоже без sich. Вывод: возвратность — это свойство конкретного немецкого глагола, его учат вместе со словом. Увидел в словаре sich — запоминай сразу с ним.","ти":0,"пи":6,"подтема":"Возвратные: sich"},{"id":"e16d0f7120","тема":"Местоимения","знак":"🧩","вид":"правило","раздел":"sich + предлог — учить парой","урок":"urok18","урокИмя":"Урок 19","html":"Многие возвратные глаголы держат при себе <b>свой предлог</b>, и его учат вместе с глаголом, как артикль у существительного:<br><br>\n      <b class=\"hl\">sich freuen auf</b> — радоваться тому, что <b>будет</b> (ждать с радостью) · <b class=\"hl\">sich freuen über</b> — тому, что <b>уже есть</b><br>\n      <b class=\"hl\">sich erinnern an</b> — помнить · <b class=\"hl\">sich kümmern um</b> — заботиться · <b class=\"hl\">sich interessieren für</b> — интересоваться<br><br>\n      А <i>sich Sorgen machen</i> (волноваться) — с Dativ, как в разделе 5: <i>Ich mache <b>mir</b> Sorgen</i>, <i>Mach <b>dir</b> keine Sorgen!</i>","текст":"Многие возвратные глаголы держат при себе свой предлог, и его учат вместе с глаголом, как артикль у существительного: sich freuen auf — радоваться тому, что будет (ждать с радостью) · sich freuen über — тому, что уже есть sich erinnern an — помнить · sich kümmern um — заботиться · sich interessieren für — интересоваться А sich Sorgen machen (волноваться) — с Dativ, как в разделе 5: Ich mache mir Sorgen, Mach dir keine Sorgen!","ти":0,"пи":6,"подтема":"Возвратные: sich"},{"id":"b5b286b9af","тема":"Местоимения","знак":"🧩","вид":"правило","раздел":"Про себя: sich … lassen","урок":"urok28","урокИмя":"Урок 29","html":"Самая врачебная конструкция урока: <b>sich</b> плюс <b>lassen</b> плюс инфинитив — «сделать это с собой», «дать себе это сделать». Именно так по-немецки говорят про прививки, обследования, операции:","текст":"Самая врачебная конструкция урока: sich плюс lassen плюс инфинитив — «сделать это с собой», «дать себе это сделать». Именно так по-немецки говорят про прививки, обследования, операции:","ти":0,"пи":6,"подтема":"Возвратные: sich"},{"id":"ee67e76c45","тема":"Глагол: спряжение","знак":"🔤","вид":"ловушка","раздел":"⭐ Повторение: спряжение","урок":"dasha9","урокИмя":"Занятие 9 с Дашей","html":"<span class=\"big\">spielen — «играть», не «спать»</span>\n      Гриша на занятии перевёл <i>spielen</i> как «спать» — это оговорка, Даша не заметила. Спать — <b>schlafen</b>, играть — <b>spielen</b>.","текст":"spielen — «играть», не «спать» Гриша на занятии перевёл spielen как «спать» — это оговорка, Даша не заметила. Спать — schlafen, играть — spielen.","ти":0,"пи":7,"подтема":"Другое"},{"id":"8583ecb53c","тема":"Модальные глаголы","знак":"🔑","вид":"правило","раздел":"Что такое модальный глагол","урок":"dasha2","урокИмя":"Занятие 2 с Дашей","html":"Модальный глагол не называет действие сам — он показывает <b>отношение</b> к действию: <i>могу</i> делать, <i>должен</i> делать, <i>хочу</i> делать, <i>можно</i> делать. Само действие остаётся вторым глаголом.","текст":"Модальный глагол не называет действие сам — он показывает отношение к действию: могу делать, должен делать, хочу делать, можно делать. Само действие остаётся вторым глаголом.","ти":1,"пи":0,"подтема":"Что такое модальный и как спрягается"},{"id":"0af86686d3","тема":"Модальные глаголы","знак":"🔑","вид":"правило","раздел":"sollen — следует, велено","урок":"dasha2","урокИмя":"Занятие 2 с Дашей","html":"Разница с müssen: <b>müssen</b> — внутренняя необходимость («мне надо»), <b>sollen</b> — чужое указание («мне сказали, велено»). Врач пациенту: <i>Sie sollen viel laufen</i> — это рекомендация врача.","текст":"Разница с müssen: müssen — внутренняя необходимость («мне надо»), sollen — чужое указание («мне сказали, велено»). Врач пациенту: Sie sollen viel laufen — это рекомендация врача.","ти":1,"пи":0,"подтема":"Что такое модальный и как спрягается"},{"id":"db1ac5b54f","тема":"Модальные глаголы","знак":"🔑","вид":"правило","раздел":"dürfen — можно, разрешено","урок":"dasha2","урокИмя":"Занятие 2 с Дашей","html":"Разница с können: <b>können</b> — физическая возможность/умение, <b>dürfen</b> — <b>разрешение</b>. <i>Darf ich…?</i> = «Можно мне…?» — вежливая просьба, врачу нужна постоянно.","текст":"Разница с können: können — физическая возможность/умение, dürfen — разрешение. Darf ich…? = «Можно мне…?» — вежливая просьба, врачу нужна постоянно.","ти":1,"пи":0,"подтема":"Что такое модальный и как спрягается"},{"id":"92f9d9268f","тема":"Модальные глаголы","знак":"🔑","вид":"ловушка","раздел":"Модальные глаголы — умляут исчезает","урок":"urok19","урокИмя":"Урок 20","html":"<span class=\"big\">Главное правило раздела: точки над буквой пропадают</span>\n      Модальные из занятия с Дашей в прошедшем времени <b>теряют умляут</b>:<br><br>\n      k<b>ö</b>nnen → k<b>o</b>nnte &nbsp;·&nbsp; m<b>ü</b>ssen → m<b>u</b>sste &nbsp;·&nbsp; d<b>ü</b>rfen → d<b>u</b>rfte &nbsp;·&nbsp; m<b>ö</b>gen → m<b>o</b>chte<br><br>\n      А <i>wollen</i> и <i>sollen</i> умляута и не имели — у них просто добавляется <b>-te</b>.","текст":"Главное правило раздела: точки над буквой пропадают Модальные из занятия с Дашей в прошедшем времени теряют умляут: können → konnte &nbsp;·&nbsp; müssen → musste &nbsp;·&nbsp; dürfen → durfte &nbsp;·&nbsp; mögen → mochte А wollen и sollen умляута и не имели — у них просто добавляется -te.","ти":1,"пи":0,"подтема":"Что такое модальный и как спрягается"},{"id":"67ab138095","тема":"Модальные глаголы","знак":"🔑","вид":"правило","раздел":"Как это устроено — одно правило на всех","урок":"urok19","урокИмя":"Урок 20","html":"Схема простая: <b class=\"hl\">основа + te + окончание</b>. И самое приятное — <b>ich и er/sie/es всегда одинаковые</b>, окончания у них нет вообще.<br><br>\n      Поэтому таблицу можно не зубрить: помнишь одну форму — достаёшь остальные.\n    </div>\n    <table class=\"casetab\">\n      <tr><th>лицо</th><th>окончание</th><th>пример (können)</th></tr>\n      <tr><td class=\"lbl\">ich</td><td><span class=\"wohin\">—</span></td><td>ich konnte</td></tr>\n      <tr><td class=\"lbl\">du</td><td>-st</td><td>du konntest</td></tr>\n      <tr><td class=\"lbl\">er / sie / es</td><td><span class=\"wohin\">—</span></td><td>er konnte</td></tr>\n      <tr><td class=\"lbl\">wir</td><td>-n</td><td>wir konnten</td></tr>\n      <tr><td class=\"lbl\">ihr</td><td>-t</td><td>ihr konntet</td></tr>\n      <tr><td class=\"lbl\">sie / Sie</td><td>-n</td><td>sie konnten</td></tr>\n    </table>\n    <div class=\"grid2\" id=\"konnte\">","текст":"Схема простая: основа + te + окончание. И самое приятное — ich и er/sie/es всегда одинаковые, окончания у них нет вообще. Поэтому таблицу можно не зубрить: помнишь одну форму — достаёшь остальные. лицоокончаниепример (können) ich—ich konnte du-stdu konntest er / sie / es—er konnte wir-nwir konnten ihr-tihr konntet sie / Sie-nsie konnten","ти":1,"пи":0,"подтема":"Что такое модальный и как спрягается"},{"id":"6f0ca59b96","тема":"Модальные глаголы","знак":"🔑","вид":"правило","раздел":"⭐ Четыре формы наизусть","урок":"urok26","урокИмя":"Урок 27","html":"Хорошая новость: учить всю систему не надо. В живой речи работают <b>четыре формы</b>, и их просто заучивают:<br><br>\n      <b class=\"hl\">hätte</b> — «имел бы» (от haben) · <b class=\"hl\">wäre</b> — «был бы» (от sein) · <b class=\"hl\">könnte</b> — «мог бы» (от können) · <b class=\"hl\">würde</b> — «сделал бы» (от werden).<br><br>\n      Все четыре спрягаются одинаково и по знакомому образцу: <span class=\"hl\">у ich и er окончание -e, как у модальных</span>. И у всех — умляут.","текст":"Хорошая новость: учить всю систему не надо. В живой речи работают четыре формы, и их просто заучивают: hätte — «имел бы» (от haben) · wäre — «был бы» (от sein) · könnte — «мог бы» (от können) · würde — «сделал бы» (от werden). Все четыре спрягаются одинаково и по знакомому образцу: у ich и er окончание -e, как у модальных. И у всех — умляут.","ти":1,"пи":0,"подтема":"Что такое модальный и как спрягается"},{"id":"d0bdeb68b4","тема":"Модальные глаголы","знак":"🔑","вид":"правило","раздел":"Мягкий совет: на вашем месте я бы…","урок":"urok26","урокИмя":"Урок 27","html":"Прямое <i>Sie müssen</i> («вы должны») пациенты слышат как давление. Немецкий врач чаще смягчает:<br><br>\n      • <b>An Ihrer Stelle würde ich…</b> — «на вашем месте я бы…»<br>\n      • <b>Es wäre besser, wenn Sie…</b> — «было бы лучше, если бы вы…»<br>\n      • <b>Sie sollten…</b> — «вам стоило бы…» (это тоже Konjunktiv, от sollen)<br>\n      • <b>Ich würde vorschlagen, dass…</b> — «я бы предложил, чтобы…»","текст":"Прямое Sie müssen («вы должны») пациенты слышат как давление. Немецкий врач чаще смягчает: • An Ihrer Stelle würde ich… — «на вашем месте я бы…» • Es wäre besser, wenn Sie… — «было бы лучше, если бы вы…» • Sie sollten… — «вам стоило бы…» (это тоже Konjunktiv, от sollen) • Ich würde vorschlagen, dass… — «я бы предложил, чтобы…»","ти":1,"пи":0,"подтема":"Что такое модальный и как спрягается"},{"id":"92124502f6","тема":"Модальные глаголы","знак":"🔑","вид":"правило","раздел":"Вопросы и просьбы: ob, sollen","урок":"urok43","урокИмя":"Урок 44","html":"<b>Вопрос «да/нет»</b> → <b>ob</b> (урок 31). <b>Вопрос с W-словом</b> → то же слово (wann, wo, warum…). Глагол в обоих случаях — в конец.<br>\n      <b>Просьба или приказ</b> (повелительное наклонение) → <b class=\"hl\">sollen</b>: «Trinken Sie mehr!» → <i>Der Arzt sagt, ich <b>soll</b> mehr trinken</i>.","текст":"Вопрос «да/нет» → ob (урок 31). Вопрос с W-словом → то же слово (wann, wo, warum…). Глагол в обоих случаях — в конец. Просьба или приказ (повелительное наклонение) → sollen: «Trinken Sie mehr!» → Der Arzt sagt, ich soll mehr trinken.","ти":1,"пи":0,"подтема":"Что такое модальный и как спрягается"},{"id":"cc080732a8","тема":"Модальные глаголы","знак":"🔑","вид":"правило","раздел":"⭐ Одна форма — два смысла","урок":"urok44","урокИмя":"Урок 45","html":"У модального глагола бывает <b>обычный смысл</b> — что нужно, можно, велели — и <b>смысл догадки</b>: насколько говорящий уверен. Форма та же, различает только смысл. Подсказка: догадка почти всегда с <b>sein</b> (<i>… krank sein, … eine Thrombose sein</i>) или о прошлом (раздел 4).","текст":"У модального глагола бывает обычный смысл — что нужно, можно, велели — и смысл догадки: насколько говорящий уверен. Форма та же, различает только смысл. Подсказка: догадка почти всегда с sein (… krank sein, … eine Thrombose sein) или о прошлом (раздел 4).","ти":1,"пи":0,"подтема":"Что такое модальный и как спрягается"},{"id":"71d80d5432","тема":"Модальные глаголы","знак":"🔑","вид":"правило","раздел":"Чужие слова: sollen и wollen","урок":"urok44","урокИмя":"Урок 45","html":"<b>sollen</b> — «говорят, что…», «по слухам», «по данным»: сведения от других людей или из документов. <i>Der Oberarzt <b>soll</b> streng sein</i> — «говорят, старший врач строгий».<br>\n      <b>wollen</b> — «утверждает, что сам…», часто с оттенком недоверия. <i>Er <b>will</b> Arzt sein</i> — «он утверждает, что врач (а мы сомневаемся)». Чаще всего так — о прошлом: <i>Sie <b>will</b> alles verstanden haben</i>.","текст":"sollen — «говорят, что…», «по слухам», «по данным»: сведения от других людей или из документов. Der Oberarzt soll streng sein — «говорят, старший врач строгий». wollen — «утверждает, что сам…», часто с оттенком недоверия. Er will Arzt sein — «он утверждает, что врач (а мы сомневаемся)». Чаще всего так — о прошлом: Sie will alles verstanden haben.","ти":1,"пи":0,"подтема":"Что такое модальный и как спрягается"},{"id":"a0a7044e8e","тема":"Артикли и род","знак":"🎨","вид":"ловушка","раздел":"⚠️ Без контекста — можно и так, и так","урок":"polya10","урокИмя":"Занятие 10 Полины","html":"<span class=\"big\">Важное честное замечание от Даши</span>\n      Если предложение стоит само по себе, без контекста вокруг — часто <b>оба варианта верны</b>. «Ein Tisch steht im Zimmer» (какой-то стол стоит в комнате) и «Der Tisch steht im Zimmer» (этот стол стоит в комнате) — оба правильные, просто это разные ситуации. Артикль почти всегда решает контекст, а не одно предложение само по себе.","текст":"Важное честное замечание от Даши Если предложение стоит само по себе, без контекста вокруг — часто оба варианта верны. «Ein Tisch steht im Zimmer» (какой-то стол стоит в комнате) и «Der Tisch steht im Zimmer» (этот стол стоит в комнате) — оба правильные, просто это разные ситуации. Артикль почти всегда решает контекст, а не одно предложение само по себе.","ти":1,"пи":0,"подтема":"Что такое модальный и как спрягается"},{"id":"e9a1f9dd96","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"⭐ man — «можно, говорят, делают»","урок":"polya19","урокИмя":"Занятие 19 Полины","html":"Даша: <b>man</b> — это «человек вообще», любой. На русский переводим безлично: <i>Man kann Sport machen</i> — <b>можно</b> заниматься спортом. Дословно — «человек может».<br>\n      • Это подлежащее, но рода у него нет и артикля нет.<br>\n      • Глагол — как у <i>er / sie / es</i>: <i>man kauft, man fährt, man kann</i>.<br>\n      • <b>man</b> — с маленькой и одной <i>n</i>. <b>der Mann</b> — мужчина, с большой и двумя <i>n</i>.","текст":"Даша: man — это «человек вообще», любой. На русский переводим безлично: Man kann Sport machen — можно заниматься спортом. Дословно — «человек может». • Это подлежащее, но рода у него нет и артикля нет. • Глагол — как у er / sie / es: man kauft, man fährt, man kann. • man — с маленькой и одной n. der Mann — мужчина, с большой и двумя n.","ти":1,"пи":0,"подтема":"Что такое модальный и как спрягается"},{"id":"43dcd6c4d4","тема":"Разное","знак":"📎","вид":"правило","раздел":"Стоит, лежит, висит, сидит","урок":"urok11","урокИмя":"Урок 12","html":"По-русски можно сказать «книга на столе». Немец почти всегда уточнит, <b>как</b> она там: <b class=\"hl\">stehen</b> — стоит (вертикально), <b class=\"hl\">liegen</b> — лежит (горизонтально), <b class=\"hl\">hängen</b> — висит, <b class=\"hl\">sitzen</b> — сидит. Для пациента: <i>Er liegt im Bett</i> — лежит в постели, <i>er sitzt</i> — сидит.","текст":"По-русски можно сказать «книга на столе». Немец почти всегда уточнит, как она там: stehen — стоит (вертикально), liegen — лежит (горизонтально), hängen — висит, sitzen — сидит. Для пациента: Er liegt im Bett — лежит в постели, er sitzt — сидит.","ти":1,"пи":0,"подтема":"Что такое модальный и как спрягается"},{"id":"4d16c926a4","тема":"Разное","знак":"📎","вид":"правило","раздел":"Что угодно впереди — глагол всё равно второй","урок":"urok3","урокИмя":"Урок 4","html":"Первым можно поставить время или место — тогда подлежащее уходит <b class=\"hl\">за</b> глагол: <i>Heute arbeite ich.</i> По-русски «сегодня я работаю», по-немецки «сегодня работаю я». Это самая частая ошибка русскоговорящих.","текст":"Первым можно поставить время или место — тогда подлежащее уходит за глагол: Heute arbeite ich. По-русски «сегодня я работаю», по-немецки «сегодня работаю я». Это самая частая ошибка русскоговорящих.","ти":1,"пи":0,"подтема":"Что такое модальный и как спрягается"},{"id":"8ef5e74cc9","тема":"Разное","знак":"📎","вид":"правило","раздел":"⭐ Два типа связок","урок":"urok40","урокИмя":"Урок 41","html":"<b>Тип 1 — союзы придаточного:</b> weil, obwohl, falls, wenn, da, dass, sodass. После них <b class=\"hl\">глагол уходит в самый конец</b>: <i>…, obwohl er Schmerzen <b>hat</b>.</i><br><br>\n      <b>Тип 2 — слова-связки:</b> deshalb, deswegen, darum, trotzdem, sonst. Они занимают <b>первое место</b> в предложении, и <b class=\"hl\">глагол стоит сразу за ними</b>, а подлежащее — после глагола: <i>Trotzdem <b>geht</b> er …</i><br><br>\n      Пары по смыслу — одно и то же можно сказать двумя способами:","текст":"Тип 1 — союзы придаточного: weil, obwohl, falls, wenn, da, dass, sodass. После них глагол уходит в самый конец: …, obwohl er Schmerzen hat. Тип 2 — слова-связки: deshalb, deswegen, darum, trotzdem, sonst. Они занимают первое место в предложении, и глагол стоит сразу за ними, а подлежащее — после глагола: Trotzdem geht er … Пары по смыслу — одно и то же можно сказать двумя способами:","ти":1,"пи":0,"подтема":"Что такое модальный и как спрягается"},{"id":"81f87240ed","тема":"Разное","знак":"📎","вид":"правило","раздел":"Решение и подпись","урок":"urok51","урокИмя":"Урок 52","html":"Врач может и должен рекомендовать — но <b>die Entscheidung liegt bei Ihnen</b>. Предложите время подумать — <b>Bedenkzeit</b>. Бланк — после беседы, не вместо неё. Согласие можно <b>widerrufen</b> — отозвать.","текст":"Врач может и должен рекомендовать — но die Entscheidung liegt bei Ihnen. Предложите время подумать — Bedenkzeit. Бланк — после беседы, не вместо неё. Согласие можно widerrufen — отозвать.","ти":1,"пи":0,"подтема":"Что такое модальный и как спрягается"},{"id":"b4e97fe112","тема":"Разное","знак":"📎","вид":"правило","раздел":"⭐ Результат: в норме, повышен, понижен","урок":"urok52","урокИмя":"Урок 53","html":"Четыре оценки из учебника (табл. 9.1). Это причастия, которые стоят как прилагательные (урок 42): <b>erhöht</b> — повышен (от erhöhen), <b>erniedrigt</b> — понижен. В разговоре можно и проще: hoch / niedrig.","текст":"Четыре оценки из учебника (табл. 9.1). Это причастия, которые стоят как прилагательные (урок 42): erhöht — повышен (от erhöhen), erniedrigt — понижен. В разговоре можно и проще: hoch / niedrig.","ти":1,"пи":0,"подтема":"Что такое модальный и как спрягается"},{"id":"6dc8594bff","тема":"Модальные глаголы","знак":"🔑","вид":"ловушка","раздел":"⚠️ Правило порядка слов — главное на уроке","урок":"dasha2","урокИмя":"Занятие 2 с Дашей","html":"<span class=\"big\">Смысловой глагол уходит в САМЫЙ КОНЕЦ и не спрягается</span>\n      Даша повторяла это несколько раз: спрягается только модальный глагол (он на 2-м месте), а второй глагол встаёт в конец предложения в инфинитиве — в той форме, в которой он в словаре.","текст":"Смысловой глагол уходит в САМЫЙ КОНЕЦ и не спрягается Даша повторяла это несколько раз: спрягается только модальный глагол (он на 2-м месте), а второй глагол встаёт в конец предложения в инфинитиве — в той форме, в которой он в словаре.","ти":1,"пи":1,"подтема":"Порядок слов с модальным"},{"id":"244f190162","тема":"Модальные глаголы","знак":"🔑","вид":"правило","раздел":"⚠️ Вопрос с модальным глаголом","урок":"dasha5","урокИмя":"Занятие 5 с Дашей","html":"Если в предложении <b>два глагола</b> (модальный + смысловой в конце), в вопрос выносится\n      <b>только модальный</b>. Смысловой глагол остаётся стоять в конце предложения, его не трогаем.","текст":"Если в предложении два глагола (модальный + смысловой в конце), в вопрос выносится только модальный. Смысловой глагол остаётся стоять в конце предложения, его не трогаем.","ти":1,"пи":1,"подтема":"Порядок слов с модальным"},{"id":"9c8a5781e4","тема":"Модальные глаголы","знак":"🔑","вид":"ловушка","раздел":"⚠️ Вопрос с модальным глаголом","урок":"dasha5","урокИмя":"Занятие 5 с Дашей","html":"<span class=\"big\">viel — mehr — am meisten (ещё одно исключение)</span>\n      «Много» по правилам должно образовывать сравнение как обычное слово, но здесь тоже\n      исключение: <b>viel</b> (много) → <b>mehr</b> (больше) → <b>am meisten</b> (больше всего).\n      Сравните с обычным словом: <b>klein</b> (маленький) → <b>kleiner</b> → <b>am kleinsten</b> —\n      вот так выглядит правило, а viel из него выпадает.","текст":"viel — mehr — am meisten (ещё одно исключение) «Много» по правилам должно образовывать сравнение как обычное слово, но здесь тоже исключение: viel (много) → mehr (больше) → am meisten (больше всего). Сравните с обычным словом: klein (маленький) → kleiner → am kleinsten — вот так выглядит правило, а viel из него выпадает.","ти":1,"пи":1,"подтема":"Порядок слов с модальным"},{"id":"fd6c1a3ce8","тема":"Модальные глаголы","знак":"🔑","вид":"правило","раздел":"⭐ Куда именно уезжает глагол","урок":"urok25","урокИмя":"Урок 26","html":"«В конец» — понятно. Но если глаголов два, кто из них последний? Три случая, все встречаются каждый день:<br><br>\n      1️⃣ <b>Один глагол</b> — он и уезжает: <i>…, weil ich Fieber <b>habe</b>.</i><br>\n      2️⃣ <b>С модальным</b> — последним встаёт <span class=\"hl\">модальный</span>, смысловой стоит перед ним: <i>…, weil ich arbeiten <b>muss</b>.</i><br>\n      3️⃣ <b>Прошедшее Perfekt</b> — последним встаёт <span class=\"hl\">haben или sein</span>: <i>…, weil ich Fieber bekommen <b>habe</b>.</i><br><br>\n      И ещё одно: <b>отделяемая приставка возвращается на место</b> и склеивается с глаголом: <i>Der Zug fährt ab</i> → <i>…, weil der Zug später <b>abfährt</b>.</i>","текст":"«В конец» — понятно. Но если глаголов два, кто из них последний? Три случая, все встречаются каждый день: 1️⃣ Один глагол — он и уезжает: …, weil ich Fieber habe. 2️⃣ С модальным — последним встаёт модальный, смысловой стоит перед ним: …, weil ich arbeiten muss. 3️⃣ Прошедшее Perfekt — последним встаёт haben или sein: …, weil ich Fieber bekommen habe. И ещё одно: отделяемая приставка возвращается на место и склеивается с глаголом: Der Zug fährt ab → …, weil der Zug später abfährt.","ти":1,"пи":1,"подтема":"Порядок слов с модальным"},{"id":"45fb7df348","тема":"Приставки","знак":"🔗","вид":"правило","раздел":"Отделяемые приставки: приставка улетает в конец","урок":"urok13","урокИмя":"Урок 14","html":"Помнишь <i>aufstehen</i> и <i>anrufen</i> из урока 12? В команде приставка <b class=\"hl\">отрывается и встаёт в самый конец</b>:<br>\n      <i>auf<b>stehen</b> → <b>Stehen</b> Sie bitte <b class=\"hl\">auf</b>.</i><br><br>\n      Для тебя это критично: половина команд на осмотре — именно такие глаголы (<i>einatmen, ausatmen, ausziehen, anrufen</i>).","текст":"Помнишь aufstehen и anrufen из урока 12? В команде приставка отрывается и встаёт в самый конец: aufstehen → Stehen Sie bitte auf. Для тебя это критично: половина команд на осмотре — именно такие глаголы (einatmen, ausatmen, ausziehen, anrufen).","ти":1,"пи":1,"подтема":"Порядок слов с модальным"},{"id":"a1034ad06a","тема":"Числа, время, даты","знак":"🔢","вид":"правило","раздел":"Порядковые числительные","урок":"dasha1","урокИмя":"Занятие 1 с Дашей","html":"Правило в два пункта: числа <b class=\"hl\">0–19</b> → окончание <b class=\"hl\">-te</b>; от <b class=\"hl\">20</b> → окончание <b class=\"hl\">-ste</b>. Всегда в самый конец слова, в середину ничего не вставляется: <i>vierundzwanzig<b>ste</b></i>.","текст":"Правило в два пункта: числа 0–19 → окончание -te; от 20 → окончание -ste. Всегда в самый конец слова, в середину ничего не вставляется: vierundzwanzigste.","ти":1,"пи":1,"подтема":"Порядок слов с модальным"},{"id":"b1e047a80a","тема":"Числа, время, даты","знак":"🔢","вид":"ловушка","раздел":"Порядковые числительные","урок":"dasha1","урокИмя":"Занятие 1 с Дашей","html":"<b>4 исключения (наизусть):</b> 1 → <b>erste</b> (не «einte»), 3 → <b>dritte</b>, 7 → <b>siebte</b> (теряет -en), 8 → <b>achte</b> (одна t).","текст":"4 исключения (наизусть): 1 → erste (не «einte»), 3 → dritte, 7 → siebte (теряет -en), 8 → achte (одна t).","ти":1,"пи":1,"подтема":"Порядок слов с модальным"},{"id":"1057480d89","тема":"Числа, время, даты","знак":"🔢","вид":"правило","раздел":"Порядковые числительные: какой по счёту?","урок":"urok5","урокИмя":"Урок 6","html":"Обычное число отвечает «сколько?», порядковое — «<b>какой по счёту?</b>» (первый, второй, третий). Правило простое:\n      от 1 до 19 добавляем <b class=\"hl\">-te</b>, от 20 и выше — <b class=\"hl\">-ste</b>. Перед словом почти всегда стоит артикль <i>der/die/das</i>.","текст":"Обычное число отвечает «сколько?», порядковое — «какой по счёту?» (первый, второй, третий). Правило простое: от 1 до 19 добавляем -te, от 20 и выше — -ste. Перед словом почти всегда стоит артикль der/die/das.","ти":1,"пи":1,"подтема":"Порядок слов с модальным"},{"id":"8f27c0acc2","тема":"Числа, время, даты","знак":"🔢","вид":"правило","раздел":"Порядковые числительные: какой по счёту?","урок":"urok5","урокИмя":"Урок 6","html":"От 20 — окончание <b class=\"hl\">-ste</b>: der zwanzig<b>ste</b>, der einundzwanzig<b>ste</b>, der hundert<b>ste</b>.","текст":"От 20 — окончание -ste: der zwanzigste, der einundzwanzigste, der hundertste.","ти":1,"пи":1,"подтема":"Порядок слов с модальным"},{"id":"d8e85a13bf","тема":"Числа, время, даты","знак":"🔢","вид":"ловушка","раздел":"Порядковые числительные: какой по счёту?","урок":"urok5","урокИмя":"Урок 6","html":"Запомни 4 исключения (учат наизусть): <b>1 — erste</b> (не «einte»), <b>3 — dritte</b>, <b>7 — siebte</b> (без -en), <b>8 — achte</b> (одна t).","текст":"Запомни 4 исключения (учат наизусть): 1 — erste (не «einte»), 3 — dritte, 7 — siebte (без -en), 8 — achte (одна t).","ти":1,"пи":1,"подтема":"Порядок слов с модальным"},{"id":"2423e84f92","тема":"Числа, время, даты","знак":"🔢","вид":"правило","раздел":"Порядковые в работе врача и даты","урок":"urok5","урокИмя":"Урок 6","html":"Дата: «какое сегодня число?» — <i>Der Wievielte ist heute?</i> После <b>am</b> порядковое получает <b class=\"hl\">-en</b>: <i>am zwölften Mai, am ersten Oktober</i>.","текст":"Дата: «какое сегодня число?» — Der Wievielte ist heute? После am порядковое получает -en: am zwölften Mai, am ersten Oktober.","ти":1,"пи":1,"подтема":"Порядок слов с модальным"},{"id":"a9acab7126","тема":"Числа, время, даты","знак":"🔢","вид":"ловушка","раздел":"Порядковые в работе врача и даты","урок":"urok5","урокИмя":"Урок 6","html":"Важный нюанс про этажи: <b>der erste Stock = наш «второй этаж»</b> (первый над землёй). Наш первый этаж немцы зовут <i>Erdgeschoss</i> (земляной этаж).","текст":"Важный нюанс про этажи: der erste Stock = наш «второй этаж» (первый над землёй). Наш первый этаж немцы зовут Erdgeschoss (земляной этаж).","ти":1,"пи":1,"подтема":"Порядок слов с модальным"},{"id":"5b017ad0e1","тема":"Числа, время, даты","знак":"🔢","вид":"правило","раздел":"Даты: am + порядковое","урок":"urok6","урокИмя":"Урок 7","html":"Порядковые: до 19 — число + <b>-te</b> (<i>der vierte</i>), от 20 — <b>-ste</b> (<i>der zwanzigste</i>). Исключения: <i>erste, dritte, siebte, achte</i> (подробно — урок 5).<br><br>\n      Какое число — <i>der sechste August</i>. <b class=\"hl\">Какого числа</b> — <b>am</b> + порядковое на <b>-en</b>: <i>am zehnten Oktober</i>.","текст":"Порядковые: до 19 — число + -te (der vierte), от 20 — -ste (der zwanzigste). Исключения: erste, dritte, siebte, achte (подробно — урок 5). Какое число — der sechste August. Какого числа — am + порядковое на -en: am zehnten Oktober.","ти":1,"пи":1,"подтема":"Порядок слов с модальным"},{"id":"dd51b733d0","тема":"Модальные глаголы","знак":"🔑","вид":"правило","раздел":"⚠️ mögen больше не модальный","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"<b>Что случилось.</b> Раньше <b>mögen</b> (нравиться) был модальным глаголом — то есть после него\n      ставили второй глагол. <b>В современном немецком так уже не говорят.</b><br><br>\n      Но формы у него остались старые, модальные — поэтому в таблицах он выглядит как неправильный.","текст":"Что случилось. Раньше mögen (нравиться) был модальным глаголом — то есть после него ставили второй глагол. В современном немецком так уже не говорят. Но формы у него остались старые, модальные — поэтому в таблицах он выглядит как неправильный.","ти":1,"пи":2,"подтема":"mögen и möchten: люблю, хотел бы"},{"id":"bd5af3d675","тема":"Модальные глаголы","знак":"🔑","вид":"правило","раздел":"⚠️ mögen больше не модальный","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"<b>А как сказать «мне нравится что-то делать»?</b> Через слово <b>gern</b> — оно как раз для этого.\n      <i>Ich schwimme gern</i> = я плаваю с удовольствием = мне нравится плавать.\n      Именно поэтому <b>gern</b> встречается почти в каждом предложении упражнения.","текст":"А как сказать «мне нравится что-то делать»? Через слово gern — оно как раз для этого. Ich schwimme gern = я плаваю с удовольствием = мне нравится плавать. Именно поэтому gern встречается почти в каждом предложении упражнения.","ти":1,"пи":2,"подтема":"mögen и möchten: люблю, хотел бы"},{"id":"38322fc62a","тема":"Модальные глаголы","знак":"🔑","вид":"ловушка","раздел":"⚠️ mögen больше не модальный","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"<span class=\"big\">Правило простое</span>\n      После <b>mögen</b> ставим <b>существительное</b>, а не глагол.<br>\n      ✅ Ich mag Musik. (мне нравится музыка)<br>\n      ❌ Ich mag schwimmen. — так больше не говорят","текст":"Правило простое После mögen ставим существительное, а не глагол. ✅ Ich mag Musik. (мне нравится музыка) ❌ Ich mag schwimmen. — так больше не говорят","ти":1,"пи":2,"подтема":"mögen и möchten: люблю, хотел бы"},{"id":"a3313633a0","тема":"Модальные глаголы","знак":"🔑","вид":"правило","раздел":"⚠️ «Люблю» и «нравится» — три разных способа","урок":"urok14","урокИмя":"Урок 15","html":"1️⃣ <b class=\"hl\">gern</b> + глагол = «люблю что-то делать»: <i>Ich esse <b>gern</b> Fisch</i> — буквально «я ем охотно рыбу». Самый частый способ.<br>\n      2️⃣ <b class=\"hl\">mögen</b> = «любить» про сам продукт: <i>Ich <b>mag</b> Käse</i>. Это седьмой модальный глагол — родной брат <i>möchten</i>, который был у Даши.<br>\n      3️⃣ <b class=\"hl\">schmecken</b> = «быть вкусным» — про еду, которая уже во рту.","текст":"1️⃣ gern + глагол = «люблю что-то делать»: Ich esse gern Fisch — буквально «я ем охотно рыбу». Самый частый способ. 2️⃣ mögen = «любить» про сам продукт: Ich mag Käse. Это седьмой модальный глагол — родной брат möchten, который был у Даши. 3️⃣ schmecken = «быть вкусным» — про еду, которая уже во рту.","ти":1,"пи":2,"подтема":"mögen и möchten: люблю, хотел бы"},{"id":"b488cd0560","тема":"Падежи","знак":"📦","вид":"ловушка","раздел":"⚠️ «Люблю» и «нравится» — три разных способа","урок":"urok14","урокИмя":"Урок 15","html":"<span class=\"big\">Ловушка schmecken: подлежащее — еда, а ты — в Dativ</span>\n      Немец не говорит «я нахожу вкусным» — он говорит <b>«оно мне вкусно»</b>: <i>Das schmeckt <b>mir</b> gut</i>. Подлежащее — сама еда, а ты стоишь в <b>Dativ</b> (тот самый падеж из урока 11). Вежливая форма — <i>Schmeckt es <b>Ihnen</b>?</i>","текст":"Ловушка schmecken: подлежащее — еда, а ты — в Dativ Немец не говорит «я нахожу вкусным» — он говорит «оно мне вкусно»: Das schmeckt mir gut. Подлежащее — сама еда, а ты стоишь в Dativ (тот самый падеж из урока 11). Вежливая форма — Schmeckt es Ihnen?","ти":1,"пи":2,"подтема":"mögen и möchten: люблю, хотел бы"},{"id":"350a1f9c6c","тема":"Модальные глаголы","знак":"🔑","вид":"правило","раздел":"⭐⭐ Карта: три вида глаголов","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"<b>Что вообще происходит.</b> Глагол в немецком меняет хвостик в зависимости от того, кто действует.\n      «Я живу», «ты живёшь», «он живёт» — по-немецки это тоже три разных хвостика.<br><br>\n      Даша разложила <b>все глаголы немецкого языка</b> на три кучки. Это и есть вся тема целиком:<br><br>\n      1️⃣ <span class=\"hl\">Правильные</span> — 90–95% всех глаголов. Просто добавляем окончание, больше ничего.<br>\n      2️⃣ <span class=\"hl\">С изменяемой гласной</span> — те же окончания, но внутри слова меняется буква.<br>\n      3️⃣ <span class=\"hl\">Пять исключений</span> — sein, haben, werden, wissen, tun. Их просто заучиваем.<br><br>\n      Плюс отдельно стоят <b>модальные глаголы</b> — их вы разобрали на прошлом занятии.","текст":"Что вообще происходит. Глагол в немецком меняет хвостик в зависимости от того, кто действует. «Я живу», «ты живёшь», «он живёт» — по-немецки это тоже три разных хвостика. Даша разложила все глаголы немецкого языка на три кучки. Это и есть вся тема целиком: 1️⃣ Правильные — 90–95% всех глаголов. Просто добавляем окончание, больше ничего. 2️⃣ С изменяемой гласной — те же окончания, но внутри слова меняется буква. 3️⃣ Пять исключений — sein, haben, werden, wissen, tun. Их просто заучиваем. Плюс отдельно стоят модальные глаголы — их вы разобрали на прошлом занятии.","ти":1,"пи":3,"подтема":"Модальные в прошлом и в Konjunktiv"},{"id":"865c9e2244","тема":"Модальные глаголы","знак":"🔑","вид":"правило","раздел":"⭐ «Следовало»: с модальными глаголами","урок":"urok33","урокИмя":"Урок 34","html":"Самый частый случай — сожаление: <b class=\"hl\">hätte + инфинитив + модальный глагол</b>. Порядок особый: <b>оба глагола стоят в самом конце, модальный — последним</b>. Здесь модальный остаётся инфинитивом (<i>sollen</i>, а не <i>gesollt</i>) — это исключение из привычной формулы. Значения: <b>sollen</b> — «следовало», <b>können</b> — «мог бы», <b>müssen</b> — «должен был», <b>dürfen</b> с nicht — «не следовало».","текст":"Самый частый случай — сожаление: hätte + инфинитив + модальный глагол. Порядок особый: оба глагола стоят в самом конце, модальный — последним. Здесь модальный остаётся инфинитивом (sollen, а не gesollt) — это исключение из привычной формулы. Значения: sollen — «следовало», können — «мог бы», müssen — «должен был», dürfen с nicht — «не следовало».","ти":1,"пи":3,"подтема":"Модальные в прошлом и в Konjunktiv"},{"id":"fa29e29751","тема":"Модальные глаголы","знак":"🔑","вид":"правило","раздел":"Если бы… (о прошлом)","урок":"urok33","урокИмя":"Урок 34","html":"<b>Wenn + hätte/wäre + Partizip II</b> — условие, которое не выполнилось. Во второй части — тоже <b>hätte/wäre + Partizip II</b> (или с модальным). В обеих частях используется одна и та же конструкция.","текст":"Wenn + hätte/wäre + Partizip II — условие, которое не выполнилось. Во второй части — тоже hätte/wäre + Partizip II (или с модальным). В обеих частях используется одна и та же конструкция.","ти":1,"пи":3,"подтема":"Модальные в прошлом и в Konjunktiv"},{"id":"8d8c8be226","тема":"Прошедшее время","знак":"⏮","вид":"ловушка","раздел":"⚠️ als — когда один раз в прошлом","урок":"urok25","урокИмя":"Урок 26","html":"<span class=\"big\">Главная ловушка урока</span>\n      По-русски и там, и там «когда». По-немецки выбор жёсткий:<br><br>\n      <b>als</b> — событие в прошлом, которое было <span class=\"hl\">один раз</span>: <i><b>Als</b> ich Kind war…</i>, <i><b>Als</b> der Arzt kam…</i><br>\n      <b>wenn</b> — настоящее, будущее или то, что <span class=\"hl\">повторялось</span>: <i><b>Wenn</b> ich Zeit habe…</i>, <i>immer <b>wenn</b> ich Kaffee trinke…</i><br><br>\n      Проверка в одну секунду: если это было <b>однажды и в прошлом</b> — als. Во всех остальных случаях — wenn.","текст":"Главная ловушка урока По-русски и там, и там «когда». По-немецки выбор жёсткий: als — событие в прошлом, которое было один раз: Als ich Kind war…, Als der Arzt kam… wenn — настоящее, будущее или то, что повторялось: Wenn ich Zeit habe…, immer wenn ich Kaffee trinke… Проверка в одну секунду: если это было однажды и в прошлом — als. Во всех остальных случаях — wenn.","ти":1,"пи":3,"подтема":"Модальные в прошлом и в Konjunktiv"},{"id":"3100949ad6","тема":"Прошедшее время","знак":"⏮","вид":"правило","раздел":"Настоящее или прошлое","урок":"urok33","урокИмя":"Урок 34","html":"Сравните с уроком 26: <b>würde + инфинитив</b> и <b>hätte + Partizip II</b> — это «сделал бы сейчас» и «сделал бы тогда». Если ситуация ещё может измениться — Präsens, если уже поздно — Vergangenheit.","текст":"Сравните с уроком 26: würde + инфинитив и hätte + Partizip II — это «сделал бы сейчас» и «сделал бы тогда». Если ситуация ещё может измениться — Präsens, если уже поздно — Vergangenheit.","ти":1,"пи":3,"подтема":"Модальные в прошлом и в Konjunktiv"},{"id":"cf08092dc2","тема":"Прошедшее время","знак":"⏮","вид":"правило","раздел":"О прошлом: er habe … gehabt","урок":"urok43","урокИмя":"Урок 44","html":"Если пациент рассказывает о прошлом, берём <b>habe / sei + Partizip II</b> — как Perfekt, только вспомогательный глагол в Konjunktiv I. Выбор haben или sein — прежний: движение и смена состояния — sein.","текст":"Если пациент рассказывает о прошлом, берём habe / sei + Partizip II — как Perfekt, только вспомогательный глагол в Konjunktiv I. Выбор haben или sein — прежний: движение и смена состояния — sein.","ти":1,"пи":3,"подтема":"Модальные в прошлом и в Konjunktiv"},{"id":"e823e8161c","тема":"Порядок слов","знак":"📐","вид":"правило","раздел":"Если бы: нереальное условие","урок":"urok26","урокИмя":"Урок 27","html":"Вторая работа этих форм — разговор о том, чего нет. Схема ровно как в уроке 25, только оба глагола в Konjunktiv II:<br><br>\n      <i><b>Wenn</b> ich Zeit <b>hätte</b>, <b>würde</b> ich <b>kommen</b>.</i> — Если бы у меня было время, я бы пришёл. (а времени нет)<br><br>\n      Сравните с реальным условием из прошлого урока: <i>Wenn ich Zeit <b>habe</b>, <b>komme</b> ich</i> — «когда у меня есть время, я прихожу». Одна буква меняет смысл: <b>habe</b> — бывает, <b>hätte</b> — не бывает.<br><br>\n      Порядок слов тот же: в придаточном глагол в конец, после запятой сразу глагол главного.","текст":"Вторая работа этих форм — разговор о том, чего нет. Схема ровно как в уроке 25, только оба глагола в Konjunktiv II: Wenn ich Zeit hätte, würde ich kommen. — Если бы у меня было время, я бы пришёл. (а времени нет) Сравните с реальным условием из прошлого урока: Wenn ich Zeit habe, komme ich — «когда у меня есть время, я прихожу». Одна буква меняет смысл: habe — бывает, hätte — не бывает. Порядок слов тот же: в придаточном глагол в конец, после запятой сразу глагол главного.","ти":1,"пи":3,"подтема":"Модальные в прошлом и в Konjunktiv"},{"id":"b3fd7f938a","тема":"Модальные глаголы","знак":"🔑","вид":"правило","раздел":"⭐ Что когда употреблять — короткое правило","урок":"urok19","урокИмя":"Урок 20","html":"Чтобы не путаться, держи в голове ровно это:<br><br>\n      <b class=\"hl\">war, hatte, модальные</b> (и четыре слова из раздела 8) → в разговоре <b>Präteritum</b>.<br>\n      <b class=\"hl\">все остальные глаголы</b> → в разговоре <b>Perfekt</b> (урок 12), в письменном тексте — Präteritum (раздел 10).<br><br>\n      То есть в одном предложении они спокойно уживаются: <i>Ich <b>war</b> beim Arzt und <b>habe</b> Tabletten <b>bekommen</b>.</i>","текст":"Чтобы не путаться, держи в голове ровно это: war, hatte, модальные (и четыре слова из раздела 8) → в разговоре Präteritum. все остальные глаголы → в разговоре Perfekt (урок 12), в письменном тексте — Präteritum (раздел 10). То есть в одном предложении они спокойно уживаются: Ich war beim Arzt und habe Tabletten bekommen.","ти":2,"пи":0,"подтема":"Perfekt: как строится"},{"id":"430a433466","тема":"Прошедшее время","знак":"⏮","вид":"правило","раздел":"Зачем нужен Perfekt","урок":"urok12","урокИмя":"Урок 13","html":"В немецком есть два прошедших времени. В <b>разговоре</b> почти всегда используют <b class=\"hl\">Perfekt</b> — его и учим. Второе (Präteritum) живёт в книгах и отчётах; из него в речи берут только <i>war</i> (был) и <i>hatte</i> (имел) — они в разделе 8.<br><br>\n      Для тебя это <b>язык анамнеза</b>: всё, что пациент рассказывает о случившемся, идёт в Perfekt.","текст":"В немецком есть два прошедших времени. В разговоре почти всегда используют Perfekt — его и учим. Второе (Präteritum) живёт в книгах и отчётах; из него в речи берут только war (был) и hatte (имел) — они в разделе 8. Для тебя это язык анамнеза: всё, что пациент рассказывает о случившемся, идёт в Perfekt.","ти":2,"пи":0,"подтема":"Perfekt: как строится"},{"id":"d3712c2e4f","тема":"Прошедшее время","знак":"⏮","вид":"правило","раздел":"⚠️ Формула — рамка тебе уже знакома","урок":"urok12","урокИмя":"Урок 13","html":"Спрягается <b>haben</b> или <b>sein</b> (стоит на 2-м месте), а <b class=\"hl\">Partizip II не меняется никогда</b> — просто ставится в конец. Одна форма на все лица.","текст":"Спрягается haben или sein (стоит на 2-м месте), а Partizip II не меняется никогда — просто ставится в конец. Одна форма на все лица.","ти":2,"пи":0,"подтема":"Perfekt: как строится"},{"id":"0b8980e9fb","тема":"Прошедшее время","знак":"⏮","вид":"правило","раздел":"war и hatte — короче, чем Perfekt","урок":"urok12","урокИмя":"Урок 13","html":"У двух самых частых глаголов немцы в разговоре <b>не говорят</b> длинный Perfekt: вместо <i>ich bin gewesen</i> — просто <b class=\"hl\">ich war</b> (я был), вместо <i>ich habe gehabt</i> — <b class=\"hl\">ich hatte</b> (у меня был). Правильно и так, и так, но так звучит живая речь. В анамнезе — на каждом шагу: «была температура», «были операции», «был у врача».","текст":"У двух самых частых глаголов немцы в разговоре не говорят длинный Perfekt: вместо ich bin gewesen — просто ich war (я был), вместо ich habe gehabt — ich hatte (у меня был). Правильно и так, и так, но так звучит живая речь. В анамнезе — на каждом шагу: «была температура», «были операции», «был у врача».","ти":2,"пи":0,"подтема":"Perfekt: как строится"},{"id":"878b2a1e70","тема":"Прошедшее время","знак":"⏮","вид":"правило","раздел":"Переезд и регистрация","урок":"urok15","урокИмя":"Урок 16","html":"«Переезжать» — <b class=\"hl\">umziehen</b>, «въезжать» — <b class=\"hl\">einziehen</b>. Оба с отделяемой приставкой (урок 13) и в Perfekt идут через <b>sein</b> — это движение (урок 12): <i>Wir <b>sind</b> eingezogen</i>.","текст":"«Переезжать» — umziehen, «въезжать» — einziehen. Оба с отделяемой приставкой (урок 13) и в Perfekt идут через sein — это движение (урок 12): Wir sind eingezogen.","ти":2,"пи":0,"подтема":"Perfekt: как строится"},{"id":"e2817baa14","тема":"Прошедшее время","знак":"⏮","вид":"правило","раздел":"Perfekt или Präteritum — когда какое","урок":"urok29","урокИмя":"Урок 30","html":"В устной речи немцы почти всегда берут <b>Perfekt</b>: <i>Ich habe das Bein untersucht</i>. <b>Präteritum</b> живёт в письменной речи — в рассказах, новостях, протоколах и, самое важное для вас, в <b>Arztbrief</b> (врачебной выписке). Там пишут не «ich habe untersucht», а просто <b>untersuchte</b>.","текст":"В устной речи немцы почти всегда берут Perfekt: Ich habe das Bein untersucht. Präteritum живёт в письменной речи — в рассказах, новостях, протоколах и, самое важное для вас, в Arztbrief (врачебной выписке). Там пишут не «ich habe untersucht», а просто untersuchte.","ти":2,"пи":0,"подтема":"Perfekt: как строится"},{"id":"2a0dd9792c","тема":"Прошедшее время","знак":"⏮","вид":"правило","раздел":"Похоже на Plusquamperfekt — но смысл другой","урок":"urok33","урокИмя":"Урок 34","html":"Формула: <b class=\"hl\">hätte / wäre + Partizip II</b>. Выбор между hätte и wäre — тот же, что в Perfekt: движение и смена состояния — <b>wäre</b>, остальное — <b>hätte</b>. Разница в смысле: Plusquamperfekt (<b>hatte</b>, <b>war</b>) рассказывает о том, что было на самом деле. Konjunktiv II (<b>hätte</b>, <b>wäre</b>) — о том, чего не случилось, но могло бы.","текст":"Формула: hätte / wäre + Partizip II. Выбор между hätte и wäre — тот же, что в Perfekt: движение и смена состояния — wäre, остальное — hätte. Разница в смысле: Plusquamperfekt (hatte, war) рассказывает о том, что было на самом деле. Konjunktiv II (hätte, wäre) — о том, чего не случилось, но могло бы.","ти":2,"пи":0,"подтема":"Perfekt: как строится"},{"id":"58dcc6f7c0","тема":"Прошедшее время","знак":"⏮","вид":"правило","раздел":"⭐ Perfekt: ist … worden","урок":"urok35","урокИмя":"Урок 36","html":"В устной речи чаще Perfekt. Два правила:<br>\n      1. Вспомогательный глагол — <b>всегда sein</b> (ist, sind, bin), потому что werden — глагол изменения состояния.<br>\n      2. В самом конце — <b class=\"hl\">worden</b>, <b>без ge-</b>. Форма <i>geworden</i> означает «стал», а <i>worden</i> — только пассив.","текст":"В устной речи чаще Perfekt. Два правила: 1. Вспомогательный глагол — всегда sein (ist, sind, bin), потому что werden — глагол изменения состояния. 2. В самом конце — worden, без ge-. Форма geworden означает «стал», а worden — только пассив.","ти":2,"пи":0,"подтема":"Perfekt: как строится"},{"id":"7178c3fc20","тема":"Прошедшее время","знак":"⏮","вид":"правило","раздел":"Plusquamperfekt и Futur — кратко","урок":"urok35","урокИмя":"Урок 36","html":"<b>Plusquamperfekt</b> (урок 32): <i>war … worden</i> — что случилось раньше другого прошлого события.<br>\n      <b>Futur I</b> в пассиве (<i>wird … werden</i>) грамматически правильный, но звучит тяжело. Для будущего обычно берут <b>Präsens + слово времени</b> (урок 34): <i>Der Patient wird morgen operiert</i>.","текст":"Plusquamperfekt (урок 32): war … worden — что случилось раньше другого прошлого события. Futur I в пассиве (wird … werden) грамматически правильный, но звучит тяжело. Для будущего обычно берут Präsens + слово времени (урок 34): Der Patient wird morgen operiert.","ти":2,"пи":0,"подтема":"Perfekt: как строится"},{"id":"0748890ccb","тема":"Прошедшее время","знак":"⏮","вид":"правило","раздел":"⭐⭐ Три правила времён","урок":"urok54","урокИмя":"Урок 55","html":"Главное в письменной части. Правила — из решения учебника к упражнению 13.3:<br>\n      <b>1.</b> Всё, что было <b>до поступления</b>, — <b>Präteritum</b> (и Perfekt): <i>Die Beschwerden traten … auf.</i><br>\n      <b>2.</b> Всё, что <b>сообщает пациент</b>, — <b>Konjunktiv I</b>: <i>sie habe, er sei</i> (урок 43). Так врач показывает: это слова пациента, а не проверенный факт.<br>\n      <b>3.</b> <b>Находки</b> — <b>Präsens</b> или Präteritum: <i>Im Ultraschall zeigt sich …</i><br>\n      Лечение в клинике — Präteritum (<i>Wir führten … durch</i>), рекомендация — Präsens (<i>Wir empfehlen …</i>).","текст":"Главное в письменной части. Правила — из решения учебника к упражнению 13.3: 1. Всё, что было до поступления, — Präteritum (и Perfekt): Die Beschwerden traten … auf. 2. Всё, что сообщает пациент, — Konjunktiv I: sie habe, er sei (урок 43). Так врач показывает: это слова пациента, а не проверенный факт. 3. Находки — Präsens или Präteritum: Im Ultraschall zeigt sich … Лечение в клинике — Präteritum (Wir führten … durch), рекомендация — Präsens (Wir empfehlen …).","ти":2,"пи":0,"подтема":"Perfekt: как строится"},{"id":"bef3746032","тема":"Прошедшее время","знак":"⏮","вид":"правило","раздел":"Partizip II — быстрый повтор","урок":"urok27","урокИмя":"Урок 28","html":"Три правила из урока про Perfekt, коротко:<br>\n      • обычный глагол — <b>ge-</b> + основа + <b>-t</b><br>\n      • глагол на <b>-ieren</b> и с неотделяемой приставкой (<b>be-, ver-, unter-, emp-, ent-</b>) — <b>без ge-</b><br>\n      • отделяемая приставка — <b>ge-</b> встаёт <b>внутрь</b>, между приставкой и основой<br><br>\n      Девять новых врачебных глаголов на все три случая:","текст":"Три правила из урока про Perfekt, коротко: • обычный глагол — ge- + основа + -t • глагол на -ieren и с неотделяемой приставкой (be-, ver-, unter-, emp-, ent-) — без ge- • отделяемая приставка — ge- встаёт внутрь, между приставкой и основой Девять новых врачебных глаголов на все три случая:","ти":2,"пи":2,"подтема":"Partizip II: ge- … -t / -en"},{"id":"f1e2166d11","тема":"Прошедшее время","знак":"⏮","вид":"правило","раздел":"⭐ Формула: hatte/war + Partizip II","урок":"urok32","урокИмя":"Урок 33","html":"Формула точно та же, что у Perfekt (урок 12), только вспомогательный глагол — в Präteritum: <b class=\"hl\">hatte</b> или <b class=\"hl\">war</b> (не hat/ist) плюс уже знакомый <b class=\"hl\">Partizip II</b> в конце.","текст":"Формула точно та же, что у Perfekt (урок 12), только вспомогательный глагол — в Präteritum: hatte или war (не hat/ist) плюс уже знакомый Partizip II в конце.","ти":2,"пи":2,"подтема":"Partizip II: ge- … -t / -en"},{"id":"b0c94bd3cb","тема":"Прошедшее время","знак":"⏮","вид":"правило","раздел":"⭐ Один глагол — все времена","урок":"urok35","урокИмя":"Урок 36","html":"Главное правило всего урока: <b>Partizip II смыслового глагола (operiert) не меняется никогда</b>. Время показывает только <b class=\"hl\">werden</b> — он и меняет форму. Посмотрите на одну фразу во всех временах сверху вниз.","текст":"Главное правило всего урока: Partizip II смыслового глагола (operiert) не меняется никогда. Время показывает только werden — он и меняет форму. Посмотрите на одну фразу во всех временах сверху вниз.","ти":2,"пи":2,"подтема":"Partizip II: ge- … -t / -en"},{"id":"b0d99215e5","тема":"Прошедшее время","знак":"⏮","вид":"правило","раздел":"⭐ Präteritum: wurde + Partizip II","урок":"urok35","урокИмя":"Урок 36","html":"Самое частое прошедшее в пассиве — именно Präteritum, особенно на письме. <b class=\"hl\">werden</b> в Präteritum:<br>\n      <b>ich</b> wurde · <b>du</b> wurdest · <b>er/sie/es</b> wurde · <b>wir</b> wurden · <b>ihr</b> wurdet · <b>sie/Sie</b> wurden","текст":"Самое частое прошедшее в пассиве — именно Präteritum, особенно на письме. werden в Präteritum: ich wurde · du wurdest · er/sie/es wurde · wir wurden · ihr wurdet · sie/Sie wurden","ти":2,"пи":2,"подтема":"Partizip II: ge- … -t / -en"},{"id":"d88c7ab14b","тема":"Прошедшее время","знак":"⏮","вид":"правило","раздел":"⭐ Partizip II: der operierte Patient","урок":"urok42","урокИмя":"Урок 43","html":"Берём уже знакомую форму из Perfekt (<i>operiert, genäht, verschrieben, geschwollen</i>) и ставим перед существительным. Дальше она получает <b>обычные окончания прилагательного</b> (урок 24): <i>der operiert<b>e</b> Patient, ein operiert<b>er</b> Patient, die operiert<b>en</b> Patienten</i>.<br>\n      Смысл — действие <b>уже совершено над</b> предметом: рану зашили → зашитая рана.","текст":"Берём уже знакомую форму из Perfekt (operiert, genäht, verschrieben, geschwollen) и ставим перед существительным. Дальше она получает обычные окончания прилагательного (урок 24): der operierte Patient, ein operierter Patient, die operierten Patienten. Смысл — действие уже совершено над предметом: рану зашили → зашитая рана.","ти":2,"пи":2,"подтема":"Partizip II: ge- … -t / -en"},{"id":"b62ccd85db","тема":"Приставки","знак":"🔗","вид":"правило","раздел":"Когда ge- НЕ ставится","урок":"urok12","урокИмя":"Урок 13","html":"Два случая, оба тебе пригодятся постоянно:<br><br>\n      1️⃣ Глаголы на <b class=\"hl\">-ieren</b> (почти все из латыни — то есть половина медицинских): <i>operieren → operiert</i>, <i>telefonieren → telefoniert</i>. <b>Приставки ge- нет.</b><br><br>\n      2️⃣ Глаголы с <b class=\"hl\">неотделяемой приставкой</b> (be-, ver-, er-, ent-, emp-, ge-, miss-, zer-): <i>besuchen → besucht</i>, <i>verstehen → verstanden</i>. Тоже <b>без ge-</b>.","текст":"Два случая, оба тебе пригодятся постоянно: 1️⃣ Глаголы на -ieren (почти все из латыни — то есть половина медицинских): operieren → operiert, telefonieren → telefoniert. Приставки ge- нет. 2️⃣ Глаголы с неотделяемой приставкой (be-, ver-, er-, ent-, emp-, ge-, miss-, zer-): besuchen → besucht, verstehen → verstanden. Тоже без ge-.","ти":2,"пи":2,"подтема":"Partizip II: ge- … -t / -en"},{"id":"157ce75756","тема":"Приставки","знак":"🔗","вид":"правило","раздел":"Отделяемые приставки: ge- прячется внутрь","урок":"urok12","урокИмя":"Урок 13","html":"У глаголов с отделяемой приставкой (an-, auf-, ein-, mit-, aus-, zu-) частица <b class=\"hl\">-ge-</b> встаёт <b>между приставкой и корнем</b>: <i>an<b>ge</b>rufen</i>, <i>auf<b>ge</b>standen</i>. Слово пишется слитно.","текст":"У глаголов с отделяемой приставкой (an-, auf-, ein-, mit-, aus-, zu-) частица -ge- встаёт между приставкой и корнем: angerufen, aufgestanden. Слово пишется слитно.","ти":2,"пи":2,"подтема":"Partizip II: ge- … -t / -en"},{"id":"087c9d7424","тема":"Модальные глаголы","знак":"🔑","вид":"правило","раздел":"🩺 Выписка (Arztbrief)","урок":"urok35","урокИмя":"Урок 36","html":"Так выглядит типичный кусок выписки — связный текст о пациенте с тромбозом глубоких вен. Почти каждое предложение в пассиве: в Arztbrief неважно, <b>кто</b> делал, важно, <b>что</b> сделано. Прошлое — Präteritum, рекомендации — Präsens или модальный глагол.","текст":"Так выглядит типичный кусок выписки — связный текст о пациенте с тромбозом глубоких вен. Почти каждое предложение в пассиве: в Arztbrief неважно, кто делал, важно, что сделано. Прошлое — Präteritum, рекомендации — Präsens или модальный глагол.","ти":2,"пи":3,"подтема":"Präteritum: war, hatte, konnte"},{"id":"4739cba145","тема":"Прошедшее время","знак":"⏮","вид":"правило","раздел":"⚠️ Зачем нужно второе прошедшее время","урок":"urok19","урокИмя":"Урок 20","html":"Верхняя строка каждой пары грамматически не ошибка, но так не говорят. Нижняя — то, что ты услышишь в кабинете и скажешь сам.","текст":"Верхняя строка каждой пары грамматически не ошибка, но так не говорят. Нижняя — то, что ты услышишь в кабинете и скажешь сам.","ти":2,"пи":3,"подтема":"Präteritum: war, hatte, konnte"},{"id":"98bfefb4a1","тема":"Прошедшее время","знак":"⏮","вид":"ловушка","раздел":"⚠️ Зачем нужно второе прошедшее время","урок":"urok19","урокИмя":"Урок 20","html":"<span class=\"big\">Для этих слов правило переворачивается</span>\n      У <b>sein</b>, <b>haben</b> и <b>модальных глаголов</b> форма Perfekt в живой речи звучит тяжело и книжно. Немцы вместо неё говорят Präteritum. Послушай обе пары подряд — разница слышна сразу:","текст":"Для этих слов правило переворачивается У sein, haben и модальных глаголов форма Perfekt в живой речи звучит тяжело и книжно. Немцы вместо неё говорят Präteritum. Послушай обе пары подряд — разница слышна сразу:","ти":2,"пи":3,"подтема":"Präteritum: war, hatte, konnte"},{"id":"ee8b134221","тема":"Прошедшее время","знак":"⏮","вид":"правило","раздел":"Ещё четыре, которые и в речи идут в Präteritum","урок":"urok19","урокИмя":"Урок 20","html":"Кроме war, hatte и модальных, немцы в разговоре почти всегда говорят Präteritum ещё у нескольких частых глаголов. Самое нужное врачу — <b class=\"hl\">es gab</b> («было, имелось»): <i>Es gab keine Komplikationen</i> — «осложнений не было».","текст":"Кроме war, hatte и модальных, немцы в разговоре почти всегда говорят Präteritum ещё у нескольких частых глаголов. Самое нужное врачу — es gab («было, имелось»): Es gab keine Komplikationen — «осложнений не было».","ти":2,"пи":3,"подтема":"Präteritum: war, hatte, konnte"},{"id":"8ad5c18c74","тема":"Прошедшее время","знак":"⏮","вид":"правило","раздел":"Präteritum в письме — язык выписки","урок":"urok19","урокИмя":"Урок 20","html":"А вот в <b>Arztbrief</b> (врачебном письме, выписке) Präteritum используется <b class=\"hl\">для всех глаголов подряд</b> — это стандартный письменный стиль. Тебе это понадобится на Fachsprachprüfung, где надо писать заключение.<br><br>\n      Обрати внимание на <i>wurde entlassen</i> — «был выписан»: это страдательный залог в Präteritum, в выписках он на каждом шагу.","текст":"А вот в Arztbrief (врачебном письме, выписке) Präteritum используется для всех глаголов подряд — это стандартный письменный стиль. Тебе это понадобится на Fachsprachprüfung, где надо писать заключение. Обрати внимание на wurde entlassen — «был выписан»: это страдательный залог в Präteritum, в выписках он на каждом шагу.","ти":2,"пи":3,"подтема":"Präteritum: war, hatte, konnte"},{"id":"4078f118cc","тема":"Прошедшее время","знак":"⏮","вид":"правило","раздел":"🩺 Язык выписки","урок":"urok42","урокИмя":"Урок 43","html":"Особенно частая модель: <b>bei + Partizip I + существительное</b> — «при нарастающем…», «при сохраняющихся…»: <i>bei zunehmend<b>er</b> Schwellung, bei anhaltend<b>en</b> Schmerzen</i> (после bei — Dativ).","текст":"Особенно частая модель: bei + Partizip I + существительное — «при нарастающем…», «при сохраняющихся…»: bei zunehmender Schwellung, bei anhaltenden Schmerzen (после bei — Dativ).","ти":2,"пи":3,"подтема":"Präteritum: war, hatte, konnte"},{"id":"b4847b7c4c","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"⭐ Два языка: с пациентом и в выписке","урок":"urok48","урокИмя":"Урок 49","html":"В выписке часто наречие: <b>auskultatorisch</b> unauffällig — «аускультативно без особенностей», <b>palpatorisch</b> kein Druckschmerz. Сокращения из учебника: <b>AZ</b> — Allgemeinzustand (общее состояние), <b>EZ</b> — Ernährungszustand (питание), <b>o. B.</b> — ohne Befund (без патологии), <b>bds.</b> — beidseits (с обеих сторон).","текст":"В выписке часто наречие: auskultatorisch unauffällig — «аускультативно без особенностей», palpatorisch kein Druckschmerz. Сокращения из учебника: AZ — Allgemeinzustand (общее состояние), EZ — Ernährungszustand (питание), o. B. — ohne Befund (без патологии), bds. — beidseits (с обеих сторон).","ти":2,"пи":3,"подтема":"Präteritum: war, hatte, konnte"},{"id":"fd659d0f80","тема":"Падежи","знак":"📦","вид":"правило","раздел":"🩺 Genitiv в выписке","урок":"urok37","урокИмя":"Урок 38","html":"Типичные фразы из Arztbrief и описания обследования. Обратите внимание: если перед существительным стоит прилагательное, у него в Genitiv окончание <b>-en</b>: <i>des recht<b>en</b> Oberschenkels</i>, <i>des link<b>en</b> Beines</i>.","текст":"Типичные фразы из Arztbrief и описания обследования. Обратите внимание: если перед существительным стоит прилагательное, у него в Genitiv окончание -en: des rechten Oberschenkels, des linken Beines.","ти":2,"пи":3,"подтема":"Präteritum: war, hatte, konnte"},{"id":"a507825257","тема":"Разное","знак":"📎","вид":"правило","раздел":"🩺 Анамнез в выписке","урок":"urok43","урокИмя":"Урок 44","html":"Типичные вводные глаголы: <b>berichten</b> (сообщать), <b>angeben</b> (указывать: <i>er gibt an</i>), <b>erzählen</b>, <b>sagen</b>, <b>meinen</b>. А для «отрицает» есть готовое слово без косвенной речи: <b>verneinen</b> — <i>Der Patient verneint Fieber</i>.","текст":"Типичные вводные глаголы: berichten (сообщать), angeben (указывать: er gibt an), erzählen, sagen, meinen. А для «отрицает» есть готовое слово без косвенной речи: verneinen — Der Patient verneint Fieber.","ти":2,"пи":3,"подтема":"Präteritum: war, hatte, konnte"},{"id":"fffab5d62a","тема":"Разное","знак":"📎","вид":"правило","раздел":"🩺 Разговор с пациентом и выписка","урок":"urok46","урокИмя":"Урок 47","html":"В выписке — <i>die Diagnose stellen, in Betracht ziehen, ein Gespräch führen</i>. С пациентом — <i>Bescheid geben, eine Entscheidung treffen, in Frage kommen, Kontakt aufnehmen</i>. Это готовые кирпичи для экзамена ÖÄK: и для устной части, и для письма.","текст":"В выписке — die Diagnose stellen, in Betracht ziehen, ein Gespräch führen. С пациентом — Bescheid geben, eine Entscheidung treffen, in Frage kommen, Kontakt aufnehmen. Это готовые кирпичи для экзамена ÖÄK: и для устной части, и для письма.","ти":2,"пи":3,"подтема":"Präteritum: war, hatte, konnte"},{"id":"6b04ca34a9","тема":"Разное","знак":"📎","вид":"правило","раздел":"⭐ Два языка: с пациентом и в выписке","урок":"urok48","урокИмя":"Урок 49","html":"С пациентом — только простые немецкие глаголы. Латинские слова — для коллег и для выписки. Сказать пациенту «ich mache jetzt eine Palpation» — ошибка, которую экзаменатор заметит сразу.
