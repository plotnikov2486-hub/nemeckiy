","текст":"С пациентом — только простые немецкие глаголы. Латинские слова — для коллег и для выписки. Сказать пациенту «ich mache jetzt eine Palpation» — ошибка, которую экзаменатор заметит сразу.","ти":2,"пи":3,"подтема":"Präteritum: war, hatte, konnte"},{"id":"caf42e0999","тема":"Прошедшее время","знак":"⏮","вид":"правило","раздел":"Два события — какое раньше","урок":"urok32","урокИмя":"Урок 33","html":"Смотрите на пары: во второй фразе появляется <b class=\"hl\">hatte … genommen</b> — это событие случилось <b>раньше</b> того, что описано простым прошедшим.","текст":"Смотрите на пары: во второй фразе появляется hatte … genommen — это событие случилось раньше того, что описано простым прошедшим.","ти":2,"пи":4,"подтема":"Plusquamperfekt: прошлое перед прошлым"},{"id":"d321a1308b","тема":"Прошедшее время","знак":"⏮","вид":"правило","раздел":"nachdem и bevor задают порядок","урок":"urok32","урокИмя":"Урок 33","html":"<b>nachdem</b> («после того как») + Plusquamperfekt в одной части, простое прошедшее — в другой. <b>bevor</b> («прежде чем») работает так же, только порядок обратный.","текст":"nachdem («после того как») + Plusquamperfekt в одной части, простое прошедшее — в другой. bevor («прежде чем») работает так же, только порядок обратный.","ти":2,"пи":4,"подтема":"Plusquamperfekt: прошлое перед прошлым"},{"id":"5754626867","тема":"Предлоги","знак":"🧭","вид":"правило","раздел":"⚠️ Союз или предлог: bevor / vor","урок":"urok45","урокИмя":"Урок 46","html":"Перед <b>целым предложением</b> (есть глагол) — союз: <i>bevor, nachdem, während</i>. Перед <b>существительным</b> — предлог: <i>vor + Dativ, nach + Dativ, während + Genitiv</i> (урок 37). Только <i>während</i> бывает и тем, и другим.","текст":"Перед целым предложением (есть глагол) — союз: bevor, nachdem, während. Перед существительным — предлог: vor + Dativ, nach + Dativ, während + Genitiv (урок 37). Только während бывает и тем, и другим.","ти":2,"пи":4,"подтема":"Plusquamperfekt: прошлое перед прошлым"},{"id":"afe83646e9","тема":"Порядок слов","знак":"📐","вид":"правило","раздел":"⭐ bevor, nachdem, während","урок":"urok45","урокИмя":"Урок 46","html":"Все три — как <i>weil</i> и <i>dass</i> (урок 25): глагол уезжает <b>в конец</b>. Если придаточное стоит впереди, дальше сразу глагол главного: <b>«глагол, запятая, глагол»</b>.<br>\n      <b>bevor</b> — перед тем как, до того как · <b>nachdem</b> — после того как · <b>während</b> — пока, в то время как (одновременно).","текст":"Все три — как weil и dass (урок 25): глагол уезжает в конец. Если придаточное стоит впереди, дальше сразу глагол главного: «глагол, запятая, глагол». bevor — перед тем как, до того как · nachdem — после того как · während — пока, в то время как (одновременно).","ти":2,"пи":4,"подтема":"Plusquamperfekt: прошлое перед прошлым"},{"id":"80086f89fc","тема":"Разное","знак":"📎","вид":"правило","раздел":"⭐⭐ Какое время после nachdem","урок":"urok45","урокИмя":"Урок 46","html":"После <b>nachdem</b> действие уже <b>закончилось</b>, поэтому время ставят «на шаг раньше», чем в главной части:","текст":"После nachdem действие уже закончилось, поэтому время ставят «на шаг раньше», чем в главной части:","ти":2,"пи":4,"подтема":"Plusquamperfekt: прошлое перед прошлым"},{"id":"b3d892ab0e","тема":"Разное","знак":"📎","вид":"правило","раздел":"⭐ Связки: как вести разговор","урок":"urok47","урокИмя":"Урок 48","html":"Хороший анамнез — это не допрос по списку. Между частями — <b>переход</b> («теперь несколько вопросов о…»), к сказанному раньше — <b>ссылка</b> («вы говорили, что…»), для проверки — <b>переспрос</b> и <b>резюме</b>, перед личным вопросом — <b>предупреждение</b>. В конце — <b>предварительный диагноз</b> через догадку (урок 44) и следующий шаг. Экзаменаторы оценивают именно эту структуру.","текст":"Хороший анамнез — это не допрос по списку. Между частями — переход («теперь несколько вопросов о…»), к сказанному раньше — ссылка («вы говорили, что…»), для проверки — переспрос и резюме, перед личным вопросом — предупреждение. В конце — предварительный диагноз через догадку (урок 44) и следующий шаг. Экзаменаторы оценивают именно эту структуру.","ти":2,"пи":4,"подтема":"Plusquamperfekt: прошлое перед прошлым"},{"id":"9a0117a562","тема":"Прошедшее время","знак":"⏮","вид":"правило","раздел":"⭐⭐ Пассив — язык науки","урок":"urok56","урокИмя":"Урок 57","html":"Почему в докладе почти всё в пассиве: в центре — <b>предмет исследования</b>, а не исследователь. Не «мы сделали», а «было сделано». Учебник честно добавляет: в англоязычной науке сейчас советуют больше актива — «так понятнее»; <i>Wir untersuchten 200 Patienten</i> тоже правильно. Но пассив надо знать.<br><br>\n      <b>Как строится:</b> <i>werden</i> в нужной форме + Partizip II в конце (уроки <a href=\"urok27_interactive.html\">27</a> и <a href=\"urok35_interactive.html\">35</a>).<br>\n      <b>Актив → пассив:</b> объект актива становится подлежащим, а подлежащее уходит в <i>von + Dativ</i>: <i>Der Arzt untersucht den Patienten → Der Patient wird <b>von dem Arzt</b> untersucht.</i>","текст":"Почему в докладе почти всё в пассиве: в центре — предмет исследования, а не исследователь. Не «мы сделали», а «было сделано». Учебник честно добавляет: в англоязычной науке сейчас советуют больше актива — «так понятнее»; Wir untersuchten 200 Patienten тоже правильно. Но пассив надо знать. Как строится: werden в нужной форме + Partizip II в конце (уроки 27 и 35). Актив → пассив: объект актива становится подлежащим, а подлежащее уходит в von + Dativ: Der Arzt untersucht den Patienten → Der Patient wird von dem Arzt untersucht.","ти":2,"пи":5,"подтема":"Будущее и пассив: werden"},{"id":"344144fe9e","тема":"Слова, которые путают","знак":"⚠️","вид":"правило","раздел":"Aktiv или Passiv — в чём разница","урок":"urok27","урокИмя":"Урок 28","html":"В обычном предложении (<b>Aktiv</b>) на первом месте — тот, кто действует: врач, медсестра, хирург. В <b>Passiv</b> на первое место выходит тот, <b>с кем это делают</b> — чаще всего пациент. Тот, кто действовал, либо вообще пропадает из фразы, либо уходит в конец необязательным довеском (раздел 5).<br><br>\n      Смотрите, что происходит с предложением: то, что в Aktiv было дополнением (кого? — Akkusativ), в Passiv становится подлежащим (кто? — Nominativ).","текст":"В обычном предложении (Aktiv) на первом месте — тот, кто действует: врач, медсестра, хирург. В Passiv на первое место выходит тот, с кем это делают — чаще всего пациент. Тот, кто действовал, либо вообще пропадает из фразы, либо уходит в конец необязательным довеском (раздел 5). Смотрите, что происходит с предложением: то, что в Aktiv было дополнением (кого? — Akkusativ), в Passiv становится подлежащим (кто? — Nominativ).","ти":2,"пи":5,"подтема":"Будущее и пассив: werden"},{"id":"8114bcb4cb","тема":"Слова, которые путают","знак":"⚠️","вид":"правило","раздел":"lassen или пассив — в чём разница","урок":"urok28","урокИмя":"Урок 29","html":"Оба варианта переводятся на русский почти одинаково, но по смыслу — нет. <b>Пассив</b> (урок 27) — просто факт, без вопроса, кто это затеял. <b>lassen</b> — подчёркивает, что кто-то <b>сам обратился</b> и организовал: пошёл, попросил, записался.","текст":"Оба варианта переводятся на русский почти одинаково, но по смыслу — нет. Пассив (урок 27) — просто факт, без вопроса, кто это затеял. lassen — подчёркивает, что кто-то сам обратился и организовал: пошёл, попросил, записался.","ти":2,"пи":5,"подтема":"Будущее и пассив: werden"},{"id":"5144669b6d","тема":"Слова, которые путают","знак":"⚠️","вид":"правило","раздел":"Предположение о настоящем","урок":"urok34","урокИмя":"Урок 35","html":"У Futur I есть второе значение: <b>догадка о том, что происходит сейчас</b>. Обычно рядом стоят слова <b class=\"hl\">wohl</b>, <b class=\"hl\">wahrscheinlich</b>, <b class=\"hl\">schon</b> («наверное», «вероятно»). Перевод — «он, наверное, дома», а не «он будет дома».","текст":"У Futur I есть второе значение: догадка о том, что происходит сейчас. Обычно рядом стоят слова wohl, wahrscheinlich, schon («наверное», «вероятно»). Перевод — «он, наверное, дома», а не «он будет дома».","ти":2,"пи":5,"подтема":"Будущее и пассив: werden"},{"id":"ed6f984253","тема":"Разное","знак":"📎","вид":"правило","раздел":"Futur или Präsens?","урок":"urok34","урокИмя":"Урок 35","html":"Чаще всего будущее выражают <b>обычным Präsens со словом времени</b> (morgen, bald, nächste Woche). <b>Futur I</b> нужен, когда это <b>обещание или намерение</b>, <b>прогноз</b> или когда слова времени нет.","текст":"Чаще всего будущее выражают обычным Präsens со словом времени (morgen, bald, nächste Woche). Futur I нужен, когда это обещание или намерение, прогноз или когда слова времени нет.","ти":2,"пи":5,"подтема":"Будущее и пассив: werden"},{"id":"cfce10bf73","тема":"Множественное число","знак":"➕","вид":"правило","раздел":"⭐⭐ Женский род: -in и -innen","урок":"dasha8","урокИмя":"Занятие 8 с Дашей","html":"<b>Что это вообще такое.</b> У предметов род задан раз и навсегда — переделать «стол» в женский род нельзя. Но если слово обозначает <b>человека</b> (профессия, национальность), от мужского рода делают женский. И в немецком это <b>обязательно</b>: про женщину-врача нельзя сказать <i>der Arzt</i>, как по-русски «она врач». Только <i>die Ärztin</i>.<br><br>\n      <b>Правило:</b> артикль <b>der → die</b> + суффикс <b>-in</b>: <i>der Lehrer → die Lehrer<b>in</b></i>.<br>\n      Если слово кончается на <b>-e</b> — <i>e</i> выпадает: <i>der Löw<b>e</b> → die Löw<b>in</b></i>, <i>der Kolleg<b>e</b> → die Kolleg<b>in</b></i>.<br>\n      Изредка появляется умляут: <i>der Arzt → die <b>Ä</b>rztin</i>.<br><br>\n      ⭐ <b>Множественное от -in — всегда -innen</b>: <i>die Lehrerin → die Lehrerin<b>nen</b></i>. Это самое надёжное правило множественного числа в немецком.","текст":"Что это вообще такое. У предметов род задан раз и навсегда — переделать «стол» в женский род нельзя. Но если слово обозначает человека (профессия, национальность), от мужского рода делают женский. И в немецком это обязательно: про женщину-врача нельзя сказать der Arzt, как по-русски «она врач». Только die Ärztin. Правило: артикль der → die + суффикс -in: der Lehrer → die Lehrerin. Если слово кончается на -e — e выпадает: der Löwe → die Löwin, der Kollege → die Kollegin. Изредка появляется умляут: der Arzt → die Ärztin. ⭐ Множественное от -in — всегда -innen: die Lehrerin → die Lehrerinnen. Это самое надёжное правило множественного числа в немецком.","ти":3,"пи":0,"подтема":"der, die, das: как угадать род"},{"id":"f5f06ece9c","тема":"Множественное число","знак":"➕","вид":"правило","раздел":"der / die / das — три рода","урок":"urok2","урокИмя":"Урок 3","html":"У каждого немецкого существительного свой род: <b>der</b> — мужской, <b>die</b> — женский, <b>das</b> — средний. Род <b class=\"hl\">учат вместе со словом</b>: не «Arzt», а «der Arzt». Во множественном числе у всех одно — <b>die</b>: <i>die Ärzte, die Tabletten</i>.","текст":"У каждого немецкого существительного свой род: der — мужской, die — женский, das — средний. Род учат вместе со словом: не «Arzt», а «der Arzt». Во множественном числе у всех одно — die: die Ärzte, die Tabletten.","ти":3,"пи":0,"подтема":"der, die, das: как угадать род"},{"id":"a344c7b1d0","тема":"Числа, время, даты","знак":"🔢","вид":"правило","раздел":"Как угадать род: приметы","урок":"urok2","урокИмя":"Урок 3","html":"<b>die</b> — всегда, если слово кончается на <b>-ung, -heit, -keit, -ion</b>, и почти всегда на <b>-ie</b>. Таких слов в медицине десятки.<br>\n      <b>das</b> — всегда на <b>-chen</b> и <b>-lein</b> (уменьшительное), и почти всегда на <b>-ment</b>.<br>\n      <b>der</b> — мужчины, дни недели, месяцы, времена года.<br><br>\n      <b class=\"hl\">Длинные слова-составные</b> получают род по последнему кусочку: <i>das Haus → das Krankenhaus</i>, <i>der Druck → der Blutdruck</i>.","текст":"die — всегда, если слово кончается на -ung, -heit, -keit, -ion, и почти всегда на -ie. Таких слов в медицине десятки. das — всегда на -chen и -lein (уменьшительное), и почти всегда на -ment. der — мужчины, дни недели, месяцы, времена года. Длинные слова-составные получают род по последнему кусочку: das Haus → das Krankenhaus, der Druck → der Blutdruck.","ти":3,"пи":0,"подтема":"der, die, das: как угадать род"},{"id":"f7624989c3","тема":"Артикли и род","знак":"🎨","вид":"ловушка","раздел":"Артикли и род","урок":"dasha1","урокИмя":"Занятие 1 с Дашей","html":"Григорий спросил, есть ли принцип запоминания рода. <b>Ответ Даши: принципа нет</b> — род зазубривается вместе со словом. Поэтому существительное учим <b>всегда с артиклем</b>: артикль и есть носитель рода.","текст":"Григорий спросил, есть ли принцип запоминания рода. Ответ Даши: принципа нет — род зазубривается вместе со словом. Поэтому существительное учим всегда с артиклем: артикль и есть носитель рода.","ти":3,"пи":0,"подтема":"der, die, das: как угадать род"},{"id":"6b67a8386e","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"Суффиксы женского рода","урок":"polya10","урокИмя":"Занятие 10 Полины","html":"Заранее угадать род существительного обычно нельзя — его приходится просто запоминать вместе со словом. Но у <b>женского рода</b> есть подсказки: если слово кончается на один из этих суффиксов, оно почти всегда женского рода.","текст":"Заранее угадать род существительного обычно нельзя — его приходится просто запоминать вместе со словом. Но у женского рода есть подсказки: если слово кончается на один из этих суффиксов, оно почти всегда женского рода.","ти":3,"пи":0,"подтема":"der, die, das: как угадать род"},{"id":"6a603f5a0f","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"Суффиксы женского рода","урок":"polya10","урокИмя":"Занятие 10 Полины","html":"И бонус: все слова с этими суффиксами (кроме -in) образуют множественное число одинаково — окончанием <b>-en</b>. А у суффикса <b>-in</b> своё правило, мы его уже знаем с занятия 8: множественное — <b>-innen</b>.","текст":"И бонус: все слова с этими суффиксами (кроме -in) образуют множественное число одинаково — окончанием -en. А у суффикса -in своё правило, мы его уже знаем с занятия 8: множественное — -innen.","ти":3,"пи":0,"подтема":"der, die, das: как угадать род"},{"id":"3104ba90a2","тема":"Артикли и род","знак":"🎨","вид":"ловушка","раздел":"Тренируем на листе","урок":"polya14","урокИмя":"Занятие 14 Полины","html":"<span class=\"big\">Три ловушки этого упражнения</span>\n      • <b>teurer</b> — это «дороже» (с <b>als</b>). Полина хотела <s>am teuersten</s> — это «самый дорогой», а по смыслу нужно было «дороже, чем».<br>\n      • Не <s>mehr gut</s>, а <b>besser</b>: у gut своя форма.<br>\n      • <b>der Bus</b> — мужской род, не das.","текст":"Три ловушки этого упражнения • teurer — это «дороже» (с als). Полина хотела am teuersten — это «самый дорогой», а по смыслу нужно было «дороже, чем». • Не mehr gut, а besser: у gut своя форма. • der Bus — мужской род, не das.","ти":3,"пи":0,"подтема":"der, die, das: как угадать род"},{"id":"60b310de66","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"⭐⭐ Новая тема: женский род профессий (феминитивы)","урок":"polya7","урокИмя":"Занятие 7 Полины","html":"<b>Как образуется:</b><br>\n      1️⃣ меняем артикль <b class=\"hl\">der → die</b><br>\n      2️⃣ добавляем суффикс <b class=\"hl\">-in</b><br>\n      3️⃣ если слово кончается на <b>-e</b>, эту -e <b>убираем</b>: <i>der Löw<b>e</b> → die Löw<b>in</b></i>","текст":"Как образуется: 1️⃣ меняем артикль der → die 2️⃣ добавляем суффикс -in 3️⃣ если слово кончается на -e, эту -e убираем: der Löwe → die Löwin","ти":3,"пи":0,"подтема":"der, die, das: как угадать род"},{"id":"8f802c5a1e","тема":"Артикли и род","знак":"🎨","вид":"ловушка","раздел":"⭐⭐ Новая тема: женский род профессий (феминитивы)","урок":"polya7","урокИмя":"Занятие 7 Полины","html":"<span class=\"big\">В немецком феминитивы обязательны — это не вежливость, а грамматика</span>\n      Даша подчеркнула разницу с русским: у нас феминитивы часто опускают («она врач», «она директор»), и это нормально. <b>В немецком так нельзя</b> — правило строго регулируется грамматикой.<br><br>\n      Про женщину-врача скажут только <b class=\"hl\">die Ärztin</b>, никогда не <i>der Arzt</i>. Для тебя это прямо рабочее слово.","текст":"В немецком феминитивы обязательны — это не вежливость, а грамматика Даша подчеркнула разницу с русским: у нас феминитивы часто опускают («она врач», «она директор»), и это нормально. В немецком так нельзя — правило строго регулируется грамматикой. Про женщину-врача скажут только die Ärztin, никогда не der Arzt. Для тебя это прямо рабочее слово.","ти":3,"пи":0,"подтема":"der, die, das: как угадать род"},{"id":"6aeb7fced6","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"⭐ Женский род: главное правило","урок":"polya8","урокИмя":"Занятие 8 Полины","html":"<b>Что вообще происходит.</b> В немецком у слов, обозначающих людей, есть мужская и женская форма.\n      Не «врач» на всех, а <b>врач-мужчина</b> и <b>врач-женщина</b> — разными словами.<br><br>\n      <b>Правило целиком:</b><br>\n      1️⃣ Меняем артикль: <span class=\"hl\">der</span> → <span class=\"hl\">die</span><br>\n      2️⃣ Добавляем в конец слова <span class=\"hl\">-in</span><br><br>\n      Всё. Больше ничего делать не надо.","текст":"Что вообще происходит. В немецком у слов, обозначающих людей, есть мужская и женская форма. Не «врач» на всех, а врач-мужчина и врач-женщина — разными словами. Правило целиком: 1️⃣ Меняем артикль: der → die 2️⃣ Добавляем в конец слова -in Всё. Больше ничего делать не надо.","ти":3,"пи":0,"подтема":"der, die, das: как угадать род"},{"id":"7f2b121eb6","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"Что происходит с артиклем","урок":"urok17","урокИмя":"Урок 18","html":"Akkusativ ты проходил в уроке 4 («у меня болит нога»). Напомню главное: <b class=\"hl\">меняется только мужской род</b> — <i>der → den</i>. Женский, средний и множественное остаются как в именительном.<br><br>\n      Сравни две строки — вот вся разница между «где» и «куда»:\n    </div>\n    <table class=\"casetab\">\n      <tr><th></th><th>муж. род</th><th>жен. род</th><th>ср. род</th><th>мн. ч.</th></tr>\n      <tr><td class=\"lbl\"><span class=\"wo\">Wo?</span> → Dativ</td><td>dem</td><td>der</td><td>dem</td><td>den</td></tr>\n      <tr><td class=\"lbl\"><span class=\"wohin\">Wohin?</span> → Akkusativ</td><td><b>den</b></td><td>die</td><td>das</td><td>die</td></tr>\n    </table>\n    <div class=\"warn-box\">\n      <span class=\"big\">Осторожно: den есть в обеих строках</span>\n      В Dativ <b>den</b> — это множественное число (<i>in den Zimmern</i>), а в Akkusativ <b>den</b> — мужской род (<i>in den Raum</i>). Одно слово, две разные работы. Смотри на существительное рядом.","текст":"Akkusativ ты проходил в уроке 4 («у меня болит нога»). Напомню главное: меняется только мужской род — der → den. Женский, средний и множественное остаются как в именительном. Сравни две строки — вот вся разница между «где» и «куда»: муж. роджен. родср. родмн. ч. Wo? → Dativdemderdemden Wohin? → Akkusativdendiedasdie Осторожно: den есть в обеих строках В Dativ den — это множественное число (in den Zimmern), а в Akkusativ den — мужской род (in den Raum). Одно слово, две разные работы. Смотри на существительное рядом.","ти":3,"пи":0,"подтема":"der, die, das: как угадать род"},{"id":"ead9ab2bd0","тема":"Артикли и род","знак":"🎨","вид":"ловушка","раздел":"Что происходит с артиклем","урок":"urok17","урокИмя":"Урок 18","html":"<span class=\"big\">Осторожно: den есть в обеих строках</span>\n      В Dativ <b>den</b> — это множественное число (<i>in den Zimmern</i>), а в Akkusativ <b>den</b> — мужской род (<i>in den Raum</i>). Одно слово, две разные работы. Смотри на существительное рядом.","текст":"Осторожно: den есть в обеих строках В Dativ den — это множественное число (in den Zimmern), а в Akkusativ den — мужской род (in den Raum). Одно слово, две разные работы. Смотри на существительное рядом.","ти":3,"пи":0,"подтема":"der, die, das: как угадать род"},{"id":"eb4407e775","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"der / die / das — три рода","урок":"urok2","урокИмя":"Урок 3","html":"<b>Род не совпадает с русским.</b> Девочка — средний род, нога — средний, рука — мужской, нос — женский. Надеяться на русское чутьё нельзя.","текст":"Род не совпадает с русским. Девочка — средний род, нога — средний, рука — мужской, нос — женский. Надеяться на русское чутьё нельзя.","ти":3,"пи":0,"подтема":"der, die, das: как угадать род"},{"id":"864f16a4b8","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"⭐ Правило одного сигнала","урок":"urok24","урокИмя":"Урок 25","html":"В паре «артикль + прилагательное» кто-то <b>один</b> обязан показать род и падеж. Немецкий не терпит, чтобы это не было сказано, но и дважды повторять не любит.<br><br>\n      • <b>der</b> gut<b>e</b> Arzt — артикль уже сказал «мужской, именительный». Прилагательному остаётся мягкое <b>-e</b>.<br>\n      • <b>ein</b> gut<b>er</b> Arzt — <i>ein</i> одинаковый и у мужского, и у среднего рода: сигнала нет. Прилагательное <b>договаривает</b> за него: <b>-er</b>.<br>\n      • gut<b>er</b> Wein — артикля нет совсем. Прилагательное берёт его окончание себе: <b>-er</b>, как <i>der</i>.<br><br>\n      Отсюда и три случая, которые дальше. Запоминать надо, по сути, один: где артикль сигнал <b>не</b> даёт.","текст":"В паре «артикль + прилагательное» кто-то один обязан показать род и падеж. Немецкий не терпит, чтобы это не было сказано, но и дважды повторять не любит. • der gute Arzt — артикль уже сказал «мужской, именительный». Прилагательному остаётся мягкое -e. • ein guter Arzt — ein одинаковый и у мужского, и у среднего рода: сигнала нет. Прилагательное договаривает за него: -er. • guter Wein — артикля нет совсем. Прилагательное берёт его окончание себе: -er, как der. Отсюда и три случая, которые дальше. Запоминать надо, по сути, один: где артикль сигнал не даёт.","ти":3,"пи":0,"подтема":"der, die, das: как угадать род"},{"id":"4c93336b6e","тема":"Падежи","знак":"📦","вид":"правило","раздел":"⭐ Как выбрать: род от слова, падеж от роли","урок":"urok38","урокИмя":"Урок 39","html":"Два вопроса по очереди:<br>\n      1. <b>Какого рода и числа</b> слово, к которому относится придаточное? <i>der Patient</i> → мужской, единственное.<br>\n      2. <b>Какую роль</b> оно играет <b>внутри придаточного</b>? Кто? — Nominativ. Кого? — Akkusativ. Кому? — Dativ. Чей? — Genitiv.<br>\n      Одно и то же слово <i>der Patient</i> — четыре разных формы:","текст":"Два вопроса по очереди: 1. Какого рода и числа слово, к которому относится придаточное? der Patient → мужской, единственное. 2. Какую роль оно играет внутри придаточного? Кто? — Nominativ. Кого? — Akkusativ. Кому? — Dativ. Чей? — Genitiv. Одно и то же слово der Patient — четыре разных формы:","ти":3,"пи":0,"подтема":"der, die, das: как угадать род"},{"id":"9918f9f92f","тема":"Множественное число","знак":"➕","вид":"правило","раздел":"ein / eine — «какой-то», неопределённый","урок":"urok2","урокИмя":"Урок 3","html":"Называем предмет впервые — <b>ein</b> (для der и das) или <b>eine</b> (для die). Уже известно, о чём речь, — <b>der / die / das</b>. Во множественном числе <i>ein</i> нет: <i>Das sind Tabletten.</i>","текст":"Называем предмет впервые — ein (для der и das) или eine (для die). Уже известно, о чём речь, — der / die / das. Во множественном числе ein нет: Das sind Tabletten.","ти":3,"пи":1,"подтема":"ein, eine: неопределённый артикль"},{"id":"fd0ca1ddc3","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"⭐⭐ Артикли: определённый и неопределённый","урок":"polya10","урокИмя":"Занятие 10 Полины","html":"<b>Что это вообще такое.</b> Артикль — служебное слово перед существительным. Само по себе оно ничего не значит, но показывает три вещи сразу: <b>род</b> (мужской, женский, средний), <b>число</b> (один или много) и <b>падеж</b>.<br><br>\n      В немецком есть <b>два вида</b> артикля:","текст":"Что это вообще такое. Артикль — служебное слово перед существительным. Само по себе оно ничего не значит, но показывает три вещи сразу: род (мужской, женский, средний), число (один или много) и падеж. В немецком есть два вида артикля:","ти":3,"пи":1,"подтема":"ein, eine: неопределённый артикль"},{"id":"3d523caa2a","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"⭐⭐ Артикли: определённый и неопределённый","урок":"polya10","урокИмя":"Занятие 10 Полины","html":"<b>Определённый</b> — тот, что уже есть в словарях: <span class=\"hl\">der, die, das</span>, во множественном всегда <span class=\"hl\">die</span>.<br>\n      <b>Неопределённый</b> — <span class=\"hl\">ein</span> (мужской и средний род) и <span class=\"hl\">eine</span> (женский род).<br><br>\n      <b>Важно запомнить:</b> у множественного числа неопределённого артикля <b>вообще нет</b>. Там, где по-русски сказали бы «какие-то», по-немецки просто не ставят никакого артикля.","текст":"Определённый — тот, что уже есть в словарях: der, die, das, во множественном всегда die. Неопределённый — ein (мужской и средний род) и eine (женский род). Важно запомнить: у множественного числа неопределённого артикля вообще нет. Там, где по-русски сказали бы «какие-то», по-немецки просто не ставят никакого артикля.","ти":3,"пи":1,"подтема":"ein, eine: неопределённый артикль"},{"id":"b855550793","тема":"Артикли и род","знак":"🎨","вид":"ловушка","раздел":"⭐⭐ Артикли: определённый и неопределённый","урок":"polya10","урокИмя":"Занятие 10 Полины","html":"<span class=\"big\">Когда какой ставить</span>\n      1️⃣ Предмет называем <b>первый раз</b> в разговоре → неопределённый.<br>\n      2️⃣ Предмет уже <b>называли раньше</b>, речь про тот же самый → определённый.<br>\n      3️⃣ У предмета есть <b>описание, свойство</b> (прилагательное) → определённый — потому что этим свойством обладает уже конкретный предмет, а не любой.<br>\n      4️⃣ Предмет просто <b>что-то делает</b>, и это может быть любой похожий предмет → неопределённый.","текст":"Когда какой ставить 1️⃣ Предмет называем первый раз в разговоре → неопределённый. 2️⃣ Предмет уже называли раньше, речь про тот же самый → определённый. 3️⃣ У предмета есть описание, свойство (прилагательное) → определённый — потому что этим свойством обладает уже конкретный предмет, а не любой. 4️⃣ Предмет просто что-то делает, и это может быть любой похожий предмет → неопределённый.","ти":3,"пи":1,"подтема":"ein, eine: неопределённый артикль"},{"id":"45bb56b8d3","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"⭐⭐ Неопределённый артикль — новая тема","урок":"polya13","урокИмя":"Занятие 13 Полины","html":"<b>Что тут важно</b><br>\n      1️⃣ <b>В Akkusativ меняется только мужской род</b>: ein → <b>einen</b>. Женский и средний остаются как в Nominativ. Ровно как у определённого: der → den.<br>\n      2️⃣ В <b>Dativ</b> две формы: <b>einem</b> (муж. и ср.) и <b>einer</b> (жен.) — как dem и der.<br>\n      3️⃣ В <b>Genitiv</b> тоже две: <b>eines</b> (муж. и ср.) и <b>einer</b> (жен.). И не забываем <span class=\"hl\">-s или -es у самого слова</span>: eines Mann<b>es</b>, eines Kind<b>es</b>, eines Haus<b>es</b>.<br>\n      4️⃣ <b>Во множественном числе неопределённого артикля нет вообще.</b> Просто <i>Kinder lachen</i> — «дети смеются».","текст":"Что тут важно 1️⃣ В Akkusativ меняется только мужской род: ein → einen. Женский и средний остаются как в Nominativ. Ровно как у определённого: der → den. 2️⃣ В Dativ две формы: einem (муж. и ср.) и einer (жен.) — как dem и der. 3️⃣ В Genitiv тоже две: eines (муж. и ср.) и einer (жен.). И не забываем -s или -es у самого слова: eines Mannes, eines Kindes, eines Hauses. 4️⃣ Во множественном числе неопределённого артикля нет вообще. Просто Kinder lachen — «дети смеются».","ти":3,"пи":1,"подтема":"ein, eine: неопределённый артикль"},{"id":"0feca6b01e","тема":"Артикли и род","знак":"🎨","вид":"ловушка","раздел":"⭐⭐ Неопределённый артикль — новая тема","урок":"polya13","урокИмя":"Занятие 13 Полины","html":"<span class=\"big\">Когда ставим неопределённый артикль</span>\n      Даша дала три случая — и попросила записать их отдельно:<br>\n      1️⃣ Предмет <b>называем впервые</b>, слушатель его ещё не знает.<br>\n      2️⃣ Мы <b>представляем</b> объект: «это какой-то …».<br>\n      3️⃣ ⭐ Железно после <b>haben</b>, <b>brauchen</b> и в обороте <b>es gibt</b>.<br><br>\n      На вопрос Полины «а почему?» Даша ответила честно: «просто такое правило, запоминаем». И это правда самый частый случай на экзамене: <i>Ich habe <b>einen</b> Hund. Ich brauche <b>einen</b> Computer. Es gibt <b>einen</b> Lesesaal.</i>","текст":"Когда ставим неопределённый артикль Даша дала три случая — и попросила записать их отдельно: 1️⃣ Предмет называем впервые, слушатель его ещё не знает. 2️⃣ Мы представляем объект: «это какой-то …». 3️⃣ ⭐ Железно после haben, brauchen и в обороте es gibt. На вопрос Полины «а почему?» Даша ответила честно: «просто такое правило, запоминаем». И это правда самый частый случай на экзамене: Ich habe einen Hund. Ich brauche einen Computer. Es gibt einen Lesesaal.","ти":3,"пи":1,"подтема":"ein, eine: неопределённый артикль"},{"id":"cff0195e77","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"🔁 Разминка: неопределённый артикль","урок":"polya15","урокИмя":"Занятие 15 Полины","html":"Повтор занятия 13: <b>ein / eine</b> меняется по падежам. Сначала решаем, какой нужен падеж (кто? — Nominativ, кого? — Akkusativ, кому? — Dativ), потом берём форму:<br>\n      Akkusativ: <b>einen</b> (муж.) · <b>eine</b> · <b>ein</b>. Dativ: <b>einem</b> (муж. и ср.) · <b>einer</b> (жен.).<br>\n      Глаголы с Dativ из разминки: <b>helfen</b> (помогать кому), <b>glauben</b> (верить кому). А <b>brauchen</b> — всегда Akkusativ, хотя по-русски «нуждаться <b>в ком</b>».","текст":"Повтор занятия 13: ein / eine меняется по падежам. Сначала решаем, какой нужен падеж (кто? — Nominativ, кого? — Akkusativ, кому? — Dativ), потом берём форму: Akkusativ: einen (муж.) · eine · ein. Dativ: einem (муж. и ср.) · einer (жен.). Глаголы с Dativ из разминки: helfen (помогать кому), glauben (верить кому). А brauchen — всегда Akkusativ, хотя по-русски «нуждаться в ком».","ти":3,"пи":1,"подтема":"ein, eine: неопределённый артикль"},{"id":"f6bea775aa","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"⭐ Когда артикль не нужен","урок":"polya8","урокИмя":"Занятие 8 Полины","html":"<b>1. Множественное число, когда предметы неопределённые.</b><br>\n      Фотограф делает фотографии — какие? Да любые, просто фотографии. Артикль не нужен.<br><br>\n      <b>2. Когда обобщаем.</b><br>\n      «Я люблю цветы» — не эти три цветка на столе, а цветы вообще. Артикль не нужен.<br><br>\n      <b>3. С тем, что не считают поштучно.</b><br>\n      Мясо, рыба, соль, сахар — их не пересчитаешь. Артикль обычно не нужен.","текст":"1. Множественное число, когда предметы неопределённые. Фотограф делает фотографии — какие? Да любые, просто фотографии. Артикль не нужен. 2. Когда обобщаем. «Я люблю цветы» — не эти три цветка на столе, а цветы вообще. Артикль не нужен. 3. С тем, что не считают поштучно. Мясо, рыба, соль, сахар — их не пересчитаешь. Артикль обычно не нужен.","ти":3,"пи":1,"подтема":"ein, eine: неопределённый артикль"},{"id":"f67e6a2d13","тема":"Артикли и род","знак":"🎨","вид":"ловушка","раздел":"⭐ Когда артикль не нужен","урок":"polya8","урокИмя":"Занятие 8 Полины","html":"<span class=\"big\">А когда артикль во множественном всё-таки есть?</span>\n      Только <b>определённый</b> — <b>die</b>. Это когда речь о конкретных предметах, а не о любых.\n      Неопределённого артикля во множественном числе не бывает вообще.","текст":"А когда артикль во множественном всё-таки есть? Только определённый — die. Это когда речь о конкретных предметах, а не о любых. Неопределённого артикля во множественном числе не бывает вообще.","ти":3,"пи":1,"подтема":"ein, eine: неопределённый артикль"},{"id":"223489e89d","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"Как рассказать о себе","урок":"urok1","урокИмя":"Урок 2","html":"<b class=\"hl\">При профессии артикль не ставят:</b> <i>Ich bin Arzt</i>, а не «Ich bin ein Arzt». Так же: <i>Ich bin Phlebologe</i>, <i>Sie ist Ärztin</i>.","текст":"При профессии артикль не ставят: Ich bin Arzt, а не «Ich bin ein Arzt». Так же: Ich bin Phlebologe, Sie ist Ärztin.","ти":3,"пи":1,"подтема":"ein, eine: неопределённый артикль"},{"id":"6448b840b7","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"Где артикль не нужен","урок":"urok23","урокИмя":"Урок 24","html":"Три случая без артикля:<br>\n      1️⃣ <b>Профессия и национальность</b> после sein: <i>Ich bin <b>Arzt</b></i> (не «ein Arzt»).<br>\n      2️⃣ <b>Неисчисляемое</b> — вещество, время, деньги: <i>Ich trinke Wasser, Ich habe Zeit</i>.<br>\n      3️⃣ <b>Большинство стран и городов</b>: <i>aus Deutschland, in Berlin</i>. Но несколько стран — с артиклем: <i>die Schweiz, die Türkei, die USA</i> → <i>aus <b>der</b> Schweiz</i>.","текст":"Три случая без артикля: 1️⃣ Профессия и национальность после sein: Ich bin Arzt (не «ein Arzt»). 2️⃣ Неисчисляемое — вещество, время, деньги: Ich trinke Wasser, Ich habe Zeit. 3️⃣ Большинство стран и городов: aus Deutschland, in Berlin. Но несколько стран — с артиклем: die Schweiz, die Türkei, die USA → aus der Schweiz.","ти":3,"пи":1,"подтема":"ein, eine: неопределённый артикль"},{"id":"da1b0a95c7","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"После ein, kein, mein","урок":"urok24","урокИмя":"Урок 25","html":"Так же ведут себя <b>kein</b> и все притяжательные: <i>mein, dein, sein, ihr, unser, euer</i>. Их и называют «ein-слова».<br><br>\n      Отличие от предыдущей таблицы — <span class=\"hl\">ровно три клетки</span>, те самые, где артикль не показывает род:<br>\n      • мужской Nominativ: ein neu<b>er</b> Arzt (артикль <i>ein</i> молчит — прилагательное говорит <b>-er</b>, как <i>der</i>)<br>\n      • средний Nominativ и Akkusativ: ein neu<b>es</b> Rezept (<b>-es</b>, как <i>das</i>)<br><br>\n      Всё остальное — привычное <b>-en</b>.","текст":"Так же ведут себя kein и все притяжательные: mein, dein, sein, ihr, unser, euer. Их и называют «ein-слова». Отличие от предыдущей таблицы — ровно три клетки, те самые, где артикль не показывает род: • мужской Nominativ: ein neuer Arzt (артикль ein молчит — прилагательное говорит -er, как der) • средний Nominativ и Akkusativ: ein neues Rezept (-es, как das) Всё остальное — привычное -en.","ти":3,"пи":1,"подтема":"ein, eine: неопределённый артикль"},{"id":"5dcc33cb63","тема":"Падежи","знак":"📦","вид":"правило","раздел":"Стакан, чашка, кило, фунт","урок":"urok14","урокИмя":"Урок 15","html":"Важная мелочь: между «стаканом» и «водой» <b class=\"hl\">ничего не ставится</b> — ни предлога, ни падежа. Просто два слова подряд: <i>ein Glas Wasser</i> (стакан воды), <i>eine Tasse Kaffee</i> (чашка кофе). Проще, чем в русском. Так же с весом: <i>hundert Gramm Käse</i>.<br><br>\n      ⚖️ <b>ein Pfund</b> на рынке в Германии — это ровно <b>полкило</b> (500 г), а не английский фунт.","текст":"Важная мелочь: между «стаканом» и «водой» ничего не ставится — ни предлога, ни падежа. Просто два слова подряд: ein Glas Wasser (стакан воды), eine Tasse Kaffee (чашка кофе). Проще, чем в русском. Так же с весом: hundert Gramm Käse. ⚖️ ein Pfund на рынке в Германии — это ровно полкило (500 г), а не английский фунт.","ти":3,"пи":1,"подтема":"ein, eine: неопределённый артикль"},{"id":"ef257768eb","тема":"Разное","знак":"📎","вид":"правило","раздел":"🗣 Как Полина описывала предметы","урок":"polya13","урокИмя":"Занятие 13 Полины","html":"<b>Схема описания, которую задала Даша</b><br>\n      1️⃣ Что это: <i>Das ist ein Teller.</i><br>\n      2️⃣ Какой: <i>Der Teller ist rund und weiß.</i><br>\n      3️⃣ Из чего: <i>Er ist aus Keramik.</i><br>\n      4️⃣ Для чего: <i>Ich benutze den Teller für Obst.</i><br><br>\n      Четыре предложения — и предмет описан. На экзамене за такое ставят хорошие баллы.","текст":"Схема описания, которую задала Даша 1️⃣ Что это: Das ist ein Teller. 2️⃣ Какой: Der Teller ist rund und weiß. 3️⃣ Из чего: Er ist aus Keramik. 4️⃣ Для чего: Ich benutze den Teller für Obst. Четыре предложения — и предмет описан. На экзамене за такое ставят хорошие баллы.","ти":3,"пи":1,"подтема":"ein, eine: неопределённый артикль"},{"id":"6a0d9bbe30","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"⚠️ kein — отрицательный артикль","урок":"dasha5","урокИмя":"Занятие 5 с Дашей","html":"<b>kein</b> (мужской и средний род) и <b>keine</b> (женский род и множественное число) —\n      это не отдельное слово «нет», а <b>артикль с отрицанием прямо внутри</b>. Он занимает\n      то же место, где обычно стоит <b>ein</b> / <b>eine</b>, и просто переводится как «никакой», «ни одного».","текст":"kein (мужской и средний род) и keine (женский род и множественное число) — это не отдельное слово «нет», а артикль с отрицанием прямо внутри. Он занимает то же место, где обычно стоит ein / eine, и просто переводится как «никакой», «ни одного».","ти":3,"пи":2,"подтема":"kein и nicht: отрицание"},{"id":"10c30cbcac","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"⚠️ kein — отрицательный артикль","урок":"dasha5","урокИмя":"Занятие 5 с Дашей","html":"<b>Правило целиком:</b> увидели <b>kein</b> или <b>keine</b> — смело добавляем в перевод\n      частицу «не». <b>Ich habe keine Zeit.</b> = У меня нет времени (дословно: я имею ноль времени).","текст":"Правило целиком: увидели kein или keine — смело добавляем в перевод частицу «не». Ich habe keine Zeit. = У меня нет времени (дословно: я имею ноль времени).","ти":3,"пи":2,"подтема":"kein и nicht: отрицание"},{"id":"086398b213","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"⭐ Памятка: nicht, kein, nichts, niemand","урок":"polya16","урокИмя":"Занятие 16 Полины","html":"<b>Главная проверка:</b> если в утвердительном предложении было <i>ein</i> или ничего не было перед существительным — ставим <b>kein</b>. <i>Ich habe ein Auto → Ich habe <b>kein</b> Auto. Ich habe Zeit → Ich habe <b>keine</b> Zeit.</i> Во всех остальных случаях — <b>nicht</b>.","текст":"Главная проверка: если в утвердительном предложении было ein или ничего не было перед существительным — ставим kein. Ich habe ein Auto → Ich habe kein Auto. Ich habe Zeit → Ich habe keine Zeit. Во всех остальных случаях — nicht.","ти":3,"пи":2,"подтема":"kein и nicht: отрицание"},{"id":"b5bdcf72fc","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"⭐ Куда ставить nicht — и почему тут нельзя kein","урок":"polya6","урокИмя":"Занятие 6 Полины","html":"Полина помнила «nicht ставится в конец» и применила это не туда. Даша уточнила правило:<br><br>\n      Отрицаем <b class=\"hl\">глагол</b> → <i>nicht</i> идёт <b>в конец</b>.<br>\n      Отрицаем <b class=\"hl\">другую часть речи</b> → <i>nicht</i> встаёт <b>прямо перед ней</b>.","текст":"Полина помнила «nicht ставится в конец» и применила это не туда. Даша уточнила правило: Отрицаем глагол → nicht идёт в конец. Отрицаем другую часть речи → nicht встаёт прямо перед ней.","ти":3,"пи":2,"подтема":"kein и nicht: отрицание"},{"id":"735f0aae3f","тема":"Артикли и род","знак":"🎨","вид":"ловушка","раздел":"⭐ Куда ставить nicht — и почему тут нельзя kein","урок":"polya6","урокИмя":"Занятие 6 Полины","html":"<span class=\"big\">Почему нельзя «arbeitet als kein Verkäuferin»</span>\n      <b>kein обязан стоять непосредственно перед существительным.</b> А здесь перед существительным уже сидит предлог <i>als</i>, и подвинуть его некуда — <i>kein</i> просто не влезает.<br><br>\n      Поэтому только <b>nicht als Verkäuferin</b>. Зато без предлога <i>kein</i> прекрасно работает: <b>Patricia ist keine Verkäuferin</b> — она не продавщица.","текст":"Почему нельзя «arbeitet als kein Verkäuferin» kein обязан стоять непосредственно перед существительным. А здесь перед существительным уже сидит предлог als, и подвинуть его некуда — kein просто не влезает. Поэтому только nicht als Verkäuferin. Зато без предлога kein прекрасно работает: Patricia ist keine Verkäuferin — она не продавщица.","ти":3,"пи":2,"подтема":"kein и nicht: отрицание"},{"id":"7bdb7f5701","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"Как сказать «не надо»","урок":"urok13","урокИмя":"Урок 14","html":"Отдельной отрицательной формы нет — берём ту же команду и добавляем <b class=\"hl\">nicht</b> (в конец) или <b class=\"hl\">kein</b> (перед существительным). Ровно то же правило, что в уроке 4.","текст":"Отдельной отрицательной формы нет — берём ту же команду и добавляем nicht (в конец) или kein (перед существительным). Ровно то же правило, что в уроке 4.","ти":3,"пи":2,"подтема":"kein и nicht: отрицание"},{"id":"6821659274","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"kein — «нет (чего-то)»","урок":"urok4","урокИмя":"Урок 5","html":"<b><span class=\"hl\">kein</span></b> отрицает существительное: <i>Ich habe <b>keine</b> Schmerzen</i> — у меня нет болей. Изменяется как <i>ein</i>: <b>keinen</b> (муж.), <b>keine</b> (жен. и множественное), <b>kein</b> (сред.).","текст":"kein отрицает существительное: Ich habe keine Schmerzen — у меня нет болей. Изменяется как ein: keinen (муж.), keine (жен. и множественное), kein (сред.).","ти":3,"пи":2,"подтема":"kein и nicht: отрицание"},{"id":"dbaffc3677","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"kein или nicht?","урок":"urok4","урокИмя":"Урок 5","html":"Есть существительное с <i>ein</i> или вовсе без артикля → <b>kein</b>. Всё остальное — глагол, прилагательное, существительное с <i>der</i> или <i>mein</i> → <b>nicht</b>.","текст":"Есть существительное с ein или вовсе без артикля → kein. Всё остальное — глагол, прилагательное, существительное с der или mein → nicht.","ти":3,"пи":2,"подтема":"kein и nicht: отрицание"},{"id":"61a8c18948","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"⭐ weder … noch — ни … ни","урок":"urok41","урокИмя":"Урок 42","html":"<b>weder … noch</b> — это <b>уже отрицание</b>. Добавлять к нему <b>nicht</b> или <b>kein</b> нельзя: <i>weder Fieber noch Schmerzen</i>, а не «weder kein Fieber». Для анамнеза — одна из самых полезных конструкций.","текст":"weder … noch — это уже отрицание. Добавлять к нему nicht или kein нельзя: weder Fieber noch Schmerzen, а не «weder kein Fieber». Для анамнеза — одна из самых полезных конструкций.","ти":3,"пи":2,"подтема":"kein и nicht: отрицание"},{"id":"13cb16c782","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"⭐⭐ Сообщить","урок":"urok53","урокИмя":"Урок 54","html":"Сначала <b>предупреждение</b> (Vorwarnung): <i>Leider habe ich keine guten Nachrichten.</i> Потом коротко и ясно — <b>leider</b> + <b>hat ergeben, dass …</b> (глагол в конец). Если диагноз ещё не подтверждён — говорите о <b>подозрении</b>: <b>Es besteht der Verdacht, dass …</b>. И человеческая фраза через Konjunktiv II (урок 26): <b>Ich wünschte, ich könnte …</b> — «хотел бы я…». После — пауза.","текст":"Сначала предупреждение (Vorwarnung): Leider habe ich keine guten Nachrichten. Потом коротко и ясно — leider + hat ergeben, dass … (глагол в конец). Если диагноз ещё не подтверждён — говорите о подозрении: Es besteht der Verdacht, dass …. И человеческая фраза через Konjunktiv II (урок 26): Ich wünschte, ich könnte … — «хотел бы я…». После — пауза.","ти":3,"пи":2,"подтема":"kein и nicht: отрицание"},{"id":"50fda34f83","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"Телеграфный стиль","урок":"urok54","урокИмя":"Урок 55","html":"В разделах анамнеза и находок письмо часто пишут <b>без глагола</b> или через пассив с <b>wird verneint</b> — «пациент отрицает». Отрицательные находки — тоже: «kein Fieber». Так в образце учебника: <i>Kein Fieber, kein Nachtschweiß. Gewichtsverhalten konstant.</i>","текст":"В разделах анамнеза и находок письмо часто пишут без глагола или через пассив с wird verneint — «пациент отрицает». Отрицательные находки — тоже: «kein Fieber». Так в образце учебника: Kein Fieber, kein Nachtschweiß. Gewichtsverhalten konstant.","ти":3,"пи":2,"подтема":"kein и nicht: отрицание"},{"id":"5bc159a757","тема":"Порядок слов","знак":"📐","вид":"правило","раздел":"nicht — «не»","урок":"urok4","урокИмя":"Урок 5","html":"<b><span class=\"hl\">nicht</span></b> отрицает всё остальное — глагол, прилагательное, место. Стоит после глагола или прямо перед тем, что отрицаем: <i>Das ist <b>nicht</b> gut</i> · <i>Ich verstehe <b>nicht</b></i>.","текст":"nicht отрицает всё остальное — глагол, прилагательное, место. Стоит после глагола или прямо перед тем, что отрицаем: Das ist nicht gut · Ich verstehe nicht.","ти":3,"пи":2,"подтема":"kein и nicht: отрицание"},{"id":"8be216bf39","тема":"Порядок слов","знак":"📐","вид":"правило","раздел":"nicht nur … sondern auch — не только … но и","урок":"urok41","урокИмя":"Урок 42","html":"Как sowohl … als auch, но с акцентом на второе: «и даже ещё». Вторая часть — только с <b class=\"hl\">sondern</b>, не с aber.","текст":"Как sowohl … als auch, но с акцентом на второе: «и даже ещё». Вторая часть — только с sondern, не с aber.","ти":3,"пи":2,"подтема":"kein и nicht: отрицание"},{"id":"059d2f9dbb","тема":"Разное","знак":"📎","вид":"правило","раздел":"⭐⭐ Случаи в немецких больницах","урок":"urok55","урокИмя":"Урок 56","html":"Главная мысль Шами — <b>слушать</b>. Его фраза из учебника: <i>„Nichts auf der Welt hilft besser, einen ausländischen Patienten zu heilen, als das Zuhören.“</i><br>\n      И честное замечание книги: готовых рецептов здесь <b>нет</b>. Важно заметить, что проблема может быть «культурной», и вместе с пациентом искать решение.","текст":"Главная мысль Шами — слушать. Его фраза из учебника: „Nichts auf der Welt hilft besser, einen ausländischen Patienten zu heilen, als das Zuhören.“ И честное замечание книги: готовых рецептов здесь нет. Важно заметить, что проблема может быть «культурной», и вместе с пациентом искать решение.","ти":3,"пи":2,"подтема":"kein и nicht: отрицание"},{"id":"0ac50db077","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"⭐⭐ Склонение определённого артикля","урок":"polya11","урокИмя":"Занятие 11 Полины","html":"<b>Как запомнить</b><br>\n      • <b>Akkusativ</b> — самый лёгкий после Nominativ: <span class=\"hl\">меняется только мужской род</span>, der → den. Всё остальное как было.<br>\n      • <b>Dativ</b> — три формы: dem (муж. и ср.), der (жен.), den (мн.). Во множественном к самому слову часто добавляется <b>-n</b>: die Berge → in den Berge<b>n</b>.<br>\n      • <b>Genitiv</b> — две формы: des (муж. и ср.) и der (жен. и мн.). И это единственное место, где у мужского и среднего рода меняется <b>само слово</b>: добавляется <b>-s</b> или <b>-es</b>.","текст":"Как запомнить • Akkusativ — самый лёгкий после Nominativ: меняется только мужской род, der → den. Всё остальное как было. • Dativ — три формы: dem (муж. и ср.), der (жен.), den (мн.). Во множественном к самому слову часто добавляется -n: die Berge → in den Bergen. • Genitiv — две формы: des (муж. и ср.) и der (жен. и мн.). И это единственное место, где у мужского и среднего рода меняется само слово: добавляется -s или -es.","ти":3,"пи":3,"подтема":"Артикль по падежам"},{"id":"3207ca47d2","тема":"Артикли и род","знак":"🎨","вид":"ловушка","раздел":"⭐⭐ Склонение определённого артикля","урок":"polya11","урокИмя":"Занятие 11 Полины","html":"<span class=\"big\">Как определить падеж — четыре шага</span>\n      1️⃣ Найти главное слово и зависимое.<br>\n      2️⃣ Задать вопрос к зависимому.<br>\n      3️⃣ По вопросу понять падеж.<br>\n      4️⃣ По роду слова найти клетку в таблице.<br><br>\n      <i>«Это дом собаки»</i>: дом — чей? — собаки → <b>wessen</b> → Genitiv. Собака — <b>der Hund</b>, мужской → клетка <b>des</b> + окончание -es → <b>das Haus des Hundes</b>.","текст":"Как определить падеж — четыре шага 1️⃣ Найти главное слово и зависимое. 2️⃣ Задать вопрос к зависимому. 3️⃣ По вопросу понять падеж. 4️⃣ По роду слова найти клетку в таблице. «Это дом собаки»: дом — чей? — собаки → wessen → Genitiv. Собака — der Hund, мужской → клетка des + окончание -es → das Haus des Hundes.","ти":3,"пи":3,"подтема":"Артикль по падежам"},{"id":"df8df1f427","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"✍️ Упражнение: артикль и падеж","урок":"polya12","урокИмя":"Занятие 12 Полины","html":"<b>in den Park или im Park?</b> Даша заметила, что в домашке Полина пару раз писала «im Park» с глаголом gehen, но исправлять не стала: ошибка небольшая.<br>\n      • <b>Wir gehen in den Park</b> — идём куда? — в парк → Akkusativ. С <b>gehen</b> обычно имеют в виду направление.<br>\n      • <b>Wir spazieren im Park</b> — гуляем где? — в парке → Dativ. Для прогулки есть свой глагол: <b>spazieren gehen</b>.<br><br>\n      <b>mit</b> — всегда Dativ, что бы ни спрашивали: <i>mit dem Bus</i>.<br>\n      <b>im Fenster</b> — по-немецки кошку видно «в окне», а не «на окне», когда смотришь с улицы. Этот вопрос задала Полина.","текст":"in den Park или im Park? Даша заметила, что в домашке Полина пару раз писала «im Park» с глаголом gehen, но исправлять не стала: ошибка небольшая. • Wir gehen in den Park — идём куда? — в парк → Akkusativ. С gehen обычно имеют в виду направление. • Wir spazieren im Park — гуляем где? — в парке → Dativ. Для прогулки есть свой глагол: spazieren gehen. mit — всегда Dativ, что бы ни спрашивали: mit dem Bus. im Fenster — по-немецки кошку видно «в окне», а не «на окне», когда смотришь с улицы. Этот вопрос задала Полина.","ти":3,"пи":3,"подтема":"Артикль по падежам"},{"id":"52d4e3f7c3","тема":"Артикли и род","знак":"🎨","вид":"ловушка","раздел":"✍️ Упражнение: артикль и падеж","урок":"polya12","урокИмя":"Занятие 12 Полины","html":"<span class=\"big\">Ошибки с занятия</span>\n      1️⃣ Про <b>im Garten</b> Полина сказала «Genitiv». Нет: <b>im = in dem</b>, а dem — это <b>Dativ</b>. Играет где? — в саду.<br>\n      2️⃣ К <b>Buch</b> Полина поставила <s>den</s>. Книга — <b>das Buch</b>, средний род, а в Akkusativ меняется <span class=\"hl\">только мужской</span>. Значит, остаётся <b>das</b>.<br>\n      3️⃣ Полина не вспомнила глагол <b>bringen</b> — «приносить». Даша подсказала его вот таким предложением:","текст":"Ошибки с занятия 1️⃣ Про im Garten Полина сказала «Genitiv». Нет: im = in dem, а dem — это Dativ. Играет где? — в саду. 2️⃣ К Buch Полина поставила den. Книга — das Buch, средний род, а в Akkusativ меняется только мужской. Значит, остаётся das. 3️⃣ Полина не вспомнила глагол bringen — «приносить». Даша подсказала его вот таким предложением:","ти":3,"пи":3,"подтема":"Артикль по падежам"},{"id":"5606c92fbf","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"⭐ Определённый артикль: доделали упражнение","урок":"polya13","урокИмя":"Занятие 13 Полины","html":"<b>Три глагола, которые управляют падежом</b><br>\n      • <b>gehören</b> (принадлежать) → <span class=\"hl\">Dativ</span>: <i>Der Ball gehört <b>dem</b> Kind</i> — мяч принадлежит кому? ребёнку.<br>\n      • <b>bringen</b>, <b>geben</b>, <b>zeigen</b> (приносить, давать, показывать) → сразу два падежа: <span class=\"hl\">кому — Dativ</span>, <span class=\"hl\">что — Akkusativ</span>: <i>Ich bringe <b>der</b> Tante <b>den</b> Kuchen</i>.<br>\n      • <b>mögen</b> (нравиться) → всегда <span class=\"hl\">Akkusativ</span>: <i>Ich mag <b>das</b> Haus</i>. Это Даша подчеркнула отдельно.","текст":"Три глагола, которые управляют падежом • gehören (принадлежать) → Dativ: Der Ball gehört dem Kind — мяч принадлежит кому? ребёнку. • bringen, geben, zeigen (приносить, давать, показывать) → сразу два падежа: кому — Dativ, что — Akkusativ: Ich bringe der Tante den Kuchen. • mögen (нравиться) → всегда Akkusativ: Ich mag das Haus. Это Даша подчеркнула отдельно.","ти":3,"пи":3,"подтема":"Артикль по падежам"},{"id":"464065d40f","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"Повтор: склонение mein","урок":"polya17","урокИмя":"Занятие 17 Полины","html":"Притяжательные склоняются <b>как ein / kein</b> — окончания те же. В Akkusativ меняется только мужской род (<i>meinen</i>), в Dativ — <i>meinem / meiner / meinem / meinen</i>, в Genitiv два окончания — <i>meines / meiner</i>. Полина попросила табличку ещё раз — Даша обещала прислать.","текст":"Притяжательные склоняются как ein / kein — окончания те же. В Akkusativ меняется только мужской род (meinen), в Dativ — meinem / meiner / meinem / meinen, в Genitiv два окончания — meines / meiner. Полина попросила табличку ещё раз — Даша обещала прислать.","ти":3,"пи":3,"подтема":"Артикль по падежам"},{"id":"d1314ab9f1","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"Слияния: in+dem=im, an+dem=am…","урок":"urok11","урокИмя":"Урок 12","html":"Немцы «склеивают» частые предлоги с артиклем: <b class=\"hl\">in dem → im</b>, <b class=\"hl\">an dem → am</b>, <b class=\"hl\">bei dem → beim</b>, <b class=\"hl\">zu dem → zum</b>, <b class=\"hl\">zu der → zur</b>, <b class=\"hl\">in das → ins</b>. Говори коротко — так звучит по-немецки.<br><br>\n      <b>beim Arzt</b> — «у врача» (где?), <b>zum Arzt</b> — «к врачу» (куда?). Путают постоянно.","текст":"Немцы «склеивают» частые предлоги с артиклем: in dem → im, an dem → am, bei dem → beim, zu dem → zum, zu der → zur, in das → ins. Говори коротко — так звучит по-немецки. beim Arzt — «у врача» (где?), zum Arzt — «к врачу» (куда?). Путают постоянно.","ти":3,"пи":3,"подтема":"Артикль по падежам"},{"id":"baed359f27","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"Особые: das Herz и der Name","урок":"urok36","урокИмя":"Урок 37","html":"<b>das Herz</b> — единственное такое слово среднего рода, и для врача важное: Akkusativ <b>das Herz</b> (не меняется), Dativ <b>dem Herzen</b>, Genitiv <b>des Herzens</b> — с -ens.<br>\n      <b>der Name</b> (и der Gedanke, der Buchstabe) тоже берёт -n, а в Genitiv <b>-ns</b>: <i>des Namens</i>.","текст":"das Herz — единственное такое слово среднего рода, и для врача важное: Akkusativ das Herz (не меняется), Dativ dem Herzen, Genitiv des Herzens — с -ens. der Name (и der Gedanke, der Buchstabe) тоже берёт -n, а в Genitiv -ns: des Namens.","ти":3,"пи":3,"подтема":"Артикль по падежам"},{"id":"f36a7969c4","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"⭐ Таблица: почти как артикль","урок":"urok38","урокИмя":"Урок 39","html":"Относительные местоимения совпадают с определённым артиклем. Отличаются только <b>четыре формы</b> — они выделены: Dativ множественного числа <b class=\"hl\">denen</b> и весь Genitiv <b class=\"hl\">dessen / deren</b>.","текст":"Относительные местоимения совпадают с определённым артиклем. Отличаются только четыре формы — они выделены: Dativ множественного числа denen и весь Genitiv dessen / deren.","ти":3,"пи":3,"подтема":"Артикль по падежам"},{"id":"2fd4f57566","тема":"Падежи","знак":"📦","вид":"правило","раздел":"⭐ obwohl ↔ trotzdem","урок":"urok40","урокИмя":"Урок 41","html":"<b>obwohl</b> — «хотя» (придаточное, глагол в конец). <b>trotzdem</b> — «несмотря на это, всё равно» (глагол сразу). Не путать с предлогом <b>trotz</b> + Genitiv из урока 37: <i>trotz der Schmerzen</i>.","текст":"obwohl — «хотя» (придаточное, глагол в конец). trotzdem — «несмотря на это, всё равно» (глагол сразу). Не путать с предлогом trotz + Genitiv из урока 37: trotz der Schmerzen.","ти":3,"пи":3,"подтема":"Артикль по падежам"},{"id":"65b5a0dcdd","тема":"Предлоги","знак":"🧭","вид":"правило","раздел":"С предлогом: mit dem, auf den","урок":"urok38","урокИмя":"Урок 39","html":"Если в придаточном нужен предлог, он встаёт <b>перед</b> местоимением, а падеж задаёт сам предлог: <i>mit</i> → Dativ, <i>auf</i> (warten auf) → Akkusativ. Управление глаголов — урок 30.","текст":"Если в придаточном нужен предлог, он встаёт перед местоимением, а падеж задаёт сам предлог: mit → Dativ, auf (warten auf) → Akkusativ. Управление глаголов — урок 30.","ти":3,"пи":3,"подтема":"Артикль по падежам"},{"id":"c463c7d4db","тема":"Порядок слов","знак":"📐","вид":"правило","раздел":"⭐ je … desto — чем … тем","урок":"urok41","урокИмя":"Урок 42","html":"После <b>je</b> и <b>desto</b> всегда идёт <b>сравнительная степень</b> (früher, länger, mehr, besser). Порядок слов — главное:<br>\n      • часть с <b class=\"hl\">je</b> — как придаточное: <b>глагол в конец</b>: <i>Je früher wir <b>operieren</b>, …</i><br>\n      • часть с <b class=\"hl\">desto</b> — <b>desto + сравнительная + глагол + подлежащее</b>: <i>… desto besser <b>ist</b> die Prognose.</i>","текст":"После je и desto всегда идёт сравнительная степень (früher, länger, mehr, besser). Порядок слов — главное: • часть с je — как придаточное: глагол в конец: Je früher wir operieren, … • часть с desto — desto + сравнительная + глагол + подлежащее: … desto besser ist die Prognose.","ти":3,"пи":3,"подтема":"Артикль по падежам"},{"id":"7b3037a16a","тема":"Разное","знак":"📎","вид":"правило","раздел":"⭐ weil ↔ deshalb","урок":"urok40","урокИмя":"Урок 41","html":"<b>weil</b> вводит <b>причину</b>, <b>deshalb</b> — <b>следствие</b>. Смотрите, как одна мысль переворачивается. <b>deswegen</b> и <b>darum</b> значат то же, что deshalb.","текст":"weil вводит причину, deshalb — следствие. Смотрите, как одна мысль переворачивается. deswegen и darum значат то же, что deshalb.","ти":3,"пи":3,"подтема":"Артикль по падежам"},{"id":"755837ef1d","тема":"Разное","знак":"📎","вид":"правило","раздел":"Сердце, лёгкие, давление","урок":"urok48","урокИмя":"Урок 49","html":"Три пары глаголов дыхания: <b>einatmen</b> — вдохнуть, <b>ausatmen</b> — выдохнуть, <b>die Luft anhalten</b> — задержать дыхание, <b>weiteratmen</b> — дышать дальше. Закатать рукав — <b>den Ärmel hochkrempeln</b>. Слушать сердце — <b>das Herz abhören</b>.","текст":"Три пары глаголов дыхания: einatmen — вдохнуть, ausatmen — выдохнуть, die Luft anhalten — задержать дыхание, weiteratmen — дышать дальше. Закатать рукав — den Ärmel hochkrempeln. Слушать сердце — das Herz abhören.","ти":3,"пи":3,"подтема":"Артикль по падежам"},{"id":"baa189c4d3","тема":"Разное","знак":"📎","вид":"правило","раздел":"Запятая и дозы","урок":"urok5","урокИмя":"Урок 6","html":"Дробь в немецком пишут через <b>запятую</b> и читают «<b class=\"hl\">Komma</b>»: 38,5 — <i>achtunddreißig Komma fünf</i>. Точка разделяет тысячи: 10.000 — десять тысяч.<br><br>\n      Дозы: <i>zweimal täglich</i> — два раза в день, <i>alle acht Stunden</i> — каждые восемь часов, <i>vor / nach dem Essen</i> — до / после еды.","текст":"Дробь в немецком пишут через запятую и читают «Komma»: 38,5 — achtunddreißig Komma fünf. Точка разделяет тысячи: 10.000 — десять тысяч. Дозы: zweimal täglich — два раза в день, alle acht Stunden — каждые восемь часов, vor / nach dem Essen — до / после еды.","ти":3,"пи":3,"подтема":"Артикль по падежам"},{"id":"a32fa8e8ef","тема":"Разное","знак":"📎","вид":"правило","раздел":"Назначить и заказать","урок":"urok52","урокИмя":"Урок 53","html":"Обследования проводит лаборатория или рентгенология — палатный врач их <b>anfordern</b> (заказывает) или пациента <b>anmelden</b> (записывает). Кровь не «анализируют»: <b>Blut abnehmen</b> — взять кровь. Натощак — <b>nüchtern</b>.","текст":"Обследования проводит лаборатория или рентгенология — палатный врач их anfordern (заказывает) или пациента anmelden (записывает). Кровь не «анализируют»: Blut abnehmen — взять кровь. Натощак — nüchtern.","ти":3,"пи":3,"подтема":"Артикль по падежам"},{"id":"4c9a616294","тема":"Множественное число","знак":"➕","вид":"правило","раздел":"⭐ Множественное от -in: единственное железное правило","урок":"polya7","урокИмя":"Занятие 7 Полины","html":"Если существительное женского рода кончается на <b class=\"hl\">-in</b>, то множественное образуется <b>всегда одинаково</b>: добавляем <b class=\"hl\">-nen</b>.<br><br>\n      <i>die Lehrerin → die Lehrerin<b>nen</b></i>. Сто процентов, без исключений.","текст":"Если существительное женского рода кончается на -in, то множественное образуется всегда одинаково: добавляем -nen. die Lehrerin → die Lehrerinnen. Сто процентов, без исключений.","ти":3,"пи":4,"подтема":"Женский род профессий: -in"},{"id":"6300099fce","тема":"Множественное число","знак":"➕","вид":"правило","раздел":"Множественное от -in","урок":"polya8","урокИмя":"Занятие 8 Полины","html":"Если слово уже женское и кончается на <span class=\"hl\">-in</span>, то во множественном числе\n      добавляем <span class=\"hl\">-nen</span>. Получается <span class=\"hl\">-innen</span>.<br><br>\n      Это <b>единственное железное правило</b> во всём множественном числе — здесь исключений нет.","текст":"Если слово уже женское и кончается на -in, то во множественном числе добавляем -nen. Получается -innen. Это единственное железное правило во всём множественном числе — здесь исключений нет.","ти":3,"пи":4,"подтема":"Женский род профессий: -in"},{"id":"074952b68c","тема":"Множественное число","знак":"➕","вид":"ловушка","раздел":"🗂 Карточки профессий от Даши","урок":"polya8","урокИмя":"Занятие 8 Полины","html":"<span class=\"big\">Что означают чёрточки после слова</span>\n      На карточках после каждой профессии стоит пометка вроде <b>der Bäcker, --</b> или <b>der Pilot, -en</b>.\n      Это <b>множественное число</b> — ровно та тема, которую Даша открыла в конце занятия.<br><br>\n      <b>--</b> → слово не меняется: <i>der Bäcker → die Bäcker</i><br>\n      <b>-e</b> → добавляем -e: <i>der Detektiv → die Detektive</i><br>\n      <b>-en</b> → добавляем -en: <i>der Pilot → die Piloten</i><br>\n      <b>-̈e</b> → умляут и -e: <i>der Arzt → die Ärzte</i>","текст":"Что означают чёрточки после слова На карточках после каждой профессии стоит пометка вроде der Bäcker, -- или der Pilot, -en. Это множественное число — ровно та тема, которую Даша открыла в конце занятия. -- → слово не меняется: der Bäcker → die Bäcker -e → добавляем -e: der Detektiv → die Detektive -en → добавляем -en: der Pilot → die Piloten -̈e → умляут и -e: der Arzt → die Ärzte","ти":3,"пи":4,"подтема":"Женский род профессий: -in"},{"id":"67dd4607ee","тема":"Разное","знак":"📎","вид":"ловушка","раздел":"🗂 24 карточки профессий от Даши","урок":"dasha8","урокИмя":"Занятие 8 с Дашей","html":"<span class=\"big\">Что означают чёрточки после слова</span>\n      <b>--</b> → слово не меняется: <i>der Bäcker → die Bäcker</i><br>\n      <b>-e</b> → добавляем -e: <i>der Detektiv → die Detektive</i><br>\n      <b>-en</b> → добавляем -en: <i>der Pilot → die Piloten</i><br>\n      <b>-̈e</b> → умляут и -e: <i>der Arzt → die Ärzte</i>","текст":"Что означают чёрточки после слова -- → слово не меняется: der Bäcker → die Bäcker -e → добавляем -e: der Detektiv → die Detektive -en → добавляем -en: der Pilot → die Piloten -̈e → умляут и -e: der Arzt → die Ärzte","ти":3,"пи":4,"подтема":"Женский род профессий: -in"},{"id":"8fbb88f5ef","тема":"Множественное число","знак":"➕","вид":"правило","раздел":"⭐⭐ derselbe и derjenige","урок":"polya20","урокИмя":"Занятие 20 Полины","html":"• <b>derselbe, dieselbe, dasselbe, dieselben</b> — тот же самый, та же самая, то же самое, те же самые. Пишется слитно (Полина: «ощущение, что просто пробел забыли поставить» — так и есть).<br>\n      • <b>derjenige, diejenige, dasjenige, diejenigen</b> — тот, та, то, те. Почти всегда с продолжением: «тот, <b>кто</b>…», «те, <b>которые</b>…».<br>\n      • Номинатив знаем, а в Akkusativ женский, средний и множественное <b>не меняются</b> — там и окончания нет. Всё остальное получает <b>-en</b>.","текст":"• derselbe, dieselbe, dasselbe, dieselben — тот же самый, та же самая, то же самое, те же самые. Пишется слитно (Полина: «ощущение, что просто пробел забыли поставить» — так и есть). • derjenige, diejenige, dasjenige, diejenigen — тот, та, то, те. Почти всегда с продолжением: «тот, кто…», «те, которые…». • Номинатив знаем, а в Akkusativ женский, средний и множественное не меняются — там и окончания нет. Всё остальное получает -en.","ти":3,"пи":5,"подтема":"dieser, jener, mein: указательные и притяжательные"},{"id":"c53bd473c3","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"Текст «Mein Beruf» — пекарь Леон","урок":"dasha11","урокИмя":"Занятие 11 с Дашей","html":"<b>arbeiten als</b> + профессия без артикля: <i>Ich arbeite <b>als</b> Bäcker</i> — работаю пекарем.<br>\n      <b>sie</b> во фразе <i>aber <b>sie</b> bereitet mir große Freude</i> — это не «она-человек», а <b>die Arbeit</b>: работа приносит мне большую радость. Даша подсказала.<br>\n      <b>Bäcker</b> — «бэка»: немецкое <i>-er</i> на конце почти не слышно. Даша: пока не зацикливаемся, поймут и «бэкер».","текст":"arbeiten als + профессия без артикля: Ich arbeite als Bäcker — работаю пекарем. sie во фразе aber sie bereitet mir große Freude — это не «она-человек», а die Arbeit: работа приносит мне большую радость. Даша подсказала. Bäcker — «бэка»: немецкое -er на конце почти не слышно. Даша: пока не зацикливаемся, поймут и «бэкер».","ти":3,"пи":5,"подтема":"dieser, jener, mein: указательные и притяжательные"},{"id":"fc70800450","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"⭐⭐ dieser, jener, solcher","урок":"polya17","урокИмя":"Занятие 17 Полины","html":"<b>Что это вообще такое.</b> Указательные местоимения показывают на предмет: «<b>этот</b> стол», «<b>тот</b> фильм», «<b>такая</b> музыка». Как и притяжательные, меняются по роду, числу и падежу.<br><br>\n      <b>Главное отличие от mein.</b> У <i>mein</i> в Nominativ мужского и среднего рода окончания нет: <i>mein Tisch, mein Buch</i>. А у указательных окончание есть <b>сразу</b> — оно повторяет артикль: der → dies<b>er</b>, das → dies<b>es</b>, die → dies<b>e</b>.","текст":"Что это вообще такое. Указательные местоимения показывают на предмет: «этот стол», «тот фильм», «такая музыка». Как и притяжательные, меняются по роду, числу и падежу. Главное отличие от mein. У mein в Nominativ мужского и среднего рода окончания нет: mein Tisch, mein Buch. А у указательных окончание есть сразу — оно повторяет артикль: der → dieser, das → dieses, die → diese.","ти":3,"пи":5,"подтема":"dieser, jener, mein: указательные и притяжательные"},{"id":"bcc80da7f6","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"⭐⭐ dieser, jener, solcher в тексте","урок":"polya18","урокИмя":"Занятие 18 Полины","html":"<b>Как решали каждую строчку:</b> 1) род существительного; 2) падеж — по вопросу или по предлогу; 3) окончание как у артикля.<br>\n      <i>das Buch</i>, кто? что? → Nominativ → <b>dieses</b> Buch · <i>die Zeitschrift</i>, кого? что? → Akkusativ → <b>diese</b> Zeitschrift · <i>der Kuchen</i>, кого? что? → <b>jenen</b> Kuchen · <i>in</i> + где? → Dativ → in <b>diesem</b> Café.","текст":"Как решали каждую строчку: 1) род существительного; 2) падеж — по вопросу или по предлогу; 3) окончание как у артикля. das Buch, кто? что? → Nominativ → dieses Buch · die Zeitschrift, кого? что? → Akkusativ → diese Zeitschrift · der Kuchen, кого? что? → jenen Kuchen · in + где? → Dativ → in diesem Café.","ти":3,"пи":5,"подтема":"dieser, jener, mein: указательные и притяжательные"},{"id":"1c8ccc7996","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"welcher, dieser, jeder — какой, этот, каждый","урок":"urok23","урокИмя":"Урок 24","html":"Все три меняют окончание <b>как артикль</b>: der → dies<b>er</b>, die → dies<b>e</b>, das → dies<b>es</b>. В Akkusativ у мужского рода — <b>-en</b>: <i>den Tag → <b>jeden</b> Tag</i>. Для врача это «какая нога?», «эти таблетки», «каждый день».","текст":"Все три меняют окончание как артикль: der → dieser, die → diese, das → dieses. В Akkusativ у мужского рода — -en: den Tag → jeden Tag. Для врача это «какая нога?», «эти таблетки», «каждый день».","ти":3,"пи":5,"подтема":"dieser, jener, mein: указательные и притяжательные"},{"id":"79348a4e22","тема":"Местоимения","знак":"🧩","вид":"правило","раздел":"⭐⭐ derselbe и derjenige","урок":"polya20","урокИмя":"Занятие 20 Полины","html":"<b>Почему <i>der</i> в «Das ist derjenige, <u>der</u> alles weiß»?</b> Это уже <b>относительное местоимение</b> — «который, кто», следующая тема Даши. После него глагол уходит <b>в конец</b>: <i>…, der alles <b>weiß</b></i>; <i>…, die schnell <b>geht</b></i>. Поэтому не <i>die geht schnell</i>, а <i>die schnell geht</i>.<br>\n      Весь смысл этих местоимений: мы знаем, <b>о каком именно</b> предмете речь.","текст":"Почему der в «Das ist derjenige, der alles weiß»? Это уже относительное местоимение — «который, кто», следующая тема Даши. После него глагол уходит в конец: …, der alles weiß; …, die schnell geht. Поэтому не die geht schnell, а die schnell geht. Весь смысл этих местоимений: мы знаем, о каком именно предмете речь.","ти":3,"пи":5,"подтема":"dieser, jener, mein: указательные и притяжательные"},{"id":"d37d9c1ed9","тема":"Предлоги","знак":"🧭","вид":"правило","раздел":"⭐ dieser + предлоги: auf diesen Stuhl, neben diesem Tisch","урок":"polya20","урокИмя":"Занятие 20 Полины","html":"<b>Что разобрали:</b><br>\n      • <b>Вопрос ставим без предлога.</b> Не «на ком, на чём?», а <i>wo?</i> (где?) или <i>wohin?</i> (куда?). <i>Ich habe die Tasche auf … Stuhl <b>gelegt</b></i> — <i>legen</i> = класть, <b>куда?</b> → Akkusativ: <i>auf <b>diesen</b> Stuhl</i>.<br>\n      • <i>Neben … Tisch steht ein Schrank</i> — шкаф <b>где?</b> стоит → Dativ: <i>neben <b>diesem</b> Tisch</i>. <i>neben</i> — около, рядом.<br>\n      • <b>es gibt + Akkusativ — всегда.</b> Полина: «но <i>im Flur</i> — это же Dativ?» Даша: падеж зависит не от того, что стоит рядом, а от того, к чему слово относится. <i>Es gibt</i> что? — <b>diesen</b> Spiegel. А <i>im Flur</i> — отдельный кусок «где?».<br>\n      • <b>durch + Akkusativ</b> (через, сквозь): <i>durch <b>dieses</b> Zimmer</i>. Даша: «напишите себе: плюс Akkusativ». В ту же компанию — <i>für, gegen, ohne, um</i>.<br>\n      • <b>brauchen и mögen + Akkusativ.</b> По-русски «нуждаются <i>в чём</i>», «нравится <i>кто</i>» — но по-немецки это всегда «кого? что?»: <i>Diese Leute brauchen <b>diese</b> Zeitungen</i>.<br>\n      • <b>mit + Dativ:</b> <i>mit <b>diesen</b> Fotos</i> (множественное, Dativ).<br>\n      • Слова, которые «не тренируем», можно пропускать при переводе, но <i>dieser</i> переводим всегда: «через <b>эту</b> комнату».","текст":"Что разобрали: • Вопрос ставим без предлога. Не «на ком, на чём?», а wo? (где?) или wohin? (куда?). Ich habe die Tasche auf … Stuhl gelegt — legen = класть, куда? → Akkusativ: auf diesen Stuhl. • Neben … Tisch steht ein Schrank — шкаф где? стоит → Dativ: neben diesem Tisch. neben — около, рядом. • es gibt + Akkusativ — всегда. Полина: «но im Flur — это же Dativ?» Даша: падеж зависит не от того, что стоит рядом, а от того, к чему слово относится. Es gibt что? — diesen Spiegel. А im Flur — отдельный кусок «где?». • durch + Akkusativ (через, сквозь): durch dieses Zimmer. Даша: «напишите себе: плюс Akkusativ». В ту же компанию — für, gegen, ohne, um. • brauchen и mögen + Akkusativ. По-русски «нуждаются в чём», «нравится кто» — но по-немецки это всегда «кого? что?»: Diese Leute brauchen diese Zeitungen. • mit + Dativ: mit diesen Fotos (множественное, Dativ). • Слова, которые «не тренируем», можно пропускать при переводе, но dieser переводим всегда: «через эту комнату».","ти":3,"пи":5,"подтема":"dieser, jener, mein: указательные и притяжательные"},{"id":"5c823090ba","тема":"Устойчивые выражения","знак":"🔗","вид":"правило","раздел":"📖 Текст «Mein Zimmer»","урок":"polya11","урокИмя":"Занятие 11 Полины","html":"<b>das Bett machen</b> — буквально «делать кровать», а по смыслу — <b>заправлять кровать</b>. Устойчивое выражение.","текст":"das Bett machen — буквально «делать кровать», а по смыслу — заправлять кровать. Устойчивое выражение.","ти":3,"пи":5,"подтема":"dieser, jener, mein: указательные и притяжательные"},{"id":"c1ebc412ae","тема":"Разное","знак":"📎","вид":"правило","раздел":"⭐⭐ dieser, jener, solcher","урок":"polya17","урокИмя":"Занятие 17 Полины","html":"<b>dieser</b> — этот (близко), <b>jener</b> — тот (далеко; в речи чаще говорят просто <i>der da</i>), <b>solcher</b> — такой, <b>derselbe</b> — тот же самый (склоняются обе части: <i>derselbe, demselben</i>), <b>derjenige</b> — тот (который): почти всегда с придаточным, чаще о людях.","текст":"dieser — этот (близко), jener — тот (далеко; в речи чаще говорят просто der da), solcher — такой, derselbe — тот же самый (склоняются обе части: derselbe, demselben), derjenige — тот (который): почти всегда с придаточным, чаще о людях.","ти":3,"пи":5,"подтема":"dieser, jener, mein: указательные и притяжательные"},{"id":"516fa0ab3b","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"🎨 Одним глазком: прилагательные после артикля","урок":"polya13","урокИмя":"Занятие 13 Полины","html":"Тема следующих занятий, но Полина сама спросила, и Даша ответила. В предложении <i>Sie hilft <b>einer alten</b> Frau</i> — почему <b>alten</b>, а не «alter»?<br><br>\n      <b>Правило в одну строку:</b> после <span class=\"hl\">неопределённого артикля в косвенных падежах</span> (Akkusativ у мужского, Dativ, Genitiv) прилагательное почти всегда получает окончание <b>-en</b>.<br>\n      • <i>einer <b>alten</b> Frau</i> — пожилой женщине (Dativ)<br>\n      • <i>einem <b>alten</b> Mann</i> — пожилому мужчине (Dativ)<br>\n      • но в Nominativ: <i>eine <b>alte</b> Frau</i> — пожилая женщина<br><br>\n      И вторая половина ответа Даши: <b>окончание зависит от того, какой артикль стоит впереди</b>. Если артикля нет совсем — прилагательное берёт окончание на себя: <i><b>alter</b> Frau</i>. Даша успокоила: «там окончаний не очень много, тема не сильно сложная».","текст":"Тема следующих занятий, но Полина сама спросила, и Даша ответила. В предложении Sie hilft einer alten Frau — почему alten, а не «alter»? Правило в одну строку: после неопределённого артикля в косвенных падежах (Akkusativ у мужского, Dativ, Genitiv) прилагательное почти всегда получает окончание -en. • einer alten Frau — пожилой женщине (Dativ) • einem alten Mann — пожилому мужчине (Dativ) • но в Nominativ: eine alte Frau — пожилая женщина И вторая половина ответа Даши: окончание зависит от того, какой артикль стоит впереди. Если артикля нет совсем — прилагательное берёт окончание на себя: alter Frau. Даша успокоила: «там окончаний не очень много, тема не сильно сложная».","ти":3,"пи":6,"подтема":"Прилагательные после артикля"},{"id":"62d2f24513","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"«Самый» перед существительным","урок":"urok22","урокИмя":"Урок 23","html":"<i>am größten</i> — когда «самый» стоит отдельно: <i>Die Klinik ist am größten</i>. Перед существительным — с артиклем и окончанием <b>-e</b>: <i>der beste Arzt, die größte Klinik</i>. Окончания прилагательных — большая тема A2, пока запомни эти две фразы целиком.","текст":"am größten — когда «самый» стоит отдельно: Die Klinik ist am größten. Перед существительным — с артиклем и окончанием -e: der beste Arzt, die größte Klinik. Окончания прилагательных — большая тема A2, пока запомни эти две фразы целиком.","ти":3,"пи":6,"подтема":"Прилагательные после артикля"},{"id":"970acf8652","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"После der, die, das","урок":"urok24","урокИмя":"Урок 25","html":"Артикль сказал всё сам, поэтому у прилагательного только два окончания: <b>-e</b> и <b>-en</b>.<br>\n      Правило в одну строчку: <span class=\"hl\">-e стоит в пяти клетках сверху таблицы, всё остальное -en</span>.","текст":"Артикль сказал всё сам, поэтому у прилагательного только два окончания: -e и -en. Правило в одну строчку: -e стоит в пяти клетках сверху таблицы, всё остальное -en.","ти":3,"пи":6,"подтема":"Прилагательные после артикля"},{"id":"558088b182","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"Без артикля вообще","урок":"urok24","урокИмя":"Урок 25","html":"Когда артикля нет, прилагательное <b>берёт его окончание себе</b> — почти буква в букву как у <i>der/die/das</i>: gut<b>er</b> Wein, gut<b>e</b> Milch, gut<b>es</b> Bier.<br><br>\n      Где это встречается чаще всего:<br>\n      1️⃣ с неисчисляемым: <i>Ich trinke <b>gutes</b> Bier</i>;<br>\n      2️⃣ во множественном без артикля — <span class=\"hl\">а это половина врачебной речи</span>: <i>Ich habe <b>starke</b> Schmerzen</i>;<br>\n      3️⃣ после чисел: <i>zwei <b>kleine</b> Kinder</i>.","текст":"Когда артикля нет, прилагательное берёт его окончание себе — почти буква в букву как у der/die/das: guter Wein, gute Milch, gutes Bier. Где это встречается чаще всего: 1️⃣ с неисчисляемым: Ich trinke gutes Bier; 2️⃣ во множественном без артикля — а это половина врачебной речи: Ich habe starke Schmerzen; 3️⃣ после чисел: zwei kleine Kinder.","ти":3,"пи":6,"подтема":"Прилагательные после артикля"},{"id":"70c9da691e","тема":"Падежи","знак":"📦","вид":"правило","раздел":"Прилагательные врача","урок":"urok24","урокИмя":"Урок 25","html":"<b>Три штуки, которые стоит запомнить намертво</b><br>\n      • <b>am linken Bein</b> — «на левой ноге». Здесь <i>am = an dem</i>, значит Dativ, значит <b>-en</b>. То же с правой: am recht<b>en</b> Bein.<br>\n      • <b>bei einer älteren Patientin</b> — «у пожилой пациентки». <i>bei</i> всегда требует Dativ.<br>\n      • <b>hoher Blutdruck</b>, но <b>bei hohem Blutdruck</b>. И заметьте: у <i>hoch</i> перед окончанием пропадает <b>c</b> — hoch, но ho<b>h</b>er.","текст":"Три штуки, которые стоит запомнить намертво • am linken Bein — «на левой ноге». Здесь am = an dem, значит Dativ, значит -en. То же с правой: am rechten Bein. • bei einer älteren Patientin — «у пожилой пациентки». bei всегда требует Dativ. • hoher Blutdruck, но bei hohem Blutdruck. И заметьте: у hoch перед окончанием пропадает c — hoch, но hoher.","ти":3,"пи":6,"подтема":"Прилагательные после артикля"},{"id":"eaf331a419","тема":"Разное","знак":"📎","вид":"правило","раздел":"⭐ Три формы прилагательного","урок":"polya14","урокИмя":"Занятие 14 Полины","html":"<b>Сравнительная степень (Komparativ):</b> прилагательное + <b class=\"hl\">-er</b>. <i>klein → klein<b>er</b></i>.<br>\n      <b>Превосходная (Superlativ):</b> <b class=\"hl\">am</b> + прилагательное + <b class=\"hl\">-sten</b>. <i>klein → <b>am</b> klein<b>sten</b></i>.<br><br>\n      <b>Умлаут.</b> У многих коротких слов гласная меняется: a → ä, o → ö, u → ü. <i>alt → älter, groß → größer, klug → klüger.</i> И — главное правило Даши — <b>в Superlativ эта буква остаётся</b>: «буква переносится отсюда сюда»: <i>älter → am ältesten</i>, <i>klüger → am klügsten</i>.<br><br>\n      <b>Лишнее -e-.</b> Если слово кончается на <b>-d</b> или <b>-t</b>, перед -sten вставляется -e-, иначе не выговорить: <i>alt → am ält<b>e</b>sten</i>. (Даша называла и другие буквы, но на записи слышно только про d и t. По общему правилу так же ведут себя -s, -ß, -z, -sch.)<br><br>\n      <b>Без умлаута.</b> Он бывает только у a / o / u: у <i>schnell</i> (e) и <i>neu</i> (eu) его быть не может — <i>schneller</i>, <i>neuer</i>. А у <i>lustig</i> умлаута нет по привычке: <i>lustiger</i> — Даша про это говорила прямо: «без умлаута».","текст":"Сравнительная степень (Komparativ): прилагательное + -er. klein → kleiner. Превосходная (Superlativ): am + прилагательное + -sten. klein → am kleinsten. Умлаут. У многих коротких слов гласная меняется: a → ä, o → ö, u → ü. alt → älter, groß → größer, klug → klüger. И — главное правило Даши — в Superlativ эта буква остаётся: «буква переносится отсюда сюда»: älter → am ältesten, klüger → am klügsten. Лишнее -e-. Если слово кончается на -d или -t, перед -sten вставляется -e-, иначе не выговорить: alt → am ältesten. (Даша называла и другие буквы, но на записи слышно только про d и t. По общему правилу так же ведут себя -s, -ß, -z, -sch.) Без умлаута. Он бывает только у a / o / u: у schnell (e) и neu (eu) его быть не может — schneller, neuer. А у lustig умлаута нет по привычке: lustiger — Даша про это говорила прямо: «без умлаута».","ти":3,"пи":6,"подтема":"Прилагательные после артикля"},{"id":"9c3e1b0858","тема":"Разное","знак":"📎","вид":"правило","раздел":"Какой человек? — прилагательные","урок":"polya5","урокИмя":"Занятие 5 Полины","html":"<b>hilfsbereit</b> разбирается на части: <i>Hilfe</i> (помощь, от глагола <i>helfen</i>) + <i>bereit</i> (готовый) = «готовый помочь». <i>bereit</i> = <i>fertig</i> — оба «готовый».","текст":"hilfsbereit разбирается на части: Hilfe (помощь, от глагола helfen) + bereit (готовый) = «готовый помочь». bereit = fertig — оба «готовый».","ти":3,"пи":6,"подтема":"Прила
