<script>
/* ============================================================
   FSRS-5 — расписание повторений, как в Anki.

   Алгоритм открытый (лицензия MIT), реализация здесь своя.
   Смысл: у каждого слова считаются три величины —
     S (stability)      сколько дней слово продержится в памяти,
     D (difficulty)     насколько оно трудное, от 1 до 10,
     R (retrievability) вероятность вспомнить его прямо сейчас.
   Слово показывается, когда R падает до 90%. Не раньше — иначе
   зубрёжка впустую, и не позже — иначе забудется совсем.
   ============================================================ */
window.ФСРС = (function(){
"use strict";

var W = [0.40255,1.18385,3.173,15.69105,7.1949,0.5345,1.4604,0.0046,1.54575,
         0.1192,1.01925,1.9395,0.11,0.29605,2.2698,0.2315,2.9898,0.51655,0.6621];

var DECAY  = -0.5;
var FACTOR = Math.pow(0.9, 1 / DECAY) - 1;     // 19/81 — чтобы R(S,S)=0.9
var ЦЕЛЬ   = 0.9;                              // желаемая доля вспоминаний
var МАКС   = 3650;                             // дальше десяти лет не планируем

// оценки: 1 снова · 2 трудно · 3 хорошо · 4 легко
function зажать(x, лево, право){ return Math.min(право, Math.max(лево, x)); }

function вероятность(дней, S){ return Math.pow(1 + FACTOR * дней / S, DECAY); }
function интервал(S){
  var д = S / FACTOR * (Math.pow(ЦЕЛЬ, 1 / DECAY) - 1);
  return зажать(Math.round(д), 1, МАКС);
}

function S0(G){ return W[G - 1]; }
function D0(G){ return зажать(W[4] - Math.exp(W[5] * (G - 1)) + 1, 1, 10); }

function новаяD(D, G){
  var сдвиг = -W[6] * (G - 3);
  var D1 = D + сдвиг * (10 - D) / 9;                  // трудные меняются медленнее
  return зажать(W[7] * D0(4) + (1 - W[7]) * D1, 1, 10);  // тянем к среднему
}

function SприУспехе(D, S, R, G){
  var трудно = (G === 2) ? W[15] : 1;
  var легко  = (G === 4) ? W[16] : 1;
  return S * (1 + Math.exp(W[8]) * (11 - D) * Math.pow(S, -W[9]) *
              (Math.exp(W[10] * (1 - R)) - 1) * трудно * легко);
}

function SприПровале(D, S, R){
  var новое = W[11] * Math.pow(D, -W[12]) * (Math.pow(S + 1, W[13]) - 1) *
              Math.exp(W[14] * (1 - R));
  return Math.min(новое, S);        // после провала прочность не растёт
}

var ДЕНЬ = 86400000;
function сегодня(){ var d = new Date(); d.setHours(0,0,0,0); return d.getTime(); }
function дней(от, до){ return Math.max(0, Math.round((до - от) / ДЕНЬ)); }

/* Принимает прежнее состояние (или null для нового слова) и оценку,
   возвращает новое состояние. */
function ответ(сост, G){
  var н = сегодня();
  if (!сост || !сост.S){
    return {
      S: S0(G), D: D0(G),
      due: н + интервал(S0(G)) * ДЕНЬ,
      last: н, reps: 1, lapses: G === 1 ? 1 : 0
    };
  }
  var прошло = дней(сост.last, н);
  var R = вероятность(прошло, сост.S);
  var S = (G === 1) ? SприПровале(сост.D, сост.S, R)
                    : SприУспехе(сост.D, сост.S, R, G);
  return {
    S: S, D: новаяD(сост.D, G),
    due: н + интервал(S) * ДЕНЬ,
    last: н, reps: (сост.reps || 0) + 1,
    lapses: (сост.lapses || 0) + (G === 1 ? 1 : 0)
  };
}

/* Что будет, если нажать эту кнопку — чтобы подписать её «через 4 дня». */
function прогноз(сост, G){
  var н = ответ(сост, G);
  return Math.max(1, Math.round((н.due - сегодня()) / ДЕНЬ));
}

function пора(сост){ return !сост || !сост.due || сост.due <= сегодня(); }

/* Слово считается выученным, когда держится в памяти не меньше трёх недель. */
function выучено(сост){ return !!(сост && сост.S >= 21); }
function проблемное(сост){ return !!(сост && (сост.lapses || 0) >= 6); }

function словами(дни){
  if (дни < 1) return 'сегодня';
  if (дни === 1) return 'завтра';
  if (дни < 30) return 'через ' + дни + ' ' + скл(дни, 'день','дня','дней');
  if (дни < 365){ var м = Math.round(дни / 30); return 'через ' + м + ' ' + скл(м,'месяц','месяца','месяцев'); }
  var г = (дни / 365).toFixed(1).replace('.0','');
  return 'через ' + г + ' ' + скл(Math.round(дни/365), 'год','года','лет');
}
function скл(n, a, b, c){ n = Math.abs(n) % 100; var d = n % 10;
  if (n > 10 && n < 20) return c; if (d > 1 && d < 5) return b; if (d === 1) return a; return c; }

const ПРАВИЛА = [{"id":"f5069e6216","тема":"Множественное число","знак":"➕","вид":"правило","раздел":"Женский и множественное: без окончания","урок":"urok37","урокИмя":"Урок 38","html":"Тут проще: артикль <b class=\"hl\">der</b>, а само существительное <b>не меняется</b>. Не путайте с Nominativ мужского рода — там тоже der, но смысл другой: <i>der Arzt</i> (кто?) и <i>die Tasche der Ärztin</i> (чья?).","текст":"Тут проще: артикль der, а само существительное не меняется. Не путайте с Nominativ мужского рода — там тоже der, но смысл другой: der Arzt (кто?) и die Tasche der Ärztin (чья?).","ти":0,"пи":0,"подтема":"Обычные глаголы: окончания"},{"id":"6fa73dbe36","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"Времена: в немецком их всего три","урок":"dasha3","урокИмя":"Занятие 3 с Дашей","html":"Сегодня занимаемся <b>Präsens</b> — настоящим временем. Что такое «спряжение»? Ровно то же самое, что в русском: <i>я дела<b>ю</b>, ты дела<b>ешь</b>, он дела<b>ет</b></i>. Окончание глагола меняется в зависимости от того, <b>кто</b> действует. По-немецки принцип точно такой же.","текст":"Сегодня занимаемся Präsens — настоящим временем. Что такое «спряжение»? Ровно то же самое, что в русском: я делаю, ты делаешь, он делает. Окончание глагола меняется в зависимости от того, кто действует. По-немецки принцип точно такой же.","ти":0,"пи":0,"подтема":"Обычные глаголы: окончания"},{"id":"9a1cb87c07","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"⭐⭐ Главное: все глаголы делятся на три категории","урок":"dasha3","урокИмя":"Занятие 3 с Дашей","html":"Вот схема, ради которой было всё занятие. Даша разложила все немецкие глаголы на три кучки — и это сразу снимает страх, потому что первая кучка почти всё и покрывает.\n    </div>\n    <table class=\"casetab\">\n      <tr><th>Категория</th><th>Сколько их</th><th>Что делают</th></tr>\n      <tr><td class=\"lbl\"><b>1. Правильные</b></td><td><b>90–95%</b></td><td>просто добавляют окончание</td></tr>\n      <tr><td class=\"lbl\"><b>2. С изменяемой гласной</b><br><span style=\"font-size:11px\">Vokalwechselverben</span></td><td>небольшой список</td><td>окончание + меняют букву внутри</td></tr>\n      <tr><td class=\"lbl\"><b>3. Исключения</b></td><td>около пяти</td><td>своя форма, просто учим</td></tr>\n    </table>\n    <div class=\"link-box\" style=\"margin-top:14px\">\n      💡 <b>Почему это радостная новость.</b> Девять из десяти глаголов — первая категория. То есть выучив одно правило, ты уже умеешь спрягать <b>почти любой</b> немецкий глагол. Вторая категория — это список, который просто заучивается. Третья — пять штук, их знают наизусть все.","текст":"Вот схема, ради которой было всё занятие. Даша разложила все немецкие глаголы на три кучки — и это сразу снимает страх, потому что первая кучка почти всё и покрывает. КатегорияСколько ихЧто делают 1. Правильные90–95%просто добавляют окончание 2. С изменяемой гласной Vokalwechselverbenнебольшой списококончание + меняют букву внутри 3. Исключенияоколо пятисвоя форма, просто учим 💡 Почему это радостная новость. Девять из десяти глаголов — первая категория. То есть выучив одно правило, ты уже умеешь спрягать почти любой немецкий глагол. Вторая категория — это список, который просто заучивается. Третья — пять штук, их знают наизусть все.","ти":0,"пи":0,"подтема":"Обычные глаголы: окончания"},{"id":"23d3091bdf","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"Категория 1: правильные глаголы — одно правило на всё","урок":"dasha3","урокИмя":"Занятие 3 с Дашей","html":"Сначала два слова, которые надо понимать:<br><br>\n      <b class=\"hl\">Инфинитив</b> — это глагол в словарной форме, как он записан в словаре. У немецких глаголов он почти всегда кончается на <b>-en</b>: <i>machen</i> (делать), <i>kommen</i> (приходить).<br>\n      <b class=\"hl\">Основа</b> — это глагол <b>без этого -en</b>. У <i>machen</i> основа <b>mach-</b>. У <i>kommen</i> — <b>komm-</b>.<br><br>\n      А дальше всё просто: <b>берём основу и прилепляем окончание</b>. Окончаний всего четыре разных: <b>-e, -st, -t, -en</b>.\n    </div>\n    <table class=\"casetab\">\n      <tr><th>Кто</th><th>Окончание</th><th>machen (делать)</th></tr>\n      <tr><td class=\"lbl\">ich (я)</td><td><b>-e</b></td><td>ich mach<b>e</b></td></tr>\n      <tr><td class=\"lbl\">du (ты)</td><td><b>-st</b></td><td>du mach<b>st</b></td></tr>\n      <tr><td class=\"lbl\">er / sie / es (он/она/оно)</td><td><b>-t</b></td><td>er mach<b>t</b></td></tr>\n      <tr><td class=\"lbl\">wir (мы)</td><td><b>-en</b></td><td>wir mach<b>en</b></td></tr>\n      <tr><td class=\"lbl\">ihr (вы, свои)</td><td><b>-t</b></td><td>ihr mach<b>t</b></td></tr>\n      <tr><td class=\"lbl\">sie / Sie (они / Вы)</td><td><b>-en</b></td><td>sie mach<b>en</b></td></tr>\n    </table>\n    <div class=\"grid2\" id=\"machen\">","текст":"Сначала два слова, которые надо понимать: Инфинитив — это глагол в словарной форме, как он записан в словаре. У немецких глаголов он почти всегда кончается на -en: machen (делать), kommen (приходить). Основа — это глагол без этого -en. У machen основа mach-. У kommen — komm-. А дальше всё просто: берём основу и прилепляем окончание. Окончаний всего четыре разных: -e, -st, -t, -en. КтоОкончаниеmachen (делать) ich (я)-eich mache du (ты)-stdu machst er / sie / es (он/она/оно)-ter macht wir (мы)-enwir machen ihr (вы, свои)-tihr macht sie / Sie (они / Вы)-ensie machen","ти":0,"пи":0,"подтема":"Обычные глаголы: окончания"},{"id":"88d0764ec6","тема":"Глагол: спряжение","знак":"🔤","вид":"ловушка","раздел":"Категория 1: правильные глаголы — одно правило на всё","урок":"dasha3","урокИмя":"Занятие 3 с Дашей","html":"<span class=\"big\">Две подсказки, которые снимают путаницу</span>\n      1️⃣ <b>У du ВСЕГДА -st.</b> Это самая надёжная примета во всём немецком. Видишь <i>du</i> — жди <b>-st</b>. Даша повторила это раз пять за занятие.<br><br>\n      2️⃣ <b>wir и sie/Sie — это просто инфинитив.</b> Ничего не меняем, берём словарную форму как есть: <i>wir machen</i>, <i>sie machen</i>. Ноль работы.<br><br>\n      Григорий на занятии пару раз путал <b>ich</b> и <b>ihr</b> (<i>ich wohne</i> / <i>ihr wohnt</i>) — это частая путаница, тут просто внимание: у <b>ihr</b> на конце <b>-t</b>, у <b>ich</b> — <b>-e</b>.","текст":"Две подсказки, которые снимают путаницу 1️⃣ У du ВСЕГДА -st. Это самая надёжная примета во всём немецком. Видишь du — жди -st. Даша повторила это раз пять за занятие. 2️⃣ wir и sie/Sie — это просто инфинитив. Ничего не меняем, берём словарную форму как есть: wir machen, sie machen. Ноль работы. Григорий на занятии пару раз путал ich и ihr (ich wohne / ihr wohnt) — это частая путаница, тут просто внимание: у ihr на конце -t, у ich — -e.","ти":0,"пи":0,"подтема":"Обычные глаголы: окончания"},{"id":"bde83f7e93","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"Правильные глаголы: шесть окончаний","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"Берём глагол, отрезаем <span class=\"hl\">-en</span> — получилась <b>основа</b>.\n      К ней приклеиваем хвостик. Всё.<br><br>\n      wohn<b>en</b> (жить) → основа <b>wohn</b>","текст":"Берём глагол, отрезаем -en — получилась основа. К ней приклеиваем хвостик. Всё. wohnen (жить) → основа wohn","ти":0,"пи":0,"подтема":"Обычные глаголы: окончания"},{"id":"7e7b20745c","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"Правильные глаголы: шесть окончаний","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"Обратите внимание: у <b>wir</b> и у <b>sie/Sie</b> окончание <span class=\"hl\">-en</span> —\n      это ровно тот же вид, что и сам глагол в словаре (инфинитив). Ничего придумывать не надо.\n      А у <b>er</b> и у <b>ihr</b> хвостик одинаковый — <span class=\"hl\">-t</span>.","текст":"Обратите внимание: у wir и у sie/Sie окончание -en — это ровно тот же вид, что и сам глагол в словаре (инфинитив). Ничего придумывать не надо. А у er и у ihr хвостик одинаковый — -t.","ти":0,"пи":0,"подтема":"Обычные глаголы: окончания"},{"id":"5c44cc2ecb","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"⭐ Повторение: спряжение","урок":"dasha9","урокИмя":"Занятие 9 с Дашей","html":"<b>Что это вообще такое.</b> Глагол меняет окончание под того, кто действует: <i>ich</i> — одно, <i>du</i> — другое. Почти все глаголы делают это по одному правилу (основа + окончание). Пять самых частых — <b>неправильные</b>, их формы просто запоминают.<br><br>\n      <b>Правило обычного глагола:</b> основа (без -en) + <b>ich -e · du -st · er/sie/es -t · wir -en · ihr -t · sie/Sie -en</b>.<br>\n      ⭐ Даша напомнила главное: с <b>wir, sie (они) и Sie (вы вежливое)</b> глагол <b>всегда как в словаре</b> (инфинитив): <i>wir haben, sie sind, Sie wissen</i>.","текст":"Что это вообще такое. Глагол меняет окончание под того, кто действует: ich — одно, du — другое. Почти все глаголы делают это по одному правилу (основа + окончание). Пять самых частых — неправильные, их формы просто запоминают. Правило обычного глагола: основа (без -en) + ich -e · du -st · er/sie/es -t · wir -en · ihr -t · sie/Sie -en. ⭐ Даша напомнила главное: с wir, sie (они) и Sie (вы вежливое) глагол всегда как в словаре (инфинитив): wir haben, sie sind, Sie wissen.","ти":0,"пи":0,"подтема":"Обычные глаголы: окончания"},{"id":"6c8ea56222","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"⭐ Повторение: спряжение","урок":"dasha9","урокИмя":"Занятие 9 с Дашей","html":"<b>wissen</b> читается «висен», хотя <i>ich weiß</i> — «вайс». У <i>ich weiß</i> и <i>er weiß</i> <b>нет окончания</b> — форма одна и та же.<br>\n      <b>tun или machen?</b> Оба «делать». Даша: <i>tun</i> живёт в устойчивых выражениях, а в обычной речи почти всегда <b>machen</b>. Хочешь сказать «делать» — бери machen.","текст":"wissen читается «висен», хотя ich weiß — «вайс». У ich weiß и er weiß нет окончания — форма одна и та же. tun или machen? Оба «делать». Даша: tun живёт в устойчивых выражениях, а в обычной речи почти всегда machen. Хочешь сказать «делать» — бери machen.","ти":0,"пи":0,"подтема":"Обычные глаголы: окончания"},{"id":"463ef3ed51","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"Правильные глаголы — для сравнения","урок":"polya5","урокИмя":"Занятие 5 Полины","html":"Эти ведут себя предсказуемо: корень не меняется, только окончания <b class=\"hl\">-e, -st, -t, -en, -t, -en</b>.","текст":"Эти ведут себя предсказуемо: корень не меняется, только окончания -e, -st, -t, -en, -t, -en.","ти":0,"пи":0,"подтема":"Обычные глаголы: окончания"},{"id":"67e453199a","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"Правильные глаголы: ge + основа + t","урок":"urok12","урокИмя":"Урок 13","html":"Самая большая группа. Схема простая: <b class=\"hl\">ge</b> + основа + <b class=\"hl\">t</b>. <i>machen → <b>ge</b>mach<b>t</b></i>.<br>\n      Если основа кончается на -t или -d, вставляем <b>-e-</b> для удобства: <i>arbeiten → gearbei<b>te</b>t</i>, <i>warten → gewar<b>te</b>t</i>.","текст":"Самая большая группа. Схема простая: ge + основа + t. machen → gemacht. Если основа кончается на -t или -d, вставляем -e- для удобства: arbeiten → gearbeitet, warten → gewartet.","ти":0,"пи":0,"подтема":"Обычные глаголы: окончания"},{"id":"247e9baf18","тема":"Глагол: спряжение","знак":"🔤","вид":"ловушка","раздел":"⚠️ essen и trinken — один обычный, один хамелеон","урок":"urok14","урокИмя":"Урок 15","html":"<span class=\"big\">essen — из тех самых глаголов-хамелеонов (урок 8)</span>\n      В формах <b>du</b> и <b>er/sie/es</b> корневая <b>e меняется на i</b>: <i>du <b>i</b>sst</i>, <i>er <b>i</b>sst</i>. И заметь: у <i>du</i> и <i>er</i> форма получается <b>одинаковая</b> — <i>isst</i>. Это единственная сложность темы.<br><br>\n      А <b>trinken</b> — обычный, спрягается как <i>machen</i> из урока 3. Никаких сюрпризов.","текст":"essen — из тех самых глаголов-хамелеонов (урок 8) В формах du и er/sie/es корневая e меняется на i: du isst, er isst. И заметь: у du и er форма получается одинаковая — isst. Это единственная сложность темы. А trinken — обычный, спрягается как machen из урока 3. Никаких сюрпризов.","ти":0,"пи":0,"подтема":"Обычные глаголы: окончания"},{"id":"40cabb6e87","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"⭐ Слабые глаголы: stem + te","урок":"urok29","урокИмя":"Урок 30","html":"Формула простая: основа глагола плюс <b class=\"hl\">-te</b> плюс личное окончание. У <b>ich</b> и <b>er/sie/es</b> окончания вообще нет — форма одна и та же.","текст":"Формула простая: основа глагола плюс -te плюс личное окончание. У ich и er/sie/es окончания вообще нет — форма одна и та же.","ти":0,"пи":0,"подтема":"Обычные глаголы: окончания"},{"id":"30098e9112","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"Ловушки окончаний","урок":"urok3","урокИмя":"Урок 4","html":"<b>Основа на -t или -d</b> (<i>arbeit-, find-, antwort-, wart-</i>): перед <i>-st</i> и <i>-t</i> вставляем <b>-e-</b>, иначе не выговорить: <i>du arbeit<b class=\"hl\">e</b>st, er arbeit<b class=\"hl\">e</b>t</i>.<br>\n      <b>Основа на -s, -ß, -z</b> (<i>heiß-, tanz-</i>): у <i>du</i> только <b>-t</b>: <i>du heißt, du tanzt</i> — не «heißst».<br>\n      <b>Глаголы на -eln</b> (<i>behandeln</i>): у <i>ich</i> <i>e</i> выпадает: <i>ich behandle</i>.","текст":"Основа на -t или -d (arbeit-, find-, antwort-, wart-): перед -st и -t вставляем -e-, иначе не выговорить: du arbeitest, er arbeitet. Основа на -s, -ß, -z (heiß-, tanz-): у du только -t: du heißt, du tanzt — не «heißst». Глаголы на -eln (behandeln): у ich e выпадает: ich behandle.","ти":0,"пи":0,"подтема":"Обычные глаголы: окончания"},{"id":"ea3ac4e340","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"sein (быть) — самый неправильный","урок":"urok8","урокИмя":"Урок 9","html":"У <b>sein</b> формы вообще не похожи на инфинитив — их просто <b class=\"hl\">учат наизусть</b>, как «я есмь, ты еси» в старорусском. Зато он нужен постоянно: в немецком нельзя сказать «я врач», только «я <i>есть</i> врач» — <i>Ich bin Arzt</i>.","текст":"У sein формы вообще не похожи на инфинитив — их просто учат наизусть, как «я есмь, ты еси» в старорусском. Зато он нужен постоянно: в немецком нельзя сказать «я врач», только «я есть врач» — Ich bin Arzt.","ти":0,"пи":0,"подтема":"Обычные глаголы: окончания"},{"id":"acc08f6dde","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"⭐ Кто сюда входит — три группы","урок":"urok36","урокИмя":"Урок 37","html":"Все слабые существительные — <b>мужского рода</b>, и почти все обозначают <b>людей или животных</b>. Узнать их можно по окончанию.","текст":"Все слабые существительные — мужского рода, и почти все обозначают людей или животных. Узнать их можно по окончанию.","ти":0,"пи":0,"подтема":"Обычные глаголы: окончания"},{"id":"f0d1300875","тема":"Местоимения","знак":"🧩","вид":"правило","раздел":"Präsens — шесть окончаний","урок":"urok3","урокИмя":"Урок 4","html":"В словаре глагол стоит с <b>-en</b> на конце: <i>mach-en, wohn-en</i>. Отрезаем <i>-en</i> — остаётся основа. К ней добавляем окончание по лицу:<br>\n      <b>ich -e · du -st · er/sie/es -t · wir -en · ihr -t · sie/Sie -en</b>.<br><br>\n      Шесть окончаний — одни и те же для сотен глаголов. <b class=\"hl\">wir</b> и <b class=\"hl\">sie/Sie</b> всегда звучат как словарная форма: <i>wir machen, Sie machen</i>.","текст":"В словаре глагол стоит с -en на конце: mach-en, wohn-en. Отрезаем -en — остаётся основа. К ней добавляем окончание по лицу: ich -e · du -st · er/sie/es -t · wir -en · ihr -t · sie/Sie -en. Шесть окончаний — одни и те же для сотен глаголов. wir и sie/Sie всегда звучат как словарная форма: wir machen, Sie machen.","ти":0,"пи":0,"подтема":"Обычные глаголы: окончания"},{"id":"d5fa916966","тема":"Предлоги","знак":"🧭","вид":"правило","раздел":"Тренировка: kommen, wohnen, trinken","урок":"dasha3","урокИмя":"Занятие 3 с Дашей","html":"<b class=\"hl\">kommen aus …</b> — «быть родом из». Предлог <b>aus</b> = «из». Так ты говоришь, откуда ты.","текст":"kommen aus … — «быть родом из». Предлог aus = «из». Так ты говоришь, откуда ты.","ти":0,"пи":0,"подтема":"Обычные глаголы: окончания"},{"id":"3ee6bebd0f","тема":"Произношение и письмо","знак":"🗣","вид":"правило","раздел":"Партиципы-существительные","урок":"urok42","урокИмя":"Урок 43","html":"Партицип может сам стать существительным — с большой буквы и с окончаниями прилагательного: <i>der Verletzt<b>e</b>, ein Verletzt<b>er</b>, die Verletzt<b>en</b></i>. Так же <i>der Angehörige</i> (родственник) — это прилагательное, которое стало существительным.","текст":"Партицип может сам стать существительным — с большой буквы и с окончаниями прилагательного: der Verletzte, ein Verletzter, die Verletzten. Так же der Angehörige (родственник) — это прилагательное, которое стало существительным.","ти":0,"пи":0,"подтема":"Обычные глаголы: окончания"},{"id":"30ad19d196","тема":"Устойчивые выражения","знак":"🔗","вид":"правило","раздел":"⭐ Spaß machen — Даша велела записать","урок":"polya7","урокИмя":"Занятие 7 Полины","html":"<b class=\"hl\">der Spaß</b> — удовольствие, развлечение, веселье. Но переводить это слово по отдельности не надо — оно живёт в выражении:<br><br>\n      <b class=\"hl\">Das macht mir Spaß.</b> — буквально «это делает мне удовольствие», по-русски «мне это в радость, мне это нравится делать».<br><br>\n      Это одно из тех выражений, которые немцы употребляют постоянно. Выучи целиком, не разбирая на части.","текст":"der Spaß — удовольствие, развлечение, веселье. Но переводить это слово по отдельности не надо — оно живёт в выражении: Das macht mir Spaß. — буквально «это делает мне удовольствие», по-русски «мне это в радость, мне это нравится делать». Это одно из тех выражений, которые немцы употребляют постоянно. Выучи целиком, не разбирая на части.","ти":0,"пи":0,"подтема":"Обычные глаголы: окончания"},{"id":"978f05500f","тема":"Разное","знак":"📎","вид":"правило","раздел":"Steckbrief: анкета Несли","урок":"dasha9","урокИмя":"Занятие 9 с Дашей","html":"<b>der Wohnort</b> — место жительства: <i>wohnen</i> (жить) + <i>der Ort</i> (место).<br>\n      Про вторую девушку (фрау Николс, секретарь) — <b>на следующем занятии</b>: Даше пришлось уйти.","текст":"der Wohnort — место жительства: wohnen (жить) + der Ort (место). Про вторую девушку (фрау Николс, секретарь) — на следующем занятии: Даше пришлось уйти.","ти":0,"пи":0,"подтема":"Обычные глаголы: окончания"},{"id":"ba449ee552","тема":"Разное","знак":"📎","вид":"ловушка","раздел":"⚠️ leben или wohnen","урок":"polya6","урокИмя":"Занятие 6 Полины","html":"<span class=\"big\">Ошибкой не будет ни то, ни другое — но оттенок разный</span>\n      <b>wohnen</b> — жить физически, по адресу. Это основное слово для «я живу в…».<br>\n      <b>leben</b> — больше про <b>образ жизни</b>, про то, как человек живёт.<br><br>\n      Даша: «Можно и то, и то использовать синонимично, ошибки не будет».","текст":"Ошибкой не будет ни то, ни другое — но оттенок разный wohnen — жить физически, по адресу. Это основное слово для «я живу в…». leben — больше про образ жизни, про то, как человек живёт. Даша: «Можно и то, и то использовать синонимично, ошибки не будет».","ти":0,"пи":0,"подтема":"Обычные глаголы: окончания"},{"id":"9cd11c3d25","тема":"Разное","знак":"📎","вид":"правило","раздел":"Какое на вкус?","урок":"urok14","урокИмя":"Урок 15","html":"Прилагательное после <i>ist</i> не меняется — никаких окончаний: <i>Die Suppe ist <b>salzig</b></i>, <i>Der Kaffee ist <b>bitter</b></i>. «Слишком» — <b class=\"hl\">zu</b>: <i>zu salzig</i>, <i>zu scharf</i>.","текст":"Прилагательное после ist не меняется — никаких окончаний: Die Suppe ist salzig, Der Kaffee ist bitter. «Слишком» — zu: zu salzig, zu scharf.","ти":0,"пи":0,"подтема":"Обычные глаголы: окончания"},{"id":"60c260036f","тема":"Разное","знак":"📎","вид":"правило","раздел":"Три ступени — одна схема","урок":"urok22","урокИмя":"Урок 23","html":"<b class=\"hl\">klein</b> (маленький) → <b class=\"hl\">kleiner</b> (меньше) → <b class=\"hl\">am kleinsten</b> (меньше всех).<br><br>\n      Сравнительная — плюс <b>-er</b>. Превосходная — <b>am … -sten</b>. Никаких «более» и «самый» — всё окончаниями. Если слово кончается на -t, -d, -s, -ß, -z, в превосходной вставляем -e- для удобства: <i>am kältest<b>en</b>, am kürz<b>e</b>sten</i>.","текст":"klein (маленький) → kleiner (меньше) → am kleinsten (меньше всех). Сравнительная — плюс -er. Превосходная — am … -sten. Никаких «более» и «самый» — всё окончаниями. Если слово кончается на -t, -d, -s, -ß, -z, в превосходной вставляем -e- для удобства: am kältesten, am kürzesten.","ти":0,"пи":0,"подтема":"Обычные глаголы: окончания"},{"id":"7f91deb82d","тема":"Разное","знак":"📎","вид":"правило","раздел":"Смешанные глаголы","урок":"urok29","урокИмя":"Урок 30","html":"Немного глаголов — «смешанные»: гласная меняется, как у сильных, а окончание <b>-te</b> — как у слабых. Их немного, просто запомните:","текст":"Немного глаголов — «смешанные»: гласная меняется, как у сильных, а окончание -te — как у слабых. Их немного, просто запомните:","ти":0,"пи":0,"подтема":"Обычные глаголы: окончания"},{"id":"57ac0d5ba7","тема":"Разное","знак":"📎","вид":"правило","раздел":"Полезные глаголы","урок":"urok3","урокИмя":"Урок 4","html":"Девять из десяти — правильные: спрягаются ровно по таблице выше. <b>sprechen</b> — нет: <i>du sprichst, er spricht</i>. Такие глаголы с меняющейся гласной будут в уроке 8.","текст":"Девять из десяти — правильные: спрягаются ровно по таблице выше. sprechen — нет: du sprichst, er spricht. Такие глаголы с меняющейся гласной будут в уроке 8.","ти":0,"пи":0,"подтема":"Обычные глаголы: окончания"},{"id":"2a453c1907","тема":"Разное","знак":"📎","вид":"правило","раздел":"sie и Sie","урок":"urok3","урокИмя":"Урок 4","html":"<b>sie</b> (они) и <b>Sie</b> (Вы) — одна и та же форма глагола: <i>sie wohnen, Sie wohnen</i>. На слух не отличить — только по смыслу. А <b>sie</b> в значении «она» спрягается как <i>er</i>: <i>sie wohnt</i>.","текст":"sie (они) и Sie (Вы) — одна и та же форма глагола: sie wohnen, Sie wohnen. На слух не отличить — только по смыслу. А sie в значении «она» спрягается как er: sie wohnt.","ти":0,"пи":0,"подтема":"Обычные глаголы: окончания"},{"id":"6668e88ab6","тема":"Разное","знак":"📎","вид":"правило","раздел":"Сначала эталон: правильный глагол","урок":"urok8","урокИмя":"Урок 9","html":"<b>kommen</b> (приходить) — <b>правильный</b> глагол, как в Уроке 3. Корень <i>komm-</i> не меняется, меняются только окончания: <b class=\"hl\">-e, -st, -t, -en, -t, -en</b>. Запомни его как образец — от него будем отталкиваться.","текст":"kommen (приходить) — правильный глагол, как в Уроке 3. Корень komm- не меняется, меняются только окончания: -e, -st, -t, -en, -t, -en. Запомни его как образец — от него будем отталкиваться.","ти":0,"пи":0,"подтема":"Обычные глаголы: окончания"},{"id":"832b431dcd","тема":"Разное","знак":"📎","вид":"ловушка","раздел":"Глаголы-хамелеоны: меняется корень","урок":"urok8","урокИмя":"Урок 9","html":"Главное правило урока: у этих глаголов корень меняется <b>ТОЛЬКО в двух формах</b> — <b>du</b> и <b>er/sie/es</b>. Все остальные (ich, wir, ihr, sie) — как у правильного глагола, без сюрпризов.","текст":"Главное правило урока: у этих глаголов корень меняется ТОЛЬКО в двух формах — du и er/sie/es. Все остальные (ich, wir, ihr, sie) — как у правильного глагола, без сюрпризов.","ти":0,"пи":0,"подтема":"Обычные глаголы: окончания"},{"id":"ef445f71e7","тема":"Разное","знак":"📎","вид":"правило","раздел":"Лево и право, верх и низ","урок":"urok9","урокИмя":"Урок 10","html":"<b>links</b> — слева, <b>rechts</b> — справа, <b>oben</b> — вверху, <b>unten</b> — внизу, <b>vorne / hinten</b> — спереди / сзади. Перед словом «левый / правый» получают окончание: <i>das link<b>e</b> Bein, am recht<b>en</b> Knöchel</i> — пока просто узнавай на слух.","текст":"links — слева, rechts — справа, oben — вверху, unten — внизу, vorne / hinten — спереди / сзади. Перед словом «левый / правый» получают окончание: das linke Bein, am rechten Knöchel — пока просто узнавай на слух.","ти":0,"пи":0,"подтема":"Обычные глаголы: окончания"},{"id":"deeea0335f","тема":"Множественное число","знак":"➕","вид":"правило","раздел":"tun и wissen","урок":"polya5","урокИмя":"Занятие 5 Полины","html":"<b>tun</b> — делать, <b>wissen</b> — знать. У <b>wissen</b> в единственном числе меняется корень: <i>ich weiß, du weißt, er weiß</i> — и только во множественном возвращается <i>wiss-</i>.","текст":"tun — делать, wissen — знать. У wissen в единственном числе меняется корень: ich weiß, du weißt, er weiß — и только во множественном возвращается wiss-.","ти":0,"пи":1,"подтема":"Глаголы-исключения: sein, haben, werden, wissen, tun"},{"id":"7b0d85a520","тема":"Модальные глаголы","знак":"🔑","вид":"правило","раздел":"⭐ С модальными: muss … werden","урок":"urok35","урокИмя":"Урок 36","html":"Для врача это, пожалуй, самая нужная форма: «нужно прооперировать», «можно сделать амбулаторно», «нельзя принимать с алкоголем».<br>\n      Формула: <b class=\"hl\">модальный глагол</b> на втором месте + <b>Partizip II</b> + <b class=\"hl\">werden</b> в самом конце. Модальный может стоять и в прошедшем: <i>konnte … entlassen werden</i>.","текст":"Для врача это, пожалуй, самая нужная форма: «нужно прооперировать», «можно сделать амбулаторно», «нельзя принимать с алкоголем». Формула: модальный глагол на втором месте + Partizip II + werden в самом конце. Модальный может стоять и в прошедшем: konnte … entlassen werden.","ти":0,"пи":1,"подтема":"Глаголы-исключения: sein, haben, werden, wissen, tun"},{"id":"f8396b29d9","тема":"Прошедшее время","знак":"⏮","вид":"правило","раздел":"sein → war","урок":"urok19","урокИмя":"Урок 20","html":"Самая нужная форма во всём уроке. <b class=\"hl\">war</b> = «был». Обрати внимание на главное: <b>ich</b> и <b>er</b> — <b class=\"hl\">одинаковые, без окончания</b>. Это не случайность, а общее правило Präteritum (раздел 6).","текст":"Самая нужная форма во всём уроке. war = «был». Обрати внимание на главное: ich и er — одинаковые, без окончания. Это не случайность, а общее правило Präteritum (раздел 6).","ти":0,"пи":1,"подтема":"Глаголы-исключения: sein, haben, werden, wissen, tun"},{"id":"522aabd69d","тема":"Прошедшее время","знак":"⏮","вид":"правило","раздел":"haben → hatte","урок":"urok19","урокИмя":"Урок 20","html":"<b class=\"hl\">hatte</b> = «имел». Здесь тоже <b>ich</b> и <b>er</b> совпадают. И запомни двойное <b>tt</b> — на письме легко потерять.<br><br>\n      Для врача это рабочая лошадка: <i>hatten Sie…?</i> — «было ли у Вас…?»","текст":"hatte = «имел». Здесь тоже ich и er совпадают. И запомни двойное tt — на письме легко потерять. Для врача это рабочая лошадка: hatten Sie…? — «было ли у Вас…?»","ти":0,"пи":1,"подтема":"Глаголы-исключения: sein, haben, werden, wissen, tun"},{"id":"345cadc96c","тема":"Прошедшее время","знак":"⏮","вид":"правило","раздел":"⭐ Формула: werden + Partizip II","урок":"urok27","урокИмя":"Урок 28","html":"Формула ровно та же, что в Perfekt, только вместо <b>haben/sein</b> берём <b>werden</b>: <b class=\"hl\">werden</b> (спрягается, второе место) плюс <b class=\"hl\">Partizip II</b> (не меняется, в самый конец предложения).<br><br>\n      <b>werden</b> вы уже знаете по особым глаголам: <i>ich werde, du wirst, er wird…</i> Здесь та же самая форма, просто рядом с ней встаёт причастие, а не «становиться что-то».","текст":"Формула ровно та же, что в Perfekt, только вместо haben/sein берём werden: werden (спрягается, второе место) плюс Partizip II (не меняется, в самый конец предложения). werden вы уже знаете по особым глаголам: ich werde, du wirst, er wird… Здесь та же самая форма, просто рядом с ней встаёт причастие, а не «становиться что-то».","ти":0,"пи":1,"подтема":"Глаголы-исключения: sein, haben, werden, wissen, tun"},{"id":"d38f77f329","тема":"Прошедшее время","знак":"⏮","вид":"правило","раздел":"werden: Futur или Passiv?","урок":"urok34","урокИмя":"Урок 35","html":"Глагол <b>werden</b> встречается и в Futur, и в Passiv (урок 27). Отличить просто — смотрите на конец фразы: <b class=\"hl\">Infinitiv</b> — это Futur («я осмотрю»), <b class=\"hl\">Partizip II</b> — это Passiv («меня осматривают»).","текст":"Глагол werden встречается и в Futur, и в Passiv (урок 27). Отличить просто — смотрите на конец фразы: Infinitiv — это Futur («я осмотрю»), Partizip II — это Passiv («меня осматривают»).","ти":0,"пи":1,"подтема":"Глаголы-исключения: sein, haben, werden, wissen, tun"},{"id":"47c3f98205","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"⭐⭐ Нет глагола в русском — в немецком будет sein","урок":"dasha10","урокИмя":"Занятие 10 с Дашей","html":"Совет Даши: <b>говори медленно, но сначала построй предложение в голове</b> — и каждый раз спроси себя: «а где у меня глагол?». В 99 % случаев, когда его не хватает, нужен именно sein.","текст":"Совет Даши: говори медленно, но сначала построй предложение в голове — и каждый раз спроси себя: «а где у меня глагол?». В 99 % случаев, когда его не хватает, нужен именно sein.","ти":0,"пи":1,"подтема":"Глаголы-исключения: sein, haben, werden, wissen, tun"},{"id":"06660d3217","тема":"Глагол: спряжение","знак":"🔤","вид":"ловушка","раздел":"⭐⭐ Нет глагола в русском — в немецком будет sein","урок":"dasha10","урокИмя":"Занятие 10 с Дашей","html":"<span class=\"big\">«У меня болит» — это haben, не sein</span>\n      По-русски «где у тебя болит?», а немец говорит «где ты <b>имеешь</b> боль»: <i>Wo <b>hast</b> du Schmerzen?</i> Так же со всеми болезнями: <i>Sie <b>hat</b> Grippe</i> — у неё грипп, <i>Paul <b>hat</b> Schnupfen</i> — у Пауля насморк. А «больной», «простуженный» — это состояние, тут sein: <i>Eva <b>ist</b> krank, er <b>ist</b> erkältet</i>.","текст":"«У меня болит» — это haben, не sein По-русски «где у тебя болит?», а немец говорит «где ты имеешь боль»: Wo hast du Schmerzen? Так же со всеми болезнями: Sie hat Grippe — у неё грипп, Paul hat Schnupfen — у Пауля насморк. А «больной», «простуженный» — это состояние, тут sein: Eva ist krank, er ist erkältet.","ти":0,"пи":1,"подтема":"Глаголы-исключения: sein, haben, werden, wissen, tun"},{"id":"3877018d63","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"⭐⭐ Лист Даши: haben и sein","урок":"dasha10","урокИмя":"Занятие 10 с Дашей","html":"<b>doch</b> — «нет же, да!»: ответ «да» на вопрос с отрицанием. <i>Seid ihr nicht müde? — <b>Doch</b>, wir sind müde.</i> — Вы не устали? — Да нет, устали.<br>\n      <b>Lust haben</b> — хотеть, «иметь желание»: <i>Haben Sie Lust, zu uns zu kommen?</i> — Хотите к нам прийти?<br>\n      <b>Das ist mir egal</b> (или <i>Es ist mir egal</i>) — мне всё равно. Устойчивое выражение — запомнить целиком.<br>\n      <b>viel zu tun haben</b> — иметь много дел. <b>Bärenhunger</b> — «медвежий голод», голоден как волк.","текст":"doch — «нет же, да!»: ответ «да» на вопрос с отрицанием. Seid ihr nicht müde? — Doch, wir sind müde. — Вы не устали? — Да нет, устали. Lust haben — хотеть, «иметь желание»: Haben Sie Lust, zu uns zu kommen? — Хотите к нам прийти? Das ist mir egal (или Es ist mir egal) — мне всё равно. Устойчивое выражение — запомнить целиком. viel zu tun haben — иметь много дел. Bärenhunger — «медвежий голод», голоден как волк.","ти":0,"пи":1,"подтема":"Глаголы-исключения: sein, haben, werden, wissen, tun"},{"id":"2b722d0373","тема":"Глагол: спряжение","знак":"🔤","вид":"ловушка","раздел":"⭐⭐ Лист Даши: haben и sein","урок":"dasha10","урокИмя":"Занятие 10 с Дашей","html":"<span class=\"big\">Два человека — это «они»</span>\n      <i>Irene und Jonas</i>, <i>Peter und Karla</i>, <i>die Eltern</i>, <i>die Kinder</i> — подставь вместо них <b>sie (они)</b>, и глагол станет <i>sind / haben</i>. Гриша сначала ставил <i>ist</i>.","текст":"Два человека — это «они» Irene und Jonas, Peter und Karla, die Eltern, die Kinder — подставь вместо них sie (они), и глагол станет sind / haben. Гриша сначала ставил ist.","ти":0,"пи":1,"подтема":"Глаголы-исключения: sein, haben, werden, wissen, tun"},{"id":"b6e63e634e","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"⭐⭐ Лист Даши: sein и haben","урок":"dasha11","урокИмя":"Занятие 11 с Дашей","html":"<b>Sind Sie</b> с большой <b>S</b> — это вежливое «Вы», глагол <i>sind</i>. <b>Ist sie</b> с маленькой — «она». Гриша сначала перевёл <i>Ist sie Lehrerin?</i> как «ты учительница?» — нет, «она учительница?».<br>\n      <b>Maler</b> здесь не фамилия, а профессия — маляр (в листе <i>Kamilla Maler</i> и <i>Künstler</i> по-мужски; про женщину правильнее <i>Malerin, Künstlerin</i> — так и озвучено).<br>\n      <b>nur</b> — только: <i>er ist <b>nur</b> Vize-Direktor</i>.<br>\n      <b>das Schloss</b> — и замок-крепость, и замок в двери, как в русском! Отсюда <b>der Schlosser</b> — слесарь. Даша живёт рядом с замком Эггенберг — <i>Schloss Eggenberg</i>.","текст":"Sind Sie с большой S — это вежливое «Вы», глагол sind. Ist sie с маленькой — «она». Гриша сначала перевёл Ist sie Lehrerin? как «ты учительница?» — нет, «она учительница?». Maler здесь не фамилия, а профессия — маляр (в листе Kamilla Maler и Künstler по-мужски; про женщину правильнее Malerin, Künstlerin — так и озвучено). nur — только: er ist nur Vize-Direktor. das Schloss — и замок-крепость, и замок в двери, как в русском! Отсюда der Schlosser — слесарь. Даша живёт рядом с замком Эггенберг — Schloss Eggenberg.","ти":0,"пи":1,"подтема":"Глаголы-исключения: sein, haben, werden, wissen, tun"},{"id":"1771d5be78","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"⭐⭐ Лист Даши: sein и haben","урок":"dasha11","урокИмя":"Занятие 11 с Дашей","html":"<b>viel Zeit haben</b> — иметь много <b>времени</b>, а «много дел» — <b>viel zu tun haben</b>. Гриша перевёл первую фразу как «у меня много дел» — Даша поправила.<br>\n      <b>keine Lust haben</b> — не хотеть, нет желания. <b>das Glück</b> — удача и счастье. <b>die Geige</b> — скрипка.<br>\n      <b>ein / eine</b> — неопределённый артикль: «какая-то, любая». <i>Haben Sie eine Zigarette?</i> — у вас есть сигарета (какая-нибудь)? На русский обычно не переводится.","текст":"viel Zeit haben — иметь много времени, а «много дел» — viel zu tun haben. Гриша перевёл первую фразу как «у меня много дел» — Даша поправила. keine Lust haben — не хотеть, нет желания. das Glück — удача и счастье. die Geige — скрипка. ein / eine — неопределённый артикль: «какая-то, любая». Haben Sie eine Zigarette? — у вас есть сигарета (какая-нибудь)? На русский обычно не переводится.","ти":0,"пи":1,"подтема":"Глаголы-исключения: sein, haben, werden, wissen, tun"},{"id":"7dfe11f897","тема":"Глагол: спряжение","знак":"🔤","вид":"ловушка","раздел":"⭐⭐ Лист Даши: sein и haben","урок":"dasha11","урокИмя":"Занятие 11 с Дашей","html":"<span class=\"big\">aus = откуда, in = где</span>\n      <i>Wir sind <b>aus</b> London</i> — мы <b>из</b> Лондона. <i>Wir sind <b>in</b> London</i> — мы <b>в</b> Лондоне. Гриша переводил «мы в Лондоне» — Даша поправила.","текст":"aus = откуда, in = где Wir sind aus London — мы из Лондона. Wir sind in London — мы в Лондоне. Гриша переводил «мы в Лондоне» — Даша поправила.","ти":0,"пи":1,"подтема":"Глаголы-исключения: sein, haben, werden, wissen, tun"},{"id":"2fb1e4f062","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"Категория 3: глаголы-исключения (их всего пять)","урок":"dasha3","урокИмя":"Занятие 3 с Дашей","html":"Эти не подчиняются никаким правилам вообще — ни обычным, ни «с изменяемой гласной». У них свои формы, которые просто заучивают наизусть. Хорошая новость: их пять, и два из них ты уже знаешь.","текст":"Эти не подчиняются никаким правилам вообще — ни обычным, ни «с изменяемой гласной». У них свои формы, которые просто заучивают наизусть. Хорошая новость: их пять, и два из них ты уже знаешь.","ти":0,"пи":1,"подтема":"Глаголы-исключения: sein, haben, werden, wissen, tun"},{"id":"de38ec6030","тема":"Глагол: спряжение","знак":"🔤","вид":"ловушка","раздел":"⚠️ Мелкие исключения: когда буква добавляется или пропадает","урок":"dasha3","урокИмя":"Занятие 3 с Дашей","html":"<span class=\"big\">Случай 1: основа кончается на -t или -d → добавляется лишняя e</span>\n      Возьми <b>arbeiten</b> (работать), основа <b>arbeit-</b>. Попробуй сказать «arbeitst» — язык сломается. Поэтому вставляют <b class=\"hl\">-e-</b> для передышки:<br><br>\n      du arbeit<b>e</b>st &nbsp;·&nbsp; er arbeit<b>e</b>t &nbsp;·&nbsp; ihr arbeit<b>e</b>t<br><br>\n      А у <i>ich arbeite</i>, <i>wir arbeiten</i> ничего лишнего не нужно — там и так удобно.","текст":"Случай 1: основа кончается на -t или -d → добавляется лишняя e Возьми arbeiten (работать), основа arbeit-. Попробуй сказать «arbeitst» — язык сломается. Поэтому вставляют -e- для передышки: du arbeitest &nbsp;·&nbsp; er arbeitet &nbsp;·&nbsp; ihr arbeitet А у ich arbeite, wir arbeiten ничего лишнего не нужно — там и так удобно.","ти":0,"пи":1,"подтема":"Глаголы-исключения: sein, haben, werden, wissen, tun"},{"id":"a554d473fe","тема":"Глагол: спряжение","знак":"🔤","вид":"ловушка","раздел":"⚠️ Мелкие исключения: когда буква добавляется или пропадает","урок":"dasha3","урокИмя":"Занятие 3 с Дашей","html":"<span class=\"big\">Случай 2: основа кончается на -z, -s, -ß → у du пропадает s</span>\n      У <b>tanzen</b> (танцевать) основа <b>tanz-</b>. По правилу у <i>du</i> должно быть <b>-st</b>, получилось бы «tanzst» — два свистящих подряд, неудобно. Поэтому <b class=\"hl\">s выбрасывают</b>, остаётся только <b>-t</b>:<br><br>\n      du tanz<b>t</b> — и это совпадает с формой <i>er tanzt</i>.<br><br>\n      То же самое с <b>heißen</b> (зваться): <i>du heißt</i>. Ты это уже говорил в первом уроке — <i>Wie heißt du?</i>","текст":"Случай 2: основа кончается на -z, -s, -ß → у du пропадает s У tanzen (танцевать) основа tanz-. По правилу у du должно быть -st, получилось бы «tanzst» — два свистящих подряд, неудобно. Поэтому s выбрасывают, остаётся только -t: du tanzt — и это совпадает с формой er tanzt. То же самое с heißen (зваться): du heißt. Ты это уже говорил в первом уроке — Wie heißt du?","ти":0,"пи":1,"подтема":"Глаголы-исключения: sein, haben, werden, wissen, tun"},{"id":"87fdcee1e9","тема":"Глагол: спряжение","знак":"🔤","вид":"ловушка","раздел":"⚠️ Мелкие исключения: когда буква добавляется или пропадает","урок":"dasha3","урокИмя":"Занятие 3 с Дашей","html":"<span class=\"big\">Случай 3: глаголы на -eln → у ich выпадает e</span>\n      Глаголы вроде <b>bügeln</b> (гладить), <b>sammeln</b> (собирать), <b>lächeln</b> (улыбаться), <b>googeln</b> (гуглить). У формы <i>ich</i> буква <b>e</b> перед <b>l</b> <b class=\"hl\">выпадает</b>:<br><br>\n      <i>ich büg<b>l</b>e</i> (не «bügele») &nbsp;·&nbsp; <i>ich samm<b>l</b>e</i><br><br>\n      Всё остальное спрягается обычно.","текст":"Случай 3: глаголы на -eln → у ich выпадает e Глаголы вроде bügeln (гладить), sammeln (собирать), lächeln (улыбаться), googeln (гуглить). У формы ich буква e перед l выпадает: ich bügle (не «bügele») &nbsp;·&nbsp; ich sammle Всё остальное спрягается обычно.","ти":0,"пи":1,"подтема":"Глаголы-исключения: sein, haben, werden, wissen, tun"},{"id":"752be9a315","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"⭐ Пять глаголов-исключений","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"Третья кучка, самая маленькая. Пять глаголов, которые спрягаются «как хотят».\n      Никакого правила тут нет — <b>просто заучиваем</b>, как таблицу умножения.","текст":"Третья кучка, самая маленькая. Пять глаголов, которые спрягаются «как хотят». Никакого правила тут нет — просто заучиваем, как таблицу умножения.","ти":0,"пи":1,"подтема":"Глаголы-исключения: sein, haben, werden, wissen, tun"},{"id":"eaea187d9b","тема":"Глагол: спряжение","знак":"🔤","вид":"ловушка","раздел":"⭐ Пять глаголов-исключений","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"<span class=\"big\">Первые два — самые важные</span>\n      <b>sein</b> (быть) и <b>haben</b> (иметь) встречаются в речи чаще всех остальных глаголов вместе взятых.\n      Их надо знать так, чтобы просыпаться ночью и рассказывать. Домашка как раз про них.","текст":"Первые два — самые важные sein (быть) и haben (иметь) встречаются в речи чаще всех остальных глаголов вместе взятых. Их надо знать так, чтобы просыпаться ночью и рассказывать. Домашка как раз про них.","ти":0,"пи":1,"подтема":"Глаголы-исключения: sein, haben, werden, wissen, tun"},{"id":"ecf3ea2d85","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"⭐⭐ sein и haben: спряжение целиком","урок":"dasha5","урокИмя":"Занятие 5 с Дашей","html":"<b>Что это вообще такое.</b> <b>sein</b> — «быть», <b>haben</b> — «иметь». Это два самых частых\n      глагола во всём языке — они встречаются почти в каждом предложении. Оба — исключения:\n      спрягаются не по общему правилу, форму каждого лица надо просто запомнить.","текст":"Что это вообще такое. sein — «быть», haben — «иметь». Это два самых частых глагола во всём языке — они встречаются почти в каждом предложении. Оба — исключения: спрягаются не по общему правилу, форму каждого лица надо просто запомнить.","ти":0,"пи":1,"подтема":"Глаголы-исключения: sein, haben, werden, wissen, tun"},{"id":"d9d823d941","тема":"Глагол: спряжение","знак":"🔤","вид":"ловушка","раздел":"Тренировка: только sein","урок":"dasha5","урокИмя":"Занятие 5 с Дашей","html":"<span class=\"big\">Рум ≠ комната</span>\n      На занятии проскочила смешная путаница: <b>Rom</b> (Рим, город) и русское слово «рум»\n      звучат похоже, но комната по-немецки — <b>das Zimmer</b>. Rom — это только город.","текст":"Рум ≠ комната На занятии проскочила смешная путаница: Rom (Рим, город) и русское слово «рум» звучат похоже, но комната по-немецки — das Zimmer. Rom — это только город.","ти":0,"пи":1,"подтема":"Глаголы-исключения: sein, haben, werden, wissen, tun"},{"id":"96bc30554b","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"⭐⭐ sein или haben: игра на Wordwall","урок":"dasha6","урокИмя":"Занятие 6 с Дашей","html":"<b>Как выбрать — напоминание.</b> Сначала переводим предложение на русский.<br>\n      • По смыслу «<b>у кого-то есть</b> что-то» → <b>haben</b>: у брата есть работа, у детей есть каникулы.<br>\n      • По смыслу «<b>кто-то какой / где / кто</b>» → <b>sein</b>: это несложно, я уже закончил, он из Англии.<br><br>\n      Потом смотрим, <b>кто</b> в предложении, и берём нужную форму. Вот обе таблицы — их Даша просит знать «от зубов»:","текст":"Как выбрать — напоминание. Сначала переводим предложение на русский. • По смыслу «у кого-то есть что-то» → haben: у брата есть работа, у детей есть каникулы. • По смыслу «кто-то какой / где / кто» → sein: это несложно, я уже закончил, он из Англии. Потом смотрим, кто в предложении, и берём нужную форму. Вот обе таблицы — их Даша просит знать «от зубов»:","ти":0,"пи":1,"подтема":"Глаголы-исключения: sein, haben, werden, wissen, tun"},{"id":"d37004a9de","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"⭐⭐ sein или haben: игра на Wordwall","урок":"dasha6","урокИмя":"Занятие 6 с Дашей","html":"<b>Голод и жажда — через haben.</b> По-русски «я голоден» — это «какой я», хочется сказать sein. Но немцы говорят «<b>я имею голод</b>»: <i>Ich habe Hunger</i>, <i>Hast du Hunger?</i>, <i>Habt ihr Durst?</i> Можно и через прилагательное — <i>Ich bin hungrig</i>, — но через Hunger говорят чаще.<br><br>\n      <b>Вопрос без вопросительного слова</b> — глагол на первое место: <i><b>Ist</b> das richtig?</i>, <i><b>Hast</b> du Hunger?</i> Это было на прошлом занятии, здесь просто закрепили.","текст":"Голод и жажда — через haben. По-русски «я голоден» — это «какой я», хочется сказать sein. Но немцы говорят «я имею голод»: Ich habe Hunger, Hast du Hunger?, Habt ihr Durst? Можно и через прилагательное — Ich bin hungrig, — но через Hunger говорят чаще. Вопрос без вопросительного слова — глагол на первое место: Ist das richtig?, Hast du Hunger? Это было на прошлом занятии, здесь просто закрепили.","ти":0,"пи":1,"подтема":"Глаголы-исключения: sein, haben, werden, wissen, tun"},{"id":"48eed3aed9","тема":"Глагол: спряжение","знак":"🔤","вид":"ловушка","раздел":"⭐⭐ sein или haben: игра на Wordwall","урок":"dasha6","урокИмя":"Занятие 6 с Дашей","html":"<span class=\"big\">Три ошибки с занятия — самые частые</span>\n      1️⃣ <b>Mein Bruder ___</b> — Гриша поставил <s>habe</s>. Даша: «на -e обычно кончается форма для ich». Брат — это «он», значит <b>hat</b>.<br>\n      2️⃣ <b>Ihr ___ fleißig</b> — сначала прозвучало <s>ist</s>, потом <s>bist</s>. У <b>ihr</b> (вы — несколько человек, по-свойски) у sein своя особая форма — <b>seid</b>. Её надо просто запомнить.<br>\n      3️⃣ <b>___ die Kinder Ferien?</b> — прозвучало <s>habt</s>. Но «дети» — это «<b>они</b>», а у «они» (и у вежливого «Вы») форма всегда совпадает со словарной: <b>haben</b>. <i>Habt</i> было бы, если спросить «у вас каникулы?» — <i>Habt ihr Ferien?</i>","текст":"Три ошибки с занятия — самые частые 1️⃣ Mein Bruder ___ — Гриша поставил habe. Даша: «на -e обычно кончается форма для ich». Брат — это «он», значит hat. 2️⃣ Ihr ___ fleißig — сначала прозвучало ist, потом bist. У ihr (вы — несколько человек, по-свойски) у sein своя особая форма — seid. Её надо просто запомнить. 3️⃣ ___ die Kinder Ferien? — прозвучало habt. Но «дети» — это «они», а у «они» (и у вежливого «Вы») форма всегда совпадает со словарной: haben. Habt было бы, если спросить «у вас каникулы?» — Habt ihr Ferien?","ти":0,"пи":1,"подтема":"Глаголы-исключения: sein, haben, werden, wissen, tun"},{"id":"198964fbde","тема":"Глагол: спряжение","знак":"🔤","вид":"ловушка","раздел":"⭐ Повторение: спряжение","урок":"dasha9","урокИмя":"Занятие 9 с Дашей","html":"<span class=\"big\">sie — это «она» или «они»?</span>\n      Смотри на глагол: <i>sie <b>hat</b></i> — она (единственное), <i>sie <b>haben</b></i> — они (множественное). <i>Sie</i> с большой буквы — вежливое «вы», глагол тоже инфинитив.","текст":"sie — это «она» или «они»? Смотри на глагол: sie hat — она (единственное), sie haben — они (множественное). Sie с большой буквы — вежливое «вы», глагол тоже инфинитив.","ти":0,"пи":1,"подтема":"Глаголы-исключения: sein, haben, werden, wissen, tun"},{"id":"dda66583dc","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"werden — становиться","урок":"polya5","урокИмя":"Занятие 5 Полины","html":"<b>werden</b> = «становиться». Обрати внимание на форму <b class=\"hl\">ihr werdet</b> — здесь добавляется лишнее <b>-e-</b>, потому что основа кончается на -d.","текст":"werden = «становиться». Обрати внимание на форму ihr werdet — здесь добавляется лишнее -e-, потому что основа кончается на -d.","ти":0,"пи":1,"подтема":"Глаголы-исключения: sein, haben, werden, wissen, tun"},{"id":"882708fada","тема":"Глагол: спряжение","знак":"🔤","вид":"ловушка","раздел":"⭐ После haben — всегда Akkusativ","урок":"polya6","урокИмя":"Занятие 6 Полины","html":"<span class=\"big\">Правило без исключений, Полина спросила про него сама</span>\n      После <b>haben</b> — <b>всегда Akkusativ</b>. И в <b>95% случаев</b> там будет неопределённый артикль.<br><br>\n      Логика простая: <i>иметь</i> — кого? что? Это и есть вопросы винительного падежа.<br>\n      Мужской род в Akkusativ даёт <b class=\"hl\">einen</b>.","текст":"Правило без исключений, Полина спросила про него сама После haben — всегда Akkusativ. И в 95% случаев там будет неопределённый артикль. Логика простая: иметь — кого? что? Это и есть вопросы винительного падежа. Мужской род в Akkusativ даёт einen.","ти":0,"пи":1,"подтема":"Глаголы-исключения: sein, haben, werden, wissen, tun"},{"id":"44bc6f1a2b","тема":"Глагол: спряжение","знак":"🔤","вид":"ловушка","раздел":"⚠️ Почему в «Kinderbücher haben viele Bilder» нет артикля","урок":"polya7","урокИмя":"Занятие 7 Полины","html":"<span class=\"big\">Две причины сразу</span>\n      1️⃣ <b>Неопределённого артикля во множественном числе просто НЕ СУЩЕСТВУЕТ.</b> <i>ein</i> есть только в единственном числе. Во множественном ставить нечего.<br><br>\n      2️⃣ Определённый артикль <i>die</i> тут тоже не нужен: определённый ставят, когда говорят о <b>конкретных</b> предметах. А здесь мысль общая — «у детских книг вообще есть картинки», не о каких-то определённых картинках.<br><br>\n      Плюс рядом уже стоит слово <b>viele</b> («много») — оно само по себе показывает количество, артикль становится лишним.","текст":"Две причины сразу 1️⃣ Неопределённого артикля во множественном числе просто НЕ СУЩЕСТВУЕТ. ein есть только в единственном числе. Во множественном ставить нечего. 2️⃣ Определённый артикль die тут тоже не нужен: определённый ставят, когда говорят о конкретных предметах. А здесь мысль общая — «у детских книг вообще есть картинки», не о каких-то определённых картинках. Плюс рядом уже стоит слово viele («много») — оно само по себе показывает количество, артикль становится лишним.","ти":0,"пи":1,"подтема":"Глаголы-исключения: sein, haben, werden, wissen, tun"},{"id":"5f3e91e6d3","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"Глагол sein (быть) — выучить наизусть","урок":"urok1","урокИмя":"Урок 2","html":"<b>sein</b> — самый важный глагол. В немецком его нельзя опускать: не «я врач», а «я <b class=\"hl\">есть</b> врач» — <i>Ich bin Arzt</i>. Формы учат наизусть.","текст":"sein — самый важный глагол. В немецком его нельзя опускать: не «я врач», а «я есть врач» — Ich bin Arzt. Формы учат наизусть.","ти":0,"пи":1,"подтема":"Глаголы-исключения: sein, haben, werden, wissen, tun"},{"id":"fc25e06360","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"sein в вопросе и с «не»","урок":"urok1","урокИмя":"Урок 2","html":"<b>Вопрос «да или нет»:</b> глагол встаёт на первое место. <i>Sie sind Arzt</i> → <i><b class=\"hl\">Sind</b> Sie Arzt?</i> Никакого вопросительного слова не нужно — достаточно переставить.<br><br>\n      <b>Отрицание:</b> <b>nicht</b> идёт после глагола. <i>Ich bin <b class=\"hl\">nicht</b> aus Deutschland.</i>","текст":"Вопрос «да или нет»: глагол встаёт на первое место. Sie sind Arzt → Sind Sie Arzt? Никакого вопросительного слова не нужно — достаточно переставить. Отрицание: nicht идёт после глагола. Ich bin nicht aus Deutschland.","ти":0,"пи":1,"подтема":"Глаголы-исключения: sein, haben, werden, wissen, tun"},{"id":"3d34a8e908","тема":"Глагол: спряжение","знак":"🔤","вид":"ловушка","раздел":"haben или sein? — главный вопрос","урок":"urok12","урокИмя":"Урок 13","html":"<span class=\"big\">По умолчанию — haben. Через sein только два случая</span>\n      1️⃣ <b>Движение из точки А в точку Б:</b> gehen, kommen, fahren, fliegen, laufen, stürzen (упасть).<br>\n      2️⃣ <b>Смена состояния:</b> einschlafen (заснуть), aufstehen (встать), werden (стать), anschwellen (отечь), passieren (случиться).<br>\n      Плюс отдельно запомнить: <b>sein</b> и <b>bleiben</b> тоже идут с sein.","текст":"По умолчанию — haben. Через sein только два случая 1️⃣ Движение из точки А в точку Б: gehen, kommen, fahren, fliegen, laufen, stürzen (упасть). 2️⃣ Смена состояния: einschlafen (заснуть), aufstehen (встать), werden (стать), anschwellen (отечь), passieren (случиться). Плюс отдельно запомнить: sein и bleiben тоже идут с sein.","ти":0,"пи":1,"подтема":"Глаголы-исключения: sein, haben, werden, wissen, tun"},{"id":"f31e20fe28","тема":"Глагол: спряжение","знак":"🔤","вид":"ловушка","раздел":"sein и haben — единственные исключения","урок":"urok13","урокИмя":"Урок 14","html":"<span class=\"big\">Выучить наизусть — обе фразы говорят пациенту каждый день</span>\n      <b>sein</b> ведёт себя не как все: <i>Seien Sie…</i> (не «Sein Sie»!), <i>Sei…</i>, <i>Seid…</i><br>\n      <b>haben</b> в форме Sie обычное, а в du теряет -e: <i>Hab keine Angst!</i>","текст":"Выучить наизусть — обе фразы говорят пациенту каждый день sein ведёт себя не как все: Seien Sie… (не «Sein Sie»!), Sei…, Seid… haben в форме Sie обычное, а в du теряет -e: Hab keine Angst!","ти":0,"пи":1,"подтема":"Глаголы-исключения: sein, haben, werden, wissen, tun"},{"id":"2a634f4866","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"Голод, жажда, аппетит","урок":"urok14","урокИмя":"Урок 15","html":"Обрати внимание: по-немецки не «я голоден», а <b class=\"hl\">«я имею голод»</b> — <i>Ich <b>habe</b> Hunger</i>. Тот же глагол <b>haben</b>, что в уроке 4 («у меня болит»). Немцы вообще многие состояния строят через haben.","текст":"Обрати внимание: по-немецки не «я голоден», а «я имею голод» — Ich habe Hunger. Тот же глагол haben, что в уроке 4 («у меня болит»). Немцы вообще многие состояния строят через haben.","ти":0,"пи":1,"подтема":"Глаголы-исключения: sein, haben, werden, wissen, tun"},{"id":"51c0d18ed4","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"haben или sein — то же правило","урок":"urok32","урокИмя":"Урок 33","html":"Выбор между hatte и war — ровно тот же, что вы учили для Perfekt: движение и смена состояния — <b>sein</b>, всё остальное — <b>haben</b>.","текст":"Выбор между hatte и war — ровно тот же, что вы учили для Perfekt: движение и смена состояния — sein, всё остальное — haben.","ти":0,"пи":1,"подтема":"Глаголы-исключения: sein, haben, werden, wissen, tun"},{"id":"f5df99d8cc","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"⭐ Формула: werden + Infinitiv","урок":"urok34","урокИмя":"Урок 35","html":"<b class=\"hl\">werden</b> (в настоящем времени, на втором месте) + <b class=\"hl\">Infinitiv</b> (в самом конце). Всё остальное — между ними. Инфинитив не меняется, меняется только werden.","текст":"werden (в настоящем времени, на втором месте) + Infinitiv (в самом конце). Всё остальное — между ними. Инфинитив не меняется, меняется только werden.","ти":0,"пи":1,"подтема":"Глаголы-исключения: sein, haben, werden, wissen, tun"},{"id":"854896cf17","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"Глагол haben (иметь)","урок":"urok4","урокИмя":"Урок 5","html":"Второй по важности глагол после <i>sein</i>. Почти правильный, но в двух формах выпадает <b>b</b>: <b class=\"hl\">du hast, er hat</b>. С него начинается половина врачебных фраз.","текст":"Второй по важности глагол после sein. Почти правильный, но в двух формах выпадает b: du hast, er hat. С него начинается половина врачебных фраз.","ти":0,"пи":1,"подтема":"Глаголы-исключения: sein, haben, werden, wissen, tun"},{"id":"6ad7b521cf","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"На приёме: фразы с haben","урок":"urok4","урокИмя":"Урок 5","html":"«Болит голова» по-немецки — не глагол «болеть», а «имею головные боли»: <i>Ich habe Kopfschmerzen</i>. Боль почти всегда во множественном числе — <b>Schmerzen</b>.","текст":"«Болит голова» по-немецки — не глагол «болеть», а «имею головные боли»: Ich habe Kopfschmerzen. Боль почти всегда во множественном числе — Schmerzen.","ти":0,"пи":1,"подтема":"Глаголы-исключения: sein, haben, werden, wissen, tun"},{"id":"ac89dcc4ca","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"⭐ О прошлом: er muss gestürzt sein","урок":"urok44","урокИмя":"Урок 45","html":"Догадка о том, что <b>уже случилось</b>: модальный глагол остаётся в <b>настоящем</b> на втором месте, а в конец идут <b>Partizip II + haben/sein</b>. Выбор haben или sein — как в Perfekt: движение и смена состояния — sein.<br>\n      <i>Er ist gestürzt.</i> → <i>Er <b>muss</b> gestürzt <b>sein</b>.</i> — «он, должно быть, упал».<br>\n      Не путать с уроком 33: <i>Ich hätte das machen sollen</i> — «мне следовало» (обычный смысл, сожаление), а здесь — догадка.","текст":"Догадка о том, что уже случилось: модальный глагол остаётся в настоящем на втором месте, а в конец идут Partizip II + haben/sein. Выбор haben или sein — как в Perfekt: движение и смена состояния — sein. Er ist gestürzt. → Er muss gestürzt sein. — «он, должно быть, упал». Не путать с уроком 33: Ich hätte das machen sollen — «мне следовало» (обычный смысл, сожаление), а здесь — догадка.","ти":0,"пи":1,"подтема":"Глаголы-исключения: sein, haben, werden, wissen, tun"},{"id":"0a770f87d3","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"Завершить разговор","урок":"urok53","урокИмя":"Урок 54","html":"Коротко повторить, о чём договорились (<b>Wir haben vereinbart, dass …</b>), спросить о забытых вопросах, предложить прийти в следующий раз с близкими.","текст":"Коротко повторить, о чём договорились (Wir haben vereinbart, dass …), спросить о забытых вопросах, предложить прийти в следующий раз с близкими.","ти":0,"пи":1,"подтема":"Глаголы-исключения: sein, haben, werden, wissen, tun"},{"id":"72d402dc2d","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"⭐ Критика: сказать и принять","урок":"urok59","урокИмя":"Урок 60","html":"<b>Сказать</b> — о деле, а не о человеке: <i>Mir ist aufgefallen, dass …</i> (я заметил), просьба на будущее — <i>Beim nächsten Mal …</i><br>\n      <b>Принять</b> — поблагодарить, признать, предложить решение: <i>Danke für den Hinweis. Da haben Sie recht … Ich kümmere mich darum.</i> Если решение было обоснованным — спокойно объяснить: <i>Darf ich kurz erklären, warum …?</i>","текст":"Сказать — о деле, а не о человеке: Mir ist aufgefallen, dass … (я заметил), просьба на будущее — Beim nächsten Mal … Принять — поблагодарить, признать, предложить решение: Danke für den Hinweis. Da haben Sie recht … Ich kümmere mich darum. Если решение было обоснованным — спокойно объяснить: Darf ich kurz erklären, warum …?","ти":0,"пи":1,"подтема":"Глаголы-исключения: sein, haben, werden, wissen, tun"},{"id":"5396aaf5a1","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"haben (иметь)","урок":"urok8","урокИмя":"Урок 9","html":"<b>haben</b> почти правильный — «ломаются» только две формы: <b class=\"hl\">du hast</b> и <b class=\"hl\">er hat</b> (выпадает <i>b</i>). Остальные как обычно. Для врача глагол №1: все жалобы пациента идут через «у меня есть…».","текст":"haben почти правильный — «ломаются» только две формы: du hast и er hat (выпадает b). Остальные как обычно. Для врача глагол №1: все жалобы пациента идут через «у меня есть…».","ти":0,"пи":1,"подтема":"Глаголы-исключения: sein, haben, werden, wissen, tun"},{"id":"6ebd84de2f","тема":"Артикли и род","знак":"🎨","вид":"ловушка","раздел":"⚠️ Немец — исключение","урок":"polya8","урокИмя":"Занятие 8 Полины","html":"<span class=\"big\">Здесь правило не работает</span>\n      Полина сама заметила: «А почему немка не Deutschin, а Deutsche?»<br><br>\n      Ответ Даши: это исключение, других объяснений нет. У немцев мужская и женская форма\n      выглядят одинаково, меняется только артикль:<br><br>\n      <b>der Deutsche</b> — немец &nbsp;·&nbsp; <b>die Deutsche</b> — немка","текст":"Здесь правило не работает Полина сама заметила: «А почему немка не Deutschin, а Deutsche?» Ответ Даши: это исключение, других объяснений нет. У немцев мужская и женская форма выглядят одинаково, меняется только артикль: der Deutsche — немец &nbsp;·&nbsp; die Deutsche — немка","ти":0,"пи":1,"подтема":"Глаголы-исключения: sein, haben, werden, wissen, tun"},{"id":"d8a7e0c7a5","тема":"Местоимения","знак":"🧩","вид":"правило","раздел":"werden по лицам","урок":"urok34","урокИмя":"Урок 35","html":"<b>ich</b> werde · <b>du</b> wirst · <b>er/sie/es</b> wird · <b>wir</b> werden · <b>ihr</b> werdet · <b>sie/Sie</b> werden<br>\n      Неправильные только <b>du wirst</b> и <b>er wird</b> — гласная меняется с e на i.","текст":"ich werde · du wirst · er/sie/es wird · wir werden · ihr werdet · sie/Sie werden Неправильные только du wirst и er wird — гласная меняется с e на i.","ти":0,"пи":1,"подтема":"Глаголы-исключения: sein, haben, werden, wissen, tun"},{"id":"e728073de9","тема":"Произношение и письмо","знак":"🗣","вид":"правило","раздел":"⚠️ Мелкие исключения: когда буква добавляется или пропадает","урок":"dasha3","урокИмя":"Занятие 3 с Дашей","html":"Это не отдельная категория, а маленькие поправки внутри <b>правильных</b> глаголов. Они правильные, но с крошечными орфографическими причудами — исключительно ради удобства произношения.","текст":"Это не отдельная категория, а маленькие поправки внутри правильных глаголов. Они правильные, но с крошечными орфографическими причудами — исключительно ради удобства произношения.","ти":0,"пи":1,"подтема":"Глаголы-исключения: sein, haben, werden, wissen, tun"},{"id":"3588565814","тема":"Слова, которые путают","знак":"⚠️","вид":"ловушка","раздел":"⭐ Три исключения: gut, gern, viel","урок":"polya14","урокИмя":"Занятие 14 Полины","html":"<span class=\"big\">lieber — это не «лучше», как besser</span>\n      <b>gern</b> — «с удовольствием, люблю»: <i>Ich spiele gern Tennis</i>. <b>lieber</b> — «предпочитаю, охотнее»: то, к чему мне <b>больше лежит душа</b>. Даша: если тебе предлагают поехать в Германию, а ты отвечаешь «нет, я лучше поеду в Испанию», — это <b>lieber</b>, а не besser. <b>besser</b> — просто «качеством лучше». <b>am liebsten</b> — «больше всего люблю».<br><br>\n      Полина спросила: а если перепутать? Даша: на экзамене это будет <b>лексическая</b> ошибка, не грамматическая, и <b>не во всех случаях</b> — часто одно можно заменить другим. Тонкую грань поймаешь по тому, как часто встречаешь оба слова в текстах. Отдельно про lieber и besser Даша обещала поговорить позже.","текст":"lieber — это не «лучше», как besser gern — «с удовольствием, люблю»: Ich spiele gern Tennis. lieber — «предпочитаю, охотнее»: то, к чему мне больше лежит душа. Даша: если тебе предлагают поехать в Германию, а ты отвечаешь «нет, я лучше поеду в Испанию», — это lieber, а не besser. besser — просто «качеством лучше». am liebsten — «больше всего люблю». Полина спросила: а если перепутать? Даша: на экзамене это будет лексическая ошибка, не грамматическая, и не во всех случаях — часто одно можно заменить другим. Тонкую грань поймаешь по тому, как часто встречаешь оба слова в текстах. Отдельно про lieber и besser Даша обещала поговорить позже.","ти":0,"пи":1,"подтема":"Глаголы-исключения: sein, haben, werden, wissen, tun"},{"id":"f130b269da","тема":"Устойчивые выражения","знак":"🔗","вид":"ловушка","раздел":"⚠️ Пять исключений — учить наизусть","урок":"urok22","урокИмя":"Урок 23","html":"<span class=\"big\">gut — besser, viel — mehr, gern — lieber</span>\n      Как в русском «хороший — лучше», «много — больше»: форма меняется целиком. Эти пять слов ты будешь говорить чаще всех остальных вместе взятых.","текст":"gut — besser, viel — mehr, gern — lieber Как в русском «хороший — лучше», «много — больше»: форма меняется целиком. Эти пять слов ты будешь говорить чаще всех остальных вместе взятых.","ти":0,"пи":1,"подтема":"Глаголы-исключения: sein, haben, werden, wissen, tun"},{"id":"4a6e9a87f3","тема":"Разное","знак":"📎","вид":"правило","раздел":"⭐ Три исключения: gut, gern, viel","урок":"polya14","урокИмя":"Занятие 14 Полины","html":"Три слова образуют формы <b>по-своему</b>, их просто учат наизусть — «они чаще всего используются», сказала Даша.","текст":"Три слова образуют формы по-своему, их просто учат наизусть — «они чаще всего используются», сказала Даша.","ти":0,"пи":1,"подтема":"Глаголы-исключения: sein, haben, werden, wissen, tun"},{"id":"968f6f8de9","тема":"Прошедшее время","знак":"⏮","вид":"правило","раздел":"Сильные глаголы: меняют корень","урок":"urok29","урокИмя":"Урок 30","html":"У сильных глаголов в Präteritum меняется гласная в корне (как в Partizip II, только по-другому) — и своя, отдельная гласная у <b>каждого</b> глагола, увы, без единого правила. Окончания тоже свои: у <b>ich</b> и <b>er/sie/es</b> — вообще без окончания.<br><br>\n      Десять самых ходовых в вашей работе:","текст":"У сильных глаголов в Präteritum меняется гласная в корне (как в Partizip II, только по-другому) — и своя, отдельная гласная у каждого глагола, увы, без единого правила. Окончания тоже свои: у ich и er/sie/es — вообще без окончания. Десять самых ходовых в вашей работе:","ти":0,"пи":2,"подтема":"Меняют гласную"},{"id":"51f223b680","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"⭐ Категория 2: глаголы, которые меняют гласную","урок":"dasha3","урокИмя":"Занятие 3 с Дашей","html":"Эти глаголы делают <b>две вещи сразу</b>:<br>\n      1️⃣ добавляют обычные окончания, как все нормальные глаголы;<br>\n      2️⃣ <b class=\"hl\">плюс меняют гласную внутри слова</b> — и только у <b>du</b> и <b>er/sie/es</b>, как мы договорились в разделе 4.<br><br>\n      <b>Как понять, что глагол из этой группы?</b> Никак. Честно. Даша прямо сказала: <i>«У нас нет никаких указателей на то, что глагол будет относиться к этой категории. Просто мы их заучиваем»</i>. Списка не избежать — но он небольшой, около сорока штук, и Даша пришлёт карточки.","текст":"Эти глаголы делают две вещи сразу: 1️⃣ добавляют обычные окончания, как все нормальные глаголы; 2️⃣ плюс меняют гласную внутри слова — и только у du и er/sie/es, как мы договорились в разделе 4. Как понять, что глагол из этой группы? Никак. Честно. Даша прямо сказала: «У нас нет никаких указателей на то, что глагол будет относиться к этой категории. Просто мы их заучиваем». Списка не избежать — но он небольшой, около сорока штук, и Даша пришлёт карточки.","ти":0,"пи":2,"подтема":"Меняют гласную"},{"id":"644a96878b","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"⭐ Категория 2: глаголы, которые меняют гласную","урок":"dasha3","урокИмя":"Занятие 3 с Дашей","html":"<b>Важно не потерять окончание.</b> Григорий на занятии сказал <i>«du спрехт»</i> — забыл про <b>-st</b>. Даша поправила: меняем гласную <b>И</b> добавляем окончание. Оба действия, не одно вместо другого. Правильно — <b>du sprichst</b>.","текст":"Важно не потерять окончание. Григорий на занятии сказал «du спрехт» — забыл про -st. Даша поправила: меняем гласную И добавляем окончание. Оба действия, не одно вместо другого. Правильно — du sprichst.","ти":0,"пи":2,"подтема":"Меняют гласную"},{"id":"1365fb26d1","тема":"Глагол: спряжение","знак":"🔤","вид":"ловушка","раздел":"⭐ Категория 2: глаголы, которые меняют гласную","урок":"dasha3","урокИмя":"Занятие 3 с Дашей","html":"<span class=\"big\">Зато когда ты уже знаешь, что глагол из этой группы — работают два чётких правила</span>\n      1️⃣ Если в инфинитиве <b class=\"hl\">e</b> → меняется на <b>i</b> или на <b>ie</b><br>\n      2️⃣ Если в инфинитиве <b class=\"hl\">a</b> → меняется на <b>ä</b> (a с точками)","текст":"Зато когда ты уже знаешь, что глагол из этой группы — работают два чётких правила 1️⃣ Если в инфинитиве e → меняется на i или на ie 2️⃣ Если в инфинитиве a → меняется на ä (a с точками)","ти":0,"пи":2,"подтема":"Меняют гласную"},{"id":"376d5490bc","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"⭐ Глаголы, меняющие гласную","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"Вторая кучка. Окончания те же самые, что у правильных — но внутри слова меняется буква.<br><br>\n      <b>Всего два правила:</b><br>\n      1️⃣ Если в глаголе <span class=\"hl\">e</span> → она станет <span class=\"hl\">i</span> или <span class=\"hl\">ie</span><br>\n      2️⃣ Если в глаголе <span class=\"hl\">a</span> → она станет <span class=\"hl\">ä</span><br><br>\n      Григорий на занятии так и сформулировал: «чисто два правила — если e, меняем на i, если a, меняем на ä». Даша подтвердила.","текст":"Вторая кучка. Окончания те же самые, что у правильных — но внутри слова меняется буква. Всего два правила: 1️⃣ Если в глаголе e → она станет i или ie 2️⃣ Если в глаголе a → она станет ä Григорий на занятии так и сформулировал: «чисто два правила — если e, меняем на i, если a, меняем на ä». Даша подтвердила.","ти":0,"пи":2,"подтема":"Меняют гласную"},{"id":"76d0534bbd","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"Глаголы с изменяемой гласной — короткий повтор","урок":"dasha7","урокИмя":"Занятие 7 с Дашей","html":"С этой темой Гриша признался честно: «я вообще не понял, когда мне менять». Даша подтвердила: <b>тут нет правила, откуда меняется гласная — только запоминать</b>. Меняется она только у <b>du</b> и <b>er / sie / es</b>, и только у некоторых глаголов:<br><br>\n      <b>e → i</b>: sprechen → du spr<b>i</b>chst<br>\n      <b>e → ie</b>: lesen → du l<b>ie</b>st<br>\n      <b>a → ä</b>: fahren → du f<b>ä</b>hrst<br>\n      <b>au → äu</b>: laufen → du l<b>äu</b>fst","текст":"С этой темой Гриша признался честно: «я вообще не понял, когда мне менять». Даша подтвердила: тут нет правила, откуда меняется гласная — только запоминать. Меняется она только у du и er / sie / es, и только у некоторых глаголов: e → i: sprechen → du sprichst e → ie: lesen → du liest a → ä: fahren → du fährst au → äu: laufen → du läufst","ти":0,"пи":2,"подтема":"Меняют гласную"},{"id":"c604880536","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"Спряжение: a → ä","урок":"urok28","урокИмя":"Урок 29","html":"lassen — сильный глагол, гласная меняется у <b>du</b> и <b>er/sie/es</b>: <b>a → ä</b>. Тот же тип, что вы уже знаете по fahren, schlafen, tragen.","текст":"lassen — сильный глагол, гласная меняется у du и er/sie/es: a → ä. Тот же тип, что вы уже знаете по fahren, schlafen, tragen.","ти":0,"пи":2,"подтема":"Меняют гласную"},{"id":"5cb0dbced1","тема":"Местоимения","знак":"🧩","вид":"ловушка","раздел":"⭐ Глаголы, меняющие гласную","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"<span class=\"big\">Меняется только у двоих!</span>\n      Буква прыгает <b>только</b> в формах <b>du</b> и <b>er / sie / es</b>.<br>\n      У <b>ich</b>, <b>wir</b>, <b>ihr</b>, <b>sie/Sie</b> — никаких изменений, всё как у обычных глаголов.","текст":"Меняется только у двоих! Буква прыгает только в формах du и er / sie / es. У ich, wir, ihr, sie/Sie — никаких изменений, всё как у обычных глаголов.","ти":0,"пи":2,"подтема":"Меняют гласную"},{"id":"38473b7519","тема":"Разное","знак":"📎","вид":"правило","раздел":"⭐ Глаголы, меняющие гласную","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"<b>Что делать.</b> Правила простые, а вот <b>какие именно глаголы</b> так себя ведут — надо просто знать.\n      Это и есть те самые ~50 карточек, которые Даша обещала прислать. Правило бесплатное, список — учить.","текст":"Что делать. Правила простые, а вот какие именно глаголы так себя ведут — надо просто знать. Это и есть те самые ~50 карточек, которые Даша обещала прислать. Правило бесплатное, список — учить.","ти":0,"пи":2,"подтема":"Меняют гласную"},{"id":"58f06dab61","тема":"Разное","знак":"📎","вид":"ловушка","раздел":"Сильные глаголы: ge + … + en","урок":"urok12","урокИмя":"Урок 13","html":"<span class=\"big\">Эти учат наизусть — как в английском go/went/gone</span>\n      Оканчиваются на <b>-en</b>, и часто меняется гласная в корне (<i>trinken → getr<b>u</b>nken</i>, <i>sprechen → gespr<b>o</b>chen</i>). Логики нет, но список частых — небольшой. Начни с этих двенадцати.","текст":"Эти учат наизусть — как в английском go/went/gone Оканчиваются на -en, и часто меняется гласная в корне (trinken → getrunken, sprechen → gesprochen). Логики нет, но список частых — небольшой. Начни с этих двенадцати.","ти":0,"пи":2,"подтема":"Меняют гласную"},{"id":"0780c98457","тема":"Разное","знак":"📎","вид":"ловушка","раздел":"Форма на du — для дома","урок":"urok13","урокИмя":"Урок 14","html":"<span class=\"big\">Главное правило этого раздела: с умляутом расстаёмся, с i остаёмся</span>\n      У глаголов-хамелеонов (урок 8) в форме du меняется гласная. В приказе судьба у изменений разная:<br><br>\n      1️⃣ <b>e → i остаётся:</b> du spr<b>i</b>chst → Spr<b>i</b>ch! · du n<b>i</b>mmst → N<b>i</b>mm!<br>\n      2️⃣ <b>a → ä ИСЧЕЗАЕТ:</b> du f<b>ä</b>hrst → F<b>a</b>hr! (не «Fähr»!) · du schl<b>ä</b>fst → Schl<b>a</b>f!","текст":"Главное правило этого раздела: с умляутом расстаёмся, с i остаёмся У глаголов-хамелеонов (урок 8) в форме du меняется гласная. В приказе судьба у изменений разная: 1️⃣ e → i остаётся: du sprichst → Sprich! · du nimmst → Nimm! 2️⃣ a → ä ИСЧЕЗАЕТ: du fährst → Fahr! (не «Fähr»!) · du schläfst → Schlaf!","ти":0,"пи":2,"подтема":"Меняют гласную"},{"id":"2ee55b5ab7","тема":"Разное","знак":"📎","вид":"правило","раздел":"⭐ Привести аргументы","урок":"urok59","урокИмя":"Урок 60","html":"Аргумент «за» — <i>Dafür spricht, dass …</i>, «против» — <i>Dagegen spricht, dass …</i> (буквально «за это говорит»). Порядок — <i>erstens, zweitens, außerdem</i>, вывод — <i>deshalb / daher</i> (глагол сразу после них!). Опора на авторитет — <i>laut Leitlinie, Studien zeigen</i>.","текст":"Аргумент «за» — Dafür spricht, dass …, «против» — Dagegen spricht, dass … (буквально «за это говорит»). Порядок — erstens, zweitens, außerdem, вывод — deshalb / daher (глагол сразу после них!). Опора на авторитет — laut Leitlinie, Studien zeigen.","ти":0,"пи":2,"подтема":"Меняют гласную"},{"id":"99ccc373f1","тема":"Разное","знак":"📎","вид":"правило","раздел":"Глаголы-хамелеоны: меняется корень","урок":"urok8","урокИмя":"Урок 9","html":"Три типа замены: <b class=\"hl\">e → i</b> (sprechen → du sprichst), <b class=\"hl\">e → ie</b> (sehen → du siehst), <b class=\"hl\">a → ä</b> (fahren → du fährst). У <i>laufen</i> — <b class=\"hl\">au → äu</b>: du läufst.","текст":"Три типа замены: e → i (sprechen → du sprichst), e → ie (sehen → du siehst), a → ä (fahren → du fährst). У laufen — au → äu: du läufst.","ти":0,"пи":2,"подтема":"Меняют гласную"},{"id":"67bf5b2e79","тема":"Приставки","знак":"🔗","вид":"правило","раздел":"⚠️ Приставка убегает в конец","урок":"polya8","урокИмя":"Занятие 8 Полины","html":"У некоторых глаголов есть <b>отделяемая приставка</b>. В предложении она отрывается от глагола\n      и уезжает в самый конец.<br><br>\n      <b>aufräumen</b> → Sie räumt <span class=\"hl\">auf</span>.<br>\n      <b>anrufen</b> → Sie ruft viel <span class=\"hl\">an</span>.<br><br>\n      <b>Но есть спасение:</b> если рядом стоит модальный глагол (können, müssen, wollen),\n      то приставка никуда не убегает и глагол остаётся целым.","текст":"У некоторых глаголов есть отделяемая приставка. В предложении она отрывается от глагола и уезжает в самый конец. aufräumen → Sie räumt auf. anrufen → Sie ruft viel an. Но есть спасение: если рядом стоит модальный глагол (können, müssen, wollen), то приставка никуда не убегает и глагол остаётся целым.","ти":0,"пи":3,"подтема":"Буква добавляется или пропадает"},{"id":"a441fdb1ef","тема":"Приставки","знак":"🔗","вид":"правило","раздел":"⚠️ Приставка убегает в конец","урок":"polya8","урокИмя":"Занятие 8 Полины","html":"<b>Хитрость от Даши:</b> у
