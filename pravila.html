span>\n      В Германии и Австрии <i>Wasser</i> по умолчанию <b>с газом</b>. Если нужна обычная — говори <b>ohne Kohlensäure</b> [онэ колензойрэ] или коротко <b>ein stilles Wasser</b>. Пригодится и на работе: пациенту после наркоза газировку не предложишь.","текст":"Попросишь «воду» — принесут газированную В Германии и Австрии Wasser по умолчанию с газом. Если нужна обычная — говори ohne Kohlensäure [онэ колензойрэ] или коротко ein stilles Wasser. Пригодится и на работе: пациенту после наркоза газировку не предложишь."},{"id":"a4f1d19416","тема":"Разное","знак":"📎","вид":"правило","раздел":"Комнаты","урок":"urok15","урокИмя":"Урок 15","html":"Здесь работает конструктор: <b class=\"hl\">Zimmer</b> = комната, и почти все названия — это «что-делать-комната». <i>wohnen</i> (жить) + Zimmer = <b>Wohnzimmer</b> (гостиная), <i>schlafen</i> (спать) + Zimmer = <b>Schlafzimmer</b> (спальня), <i>Arbeit</i> (работа) → <b>Arbeitszimmer</b> (кабинет). Все они <b class=\"hl\">das</b>, потому что род даёт последнее слово — <i>das Zimmer</i>.","текст":"Здесь работает конструктор: Zimmer = комната, и почти все названия — это «что-делать-комната». wohnen (жить) + Zimmer = Wohnzimmer (гостиная), schlafen (спать) + Zimmer = Schlafzimmer (спальня), Arbeit (работа) → Arbeitszimmer (кабинет). Все они das, потому что род даёт последнее слово — das Zimmer."},{"id":"acbff1ff94","тема":"Разное","знак":"📎","вид":"правило","раздел":"⚠️ Главное: у погоды всегда есть подлежащее «es»","урок":"urok16","урокИмя":"Урок 16","html":"Спросить погоду — двумя способами: <b>Wie ist das Wetter?</b> (какая сейчас) и <b>Wie wird das Wetter?</b> (какая будет). Разницу между <i>ist</i> и <i>wird</i> разберём в разделе 7.","текст":"Спросить погоду — двумя способами: Wie ist das Wetter? (какая сейчас) и Wie wird das Wetter? (какая будет). Разницу между ist и wird разберём в разделе 7."},{"id":"b5a90bf7ed","тема":"Разное","знак":"📎","вид":"ловушка","раздел":"⚠️ Главное: у погоды всегда есть подлежащее «es»","урок":"urok16","урокИмя":"Урок 16","html":"<span class=\"big\">По-русски «холодно» — одно слово. По-немецки так нельзя</span>\n      В немецком предложении <b>обязано быть подлежащее</b>, даже когда действующего лица нет. Эту пустую роль занимает <b class=\"hl\">es</b> (буквально «оно»):<br><br>\n      Холодно → <b>Es ist kalt.</b> &nbsp;·&nbsp; Идёт дождь → <b>Es regnet.</b> &nbsp;·&nbsp; Идёт снег → <b>Es schneit.</b><br><br>\n      Сказать просто «Ist kalt» — грубая ошибка, сразу выдаёт иностранца. Запомни как формулу: <b>погода = es + глагол</b>.","текст":"По-русски «холодно» — одно слово. По-немецки так нельзя В немецком предложении обязано быть подлежащее, даже когда действующего лица нет. Эту пустую роль занимает es (буквально «оно»): Холодно → Es ist kalt. &nbsp;·&nbsp; Идёт дождь → Es regnet. &nbsp;·&nbsp; Идёт снег → Es schneit. Сказать просто «Ist kalt» — грубая ошибка, сразу выдаёт иностранца. Запомни как формулу: погода = es + глагол."},{"id":"0252b488fe","тема":"Разное","знак":"📎","вид":"правило","раздел":"Три погодных глагола","урок":"urok16","урокИмя":"Урок 16","html":"Особенность: они <b class=\"hl\">спрягаются только в одном лице</b> — с <i>es</i>. Никаких «я дождю» не бывает, поэтому учить надо ровно одну форму каждого. Самые лёгкие глаголы за весь курс.","текст":"Особенность: они спрягаются только в одном лице — с es. Никаких «я дождю» не бывает, поэтому учить надо ровно одну форму каждого. Самые лёгкие глаголы за весь курс."},{"id":"db56d38d8a","тема":"Разное","знак":"📎","вид":"правило","раздел":"der / die / das — три рода существительных","урок":"urok2","урокИмя":"Урок 2","html":"В немецком у каждого существительного свой род — <b>der</b> (муж.), <b>die</b> (жен.), <b>das</b> (сред.). Род нужно запоминать <b>вместе со словом</b>, не отдельно. Взял слова из твоей же профессии.","текст":"В немецком у каждого существительного свой род — der (муж.), die (жен.), das (сред.). Род нужно запоминать вместе со словом, не отдельно. Взял слова из твоей же профессии."},{"id":"a78a4b281f","тема":"Разное","знак":"📎","вид":"правило","раздел":"Оттенки: hell- (светлый) и dunkel- (тёмный)","урок":"urok7","урокИмя":"Урок 7","html":"Приставь <b class=\"hl\">hell-</b> = светлый, <b class=\"hl\">dunkel-</b> = тёмный прямо к цвету, одним словом: <i>hellblau</i> (светло-синий), <i>dunkelgrün</i> (тёмно-зелёный).","текст":"Приставь hell- = светлый, dunkel- = тёмный прямо к цвету, одним словом: hellblau (светло-синий), dunkelgrün (тёмно-зелёный)."},{"id":"a460e4f1c3","тема":"Разное","знак":"📎","вид":"правило","раздел":"«Какого цвета?» — Welche Farbe?","урок":"urok7","урокИмя":"Урок 7","html":"Вопрос: <b class=\"hl\">Welche Farbe ist das?</b> (какого это цвета?) или <b>Welche Farbe hat …?</b> (какого цвета …?). Ответ: <i>Das ist rot</i> · <i>Der Apfel ist grün</i>. Цвет-слово не меняется, если стоит после ist.","текст":"Вопрос: Welche Farbe ist das? (какого это цвета?) или Welche Farbe hat …? (какого цвета …?). Ответ: Das ist rot · Der Apfel ist grün. Цвет-слово не меняется, если стоит после ist."},{"id":"6668e88ab6","тема":"Разное","знак":"📎","вид":"правило","раздел":"Сначала эталон: правильный глагол","урок":"urok8","урокИмя":"Урок 8","html":"<b>kommen</b> (приходить) — <b>правильный</b> глагол, как в Уроке 3. Корень <i>komm-</i> не меняется, меняются только окончания: <b class=\"hl\">-e, -st, -t, -en, -t, -en</b>. Запомни его как образец — от него будем отталкиваться.","текст":"kommen (приходить) — правильный глагол, как в Уроке 3. Корень komm- не меняется, меняются только окончания: -e, -st, -t, -en, -t, -en. Запомни его как образец — от него будем отталкиваться."},{"id":"6e51e8d033","тема":"Разное","знак":"📎","вид":"правило","раздел":"Глаголы-хамелеоны: меняется корень","урок":"urok8","урокИмя":"Урок 8","html":"Три типа замены: <b class=\"hl\">e → i</b> (sprechen → du sprichst), <b class=\"hl\">e → ie</b> (sehen → du siehst), <b class=\"hl\">a → ä</b> (fahren → du fährst).","текст":"Три типа замены: e → i (sprechen → du sprichst), e → ie (sehen → du siehst), a → ä (fahren → du fährst)."},{"id":"832b431dcd","тема":"Разное","знак":"📎","вид":"ловушка","раздел":"Глаголы-хамелеоны: меняется корень","урок":"urok8","урокИмя":"Урок 8","html":"Главное правило урока: у этих глаголов корень меняется <b>ТОЛЬКО в двух формах</b> — <b>du</b> и <b>er/sie/es</b>. Все остальные (ich, wir, ihr, sie) — как у правильного глагола, без сюрпризов.","текст":"Главное правило урока: у этих глаголов корень меняется ТОЛЬКО в двух формах — du и er/sie/es. Все остальные (ich, wir, ihr, sie) — как у правильного глагола, без сюрпризов."},{"id":"49a784bdbf","тема":"Разное","знак":"📎","вид":"правило","раздел":"Главная фраза приёма: «где болит?»","урок":"urok9","урокИмя":"Урок 9","html":"Два способа сказать про боль:<br>\n      1. Глагол <b class=\"hl\">wehtun</b> (болеть): <i>Der Kopf <b>tut weh</b></i> — голова болит. Вопрос: <i>Wo tut es weh?</i><br>\n      2. <b class=\"hl\">…schmerzen</b> — приклей часть тела спереди: Kopf<b>schmerzen</b> (головная боль), Rücken<b>schmerzen</b> (боль в спине), Bauch<b>schmerzen</b> (в животе).","текст":"Два способа сказать про боль: 1. Глагол wehtun (болеть): Der Kopf tut weh — голова болит. Вопрос: Wo tut es weh? 2. …schmerzen — приклей часть тела спереди: Kopfschmerzen (головная боль), Rückenschmerzen (боль в спине), Bauchschmerzen (в животе)."}];
const $ = id => document.getElementById(id);
let темаВыбрана = null, запрос = '';

document.getElementById('прВсего').textContent = ПРАВИЛА.length;

// темы в порядке появления
const темы = [];
ПРАВИЛА.forEach(п => { if (!темы.some(т => т.имя === п.тема)) темы.push({имя:п.тема, знак:п.знак}); });

$('прТемы').innerHTML =
  '<button data-т="" class="выбрана">Все</button>' +
  темы.map(т => `<button data-т="${т.имя}">${т.знак} ${т.имя}</button>`).join('') +
  '<button data-т="!ловушки">⚠️ только ловушки</button>';

$('прТемы').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  темаВыбрана = b.dataset.т || null;
  [...$('прТемы').children].forEach(x => x.classList.toggle('выбрана', x === b));
  нарисовать();
};

$('прВвод').oninput = () => { запрос = $('прВвод').value.trim().toLowerCase(); нарисовать(); };

function подходит(п){
  if (темаВыбрана === '!ловушки'){ if (п.вид !== 'ловушка') return false; }
  else if (темаВыбрана && п.тема !== темаВыбрана) return false;
  if (!запрос) return true;
  return (п.текст + ' ' + п.раздел + ' ' + п.урокИмя).toLowerCase().includes(запрос);
}

function нарисовать(){
  const видимые = ПРАВИЛА.filter(подходит);
  $('прСчёт').textContent = видимые.length
    ? `Показано правил: ${видимые.length}` : '';

  if (!видимые.length){
    $('прСписок').innerHTML = '<div class="пр-пусто">Ничего не нашлось.<br>Попробуйте другое слово.</div>';
    return;
  }

  const по = {};
  видимые.forEach(п => { (по[п.тема] = по[п.тема] || []).push(п); });

  $('прСписок').innerHTML = Object.entries(по).map(([тема, список]) => {
    const знак = список[0].знак;
    return `<div class="пр-тема"><h2>${знак} ${тема}</h2>
      <div class="сколько">${список.length} ${скл(список.length,'правило','правила','правил')}</div>` +
      список.map(п => `
        <div class="пр-карта ${п.вид === 'ловушка' ? 'ловушка' : ''}">
          <div class="откуда">
            <span class="бирка ${п.вид === 'ловушка' ? 'лов' : ''}">${п.вид === 'ловушка' ? '⚠️ ловушка' : 'правило'}</span>
            <span>${п.раздел || ''}</span>
            <a href="${ссылка(п.урок)}">${п.урокИмя} →</a>
          </div>
          <div class="тело">${п.html}</div>
        </div>`).join('') + '</div>';
  }).join('');
}

function ссылка(урок){
  const папка = урок.startsWith('urok') ? 'lessons' : 'dasha';
  return `${папка}/${урок}_interactive.html`;
}
function скл(n, од, дв, мн){
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return мн;
  if (b > 1 && b < 5) return дв;
  if (b === 1) return од;
  return мн;
}

/* ═══════════ повторение правил по расписанию ═══════════
   Вторая половина части 5: мало собрать правила в одном месте — их надо
   освежать, иначе прочитал один раз и забыл. Расписание считает тот же
   ФСРС, что и в ЗУБРе, поэтому правило всплывает ровно тогда, когда
   вот-вот забудется. Состояние правила лежит отдельно от слов. */
const ПРОФИЛЬ = localStorage.getItem('nemeckiy_profile') || 'grigoriy';
const КЛЮЧ = ид => `nemeckiy_pf_${ПРОФИЛЬ}_${ид}`;

function сост(ид){
  try{ return JSON.parse(localStorage.getItem(КЛЮЧ(ид)) || 'null'); }catch(e){ return null; }
}
function сохранить(ид, с){
  try{ localStorage.setItem(КЛЮЧ(ид), JSON.stringify(с)); }catch(e){}
}
function пораПравилу(п){ return ФСРС.пора(сост(п.id)); }

function сводкаПравил(){
  let пора = 0, знакомых = 0, усвоено = 0;
  ПРАВИЛА.forEach(п => {
    const с = сост(п.id);
    if (с) { знакомых++; if (ФСРС.выучено(с)) усвоено++; }
    if (ФСРС.пора(с)) пора++;
  });
  return {пора, знакомых, усвоено, всего: ПРАВИЛА.length};
}

function нарисоватьРежим(){
  const с = сводкаПравил();
  $('прРежим').innerHTML =
    `<button id="прСтарт">🔁 Повторять правила<small>${
      с.пора ? `на сегодня: ${с.пора}` : 'на сегодня всё пройдено'}</small></button>` +
    (с.знакомых ? `<button class="тихая" id="прСброс">Прогресс<small>${
      с.усвоено} усвоено из ${с.знакомых}</small></button>` : '');
  $('прСтарт').onclick = начатьПовтор;
  const сброс = $('прСброс');
  if (сброс) сброс.onclick = () => {
    alert(`Правил всего: ${с.всего}
Начато: ${с.знакомых}
Усвоено (держится больше 3 недель): ${с.усвоено}
Ждут повторения сегодня: ${с.пора}`);
  };
}

let очередь = [], текущее = null, показано = 0;

function начатьПовтор(){
  // сначала те, у кого пришёл срок; если таких нет — берём новые
  const пора = ПРАВИЛА.filter(пораПравилу);
  очередь = пора.length ? пора.slice(0, 20)
                        : ПРАВИЛА.filter(п => !сост(п.id)).slice(0, 10);
  if (!очередь.length){
    alert('Все правила повторены. Возвращайтесь завтра.');
    return;
  }
  показано = 0;
  document.querySelector('.пр-поиск').hidden = true;
  $('прСписок').hidden = true;
  $('прСчёт').hidden = true;
  $('прРежим').hidden = true;
  $('прПовтор').hidden = false;
  дальше();
}

function выйтиИзПовтора(){
  document.querySelector('.пр-поиск').hidden = false;
  $('прСписок').hidden = false;
  $('прСчёт').hidden = false;
  $('прРежим').hidden = false;
  $('прПовтор').hidden = true;
  нарисоватьРежим();
  нарисовать();
}

function дальше(){
  if (!очередь.length){
    $('прПовтор').innerHTML =
      `<div class="пв"><div class="пв-вопрос">Готово</div>
       <div class="пв-откуда">Повторено правил: ${показано}</div>
       <div class="пр-режим"><button id="прВыход">Вернуться к справочнику</button></div></div>`;
    $('прВыход').onclick = выйтиИзПовтора;
    return;
  }
  текущее = очередь[0];
  const п = текущее;
  $('прПовтор').innerHTML =
    `<div class="пв">
      <div class="пв-счёт">Осталось: ${очередь.length}</div>
      <div class="пв-тема">${п.знак} ${п.тема}</div>
      <div class="пв-вопрос">${п.раздел || 'Правило'}</div>
      <div class="пв-откуда">${п.урокИмя}${п.вид === 'ловушка' ? ' · ⚠️ ловушка' : ''}</div>
      <div class="пр-режим">
        <button id="прПоказать">Вспомнили? Показать правило</button>
        <button class="тихая" id="прСтоп">Закончить</button>
      </div>
    </div>`;
  $('прПоказать').onclick = показатьОтвет;
  $('прСтоп').onclick = выйтиИзПовтора;
}

function показатьОтвет(){
  const п = текущее;
  const с = сост(п.id);
  // прогноз(состояние, оценка) отдаёт число дней, словами() — человеческий вид
  const подпись = о => {
    try{ return `<small>${ФСРС.словами(ФСРС.прогноз(с, о))}</small>`; }
    catch(e){ return ''; }
  };
  $('прПовтор').innerHTML =
    `<div class="пв">
      <div class="пв-счёт">Осталось: ${очередь.length}</div>
      <div class="пв-тема">${п.знак} ${п.тема}</div>
      <div class="пв-вопрос">${п.раздел || 'Правило'}</div>
      <div class="пв-откуда"><a href="${ссылка(п.урок)}" style="color:var(--accent)">${п.урокИмя} →</a></div>
      <div class="пв-тело ${п.вид === 'ловушка' ? 'ловушка' : ''}">${п.html}</div>
      <div class="пв-оценки">
        <button class="забыл" data-о="1">Забыл${подпись(1)}</button>
        <button data-о="3">Вспомнил${подпись(3)}</button>
        <button class="легко" data-о="4">Легко${подпись(4)}</button>
      </div>
    </div>`;
  $('прПовтор').querySelectorAll('[data-о]').forEach(b => {
    b.onclick = () => оценитьПравило(+b.dataset.о);
  });
}

function оценитьПравило(оценка){
  const п = текущее;
  сохранить(п.id, ФСРС.ответ(сост(п.id), оценка));
  показано++;
  очередь.shift();
  if (оценка === 1) очередь.push(п);      // забыл — вернём в конец пачки
  дальше();
}

нарисоватьРежим();
нарисовать();
</script>
