гательные после артикля"},{"id":"4e64ba0ca5","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"⭐ Когда артикль не нужен","урок":"polya8","урокИмя":"Занятие 8 Полины","html":"<b>Нулевой артикль</b> — это когда артикля просто нет. Не «пустой» артикль, а его отсутствие.\n      Полина спросила, что это такое, и Даша разобрала три случая.","текст":"Нулевой артикль — это когда артикля просто нет. Не «пустой» артикль, а его отсутствие. Полина спросила, что это такое, и Даша разобрала три случая.","ти":3,"пи":7,"подтема":"Другое"},{"id":"6705285fd9","тема":"Падежи","знак":"📦","вид":"правило","раздел":"⭐⭐ Падежи и их вопросы","урок":"polya11","урокИмя":"Занятие 11 Полины","html":"<b>Что это вообще такое.</b> Падеж — форма слова, которая показывает его роль в предложении: кто действует, кого видят, кому дают. В русском при этом меняется окончание самого слова: кот — нет кот<b>а</b> — дать кот<b>у</b>. <span class=\"hl\">В немецком слово почти не меняется — меняется артикль перед ним.</span><br><br>\n      Падеж по-немецки — <b>der Kasus</b>. В русском их шесть, в немецком — <b>четыре</b>.","текст":"Что это вообще такое. Падеж — форма слова, которая показывает его роль в предложении: кто действует, кого видят, кому дают. В русском при этом меняется окончание самого слова: кот — нет кота — дать коту. В немецком слово почти не меняется — меняется артикль перед ним. Падеж по-немецки — der Kasus. В русском их шесть, в немецком — четыре.","ти":4,"пи":0,"подтема":"Четыре падежа и их вопросы"},{"id":"7b0ccf6ead","тема":"Падежи","знак":"📦","вид":"правило","раздел":"⭐⭐ Падежи и их вопросы","урок":"polya11","урокИмя":"Занятие 11 Полины","html":"<b>Четыре вида артикля.</b> Даша ещё раз разложила по полочкам:<br>\n      • <b>нулевой</b> — артикля нет: неисчисляемое (Wasser), множественное «вообще» (Bananen), профессии (Ich bin Studentin), страны и города;<br>\n      • <b>неопределённый</b> — ein, eine;<br>\n      • <b>определённый</b> — der, die, das;<br>\n      • <b>отрицательный</b> — kein, keine.","текст":"Четыре вида артикля. Даша ещё раз разложила по полочкам: • нулевой — артикля нет: неисчисляемое (Wasser), множественное «вообще» (Bananen), профессии (Ich bin Studentin), страны и города; • неопределённый — ein, eine; • определённый — der, die, das; • отрицательный — kein, keine.","ти":4,"пи":0,"подтема":"Четыре падежа и их вопросы"},{"id":"1581d6cb62","тема":"Падежи","знак":"📦","вид":"ловушка","раздел":"⭐⭐ Падежи и их вопросы","урок":"polya11","урокИмя":"Занятие 11 Полины","html":"<span class=\"big\">Две тонкости</span>\n      1️⃣ <b>was?</b> — одно слово и для Nominativ, и для Akkusativ. «Что стоит на столе?» — Nominativ. «Что ты видишь?» — Akkusativ. Решает, делает ли «что» действие само или над ним действуют.<br>\n      2️⃣ <b>Куда? — всегда Akkusativ</b>, <b>где? — Dativ</b>. А вот «когда» и «откуда» → Dativ — это хороший ориентир от Даши, но не железный закон. На деле падеж выбирает <b>предлог</b>, и это будет отдельной темой.","текст":"Две тонкости 1️⃣ was? — одно слово и для Nominativ, и для Akkusativ. «Что стоит на столе?» — Nominativ. «Что ты видишь?» — Akkusativ. Решает, делает ли «что» действие само или над ним действуют. 2️⃣ Куда? — всегда Akkusativ, где? — Dativ. А вот «когда» и «откуда» → Dativ — это хороший ориентир от Даши, но не железный закон. На деле падеж выбирает предлог, и это будет отдельной темой.","ти":4,"пи":0,"подтема":"Четыре падежа и их вопросы"},{"id":"354c5ee41e","тема":"Падежи","знак":"📦","вид":"правило","раздел":"⭐⭐ Падежи: повторяем","урок":"polya12","урокИмя":"Занятие 12 Полины","html":"<b>Четыре вида артикля</b> — тоже повтор: нулевой (артикля нет), определённый (der, die, das), неопределённый (ein, eine), отрицательный (kein, keine). Каждый из них склоняется по падежам.<br><br>\n      <b>Где меняется само слово, а не только артикль</b> — Даша напомнила ещё раз:<br>\n      • <b>Genitiv, мужской и средний род</b>: + <b>-s</b> или <b>-es</b> — des Hund<b>es</b>, meines Vater<b>s</b>;<br>\n      • <b>Dativ, множественное</b>: + <b>-n</b> — mit mehreren Kinder<b>n</b>.","текст":"Четыре вида артикля — тоже повтор: нулевой (артикля нет), определённый (der, die, das), неопределённый (ein, eine), отрицательный (kein, keine). Каждый из них склоняется по падежам. Где меняется само слово, а не только артикль — Даша напомнила ещё раз: • Genitiv, мужской и средний род: + -s или -es — des Hundes, meines Vaters; • Dativ, множественное: + -n — mit mehreren Kindern.","ти":4,"пи":0,"подтема":"Четыре падежа и их вопросы"},{"id":"4f37c2518b","тема":"Падежи","знак":"📦","вид":"ловушка","раздел":"⭐⭐ Падежи: повторяем","урок":"polya12","урокИмя":"Занятие 12 Полины","html":"<span class=\"big\">Ошибка с занятия: wohin и woher</span>\n      Отвечая про Dativ, Полина назвала <s>wohin</s>. Даша остановила: <b>wohin? — «куда?»</b> — уже было в Akkusativ. В Dativ — <b>woher? — «откуда?»</b>. Запоминалка: <b>-hin</b> — «туда», движение к цели → Akkusativ; <b>-her</b> — «оттуда» → Dativ.","текст":"Ошибка с занятия: wohin и woher Отвечая про Dativ, Полина назвала wohin. Даша остановила: wohin? — «куда?» — уже было в Akkusativ. В Dativ — woher? — «откуда?». Запоминалка: -hin — «туда», движение к цели → Akkusativ; -her — «оттуда» → Dativ.","ти":4,"пи":0,"подтема":"Четыре падежа и их вопросы"},{"id":"2b5fc57059","тема":"Падежи","знак":"📦","вид":"правило","раздел":"⭐ Четыре правила, которые запомнить","урок":"polya15","урокИмя":"Занятие 15 Полины","html":"<b>1. sie и es в Akkusativ не меняются.</b> «Я понимаю её» — <i>Ich verstehe <b>sie</b></i>. Даша: «по-немецки мы, по сути, говорим „я понимаю она“».<br><br>\n      <b>2. wir и ihr — одна форма на два падежа:</b> <i>uns</i> и <i>euch</i> и в Dativ, и в Akkusativ.<br><br>\n      <b>3. es склоняется как er:</b> в Dativ у обоих <i>ihm</i>. Как в русском: «оно → ему», как «он → ему».<br><br>\n      <b>4. sie «она» и sie «они» в Dativ расходятся:</b> она → <b>ihr</b>, они → <b>ihnen</b>, вежливое Вы → <b>Ihnen</b>. Отсюда два вопроса: <i>Wie geht es <b>dir</b>?</i> (тебе) и <i>Wie geht es <b>Ihnen</b>?</i> (Вам).<br><br>\n      Главное выучить три пары: <b>mir – mich, dir – dich, ihm – ihn</b>. Остальное, как сказала Даша, «в принципе, легко».","текст":"1. sie и es в Akkusativ не меняются. «Я понимаю её» — Ich verstehe sie. Даша: «по-немецки мы, по сути, говорим „я понимаю она“». 2. wir и ihr — одна форма на два падежа: uns и euch и в Dativ, и в Akkusativ. 3. es склоняется как er: в Dativ у обоих ihm. Как в русском: «оно → ему», как «он → ему». 4. sie «она» и sie «они» в Dativ расходятся: она → ihr, они → ihnen, вежливое Вы → Ihnen. Отсюда два вопроса: Wie geht es dir? (тебе) и Wie geht es Ihnen? (Вам). Главное выучить три пары: mir – mich, dir – dich, ihm – ihn. Остальное, как сказала Даша, «в принципе, легко».","ти":4,"пи":0,"подтема":"Четыре падежа и их вопросы"},{"id":"a3fd6cab90","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"⭐ Формула: lassen + Akkusativ + инфинитив","урок":"urok28","урокИмя":"Урок 29","html":"<b class=\"hl\">lassen</b> спрягается и стоит на втором месте. Тот, с кем это делают, — в <b class=\"hl\">Akkusativ</b>. Второй глагол уходит в самый конец, <b>в инфинитиве, без zu</b> — точно так же, как у модальных глаголов из урока 2.<br><br>\n      <i>Der Arzt <b>lässt</b> den Patienten <b>röntgen</b>.</i> — Врач + den Patienten (Akkusativ) + röntgen (в конец, без zu).","текст":"lassen спрягается и стоит на втором месте. Тот, с кем это делают, — в Akkusativ. Второй глагол уходит в самый конец, в инфинитиве, без zu — точно так же, как у модальных глаголов из урока 2. Der Arzt lässt den Patienten röntgen. — Врач + den Patienten (Akkusativ) + röntgen (в конец, без zu).","ти":4,"пи":1,"подтема":"Akkusativ: кого? что?"},{"id":"17385b79d3","тема":"Падежи","знак":"📦","вид":"правило","раздел":"⭐ es gibt и über + винительный","урок":"polya10","урокИмя":"Занятие 10 Полины","html":"<b>Es gibt</b> — «имеется», «есть где-то что-то». Очень частая конструкция, especially когда описываешь картинку или комнату: «в комнате есть стол» — <b>Es gibt einen Tisch im Zimmer.</b> После <b>es gibt</b> всегда идёт винительный падеж.","текст":"Es gibt — «имеется», «есть где-то что-то». Очень частая конструкция, especially когда описываешь картинку или комнату: «в комнате есть стол» — Es gibt einen Tisch im Zimmer. После es gibt всегда идёт винительный падеж.","ти":4,"пи":1,"подтема":"Akkusativ: кого? что?"},{"id":"11770ae3aa","тема":"Падежи","знак":"📦","вид":"правило","раздел":"⭐ es gibt и über + винительный","урок":"polya10","урокИмя":"Занятие 10 Полины","html":"<b>über</b> с винительным падежом — «говорить о чём-то», «на тему чего-то». <b>sprechen über</b> + винительный.","текст":"über с винительным падежом — «говорить о чём-то», «на тему чего-то». sprechen über + винительный.","ти":4,"пи":1,"подтема":"Akkusativ: кого? что?"},{"id":"62b9b67f6d","тема":"Падежи","знак":"📦","вид":"правило","раздел":"⭐ es gibt — всегда gibt","урок":"polya11","урокИмя":"Занятие 11 Полины","html":"<b>Es gibt</b> — «имеется, есть где-то». Полина спросила: если там двое — женщина и мужчина, — почему не «geben»? Потому что глагол относится к слову <b>es</b> («оно»), а не к тому, что есть. Сколько бы там ни было предметов — <span class=\"hl\">всегда gibt</span>. Это устойчивое выражение.<br><br>\n      И после <b>es gibt</b> идёт винительный падеж: <b>einen</b> Tisch, <b>einen</b> Mann.","текст":"Es gibt — «имеется, есть где-то». Полина спросила: если там двое — женщина и мужчина, — почему не «geben»? Потому что глагол относится к слову es («оно»), а не к тому, что есть. Сколько бы там ни было предметов — всегда gibt. Это устойчивое выражение. И после es gibt идёт винительный падеж: einen Tisch, einen Mann.","ти":4,"пи":1,"подтема":"Akkusativ: кого? что?"},{"id":"c15c5e272d","тема":"Падежи","знак":"📦","вид":"ловушка","раздел":"⚠️ Главное: правило, которое решает всё","урок":"urok17","урокИмя":"Урок 18","html":"<span class=\"big\">Спроси себя: есть движение из точки в точку?</span>\n      <b class=\"hl\">НЕТ движения</b> — предмет просто где-то находится → вопрос <b>Wo?</b> → <b>Dativ</b><br>\n      <b class=\"hl\">ЕСТЬ движение</b> — предмет меняет место → вопрос <b>Wohin?</b> → <b>Akkusativ</b><br><br>\n      Один и тот же предлог, одно и то же слово — но падеж разный:<br>\n      <i>Ich bin <b>in der</b> Klinik</i> (я В клинике — стою там) &nbsp;vs&nbsp; <i>Ich gehe <b>in die</b> Klinik</i> (я иду В клинику — вхожу).<br><br>\n      По-русски эту разницу мы тоже делаем («в клинике» / «в клинику»), просто не задумываясь. По-немецки нужно задумываться — секунду, пока не станет автоматом.","текст":"Спроси себя: есть движение из точки в точку? НЕТ движения — предмет просто где-то находится → вопрос Wo? → Dativ ЕСТЬ движение — предмет меняет место → вопрос Wohin? → Akkusativ Один и тот же предлог, одно и то же слово — но падеж разный: Ich bin in der Klinik (я В клинике — стою там) &nbsp;vs&nbsp; Ich gehe in die Klinik (я иду В клинику — вхожу). По-русски эту разницу мы тоже делаем («в клинике» / «в клинику»), просто не задумываясь. По-немецки нужно задумываться — секунду, пока не станет автоматом.","ти":4,"пи":1,"подтема":"Akkusativ: кого? что?"},{"id":"7f7b8c9dc8","тема":"Падежи","знак":"📦","вид":"правило","раздел":"Слияния для Akkusativ","урок":"urok17","урокИмя":"Урок 18","html":"В уроке 11 были слияния для Dativ: <i>in dem → <b>im</b></i>, <i>an dem → <b>am</b></i>. У Akkusativ свои, со средним родом (<i>das</i>):<br><br>\n      <b class=\"hl\">in das → ins</b> &nbsp;·&nbsp; <b class=\"hl\">an das → ans</b> &nbsp;·&nbsp; <b class=\"hl\">auf das → aufs</b><br><br>\n      Мнемоника простая: <b>im</b> = где (стою), <b>ins</b> = куда (иду). Лишняя буква «s» — как шаг вперёд.","текст":"В уроке 11 были слияния для Dativ: in dem → im, an dem → am. У Akkusativ свои, со средним родом (das): in das → ins &nbsp;·&nbsp; an das → ans &nbsp;·&nbsp; auf das → aufs Мнемоника простая: im = где (стою), ins = куда (иду). Лишняя буква «s» — как шаг вперёд.","ти":4,"пи":1,"подтема":"Akkusativ: кого? что?"},{"id":"8604b3d377","тема":"Падежи","знак":"📦","вид":"правило","раздел":"Два коротких списка — и всё","урок":"urok20","урокИмя":"Урок 21","html":"Учить нужно ровно два списка, их немцы запоминают считалочками:<br><br>\n      <b class=\"hl\">Akkusativ:</b> durch · ohne · gegen · für · um — по первым буквам <b>DOGFU</b> (читай «догфу»).<br>\n      <b class=\"hl\">Dativ:</b> aus · bei · mit · nach · seit · von · zu — проговаривай подряд, как стишок: <i>aus-bei-mit-nach-seit-von-zu</i>.<br><br>\n      Правило железное: после предлога из списка — его падеж, <b>всегда</b>. Движение, место, время — неважно.","текст":"Учить нужно ровно два списка, их немцы запоминают считалочками: Akkusativ: durch · ohne · gegen · für · um — по первым буквам DOGFU (читай «догфу»). Dativ: aus · bei · mit · nach · seit · von · zu — проговаривай подряд, как стишок: aus-bei-mit-nach-seit-von-zu. Правило железное: после предлога из списка — его падеж, всегда. Движение, место, время — неважно.","ти":4,"пи":1,"подтема":"Akkusativ: кого? что?"},{"id":"3ac6840c09","тема":"Падежи","знак":"📦","вид":"правило","раздел":"Пять предлогов с Akkusativ — DOGFU","урок":"urok20","урокИмя":"Урок 21","html":"В Akkusativ меняется только мужской род: <i>der Patient → für <b>den</b> Patienten</i>. Женский и средний остаются как были. Поэтому ошибиться тут трудно — главное, не поставить по-русски Dativ.","текст":"В Akkusativ меняется только мужской род: der Patient → für den Patienten. Женский и средний остаются как были. Поэтому ошибиться тут трудно — главное, не поставить по-русски Dativ.","ти":4,"пи":1,"подтема":"Akkusativ: кого? что?"},{"id":"eb104a087a","тема":"Падежи","знак":"📦","вид":"правило","раздел":"Akkusativ: кого? что?","урок":"urok21","урокИмя":"Урок 22","html":"Прямое дополнение — на кого направлено действие: вижу <b>тебя</b>, знаю <b>его</b>, осматриваю <b>Вас</b>. Почти всегда совпадает с русским винительным.","текст":"Прямое дополнение — на кого направлено действие: вижу тебя, знаю его, осматриваю Вас. Почти всегда совпадает с русским винительным.","ти":4,"пи":1,"подтема":"Akkusativ: кого? что?"},{"id":"328a625ed2","тема":"Падежи","знак":"📦","вид":"правило","раздел":"Винительный падеж (Akkusativ) — проще, чем кажется","урок":"urok4","урокИмя":"Урок 5","html":"После <i>haben</i> существительное стоит в винительном падеже — отвечает на «кого? что?». Хорошая новость: <b>меняется только мужской род</b> (der → <span class=\"hl\">den</span>, ein → <span class=\"hl\">einen</span>). Женский, средний и множественное — <b>не меняются вообще</b>.\n    </div>\n    <table class=\"akk-table\">\n      <tr><th>Род</th><th>Именительный (кто/что)</th><th>Винительный (после haben)</th></tr>\n      <tr><td>муж. (der)</td><td>der Termin</td><td><b>einen</b> Termin ← меняется!</td></tr>\n      <tr><td>жен. (die)</td><td>die Frage</td><td><b>eine</b> Frage</td></tr>\n      <tr><td>сред. (das)</td><td>das Rezept</td><td><b>ein</b> Rezept</td></tr>\n    </table>\n    <div class=\"card-list\" id=\"akk\">","текст":"После haben существительное стоит в винительном падеже — отвечает на «кого? что?». Хорошая новость: меняется только мужской род (der → den, ein → einen). Женский, средний и множественное — не меняются вообще. РодИменительный (кто/что)Винительный (после haben) муж. (der)der Termineinen Termin ← меняется! жен. (die)die Frageeine Frage сред. (das)das Rezeptein Rezept","ти":4,"пи":1,"подтема":"Akkusativ: кого? что?"},{"id":"7f2b3dbe41","тема":"Падежи","знак":"📦","вид":"правило","раздел":"Винительный падеж (Akkusativ) — проще, чем кажется","урок":"urok4","урокИмя":"Урок 5","html":"Винительный нужен не только после <i>haben</i>: так же после <i>brauchen, suchen, nehmen, sehen, kaufen</i> — везде, где действие переходит на предмет.","текст":"Винительный нужен не только после haben: так же после brauchen, suchen, nehmen, sehen, kaufen — везде, где действие переходит на предмет.","ти":4,"пи":1,"подтема":"Akkusativ: кого? что?"},{"id":"d6f79e89f1","тема":"Множественное число","знак":"➕","вид":"правило","раздел":"Семья Марка — кто кому кем приходится","урок":"dasha7","урокИмя":"Занятие 7 с Дашей","html":"<b>sein → seine — когда меняется?</b> <i>sein</i> добавляет <b>-e</b>, если слово после него женского рода или множественного числа: <i>seine Mutter</i> (die Mutter), <i>seine Eltern</i> (мн. ч.). Перед мужским и средним родом — без -e: <i>sein Vater</i>, <i>sein Onkel</i>.","текст":"sein → seine — когда меняется? sein добавляет -e, если слово после него женского рода или множественного числа: seine Mutter (die Mutter), seine Eltern (мн. ч.). Перед мужским и средним родом — без -e: sein Vater, sein Onkel.","ти":4,"пи":2,"подтема":"Dativ: кому?"},{"id":"5a5aded4a8","тема":"Множественное число","знак":"➕","вид":"правило","раздел":"⭐⭐ Добавка: n-Deklination, Genitiv, Dativ Plural, Herz и Name","урок":"polya19","урокИмя":"Занятие 19 Полины","html":"Группа существительных <b>мужского рода (и только мужского!)</b>: во всех падежах, <b>кроме Nominativ</b>, получают <b>-en</b> или <b>-n</b>.<br>\n      • живые существа на <b>-e</b>: <i>der Junge, der Kollege, der Löwe</i>;<br>\n      • профессии и статусы на <b>-ist, -ent, -ant, -at</b>: <i>der Polizist, der Student, der Praktikant, der Diplomat</i>;<br>\n      • исключения: <i>der Herr, der Mensch, der Nachbar, der Bär</i>.<br>\n      <b>⚠ Это НЕ множественное число!</b> <i>Ich sehe den Studenten</i> — я вижу студента (одного).","текст":"Группа существительных мужского рода (и только мужского!): во всех падежах, кроме Nominativ, получают -en или -n. • живые существа на -e: der Junge, der Kollege, der Löwe; • профессии и статусы на -ist, -ent, -ant, -at: der Polizist, der Student, der Praktikant, der Diplomat; • исключения: der Herr, der Mensch, der Nachbar, der Bär. ⚠ Это НЕ множественное число! Ich sehe den Studenten — я вижу студента (одного).","ти":4,"пи":2,"подтема":"Dativ: кому?"},{"id":"8404288d29","тема":"Множественное число","знак":"➕","вид":"правило","раздел":"⭐⭐ Добавка: n-Deklination, Genitiv, Dativ Plural, Herz и Name","урок":"polya19","урокИмя":"Занятие 19 Полины","html":"Самый частый случай (не считая множественного). Мужской и средний род в Genitiv получают <b>-s</b> или <b>-es</b>:<br>\n      • <b>-s</b> — у многосложных слов: <i>des Lehrer<b>s</b>, des Auto<b>s</b></i>;<br>\n      • <b>-es</b> — у коротких (один слог) и на <i>s, ß, x, z</i>: <i>des Kind<b>es</b>, des Haus<b>es</b>, des Platz<b>es</b></i>.<br>\n      <b>Женский род в единственном числе окончаний не получает никогда:</b> <i>die Tasche der Frau</i>.","текст":"Самый частый случай (не считая множественного). Мужской и средний род в Genitiv получают -s или -es: • -s — у многосложных слов: des Lehrers, des Autos; • -es — у коротких (один слог) и на s, ß, x, z: des Kindes, des Hauses, des Platzes. Женский род в единственном числе окончаний не получает никогда: die Tasche der Frau.","ти":4,"пи":2,"подтема":"Dativ: кому?"},{"id":"877612746d","тема":"Множественное число","знак":"➕","вид":"правило","раздел":"⭐⭐ Добавка: n-Deklination, Genitiv, Dativ Plural, Herz и Name","урок":"polya19","урокИмя":"Занятие 19 Полины","html":"Если существительное во множественном числе <b>не</b> кончается на <i>-n</i> или <i>-s</i>, в Dativ к нему добавляется <b>-n</b>:<br>\n      <i>die Kinder → mit den Kinder<b>n</b></i> · <i>die Tische → auf den Tische<b>n</b></i> · <i>die Fahrräder → mit den Fahrräder<b>n</b></i> · <i>die Autos</i> — уже на <i>-s</i>, ничего не добавляем.","текст":"Если существительное во множественном числе не кончается на -n или -s, в Dativ к нему добавляется -n: die Kinder → mit den Kindern · die Tische → auf den Tischen · die Fahrräder → mit den Fahrrädern · die Autos — уже на -s, ничего не добавляем.","ти":4,"пи":2,"подтема":"Dativ: кому?"},{"id":"e848b840e4","тема":"Артикли и род","знак":"🎨","вид":"ловушка","раздел":"Без артикля вообще","урок":"urok24","урокИмя":"Урок 25","html":"<span class=\"big\">Вот это выучить наизусть</span>\n      <b>mit starken Schmerzen</b> — «с сильными болями». Дательный падеж, множественное число, артикля нет. Вы будете говорить это каждый день: <i>Der Patient kommt <b>mit starken Schmerzen</b>.</i>","текст":"Вот это выучить наизусть mit starken Schmerzen — «с сильными болями». Дательный падеж, множественное число, артикля нет. Вы будете говорить это каждый день: Der Patient kommt mit starken Schmerzen.","ти":4,"пи":2,"подтема":"Dativ: кому?"},{"id":"0ca19e42c8","тема":"Падежи","знак":"📦","вид":"правило","раздел":"⭐ von, mit, nach — всегда Dativ","урок":"polya18","урокИмя":"Занятие 18 Полины","html":"Даша попросила записать: после <b>mit</b>, <b>von</b> и <b>nach</b> — <b>всегда Dativ</b>, что бы ни было вокруг. Поэтому в тексте <i>ein Roman von <b>jenem</b> Autor</i> — не jenen.<br>\n      Полина спросила: «а после каких всегда Akkusativ?» — Даша: «это скоро, следующей темой».","текст":"Даша попросила записать: после mit, von и nach — всегда Dativ, что бы ни было вокруг. Поэтому в тексте ein Roman von jenem Autor — не jenen. Полина спросила: «а после каких всегда Akkusativ?» — Даша: «это скоро, следующей темой».","ти":4,"пи":2,"подтема":"Dativ: кому?"},{"id":"f5474ff31f","тема":"Падежи","знак":"📦","вид":"правило","раздел":"Главное правило: Wo? → Dativ","урок":"urok11","урокИмя":"Урок 12","html":"Запомни: муж. и ср. род в Dativ дают <b class=\"hl\">dem</b>, женский — <b class=\"hl\">der</b>, множественное — <b class=\"hl\">den</b>, и к самому слову во множественном добавляется <b>-n</b>, если его нет: <i>die Kinder → in den Kinder<b>n</b></i>.","текст":"Запомни: муж. и ср. род в Dativ дают dem, женский — der, множественное — den, и к самому слову во множественном добавляется -n, если его нет: die Kinder → in den Kindern.","ти":4,"пи":2,"подтема":"Dativ: кому?"},{"id":"75f2d33edf","тема":"Падежи","знак":"📦","вид":"ловушка","раздел":"Главное правило: Wo? → Dativ","урок":"urok11","урокИмя":"Урок 12","html":"После предлога места (когда отвечаем на <b>Wo?</b> — что-то просто находится где-то, без движения) артикль встаёт в падеж <b>Dativ</b>. Артикли меняются так:\n    </div>\n    <table class=\"dativ-table\">\n      <tr><td>der (муж.) →</td><td><span class=\"art\">der</span> Tisch → in <span class=\"datv\">dem</span> Tisch</td></tr>\n      <tr><td>das (ср.) →</td><td><span class=\"art\">das</span> Zimmer → in <span class=\"datv\">dem</span> Zimmer</td></tr>\n      <tr><td>die (жен.) →</td><td><span class=\"art\">die</span> Tasche → in <span class=\"datv\">der</span> Tasche</td></tr>\n      <tr><td>die (мн.) →</td><td><span class=\"art\">die</span> Betten → in <span class=\"datv\">den</span> Betten</td></tr>\n    </table>\n    <div class=\"grammar-box\" style=\"margin-top:14px\">Запомни: муж. и ср. род в Dativ дают <b class=\"hl\">dem</b>, женский — <b class=\"hl\">der</b>, множественное — <b class=\"hl\">den</b>, и к самому слову во множественном добавляется <b>-n</b>, если его нет: <i>die Kinder → in den Kinder<b>n</b></i>.","текст":"После предлога места (когда отвечаем на Wo? — что-то просто находится где-то, без движения) артикль встаёт в падеж Dativ. Артикли меняются так: der (муж.) →der Tisch → in dem Tisch das (ср.) →das Zimmer → in dem Zimmer die (жен.) →die Tasche → in der Tasche die (мн.) →die Betten → in den Betten Запомни: муж. и ср. род в Dativ дают dem, женский — der, множественное — den, и к самому слову во множественном добавляется -n, если его нет: die Kinder → in den Kindern.","ти":4,"пи":2,"подтема":"Dativ: кому?"},{"id":"5c1e30ee44","тема":"Падежи","знак":"📦","вид":"правило","раздел":"Где что стоит — Wo? + Dativ","урок":"urok15","урокИмя":"Урок 16","html":"Одна разница с русским: мы почти всё «кладём» словом «есть/находится», а немцы обязательно уточняют <b>позу предмета</b>:<br><br>\n      <b class=\"hl\">stehen</b> — стоит (вертикальное: шкаф, стул, кровать, бутылка)<br>\n      <b class=\"hl\">liegen</b> — лежит (горизонтальное: ковёр, книга, полотенце)<br>\n      <b class=\"hl\">hängen</b> — висит (лампа, картина, зеркало)<br><br>\n      Сказать «кровать лежит в спальне» — ошибка. Кровать <i>стоит</i>.","текст":"Одна разница с русским: мы почти всё «кладём» словом «есть/находится», а немцы обязательно уточняют позу предмета: stehen — стоит (вертикальное: шкаф, стул, кровать, бутылка) liegen — лежит (горизонтальное: ковёр, книга, полотенце) hängen — висит (лампа, картина, зеркало) Сказать «кровать лежит в спальне» — ошибка. Кровать стоит.","ти":4,"пи":2,"подтема":"Dativ: кому?"},{"id":"f692403049","тема":"Падежи","знак":"📦","вид":"ловушка","раздел":"⚠️ «Мне холодно» — Mir ist kalt","урок":"urok16","урокИмя":"Урок 17","html":"<span class=\"big\">«Ich bin kalt» значит «я холодный человек»</span>\n      Когда холодно или жарко <b>тебе</b>, немец ставит тебя в <b>Dativ</b> — как в <i>Das schmeckt mir</i> из урока 14: <b class=\"hl\">Mir ist kalt</b> — «мне холодно». Вежливо пациенту — <b class=\"hl\">Ist Ihnen kalt?</b> Это вопрос, который задают на каждом осмотре, пока пациент стоит раздетый.","текст":"«Ich bin kalt» значит «я холодный человек» Когда холодно или жарко тебе, немец ставит тебя в Dativ — как в Das schmeckt mir из урока 14: Mir ist kalt — «мне холодно». Вежливо пациенту — Ist Ihnen kalt? Это вопрос, который задают на каждом осмотре, пока пациент стоит раздетый.","ти":4,"пи":2,"подтема":"Dativ: кому?"},{"id":"2384c8cdbe","тема":"Падежи","знак":"📦","вид":"ловушка","раздел":"⚠️ Предлоги-однолюбы: всегда Dativ, без вариантов","урок":"urok17","урокИмя":"Урок 18","html":"<span class=\"big\">Не все предлоги умеют переключаться</span>\n      Шесть частых предлогов сидят на <b>Dativ</b> всегда, даже когда движение очевидно: <b>nach, zu, aus, bei, mit, seit</b>.<br><br>\n      Поэтому <i>Gehen Sie <b>zum</b> Ultraschall</i> — Dativ, хотя это явное движение. Не пытайся применять сюда правило из раздела 1: эти предлоги ему не подчиняются, их просто запоминают списком.","текст":"Не все предлоги умеют переключаться Шесть частых предлогов сидят на Dativ всегда, даже когда движение очевидно: nach, zu, aus, bei, mit, seit. Поэтому Gehen Sie zum Ultraschall — Dativ, хотя это явное движение. Не пытайся применять сюда правило из раздела 1: эти предлоги ему не подчиняются, их просто запоминают списком.","ти":4,"пи":2,"подтема":"Dativ: кому?"},{"id":"3602af959e","тема":"Падежи","знак":"📦","вид":"ловушка","раздел":"⚠️ Предлоги-однолюбы: всегда Dativ, без вариантов","урок":"urok17","урокИмя":"Урок 18","html":"<span class=\"big\">Классика, на которой спотыкаются все: nach Hause / zu Hause</span>\n      <b>nach Hause</b> — домой (движение). <b>zu Hause</b> — дома (нахождение). Оба с Dativ, разводятся только предлогом. Выучи как две готовые фразы, не разбирая.","текст":"Классика, на которой спотыкаются все: nach Hause / zu Hause nach Hause — домой (движение). zu Hause — дома (нахождение). Оба с Dativ, разводятся только предлогом. Выучи как две готовые фразы, не разбирая.","ти":4,"пи":2,"подтема":"Dativ: кому?"},{"id":"6ba6b16bc6","тема":"Падежи","знак":"📦","вид":"правило","раздел":"Кому хорошо: mir, dir, Ihnen","урок":"urok2","урокИмя":"Урок 3","html":"В «как дела» стоит не <i>ich</i>, а <b>кому</b>: <i>mir</i> — мне, <i>dir</i> — тебе, <i>Ihnen</i> — Вам. Это дательный падеж (Dativ) — подробно он будет позже, а пока хватит пяти слов из таблицы.<br><br>\n      <b class=\"hl\">Ловушка:</b> <i>Ich bin gut</i> — это не «у меня всё хорошо», а «я хороший» или «я в этом силён».","текст":"В «как дела» стоит не ich, а кому: mir — мне, dir — тебе, Ihnen — Вам. Это дательный падеж (Dativ) — подробно он будет позже, а пока хватит пяти слов из таблицы. Ловушка: Ich bin gut — это не «у меня всё хорошо», а «я хороший» или «я в этом силён».","ти":4,"пи":2,"подтема":"Dativ: кому?"},{"id":"85d901266f","тема":"Падежи","знак":"📦","вид":"правило","раздел":"Семь предлогов с Dativ","урок":"urok20","урокИмя":"Урок 21","html":"Dativ меняет все артикли: <i>der → <b>dem</b>, die → <b>der</b>, das → <b>dem</b>, мн. → <b>den</b></i> (и к слову во множественном добавляется -n: <i>mit den Kinder<b>n</b></i>). Три предлога ещё и сливаются с артиклем — это ты уже слышал: <b>beim</b> Arzt, <b>vom</b> Arzt, <b>zum</b> Arzt, <b>zur</b> Apotheke.","текст":"Dativ меняет все артикли: der → dem, die → der, das → dem, мн. → den (и к слову во множественном добавляется -n: mit den Kindern). Три предлога ещё и сливаются с артиклем — это ты уже слышал: beim Arzt, vom Arzt, zum Arzt, zur Apotheke.","ти":4,"пи":2,"подтема":"Dativ: кому?"},{"id":"87c83b559a","тема":"Падежи","знак":"📦","вид":"ловушка","раздел":"Семь предлогов с Dativ","урок":"urok20","урокИмя":"Урок 21","html":"<span class=\"big\">«На автобусе» по-немецки — «с автобусом»</span>\n      Транспорт всегда через <b>mit</b>: <i>mit dem Bus, mit dem Auto, mit der Bahn</i>. Сказать «auf dem Bus» — значит, что ты едешь на крыше автобуса.","текст":"«На автобусе» по-немецки — «с автобусом» Транспорт всегда через mit: mit dem Bus, mit dem Auto, mit der Bahn. Сказать «auf dem Bus» — значит, что ты едешь на крыше автобуса.","ти":4,"пи":2,"подтема":"Dativ: кому?"},{"id":"9a968d9952","тема":"Падежи","знак":"📦","вид":"правило","раздел":"Dativ: кому?","урок":"urok21","урокИмя":"Урок 22","html":"Адресат — <b>кому</b> дают, показывают, объясняют: даю <b>Вам</b> рецепт, покажу <b>Вам</b> дорогу. Тоже почти как в русском — пока не дойдём до раздела 4.","текст":"Адресат — кому дают, показывают, объясняют: даю Вам рецепт, покажу Вам дорогу. Тоже почти как в русском — пока не дойдём до раздела 4.","ти":4,"пи":2,"подтема":"Dativ: кому?"},{"id":"2785b8ac12","тема":"Падежи","знак":"📦","вид":"ловушка","раздел":"⚠️ Глаголы с Dativ — где русский подводит","урок":"urok21","урокИмя":"Урок 22","html":"<span class=\"big\">danken и gratulieren: по-русски «кого», по-немецки «кому»</span>\n      Благодарю <b>Вас</b> → <i>Ich danke <b>Ihnen</b></i>, а не «Sie». Поздравляю <b>тебя</b> → <i>Ich gratuliere <b>dir</b></i>.<br><br>\n      И обратная ловушка — <b>anrufen</b>: по-русски «звоню <b>Вам</b>», а по-немецки Akkusativ: <i>Ich rufe <b>Sie</b> an</i>.<br><br>\n      Надёжного правила нет: глаголы с Dativ учат списком. Хорошо, что он короткий — вот главные.","текст":"danken и gratulieren: по-русски «кого», по-немецки «кому» Благодарю Вас → Ich danke Ihnen, а не «Sie». Поздравляю тебя → Ich gratuliere dir. И обратная ловушка — anrufen: по-русски «звоню Вам», а по-немецки Akkusativ: Ich rufe Sie an. Надёжного правила нет: глаголы с Dativ учат списком. Хорошо, что он короткий — вот главные.","ти":4,"пи":2,"подтема":"Dativ: кому?"},{"id":"0c800df8f6","тема":"Падежи","знак":"📦","вид":"правило","раздел":"«Мне…» — Mir ist, mir tut weh","урок":"urok21","урокИмя":"Урок 22","html":"Когда <b>тебе</b> плохо, холодно, кружится голова — ты по-немецки в Dativ, как в уроке 16 (<i>Mir ist kalt</i>). И даже «как дела?» спрашивают через «кому»: <i>Wie geht es <b>Ihnen</b>?</i> — буквально «как идёт Вам?».","текст":"Когда тебе плохо, холодно, кружится голова — ты по-немецки в Dativ, как в уроке 16 (Mir ist kalt). И даже «как дела?» спрашивают через «кому»: Wie geht es Ihnen? — буквально «как идёт Вам?».","ти":4,"пи":2,"подтема":"Dativ: кому?"},{"id":"28295336e7","тема":"Падежи","знак":"📦","вид":"правило","раздел":"Два дополнения в одной фразе","урок":"urok21","урокИмя":"Урок 22","html":"Если есть и «кому», и «что»: сначала <b>кому</b> (Dativ), потом <b>что</b>: <i>Ich gebe <b>Ihnen</b> das Rezept</i>. Но если «что» — тоже местоимение (<i>es, ihn, sie</i>), оно встаёт <b>первым</b>: <i>Ich gebe <b>es</b> Ihnen</i>. Короткое вперёд.","текст":"Если есть и «кому», и «что»: сначала кому (Dativ), потом что: Ich gebe Ihnen das Rezept. Но если «что» — тоже местоимение (es, ihn, sie), оно встаёт первым: Ich gebe es Ihnen. Короткое вперёд.","ти":4,"пи":2,"подтема":"Dativ: кому?"},{"id":"fedfcda8d3","тема":"Падежи","знак":"📦","вид":"правило","раздел":"Кем сделано: von + Dativ","урок":"urok27","урокИмя":"Урок 28","html":"Если важно сказать, кто именно действовал, — добавляем <b>von</b> плюс <b>Dativ</b>. Это необязательная часть: в живой речи её чаще опускают, чем ставят — как раз потому, что смысл пассива в том, что исполнитель не важен.<br><br>\n      ⚠️ <b>von</b> требует <b>Dativ</b>: <i>von <b>dem</b> Arzt</i> = <i><b>vom</b> Arzt</i>, <i>von <b>der</b> Ärztin</i>.","текст":"Если важно сказать, кто именно действовал, — добавляем von плюс Dativ. Это необязательная часть: в живой речи её чаще опускают, чем ставят — как раз потому, что смысл пассива в том, что исполнитель не важен. ⚠️ von требует Dativ: von dem Arzt = vom Arzt, von der Ärztin.","ти":4,"пи":2,"подтема":"Dativ: кому?"},{"id":"980b97d469","тема":"Падежи","знак":"📦","вид":"правило","раздел":"Как говорят и как пишут","урок":"urok37","урокИмя":"Урок 38","html":"В устной речи Genitiv часто заменяют на <b class=\"hl\">von + Dativ</b>, а после wegen многие говорят Dativ. Понимать это нужно, но <b>на экзамене и в документах — только Genitiv</b>. С именами — просто <b>-s</b> без апострофа: <i>Annas Buch</i>.","текст":"В устной речи Genitiv часто заменяют на von + Dativ, а после wegen многие говорят Dativ. Понимать это нужно, но на экзамене и в документах — только Genitiv. С именами — просто -s без апострофа: Annas Buch.","ти":4,"пи":2,"подтема":"Dativ: кому?"},{"id":"bb2b50f4dc","тема":"Падежи","знак":"📦","вид":"правило","раздел":"Голова и шея","урок":"urok48","урокИмя":"Урок 49","html":"Зрачки, движения глаз, рот и язык, щитовидная железа. Обратите внимание на дательный: <b>folgen</b> + Dativ — meinem Finger (урок 21), <b>in die Augen leuchten</b> — светить в глаза.","текст":"Зрачки, движения глаз, рот и язык, щитовидная железа. Обратите внимание на дательный: folgen + Dativ — meinem Finger (урок 21), in die Augen leuchten — светить в глаза.","ти":4,"пи":2,"подтема":"Dativ: кому?"},{"id":"158d5b0633","тема":"Разное","знак":"📎","вид":"правило","раздел":"Кто — кого — кому","урок":"urok21","урокИмя":"Урок 22","html":"Хорошая новость: у <b>sie, es, Sie</b> «кого» совпадает с «кто», у <b>wir</b> и <b>ihr</b> «кого» = «кому». По-настоящему учить надо <b class=\"hl\">mich/mir, dich/dir, ihn/ihm, ihr, ihnen/Ihnen</b>. Для врача главное из таблицы — последняя строка: <b>Sie — Sie — Ihnen</b>.","текст":"Хорошая новость: у sie, es, Sie «кого» совпадает с «кто», у wir и ihr «кого» = «кому». По-настоящему учить надо mich/mir, dich/dir, ihn/ihm, ihr, ihnen/Ihnen. Для врача главное из таблицы — последняя строка: Sie — Sie — Ihnen.","ти":4,"пи":2,"подтема":"Dativ: кому?"},{"id":"6270766458","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"Трудные пары","урок":"urok8","урокИмя":"Урок 9","html":"<b>wo / woher / wohin</b> — где / откуда / куда. По-русски это три разных слова, и по-немецки тоже: «Wo kommen Sie?» — ошибка, нужно <i>Woher</i>.<br><br>\n      <b>wie viel / wie viele</b> — «сколько» чего-то неисчисляемого (воды, времени) и сколько штук: <i>wie viel Wasser</i>, но <i>wie viele Tabletten</i>.<br><br>\n      <b>welcher / welche / welches</b> — «какой», и оно меняется по роду, как артикль: <i>der Arzt → welcher</i>, <i>die Tablette → welche</i>, <i>das Bein → welches</i>.","текст":"wo / woher / wohin — где / откуда / куда. По-русски это три разных слова, и по-немецки тоже: «Wo kommen Sie?» — ошибка, нужно Woher. wie viel / wie viele — «сколько» чего-то неисчисляемого (воды, времени) и сколько штук: wie viel Wasser, но wie viele Tabletten. welcher / welche / welches — «какой», и оно меняется по роду, как артикль: der Arzt → welcher, die Tablette → welche, das Bein → welches.","ти":4,"пи":3,"подтема":"Wo? или Wohin? — место и направление"},{"id":"3adaf4a446","тема":"Падежи","знак":"📦","вид":"правило","раздел":"⭐ ins или im","урок":"polya11","урокИмя":"Занятие 11 Полины","html":"Вопрос Полины в конце занятия: она видела <b>ins</b> среди предлогов дательного падежа — откуда там <b>das</b>, если в Dativ только dem, der, den?<br><br>\n      Ответ: после <b>in</b> бывает и Akkusativ, и Dativ — всё решает вопрос. <span class=\"hl\">Куда? → Akkusativ</span>: in das Zimmer = <b>ins</b> Zimmer. <span class=\"hl\">Где? → Dativ</span>: in dem Park = <b>im</b> Park.","текст":"Вопрос Полины в конце занятия: она видела ins среди предлогов дательного падежа — откуда там das, если в Dativ только dem, der, den? Ответ: после in бывает и Akkusativ, и Dativ — всё решает вопрос. Куда? → Akkusativ: in das Zimmer = ins Zimmer. Где? → Dativ: in dem Park = im Park.","ти":4,"пи":3,"подтема":"Wo? или Wohin? — место и направление"},{"id":"30e7edfaec","тема":"Падежи","знак":"📦","вид":"правило","раздел":"⭐⭐ liegen или legen","урок":"polya12","урокИмя":"Занятие 12 Полины","html":"<b>Что это вообще такое.</b> Два похожих глагола, разница в одной букве:<br>\n      • <b>liegen</b> — <b>лежать</b>: это состояние, ничего не происходит. Вопрос <b>wo?</b> (где?) → <b>Dativ</b>.<br>\n      • <b>legen</b> — <b>класть</b>: это действие, предмет двигается. Вопрос <b>wohin?</b> (куда?) → <b>Akkusativ</b>.<br><br>\n      Предлог один и тот же — <b>auf</b>, а падеж разный. Та же пара есть со «стоять»: <b>stehen</b> — стоять (где? Dativ) и <b>stellen</b> — ставить (куда? Akkusativ). Оба глагола правильные: er liegt, du liegst · er legt, du legst.","текст":"Что это вообще такое. Два похожих глагола, разница в одной букве: • liegen — лежать: это состояние, ничего не происходит. Вопрос wo? (где?) → Dativ. • legen — класть: это действие, предмет двигается. Вопрос wohin? (куда?) → Akkusativ. Предлог один и тот же — auf, а падеж разный. Та же пара есть со «стоять»: stehen — стоять (где? Dativ) и stellen — ставить (куда? Akkusativ). Оба глагола правильные: er liegt, du liegst · er legt, du legst.","ти":4,"пи":3,"подтема":"Wo? или Wohin? — место и направление"},{"id":"fda000940e","тема":"Падежи","знак":"📦","вид":"ловушка","раздел":"⭐⭐ liegen или legen","урок":"polya12","урокИмя":"Занятие 12 Полины","html":"<span class=\"big\">Два предложения, которые Даша велела держать в голове</span>\n      <b>Das Buch liegt auf dem Tisch.</b> — Лежит где? — на столе → Dativ.<br>\n      <b>Ich lege das Buch auf den Tisch.</b> — Кладу куда? — на стол → Akkusativ.<br><br>\n      Ошибка с занятия: Полина сказала <s>Ich lege das Buch auf dem Tisch</s>. После вопроса «куда?» сама исправила на <b>auf den Tisch</b>. 👍","текст":"Два предложения, которые Даша велела держать в голове Das Buch liegt auf dem Tisch. — Лежит где? — на столе → Dativ. Ich lege das Buch auf den Tisch. — Кладу куда? — на стол → Akkusativ. Ошибка с занятия: Полина сказала Ich lege das Buch auf dem Tisch. После вопроса «куда?» сама исправила на auf den Tisch. 👍","ти":4,"пи":3,"подтема":"Wo? или Wohin? — место и направление"},{"id":"6f380ba06f","тема":"Падежи","знак":"📦","вид":"ловушка","раздел":"⚠️ Глаголы-близнецы: stehen/stellen, liegen/legen, sitzen/setzen","урок":"urok17","урокИмя":"Урок 18","html":"<span class=\"big\">Немецкий разводит «стоять» и «ставить» на два разных глагола</span>\n      В уроке 15 ты выучил <i>stehen</i>, <i>liegen</i>, <i>hängen</i> — они отвечают на <b>Wo?</b> и требуют <b>Dativ</b>. У каждого есть брат-близнец для <b>Wohin?</b> с <b>Akkusativ</b>:<br><br>\n      <b>stehen</b> (стоять) → <b class=\"hl\">stellen</b> (ставить)<br>\n      <b>liegen</b> (лежать) → <b class=\"hl\">legen</b> (класть)<br>\n      <b>sitzen</b> (сидеть) → <b class=\"hl\">setzen</b> (сажать, садиться)<br><br>\n      Логика железная: <b>первый глагол = состояние</b> (никто ничего не делает, предмет просто есть) → Dativ. <b>Второй = действие</b> (кто-то что-то перемещает) → Akkusativ. Если в предложении есть тот, кто действует, — бери второй глагол. <i>hängen</i> — исключение: один глагол на обе роли, решает только падеж.","текст":"Немецкий разводит «стоять» и «ставить» на два разных глагола В уроке 15 ты выучил stehen, liegen, hängen — они отвечают на Wo? и требуют Dativ. У каждого есть брат-близнец для Wohin? с Akkusativ: stehen (стоять) → stellen (ставить) liegen (лежать) → legen (класть) sitzen (сидеть) → setzen (сажать, садиться) Логика железная: первый глагол = состояние (никто ничего не делает, предмет просто есть) → Dativ. Второй = действие (кто-то что-то перемещает) → Akkusativ. Если в предложении есть тот, кто действует, — бери второй глагол. hängen — исключение: один глагол на обе роли, решает только падеж.","ти":4,"пи":3,"подтема":"Wo? или Wohin? — место и направление"},{"id":"f3cb2371d6","тема":"Предлоги","знак":"🧭","вид":"правило","раздел":"Wo? Wohin? Woher? — вся тройка","урок":"urok17","урокИмя":"Урок 18","html":"К «где» и «куда» добавляется третий вопрос — <b class=\"hl\">Woher?</b> (откуда). Ответ на него — предлоги <b>aus</b> (из здания, из страны) и <b>von</b> (от человека, с места), оба всегда с <b>Dativ</b>. <i>von dem → <b>vom</b></i>.","текст":"К «где» и «куда» добавляется третий вопрос — Woher? (откуда). Ответ на него — предлоги aus (из здания, из страны) и von (от человека, с места), оба всегда с Dativ. von dem → vom.","ти":4,"пи":3,"подтема":"Wo? или Wohin? — место и направление"},{"id":"a8768598d3","тема":"Числа, время, даты","знак":"🔢","вид":"правило","раздел":"13–19 — «цифра + zehn»","урок":"urok5","урокИмя":"Урок 6","html":"Берём единицу и приклеиваем <b class=\"hl\">-zehn</b> (десять): drei + zehn = <i>dreizehn</i> (13). Мелкие изменения: 16 <i>sechzehn</i> (без -s), 17 <i>siebzehn</i> (без -en).","текст":"Берём единицу и приклеиваем -zehn (десять): drei + zehn = dreizehn (13). Мелкие изменения: 16 sechzehn (без -s), 17 siebzehn (без -en).","ти":4,"пи":4,"подтема":"Genitiv: чей?"},{"id":"8827f62d3c","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"⭐ Артикли в Genitiv","урок":"urok37","урокИмя":"Урок 38","html":"Вопрос — <b class=\"hl\">wessen?</b> («чей?»). Genitiv стоит <b>после</b> того слова, к которому относится: <i>das Auto <b>des Arztes</b></i> — машина (чья?) врача. Запоминалка: мужской и средний — <b>des … -s</b>, женский и множественное — <b>der</b>.","текст":"Вопрос — wessen? («чей?»). Genitiv стоит после того слова, к которому относится: das Auto des Arztes — машина (чья?) врача. Запоминалка: мужской и средний — des … -s, женский и множественное — der.","ти":4,"пи":4,"подтема":"Genitiv: чей?"},{"id":"68d70e3ac7","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"⭐ Мужской и средний: -s или -es","урок":"urok37","урокИмя":"Урок 38","html":"У мужского и среднего рода к <b>самому существительному</b> добавляется окончание:<br>\n      • <b class=\"hl\">-es</b> — после <b>s, ß, z, sch, x</b> (иначе не выговорить) и обычно у коротких слов в один слог: <i>des Fuß<b>es</b></i>, <i>des Hals<b>es</b></i>, <i>des Kopf<b>es</b></i>;<br>\n      • <b class=\"hl\">-s</b> — у длинных слов и слов на -el, -en, -er: <i>des Oberschenkel<b>s</b></i>, <i>des Magen<b>s</b></i>;<br>\n      • у коротких часто можно и так, и так: <i>des Arm<b>s</b></i> и <i>des Arm<b>es</b></i>, <i>des Gelenk<b>s</b></i> и <i>des Gelenk<b>es</b></i>.<br><br>\n      Исключения: <b>n-Deklination</b> (урок 36) — <i>des Patient<b>en</b></i>, без -s; <b>das Herz</b> — <i>des Herz<b>ens</b></i>; латинские слова на -us — без окончания: <i>des Meniskus</i>.","текст":"У мужского и среднего рода к самому существительному добавляется окончание: • -es — после s, ß, z, sch, x (иначе не выговорить) и обычно у коротких слов в один слог: des Fußes, des Halses, des Kopfes; • -s — у длинных слов и слов на -el, -en, -er: des Oberschenkels, des Magens; • у коротких часто можно и так, и так: des Arms и des Armes, des Gelenks и des Gelenkes. Исключения: n-Deklination (урок 36) — des Patienten, без -s; das Herz — des Herzens; латинские слова на -us — без окончания: des Meniskus.","ти":4,"пи":4,"подтема":"Genitiv: чей?"},{"id":"e58b412a76","тема":"Падежи","знак":"📦","вид":"правило","раздел":"⭐ Вопрос Полины: seins и Genitiv","урок":"polya18","урокИмя":"Занятие 18 Полины","html":"Слово <i>Spielzeug</i> во второй фразе <b>опущено</b>. Тогда притяжательное встаёт <b>вместо существительного</b> и берёт себе окончание, которое показывало бы род: <i>das Spielzeug → <b>seins</b></i> (как <i>dies<b>es</b></i>). Если вернуть слово — снова обычное <i>sein Spielzeug</i>.<br>\n      Даша: «Это немножко другая тема, её ещё пройдём. Пока просто запиши предложение со словом Spielzeug — так будет понятно».","текст":"Слово Spielzeug во второй фразе опущено. Тогда притяжательное встаёт вместо существительного и берёт себе окончание, которое показывало бы род: das Spielzeug → seins (как dieses). Если вернуть слово — снова обычное sein Spielzeug. Даша: «Это немножко другая тема, её ещё пройдём. Пока просто запиши предложение со словом Spielzeug — так будет понятно».","ти":4,"пи":4,"подтема":"Genitiv: чей?"},{"id":"6ba1bd1a97","тема":"Падежи","знак":"📦","вид":"правило","раздел":"⭐ Вопрос Полины: seins и Genitiv","урок":"polya18","урокИмя":"Занятие 18 Полины","html":"<b>Как ставить форму, по шагам (правило Даши):</b><br>\n      1. На притяжательное <b>сначала не смотрим</b>.<br>\n      2. Задаём вопрос к существительному: <i>Die Farbe — <b>wessen</b> Farbe?</i> — чей цвет? — платья. <i>Wessen</i> → значит <b>Genitiv</b>.<br>\n      3. Притяжательное стоит на месте артикля — значит, ставим его в ту же форму, что и артикль: <i>d<b>es</b> Kleides → ihr<b>es</b> Kleides, mein<b>es</b> Kleides</i>.<br>\n      По-русски то же самое: «цвет мо<b>его</b> платья» — «мой» тоже меняет окончание.","текст":"Как ставить форму, по шагам (правило Даши): 1. На притяжательное сначала не смотрим. 2. Задаём вопрос к существительному: Die Farbe — wessen Farbe? — чей цвет? — платья. Wessen → значит Genitiv. 3. Притяжательное стоит на месте артикля — значит, ставим его в ту же форму, что и артикль: des Kleides → ihres Kleides, meines Kleides. По-русски то же самое: «цвет моего платья» — «мой» тоже меняет окончание.","ти":4,"пи":4,"подтема":"Genitiv: чей?"},{"id":"4dbf203757","тема":"Произношение и письмо","знак":"🗣","вид":"правило","раздел":"abends, montags — «по вечерам», «по понедельникам»","урок":"polya11","урокИмя":"Занятие 11 Полины","html":"Даша прервала перевод, чтобы объяснить слово <b>abends</b>. Правило простое: берём существительное — оно пишется с большой буквы, — пишем его <span class=\"hl\">с маленькой и добавляем -s</span>. Получается «по …».<br><br>\n      <b>der Abend</b> (вечер) → <b>abends</b> (по вечерам). Так же с утром, ночью и днями недели — это пригодится в домашке (задание 8).","текст":"Даша прервала перевод, чтобы объяснить слово abends. Правило простое: берём существительное — оно пишется с большой буквы, — пишем его с маленькой и добавляем -s. Получается «по …». der Abend (вечер) → abends (по вечерам). Так же с утром, ночью и днями недели — это пригодится в домашке (задание 8).","ти":4,"пи":4,"подтема":"Genitiv: чей?"},{"id":"f069ca5c99","тема":"Разное","знак":"📎","вид":"правило","раздел":"⭐ Чьё? — просто добавь -s","урок":"dasha10","урокИмя":"Занятие 10 с Дашей","html":"Чтобы сказать «папины очки», «дедушкины очки», к имени или слову «папа/мама/дедушка» прибавляют <b>-s</b> — и ставят его <b>перед</b> предметом. Без апострофа!<br>\n      <i>Opa</i> (дедушка) + <b>s</b> → <i><b>Opas</b> Brille</i> — очки дедушки. <i><b>Peters</b> Vater</i> — отец Петера. <i><b>Gerdas</b> Familienname</i> — фамилия Герды.<br>\n      Гриша: «а то я думал, опять какое-нибудь правило с исключениями». Даша: тут легко — прибавляем -s, и всё.","текст":"Чтобы сказать «папины очки», «дедушкины очки», к имени или слову «папа/мама/дедушка» прибавляют -s — и ставят его перед предметом. Без апострофа! Opa (дедушка) + s → Opas Brille — очки дедушки. Peters Vater — отец Петера. Gerdas Familienname — фамилия Герды. Гриша: «а то я думал, опять какое-нибудь правило с исключениями». Даша: тут легко — прибавляем -s, и всё.","ти":4,"пи":4,"подтема":"Genitiv: чей?"},{"id":"08cdeba338","тема":"Числа, время, даты","знак":"🔢","вид":"ловушка","раздел":"⚠️ Ловушка вторая: этажи сдвинуты на один","урок":"urok15","урокИмя":"Урок 16","html":"<span class=\"big\">der erste Stock — это наш ВТОРОЙ этаж</span>\n      Первый этаж у немцев не считается «первым»: он называется <b>das Erdgeschoss</b> (буквально «земляной этаж»). Счёт начинается с того, что выше:<br><br>\n      Erdgeschoss = наш 1-й &nbsp;·&nbsp; erster Stock = наш 2-й &nbsp;·&nbsp; zweiter Stock = наш 3-й<br><br>\n      Ты это уже видел в уроке 5 с порядковыми числами. Здесь оно становится практическим: «квартира im dritten Stock» — это подъём на четыре этажа. Без лифта — существенно.","текст":"der erste Stock — это наш ВТОРОЙ этаж Первый этаж у немцев не считается «первым»: он называется das Erdgeschoss (буквально «земляной этаж»). Счёт начинается с того, что выше: Erdgeschoss = наш 1-й &nbsp;·&nbsp; erster Stock = наш 2-й &nbsp;·&nbsp; zweiter Stock = наш 3-й Ты это уже видел в уроке 5 с порядковыми числами. Здесь оно становится практическим: «квартира im dritten Stock» — это подъём на четыре этажа. Без лифта — существенно.","ти":4,"пи":5,"подтема":"Глаголы, которые требуют падеж"},{"id":"b84a8896bf","тема":"Числа, время, даты","знак":"🔢","вид":"ловушка","раздел":"⚠️ Ловушка третья, самая дорогая: Kaltmiete или Warmmiete","урок":"urok15","урокИмя":"Урок 16","html":"<span class=\"big\">В объявлении почти всегда пишут холодную — она меньше</span>\n      <b>Kaltmiete</b> [кальтмитэ] — «холодная» аренда, <b>только за квадратные метры</b>. Отопление, вода, вывоз мусора сюда НЕ входят.<br>\n      <b>Nebenkosten</b> [нэбэнкостэн] — те самые «побочные расходы» сверху, обычно 150–350 € в месяц.<br>\n      <b>Warmmiete</b> [вармитэ] — «тёплая», то есть Kaltmiete + Nebenkosten. <b>Вот это ты реально платишь.</b><br><br>\n      И третья сумма при въезде: <b>Kaution</b> (залог) — по закону до трёх холодных аренд, возвращается при выезде. То есть на старте нужно иметь примерно четыре месячных платежа сразу.","текст":"В объявлении почти всегда пишут холодную — она меньше Kaltmiete [кальтмитэ] — «холодная» аренда, только за квадратные метры. Отопление, вода, вывоз мусора сюда НЕ входят. Nebenkosten [нэбэнкостэн] — те самые «побочные расходы» сверху, обычно 150–350 € в месяц. Warmmiete [вармитэ] — «тёплая», то есть Kaltmiete + Nebenkosten. Вот это ты реально платишь. И третья сумма при въезде: Kaution (залог) — по закону до трёх холодных аренд, возвращается при выезде. То есть на старте нужно иметь примерно четыре месячных платежа сразу.","ти":4,"пи":5,"подтема":"Глаголы, которые требуют падеж"},{"id":"4fe3497bdf","тема":"Числа, время, даты","знак":"🔢","вид":"ловушка","раздел":"ГЛАВНАЯ ЛОВУШКА: числа «задом наперёд»","урок":"urok5","урокИмя":"Урок 6","html":"В двузначных немцы называют <b>сначала единицы, потом десятки</b>, через <b>und</b> (и). 24 = буквально «четыре-и-двадцать» → <b>vierundzwanzig</b>. Всё одним словом. И eins теряет -s: 21 = <b>einundzwanzig</b>.","текст":"В двузначных немцы называют сначала единицы, потом десятки, через und (и). 24 = буквально «четыре-и-двадцать» → vierundzwanzig. Всё одним словом. И eins теряет -s: 21 = einundzwanzig.","ти":4,"пи":5,"подтема":"Глаголы, которые требуют падеж"},{"id":"452d536327","тема":"Падежи","знак":"📦","вид":"правило","раздел":"⚠️ Ловушки: anrufen, gefallen, danken","урок":"polya15","урокИмя":"Занятие 15 Полины","html":"Глаголы с <b>Dativ</b> из занятия — тут совпадает с русским «кому»:<br>\n      • <b>helfen</b> — помогать: <i>Er hilft <b>mir</b></i>;<br>\n      • <b>danken</b> — благодарить: <i>Wir danken <b>ihm</b></i> (по-русски «благодарим <b>его</b>», а по-немецки — кому!);<br>\n      • <b>gefallen</b> — нравиться: <i>Das gefällt <b>uns</b></i> — «это нравится нам». Не путать с <i>fallen</i> — «падать».<br>\n      Новое слово: <b>die Unterstützung</b> — поддержка, от глагола <b>unterstützen</b> — поддерживать. Даша: «очень хорошее слово, запишите».","текст":"Глаголы с Dativ из занятия — тут совпадает с русским «кому»: • helfen — помогать: Er hilft mir; • danken — благодарить: Wir danken ihm (по-русски «благодарим его», а по-немецки — кому!); • gefallen — нравиться: Das gefällt uns — «это нравится нам». Не путать с fallen — «падать». Новое слово: die Unterstützung — поддержка, от глагола unterstützen — поддерживать. Даша: «очень хорошее слово, запишите».","ти":4,"пи":5,"подтема":"Глаголы, которые требуют падеж"},{"id":"9ad4ea9eda","тема":"Падежи","знак":"📦","вид":"ловушка","раздел":"⚠️ Ловушки: anrufen, gefallen, danken","урок":"polya15","урокИмя":"Занятие 15 Полины","html":"<span class=\"big\">anrufen — с Akkusativ</span>\n      По-русски «звонить <b>ему</b>» (кому? — дательный). По-немецки <b>anrufen + Akkusativ</b>: <i>Ich rufe <b>ihn</b> an</i>, а не «ihm». Даша объяснила логику: глагол образован от <i>rufen</i> — «звать», а звать — <b>кого</b>. Полина на занятии сказала «им» — это как раз эта ловушка.","текст":"anrufen — с Akkusativ По-русски «звонить ему» (кому? — дательный). По-немецки anrufen + Akkusativ: Ich rufe ihn an, а не «ihm». Даша объяснила логику: глагол образован от rufen — «звать», а звать — кого. Полина на занятии сказала «им» — это как раз эта ловушка.","ти":4,"пи":5,"подтема":"Глаголы, которые требуют падеж"},{"id":"21ff533bf9","тема":"Падежи","знак":"📦","вид":"ловушка","раздел":"⚠️ Ловушка вторая: mich или mir","урок":"urok18","урокИмя":"Урок 19","html":"<span class=\"big\">Появилось второе дополнение — местоимение уходит в Dativ</span>\n      Смотри на пару. Если после глагола <b>больше ничего нет</b> — обычная форма (Akkusativ):<br>\n      <i>Ich wasche <b>mich</b>.</i> — Я моюсь.<br><br>\n      Но если в предложении есть <b>то, что моют</b> — местоимение отходит в сторону и встаёт в <b class=\"hl\">Dativ</b>:<br>\n      <i>Ich wasche <b>mir</b> die Hände.</i> — Я мою себе руки.<br><br>\n      Логика: «руки» заняли место прямого дополнения, «себе» досталась роль адресата. Меняются <b>только два</b> местоимения: <b>mich → mir</b>, <b>dich → dir</b>. Все остальные (<i>sich, uns, euch</i>) выглядят одинаково — их и думать не надо.","текст":"Появилось второе дополнение — местоимение уходит в Dativ Смотри на пару. Если после глагола больше ничего нет — обычная форма (Akkusativ): Ich wasche mich. — Я моюсь. Но если в предложении есть то, что моют — местоимение отходит в сторону и встаёт в Dativ: Ich wasche mir die Hände. — Я мою себе руки. Логика: «руки» заняли место прямого дополнения, «себе» досталась роль адресата. Меняются только два местоимения: mich → mir, dich → dir. Все остальные (sich, uns, euch) выглядят одинаково — их и думать не надо.","ти":4,"пи":5,"подтема":"Глаголы, которые требуют падеж"},{"id":"0c1f774c84","тема":"Произношение и письмо","знак":"🗣","вид":"правило","раздел":"Числа: ловушки произношения","урок":"dasha1","урокИмя":"Занятие 1 с Дашей","html":"Буква <b class=\"hl\">v</b> называется «фау» и читается как <b>ф</b>: <i>vier</i> [фиа], <i>vierzig</i> [фирцихь]. Не «в»!","текст":"Буква v называется «фау» и читается как ф: vier [фиа], vierzig [фирцихь]. Не «в»!","ти":4,"пи":5,"подтема":"Глаголы, которые требуют падеж"},{"id":"2e0f941856","тема":"Произношение и письмо","знак":"🗣","вид":"ловушка","раздел":"Числа: ловушки произношения","урок":"dasha1","урокИмя":"Занятие 1 с Дашей","html":"<span class=\"big\">Даша делала на этом отдельный акцент</span>\n      Три числа меняют звучание внутри производных: <b>sechs</b> [зэкс] → но <b>sechzehn</b> [зэхьцэн], <b>sechzig</b> [зэхьцихь] (звук «с» выпадает). <b>sieben</b> → теряет <b>-en</b>: <b>siebzehn</b>, <b>siebzig</b>. И <b>dreißig</b> — единственный десяток через <b>-ßig</b>, а не -zig.","текст":"Даша делала на этом отдельный акцент Три числа меняют звучание внутри производных: sechs [зэкс] → но sechzehn [зэхьцэн], sechzig [зэхьцихь] (звук «с» выпадает). sieben → теряет -en: siebzehn, siebzig. И dreißig — единственный десяток через -ßig, а не -zig.","ти":4,"пи":5,"подтема":"Глаголы, которые требуют падеж"},{"id":"1d025e0567","тема":"Произношение и письмо","знак":"🗣","вид":"ловушка","раздел":"⚠️ Три ловушки в профессиях","урок":"polya8","урокИмя":"Занятие 8 Полины","html":"<span class=\"big\">Гласная в корне меняется на умляут</span>\n      <b>der Arzt</b> → <b>die Ärztin</b> (a → ä)<br>\n      <b>der Koch</b> → <b>die Köchin</b> (o → ö)<br><br>\n      Даша отдельно предупредила про <b>Verkäufer</b>: сочетание <b>äu</b> читается как <b>«ой»</b>,\n      получается «фэркойфа», а не «фэркауфэр».","текст":"Гласная в корне меняется на умляут der Arzt → die Ärztin (a → ä) der Koch → die Köchin (o → ö) Даша отдельно предупредила про Verkäufer: сочетание äu читается как «ой», получается «фэркойфа», а не «фэркауфэр».","ти":4,"пи":5,"подтема":"Глаголы, которые требуют падеж"},{"id":"e97065d5a1","тема":"Слова, которые путают","знак":"⚠️","вид":"ловушка","раздел":"⚠️ Разговорное время — ЛОВУШКА halb","урок":"urok10","урокИмя":"Урок 11","html":"<span class=\"big\">halb zehn = 9:30, а НЕ 10:30!</span><br>\n      Немцы считают половину <b>до</b> следующего часа: <b>halb zehn</b> = «половина к десяти» = 9:30. Не «половина десятого», как у нас! Всегда думай на час вперёд.","текст":"halb zehn = 9:30, а НЕ 10:30! Немцы считают половину до следующего часа: halb zehn = «половина к десяти» = 9:30. Не «половина десятого», как у нас! Всегда думай на час вперёд.","ти":4,"пи":5,"подтема":"Глаголы, которые требуют падеж"},{"id":"5179a2b442","тема":"Слова, которые путают","знак":"⚠️","вид":"ловушка","раздел":"⚠️ Ловушка первая: в объявлении «3 комнаты» — это не то, что ты подумал","урок":"urok15","урокИмя":"Урок 16","html":"<span class=\"big\">Кухня и ванная в счёт НЕ входят</span>\n      <b>Dreizimmerwohnung</b> — это <b>три жилые комнаты</b> ПЛЮС кухня, ванная и коридор. То есть по-русски это скорее «трёшка», а не «три комнаты вместе с кухней». Если ищешь как в России — ошибёшься на целую комнату и переплатишь.<br><br>\n      Отсюда и странная на первый взгляд запись в объявлениях: <i>«3 Zimmer, Küche, Bad»</i> — кухню и ванную перечисляют отдельно именно потому, что они не считаются.","текст":"Кухня и ванная в счёт НЕ входят Dreizimmerwohnung — это три жилые комнаты ПЛЮС кухня, ванная и коридор. То есть по-русски это скорее «трёшка», а не «три комнаты вместе с кухней». Если ищешь как в России — ошибёшься на целую комнату и переплатишь. Отсюда и странная на первый взгляд запись в объявлениях: «3 Zimmer, Küche, Bad» — кухню и ванную перечисляют отдельно именно потому, что они не считаются.","ти":4,"пи":5,"подтема":"Глаголы, которые требуют падеж"},{"id":"367e4300f9","тема":"Разное","знак":"📎","вид":"ловушка","раздел":"Книги от друга","урок":"polya7","урокИмя":"Занятие 7 Полины","html":"<span class=\"big\">Ловушка чтения: lese — это не «Лиза»</span>\n      Полина честно призналась, что читала <i>lese</i> как имя «Лиза» и не могла понять, при чём тут какая-то Лиза. Это глагол <b>lesen</b> — читать. <i>Nun <b>lese</b> ich sehr gerne</i> — «теперь я читаю с большим удовольствием».","текст":"Ловушка чтения: lese — это не «Лиза» Полина честно призналась, что читала lese как имя «Лиза» и не могла понять, при чём тут какая-то Лиза. Это глагол lesen — читать. Nun lese ich sehr gerne — «теперь я читаю с большим удовольствием».","ти":4,"пи":5,"подтема":"Глаголы, которые требуют падеж"},{"id":"13bcd44411","тема":"Разное","знак":"📎","вид":"правило","раздел":"⚠️ Разговорное время — ЛОВУШКА halb","урок":"urok10","урокИмя":"Урок 11","html":"Ещё разговорные: <b class=\"hl\">Viertel nach</b> (четверть после) = :15, <b class=\"hl\">Viertel vor</b> (четверть до) = :45. <i>Viertel nach neun</i> = 9:15, <i>Viertel vor zehn</i> = 9:45. <b>nach</b> = после, <b>vor</b> = до.","текст":"Ещё разговорные: Viertel nach (четверть после) = :15, Viertel vor (четверть до) = :45. Viertel nach neun = 9:15, Viertel vor zehn = 9:45. nach = после, vor = до.","ти":4,"пи":5,"подтема":"Глаголы, которые требуют падеж"},{"id":"a223b5eee5","тема":"Разное","знак":"📎","вид":"правило","раздел":"Ловушки чисел","урок":"urok2","урокИмя":"Урок 3","html":"В двух числах буквы выпадают: <b>sechzehn</b> (16) — без <i>s</i>, <b>siebzehn</b> (17) — без <i>-en</i>. Пишут и говорят именно так.<br><br>\n      «Один» бывает двух видов: <b>eins</b> — когда после числа ничего нет (<i>Zimmer eins</i> — кабинет один), и <b>ein / eine</b> — перед словом (<i>ein Kind</i> — один ребёнок).<br><br>\n      <b class=\"hl\">По телефону</b> вместо <i>zwei</i> часто говорят <b>zwo</b>: <i>zwei</i> и <i>drei</i> в трубке звучат похоже.","текст":"В двух числах буквы выпадают: sechzehn (16) — без s, siebzehn (17) — без -en. Пишут и говорят именно так. «Один» бывает двух видов: eins — когда после числа ничего нет (Zimmer eins — кабинет один), и ein / eine — перед словом (ein Kind — один ребёнок). По телефону вместо zwei часто говорят zwo: zwei и drei в трубке звучат похоже.","ти":4,"пи":5,"подтема":"Глаголы, которые требуют падеж"},{"id":"a6f49831de","тема":"Разное","знак":"📎","вид":"правило","раздел":"⚠️ Ловушка: der Arzt — обычный","урок":"urok36","урокИмя":"Урок 37","html":"Не каждый мужчина-профессия слабый. <b>der Arzt, der Doktor, der Pfleger, der Lehrer</b> склоняются <b>обычно</b>: <i>den Arzt</i>, <i>dem Arzt</i>, <i>des Arztes</i>. Сравните в парах:","текст":"Не каждый мужчина-профессия слабый. der Arzt, der Doktor, der Pfleger, der Lehrer склоняются обычно: den Arzt, dem Arzt, des Arztes. Сравните в парах:","ти":4,"пи":5,"подтема":"Глаголы, которые требуют падеж"},{"id":"430aa63050","тема":"Разное","знак":"📎","вид":"правило","раздел":"«У меня есть» — и там, где по-русски «быть»","урок":"urok4","урокИмя":"Урок 5","html":"Русское «у меня есть» — это <b>ich habe</b>: <i>Ich habe Zeit</i> — у меня есть время.<br><br>\n      <b class=\"hl\">Ловушка:</b> немцы «имеют» и то, чем мы «являемся»: не «я голоден», а «я имею голод» — <i>Ich habe Hunger</i>. Так же <i>Durst</i> (жажда), <i>Angst</i> (страх), <i>Zeit</i> (время).","текст":"Русское «у меня есть» — это ich habe: Ich habe Zeit — у меня есть время. Ловушка: немцы «имеют» и то, чем мы «являемся»: не «я голоден», а «я имею голод» — Ich habe Hunger. Так же Durst (жажда), Angst (страх), Zeit (время).","ти":4,"пи":5,"подтема":"Глаголы, которые требуют падеж"},{"id":"45a265c7c7","тема":"Предлоги","знак":"🧭","вид":"правило","раздел":"9 предлогов места","урок":"urok11","урокИмя":"Урок 12","html":"Отвечают на вопрос <b class=\"hl\">Wo?</b> (где?). Представь предмет и коробку: предлог говорит, где предмет относительно неё.","текст":"Отвечают на вопрос Wo? (где?). Представь предмет и коробку: предлог говорит, где предмет относительно неё.","ти":5,"пи":0,"подтема":"Предлоги места"},{"id":"1a747b3de6","тема":"Предлоги","знак":"🧭","вид":"правило","раздел":"Девять предлогов двойного действия","урок":"urok17","урокИмя":"Урок 18","html":"Их называют <b class=\"hl\">Wechselpräpositionen</b> — «предлоги-переключатели». Только эти девять умеют менять падеж. Все остальные предлоги закреплены за одним падежом навсегда (раздел 8).<br><br>\n      Хорошая новость: список ты уже знаешь наизусть из урока 11.","текст":"Их называют Wechselpräpositionen — «предлоги-переключатели». Только эти девять умеют менять падеж. Все остальные предлоги закреплены за одним падежом навсегда (раздел 8). Хорошая новость: список ты уже знаешь наизусть из урока 11.","ти":5,"пи":0,"подтема":"Предлоги места"},{"id":"0077c166df","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"⭐ um … zu — «чтобы»","урок":"urok39","урокИмя":"Урок 40","html":"<b class=\"hl\">um … zu</b> отвечает на вопрос <b>«зачем?»</b>. <b>um</b> стоит в начале оборота, <b>zu + инфинитив</b> — в конце. Оборот может стоять и первым — тогда глагол главного предложения сразу после запятой: <i>Um die Diagnose zu sichern, <b>brauchen</b> wir …</i>","текст":"um … zu отвечает на вопрос «зачем?». um стоит в начале оборота, zu + инфинитив — в конце. Оборот может стоять и первым — тогда глагол главного предложения сразу после запятой: Um die Diagnose zu sichern, brauchen wir …","ти":5,"пи":1,"подтема":"Предлоги времени: am, um, im, seit, vor"},{"id":"28f0a2c4f5","тема":"Числа, время, даты","знак":"🔢","вид":"правило","раздел":"Времена года и месяцы — предлог im","урок":"dasha1","урокИмя":"Занятие 1 с Дашей","html":"Все времена года и все месяцы — <b class=\"hl\">мужского рода (der)</b>. С ними используем предлог <b class=\"hl\">im</b>.","текст":"Все времена года и все месяцы — мужского рода (der). С ними используем предлог im.","ти":5,"пи":1,"подтема":"Предлоги времени: am, um, im, seit, vor"},{"id":"0b6f5e64a3","тема":"Числа, время, даты","знак":"🔢","вид":"правило","раздел":"Официальное время (24 часа) — для расписаний","урок":"urok10","урокИмя":"Урок 11","html":"В расписаниях, у врача, на вокзале — <b>всегда 24 часа</b>, и читается просто: <b class=\"hl\">часы + Uhr + минуты</b>. 14:30 = <i>vierzehn Uhr dreißig</i>. Ошибиться невозможно — это твой рабочий формат.","текст":"В расписаниях, у врача, на вокзале — всегда 24 часа, и читается просто: часы + Uhr + минуты. 14:30 = vierzehn Uhr dreißig. Ошибиться невозможно — это твой рабочий формат.","ти":5,"пи":1,"подтема":"Предлоги времени: am, um, im, seit, vor"},{"id":"f7b8aeefe5","тема":"Числа, время, даты","знак":"🔢","вид":"правило","раздел":"im + месяц или сезон, вопрос Wann?","урок":"urok6","урокИмя":"Урок 7","html":"«В каком-то месяце или сезоне» — <b>im</b> + слово: <i>im Mai, im Sommer</i>. Вопрос «когда?» — <b>Wann?</b>","текст":"«В каком-то месяце или сезоне» — im + слово: im Mai, im Sommer. Вопрос «когда?» — Wann?","ти":5,"пи":1,"подтема":"Предлоги времени: am, um, im, seit, vor"},{"id":"4ecf530955","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"Время суток","урок":"dasha1","урокИмя":"Занятие 1 с Дашей","html":"Все части суток — <b class=\"hl\">мужского рода (der)</b>, кроме ночи: <b class=\"hl\">die Nacht</b>. Логика приставок: <b>vor</b> = до, <b>nach</b> = после → <i>Vormittag</i> / <i>Nachmittag</i> от <i>Mittag</i>.","текст":"Все части суток — мужского рода (der), кроме ночи: die Nacht. Логика приставок: vor = до, nach = после → Vormittag / Nachmittag от Mittag.","ти":5,"пи":1,"подтема":"Предлоги времени: am, um, im, seit, vor"},{"id":"2a82306e60","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"⚠️ zu Hause и nach Hause — маленькая тема, которую все путают","урок":"dasha3","урокИмя":"Занятие 3 с Дашей","html":"Слово <b class=\"hl\">das Haus</b> — дом, средний род, пишется без всяких окончаний.<br><br>\n      Но есть два предлога, <b>zu</b> и <b>nach</b>, в паре с которыми это слово <b class=\"hl\">отращивает на конце -e</b> и превращается фактически в наречие. Получаются две устойчивые формы, которые надо просто запомнить:\n    </div>\n    <table class=\"casetab\">\n      <tr><th>Форма</th><th>Значение</th><th>Вопрос</th></tr>\n      <tr><td><b>zu Hause</b></td><td>дома</td><td class=\"wo\">где?</td></tr>\n      <tr><td><b>nach Hause</b></td><td>домой</td><td class=\"wohin\">куда?</td></tr>\n    </table>\n    <div class=\"grammar-box\" style=\"margin-top:14px\">\n      Логика простая: <b>nach</b> — предлог направления (куда-то движемся), поэтому <i>nach Hause</i> = домой. А <b>zu</b> тут про нахождение, поэтому <i>zu Hause</i> = дома.","текст":"Слово das Haus — дом, средний род, пишется без всяких окончаний. Но есть два предлога, zu и nach, в паре с которыми это слово отращивает на конце -e и превращается фактически в наречие. Получаются две устойчивые формы, которые надо просто запомнить: ФормаЗначениеВопрос zu Hauseдомагде? nach Hauseдомойкуда? Логика простая: nach — предлог направления (куда-то движемся), поэтому nach Hause = домой. А zu тут про нахождение, поэтому zu Hause = дома.","ти":5,"пи":1,"подтема":"Предлоги времени: am, um, im, seit, vor"},{"id":"083070922a","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"Дни недели (die Woche)","урок":"urok10","урокИмя":"Урок 11","html":"Все дни — <b class=\"hl\">мужского рода (der)</b>. «В такой-то день» = <b class=\"hl\">am</b> + день: <i>am Montag</i> (в понедельник). Вопрос: <b>Wann?</b> (когда?)","текст":"Все дни — мужского рода (der). «В такой-то день» = am + день: am Montag (в понедельник). Вопрос: Wann? (когда?)","ти":5,"пи":1,"подтема":"Предлоги времени: am, um, im, seit, vor"},{"id":"222c154693","тема":"Падежи","знак":"📦","вид":"правило","раздел":"Описываем фото: am Flughafen","урок":"polya19","урокИмя":"Занятие 19 Полины","html":"<b>Почему am Flughafen, а не in dem Flughafen?</b> Полина сказала <i>Der Mann geht in dem Flughafen</i>. Даша: с вокзалом и аэропортом говорим <b>am</b> — <i>am Flughafen, am Bahnhof</i> («в аэропорту», «на вокзале»). Он там <b>находится</b> — вопрос <i>wo?</i>, поэтому Dativ: <i>an + dem = am</i>.<br>\n      Первый раз — <i>ein<b>en</b> Mann</i> (какого-то), второй раз уже знакомый — <i><b>der</b> Mann</i>.<br>\n      <i>in der Hand</i> — в руке: запомнить выражением.","текст":"Почему am Flughafen, а не in dem Flughafen? Полина сказала Der Mann geht in dem Flughafen. Даша: с вокзалом и аэропортом говорим am — am Flughafen, am Bahnhof («в аэропорту», «на вокзале»). Он там находится — вопрос wo?, поэтому Dativ: an + dem = am. Первый раз — einen Mann (какого-то), второй раз уже знакомый — der Mann. in der Hand — в руке: запомнить выражением.","ти":5,"пи":1,"подтема":"Предлоги времени: am, um, im, seit, vor"},{"id":"82f4dc8719","тема":"Предлоги","знак":"🧭","вид":"правило","раздел":"Дни недели — предлог am","урок":"dasha1","урокИмя":"Занятие 1 с Дашей","html":"Все дни — <b class=\"hl\">мужского рода</b>, потому что заканчиваются на <b>-tag</b> (der Tag). Правило: если слово оканчивается на другое слово, род берётся по нему.<br><br>\n      <b>Смысл названий:</b> <i>Mittwoch</i> = Mitte + Woche («середина недели», единственный без -tag) · <i>Freitag</i> от <i>frei</i> («свободный день») · <i>Sonntag</i> от <i>Sonne</i> («солнечный день»).","текст":"Все дни — мужского рода, потому что заканчиваются на -tag (der Tag). Правило: если слово оканчивается на другое слово, род берётся по нему. Смысл названий: Mittwoch = Mitte + Woche («середина недели», единственный без -tag) · Freitag от frei («свободный день») · Sonntag от Sonne («солнечный день»).","ти":5,"пи":1,"подтема":"Предлоги времени: am, um, im, seit, vor"},{"id":"df570fd3db","тема":"Предлоги","знак":"🧭","вид":"ловушка","раздел":"Дни недели — предлог am","урок":"dasha1","урокИмя":"Занятие 1 с Дашей","html":"<span class=\"big\">Не путай предлоги!</span>\n      Месяцы и времена года → <b>im</b> (im Winter, im Juli). Дни недели → <b>am</b> (am Montag, am Freitag).","текст":"Не путай предлоги! Месяцы и времена года → im (im Winter, im Juli). Дни недели → am (am Montag, am Freitag).","ти":5,"пи":1,"подтема":"Предлоги времени: am, um, im, seit, vor"},{"id":"c279860026","тема":"Предлоги","знак":"🧭","вид":"ловушка","раздел":"⚠️ vor и nach — как немцы считают время","урок":"polya7","урокИмя":"Занятие 7 Полины","html":"<span class=\"big\">vor = «до», поэтому «vor zwei Tagen» это два дня НАЗАД</span>\n      Предлог <b>vor</b> буквально означает «перед, до». Отсюда логика, которая сначала сбивает:<br><br>\n      <b>vor zwei Tagen</b> — два дня <b>назад</b> (буквально «до двух дней»)<br>\n      <b>nach zwei Tagen</b> — <b>через</b> два дня, после<br><br>\n      Полина как раз споткнулась на «почему назад?» — Даша объяснила: «ну типа, два дня до этого».","текст":"vor = «до», поэтому «vor zwei Tagen» это два дня НАЗАД Предлог vor буквально означает «перед, до». Отсюда логика, которая сначала сбивает: vor zwei Tagen — два дня назад (буквально «до двух дней») nach zwei Tagen — через два дня, после Полина как раз споткнулась на «почему назад?» — Даша объяснила: «ну типа, два дня до этого».","ти":5,"пи":1,"подтема":"Предлоги времени: am, um, im, seit, vor"},{"id":"55ba19f32b","тема":"Предлоги","знак":"🧭","вид":"ловушка","раздел":"Когда это было? seit или vor","урок":"urok12","урокИмя":"Урок 13","html":"<span class=\"big\">Ловушка анамнеза: seit и vor</span>\n      <b>vor</b> + время = «… назад»: событие случилось и <b>закончилось</b> → <b>Perfekt</b>. <i>Die Schmerzen haben vor drei Tagen angefangen</i> — начались три дня назад.<br>\n      <b>seit</b> + время = «уже … (и до сих пор)»: всё ещё длится → <b>настоящее время</b>, не Perfekt! <i>Ich habe seit drei Tagen Schmerzen</i> — болит уже три дня. Русскоговорящие тут почти всегда ставят Perfekt.","текст":"Ловушка анамнеза: seit и vor vor + время = «… назад»: событие случилось и закончилось → Perfekt. Die Schmerzen haben vor drei Tagen angefangen — начались три дня назад. seit + время = «уже … (и до сих пор)»: всё ещё длится → настоящее время, не Perfekt! Ich habe seit drei Tagen Schmerzen — болит уже три дня. Русскоговорящие тут почти всегда ставят Perfekt.","ти":5,"пи":1,"подтема":"Предлоги времени: am, um, im, seit, vor"},{"id":"f0bad76732","тема":"Предлоги","знак":"🧭","вид":"правило","раздел":"Ещё четыре: sobald, bis, seit, solange","урок":"urok45","урокИмя":"Урок 46","html":"<b>sobald</b> — как только · <b>bis</b> — пока не, до тех пор пока · <b>seit / seitdem</b> — с тех пор как (действие идёт до сих пор, поэтому обычно Präsens) · <b>solange</b> — пока, всё то время пока. Порядок слов тот же: глагол в конец.","текст":"sobald — как только · bis — пока не, до тех пор пока · seit / seitdem — с тех пор как (действие идёт до сих пор, поэтому обычно Präsens) · solange — пока, всё то время пока. Порядок слов тот же: глагол в конец.","ти":5,"пи":1,"подтема":"Предлоги времени: am, um, im, seit, vor"},{"id":"732df1985e","тема":"Произношение и письмо","знак":"🗣","вид":"ловушка","раздел":"⚠️ Кто что сказал: Sibel и Artur","урок":"polya10","урокИмя":"Занятие 10 Полины","html":"<span class=\"big\">Честно: этот момент в записи смазан</span>\n      Было упражнение — послушать двух людей и понять, кто что сказал про <b>der Tisch</b> и <b>das Bett</b>. Прямо во время разбора Даша сама себя поправила («точно у нас praktisch про das Bett? ... да, там было der Tisch»). Итоговая привязка фраз к людям в записи не звучит однозначно — ниже сами фразы, а точное соответствие «кто сказал что» лучше сверить с оригинальным заданием на следующем занятии.","текст":"Честно: этот момент в записи смазан Было упражнение — послушать двух людей и понять, кто что сказал про der Tisch и das Bett. Прямо во время разбора Даша сама себя поправила («точно у нас praktisch про das Bett? ... да, там было der Tisch»). Итоговая привязка фраз к людям в записи не звучит однозначно — ниже сами фразы, а точное соответствие «кто сказал что» лучше сверить с оригинальным заданием на следующем занятии.","ти":5,"пи":1,"подтема":"Предлоги времени: am, um, im, seit, vor"},{"id":"56109c3a56","тема":"Разное","знак":"📎","вид":"правило","раздел":"Слова вокзала: Gepäck, Verkehrsmittel, im Bahnhof","урок":"polya19","урокИмя":"Занятие 19 Полины","html":"<b>die S-Bahn</b> — электричка. <b>S</b> = <i>Schnellbahn</i>, «скорая дорога»: <i>schnell</i> — быстро ↔ <i>langsam</i> — медленно (<i>Das Auto ist schnell / langsam</i>).<br>\n      <b>Haupt-</b> — главный: <i>der Hauptbahnhof</i> — главный вокзал, <i>der Hauptplatz</i> — главная площадь («она есть в каждом немецком и австрийском городе»). <i>der Platz</i> — место, площадь.<br>\n      <b>der Schalter</b> — окошко, стойка (касса, справочная).<br>\n      Не знаешь слово — спроси: <b>Was bedeutet …?</b> (от <i>bedeuten</i> — значить).","текст":"die S-Bahn — электричка. S = Schnellbahn, «скорая дорога»: schnell — быстро ↔ langsam — медленно (Das Auto ist schnell / langsam). Haupt- — главный: der Hauptbahnhof — главный вокзал, der Hauptplatz — главная площадь («она есть в каждом немецком и австрийском городе»). der Platz — место, площадь. der Schalter — окошко, стойка (касса, справочная). Не знаешь слово — спроси: Was bedeutet …? (от bedeuten — значить).","ти":5,"пи":1,"подтема":"Предлоги времени: am, um, im, seit, vor"},{"id":"127f30df38","тема":"Разное","знак":"📎","вид":"правило","раздел":"«Во сколько?» — um, gegen, von … bis, ab","урок":"urok10","урокИмя":"Урок 11","html":"Точное время — <b class=\"hl\">um</b>: <i>um acht Uhr</i>. Примерно — <b>gegen</b>: <i>gegen acht</i> (около восьми). Промежуток — <b>von … bis</b>: <i>von neun bis zwölf</i>. «Начиная с» — <b>ab</b>: <i>ab neun Uhr</i>. Вопрос: <b>Um wie viel Uhr?</b>","текст":"Точное время — um: um acht Uhr. Примерно — gegen: gegen acht (около восьми). Промежуток — von … bis: von neun bis zwölf. «Начиная с» — ab: ab neun Uhr. Вопрос: Um wie viel Uhr?","ти":5,"пи":1,"подтема":"Предлоги времени: am, um, im, seit, vor"},{"id":"5ebc9114c0","тема":"Разное","знак":"📎","вид":"правило","раздел":"⭐ um zu или damit?","урок":"urok39","урокИмя":"Урок 40","html":"Оба значат «чтобы». Правило одно:<br>\n      • <b>тот же человек</b> делает оба действия → <b>um … zu</b>: <i>Ich lerne, um … zu verstehen</i> (я учу — я понимаю);<br>\n      • <b>разные люди</b> → <b>damit</b> + обычное придаточное, глагол в конце: <i>Ich lerne, damit meine Patienten mich verstehen</i> (я учу — пациенты понимают).","текст":"Оба значат «чтобы». Правило одно: • тот же человек делает оба действия → um … zu: Ich lerne, um … zu verstehen (я учу — я понимаю); • разные люди → damit + обычное придаточное, глагол в конце: Ich lerne, damit meine Patienten mich verstehen (я учу — пациенты понимают).","ти":5,"пи":1,"подтема":"Предлоги времени: am, um, im, seit, vor"},{"id":"4a4d7d3977","тема":"Разное","знак":"📎","вид":"правило","раздел":"Подготовка и начало","урок":"urok53","урокИмя":"Урок 54","html":"Тихая комната, сидя, без спешки. Предложите позвать близких. Назовите время — учебник объясняет: это даёт пациенту <b>ориентир</b>, а понятная структура — чувство опоры.","текст":"Тихая комната, сидя, без спешки. Предложите позвать близких. Назовите время — учебник объясняет: это даёт пациенту ориентир, а понятная структура — чувство опоры.","ти":5,"пи":1,"подтема":"Предлоги времени: am, um, im, seit, vor"},{"id":"2d40222bf4","тема":"Разное","знак":"📎","вид":"правило","раздел":"День рождения","урок":"urok6","урокИмя":"Урок 7","html":"День рождения «имеют»: <i>Ich habe im Mai Geburtstag</i>. Поздравление — <b>Herzlichen Glückwunsch zum Geburtstag!</b> или короче <b>Alles Gute!</b>","текст":"День рождения «имеют»: Ich habe im Mai Geburtstag. Поздравление — Herzlichen Glückwunsch zum Geburtstag! или короче Alles Gute!","ти":5,"пи":1,"подтема":"Предлоги времени: am, um, im, seit, vor"},{"id":"e16e8b4594","тема":"Модальные глаголы","знак":"🔑","вид":"правило","раздел":"⭐ zu + Infinitiv","урок":"urok39","урокИмя":"Урок 40","html":"После многих глаголов и оборотов второй глагол идёт <b>в самый конец</b> с частицей <b class=\"hl\">zu</b>: <i>versuchen, vergessen, anfangen, aufhören, empfehlen, Zeit haben, Lust haben, es ist wichtig / nötig / verboten</i>. Перед оборотом обычно ставят запятую.<br>\n      ⚠️ После <b>модальных</b> (können, müssen, wollen, dürfen, sollen, möchten) <b>zu не нужно</b>: <i>Ich muss arbeiten</i>, а не «muss zu arbeiten».","текст":"После многих глаголов и оборотов второй глагол идёт в самый конец с частицей zu: versuchen, vergessen, anfangen, aufhören, empfehlen, Zeit haben, Lust haben, es ist wichtig / nötig / verboten. Перед оборотом обычно ставят запятую. ⚠️ После модальных (können, müssen, wollen, dürfen, sollen, möchten) zu не нужно: Ich muss arbeiten, а не «muss zu arbeiten».","ти":5,"пи":2,"подтема":"Всегда с Dativ / всегда с Akkusativ"},{"id":"376656bc79","тема":"Приставки","знак":"🔗","вид":"правило","раздел":"Отделяемые: zu в середине","урок":"urok39","урокИмя":"Урок 40","html":"У отделяемых глаголов <b>zu встаёт между приставкой и корнем</b> и пишется слитно: <i>an<b>zu</b>rufen, ein<b>zu</b>nehmen, auf<b>zu</b>stehen, ab<b>zu</b>nehmen</i>.","текст":"У отделяемых глаголов zu встаёт между приставкой и корнем и пишется слитно: anzurufen, einzunehmen, aufzustehen, abzunehmen.","ти":5,"пи":2,"подтема":"Всегда с Dativ / всегда с Akkusativ"},{"id":"53712a1836","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"⭐ arbeiten als / bei / in","урок":"dasha9","урокИмя":"Занятие 9 с Дашей","html":"Даша попросила записать два предлога:<br>\n      <b>als</b> — <i>кем</i> работаешь: <i>Ich arbeite <b>als</b> Schauspielerin</i> — работаю актрисой. После als профессия <b>без артикля</b>.<br>\n      <b>bei</b> — <i>на кого</i>: фирма или человек. <i>Ich arbeite <b>bei</b> Apple. Ich arbeite <b>bei</b> Hans</i> (у Ганса).<br>\n      <b>in / im</b> — <i>где</i>, место: <i>Ich arbeite <
