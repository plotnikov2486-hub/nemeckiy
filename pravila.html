b>im</b> Krankenhaus</i>. Больница — место, не фирма, поэтому не bei.","текст":"Даша попросила записать два предлога: als — кем работаешь: Ich arbeite als Schauspielerin — работаю актрисой. После als профессия без артикля. bei — на кого: фирма или человек. Ich arbeite bei Apple. Ich arbeite bei Hans (у Ганса). in / im — где, место: Ich arbeite im Krankenhaus. Больница — место, не фирма, поэтому не bei.","ти":5,"пи":2,"подтема":"Всегда с Dativ / всегда с Akkusativ"},{"id":"4ef42de9d7","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"🧱 Из чего сделано: aus Keramik, aus Metall","урок":"polya13","урокИмя":"Занятие 13 Полины","html":"<b>Материал — через предлог aus, и без артикля.</b><br>\n      <i>Der Teller ist <b>aus Keramik</b></i> — тарелка из керамики. <i>Das Messer ist <b>aus Metall</b></i> — нож из металла.<br><br>\n      Даша обратила внимание: это <span class=\"hl\">тот же самый aus</span>, что и в «Ich komme <b>aus</b> Russland» — «я из России». Один предлог и для страны, и для материала.<br><br>\n      ⚠️ Полина сказала <s>aus dem Metall</s> — с артиклем. Правильно <b>без артикля</b>: aus Metall, aus Glas, aus Keramik, aus Plastik. Артикль тут не нужен, речь о веществе вообще.","текст":"Материал — через предлог aus, и без артикля. Der Teller ist aus Keramik — тарелка из керамики. Das Messer ist aus Metall — нож из металла. Даша обратила внимание: это тот же самый aus, что и в «Ich komme aus Russland» — «я из России». Один предлог и для страны, и для материала. ⚠️ Полина сказала aus dem Metall — с артиклем. Правильно без артикля: aus Metall, aus Glas, aus Keramik, aus Plastik. Артикль тут не нужен, речь о веществе вообще.","ти":5,"пи":2,"подтема":"Всегда с Dativ / всегда с Akkusativ"},{"id":"13792f6393","тема":"Падежи","знак":"📦","вид":"правило","раздел":"🔧 Для чего нужен: benutzen für / zum","урок":"polya13","урокИмя":"Занятие 13 Полины","html":"<b>benutzen</b> — «использовать, пользоваться». Главный глагол этой разминки: <i>Ich <b>benutze</b> den Löffel für Tee</i>.<br><br>\n      Дальше два способа сказать «для чего»:<br>\n      • <b>für</b> + <span class=\"hl\">вещь</span> в Akkusativ: <i>für Brot</i>, <i>für Wein</i>, <i>für Obst</i> — «для хлеба, для вина, для фруктов».<br>\n      • <b>zum</b> + <span class=\"hl\">действие</span>: <i>zum Essen</i> — «для еды», <i>zum Wischen</i> — «для вытирания».","текст":"benutzen — «использовать, пользоваться». Главный глагол этой разминки: Ich benutze den Löffel für Tee. Дальше два способа сказать «для чего»: • für + вещь в Akkusativ: für Brot, für Wein, für Obst — «для хлеба, для вина, для фруктов». • zum + действие: zum Essen — «для еды», zum Wischen — «для вытирания».","ти":5,"пи":2,"подтема":"Всегда с Dativ / всегда с Akkusativ"},{"id":"80e3fcd5da","тема":"Падежи","знак":"📦","вид":"правило","раздел":"⭐⭐ Риски: Es kann zu … kommen","урок":"urok51","урокИмя":"Урок 52","html":"Главная формула беседы: <b>Es kann zu + Dativ + kommen</b> — «может возникнуть». После zu всегда дательный: zu <b>einer</b> Thrombose, zu <b>einem</b> Taubheitsgefühl, zu <b>blauen</b> Flecken. Частота — словами, от частого к редкому: <b>häufig</b> → <b>gelegentlich</b> → <b>selten</b> → <b>sehr selten</b>; точнее — «bei einem von hundert Patienten». Не обещайте «никаких рисков» и не пугайте: сначала частое и безобидное, потом редкое и серьёзное.","текст":"Главная формула беседы: Es kann zu + Dativ + kommen — «может возникнуть». После zu всегда дательный: zu einer Thrombose, zu einem Taubheitsgefühl, zu blauen Flecken. Частота — словами, от частого к редкому: häufig → gelegentlich → selten → sehr selten; точнее — «bei einem von hundert Patienten». Не обещайте «никаких рисков» и не пугайте: сначала частое и безобидное, потом редкое и серьёзное.","ти":5,"пи":2,"подтема":"Всегда с Dativ / всегда с Akkusativ"},{"id":"0f7dc1a0b4","тема":"Предлоги","знак":"🧭","вид":"правило","раздел":"Три приёма пищи","урок":"urok14","урокИмя":"Урок 15","html":"Все три — <b class=\"hl\">das</b>, запоминай пачкой. Приятная логика: <i>Mittag</i> = полдень, <i>Abend</i> = вечер, а <i>Essen</i> = еда. То есть «полдень-еда» и «вечер-еда».<br><br>\n      Предлог для «на завтрак / на обед» — <b class=\"hl\">zum</b>: <i>zum Frühstück</i>, <i>zum Mittagessen</i>. Это тот самый <i>zu + dem</i> из урока 11.","текст":"Все три — das, запоминай пачкой. Приятная логика: Mittag = полдень, Abend = вечер, а Essen = еда. То есть «полдень-еда» и «вечер-еда». Предлог для «на завтрак / на обед» — zum: zum Frühstück, zum Mittagessen. Это тот самый zu + dem из урока 11.","ти":5,"пи":2,"подтема":"Всегда с Dativ / всегда с Akkusativ"},{"id":"4b2c41dab3","тема":"Предлоги","знак":"🧭","вид":"правило","раздел":"⭐ Предлоги: wegen, trotz, während…","урок":"urok37","урокИмя":"Урок 38","html":"<b>wegen</b> — из-за · <b>trotz</b> — несмотря на · <b>während</b> — во время · <b>innerhalb</b> — в течение, внутри · <b>aufgrund</b> — на основании, вследствие · <b>statt</b> — вместо.<br>\n      Все они требуют Genitiv. <b>aufgrund</b> и <b>innerhalb</b> — слова письменные, в выписке встречаются постоянно.","текст":"wegen — из-за · trotz — несмотря на · während — во время · innerhalb — в течение, внутри · aufgrund — на основании, вследствие · statt — вместо. Все они требуют Genitiv. aufgrund и innerhalb — слова письменные, в выписке встречаются постоянно.","ти":5,"пи":2,"подтема":"Всегда с Dativ / всегда с Akkusativ"},{"id":"1e2bd97285","тема":"Произношение и письмо","знак":"🗣","вид":"ловушка","раздел":"🔧 Для чего нужен: benutzen für / zum","урок":"polya13","урокИмя":"Занятие 13 Полины","html":"<span class=\"big\">Честно про один момент</span>\n      На занятии прозвучал вопрос: «для вытирания — тоже für wischen?» — и ответ «да, просто für wischen». По-немецки так не говорят: глагол после für не ставят. Правильно <b>zum Wischen</b> (с большой буквы — глагол стал существительным) или <b>zum Abwischen</b>. Оставляю как есть в записи, но запоминать стоит правильный вариант.","текст":"Честно про один момент На занятии прозвучал вопрос: «для вытирания — тоже für wischen?» — и ответ «да, просто für wischen». По-немецки так не говорят: глагол после für не ставят. Правильно zum Wischen (с большой буквы — глагол стал существительным) или zum Abwischen. Оставляю как есть в записи, но запоминать стоит правильный вариант.","ти":5,"пи":2,"подтема":"Всегда с Dativ / всегда с Akkusativ"},{"id":"7bb46ca8f4","тема":"Разное","знак":"📎","вид":"правило","раздел":"Что-то сломалось — звоним хозяину","урок":"urok15","урокИмя":"Урок 16","html":"Мелкий ремонт в съёмной квартире обычно делает хозяин — ему и звонят. Мастер — <b class=\"hl\">der Handwerker</b>. И ещё одно немецкое правило: в домовых правилах (<i>Hausordnung</i>) почти всегда есть <b>Nachtruhe</b> — тишина обычно с 22 до 6 часов.","текст":"Мелкий ремонт в съёмной квартире обычно делает хозяин — ему и звонят. Мастер — der Handwerker. И ещё одно немецкое правило: в домовых правилах (Hausordnung) почти всегда есть Nachtruhe — тишина обычно с 22 до 6 часов.","ти":5,"пи":2,"подтема":"Всегда с Dativ / всегда с Akkusativ"},{"id":"42f36f9f37","тема":"Разное","знак":"📎","вид":"правило","раздел":"ohne … zu и statt … zu","урок":"urok39","урокИмя":"Урок 40","html":"<b class=\"hl\">ohne … zu</b> — «не делая, не сделав»: действие, которого не было, хотя стоило бы.<br>\n      <b class=\"hl\">statt … zu</b> (или anstatt) — «вместо того чтобы»: сделал одно вместо другого.","текст":"ohne … zu — «не делая, не сделав»: действие, которого не было, хотя стоило бы. statt … zu (или anstatt) — «вместо того чтобы»: сделал одно вместо другого.","ти":5,"пи":2,"подтема":"Всегда с Dativ / всегда с Akkusativ"},{"id":"0cbef1795b","тема":"Разное","знак":"📎","вид":"правило","раздел":"Руки и ноги (Arme und Beine)","урок":"urok9","урокИмя":"Урок 10","html":"По-немецки <b>der Arm</b> — вся рука от плеча, а кисть — <b>die Hand</b>. <b>das Bein</b> — вся нога, стопа — <b>der Fuß</b>. Бедро и голень — два разных слова: <i>der Oberschenkel</i> (верх) и <i>der Unterschenkel</i> (низ).","текст":"По-немецки der Arm — вся рука от плеча, а кисть — die Hand. das Bein — вся нога, стопа — der Fuß. Бедро и голень — два разных слова: der Oberschenkel (верх) и der Unterschenkel (низ).","ти":5,"пи":2,"подтема":"Всегда с Dativ / всегда с Akkusativ"},{"id":"1bffc137bc","тема":"Предлоги","знак":"🧭","вид":"правило","раздел":"⚠️ Глаголы без предлога","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"В русском мы говорим «играть <b>в</b> футбол», «играть <b>на</b> гитаре», «говорить <b>по</b>-немецки».\n      В немецком у этих двух глаголов <b>предлога нет вообще</b> — слово ставится сразу.","текст":"В русском мы говорим «играть в футбол», «играть на гитаре», «говорить по-немецки». В немецком у этих двух глаголов предлога нет вообще — слово ставится сразу.","ти":5,"пи":3,"подтема":"Глаголы с предлогом и без"},{"id":"01b3019df7","тема":"Предлоги","знак":"🧭","вид":"ловушка","раздел":"⚠️ Глаголы без предлога","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"<span class=\"big\">Запомнить два глагола</span>\n      <b>spielen</b> (играть) и <b>sprechen</b> (говорить) — всегда без предлога.\n      Русская привычка вставить «в» или «на» здесь только мешает.","текст":"Запомнить два глагола spielen (играть) и sprechen (говорить) — всегда без предлога. Русская привычка вставить «в» или «на» здесь только мешает.","ти":5,"пи":3,"подтема":"Глаголы с предлогом и без"},{"id":"5068577f53","тема":"Предлоги","знак":"🧭","вид":"ловушка","раздел":"⚠️ spielen и sprechen — без предлога!","урок":"polya5","урокИмя":"Занятие 5 Полины","html":"<span class=\"big\">Здесь немецкий расходится с русским</span>\n      По-русски мы играем <b>в</b> теннис и <b>на</b> гитаре, говорим <b>на</b> немецком. В немецком <b>предлога нет вообще</b>: <i>Tennis spielen</i>, <i>Gitarre spielen</i>, <i>Deutsch sprechen</i>.<br>\n      Это правило работает со спортом, играми и музыкальными инструментами.","текст":"Здесь немецкий расходится с русским По-русски мы играем в теннис и на гитаре, говорим на немецком. В немецком предлога нет вообще: Tennis spielen, Gitarre spielen, Deutsch sprechen. Это правило работает со спортом, играми и музыкальными инструментами.","ти":5,"пи":3,"подтема":"Глаголы с предлогом и без"},{"id":"b3493cdb00","тема":"Предлоги","знак":"🧭","вид":"правило","раздел":"Пары с предлогом","урок":"urok46","урокИмя":"Урок 47","html":"Здесь слово внутри предлога, и вся тройка — как одно выражение: <b>in Frage kommen</b> (подходить, рассматриваться), <b>zur Verfügung stehen</b> (быть в распоряжении), <b>in Anspruch nehmen</b> (воспользоваться), <b>unter Kontrolle bringen</b> (взять под контроль), <b>zum Ausdruck bringen</b> (выразить), <b>in Kauf nehmen</b> (смириться, принять как неизбежное).","текст":"Здесь слово внутри предлога, и вся тройка — как одно выражение: in Frage kommen (подходить, рассматриваться), zur Verfügung stehen (быть в распоряжении), in Anspruch nehmen (воспользоваться), unter Kontrolle bringen (взять под контроль), zum Ausdruck bringen (выразить), in Kauf nehmen (смириться, принять как неизбежное).","ти":5,"пи":3,"подтема":"Глаголы с предлогом и без"},{"id":"844d15a0d0","тема":"Множественное число","знак":"➕","вид":"правило","раздел":"⭐ er, sie, es вместо существительного","урок":"polya12","урокИмя":"Занятие 12 Полины","html":"<b>Что это вообще такое.</b> Чтобы не повторять слово, мы заменяем его местоимением: «Кровать дорогая. <i>Она</i> продаётся там-то». По-английски на всё одно «it», а по-немецки — <span class=\"hl\">как по-русски, по роду слова</span>:<br>\n      • <b>der</b> → <b>er</b> (он) · <b>die</b> → <b>sie</b> (она) · <b>das</b> → <b>es</b> (оно) · множественное → <b>sie</b> (они).<br><br>\n      Пример Даши прямо из диалога: <i>Die Lampe kostet 119 Euro. <b>Sie</b> kommt aus Italien.</i> — лампа женского рода, поэтому «она».","текст":"Что это вообще такое. Чтобы не повторять слово, мы заменяем его местоимением: «Кровать дорогая. Она продаётся там-то». По-английски на всё одно «it», а по-немецки — как по-русски, по роду слова: • der → er (он) · die → sie (она) · das → es (оно) · множественное → sie (они). Пример Даши прямо из диалога: Die Lampe kostet 119 Euro. Sie kommt aus Italien. — лампа женского рода, поэтому «она».","ти":6,"пи":0,"подтема":"Личные: ich, du, er, sie"},{"id":"3c6dada7d6","тема":"Местоимения","знак":"🧩","вид":"ловушка","раздел":"Личные местоимения (Personalpronomen)","урок":"dasha1","урокИмя":"Занятие 1 с Дашей","html":"<span class=\"big\">Три «sie» — главная путаница</span>\n      <b>sie</b> (маленькая) = она · <b>sie</b> (маленькая) = они · <b>Sie</b> (ЗАГЛАВНАЯ) = Вы вежливое.<br>\n      Различаем <b>по смыслу и по форме глагола</b>. Логика Даши: у русских одно «вы» на всё, у немцев наоборот — отдельное <i>ihr</i> для своих, зато «она» и «они» совпали.","текст":"Три «sie» — главная путаница sie (маленькая) = она · sie (маленькая) = они · Sie (ЗАГЛАВНАЯ) = Вы вежливое. Различаем по смыслу и по форме глагола. Логика Даши: у русских одно «вы» на всё, у немцев наоборот — отдельное ihr для своих, зато «она» и «они» совпали.","ти":6,"пи":0,"подтема":"Личные: ich, du, er, sie"},{"id":"3efba24d8f","тема":"Местоимения","знак":"🧩","вид":"ловушка","раздел":"Повторение: личные местоимения","урок":"dasha2","урокИмя":"Занятие 2 с Дашей","html":"<span class=\"big\">Три «sie» — как различать</span>\n      <b>sie</b> (маленькая) = она · <b>sie</b> (маленькая) = они · <b>Sie</b> (ЗАГЛАВНАЯ) = Вы вежливое.<br>\n      А <b>ihr</b> = «вы» к своим (к группе друзей). Различаем по смыслу и по форме глагола.","текст":"Три «sie» — как различать sie (маленькая) = она · sie (маленькая) = они · Sie (ЗАГЛАВНАЯ) = Вы вежливое. А ihr = «вы» к своим (к группе друзей). Различаем по смыслу и по форме глагола.","ти":6,"пи":0,"подтема":"Личные: ich, du, er, sie"},{"id":"7a6c040c85","тема":"Местоимения","знак":"🧩","вид":"правило","раздел":"⚠️ Как отличить sie / sie / Sie","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"<b>Проблема.</b> Одно и то же слово <b>sie</b> значит три разных вещи: «она», «они» и вежливое «Вы».\n      На занятии Григорий на этом спотыкался несколько раз — и Даша дала способ, как разобраться.","текст":"Проблема. Одно и то же слово sie значит три разных вещи: «она», «они» и вежливое «Вы». На занятии Григорий на этом спотыкался несколько раз — и Даша дала способ, как разобраться.","ти":6,"пи":0,"подтема":"Личные: ich, du, er, sie"},{"id":"fb285f57c8","тема":"Местоимения","знак":"🧩","вид":"правило","раздел":"⚠️ Как отличить sie / sie / Sie","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"Ещё подсказки: вежливое <b>Sie</b> всегда пишется с <b>большой буквы</b> в середине предложения.\n      А в вопросе оно стоит <b>после</b> глагола: <i>Trinken Sie gern Kaffee?</i>","текст":"Ещё подсказки: вежливое Sie всегда пишется с большой буквы в середине предложения. А в вопросе оно стоит после глагола: Trinken Sie gern Kaffee?","ти":6,"пи":0,"подтема":"Личные: ich, du, er, sie"},{"id":"25ebb5b0a3","тема":"Местоимения","знак":"🧩","вид":"ловушка","раздел":"⚠️ Как отличить sie / sie / Sie","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"<span class=\"big\">Смотрим на форму глагола</span>\n      Если рядом стоит глагол в форме <b>инфинитива</b> (кончается на -en, как в словаре) —\n      значит это <b>они</b> или вежливое <b>Вы</b>.<br>\n      Если у глагола окончание <b>-t</b> — значит это <b>она</b>.","текст":"Смотрим на форму глагола Если рядом стоит глагол в форме инфинитива (кончается на -en, как в словаре) — значит это они или вежливое Вы. Если у глагола окончание -t — значит это она.","ти":6,"пи":0,"подтема":"Личные: ich, du, er, sie"},{"id":"04a2bf9bc0","тема":"Местоимения","знак":"🧩","вид":"ловушка","раздел":"⭐ er, sie, es вместо существительного","урок":"polya12","урокИмя":"Занятие 12 Полины","html":"<span class=\"big\">Смотри на немецкий род, а не на русский</span>\n      Со столом и лампой роды совпали: der Tisch — он, die Lampe — она. Но кровать по-русски «она», а по-немецки <b>das Bett</b> — значит, <b>es</b>, «оно». Местоимение берёт род <b>немецкого</b> слова.","текст":"Смотри на немецкий род, а не на русский Со столом и лампой роды совпали: der Tisch — он, die Lampe — она. Но кровать по-русски «она», а по-немецки das Bett — значит, es, «оно». Местоимение берёт род немецкого слова.","ти":6,"пи":0,"подтема":"Личные: ich, du, er, sie"},{"id":"84910b1632","тема":"Местоимения","знак":"🧩","вид":"правило","раздел":"⭐⭐ Личные местоимения: таблица","урок":"polya15","урокИмя":"Занятие 15 Полины","html":"Что такое склонение местоимений: как в русском «я → мне → меня», так и в немецком <b>ich → mir → mich</b>. Исходная форма (ich, du, er…) — это <b>Nominativ</b>. Нам нужны ещё две: <b>Dativ</b> (кому?) и <b>Akkusativ</b> (кого?). Строку Genitiv Даша на слайде зачеркнула: из неё вырастут притяжательные «мой, твой» — это отдельная тема.","текст":"Что такое склонение местоимений: как в русском «я → мне → меня», так и в немецком ich → mir → mich. Исходная форма (ich, du, er…) — это Nominativ. Нам нужны ещё две: Dativ (кому?) и Akkusativ (кого?). Строку Genitiv Даша на слайде зачеркнула: из неё вырастут притяжательные «мой, твой» — это отдельная тема.","ти":6,"пи":0,"подтема":"Личные: ich, du, er, sie"},{"id":"2a4f232765","тема":"Множественное число","знак":"➕","вид":"правило","раздел":"⭐⭐ Памятка: мой, твой, её","урок":"polya16","урокИмя":"Занятие 16 Полины","html":"<b>Шаг 2 — какой род у вещи.</b> Окончание то же, что у <i>ein / eine</i>: <i>mein Tisch</i> (der), <i>mein Buch</i> (das), <i>mein<b>e</b> Jacke</i> (die), <i>mein<b>e</b> Schuhe</i> (множественное).<br>\n      <b>Шаг 3 — падеж.</b> Как у артикля: Akkusativ мужского — <i>mein<b>en</b></i> (ich sehe meinen Bruder), Dativ — <i>mein<b>em</b> / mein<b>er</b></i>.","текст":"Шаг 2 — какой род у вещи. Окончание то же, что у ein / eine: mein Tisch (der), mein Buch (das), meine Jacke (die), meine Schuhe (множественное). Шаг 3 — падеж. Как у артикля: Akkusativ мужского — meinen (ich sehe meinen Bruder), Dativ — meinem / meiner.","ти":6,"пи":1,"подтема":"Притяжательные: mein, dein, sein"},{"id":"f041faba96","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"🎬 «Das ist meine Familie» — семья Тины","урок":"dasha8","урокИмя":"Занятие 8 с Дашей","html":"<b>Чей?</b> — просто <b>-s</b> к имени, без апострофа: <i>Tina<b>s</b> Vater, Tina<b>s</b> Mutter</i> (как <i>Heidi Klums Vater</i>).<br>\n      <b>Его / её:</b> <i>sein</i> Vater → <i><b>seine</b> Frau</i> (его жена); <i><b>ihr</b> Mann</i> (её муж).<br>\n      После <b>heißen</b> глагол sein не нужен: <i>Sie heißt Tanja</i> — не «heißt ist».<br>\n      Тинин папа женат второй раз: Айлин — его нынешняя жена, не мама Тины. Мама живёт в Вене, родители <i>geschieden</i>.","текст":"Чей? — просто -s к имени, без апострофа: Tinas Vater, Tinas Mutter (как Heidi Klums Vater). Его / её: sein Vater → seine Frau (его жена); ihr Mann (её муж). После heißen глагол sein не нужен: Sie heißt Tanja — не «heißt ist». Тинин папа женат второй раз: Айлин — его нынешняя жена, не мама Тины. Мама живёт в Вене, родители geschieden.","ти":6,"пи":1,"подтема":"Притяжательные: mein, dein, sein"},{"id":"6915cf482d","тема":"Местоимения","знак":"🧩","вид":"правило","раздел":"Притяжательные местоимения + правило -e","урок":"dasha1","урокИмя":"Занятие 1 с Дашей","html":"<b>Приём Даши (обратная логика):</b> если местоимение <b>без</b> окончания — существительное точно <b>не женского рода</b>, значит мужской или средний.","текст":"Приём Даши (обратная логика): если местоимение без окончания — существительное точно не женского рода, значит мужской или средний.","ти":6,"пи":1,"подтема":"Притяжательные: mein, dein, sein"},{"id":"956f0a270b","тема":"Местоимения","знак":"🧩","вид":"ловушка","раздел":"Притяжательные местоимения + правило -e","урок":"dasha1","урокИмя":"Занятие 1 с Дашей","html":"<span class=\"big\">⚠️ Главное правило урока</span>\n      Притяжательное местоимение добавляет <b>-e</b>, если существительное <b>женского рода</b> или <b>множественного числа</b>. Мужской и средний — без окончания.","текст":"⚠️ Главное правило урока Притяжательное местоимение добавляет -e, если существительное женского рода или множественного числа. Мужской и средний — без окончания.","ти":6,"пи":1,"подтема":"Притяжательные: mein, dein, sein"},{"id":"f4ce3ced34","тема":"Местоимения","знак":"🧩","вид":"правило","раздел":"Повторение: притяжательные местоимения","урок":"dasha2","урокИмя":"Занятие 2 с Дашей","html":"<b>Правило из прошлого урока:</b> добавляем <b class=\"hl\">-e</b>, если существительное <b>женского рода</b> или <b>множественного числа</b>. Мужской и средний — без окончания.","текст":"Правило из прошлого урока: добавляем -e, если существительное женского рода или множественного числа. Мужской и средний — без окончания.","ти":6,"пи":1,"подтема":"Притяжательные: mein, dein, sein"},{"id":"5232665978","тема":"Местоимения","знак":"🧩","вид":"правило","раздел":"⭐⭐ Памятка: мой, твой, её","урок":"polya16","урокИмя":"Занятие 16 Полины","html":"<b>Что это вообще такое.</b> Притяжательное местоимение отвечает на вопрос «чей?»: мой, твой, его, её, наш. В русском есть одно слово «свой» на всех — в немецком его <b>нет</b>, всегда говорим, чей именно: <i>Sie füttert <b>ihren</b> Hund</i> — она кормит <b>свою</b> (= её) собаку.<br><br>\n      <b>Шаг 1 — кто хозяин:</b>","текст":"Что это вообще такое. Притяжательное местоимение отвечает на вопрос «чей?»: мой, твой, его, её, наш. В русском есть одно слово «свой» на всех — в немецком его нет, всегда говорим, чей именно: Sie füttert ihren Hund — она кормит свою (= её) собаку. Шаг 1 — кто хозяин:","ти":6,"пи":1,"подтема":"Притяжательные: mein, dein, sein"},{"id":"47a7fe8043","тема":"Разное","знак":"📎","вид":"ловушка","раздел":"⭐⭐ Памятка: мой, твой, её","урок":"polya16","урокИмя":"Занятие 16 Полины","html":"<span class=\"big\">ihr — три разных слова</span>\n      <i>ihr</i> = «вы» (ихр раздельно), <i>ihr</i> = «её», <i>ihr</i> = «их». Различаем по смыслу: <i>Ihr Hund</i> — её собака, <i>Ihr kommt</i> — вы приходите. <b>euer</b> теряет e перед окончанием: <i>eu<b>re</b> Hausaufgaben</i>, не «euere».","текст":"ihr — три разных слова ihr = «вы» (ихр раздельно), ihr = «её», ihr = «их». Различаем по смыслу: Ihr Hund — её собака, Ihr kommt — вы приходите. euer теряет e перед окончанием: eure Hausaufgaben, не «euere».","ти":6,"пи":1,"подтема":"Притяжательные: mein, dein, sein"},{"id":"1227eb0c63","тема":"Разное","знак":"📎","вид":"правило","раздел":"⭐ Четыре стороны одного сообщения","урок":"urok55","урокИмя":"Урок 56","html":"Пример из книги: друзья едут в машине, пассажир говорит водителю <i>„Du, da vorne ist grün.“</i><br>\n      • факт — <i>Die Ampel ist grün.</i> · о себе — <i>Ich habe es eilig.</i> · отношения — <i>Du brauchst meine Hilfe.</i> · призыв — <i>Fahr los!</i><br>\n      Водитель, который услышит только «отношения» («ты считаешь, я сам не вижу?»), обидится — хотя пассажир, может быть, просто торопился.","текст":"Пример из книги: друзья едут в машине, пассажир говорит водителю „Du, da vorne ist grün.“ • факт — Die Ampel ist grün. · о себе — Ich habe es eilig. · отношения — Du brauchst meine Hilfe. · призыв — Fahr los! Водитель, который услышит только «отношения» («ты считаешь, я сам не вижу?»), обидится — хотя пассажир, может быть, просто торопился.","ти":6,"пи":1,"подтема":"Притяжательные: mein, dein, sein"},{"id":"2dde56cadb","тема":"Местоимения","знак":"🧩","вид":"правило","раздел":"Что это вообще такое","урок":"urok18","урокИмя":"Урок 19","html":"В русском есть хвостик <b class=\"hl\">-ся</b>: мыть → мыть<b>ся</b>, сажать → садить<b>ся</b>. Он означает «сам себя». Немцы делают то же самое, только <b>отдельным словом</b>:<br><br>\n      <i>waschen</i> (мыть кого-то) → <i>sich waschen</i> (мыть <b>себя</b>, то есть мыться).<br><br>\n      Слово <b class=\"hl\">sich</b> — это и есть «себя». В словаре глагол так и записан: <i>sich waschen</i>. Значит, местоимение обязательно, без него предложение сломано.","текст":"В русском есть хвостик -ся: мыть → мыться, сажать → садиться. Он означает «сам себя». Немцы делают то же самое, только отдельным словом: waschen (мыть кого-то) → sich waschen (мыть себя, то есть мыться). Слово sich — это и есть «себя». В словаре глагол так и записан: sich waschen. Значит, местоимение обязательно, без него предложение сломано.","ти":6,"пи":2,"подтема":"sich и man"},{"id":"ff86966565","тема":"Местоимения","знак":"🧩","вид":"правило","раздел":"Шесть местоимений — и только два новых","урок":"urok18","урокИмя":"Урок 19","html":"Хорошая новость: почти все формы ты уже знаешь из Akkusativ (урок 4). Реально новых слов <b class=\"hl\">два</b>: <i>euch</i> и <i>sich</i>.<br><br>\n      И отдельно запомни: у вежливого <b>Sie</b> местоимение — <b class=\"hl\">sich с маленькой буквы</b>, не «Sich». <i>Setzen Sie sich.</i>\n    </div>\n    <table class=\"casetab\">\n      <tr><th>лицо</th><th>местоимение</th><th>пример</th></tr>\n      <tr><td class=\"lbl\">ich</td><td><b>mich</b></td><td>ich wasche mich</td></tr>\n      <tr><td class=\"lbl\">du</td><td><b>dich</b></td><td>du wäschst dich</td></tr>\n      <tr><td class=\"lbl\">er / sie / es</td><td><span class=\"wohin\">sich</span></td><td>er wäscht sich</td></tr>\n      <tr><td class=\"lbl\">wir</td><td><b>uns</b></td><td>wir waschen uns</td></tr>\n      <tr><td class=\"lbl\">ihr</td><td><span class=\"wohin\">euch</span></td><td>ihr wascht euch</td></tr>\n      <tr><td class=\"lbl\">sie / Sie</td><td><span class=\"wohin\">sich</span></td><td>Sie waschen sich</td></tr>\n    </table>\n    <div class=\"grid2\" id=\"conj\">","текст":"Хорошая новость: почти все формы ты уже знаешь из Akkusativ (урок 4). Реально новых слов два: euch и sich. И отдельно запомни: у вежливого Sie местоимение — sich с маленькой буквы, не «Sich». Setzen Sie sich. лицоместоимениепример ichmichich wasche mich dudichdu wäschst dich er / sie / essicher wäscht sich wirunswir waschen uns ihreuchihr wascht euch sie / SiesichSie waschen sich","ти":6,"пи":2,"подтема":"sich и man"},{"id":"bfa214be74","тема":"Местоимения","знак":"🧩","вид":"правило","раздел":"Куда ставить местоимение","урок":"urok18","урокИмя":"Урок 19","html":"Правило простое: <b class=\"hl\">сразу после спрягаемого глагола</b>.<br><br>\n      <i>Ich <b>wasche mich</b> jeden Morgen.</i> · <i><b>Waschen Sie sich</b> die Hände.</i><br><br>\n      В вопросе глагол уходит вперёд, местоимение идёт за ним следом: <i><b>Fühlen Sie sich</b> gut?</i> Держатся парой, между ними ничего не вставляют.","текст":"Правило простое: сразу после спрягаемого глагола. Ich wasche mich jeden Morgen. · Waschen Sie sich die Hände. В вопросе глагол уходит вперёд, местоимение идёт за ним следом: Fühlen Sie sich gut? Держатся парой, между ними ничего не вставляют.","ти":6,"пи":2,"подтема":"sich и man"},{"id":"42eed388c0","тема":"Местоимения","знак":"🧩","вид":"правило","раздел":"man — тот же смысл проще","урок":"urok27","урокИмя":"Урок 28","html":"Есть более простой способ сказать почти то же самое: местоимение <b>man</b> плюс обычный Aktiv, глагол в форме для «он/она». Разницы в смысле почти нет — Passiv звучит чуть официальнее, чаще в документах и рекомендациях, <b>man</b> — в разговоре.","текст":"Есть более простой способ сказать почти то же самое: местоимение man плюс обычный Aktiv, глагол в форме для «он/она». Разницы в смысле почти нет — Passiv звучит чуть официальнее, чаще в документах и рекомендациях, man — в разговоре.","ти":6,"пи":2,"подтема":"sich и man"},{"id":"7e900005e2","тема":"Местоимения","знак":"🧩","вид":"правило","раздел":"Сравнения: как показать механизм","урок":"urok49","урокИмя":"Урок 50","html":"Пациент запоминает картинку, а не термин. Две формулы: <b>wie</b> + сравнение (wie kleine Ventile — как маленькие клапаны) и <b>Man kann sich das so vorstellen:</b> — представьте себе так. <b>nämlich</b> — «а именно»: уточняет сказанное.","текст":"Пациент запоминает картинку, а не термин. Две формулы: wie + сравнение (wie kleine Ventile — как маленькие клапаны) и Man kann sich das so vorstellen: — представьте себе так. nämlich — «а именно»: уточняет сказанное.","ти":6,"пи":2,"подтема":"sich и man"},{"id":"127b0e2b11","тема":"Местоимения","знак":"🧩","вид":"правило","раздел":"Вести дискуссию","урок":"urok59","урокИмя":"Урок 60","html":"Вступить, перебить, не дать перебить себя, вернуться к вопросу, подвести итог, договориться. <i>ausreden</i> — договорить до конца; <i>sich einigen auf</i> — договориться о чём-то.","текст":"Вступить, перебить, не дать перебить себя, вернуться к вопросу, подвести итог, договориться. ausreden — договорить до конца; sich einigen auf — договориться о чём-то.","ти":6,"пи":2,"подтема":"sich и man"},{"id":"293eb4c615","тема":"Местоимения","знак":"🧩","вид":"правило","раздел":"da- и wo- слова: человек или вещь","урок":"urok30","урокИмя":"Урок 31","html":"Если после предлога — <b>человек</b>, ставим предлог плюс местоимение как обычно: <i>auf ihn, an sie</i>. Если <b>вещь или событие</b> — предлог с местоимением не звучит по-немецки естественно, вместо этого берут слитное слово <b class=\"hl\">da(r) + предлог</b>: <i>darauf, daran, davor</i>. В вопросе то же самое: о человеке — <b>предлог + wen/wem</b>, о вещи — <b class=\"hl\">wo(r) + предлог</b>: <i>worauf? woran? wovor?</i>","текст":"Если после предлога — человек, ставим предлог плюс местоимение как обычно: auf ihn, an sie. Если вещь или событие — предлог с местоимением не звучит по-немецки естественно, вместо этого берут слитное слово da(r) + предлог: darauf, daran, davor. В вопросе то же самое: о человеке — предлог + wen/wem, о вещи — wo(r) + предлог: worauf? woran? wovor?","ти":6,"пи":3,"подтема":"da- и wo-слова"},{"id":"28b69492f7","тема":"Множественное число","знак":"➕","вид":"ловушка","раздел":"⭐ Правило, которое Даша просила запомнить «раз и навсегда»","урок":"dasha3","урокИмя":"Занятие 3 с Дашей","html":"<span class=\"big\">Если в глаголе меняется буква — она меняется только у du и er/sie/es</span>\n      Это самое полезное правило всего занятия. Оно избавляет от половины сомнений.<br><br>\n      Смотри: у некоторых глаголов при спряжении <b>меняется гласная внутри слова</b> (не окончание, а сама буква в середине). Так вот — это происходит <b>только в двух местах</b>:<br><br>\n      ✅ у <b class=\"hl\">du</b> (ты)<br>\n      ✅ у <b class=\"hl\">er / sie / es</b> (он / она / оно)<br><br>\n      ❌ У <b>ich</b>, <b>wir</b>, <b>ihr</b>, <b>sie</b>, <b>Sie</b> внутри слова <b>никогда ничего не меняется</b>. Они спрягаются по обычным правилам.<br><br>\n      Даша сказала это так: <i>«множественное число никогда не трогается»</i>. У модальных глаголов есть небольшое отличие — там меняется ещё и в <i>ich</i>. Но у обычных глаголов правило работает железно.","текст":"Если в глаголе меняется буква — она меняется только у du и er/sie/es Это самое полезное правило всего занятия. Оно избавляет от половины сомнений. Смотри: у некоторых глаголов при спряжении меняется гласная внутри слова (не окончание, а сама буква в середине). Так вот — это происходит только в двух местах: ✅ у du (ты) ✅ у er / sie / es (он / она / оно) ❌ У ich, wir, ihr, sie, Sie внутри слова никогда ничего не меняется. Они спрягаются по обычным правилам. Даша сказала это так: «множественное число никогда не трогается». У модальных глаголов есть небольшое отличие — там меняется ещё и в ich. Но у обычных глаголов правило работает железно.","ти":7,"пи":0,"подтема":"Как образуется множественное"},{"id":"36e27e9e2c","тема":"Множественное число","знак":"➕","вид":"правило","раздел":"Что оказалось трудным","урок":"polya7","урокИмя":"Занятие 7 Полины","html":"Обрати внимание на множественное: <b class=\"hl\">das Wort → die Wörter</b> (с умляутом и окончанием -er). В немецком множественное число почти всегда просто запоминается — общего правила нет. Кроме одного случая, до которого дойдём в разделе 10.","текст":"Обрати внимание на множественное: das Wort → die Wörter (с умляутом и окончанием -er). В немецком множественное число почти всегда просто запоминается — общего правила нет. Кроме одного случая, до которого дойдём в разделе 10.","ти":7,"пи":0,"подтема":"Как образуется множественное"},{"id":"b74d1a3b2e","тема":"Множественное число","знак":"➕","вид":"правило","раздел":"Фильмы и выписывание фраз","урок":"polya7","урокИмя":"Занятие 7 Полины","html":"<b class=\"hl\">aufschreiben</b> — записывать. Отделяемая приставка <b>auf-</b> улетает в конец: <i>Ich schreibe einige Sätze <b>auf</b></i>. Ты это правило уже видела.<br><br>\n      И ещё одно множественное: <b class=\"hl\">der Satz → die Sätze</b> (предложение → предложения).","текст":"aufschreiben — записывать. Отделяемая приставка auf- улетает в конец: Ich schreibe einige Sätze auf. Ты это правило уже видела. И ещё одно множественное: der Satz → die Sätze (предложение → предложения).","ти":7,"пи":0,"подтема":"Как образуется множественное"},{"id":"1bbe9b2c09","тема":"Множественное число","знак":"➕","вид":"правило","раздел":"⭐⭐ Новая тема: множественное число","урок":"polya8","урокИмя":"Занятие 8 Полины","html":"<b>Плохая новость сразу:</b> одного правила на все случаи в немецком нет.\n      Даша прямо сказала — когда встречаете новое существительное, <b>сразу учите его вместе\n      со множественным числом</b>. Как одно слово.<br><br>\n      <b>Хорошая новость:</b> вариантов не бесконечно много. Их всего несколько, и их можно уложить в голове.","текст":"Плохая новость сразу: одного правила на все случаи в немецком нет. Даша прямо сказала — когда встречаете новое существительное, сразу учите его вместе со множественным числом. Как одно слово. Хорошая новость: вариантов не бесконечно много. Их всего несколько, и их можно уложить в голове.","ти":7,"пи":0,"подтема":"Как образуется множественное"},{"id":"80c61805e7","тема":"Множественное число","знак":"➕","вид":"правило","раздел":"⭐⭐ Новая тема: множественное число","урок":"polya8","урокИмя":"Занятие 8 Полины","html":"<b>Что поменялось в этих двух предложениях:</b><br>\n      1️⃣ Артикль: <b>der</b> → <b>die</b> (во множественном он всегда <b>die</b>)<br>\n      2️⃣ Само слово: <b>Stift</b> → <b>Stifte</b><br>\n      3️⃣ Глаголы: <b>ist</b> → <b>sind</b>, <b>kostet</b> → <b>kosten</b>","текст":"Что поменялось в этих двух предложениях: 1️⃣ Артикль: der → die (во множественном он всегда die) 2️⃣ Само слово: Stift → Stifte 3️⃣ Глаголы: ist → sind, kostet → kosten","ти":7,"пи":0,"подтема":"Как образуется множественное"},{"id":"9e800d1426","тема":"Множественное число","знак":"➕","вид":"правило","раздел":"⭐⭐ Новая тема: множественное число","урок":"polya8","урокИмя":"Занятие 8 Полины","html":"<b>Множественное число — это всегда артикль die.</b> Дальше два случая:<br><br>\n      <b>Случай 1. Слово не меняется</b> — меняется только артикль.<br>\n      <span style=\"color:var(--pk)\">das Zimmer → die Zimmer</span><br><br>\n      <b>Случай 2. Слово меняется.</b> И тут три варианта:<br>\n      • добавилось <b>окончание</b> — <span style=\"color:var(--pk)\">der Tisch → die Tische</span><br>\n      • поменялась <b>гласная в корне</b> — <span style=\"color:var(--pk)\">der Apfel → die Äpfel</span><br>\n      • и то, и другое сразу — <span style=\"color:var(--pk)\">das Buch → die Bücher</span>","текст":"Множественное число — это всегда артикль die. Дальше два случая: Случай 1. Слово не меняется — меняется только артикль. das Zimmer → die Zimmer Случай 2. Слово меняется. И тут три варианта: • добавилось окончание — der Tisch → die Tische • поменялась гласная в корне — der Apfel → die Äpfel • и то, и другое сразу — das Buch → die Bücher","ти":7,"пи":0,"подтема":"Как образуется множественное"},{"id":"31618da9c0","тема":"Множественное число","знак":"➕","вид":"ловушка","раздел":"⭐⭐ Новая тема: множественное число","урок":"polya8","урокИмя":"Занятие 8 Полины","html":"<span class=\"big\">И ещё исключения</span>\n      Бывают слова, где форма меняется совсем непредсказуемо. Их немного, и Даша сказала просто:\n      встретили — запомнили.","текст":"И ещё исключения Бывают слова, где форма меняется совсем непредсказуемо. Их немного, и Даша сказала просто: встретили — запомнили.","ти":7,"пи":0,"подтема":"Как образуется множественное"},{"id":"a7c02eaff4","тема":"Множественное число","знак":"➕","вид":"правило","раздел":"Температура","урок":"urok16","урокИмя":"Урок 17","html":"<b>Grad</b> [грат] — градус, и после числа он <b class=\"hl\">не меняется</b>: <i>zehn Grad</i>, <i>dreißig Grad</i> — никакого «Grade». Минус так и говорят — <b>minus</b>.<br><br>\n      Мелочь, на которой спотыкаются: с числом больше одного глагол во множественном — <i><b>Es sind</b> zehn Grad</i>, но <i><b>Es ist</b> null Grad</i>.","текст":"Grad [грат] — градус, и после числа он не меняется: zehn Grad, dreißig Grad — никакого «Grade». Минус так и говорят — minus. Мелочь, на которой спотыкаются: с числом больше одного глагол во множественном — Es sind zehn Grad, но Es ist null Grad.","ти":7,"пи":0,"подтема":"Как образуется множественное"},{"id":"0dee18a1c3","тема":"Множественное число","знак":"➕","вид":"ловушка","раздел":"⭐ Правило одного сигнала","урок":"urok24","урокИмя":"Урок 25","html":"<span class=\"big\">Окончаний всего пять</span>\n      <b>-e</b>, <b>-en</b>, <b>-er</b>, <b>-es</b>, <b>-em</b>. И больше половины всех случаев — это скучное <b>-en</b>. Если совсем растерялся и надо сказать быстро — ставь <b>-en</b>: чаще всего попадёшь, а во множественном числе и в дательном падеже попадёшь всегда.","текст":"Окончаний всего пять -e, -en, -er, -es, -em. И больше половины всех случаев — это скучное -en. Если совсем растерялся и надо сказать быстро — ставь -en: чаще всего попадёшь, а во множественном числе и в дательном падеже попадёшь всегда.","ти":7,"пи":0,"подтема":"Как образуется множественное"},{"id":"9173dc29a4","тема":"Множественное число","знак":"➕","вид":"правило","раздел":"Женский, средний, множественное","урок":"urok38","урокИмя":"Урок 39","html":"Логика та же. Внимание на <b>der</b> у женского рода в Dativ (выглядит как мужской Nominativ!) и на <b>denen</b> во множественном.","текст":"Логика та же. Внимание на der у женского рода в Dativ (выглядит как мужской Nominativ!) и на denen во множественном.","ти":7,"пи":0,"подтема":"Как образуется множественное"},{"id":"d580b8ec9c","тема":"Множественное число","знак":"➕","вид":"правило","раздел":"Множественное число — есть логика","урок":"urok9","урокИмя":"Урок 10","html":"У пар органов множественное нужно постоянно (обе ноги, обе руки). Частые окончания: <b class=\"hl\">-e</b> (der Arm → die Arme), <b class=\"hl\">-e + умляут</b> (die Hand → die Hände, der Fuß → die Füße), <b class=\"hl\">-en</b> (das Auge → die Augen). Учи форму вместе со словом.","текст":"У пар органов множественное нужно постоянно (обе ноги, обе руки). Частые окончания: -e (der Arm → die Arme), -e + умляут (die Hand → die Hände, der Fuß → die Füße), -en (das Auge → die Augen). Учи форму вместе со словом.","ти":7,"пи":0,"подтема":"Как образуется множественное"},{"id":"3ac211e0c7","тема":"Падежи","знак":"📦","вид":"правило","раздел":"⭐ Правило: -en везде, кроме одного места","урок":"urok36","урокИмя":"Урок 37","html":"Слабое существительное получает <b class=\"hl\">-en</b> (или <b class=\"hl\">-n</b>, если уже кончается на -e) <b>во всех падежах, кроме Nominativ единственного числа</b>. И в Genitiv — тоже <b>-en</b>, без обычного -s: <i>des Patienten</i>, а не «des Patients».","текст":"Слабое существительное получает -en (или -n, если уже кончается на -e) во всех падежах, кроме Nominativ единственного числа. И в Genitiv — тоже -en, без обычного -s: des Patienten, а не «des Patients».","ти":7,"пи":0,"подтема":"Как образуется множественное"},{"id":"38a4e07fad","тема":"Разное","знак":"📎","вид":"правило","раздел":"Короткие слова берут умляут","урок":"urok22","урокИмя":"Урок 23","html":"Многие короткие прилагательные с <b>a, o, u</b> в сравнении получают точки: <i>alt → <b>ä</b>lter</i>, <i>groß → gr<b>ö</b>ßer</i>, <i>jung → j<b>ü</b>nger</i>. Правила, какие именно, нет — но это почти всё частые слова, их меньше двадцати. Главные — ниже.","текст":"Многие короткие прилагательные с a, o, u в сравнении получают точки: alt → älter, groß → größer, jung → jünger. Правила, какие именно, нет — но это почти всё частые слова, их меньше двадцати. Главные — ниже.","ти":7,"пи":0,"подтема":"Как образуется множественное"},{"id":"e22bcd7171","тема":"Порядок слов","знак":"📐","вид":"правило","раздел":"⭐ Главное: глагол на второй ПОЗИЦИИ, а не на втором слове","урок":"polya6","урокИмя":"Занятие 6 Полины","html":"<b class=\"hl\">wie viel</b> или <b class=\"hl\">wie viele</b>? С исчисляемыми — <b>wie viele</b> (детей можно посчитать). Полина догадалась сама.","текст":"wie viel или wie viele? С исчисляемыми — wie viele (детей можно посчитать). Полина догадалась сама.","ти":8,"пи":0,"подтема":"Глагол на втором месте"},{"id":"9a815be85a","тема":"Порядок слов","знак":"📐","вид":"ловушка","раздел":"⭐ Главное: глагол на второй ПОЗИЦИИ, а не на втором слове","урок":"polya6","урокИмя":"Занятие 6 Полины","html":"<span class=\"big\">Полина решила, что правило не работает — и это правильный вопрос</span>\n      В <i>Wie viele Kinder habt ihr?</i> глагол стоит третьим словом. Значит, правило сломалось? Нет.<br><br>\n      <b>Второе место — это не второе слово, а вторая позиция.</b> А <i>wie viele Kinder</i> — это <b>одна неразрывная позиция целиком</b>. Её нельзя разделить: нельзя сказать <i>Wie Kinder habt ihr viele</i>.\n    </div>\n    <table class=\"postab\">\n      <tr><th>Позиция 1</th><th>Позиция 2</th><th>дальше</th></tr>\n      <tr><td>Wie viele Kinder</td><td><b>habt</b></td><td>ihr?</td></tr>\n    </table>\n    <div class=\"grammar-box\" style=\"margin-top:14px\">\n      <b class=\"hl\">wie viel</b> или <b class=\"hl\">wie viele</b>? С исчисляемыми — <b>wie viele</b> (детей можно посчитать). Полина догадалась сама.","текст":"Полина решила, что правило не работает — и это правильный вопрос В Wie viele Kinder habt ihr? глагол стоит третьим словом. Значит, правило сломалось? Нет. Второе место — это не второе слово, а вторая позиция. А wie viele Kinder — это одна неразрывная позиция целиком. Её нельзя разделить: нельзя сказать Wie Kinder habt ihr viele. Позиция 1Позиция 2дальше Wie viele Kinderhabtihr? wie viel или wie viele? С исчисляемыми — wie viele (детей можно посчитать). Полина догадалась сама.","ти":8,"пи":0,"подтема":"Глагол на втором месте"},{"id":"9b92242bdb","тема":"Порядок слов","знак":"📐","вид":"правило","раздел":"Порядок слов: глагол на 2-м месте","урок":"urok3","урокИмя":"Урок 4","html":"Главное правило немецкого предложения: <b>изменяемый глагол стоит на втором месте</b>. Не второе слово — второе место: <i>Meine Schwester</i> — это одно место, хоть и два слова.","текст":"Главное правило немецкого предложения: изменяемый глагол стоит на втором месте. Не второе слово — второе место: Meine Schwester — это одно место, хоть и два слова.","ти":8,"пи":0,"подтема":"Глагол на втором месте"},{"id":"ca37adb31e","тема":"Общение и обращение","знак":"💬","вид":"ловушка","раздел":"⭐ Глагол всегда на втором месте","урок":"polya11","урокИмя":"Занятие 11 Полины","html":"<span class=\"big\">Ошибка с занятия</span>\n      Полина сказала: <s>Auf dem Bild es gibt eine Frau.</s> — глагол оказался третьим.<br>\n      Правильно: <b>Auf dem Bild gibt es eine Frau.</b> Первое место заняло «auf dem Bild», значит сразу за ним — глагол <b>gibt</b>, и только потом <b>es</b>.","текст":"Ошибка с занятия Полина сказала: Auf dem Bild es gibt eine Frau. — глагол оказался третьим. Правильно: Auf dem Bild gibt es eine Frau. Первое место заняло «auf dem Bild», значит сразу за ним — глагол gibt, и только потом es.","ти":8,"пи":0,"подтема":"Глагол на втором месте"},{"id":"0d1db99895","тема":"Разное","знак":"📎","вид":"правило","раздел":"⭐ Глагол всегда на втором месте","урок":"polya11","урокИмя":"Занятие 11 Полины","html":"<b>Что это вообще такое.</b> Обычный порядок: подлежащее → глагол → остальное. Но если на первое место вынести что-то другое — например, «на картинке» — то <span class=\"hl\">глагол всё равно остаётся вторым</span>, а подлежащее уходит <b>за</b> глагол. Это называется инверсия. По-русски так тоже можно сказать («на картинке вижу я женщину»), но в немецком это <b>обязательно</b>.","текст":"Что это вообще такое. Обычный порядок: подлежащее → глагол → остальное. Но если на первое место вынести что-то другое — например, «на картинке» — то глагол всё равно остаётся вторым, а подлежащее уходит за глагол. Это называется инверсия. По-русски так тоже можно сказать («на картинке вижу я женщину»), но в немецком это обязательно.","ти":8,"пи":0,"подтема":"Глагол на втором месте"},{"id":"f5ef1bbcd8","тема":"Множественное число","знак":"➕","вид":"правило","раздел":"💬 «Вопросов нет» и «всё понятно»","урок":"polya12","урокИмя":"Занятие 12 Полины","html":"В конце Даша спросила, есть ли вопросы. Полина хотела сказать «я всё поняла», и Даша дала готовые фразы. Совсем коротко — <b>Alles klar!</b> Или в прошедшем времени — <b>Ich habe verstanden</b>.<br><br>\n      Маленькое уточнение (моё): Полина сказала «Ich habe keine Frage», и это можно, но обычно говорят во множественном — <b>keine Fragen</b>, «никаких вопросов».","текст":"В конце Даша спросила, есть ли вопросы. Полина хотела сказать «я всё поняла», и Даша дала готовые фразы. Совсем коротко — Alles klar! Или в прошедшем времени — Ich habe verstanden. Маленькое уточнение (моё): Полина сказала «Ich habe keine Frage», и это можно, но обычно говорят во множественном — keine Fragen, «никаких вопросов».","ти":8,"пи":1,"подтема":"Вопросы и вопросительные слова"},{"id":"f1ef488f50","тема":"Модальные глаголы","знак":"🔑","вид":"правило","раздел":"⭐⭐ Упражнение: превращаем предложения в вопросы","урок":"dasha5","урокИмя":"Занятие 5 с Дашей","html":"Дальше — предложения с одним глаголом, без модального. Тут глагол просто выходит на первое место.","текст":"Дальше — предложения с одним глаголом, без модального. Тут глагол просто выходит на первое место.","ти":8,"пи":1,"подтема":"Вопросы и вопросительные слова"},{"id":"aff1c461b5","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"Wie alt sind Sie? — сколько Вам лет","урок":"urok2","урокИмя":"Урок 3","html":"Возраст по-немецки — через <b>sein</b>: не «мне пятьдесят», а «<b class=\"hl\">я есть</b> пятьдесят лет старый» — <i>Ich bin fünfzig Jahre alt</i>. В разговоре <i>Jahre alt</i> часто опускают: <i>Ich bin zwanzig.</i>","текст":"Возраст по-немецки — через sein: не «мне пятьдесят», а «я есть пятьдесят лет старый» — Ich bin fünfzig Jahre alt. В разговоре Jahre alt часто опускают: Ich bin zwanzig.","ти":8,"пи":1,"подтема":"Вопросы и вопросительные слова"},{"id":"f32bb0d382","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"⭐ Вопросы после доклада","урок":"urok56","урокИмя":"Урок 57","html":"Самое страшное — не доклад, а вопросы. Три спасительные фразы: <i>Vielen Dank für die Frage.</i> (время подумать) · <i>Habe ich Ihre Frage richtig verstanden: …?</i> (переспросить) · <i>Darauf habe ich leider keine Daten.</i> (честно, если нет ответа — это нормально).","текст":"Самое страшное — не доклад, а вопросы. Три спасительные фразы: Vielen Dank für die Frage. (время подумать) · Habe ich Ihre Frage richtig verstanden: …? (переспросить) · Darauf habe ich leider keine Daten. (честно, если нет ответа — это нормально).","ти":8,"пи":1,"подтема":"Вопросы и вопросительные слова"},{"id":"aa0762ac70","тема":"Порядок слов","знак":"📐","вид":"правило","раздел":"⭐⭐ Вопросы: два вида","урок":"dasha5","урокИмя":"Занятие 5 с Дашей","html":"<b>Что это вообще такое.</b> В немецком, как и в русском, есть два типа вопросов:<br><br>\n      1️⃣ <b>Общий вопрос</b> — ответ «да» или «нет». Пример по-русски: «Ты живёшь здесь?»<br>\n      2️⃣ <b>Специальный вопрос</b> — требует развёрнутого ответа, начинается с вопросительного слова.\n      Пример: «Когда ты сюда приехал?»<br><br>\n      В немецком специальные вопросы называют <b>W-Fragen</b> — потому что почти все вопросительные\n      слова начинаются на букву <span class=\"hl\">W</span> (wer, was, wo, wann…).","текст":"Что это вообще такое. В немецком, как и в русском, есть два типа вопросов: 1️⃣ Общий вопрос — ответ «да» или «нет». Пример по-русски: «Ты живёшь здесь?» 2️⃣ Специальный вопрос — требует развёрнутого ответа, начинается с вопросительного слова. Пример: «Когда ты сюда приехал?» В немецком специальные вопросы называют W-Fragen — потому что почти все вопросительные слова начинаются на букву W (wer, was, wo, wann…).","ти":8,"пи":1,"подтема":"Вопросы и вопросительные слова"},{"id":"e97ede34e3","тема":"Порядок слов","знак":"📐","вид":"правило","раздел":"⭐⭐ Вопросы: два вида","урок":"dasha5","урокИмя":"Занятие 5 с Дашей","html":"<b>Как строится специальный вопрос.</b> Порядок такой:\n      1) вопросительное слово, 2) глагол, 3) подлежащее, дальше остальное.","текст":"Как строится специальный вопрос. Порядок такой: 1) вопросительное слово, 2) глагол, 3) подлежащее, дальше остальное.","ти":8,"пи":1,"подтема":"Вопросы и вопросительные слова"},{"id":"0e802b20c5","тема":"Порядок слов","знак":"📐","вид":"ловушка","раздел":"Вопросительные слова","урок":"dasha5","урокИмя":"Занятие 5 с Дашей","html":"<span class=\"big\">welcher / welche / welches — единственное слово с родом</span>\n      Все остальные вопросительные слова не меняются. А это одно — «какой» — подстраивается\n      под род существительного, как артикль: <b>welcher</b> (муж.), <b>welche</b> (жен. и мн. число),\n      <b>welches</b> (средний).","текст":"welcher / welche / welches — единственное слово с родом Все остальные вопросительные слова не меняются. А это одно — «какой» — подстраивается под род существительного, как артикль: welcher (муж.), welche (жен. и мн. число), welches (средний).","ти":8,"пи":1,"подтема":"Вопросы и вопросительные слова"},{"id":"c7f5ee2ff1","тема":"Порядок слов","знак":"📐","вид":"правило","раздел":"⭐ Вопросительные слова — все сразу","урок":"dasha6","урокИмя":"Занятие 6 с Дашей","html":"<b>wie viel или wie viele?</b> Оба — «сколько».<br>\n      • <b>wie viel</b> — про то, что не посчитать поштучно: деньги, время, вода.<br>\n      • <b>wie viele</b> — про то, что считается штуками, во множественном: дети, братья, друзья. Правило Даши: множественное — ставим <b>-e</b> на конце.","текст":"wie viel или wie viele? Оба — «сколько». • wie viel — про то, что не посчитать поштучно: деньги, время, вода. • wie viele — про то, что считается штуками, во множественном: дети, братья, друзья. Правило Даши: множественное — ставим -e на конце.","ти":8,"пи":1,"подтема":"Вопросы и вопросительные слова"},{"id":"ec527be4ee","тема":"Порядок слов","знак":"📐","вид":"правило","раздел":"⭐ Вопросительные слова — все сразу","урок":"dasha6","урокИмя":"Занятие 6 с Дашей","html":"<b>welcher / welche / welches</b> — «который, какой из». Окончание зависит от <b>рода следующего слова</b>, как у артикля: <b>der</b> Hund → welche<b>r</b>, <b>die</b> Tasche → welche, <b>das</b> Auto → welche<b>s</b>.","текст":"welcher / welche / welches — «который, какой из». Окончание зависит от рода следующего слова, как у артикля: der Hund → welcher, die Tasche → welche, das Auto → welches.","ти":8,"пи":1,"подтема":"Вопросы и вопросительные слова"},{"id":"a4d0b893cd","тема":"Порядок слов","знак":"📐","вид":"ловушка","раздел":"⭐ Вопросительные слова — все сразу","урок":"dasha6","урокИмя":"Занятие 6 с Дашей","html":"<span class=\"big\">Где Гриша ошибся</span>\n      <b>wann</b> — это «<b>когда</b>», а не «где» («где» — <b>wo</b>).<br>\n      <b>warum</b> — это «<b>почему</b>», а не «когда».<br>\n      <b>wen</b> — «кого», <b>wem</b> — «кому». Запоминалка Даши: в русском «ко<b>м</b>у» есть «м» — и в немецком <b>wem</b> тоже с «м».","текст":"Где Гриша ошибся wann — это «когда», а не «где» («где» — wo). warum — это «почему», а не «когда». wen — «кого», wem — «кому». Запоминалка Даши: в русском «кому» есть «м» — и в немецком wem тоже с «м».","ти":8,"пи":1,"подтема":"Вопросы и вопросительные слова"},{"id":"1576aa43e0","тема":"Порядок слов","знак":"📐","вид":"ловушка","раздел":"⭐ Вопросительные слова — все сразу","урок":"dasha6","урокИмя":"Занятие 6 с Дашей","html":"<span class=\"big\">wie или welcher — оба «какой», но про разное</span>\n      <b>wie</b> — «какой по качеству, по характеру»: <i>Wie ist deine Tante?</i> — какая она? Добрая, весёлая.<br>\n      <b>welcher</b> — «какой <b>из</b> нескольких», выбор: стоишь в магазине перед вешалкой — <i>Welches Hemd möchtest du kaufen?</i> — какую из этих рубашек?<br><br>\n      И <b>wie alt</b> — «сколько лет». По-немецки буквально «<b>как стар</b>»: <i>Wie alt ist deine Schwester? — Sie ist zwölf Jahre alt</i> — «она двенадцать лет старая».","текст":"wie или welcher — оба «какой», но про разное wie — «какой по качеству, по характеру»: Wie ist deine Tante? — какая она? Добрая, весёлая. welcher — «какой из нескольких», выбор: стоишь в магазине перед вешалкой — Welches Hemd möchtest du kaufen? — какую из этих рубашек? И wie alt — «сколько лет». По-немецки буквально «как стар»: Wie alt ist deine Schwester? — Sie ist zwölf Jahre alt — «она двенадцать лет старая».","ти":8,"пи":1,"подтема":"Вопросы и вопросительные слова"},{"id":"64d7cf1b82","тема":"Порядок слов","знак":"📐","вид":"правило","раздел":"Упражнение: вопросительное слово по ответу","урок":"dasha6","урокИмя":"Занятие 6 с Дашей","html":"<b>Wann haben sich deine Eltern verheiratet?</b> — «Когда поженились твои родители?» Даша подсказала: вся эта конструкция — прошедшее время, <i>sich verheiraten</i> — пожениться. Разбирать её пока не нужно — просто узнай.","текст":"Wann haben sich deine Eltern verheiratet? — «Когда поженились твои родители?» Даша подсказала: вся эта конструкция — прошедшее время, sich verheiraten — пожениться. Разбирать её пока не нужно — просто узнай.","ти":8,"пи":1,"подтема":"Вопросы и вопросительные слова"},{"id":"031ff4f3f8","тема":"Порядок слов","знак":"📐","вид":"ловушка","раздел":"Упражнение: вопросительное слово по ответу","урок":"dasha6","урокИмя":"Занятие 6 с Дашей","html":"<span class=\"big\">Ошибки с занятия</span>\n      <b>Wie alt ist deine Oma?</b> — Гриша сначала сказал <s>wie viel</s>. «Сколько лет» — это всегда <b>wie alt</b>.<br>\n      <b>Woher kommst du?</b> — «откуда» на секунду вылетело из головы: <b>woher</b>. «Куда» — <b>wohin</b>. Запоминалка: -her — оттуда, -hin — туда.","текст":"Ошибки с занятия Wie alt ist deine Oma? — Гриша сначала сказал wie viel. «Сколько лет» — это всегда wie alt. Woher kommst du? — «откуда» на секунду вылетело из головы: woher. «Куда» — wohin. Запоминалка: -her — оттуда, -hin — туда.","ти":8,"пи":1,"подтема":"Вопросы и вопросительные слова"},{"id":"531d7be665","тема":"Порядок слов","знак":"📐","вид":"ловушка","раздел":"⭐⭐ Придумай вопрос к ответу","урок":"dasha6","урокИмя":"Занятие 6 с Дашей","html":"<span class=\"big\">Четыре правила, на которых Гриша споткнулся</span>\n      1️⃣ <b>После вопросительного слова — сразу глагол.</b> Гриша сказал <s>Woher deine Cousine kommt?</s> — Даша: «сначала глагол». Правильно: <b>Woher kommt</b> deine Cousine?<br>\n      2️⃣ <b>Глагол нельзя пропускать.</b> Прозвучало <s>Wie alt dein Bruder?</s> — нужен глагол: <b>Wie alt ist</b> dein Bruder?<br>\n      3️⃣ <b>«Сколько» — вместе с существительным.</b> Не «сколько имеешь ты детей», а «сколько детей имеешь ты»: <b>Wie viele Kinder</b> hast du? Потом глагол, потом «кто» — и не «deine» (твои), а «<b>du</b>» (ты).<br>\n      4️⃣ <b>Вопрос без вопросительного слова — глагол в самое начало:</b> <b>Ist</b> deine Familie groß?","текст":"Четыре правила, на которых Гриша споткнулся 1️⃣ После вопросительного слова — сразу глагол. Гриша сказал Woher deine Cousine kommt? — Даша: «сначала глагол». Правильно: Woher kommt deine Cousine? 2️⃣ Глагол нельзя пропускать. Прозвучало Wie alt dein Bruder? — нужен глагол: Wie alt ist dein Bruder? 3️⃣ «Сколько» — вместе с существительным. Не «сколько имеешь ты детей», а «сколько детей имеешь ты»: Wie viele Kinder hast du? Потом глагол, потом «кто» — и не «deine» (твои), а «du» (ты). 4️⃣ Вопрос без вопросительного слова — глагол в самое начало: Ist deine Familie groß?","ти":8,"пи":1,"подтема":"Вопросы и вопросительные слова"},{"id":"dcc64f2d56","тема":"Порядок слов","знак":"📐","вид":"ловушка","раздел":"⭐⭐ Вставь вопросительное слово (14 предложений)","урок":"dasha7","урокИмя":"Занятие 7 с Дашей","html":"<span class=\"big\">Где Гриша ошибся</span>\n      1️⃣ Число с точкой после него — это <b>порядковое</b> число: <i>am zehn<b>ten</b> Januar</i> — «10<b>-го</b> января», а не просто «десять».<br>\n      2️⃣ <b>Woher kommst du?</b> — «откуда приехал» — Гриша сначала перевёл дословно («приехать» = kommen), но по-русски естественнее спросить «где ты живёшь» — <b>Wo wohnst du?</b> Оба вопроса правильные, просто про разное: <i>woher</i> — откуда родом, <i>wo wohnst du</i> — где сейчас живёшь.<br>\n      3️⃣ <b>Was ist das? / Wer ist das?</b> — про собаку (и вообще про животных) годится и то, и другое. К людям <i>was ist das</i> не спрашивают.<br>\n      4️⃣ <b>Wie viel kostet das?</b> у этого вопроса нет пары «штучно / не штучно» — заменяли на <b>Was kostet das?</b>, это то же самое.","текст":"Где Гриша ошибся 1️⃣ Число с точкой после него — это порядковое число: am zehnten Januar — «10-го января», а не просто «десять». 2️⃣ Woher kommst du? — «откуда приехал» — Гриша сначала перевёл дословно («приехать» = kommen), но по-русски естественнее спросить «где ты живёшь» — Wo wohnst du? Оба вопроса правильные, просто про разное: woher — откуда родом, wo wohnst du — где сейчас живёшь. 3️⃣ Was ist das? / Wer ist das? — про собаку (и вообще про животных) годится и то, и другое. К людям was ist das не спрашивают. 4️⃣ Wie viel kostet das? у этого вопроса нет пары «штучно / не штучно» — заменяли на Was kostet das?, это то же самое.","ти":8,"пи":1,"подтема":"Вопросы и вопросительные слова"},{"id":"e353b28ddc","тема":"Порядок слов","знак":"📐","вид":"правило","раздел":"wann, wenn или wen — три похожих слова","урок":"dasha7","урокИмя":"Занятие 7 с Дашей","html":"Гриша перепутал <b>wenn</b> с <b>wann</b> — «увидел похожее слово и подумал, что за фигня». Даша разложила по полочкам:<br><br>\n      • <b>wann?</b> [ван] — «когда?», прямой вопрос: <i>Wann hast du Geburtstag?</i><br>\n      • <b>wenn</b> [вэн, с двумя n] — тоже переводится «когда», но в другой роли: это союз внутри сложного предложения, и его всегда можно заменить на «если». <i>Mir gefällt es nicht, <b>wenn</b> mir jemand lügt</i> — «мне не нравится, когда (=если) мне кто-то врёт».<br>\n      • <b>wen?</b> [вэн, тоже с двумя n] — это «кого?», склонённая форма от <b>wer</b> (кто). <i>Wen liebst du am meisten?</i> — «кого ты любишь больше всех?»","текст":"Гриша перепутал wenn с wann — «увидел похожее слово и подумал, что за фигня». Даша разложила по полочкам: • wann? [ван] — «когда?», прямой вопрос: Wann hast du Geburtstag? • wenn [вэн, с двумя n] — тоже переводится «когда», но в другой роли: это союз внутри сложного предложения, и его всегда можно заменить на «если». Mir gefällt es nicht, wenn mir jemand lügt — «мне не нравится, когда (=если) мне кто-то врёт». • wen? [вэн, тоже с двумя n] — это «кого?», склонённая форма от wer (кто). Wen liebst du am meisten? — «кого ты любишь больше всех?»","ти":8,"пи":1,"подтема":"Вопросы и вопросительные слова"},{"id":"64530a2556","тема":"Порядок слов","знак":"📐","вид":"правило","раздел":"als и so … wie","урок":"urok22","урокИмя":"Урок 23","html":"<b class=\"hl\">als</b> — «чем» после сравнительной: <i>größer <b>als</b></i> (больше, чем).<br>\n      <b class=\"hl\">so … wie</b> — «такой же, как»: <i><b>so</b> kalt <b>wie</b> gestern</i>. С отрицанием — «не такой, как»: <i>nicht so heiß wie</i>.<br><br>\n      <b>gern → lieber → am liebsten</b> — как сказать «предпочитаю» и «больше всего люблю»: <i>Ich trinke lieber Tee als Kaffee</i>.","текст":"als — «чем» после сравнительной: größer als (больше, чем). so … wie — «такой же, как»: so kalt wie gestern. С отрицанием — «не такой, как»: nicht so heiß wie. gern → lieber → am liebsten — как сказать «предпочитаю» и «больше всего люблю»: Ich trinke lieber Tee als Kaffee.","ти":8,"пи":1,"подтема":"Вопросы и вопросительные слова"},{"id":"e20439c9e8","тема":"Порядок слов","знак":"📐","вид":"правило","раздел":"Вопросы","урок":"urok3","урокИмя":"Урок 4","html":"С вопросительным словом (<i>wo, was, wie, woher</i>) глагол идёт сразу за ним, на втором месте: <i>Wo wohnen Sie?</i><br>\n      Вопрос «да или нет» — глагол на <b>первом</b> месте: <i>Wohnen Sie in Berlin?</i>","текст":"С вопросительным словом (wo, was, wie, woher) глагол идёт сразу за ним, на втором месте: Wo wohnen Sie? Вопрос «да или нет» — глагол на первом месте: Wohnen Sie in Berlin?","ти":8,"пи":1,"подтема":"Вопросы и вопросительные слова"},{"id":"9c15c2b16c","тема":"Порядок слов","знак":"📐","вид":"правило","раздел":"Ответы: Ja, Nein, Doch","урок":"urok3","урокИмя":"Урок 4","html":"<b>Ja</b> — да, <b>Nein</b> — нет. Отрицание глагола — <b>nicht</b> после него: <i>Ich wohne nicht in Berlin.</i><br><br>\n      Особое слово <b class=\"hl\">Doch</b> — «нет-нет, как раз да». Им возражают на вопрос с отрицанием: <i>Wohnen Sie nicht in Berlin? — Doch!</i>","текст":"Ja — да, Nein — нет. Отрицание глагола — nicht после него: Ich wohne nicht in Berlin. Особое слово Doch — «нет-нет, как раз да». Им возражают на вопрос с отрицанием: Wohnen Sie nicht in Berlin? — Doch!","ти":8,"пи":1,"подтема":"Вопросы и вопросительные слова"},{"id":"32e4340b8a","тема":"Порядок слов","знак":"📐","вид":"правило","раздел":"⭐ ob — когда вопросительного слова нет","урок":"urok31","урокИмя":"Урок 32","html":"Если прямой вопрос — просто «да или нет», в косвенной речи перед ним встаёт <b class=\"hl\">ob</b> («ли»), а глагол — в конец.","текст":"Если прямой вопрос — просто «да или нет», в косвенной речи перед ним встаёт ob («ли»), а глагол — в конец.","ти":8,"пи":1,"подтема":"Вопросы и вопросительные слова"},{"id":"44a8af64a4","тема":"Порядок слов","знак":"📐","вид":"правило","раздел":"⭐ Высказать мнение","урок":"urok59","урокИмя":"Урок 60","html":"<b>Две грамматические ловушки:</b><br>\n      • <i>Meiner Meinung nach</i> занимает <b>первое место</b> — значит, глагол сразу за ним: <i>Meiner Meinung nach <b>ist</b> die Lasertherapie besser.</i><br>\n      • После <i>Ich denke / glaube / finde, <b>dass</b> …</i> и <i>Ich bin der Meinung, <b>dass</b> …</i> глагол уходит в <b>конец</b>: <i>…, dass wir noch warten <b>sollten</b>.</i><br>\n      • <b>halten für</b> + Akk. — «считать каким-то»: <i>Ich halte das <b>für</b> riskant.</i> (не «wie»).","текст":"Две грамматические ловушки: • Meiner Meinung nach занимает первое место — значит, глагол сразу за ним: Meiner Meinung nach ist die Lasertherapie besser. • После Ich denke / glaube / finde, dass … и Ich bin der Meinung, dass … глагол уходит в конец: …, dass wir noch warten sollten. • halten für + Akk. — «считать каким-то»: Ich halte das für riskant. (не «wie»).","ти":8,"пи":1,"подтема":"Вопросы и вопросительные слова"},{"id":"44b1b3ac6f","тема":"Порядок слов","знак":"📐","вид":"правило","раздел":"W-Fragen — вопросительные слова","урок":"urok8","урокИмя":"Урок 9","html":"Это <b>не глаголы</b>, а вопросительные слова — почти все начинаются на <b class=\"hl\">W</b>, отсюда название <i>W-Fragen</i>. Порядок железный: <b>W-слово → глагол → кто</b>. <i>Wo</i> <b>wohnen</b> Sie? — глагол всегда вторым (правило из Урока 3 работает и здесь).","текст":"Это не глаголы, а вопросительные слова — почти все начинаются на W, отсюда название W-Fragen. Порядок железный: W-слово → глагол → кто. Wo wohnen Sie? — глагол всегда вторым (правило из Урока 3 работает и здесь).","ти":8,"пи":1,"подтема":"Вопросы и вопросительные слова"},{"id":"f1ce69ece3","тема":"Общение и обращение","знак":"💬","вид":"правило","раздел":"«Wie geht's?» — и как ответить","урок":"urok2","урокИмя":"Урок 3","html":"Вежливо — <b>Wie geht es Ihnen?</b>, по-свойски — <b>Wie geht's?</b> (это сокращение от <i>Wie geht es?</i>). Дословно — «как идёт?».<br><br>\n      Ответ «у меня хорошо» по-немецки звучит как «<b class=\"hl\">мне</b> идёт хорошо»: <b>Mir geht es gut</b>. Можно и в другом порядке: <i>Es geht mir gut</i>. А просто <b>Es geht</b> — «идёт кое-как» — значит «так себе».","текст":"Вежливо — Wie geht es Ihnen?, по-свойски — Wie geht's? (это сокращение от Wie geht es?). Дословно — «как идёт?». Ответ «у меня хорошо» по-немецки звучит как «мне идёт хорошо»: Mir geht es gut. Можно и в другом порядке: Es geht mir gut. А просто Es geht — «идёт кое-как» — значит «так себе».","ти":8,"пи":1,"подтема":"Вопросы и вопросительные слова"},{"id":"cd903fc02f","тема":"Слова, которые путают","знак":"⚠️","вид":"правило","раздел":"⭐⭐ Придумай вопрос к ответу","урок":"dasha6","урокИмя":"Занятие 6 с Дашей","html":"<b>Как спросить о человеке — три разных вопроса:</b><br>\n      • <b>Wer ist das?</b> — кто это? (ответ: это мой дядя)<br>\n      • <b>Was ist dein Vater von Beruf?</b> — кем работает? (ответ: он инженер). Гриша сначала сказал <s>Wie</s> — «как» здесь не подходит.<br>\n      • <b>Wie ist deine Großmutter?</b> — какая она по характеру? (ответ: очень приветливая). Гриша сказал <s>Wer</s> — но «кто» спрашивает про человека, а не про его качества.","текст":"Как спросить о человеке — три разных вопроса: • Wer ist das? — кто это? (ответ: это мой дядя) • Was ist dein Vater von Beruf? — кем работает? (ответ: он инженер). Гриша сначала сказал Wie — «как» здесь не подходит. • Wie ist deine Großmutter? — какая она по характеру? (ответ: очень приветливая). Гриша сказал Wer — но «кто» спрашивает про человека, а не про его качества.","ти":8,"пи":1,"подтема":"Вопросы и вопросительные слова"},{"id":"0aeeddffbd","тема":"Слова, которые путают","знак":"⚠️","вид":"правило","раздел":"W-слово остаётся тем же","урок":"urok31","урокИмя":"Урок 32","html":"Если в прямом вопросе уже было своё слово (<b>wann, wo, warum, was, wer, wie</b>) — в косвенном вопросе оно никуда не девается, просто глагол теперь в конце.","текст":"Если в прямом вопросе уже было своё слово (wann, wo, warum, was, wer, wie) — в косвенном вопросе оно никуда не девается, просто глагол теперь в конце.","ти":8,"пи":1,"подтема":"Вопросы и вопросительные слова"},{"id":"546524830d","тема":"Разное","знак":"📎","вид":"правило","раздел":"⭐⭐ Вопросы: два вида","урок":"dasha5","урокИмя":"Занятие 5 с Дашей","html":"<b>Как строится общий вопрос.</b> Берём утвердительное предложение и переносим глагол\n      на самое первое место. Всё, больше ничего менять не надо.","текст":"Как строится общий вопрос. Берём утвердительное предложение и переносим глагол на самое первое место. Всё, больше ничего менять не надо.","ти":8,"пи":1,"подтема":"Вопросы и вопросительные слова"},{"id":"4f87090fe6","тема":"Разное","знак":"📎","вид":"правило","раздел":"⭐⭐ Придумай вопрос к ответу","урок":"dasha6","урокИмя":"Занятие 6 с Дашей","html":"<b>wohnen или leben?</b> Вопрос Гриши. Оба — «жить», и ошибкой не будет ни то, ни другое. Но:<br>\n      • <b>wohnen</b> — где живёшь, адрес, город: <i>Meine Eltern wohnen in Dresden</i>. Так говорят чаще.<br>\n      • <b>leben</b> — жить вообще, как живёшь, более «абстрактно»: <i>Er lebt glücklich</i> — он живёт счастливо.","текст":"wohnen или leben? Вопрос Гриши. Оба — «жить», и ошибкой не будет ни то, ни другое. Но: • wohnen — где живёшь, адрес, город: Meine Eltern wohnen in Dresden. Так говорят чаще. • leben — жить вообще, как живёшь, более «абстрактно»: Er lebt glücklich — он живёт счастливо.","ти":8,"пи":1,"подтема":"Вопросы и вопросительные слова"},{"id":"d4b4dc72bc","тема":"Разное","знак":"📎","вид":"ловушка","раздел":"Хайди Клум — вопросы и ответы","урок":"dasha8","урокИмя":"Занятие 8 с Дашей","html":"<span class=\"big\">von Beruf ИЛИ arbeitet als — не вместе</span>\n      Профессию можно сказать двумя способами: <i>Er ist Musiker <b>von Beruf</b></i> (он по профессии музыкант) или <i>Er <b>arbeitet als</b> Musiker</i> (работает музыкантом). Даша: <i>«Мы их не скрещиваем»</i> — в одном предложении только один.<br><br>\n      <b>der Beruf</b> — профессия, <b>die Arbeit</b> — работа (место, занятие).","текст":"von Beruf ИЛИ arbeitet als — не вместе Профессию можно сказать двумя способами: Er ist Musiker von Beruf (он по профессии музыкант) или Er arbeitet als Musiker (работает музыкантом). Даша: «Мы их не скрещиваем» — в одном предложении только один. der Beruf — профессия, die Arbeit — работа (место, занятие).","ти":8,"пи":1,"подтема":"Вопросы и вопросительные слова"},{"id":"0a350f4510","тема":"Разное","знак":"📎","вид":"правило","раздел":"wie и als — «как» и «чем»","урок":"polya14","урокИмя":"Занятие 14 Полины","html":"Когда сравниваем, нужен «мостик» между двумя вещами:<br>\n      • <b class=\"hl\">als</b> = <b>чем</b>. Одно больше/лучше другого: <i>besser <b>als</b></i>. Русское «ты выше, <b>чем</b> я».<br>\n      • <b class=\"hl\">wie</b> = <b>как</b>. Одно такое же, как другое: <i>genauso … <b>wie</b></i>. Русское «такая же красивая, <b>как</b> Таня».<br><br>\n      Пока запоминаем только это: прилагательные и два слова. Даша: «больше ничего не заморачивайте».<br>\n      А ещё <b>als</b> уже встречалось в другом значении — «в качестве»: <i>Ich arbeite <b>als</b> Ärztin</i> — «я работаю врачом» (Даша: «кем работает»). Слово то же, а смысл другой — тоже запоминаем.","текст":"Когда сравниваем, нужен «мостик» между двумя вещами: • als = чем. Одно больше/лучше другого: besser als. Русское «ты выше, чем я». • wie = как. Одно такое же, как другое: genauso … wie. Русское «такая же красивая, как Таня». Пока запоминаем только это: прилагательные и два слова. Даша: «больше ничего не заморачивайте». А ещё als уже встречалось в другом значении — «в качестве»: Ich arbeite als Ärztin — «я работаю врачом» (Даша: «кем работает»). Слово то же, а смысл другой — тоже запоминаем.","ти":8,"пи":1,"подтема":"Вопросы и вопросительные слова"},{"id":"039ae050a0","тема":"Разное","знак":"📎","вид":"ловушка","раздел":"⚠️ wie или welche — здесь Полина споткнулась","урок":"polya6","урокИмя":"Занятие 6 Полины","html":"<span class=\"big\">wie — «каков», welche — «который из»</span>\n      <b>wie</b> спрашивает про <b>качество</b>: какая она — добрая, строгая, весёлая?<br>\n      <b>welche</b> спрашивает про <b>выбор из группы</b>: которая из этих бабушек твоя?<br><br>\n      Полина сказала <i>Welche ist deine Großmutter?</i>, имея в виду качество. Даша объяснила: если бы стояла группа бабушек и надо было показать свою — тогда <i>welche</i>. А про характер — <i>wie</i>.","текст":"wie — «каков», welche — «который из» wie спрашивает про качество: какая она — добрая, строгая, весёлая? welche спрашивает про выбор из группы: которая из этих бабушек твоя? Полина сказала Welche ist deine Großmutter?, имея в виду качество. Даша объяснила: если бы стояла группа бабушек и надо было показать свою — тогда welche. А про характер — wie.","ти":8,"пи":1,"подтема":"Вопросы и вопросительные слова"},{"id":"075b94fcf6","тема":"Разное","знак":"📎","вид":"ловушка","раздел":"Напитки — и главный вопрос в немецком ресторане","урок":"urok14","урокИмя":"Урок 15","html":"<span class=\"big\">Попросишь «воду» — принесут газированную</span>\n      В Германии и Австрии <i>Wasser</i> по умолчанию <b>с газом</b>. Если нужна обычная — говори <b>ohne Kohlensäure</b> [онэ колензойрэ] или коротко <b>ein stilles Wasser</b>. Пригодится и на работе: пациенту после наркоза газировку не предложишь.","текст":"Попросишь «воду» — принесут газированную В Германии и Австрии Wasser по умолчанию с газом. Если нужна обычная — говори ohne Kohlensäure [онэ колензойрэ] или коротко ein stilles Wasser. Пригодится и на работе: пациенту после наркоза газировку не предложишь.","ти":8,"пи":1,"подтема":"Вопросы и вопросительные слова"},{"id":"75ad8ad653","тема":"Разное","знак":"📎","вид":"правило","раздел":"Прямой и косвенный вопрос","урок":"urok31","урокИмя":"Урок 32","html":"Прямой вопрос — глагол на первом месте (без слова) или на втором (со словом). Косвенный вопрос — глагол уходит в <b>самый конец</b>, ровно как во всех придаточных из урока 25 (weil, dass, wenn).","текст":"Прямой вопрос — глагол на первом месте (без слова) или на втором (со словом). Косвенный вопрос — глагол уходит в самый конец, ровно как во всех придаточных из урока 25 (weil, dass, wenn).","ти":8,"пи":1,"подтема":"Вопросы и вопросительные слова"},{"id":"aecc52a353","тема":"Разное","знак":"📎","вид":"правило","раздел":"dass или ob","урок":"urok31","урокИмя":"Урок 32","html":"Оба переводятся похоже, но смысл разный. <b class=\"hl\">dass</b> — уверенное утверждение, «что». <b class=\"hl\">ob</b> — неуверенность, вопрос, «ли». Сравните пары:","текст":"Оба переводятся похоже, но смысл разный. dass — уверенное утверждение, «что». ob — неуверенность, вопрос, «ли». Сравните пары:","ти":8,"пи":1,"подтема":"Вопросы и вопросительные слова"},{"id":"f321b430a8","тема":"Разное","знак":"📎","вид":"правило","раздел":"⭐⭐ Семь вопросов о боли","урок":"urok47","урокИмя":"Урок 48","html":"Любую жалобу разбирайте по одной схеме: <b>где</b> → <b>с какого времени</b> и <b>как началось</b> → <b>какая</b> (dumpf — тупая, stechend — колющая, brennend — жгучая, ziehend — тянущая) → <b>насколько сильная</b> (шкала 1–10) → <b>отдаёт ли</b> → <b>что облегчает или усиливает</b> → <b>что ещё</b> (температура, отёк). Для вен главные ответы — «вечером хуже», «при долгом стоянии хуже», «лучше, если поднять ноги».","текст":"Любую жалобу разбирайте по одной схеме: где → с какого времени и как началось → какая (dumpf — тупая, stechend — колющая, brennend — жгучая, ziehend — тянущая) → насколько сильная (шкала 1–10) → отдаёт ли → что облегчает или усиливает → что ещё (температура, отёк). Для вен главные ответы — «вечером хуже», «при долгом стоянии хуже», «лучше, если поднять ноги».","ти":8,"пи":1,"подтема":"Вопросы и вопросительные слова"},{"id":"d32c6b8767","тема":"Множественное число","знак":"➕","вид":"правило","раздел":"⭐ sowohl … als auch — и … и","урок":"urok41","урокИмя":"Урок 42","html":"Соединяет два слова или две части фразы: «и то, и другое». Если это <b>два подлежащих</b>, глагол ставят во <b>множественном</b> числе.","текст":"Соединяет два слова или две части фразы: «и то, и другое». Если это два подлежащих, глагол ставят во множественном числе.","ти":8,"пи":2,"подтема":"Придаточные: weil, dass, wenn — глагол в конец"},{"id":"1983f42825","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"wenn — если и когда","урок":"urok25","урокИмя":"Урок 26","html":"У <b class=\"hl\">wenn</b> два значения, и оба про <b>повторяющееся или будущее</b>:<br>\n      1️⃣ <b>если</b> — условие: <i>Wenn Sie Schmerzen <b>haben</b>, nehmen Sie eine Tablette.</i><br>\n      2️⃣ <b>когда</b> — то, что бывает не раз: <i>Ich trinke Tee, wenn ich krank <b>bin</b>.</i><br><br>\n      Чтобы подчеркнуть «каждый раз, когда», добавляют <b>immer wenn</b>.","текст":"У wenn два значения, и оба про повторяющееся или будущее: 1️⃣ если — условие: Wenn Sie Schmerzen haben, nehmen Sie eine Tablette. 2️⃣ когда — то, что бывает не раз: Ich trinke Tee, wenn ich krank bin. Чтобы подчеркнуть «каждый раз, когда», добавляют immer wenn.","ти":8,"пи":2,"подтема":"Придаточные: weil, dass, wenn — глагол в конец"},{"id":"e0998bbf62","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"Если придаточное впереди","урок":"urok25","урокИмя":"Урок 26","html":"Придаточное можно поставить и первым — смысл тот же, но акцент сильнее. Тогда срабатывает правило, которое немцы называют «глагол, запятая, глагол»:<br><br>\n      <i><b>Wenn</b> Sie Schmerzen <b>haben</b>, <b>nehmen</b> Sie eine Tablette.</i><br><br>\n      Видите два глагола подряд через запятую? Это не ошибка, это и есть признак правильной постройки. Причина простая: всё придаточное считается <span class=\"hl\">одним первым членом</span> главного предложения, а глагол в главном обязан стоять вторым — значит, сразу после запятой.","текст":"Придаточное можно поставить и первым — смысл тот же, но акцент сильнее. Тогда срабатывает правило, которое немцы называют «глагол, запятая, глагол»: Wenn Sie Schmerzen haben, nehmen Sie eine Tablette. Видите два глагола подряд через запятую? Это не ошибка, это и есть признак правильной постройки. Причина простая: всё придаточное считается одним первым членом главного предложения, а глагол в главном обязан стоять вторым — значит, сразу после запятой.","ти":8,"пи":2,"подтема":"Придаточные: weil, dass, wenn — глагол в конец"},{"id":"6e6e4f6e44","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"dass — что","урок":"urok25","урокИмя":"Урок 26","html":"<b class=\"hl\">dass</b> — это русское «что» в середине фразы: <i>Я думаю, <b>что</b>…</i>, <i>Я надеюсь, <b>что</b>…</i><br><br>\n      Ставится после глаголов мысли и чувства: <b>denken</b> (думать), <b>glauben</b> (полагать), <b>hoffen</b> (надеяться), <b>wissen</b> (знать), <b>sagen</b> (говорить), <b>sehen</b> (видеть), а ещё после оборота <b>Es ist wichtig, dass…</b> — «важно, чтобы…».<br><br>\n      ⚠️ Не путать с <b>das</b> (артикль среднего рода и «это»). Здесь <b>две s</b>: da<b>ss</b>.","текст":"dass — это русское «что» в середине фразы: Я думаю, что…, Я надеюсь, что… Ставится после глаголов мысли и чувства: denken (думать), glauben (полагать), hoffen (надеяться), wissen (знать), sagen (говорить), sehen (видеть), а ещё после оборота Es ist wichtig, dass… — «важно, чтобы…». ⚠️ Не путать с das (артикль среднего рода и «это»). Здесь две s: dass.","ти":8,"пи":2,"подтема":"Придаточные: weil, dass, wenn — глагол в конец"},{"id":"3f995729ac","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"Короче придаточного","урок":"urok42","урокИмя":"Урок 43","html":"Партицип заменяет относительное придаточное из урока 38. Все дополнительные слова (gestern, stark) встают <b>между артиклем и партиципом</b>: <i>der <b>gestern</b> operierte Patient</i>. В речи чаще придаточное, в выписке — партицип.","текст":"Партицип заменяет относительное придаточное из урока 38. Все дополнительные слова (gestern, stark) встают между артиклем и партиципом: der gestern operierte Patient. В речи чаще придаточное, в выписке — партицип.","ти":8,"пи":2,"подтема":"Придаточные: weil, dass, wenn — глагол в конец"},{"id":"b1063f7b06","тема":"Порядок слов","знак":"📐","вид":"правило","раздел":"Два предложения в одном","урок":"urok25","урокИмя":"Урок 26","html":"Было два отдельных предложения: <i>Ich komme nicht.</i> и <i>Ich bin krank.</i><br>\n      Связываем словом <b class=\"hl\">weil</b> — и второе становится <b>придаточным</b> (der Nebensatz). В нём порядок слов меняется:<br><br>\n      <i>Ich komme nicht, <b>weil</b> ich krank <b>bin</b>.</i><br><br>\n      Видите? Глагол <b>bin</b> ушёл в самый конец, за слово <i>krank</i>. По-русски мы бы сказали «потому что я болен» — глагол на месте. По-немецки он уезжает. <span class=\"hl\">Это и есть вся тема урока.</span><br><br>\n      Первая часть называется главным предложением (der Hauptsatz), в ней всё как обычно: глагол вторым.","текст":"Было два отдельных предложения: Ich komme nicht. и Ich bin krank. Связываем словом weil — и второе становится придаточным (der Nebensatz). В нём порядок слов меняется: Ich komme nicht, weil ich krank bin. Видите? Глагол bin ушёл в самый конец, за слово krank. По-русски мы бы сказали «потому что я болен» — глагол на месте. По-немецки он уезжает. Это и есть вся тема урока. Первая часть называется главным предложением (der Hauptsatz), в ней всё как обычно: глагол вторым.","ти":8,"пи":2,"подтема":"Придаточные: weil, dass, wenn — глагол в конец"},{"id":"04d8aef961","тема":"Порядок слов","знак":"📐","вид":"ловушка","раздел":"weil — потому что","урок":"urok25","урокИмя":"Урок 26","html":"<span class=\"big\">weil или denn — значат одно, а ведут себя по-разному</span>\n      <b>denn</b> (урок 23) порядок слов <span class=\"hl\">не трогает</span>: <i>Ich komme nicht, denn ich <b>bin</b> krank.</i><br>\n      <b>weil</b> отправляет глагол <span class=\"hl\">в конец</span>: <i>Ich komme nicht, weil ich krank <b>bin</b>.</i><br><br>\n      Смысл одинаковый. В разговоре немцы чаще говорят weil, в письме — оба. Если торопитесь и боитесь запутаться — говорите denn, это не ошибка.","текст":"weil или denn — значат одно, а ведут себя по-разному denn (урок 23) пор
