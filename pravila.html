":"Артикли и род","знак":"🎨","вид":"ловушка","раздел":"Артикли и род","урок":"dasha1","урокИмя":"Занятие 1 с Дашей","html":"Григорий спросил, есть ли принцип запоминания рода. <b>Ответ Даши: принципа нет</b> — род зазубривается вместе со словом. Поэтому существительное учим <b>всегда с артиклем</b>: артикль и есть носитель рода.","текст":"Григорий спросил, есть ли принцип запоминания рода. Ответ Даши: принципа нет — род зазубривается вместе со словом. Поэтому существительное учим всегда с артиклем: артикль и есть носитель рода."},{"id":"4ecf530955","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"Время суток","урок":"dasha1","урокИмя":"Занятие 1 с Дашей","html":"Все части суток — <b class=\"hl\">мужского рода (der)</b>, кроме ночи: <b class=\"hl\">die Nacht</b>. Логика приставок: <b>vor</b> = до, <b>nach</b> = после → <i>Vormittag</i> / <i>Nachmittag</i> от <i>Mittag</i>.","текст":"Все части суток — мужского рода (der), кроме ночи: die Nacht. Логика приставок: vor = до, nach = после → Vormittag / Nachmittag от Mittag."},{"id":"2a82306e60","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"⚠️ zu Hause и nach Hause — маленькая тема, которую все путают","урок":"dasha3","урокИмя":"Занятие 3 с Дашей","html":"Слово <b class=\"hl\">das Haus</b> — дом, средний род, пишется без всяких окончаний.<br><br>\n      Но есть два предлога, <b>zu</b> и <b>nach</b>, в паре с которыми это слово <b class=\"hl\">отращивает на конце -e</b> и превращается фактически в наречие. Получаются две устойчивые формы, которые надо просто запомнить:\n    </div>\n    <table class=\"casetab\">\n      <tr><th>Форма</th><th>Значение</th><th>Вопрос</th></tr>\n      <tr><td><b>zu Hause</b></td><td>дома</td><td class=\"wo\">где?</td></tr>\n      <tr><td><b>nach Hause</b></td><td>домой</td><td class=\"wohin\">куда?</td></tr>\n    </table>\n    <div class=\"grammar-box\" style=\"margin-top:14px\">\n      Логика простая: <b>nach</b> — предлог направления (куда-то движемся), поэтому <i>nach Hause</i> = домой. А <b>zu</b> тут про нахождение, поэтому <i>zu Hause</i> = дома.","текст":"Слово das Haus — дом, средний род, пишется без всяких окончаний. Но есть два предлога, zu и nach, в паре с которыми это слово отращивает на конце -e и превращается фактически в наречие. Получаются две устойчивые формы, которые надо просто запомнить: ФормаЗначениеВопрос zu Hauseдомагде? nach Hauseдомойкуда? Логика простая: nach — предлог направления (куда-то движемся), поэтому nach Hause = домой. А zu тут про нахождение, поэтому zu Hause = дома."},{"id":"b4ebaa01e6","тема":"Артикли и род","знак":"🎨","вид":"ловушка","раздел":"Новые слова занятия","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"<span class=\"big\">der See или die See?</span>\n      Одно и то же слово, но артикль меняет смысл целиком.\n      <b>der See</b> — озеро, <b>die See</b> — море. Даша сказала: чаще всего это слово\n      используют всё-таки для <b>озера</b>, а для моря есть отдельное слово <b>das Meer</b>.","текст":"der See или die See? Одно и то же слово, но артикль меняет смысл целиком. der See — озеро, die See — море. Даша сказала: чаще всего это слово используют всё-таки для озера, а для моря есть отдельное слово das Meer."},{"id":"b5bdcf72fc","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"⭐ Куда ставить nicht — и почему тут нельзя kein","урок":"polya6","урокИмя":"Занятие 6 Полины","html":"Полина помнила «nicht ставится в конец» и применила это не туда. Даша уточнила правило:<br><br>\n      Отрицаем <b class=\"hl\">глагол</b> → <i>nicht</i> идёт <b>в конец</b>.<br>\n      Отрицаем <b class=\"hl\">другую часть речи</b> → <i>nicht</i> встаёт <b>прямо перед ней</b>.","текст":"Полина помнила «nicht ставится в конец» и применила это не туда. Даша уточнила правило: Отрицаем глагол → nicht идёт в конец. Отрицаем другую часть речи → nicht встаёт прямо перед ней."},{"id":"735f0aae3f","тема":"Артикли и род","знак":"🎨","вид":"ловушка","раздел":"⭐ Куда ставить nicht — и почему тут нельзя kein","урок":"polya6","урокИмя":"Занятие 6 Полины","html":"<span class=\"big\">Почему нельзя «arbeitet als kein Verkäuferin»</span>\n      <b>kein обязан стоять непосредственно перед существительным.</b> А здесь перед существительным уже сидит предлог <i>als</i>, и подвинуть его некуда — <i>kein</i> просто не влезает.<br><br>\n      Поэтому только <b>nicht als Verkäuferin</b>. Зато без предлога <i>kein</i> прекрасно работает: <b>Patricia ist keine Verkäuferin</b> — она не продавщица.","текст":"Почему нельзя «arbeitet als kein Verkäuferin» kein обязан стоять непосредственно перед существительным. А здесь перед существительным уже сидит предлог als, и подвинуть его некуда — kein просто не влезает. Поэтому только nicht als Verkäuferin. Зато без предлога kein прекрасно работает: Patricia ist keine Verkäuferin — она не продавщица."},{"id":"60b310de66","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"⭐⭐ Новая тема: женский род профессий (феминитивы)","урок":"polya7","урокИмя":"Занятие 7 Полины","html":"<b>Как образуется:</b><br>\n      1️⃣ меняем артикль <b class=\"hl\">der → die</b><br>\n      2️⃣ добавляем суффикс <b class=\"hl\">-in</b><br>\n      3️⃣ если слово кончается на <b>-e</b>, эту -e <b>убираем</b>: <i>der Löw<b>e</b> → die Löw<b>in</b></i>","текст":"Как образуется: 1️⃣ меняем артикль der → die 2️⃣ добавляем суффикс -in 3️⃣ если слово кончается на -e, эту -e убираем: der Löwe → die Löwin"},{"id":"8f802c5a1e","тема":"Артикли и род","знак":"🎨","вид":"ловушка","раздел":"⭐⭐ Новая тема: женский род профессий (феминитивы)","урок":"polya7","урокИмя":"Занятие 7 Полины","html":"<span class=\"big\">В немецком феминитивы обязательны — это не вежливость, а грамматика</span>\n      Даша подчеркнула разницу с русским: у нас феминитивы часто опускают («она врач», «она директор»), и это нормально. <b>В немецком так нельзя</b> — правило строго регулируется грамматикой.<br><br>\n      Про женщину-врача скажут только <b class=\"hl\">die Ärztin</b>, никогда не <i>der Arzt</i>. Для тебя это прямо рабочее слово.","текст":"В немецком феминитивы обязательны — это не вежливость, а грамматика Даша подчеркнула разницу с русским: у нас феминитивы часто опускают («она врач», «она директор»), и это нормально. В немецком так нельзя — правило строго регулируется грамматикой. Про женщину-врача скажут только die Ärztin, никогда не der Arzt. Для тебя это прямо рабочее слово."},{"id":"6aeb7fced6","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"⭐ Женский род: главное правило","урок":"polya8","урокИмя":"Занятие 8 Полины","html":"<b>Что вообще происходит.</b> В немецком у слов, обозначающих людей, есть мужская и женская форма.\n      Не «врач» на всех, а <b>врач-мужчина</b> и <b>врач-женщина</b> — разными словами.<br><br>\n      <b>Правило целиком:</b><br>\n      1️⃣ Меняем артикль: <span class=\"hl\">der</span> → <span class=\"hl\">die</span><br>\n      2️⃣ Добавляем в конец слова <span class=\"hl\">-in</span><br><br>\n      Всё. Больше ничего делать не надо.","текст":"Что вообще происходит. В немецком у слов, обозначающих людей, есть мужская и женская форма. Не «врач» на всех, а врач-мужчина и врач-женщина — разными словами. Правило целиком: 1️⃣ Меняем артикль: der → die 2️⃣ Добавляем в конец слова -in Всё. Больше ничего делать не надо."},{"id":"aa7d29137a","тема":"Артикли и род","знак":"🎨","вид":"ловушка","раздел":"Животные: пара есть не у всех","урок":"polya8","урокИмя":"Занятие 8 Полины","html":"<span class=\"big\">У собаки женской формы нет вообще</span>\n      <b>der Hund</b> — это и пёс, и собака. Если надо уточнить, спрашивают отдельно:\n      «это он или она?». А вот у кошки пара есть, только наоборот — основное слово женское:\n      <b>die Katze</b> (кошка) и <b>der Kater</b> (кот).","текст":"У собаки женской формы нет вообще der Hund — это и пёс, и собака. Если надо уточнить, спрашивают отдельно: «это он или она?». А вот у кошки пара есть, только наоборот — основное слово женское: die Katze (кошка) и der Kater (кот)."},{"id":"4e64ba0ca5","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"⭐ Когда артикль не нужен","урок":"polya8","урокИмя":"Занятие 8 Полины","html":"<b>Нулевой артикль</b> — это когда артикля просто нет. Не «пустой» артикль, а его отсутствие.\n      Полина спросила, что это такое, и Даша разобрала три случая.","текст":"Нулевой артикль — это когда артикля просто нет. Не «пустой» артикль, а его отсутствие. Полина спросила, что это такое, и Даша разобрала три случая."},{"id":"f6bea775aa","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"⭐ Когда артикль не нужен","урок":"polya8","урокИмя":"Занятие 8 Полины","html":"<b>1. Множественное число, когда предметы неопределённые.</b><br>\n      Фотограф делает фотографии — какие? Да любые, просто фотографии. Артикль не нужен.<br><br>\n      <b>2. Когда обобщаем.</b><br>\n      «Я люблю цветы» — не эти три цветка на столе, а цветы вообще. Артикль не нужен.<br><br>\n      <b>3. С тем, что не считают поштучно.</b><br>\n      Мясо, рыба, соль, сахар — их не пересчитаешь. Артикль обычно не нужен.","текст":"1. Множественное число, когда предметы неопределённые. Фотограф делает фотографии — какие? Да любые, просто фотографии. Артикль не нужен. 2. Когда обобщаем. «Я люблю цветы» — не эти три цветка на столе, а цветы вообще. Артикль не нужен. 3. С тем, что не считают поштучно. Мясо, рыба, соль, сахар — их не пересчитаешь. Артикль обычно не нужен."},{"id":"f67e6a2d13","тема":"Артикли и род","знак":"🎨","вид":"ловушка","раздел":"⭐ Когда артикль не нужен","урок":"polya8","урокИмя":"Занятие 8 Полины","html":"<span class=\"big\">А когда артикль во множественном всё-таки есть?</span>\n      Только <b>определённый</b> — <b>die</b>. Это когда речь о конкретных предметах, а не о любых.\n      Неопределённого артикля во множественном числе не бывает вообще.","текст":"А когда артикль во множественном всё-таки есть? Только определённый — die. Это когда речь о конкретных предметах, а не о любых. Неопределённого артикля во множественном числе не бывает вообще."},{"id":"6ebd84de2f","тема":"Артикли и род","знак":"🎨","вид":"ловушка","раздел":"⚠️ Немец — исключение","урок":"polya8","урокИмя":"Занятие 8 Полины","html":"<span class=\"big\">Здесь правило не работает</span>\n      Полина сама заметила: «А почему немка не Deutschin, а Deutsche?»<br><br>\n      Ответ Даши: это исключение, других объяснений нет. У немцев мужская и женская форма\n      выглядят одинаково, меняется только артикль:<br><br>\n      <b>der Deutsche</b> — немец &nbsp;·&nbsp; <b>die Deutsche</b> — немка","текст":"Здесь правило не работает Полина сама заметила: «А почему немка не Deutschin, а Deutsche?» Ответ Даши: это исключение, других объяснений нет. У немцев мужская и женская форма выглядят одинаково, меняется только артикль: der Deutsche — немец &nbsp;·&nbsp; die Deutsche — немка"},{"id":"083070922a","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"Дни недели (die Woche)","урок":"urok10","урокИмя":"Урок 10","html":"Все дни — <b class=\"hl\">мужского рода (der)</b>. «В такой-то день» = <b class=\"hl\">am</b> + день: <i>am Montag</i> (в понедельник). Вопрос: <b>Wann?</b> (когда?)","текст":"Все дни — мужского рода (der). «В такой-то день» = am + день: am Montag (в понедельник). Вопрос: Wann? (когда?)"},{"id":"b55de18305","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"Слияния: in+dem=im, an+dem=am…","урок":"urok11","урокИмя":"Урок 11","html":"Немцы «склеивают» частые предлоги с артиклем: <b class=\"hl\">in dem → im</b>, <b class=\"hl\">an dem → am</b>, <b class=\"hl\">zu dem → zum</b>, <b class=\"hl\">zu der → zur</b>, <b class=\"hl\">in das → ins</b>. Говори коротко — так звучит по-немецки.","текст":"Немцы «склеивают» частые предлоги с артиклем: in dem → im, an dem → am, zu dem → zum, zu der → zur, in das → ins. Говори коротко — так звучит по-немецки."},{"id":"7bdb7f5701","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"Как сказать «не надо»","урок":"urok13","урокИмя":"Урок 13","html":"Отдельной отрицательной формы нет — берём ту же команду и добавляем <b class=\"hl\">nicht</b> (в конец) или <b class=\"hl\">kein</b> (перед существительным). Ровно то же правило, что в уроке 4.","текст":"Отдельной отрицательной формы нет — берём ту же команду и добавляем nicht (в конец) или kein (перед существительным). Ровно то же правило, что в уроке 4."},{"id":"73e5eed04e","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"Еда — учи сразу с артиклем","урок":"urok14","урокИмя":"Урок 14","html":"Как в уроке 9 (части тела): артикль подсвечен цветом и полоской слева, чтобы род запоминался <b>глазами</b>, а не зубрёжкой. Существительное без артикля — выученное наполовину.","текст":"Как в уроке 9 (части тела): артикль подсвечен цветом и полоской слева, чтобы род запоминался глазами, а не зубрёжкой. Существительное без артикля — выученное наполовину."},{"id":"f6d7354288","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"Дом и квартира","урок":"urok15","урокИмя":"Урок 15","html":"Как всегда — <b>сразу с артиклем</b>, род подсвечен цветом и полоской слева. Обрати внимание на пару <i>der Stock</i> / <i>die Etage</i>: это одно и то же (этаж), просто первое немецкое, второе из французского. В объявлениях встретишь оба.","текст":"Как всегда — сразу с артиклем, род подсвечен цветом и полоской слева. Обрати внимание на пару der Stock / die Etage: это одно и то же (этаж), просто первое немецкое, второе из французского. В объявлениях встретишь оба."},{"id":"868db8df2b","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"Явления — с артиклями","урок":"urok16","урокИмя":"Урок 16","html":"Полезная закономерность: почти вся «мужская» погода — <b class=\"hl\">der</b> (Regen, Schnee, Wind, Nebel, Sturm). Из женского — <i>die Sonne</i>, <i>die Wolke</i>, и две важные для тебя: <b>die Hitze</b> (жара) и <b>die Kälte</b> (холод).","текст":"Полезная закономерность: почти вся «мужская» погода — der (Regen, Schnee, Wind, Nebel, Sturm). Из женского — die Sonne, die Wolke, и две важные для тебя: die Hitze (жара) и die Kälte (холод)."},{"id":"7f2b121eb6","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"Что происходит с артиклем","урок":"urok17","урокИмя":"Урок 17","html":"Akkusativ ты проходил в уроке 4 («у меня болит нога»). Напомню главное: <b class=\"hl\">меняется только мужской род</b> — <i>der → den</i>. Женский, средний и множественное остаются как в именительном.<br><br>\n      Сравни две строки — вот вся разница между «где» и «куда»:\n    </div>\n    <table class=\"casetab\">\n      <tr><th></th><th>муж. род</th><th>жен. род</th><th>ср. род</th><th>мн. ч.</th></tr>\n      <tr><td class=\"lbl\"><span class=\"wo\">Wo?</span> → Dativ</td><td>dem</td><td>der</td><td>dem</td><td>den</td></tr>\n      <tr><td class=\"lbl\"><span class=\"wohin\">Wohin?</span> → Akkusativ</td><td><b>den</b></td><td>die</td><td>das</td><td>die</td></tr>\n    </table>\n    <div class=\"warn-box\">\n      <span class=\"big\">Осторожно: den есть в обеих строках</span>\n      В Dativ <b>den</b> — это множественное число (<i>in den Zimmern</i>), а в Akkusativ <b>den</b> — мужской род (<i>in den Raum</i>). Одно слово, две разные работы. Смотри на существительное рядом.","текст":"Akkusativ ты проходил в уроке 4 («у меня болит нога»). Напомню главное: меняется только мужской род — der → den. Женский, средний и множественное остаются как в именительном. Сравни две строки — вот вся разница между «где» и «куда»: муж. роджен. родср. родмн. ч. Wo? → Dativdemderdemden Wohin? → Akkusativdendiedasdie Осторожно: den есть в обеих строках В Dativ den — это множественное число (in den Zimmern), а в Akkusativ den — мужской род (in den Raum). Одно слово, две разные работы. Смотри на существительное рядом."},{"id":"ead9ab2bd0","тема":"Артикли и род","знак":"🎨","вид":"ловушка","раздел":"Что происходит с артиклем","урок":"urok17","урокИмя":"Урок 17","html":"<span class=\"big\">Осторожно: den есть в обеих строках</span>\n      В Dativ <b>den</b> — это множественное число (<i>in den Zimmern</i>), а в Akkusativ <b>den</b> — мужской род (<i>in den Raum</i>). Одно слово, две разные работы. Смотри на существительное рядом.","текст":"Осторожно: den есть в обеих строках В Dativ den — это множественное число (in den Zimmern), а в Akkusativ den — мужской род (in den Raum). Одно слово, две разные работы. Смотри на существительное рядом."},{"id":"04fb684860","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"Отрицание: kein и nicht","урок":"urok4","урокИмя":"Урок 4","html":"<b><span class=\"hl\">kein</span></b> отрицает существительное (нет чего-то): <i>Ich habe <b>keine</b> Schmerzen</i> — у меня нет болей. Склоняется как ein: keinen / keine / kein.<br>\n      <b><span class=\"hl\">nicht</span></b> отрицает всё остальное — глагол, прилагательное: <i>Das ist <b>nicht</b> gut</i> · <i>Ich verstehe <b>nicht</b></i>.","текст":"kein отрицает существительное (нет чего-то): Ich habe keine Schmerzen — у меня нет болей. Склоняется как ein: keinen / keine / kein. nicht отрицает всё остальное — глагол, прилагательное: Das ist nicht gut · Ich verstehe nicht."},{"id":"bad1b4f8d0","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"Артикль = цвет","урок":"urok9","урокИмя":"Урок 9","html":"Каждое существительное учи <b>сразу с артиклем</b> — это его род. Здесь артикль подсвечен цветом и полоской слева у карточки, чтобы запоминалось глазами:","текст":"Каждое существительное учи сразу с артиклем — это его род. Здесь артикль подсвечен цветом и полоской слева у карточки, чтобы запоминалось глазами:"},{"id":"c79c0957b9","тема":"Падежи","знак":"📦","вид":"правило","раздел":"Главное правило: Wo? → Dativ","урок":"urok11","урокИмя":"Урок 11","html":"Запомни: муж. и ср. род в Dativ дают <b class=\"hl\">dem</b>, женский — <b class=\"hl\">der</b>, множественное — <b class=\"hl\">den</b>.","текст":"Запомни: муж. и ср. род в Dativ дают dem, женский — der, множественное — den."},{"id":"0f694d7503","тема":"Падежи","знак":"📦","вид":"ловушка","раздел":"Главное правило: Wo? → Dativ","урок":"urok11","урокИмя":"Урок 11","html":"После предлога места (когда отвечаем на <b>Wo?</b> — что-то просто находится где-то, без движения) артикль встаёт в падеж <b>Dativ</b>. Артикли меняются так:\n    </div>\n    <table class=\"dativ-table\">\n      <tr><td>der (муж.) →</td><td><span class=\"art\">der</span> Tisch → in <span class=\"datv\">dem</span> Tisch</td></tr>\n      <tr><td>das (ср.) →</td><td><span class=\"art\">das</span> Zimmer → in <span class=\"datv\">dem</span> Zimmer</td></tr>\n      <tr><td>die (жен.) →</td><td><span class=\"art\">die</span> Tasche → in <span class=\"datv\">der</span> Tasche</td></tr>\n      <tr><td>die (мн.) →</td><td><span class=\"art\">die</span> Betten → in <span class=\"datv\">den</span> Betten</td></tr>\n    </table>\n    <div class=\"grammar-box\" style=\"margin-top:14px\">Запомни: муж. и ср. род в Dativ дают <b class=\"hl\">dem</b>, женский — <b class=\"hl\">der</b>, множественное — <b class=\"hl\">den</b>.","текст":"После предлога места (когда отвечаем на Wo? — что-то просто находится где-то, без движения) артикль встаёт в падеж Dativ. Артикли меняются так: der (муж.) →der Tisch → in dem Tisch das (ср.) →das Zimmer → in dem Zimmer die (жен.) →die Tasche → in der Tasche die (мн.) →die Betten → in den Betten Запомни: муж. и ср. род в Dativ дают dem, женский — der, множественное — den."},{"id":"c80bd435f0","тема":"Падежи","знак":"📦","вид":"правило","раздел":"Стакан, чашка, бутылка","урок":"urok14","урокИмя":"Урок 14","html":"Важная мелочь: между «стаканом» и «водой» <b class=\"hl\">ничего не ставится</b> — ни предлога, ни падежа. Просто два слова подряд: <i>ein Glas Wasser</i> (стакан воды), <i>eine Tasse Kaffee</i> (чашка кофе). Проще, чем в русском.","текст":"Важная мелочь: между «стаканом» и «водой» ничего не ставится — ни предлога, ни падежа. Просто два слова подряд: ein Glas Wasser (стакан воды), eine Tasse Kaffee (чашка кофе). Проще, чем в русском."},{"id":"a588383d54","тема":"Падежи","знак":"📦","вид":"ловушка","раздел":"⚠️ «Люблю» и «нравится» — три разных способа","урок":"urok14","урокИмя":"Урок 14","html":"<span class=\"big\">Ловушка schmecken: вкусно НЕ «мне», а «мне» в дательном</span>\n      Немец не говорит «мне нравится» — он говорит <b>«оно мне вкусится»</b>: <i>Das schmeckt <b>mir</b> gut</i>. Подлежащее — сама еда, а ты стоишь в <b>Dativ</b> (тот самый падеж из урока 11). Вежливая форма — <i>Schmeckt es <b>Ihnen</b>?</i>","текст":"Ловушка schmecken: вкусно НЕ «мне», а «мне» в дательном Немец не говорит «мне нравится» — он говорит «оно мне вкусится»: Das schmeckt mir gut. Подлежащее — сама еда, а ты стоишь в Dativ (тот самый падеж из урока 11). Вежливая форма — Schmeckt es Ihnen?"},{"id":"5c1e30ee44","тема":"Падежи","знак":"📦","вид":"правило","раздел":"Где что стоит — Wo? + Dativ","урок":"urok15","урокИмя":"Урок 15","html":"Одна разница с русским: мы почти всё «кладём» словом «есть/находится», а немцы обязательно уточняют <b>позу предмета</b>:<br><br>\n      <b class=\"hl\">stehen</b> — стоит (вертикальное: шкаф, стул, кровать, бутылка)<br>\n      <b class=\"hl\">liegen</b> — лежит (горизонтальное: ковёр, книга, полотенце)<br>\n      <b class=\"hl\">hängen</b> — висит (лампа, картина, зеркало)<br><br>\n      Сказать «кровать лежит в спальне» — ошибка. Кровать <i>стоит</i>.","текст":"Одна разница с русским: мы почти всё «кладём» словом «есть/находится», а немцы обязательно уточняют позу предмета: stehen — стоит (вертикальное: шкаф, стул, кровать, бутылка) liegen — лежит (горизонтальное: ковёр, книга, полотенце) hängen — висит (лампа, картина, зеркало) Сказать «кровать лежит в спальне» — ошибка. Кровать стоит."},{"id":"c15c5e272d","тема":"Падежи","знак":"📦","вид":"ловушка","раздел":"⚠️ Главное: правило, которое решает всё","урок":"urok17","урокИмя":"Урок 17","html":"<span class=\"big\">Спроси себя: есть движение из точки в точку?</span>\n      <b class=\"hl\">НЕТ движения</b> — предмет просто где-то находится → вопрос <b>Wo?</b> → <b>Dativ</b><br>\n      <b class=\"hl\">ЕСТЬ движение</b> — предмет меняет место → вопрос <b>Wohin?</b> → <b>Akkusativ</b><br><br>\n      Один и тот же предлог, одно и то же слово — но падеж разный:<br>\n      <i>Ich bin <b>in der</b> Klinik</i> (я В клинике — стою там) &nbsp;vs&nbsp; <i>Ich gehe <b>in die</b> Klinik</i> (я иду В клинику — вхожу).<br><br>\n      По-русски эту разницу мы тоже делаем («в клинике» / «в клинику»), просто не задумываясь. По-немецки нужно задумываться — секунду, пока не станет автоматом.","текст":"Спроси себя: есть движение из точки в точку? НЕТ движения — предмет просто где-то находится → вопрос Wo? → Dativ ЕСТЬ движение — предмет меняет место → вопрос Wohin? → Akkusativ Один и тот же предлог, одно и то же слово — но падеж разный: Ich bin in der Klinik (я В клинике — стою там) &nbsp;vs&nbsp; Ich gehe in die Klinik (я иду В клинику — вхожу). По-русски эту разницу мы тоже делаем («в клинике» / «в клинику»), просто не задумываясь. По-немецки нужно задумываться — секунду, пока не станет автоматом."},{"id":"7f7b8c9dc8","тема":"Падежи","знак":"📦","вид":"правило","раздел":"Слияния для Akkusativ","урок":"urok17","урокИмя":"Урок 17","html":"В уроке 11 были слияния для Dativ: <i>in dem → <b>im</b></i>, <i>an dem → <b>am</b></i>. У Akkusativ свои, со средним родом (<i>das</i>):<br><br>\n      <b class=\"hl\">in das → ins</b> &nbsp;·&nbsp; <b class=\"hl\">an das → ans</b> &nbsp;·&nbsp; <b class=\"hl\">auf das → aufs</b><br><br>\n      Мнемоника простая: <b>im</b> = где (стою), <b>ins</b> = куда (иду). Лишняя буква «s» — как шаг вперёд.","текст":"В уроке 11 были слияния для Dativ: in dem → im, an dem → am. У Akkusativ свои, со средним родом (das): in das → ins &nbsp;·&nbsp; an das → ans &nbsp;·&nbsp; auf das → aufs Мнемоника простая: im = где (стою), ins = куда (иду). Лишняя буква «s» — как шаг вперёд."},{"id":"97e72b2b3a","тема":"Падежи","знак":"📦","вид":"ловушка","раздел":"⚠️ Глаголы-близнецы: stehen/stellen, liegen/legen, sitzen/setzen","урок":"urok17","урокИмя":"Урок 17","html":"<span class=\"big\">Немецкий разводит «стоять» и «ставить» на два разных глагола</span>\n      В уроке 15 ты выучил <i>stehen</i>, <i>liegen</i>, <i>hängen</i> — они отвечают на <b>Wo?</b> и требуют <b>Dativ</b>. У каждого есть брат-близнец для <b>Wohin?</b> с <b>Akkusativ</b>:<br><br>\n      <b>stehen</b> (стоять) → <b class=\"hl\">stellen</b> (ставить)<br>\n      <b>liegen</b> (лежать) → <b class=\"hl\">legen</b> (класть)<br>\n      <b>sitzen</b> (сидеть) → <b class=\"hl\">setzen</b> (сажать, садиться)<br><br>\n      Логика железная: <b>первый глагол = состояние</b> (никто ничего не делает, предмет просто есть) → Dativ. <b>Второй = действие</b> (кто-то что-то перемещает) → Akkusativ. Если в предложении есть тот, кто действует, — бери второй глагол.","текст":"Немецкий разводит «стоять» и «ставить» на два разных глагола В уроке 15 ты выучил stehen, liegen, hängen — они отвечают на Wo? и требуют Dativ. У каждого есть брат-близнец для Wohin? с Akkusativ: stehen (стоять) → stellen (ставить) liegen (лежать) → legen (класть) sitzen (сидеть) → setzen (сажать, садиться) Логика железная: первый глагол = состояние (никто ничего не делает, предмет просто есть) → Dativ. Второй = действие (кто-то что-то перемещает) → Akkusativ. Если в предложении есть тот, кто действует, — бери второй глагол."},{"id":"2384c8cdbe","тема":"Падежи","знак":"📦","вид":"ловушка","раздел":"⚠️ Предлоги-однолюбы: всегда Dativ, без вариантов","урок":"urok17","урокИмя":"Урок 17","html":"<span class=\"big\">Не все предлоги умеют переключаться</span>\n      Шесть частых предлогов сидят на <b>Dativ</b> всегда, даже когда движение очевидно: <b>nach, zu, aus, bei, mit, seit</b>.<br><br>\n      Поэтому <i>Gehen Sie <b>zum</b> Ultraschall</i> — Dativ, хотя это явное движение. Не пытайся применять сюда правило из раздела 1: эти предлоги ему не подчиняются, их просто запоминают списком.","текст":"Не все предлоги умеют переключаться Шесть частых предлогов сидят на Dativ всегда, даже когда движение очевидно: nach, zu, aus, bei, mit, seit. Поэтому Gehen Sie zum Ultraschall — Dativ, хотя это явное движение. Не пытайся применять сюда правило из раздела 1: эти предлоги ему не подчиняются, их просто запоминают списком."},{"id":"3602af959e","тема":"Падежи","знак":"📦","вид":"ловушка","раздел":"⚠️ Предлоги-однолюбы: всегда Dativ, без вариантов","урок":"urok17","урокИмя":"Урок 17","html":"<span class=\"big\">Классика, на которой спотыкаются все: nach Hause / zu Hause</span>\n      <b>nach Hause</b> — домой (движение). <b>zu Hause</b> — дома (нахождение). Оба с Dativ, разводятся только предлогом. Выучи как две готовые фразы, не разбирая.","текст":"Классика, на которой спотыкаются все: nach Hause / zu Hause nach Hause — домой (движение). zu Hause — дома (нахождение). Оба с Dativ, разводятся только предлогом. Выучи как две готовые фразы, не разбирая."},{"id":"21ff533bf9","тема":"Падежи","знак":"📦","вид":"ловушка","раздел":"⚠️ Ловушка вторая: mich или mir","урок":"urok18","урокИмя":"Урок 18","html":"<span class=\"big\">Появилось второе дополнение — местоимение уходит в Dativ</span>\n      Смотри на пару. Если после глагола <b>больше ничего нет</b> — обычная форма (Akkusativ):<br>\n      <i>Ich wasche <b>mich</b>.</i> — Я моюсь.<br><br>\n      Но если в предложении есть <b>то, что моют</b> — местоимение отходит в сторону и встаёт в <b class=\"hl\">Dativ</b>:<br>\n      <i>Ich wasche <b>mir</b> die Hände.</i> — Я мою себе руки.<br><br>\n      Логика: «руки» заняли место прямого дополнения, «себе» досталась роль адресата. Меняются <b>только два</b> местоимения: <b>mich → mir</b>, <b>dich → dir</b>. Все остальные (<i>sich, uns, euch</i>) выглядят одинаково — их и думать не надо.","текст":"Появилось второе дополнение — местоимение уходит в Dativ Смотри на пару. Если после глагола больше ничего нет — обычная форма (Akkusativ): Ich wasche mich. — Я моюсь. Но если в предложении есть то, что моют — местоимение отходит в сторону и встаёт в Dativ: Ich wasche mir die Hände. — Я мою себе руки. Логика: «руки» заняли место прямого дополнения, «себе» досталась роль адресата. Меняются только два местоимения: mich → mir, dich → dir. Все остальные (sich, uns, euch) выглядят одинаково — их и думать не надо."},{"id":"882516d906","тема":"Падежи","знак":"📦","вид":"правило","раздел":"Винительный падеж (Akkusativ) — проще, чем кажется","урок":"urok4","урокИмя":"Урок 4","html":"После haben существительное стоит в винительном падеже. Хорошая новость: <b>меняется только мужской род</b> (der → <span class=\"hl\">den</span>, ein → <span class=\"hl\">einen</span>). Женский, средний и множественное — <b>не меняются вообще</b>.\n    </div>\n    <table class=\"akk-table\">\n      <tr><th>Род</th><th>Именительный (кто/что)</th><th>Винительный (после haben)</th></tr>\n      <tr><td>муж. (der)</td><td>der Termin</td><td><b>einen</b> Termin ← меняется!</td></tr>\n      <tr><td>жен. (die)</td><td>die Frage</td><td><b>eine</b> Frage</td></tr>\n      <tr><td>сред. (das)</td><td>das Rezept</td><td><b>ein</b> Rezept</td></tr>\n    </table>\n    <div class=\"card-list\" id=\"akk\">","текст":"После haben существительное стоит в винительном падеже. Хорошая новость: меняется только мужской род (der → den, ein → einen). Женский, средний и множественное — не меняются вообще. РодИменительный (кто/что)Винительный (после haben) муж. (der)der Termineinen Termin ← меняется! жен. (die)die Frageeine Frage сред. (das)das Rezeptein Rezept"},{"id":"3c6dada7d6","тема":"Местоимения","знак":"🧩","вид":"ловушка","раздел":"Личные местоимения (Personalpronomen)","урок":"dasha1","урокИмя":"Занятие 1 с Дашей","html":"<span class=\"big\">Три «sie» — главная путаница</span>\n      <b>sie</b> (маленькая) = она · <b>sie</b> (маленькая) = они · <b>Sie</b> (ЗАГЛАВНАЯ) = Вы вежливое.<br>\n      Различаем <b>по смыслу и по форме глагола</b>. Логика Даши: у русских одно «вы» на всё, у немцев наоборот — отдельное <i>ihr</i> для своих, зато «она» и «они» совпали.","текст":"Три «sie» — главная путаница sie (маленькая) = она · sie (маленькая) = они · Sie (ЗАГЛАВНАЯ) = Вы вежливое. Различаем по смыслу и по форме глагола. Логика Даши: у русских одно «вы» на всё, у немцев наоборот — отдельное ihr для своих, зато «она» и «они» совпали."},{"id":"6915cf482d","тема":"Местоимения","знак":"🧩","вид":"правило","раздел":"Притяжательные местоимения + правило -e","урок":"dasha1","урокИмя":"Занятие 1 с Дашей","html":"<b>Приём Даши (обратная логика):</b> если местоимение <b>без</b> окончания — существительное точно <b>не женского рода</b>, значит мужской или средний.","текст":"Приём Даши (обратная логика): если местоимение без окончания — существительное точно не женского рода, значит мужской или средний."},{"id":"956f0a270b","тема":"Местоимения","знак":"🧩","вид":"ловушка","раздел":"Притяжательные местоимения + правило -e","урок":"dasha1","урокИмя":"Занятие 1 с Дашей","html":"<span class=\"big\">⚠️ Главное правило урока</span>\n      Притяжательное местоимение добавляет <b>-e</b>, если существительное <b>женского рода</b> или <b>множественного числа</b>. Мужской и средний — без окончания.","текст":"⚠️ Главное правило урока Притяжательное местоимение добавляет -e, если существительное женского рода или множественного числа. Мужской и средний — без окончания."},{"id":"3efba24d8f","тема":"Местоимения","знак":"🧩","вид":"ловушка","раздел":"Повторение: личные местоимения","урок":"dasha2","урокИмя":"Занятие 2 с Дашей","html":"<span class=\"big\">Три «sie» — как различать</span>\n      <b>sie</b> (маленькая) = она · <b>sie</b> (маленькая) = они · <b>Sie</b> (ЗАГЛАВНАЯ) = Вы вежливое.<br>\n      А <b>ihr</b> = «вы» к своим (к группе друзей). Различаем по смыслу и по форме глагола.","текст":"Три «sie» — как различать sie (маленькая) = она · sie (маленькая) = они · Sie (ЗАГЛАВНАЯ) = Вы вежливое. А ihr = «вы» к своим (к группе друзей). Различаем по смыслу и по форме глагола."},{"id":"f4ce3ced34","тема":"Местоимения","знак":"🧩","вид":"правило","раздел":"Повторение: притяжательные местоимения","урок":"dasha2","урокИмя":"Занятие 2 с Дашей","html":"<b>Правило из прошлого урока:</b> добавляем <b class=\"hl\">-e</b>, если существительное <b>женского рода</b> или <b>множественного числа</b>. Мужской и средний — без окончания.","текст":"Правило из прошлого урока: добавляем -e, если существительное женского рода или множественного числа. Мужской и средний — без окончания."},{"id":"5cb0dbced1","тема":"Местоимения","знак":"🧩","вид":"ловушка","раздел":"⭐ Глаголы, меняющие гласную","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"<span class=\"big\">Меняется только у двоих!</span>\n      Буква прыгает <b>только</b> в формах <b>du</b> и <b>er / sie / es</b>.<br>\n      У <b>ich</b>, <b>wir</b>, <b>ihr</b>, <b>sie/Sie</b> — никаких изменений, всё как у обычных глаголов.","текст":"Меняется только у двоих! Буква прыгает только в формах du и er / sie / es. У ich, wir, ihr, sie/Sie — никаких изменений, всё как у обычных глаголов."},{"id":"7a6c040c85","тема":"Местоимения","знак":"🧩","вид":"правило","раздел":"⚠️ Как отличить sie / sie / Sie","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"<b>Проблема.</b> Одно и то же слово <b>sie</b> значит три разных вещи: «она», «они» и вежливое «Вы».\n      На занятии Григорий на этом спотыкался несколько раз — и Даша дала способ, как разобраться.","текст":"Проблема. Одно и то же слово sie значит три разных вещи: «она», «они» и вежливое «Вы». На занятии Григорий на этом спотыкался несколько раз — и Даша дала способ, как разобраться."},{"id":"fb285f57c8","тема":"Местоимения","знак":"🧩","вид":"правило","раздел":"⚠️ Как отличить sie / sie / Sie","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"Ещё подсказки: вежливое <b>Sie</b> всегда пишется с <b>большой буквы</b> в середине предложения.\n      А в вопросе оно стоит <b>после</b> глагола: <i>Trinken Sie gern Kaffee?</i>","текст":"Ещё подсказки: вежливое Sie всегда пишется с большой буквы в середине предложения. А в вопросе оно стоит после глагола: Trinken Sie gern Kaffee?"},{"id":"25ebb5b0a3","тема":"Местоимения","знак":"🧩","вид":"ловушка","раздел":"⚠️ Как отличить sie / sie / Sie","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"<span class=\"big\">Смотрим на форму глагола</span>\n      Если рядом стоит глагол в форме <b>инфинитива</b> (кончается на -en, как в словаре) —\n      значит это <b>они</b> или вежливое <b>Вы</b>.<br>\n      Если у глагола окончание <b>-t</b> — значит это <b>она</b>.","текст":"Смотрим на форму глагола Если рядом стоит глагол в форме инфинитива (кончается на -en, как в словаре) — значит это они или вежливое Вы. Если у глагола окончание -t — значит это она."},{"id":"2dde56cadb","тема":"Местоимения","знак":"🧩","вид":"правило","раздел":"Что это вообще такое","урок":"urok18","урокИмя":"Урок 18","html":"В русском есть хвостик <b class=\"hl\">-ся</b>: мыть → мыть<b>ся</b>, сажать → садить<b>ся</b>. Он означает «сам себя». Немцы делают то же самое, только <b>отдельным словом</b>:<br><br>\n      <i>waschen</i> (мыть кого-то) → <i>sich waschen</i> (мыть <b>себя</b>, то есть мыться).<br><br>\n      Слово <b class=\"hl\">sich</b> — это и есть «себя». В словаре глагол так и записан: <i>sich waschen</i>. Значит, местоимение обязательно, без него предложение сломано.","текст":"В русском есть хвостик -ся: мыть → мыться, сажать → садиться. Он означает «сам себя». Немцы делают то же самое, только отдельным словом: waschen (мыть кого-то) → sich waschen (мыть себя, то есть мыться). Слово sich — это и есть «себя». В словаре глагол так и записан: sich waschen. Значит, местоимение обязательно, без него предложение сломано."},{"id":"ff86966565","тема":"Местоимения","знак":"🧩","вид":"правило","раздел":"Шесть местоимений — и только два новых","урок":"urok18","урокИмя":"Урок 18","html":"Хорошая новость: почти все формы ты уже знаешь из Akkusativ (урок 4). Реально новых слов <b class=\"hl\">два</b>: <i>euch</i> и <i>sich</i>.<br><br>\n      И отдельно запомни: у вежливого <b>Sie</b> местоимение — <b class=\"hl\">sich с маленькой буквы</b>, не «Sich». <i>Setzen Sie sich.</i>\n    </div>\n    <table class=\"casetab\">\n      <tr><th>лицо</th><th>местоимение</th><th>пример</th></tr>\n      <tr><td class=\"lbl\">ich</td><td><b>mich</b></td><td>ich wasche mich</td></tr>\n      <tr><td class=\"lbl\">du</td><td><b>dich</b></td><td>du wäschst dich</td></tr>\n      <tr><td class=\"lbl\">er / sie / es</td><td><span class=\"wohin\">sich</span></td><td>er wäscht sich</td></tr>\n      <tr><td class=\"lbl\">wir</td><td><b>uns</b></td><td>wir waschen uns</td></tr>\n      <tr><td class=\"lbl\">ihr</td><td><span class=\"wohin\">euch</span></td><td>ihr wascht euch</td></tr>\n      <tr><td class=\"lbl\">sie / Sie</td><td><span class=\"wohin\">sich</span></td><td>Sie waschen sich</td></tr>\n    </table>\n    <div class=\"grid2\" id=\"conj\">","текст":"Хорошая новость: почти все формы ты уже знаешь из Akkusativ (урок 4). Реально новых слов два: euch и sich. И отдельно запомни: у вежливого Sie местоимение — sich с маленькой буквы, не «Sich». Setzen Sie sich. лицоместоимениепример ichmichich wasche mich dudichdu wäschst dich er / sie / essicher wäscht sich wirunswir waschen uns ihreuchihr wascht euch sie / SiesichSie waschen sich"},{"id":"bfa214be74","тема":"Местоимения","знак":"🧩","вид":"правило","раздел":"Куда ставить местоимение","урок":"urok18","урокИмя":"Урок 18","html":"Правило простое: <b class=\"hl\">сразу после спрягаемого глагола</b>.<br><br>\n      <i>Ich <b>wasche mich</b> jeden Morgen.</i> · <i><b>Waschen Sie sich</b> die Hände.</i><br><br>\n      В вопросе глагол уходит вперёд, местоимение идёт за ним следом: <i><b>Fühlen Sie sich</b> gut?</i> Держатся парой, между ними ничего не вставляют.","текст":"Правило простое: сразу после спрягаемого глагола. Ich wasche mich jeden Morgen. · Waschen Sie sich die Hände. В вопросе глагол уходит вперёд, местоимение идёт за ним следом: Fühlen Sie sich gut? Держатся парой, между ними ничего не вставляют."},{"id":"fd9dcef0cb","тема":"Местоимения","знак":"🧩","вид":"ловушка","раздел":"⚠️ Ловушка первая: русское «-ся» здесь не подсказчик","урок":"urok18","урокИмя":"Урок 18","html":"<span class=\"big\">Совпадает примерно в половине случаев — на это нельзя опираться</span>\n      Соблазн простой: раз по-русски с «-ся», значит и в немецком с <i>sich</i>. Это работает не всегда, причём в обе стороны:<br><br>\n      ✅ <i>freuen <b>sich</b></i> — радовать<b>ся</b>. Совпало.<br>\n      ❌ <i><b>sich</b> erholen</i> — отдыхать. По-русски <b>без</b> «-ся», а в немецком <i>sich</i> обязателен.<br>\n      ❌ <i>lernen</i> — учить<b>ся</b>. По-русски с «-ся», а в немецком <i>sich</i> <b>нет</b>.<br>\n      ❌ <i>beginnen</i> — начинать<b>ся</b>. Тоже без <i>sich</i>.<br><br>\n      Вывод: возвратность — это <b>свойство конкретного немецкого глагола</b>, его учат вместе со словом. Увидел в словаре <i>sich</i> — запоминай сразу с ним.","текст":"Совпадает примерно в половине случаев — на это нельзя опираться Соблазн простой: раз по-русски с «-ся», значит и в немецком с sich. Это работает не всегда, причём в обе стороны: ✅ freuen sich — радоваться. Совпало. ❌ sich erholen — отдыхать. По-русски без «-ся», а в немецком sich обязателен. ❌ lernen — учиться. По-русски с «-ся», а в немецком sich нет. ❌ beginnen — начинаться. Тоже без sich. Вывод: возвратность — это свойство конкретного немецкого глагола, его учат вместе со словом. Увидел в словаре sich — запоминай сразу с ним."},{"id":"b333a09928","тема":"Местоимения","знак":"🧩","вид":"правило","раздел":"Врачебный блок — здесь тема окупается сразу","урок":"urok18","урокИмя":"Урок 18","html":"Первая фраза списка — <b class=\"hl\">Wie fühlen Sie sich?</b> — это вопрос, которым начинается почти любой приём и почти любая станция на Fachsprachprüfung. Выучи её до автоматизма.<br><br>\n      Дальше идёт весь осмотр: разденьтесь, сядьте, лягте, расслабьтесь, не двигайтесь — все эти команды возвратные.","текст":"Первая фраза списка — Wie fühlen Sie sich? — это вопрос, которым начинается почти любой приём и почти любая станция на Fachsprachprüfung. Выучи её до автоматизма. Дальше идёт весь осмотр: разденьтесь, сядьте, лягте, расслабьтесь, не двигайтесь — все эти команды возвратные."},{"id":"82f4dc8719","тема":"Предлоги","знак":"🧭","вид":"правило","раздел":"Дни недели — предлог am","урок":"dasha1","урокИмя":"Занятие 1 с Дашей","html":"Все дни — <b class=\"hl\">мужского рода</b>, потому что заканчиваются на <b>-tag</b> (der Tag). Правило: если слово оканчивается на другое слово, род берётся по нему.<br><br>\n      <b>Смысл названий:</b> <i>Mittwoch</i> = Mitte + Woche («середина недели», единственный без -tag) · <i>Freitag</i> от <i>frei</i> («свободный день») · <i>Sonntag</i> от <i>Sonne</i> («солнечный день»).","текст":"Все дни — мужского рода, потому что заканчиваются на -tag (der Tag). Правило: если слово оканчивается на другое слово, род берётся по нему. Смысл названий: Mittwoch = Mitte + Woche («середина недели», единственный без -tag) · Freitag от frei («свободный день») · Sonntag от Sonne («солнечный день»)."},{"id":"df570fd3db","тема":"Предлоги","знак":"🧭","вид":"ловушка","раздел":"Дни недели — предлог am","урок":"dasha1","урокИмя":"Занятие 1 с Дашей","html":"<span class=\"big\">Не путай предлоги!</span>\n      Месяцы и времена года → <b>im</b> (im Winter, im Juli). Дни недели → <b>am</b> (am Montag, am Freitag).","текст":"Не путай предлоги! Месяцы и времена года → im (im Winter, im Juli). Дни недели → am (am Montag, am Freitag)."},{"id":"d5fa916966","тема":"Предлоги","знак":"🧭","вид":"правило","раздел":"Тренировка: kommen, wohnen, trinken","урок":"dasha3","урокИмя":"Занятие 3 с Дашей","html":"<b class=\"hl\">kommen aus …</b> — «быть родом из». Предлог <b>aus</b> = «из». Так ты говоришь, откуда ты.","текст":"kommen aus … — «быть родом из». Предлог aus = «из». Так ты говоришь, откуда ты."},{"id":"1bffc137bc","тема":"Предлоги","знак":"🧭","вид":"правило","раздел":"⚠️ Глаголы без предлога","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"В русском мы говорим «играть <b>в</b> футбол», «играть <b>на</b> гитаре», «говорить <b>по</b>-немецки».\n      В немецком у этих двух глаголов <b>предлога нет вообще</b> — слово ставится сразу.","текст":"В русском мы говорим «играть в футбол», «играть на гитаре», «говорить по-немецки». В немецком у этих двух глаголов предлога нет вообще — слово ставится сразу."},{"id":"01b3019df7","тема":"Предлоги","знак":"🧭","вид":"ловушка","раздел":"⚠️ Глаголы без предлога","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"<span class=\"big\">Запомнить два глагола</span>\n      <b>spielen</b> (играть) и <b>sprechen</b> (говорить) — всегда без предлога.\n      Русская привычка вставить «в» или «на» здесь только мешает.","текст":"Запомнить два глагола spielen (играть) и sprechen (говорить) — всегда без предлога. Русская привычка вставить «в» или «на» здесь только мешает."},{"id":"5068577f53","тема":"Предлоги","знак":"🧭","вид":"ловушка","раздел":"⚠️ spielen и sprechen — без предлога!","урок":"polya5","урокИмя":"Занятие 5 Полины","html":"<span class=\"big\">Здесь немецкий расходится с русским</span>\n      По-русски мы играем <b>в</b> теннис и <b>на</b> гитаре, говорим <b>на</b> немецком. В немецком <b>предлога нет вообще</b>: <i>Tennis spielen</i>, <i>Gitarre spielen</i>, <i>Deutsch sprechen</i>.<br>\n      Это правило работает со спортом, играми и музыкальными инструментами.","текст":"Здесь немецкий расходится с русским По-русски мы играем в теннис и на гитаре, говорим на немецком. В немецком предлога нет вообще: Tennis spielen, Gitarre spielen, Deutsch sprechen. Это правило работает со спортом, играми и музыкальными инструментами."},{"id":"c279860026","тема":"Предлоги","знак":"🧭","вид":"ловушка","раздел":"⚠️ vor и nach — как немцы считают время","урок":"polya7","урокИмя":"Занятие 7 Полины","html":"<span class=\"big\">vor = «до», поэтому «vor zwei Tagen» это два дня НАЗАД</span>\n      Предлог <b>vor</b> буквально означает «перед, до». Отсюда логика, которая сначала сбивает:<br><br>\n      <b>vor zwei Tagen</b> — два дня <b>назад</b> (буквально «до двух дней»)<br>\n      <b>nach zwei Tagen</b> — <b>через</b> два дня, после<br><br>\n      Полина как раз споткнулась на «почему назад?» — Даша объяснила: «ну типа, два дня до этого».","текст":"vor = «до», поэтому «vor zwei Tagen» это два дня НАЗАД Предлог vor буквально означает «перед, до». Отсюда логика, которая сначала сбивает: vor zwei Tagen — два дня назад (буквально «до двух дней») nach zwei Tagen — через два дня, после Полина как раз споткнулась на «почему назад?» — Даша объяснила: «ну типа, два дня до этого»."},{"id":"fd4d095ffb","тема":"Предлоги","знак":"🧭","вид":"правило","раздел":"«Во сколько?» — um + время","урок":"urok10","урокИмя":"Урок 10","html":"Момент времени = предлог <b class=\"hl\">um</b>: <i>um acht Uhr</i> (в 8), <i>um halb drei</i> (в 14:30). Вопрос: <b>Um wie viel Uhr?</b> (во сколько?)","текст":"Момент времени = предлог um: um acht Uhr (в 8), um halb drei (в 14:30). Вопрос: Um wie viel Uhr? (во сколько?)"},{"id":"45a265c7c7","тема":"Предлоги","знак":"🧭","вид":"правило","раздел":"9 предлогов места","урок":"urok11","урокИмя":"Урок 11","html":"Отвечают на вопрос <b class=\"hl\">Wo?</b> (где?). Представь предмет и коробку: предлог говорит, где предмет относительно неё.","текст":"Отвечают на вопрос Wo? (где?). Представь предмет и коробку: предлог говорит, где предмет относительно неё."},{"id":"0f7dc1a0b4","тема":"Предлоги","знак":"🧭","вид":"правило","раздел":"Три приёма пищи","урок":"urok14","урокИмя":"Урок 14","html":"Все три — <b class=\"hl\">das</b>, запоминай пачкой. Приятная логика: <i>Mittag</i> = полдень, <i>Abend</i> = вечер, а <i>Essen</i> = еда. То есть «полдень-еда» и «вечер-еда».<br><br>\n      Предлог для «на завтрак / на обед» — <b class=\"hl\">zum</b>: <i>zum Frühstück</i>, <i>zum Mittagessen</i>. Это тот самый <i>zu + dem</i> из урока 11.","текст":"Все три — das, запоминай пачкой. Приятная логика: Mittag = полдень, Abend = вечер, а Essen = еда. То есть «полдень-еда» и «вечер-еда». Предлог для «на завтрак / на обед» — zum: zum Frühstück, zum Mittagessen. Это тот самый zu + dem из урока 11."},{"id":"1a747b3de6","тема":"Предлоги","знак":"🧭","вид":"правило","раздел":"Девять предлогов двойного действия","урок":"urok17","урокИмя":"Урок 17","html":"Их называют <b class=\"hl\">Wechselpräpositionen</b> — «предлоги-переключатели». Только эти девять умеют менять падеж. Все остальные предлоги закреплены за одним падежом навсегда (раздел 8).<br><br>\n      Хорошая новость: список ты уже знаешь наизусть из урока 11.","текст":"Их называют Wechselpräpositionen — «предлоги-переключатели». Только эти девять умеют менять падеж. Все остальные предлоги закреплены за одним падежом навсегда (раздел 8). Хорошая новость: список ты уже знаешь наизусть из урока 11."},{"id":"fb25d1e5ed","тема":"Предлоги","знак":"🧭","вид":"правило","раздел":"Вопросы","урок":"urok3","урокИмя":"Урок 3","html":"<b>Вопрос со словом</b> (Wo? Was? Woher?) — глагол на 2-м месте: <i>Wo <b>wohnen</b> Sie?</i><br>\n      <b>Вопрос да/нет</b> — глагол выходит на <span class=\"pos2\">1-е место</span>: <i><b>Wohnen</b> Sie in Berlin?</i> → Ja / Nein.","текст":"Вопрос со словом (Wo? Was? Woher?) — глагол на 2-м месте: Wo wohnen Sie? Вопрос да/нет — глагол выходит на 1-е место: Wohnen Sie in Berlin? → Ja / Nein."},{"id":"eed9997815","тема":"Предлоги","знак":"🧭","вид":"правило","раздел":"Предлог im + вопрос Wann? (когда)","урок":"urok6","урокИмя":"Урок 6","html":"«В таком-то месяце/сезоне» = <b class=\"hl\">im</b> + слово: <i>im Mai</i>, <i>im Sommer</i>. Вопрос «когда?» — <b class=\"hl\">Wann?</b>","текст":"«В таком-то месяце/сезоне» = im + слово: im Mai, im Sommer. Вопрос «когда?» — Wann?"},{"id":"e22bcd7171","тема":"Порядок слов","знак":"📐","вид":"правило","раздел":"⭐ Главное: глагол на второй ПОЗИЦИИ, а не на втором слове","урок":"polya6","урокИмя":"Занятие 6 Полины","html":"<b class=\"hl\">wie viel</b> или <b class=\"hl\">wie viele</b>? С исчисляемыми — <b>wie viele</b> (детей можно посчитать). Полина догадалась сама.","текст":"wie viel или wie viele? С исчисляемыми — wie viele (детей можно посчитать). Полина догадалась сама."},{"id":"9a815be85a","тема":"Порядок слов","знак":"📐","вид":"ловушка","раздел":"⭐ Главное: глагол на второй ПОЗИЦИИ, а не на втором слове","урок":"polya6","урокИмя":"Занятие 6 Полины","html":"<span class=\"big\">Полина решила, что правило не работает — и это правильный вопрос</span>\n      В <i>Wie viele Kinder habt ihr?</i> глагол стоит третьим словом. Значит, правило сломалось? Нет.<br><br>\n      <b>Второе место — это не второе слово, а вторая позиция.</b> А <i>wie viele Kinder</i> — это <b>одна неразрывная позиция целиком</b>. Её нельзя разделить: нельзя сказать <i>Wie Kinder habt ihr viele</i>.\n    </div>\n    <table class=\"postab\">\n      <tr><th>Позиция 1</th><th>Позиция 2</th><th>дальше</th></tr>\n      <tr><td>Wie viele Kinder</td><td><b>habt</b></td><td>ihr?</td></tr>\n    </table>\n    <div class=\"grammar-box\" style=\"margin-top:14px\">\n      <b class=\"hl\">wie viel</b> или <b class=\"hl\">wie viele</b>? С исчисляемыми — <b>wie viele</b> (детей можно посчитать). Полина догадалась сама.","текст":"Полина решила, что правило не работает — и это правильный вопрос В Wie viele Kinder habt ihr? глагол стоит третьим словом. Значит, правило сломалось? Нет. Второе место — это не второе слово, а вторая позиция. А wie viele Kinder — это одна неразрывная позиция целиком. Её нельзя разделить: нельзя сказать Wie Kinder habt ihr viele. Позиция 1Позиция 2дальше Wie viele Kinderhabtihr? wie viel или wie viele? С исчисляемыми — wie viele (детей можно посчитать). Полина догадалась сама."},{"id":"ec5f6ccf00","тема":"Порядок слов","знак":"📐","вид":"правило","раздел":"bitte, mal, doch — чтобы не звучать как приказ по казарме","урок":"urok13","урокИмя":"Урок 13","html":"Голый императив в немецком звучит <b>жёстко</b>. Врачу нужно мягко — для этого три словечка:<br><br>\n      <b class=\"hl\">bitte</b> — «пожалуйста». Ставится сразу после Sie или в конец. <b>Добавляй всегда.</b><br>\n      <b class=\"hl\">mal</b> — «-ка»: «покажите-ка». Делает просьбу лёгкой, необязательной.<br>\n      <b class=\"hl\">doch</b> — «да вы садитесь же», дружеское подбадривание.<br><br>\n      Послушай, как одна и та же фраза теплеет:","текст":"Голый императив в немецком звучит жёстко. Врачу нужно мягко — для этого три словечка: bitte — «пожалуйста». Ставится сразу после Sie или в конец. Добавляй всегда. mal — «-ка»: «покажите-ка». Делает просьбу лёгкой, необязательной. doch — «да вы садитесь же», дружеское подбадривание. Послушай, как одна и та же фраза теплеет:"},{"id":"02ecb5c7fb","тема":"Порядок слов","знак":"📐","вид":"правило","раздел":"Порядок слов: глагол всегда на 2-м месте","урок":"urok3","урокИмя":"Урок 3","html":"Железное правило немецкого: в обычном предложении <b>спрягаемый глагол стоит на <span class=\"pos2\">2-й позиции</span></b> — даже если предложение начинается не с подлежащего. Сравни: <i>Ich wohne in Moskau</i> и <i>In Moskau wohne ich</i> — глагол <b>wohne</b> в обоих на 2-м месте.","текст":"Железное правило немецкого: в обычном предложении спрягаемый глагол стоит на 2-й позиции — даже если предложение начинается не с подлежащего. Сравни: Ich wohne in Moskau и In Moskau wohne ich — глагол wohne в обоих на 2-м месте."},{"id":"44b1b3ac6f","тема":"Порядок слов","знак":"📐","вид":"правило","раздел":"W-Fragen — вопросительные слова","урок":"urok8","урокИмя":"Урок 8","html":"Это <b>не глаголы</b>, а вопросительные слова — почти все начинаются на <b class=\"hl\">W</b>, отсюда название <i>W-Fragen</i>. Порядок железный: <b>W-слово → глагол → кто</b>. <i>Wo</i> <b>wohnen</b> Sie? — глагол всегда вторым (правило из Урока 3 работает и здесь).","текст":"Это не глаголы, а вопросительные слова — почти все начинаются на W, отсюда название W-Fragen. Порядок железный: W-слово → глагол → кто. Wo wohnen Sie? — глагол всегда вторым (правило из Урока 3 работает и здесь)."},{"id":"34826060e2","тема":"Общение и обращение","знак":"💬","вид":"правило","раздел":"С чего начали: как отвечать на «как дела»","урок":"dasha3","урокИмя":"Занятие 3 с Дашей","html":"Тут есть одна логика, которую стоит понять сразу, и дальше она будет работать всегда.<br><br>\n      Когда тебя спрашивают <b>Wie geht es <span class=\"hl\">dir</span>?</b> — это буквально «как оно идёт <b>тебе</b>?». Не «как ты», а «как <b>тебе</b> идётся». Поэтому и отвечаешь ты не «я хорошо», а <b>Mir geht es gut</b> — «<b>мне</b> идётся хорошо».<br><br>\n      То есть в вопросе <b class=\"hl\">dir</b> (тебе) → в ответе <b class=\"hl\">mir</b> (мне). Вежливо спросят <b>Ihnen</b> (Вам) — отвечаешь всё равно <b>mir</b>, потому что говоришь про себя.","текст":"Тут есть одна логика, которую стоит понять сразу, и дальше она будет работать всегда. Когда тебя спрашивают Wie geht es dir? — это буквально «как оно идёт тебе?». Не «как ты», а «как тебе идётся». Поэтому и отвечаешь ты не «я хорошо», а Mir geht es gut — «мне идётся хорошо». То есть в вопросе dir (тебе) → в ответе mir (мне). Вежливо спросят Ihnen (Вам) — отвечаешь всё равно mir, потому что говоришь про себя."},{"id":"67cbee2fa0","тема":"Общение и обращение","знак":"💬","вид":"правило","раздел":"Herr и Frau — обращение","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"В немецком к человеку обращаются как в английском — «мистер» и «миссис»:<br>\n      <b>Herr</b> + фамилия = господин, <b>Frau</b> + фамилия = госпожа.<br><br>\n      Так обращаются <b>и к молодым, и к пожилым</b> — везде, где обстановка формальная:\n      университет, госучреждение, врач. Даша говорит, ей самой всегда говорят «Frau Jablokowa».","текст":"В немецком к человеку обращаются как в английском — «мистер» и «миссис»: Herr + фамилия = господин, Frau + фамилия = госпожа. Так обращаются и к молодым, и к пожилым — везде, где обстановка формальная: университет, госучреждение, врач. Даша говорит, ей самой всегда говорят «Frau Jablokowa»."},{"id":"f0b4665ff9","тема":"Общение и обращение","знак":"💬","вид":"ловушка","раздел":"Herr и Frau — обращение","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"<span class=\"big\">У Frau три значения сразу</span>\n      <b>die Frau</b> — это и «госпожа», и «женщина», и «жена». Одно слово на всё.\n      А вот у мужчин для каждого случая своё отдельное слово.","текст":"У Frau три значения сразу die Frau — это и «госпожа», и «женщина», и «жена». Одно слово на всё. А вот у мужчин для каждого случая своё отдельное слово."},{"id":"4e23b96731","тема":"Общение и обращение","знак":"💬","вид":"правило","раздел":"«Ты» и «Вы»: du или Sie?","урок":"urok1","урокИмя":"Урок 1","html":"<b>du</b> — неформально: друзья, семья, дети. <b>Sie</b> (всегда с большой буквы) — вежливо: незнакомцы, официально. <b class=\"hl\">С пациентами — всегда Sie.</b>","текст":"du — неформально: друзья, семья, дети. Sie (всегда с большой буквы) — вежливо: незнакомцы, официально. С пациентами — всегда Sie."},{"id":"9f363a39a9","тема":"Общение и обращение","знак":"💬","вид":"правило","раздел":"Три формы приказа","урок":"urok13","урокИмя":"Урок 13","html":"В русском мы говорим «идите» (вежливо) и «иди» (своим). В немецком то же самое, только форм <b>три</b> — по числу тех, к кому обращаешься:<br><br>\n      <b class=\"hl\">Sie</b> — пациент, коллега, любой чужой взрослый. <b>Твоя рабочая форма, 95% времени.</b><br>\n      <b class=\"hl\">du</b> — Полина, Вика, друзья.<br>\n      <b class=\"hl\">ihr</b> — несколько своих сразу («ребята, идите»).<br><br>\n      Один глагол <i>kommen</i> — три команды:","текст":"В русском мы говорим «идите» (вежливо) и «иди» (своим). В немецком то же самое, только форм три — по числу тех, к кому обращаешься: Sie — пациент, коллега, любой чужой взрослый. Твоя рабочая форма, 95% времени. du — Полина, Вика, друзья. ihr — несколько своих сразу («ребята, идите»). Один глагол kommen — три команды:"},{"id":"0c1f774c84","тема":"Произношение и письмо","знак":"🗣","вид":"правило","раздел":"Числа: ловушки произношения","урок":"dasha1","урокИмя":"Занятие 1 с Дашей","html":"Буква <b class=\"hl\">v</b> называется «фау» и читается как <b>ф</b>: <i>vier</i> [фиа], <i>vierzig</i> [фирцихь]. Не «в»!","текст":"Буква v называется «фау» и читается как ф: vier [фиа], vierzig [фирцихь]. Не «в»!"},{"id":"2e0f941856","тема":"Произношение и письмо","знак":"🗣","вид":"ловушка","раздел":"Числа: ловушки произношения","урок":"dasha1","урокИмя":"Занятие 1 с Дашей","html":"<span class=\"big\">Даша делала на этом отдельный акцент</span>\n      Три числа меняют звучание внутри производных: <b>sechs</b> [зэкс] → но <b>sechzehn</b> [зэхьцэн], <b>sechzig</b> [зэхьцихь] (звук «с» выпадает). <b>sieben</b> → теряет <b>-en</b>: <b>siebzehn</b>, <b>siebzig</b>. И <b>dreißig</b> — единственный десяток через <b>-ßig</b>, а не -zig.","текст":"Даша делала на этом отдельный акцент Три числа меняют звучание внутри производных: sechs [зэкс] → но sechzehn [зэхьцэн], sechzig [зэхьцихь] (звук «с» выпадает). sieben → теряет -en: siebzehn, siebzig. И dreißig — единственный десяток через -ßig, а не -zig."},{"id":"e728073de9","тема":"Произношение и письмо","знак":"🗣","вид":"правило","раздел":"⚠️ Мелкие исключения: когда буква добавляется или пропадает","урок":"dasha3","урокИмя":"Занятие 3 с Дашей","html":"Это не отдельная категория, а маленькие поправки внутри <b>правильных</b> глаголов. Они правильные, но с крошечными орфографическими причудами — исключительно ради удобства произношения.","текст":"Это не отдельная категория, а маленькие поправки внутри правильных глаголов. Они правильные, но с крошечными орфографическими причудами — исключительно ради удобства произношения."},{"id":"1d025e0567","тема":"Произношение и письмо","знак":"🗣","вид":"ловушка","раздел":"⚠️ Три ловушки в профессиях","урок":"polya8","урокИмя":"Занятие 8 Полины","html":"<span class=\"big\">Гласная в корне меняется на умляут</span>\n      <b>der Arzt</b> → <b>die Ärztin</b> (a → ä)<br>\n      <b>der Koch</b> → <b>die Köchin</b> (o → ö)<br><br>\n      Даша отдельно предупредила про <b>Verkäufer</b>: сочетание <b>äu</b> читается как <b>«ой»</b>,\n      получается «фэркойфа», а не «фэркауфэр».","текст":"Гласная в корне меняется на умляут der Arzt → die Ärztin (a → ä) der Koch → die Köchin (o → ö) Даша отдельно предупредила про Verkäufer: сочетание äu читается как «ой», получается «фэркойфа», а не «фэркауфэр»."},{"id":"805d81ef0b","тема":"Произношение и письмо","знак":"🗣","вид":"правило","раздел":"Три главных принципа","урок":"urok0","урокИмя":"Урок 0","html":"<b>1. Чёткость.</b> Читается почти как написано, ничего не «проглатываем».<br>\n      <b>2. Согласные не смягчаются.</b> Перед е/и согласная твёрдая: Tisch = «тыш». Исключение — L, всегда мягкая (ль).<br>\n      <b>3. Звонкие в конце оглушаются:</b> b→п, d→т, g→к. Hund → «хунт», Tag → «так».","текст":"1. Чёткость. Читается почти как написано, ничего не «проглатываем». 2. Согласные не смягчаются. Перед е/и согласная твёрдая: Tisch = «тыш». Исключение — L, всегда мягкая (ль). 3. Звонкие в конце оглушаются: b→п, d→т, g→к. Hund → «хунт», Tag → «так»."},{"id":"45af70d851","тема":"Слова, которые путают","знак":"⚠️","вид":"ловушка","раздел":"Новые глаголы — и три разбора, где легко перепутать","урок":"dasha3","урокИмя":"Занятие 3 с Дашей","html":"<span class=\"big\">Разбор 1: kennen или können — одна точка меняет смысл</span>\n      <b>kennen</b> (без точек над o) — <b>знать</b> кого-то или что-то. <i>Ich kenne Eva</i> — я знаю Еву.<br>\n      <b>können</b> (с точками) — <b>мочь, уметь</b>. Это модальный глагол.<br><br>\n      Слова похожи на вид, но это совершенно разные вещи. Даша специально остановилась: «не забываем, это не können, здесь нет смешной о».","текст":"Разбор 1: kennen или können — одна точка меняет смысл kennen (без точек над o) — знать кого-то или что-то. Ich kenne Eva — я знаю Еву. können (с точками) — мочь, уметь. Это модальный глагол. Слова похожи на вид, но это совершенно разные вещи. Даша специально остановилась: «не забываем, это не können, здесь нет смешной о»."},{"id":"ea61394435","тема":"Слова, которые путают","знак":"⚠️","вид":"ловушка","раздел":"Новые глаголы — и три разбора, где легко перепутать","урок":"dasha3","урокИмя":"Занятие 3 с Дашей","html":"<span class=\"big\">Разбор 2: wohnen или leben — оба «жить»</span>\n      <b>wohnen</b> — жить <b>где-то физически</b>: город, страна, квартира. Про адрес.<br>\n      <b>leben</b> — про жизнь <b>вообще</b>, более отвлечённо: «жить счастливо», «жить хорошо».<br><br>\n      Даша успокоила: если перепутать — <b>ошибкой не будет</b>, их можно употреблять как синонимы. <i>Ich wohne in Moskau</i> и <i>Ich lebe in Moskau</i> — оба правильно.","текст":"Разбор 2: wohnen или leben — оба «жить» wohnen — жить где-то физически: город, страна, квартира. Про адрес. leben — про жизнь вообще, более отвлечённо: «жить счастливо», «жить хорошо». Даша успокоила: если перепутать — ошибкой не будет, их можно употреблять как синонимы. Ich wohne in Moskau и Ich lebe in Moskau — оба правильно."},{"id":"f1a7fb197e","тема":"Слова, которые путают","знак":"⚠️","вид":"ловушка","раздел":"Новые глаголы — и три разбора, где легко перепутать","урок":"dasha3","урокИмя":"Занятие 3 с Дашей","html":"<span class=\"big\">Разбор 3: studieren или lernen — оба «учиться»</span>\n      <b>studieren</b> — учиться <b>в университете</b>, на специальности. Область применения узкая: только про вуз. <i>Ich studiere Physik</i> — я учусь на физика.<br>\n      <b>lernen</b> — <b>учить что-то</b>: предмет, язык, материал. <i>Du lernst Deutsch</i> — ты учишь немецкий.","текст":"Разбор 3: studieren или lernen — оба «учиться» studieren — учиться в университете, на специальности. Область применения узкая: только про вуз. Ich studiere Physik — я учусь на физика. lernen — учить что-то: предмет, язык, материал. Du lernst Deutsch — ты учишь немецкий."},{"id":"6a5080c4d9","тема":"Слова, которые путают","знак":"⚠️","вид":"ловушка","раздел":"Дифтонги: две буквы — один звук","урок":"urok0","урокИмя":"Урок 0","html":"Не путай: <b>ei</b> = «ай» (Wein), а <b>ie</b> = долгое «и» (Liebe). Это разные звуки!","текст":"Не путай: ei = «ай» (Wein), а ie = долгое «и» (Liebe). Это разные звуки!"},{"id":"e97065d5a1","тема":"Слова, которые путают","знак":"⚠️","вид":"ловушка","раздел":"⚠️ Разговорное время — ЛОВУШКА halb","урок":"urok10","урокИмя":"Урок 10","html":"<span class=\"big\">halb zehn = 9:30, а НЕ 10:30!</span><br>\n      Немцы считают половину <b>до</b> следующего часа: <b>halb zehn</b> = «половина к десяти» = 9:30. Не «половина десятого», как у нас! Всегда думай на час вперёд.","текст":"halb zehn = 9:30, а НЕ 10:30! Немцы считают половину до следующего часа: halb zehn = «половина к десяти» = 9:30. Не «половина десятого», как у нас! Всегда думай на час вперёд."},{"id":"5179a2b442","тема":"Слова, которые путают","знак":"⚠️","вид":"ловушка","раздел":"⚠️ Ловушка первая: в объявлении «3 комнаты» — это не то, что ты подумал","урок":"urok15","урокИмя":"Урок 15","html":"<span class=\"big\">Кухня и ванная в счёт НЕ входят</span>\n      <b>Dreizimmerwohnung</b> — это <b>три жилые комнаты</b> ПЛЮС кухня, ванная и коридор. То есть по-русски это скорее «трёшка», а не «три комнаты вместе с кухней». Если ищешь как в России — ошибёшься на целую комнату и переплатишь.<br><br>\n      Отсюда и странная на первый взгляд запись в объявлениях: <i>«3 Zimmer, Küche, Bad»</i> — кухню и ванную перечисляют отдельно именно потому, что они не считаются.","текст":"Кухня и ванная в счёт НЕ входят Dreizimmerwohnung — это три жилые комнаты ПЛЮС кухня, ванная и коридор. То есть по-русски это скорее «трёшка», а не «три комнаты вместе с кухней». Если ищешь как в России — ошибёшься на целую комнату и переплатишь. Отсюда и странная на первый взгляд запись в объявлениях: «3 Zimmer, Küche, Bad» — кухню и ванную перечисляют отдельно именно потому, что они не считаются."},{"id":"3aec24474e","тема":"Слова, которые путают","знак":"⚠️","вид":"правило","раздел":"Small talk — вход в любой разговор","урок":"urok16","урокИмя":"Урок 16","html":"Погода в Германии — это социальный ритуал, а не метеорология. Фраза о погоде в лифте, в очереди, перед началом приёма — <b>нормальный способ начать разговор</b> и снять неловкость с пациентом.","текст":"Погода в Германии — это социальный ритуал, а не метеорология. Фраза о погоде в лифте, в очереди, перед началом приёма — нормальный способ начать разговор и снять неловкость с пациентом."},{"id":"76b12c4684","тема":"Устойчивые выражения","знак":"🔗","вид":"правило","раздел":"Наречия частотности","урок":"dasha1","урокИмя":"Занятие 1 с Дашей","html":"<b>Устойчивые выражения:</b> <b class=\"hl\">ab und zu</b> и <b class=\"hl\">hin und wieder</b> — оба «время от времени, порой».<br>\n      <b>Кратность:</b> <i>Mal</i> = раз → <b>einmal / zweimal / dreimal pro Woche</b> (раз/два/три раза в неделю).","текст":"Устойчивые выражения: ab und zu и hin und wieder — оба «время от времени, порой». Кратность: Mal = раз → einmal / zweimal / dreimal pro Woche (раз/два/три раза в неделю)."},{"id":"0dbb5ba7ec","тема":"Устойчивые выражения","знак":"🔗","вид":"правило","раздел":"Устойчивые выражения","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"<b>spazieren gehen</b> — два глагола, которые ходят парой. Отдельно <i>spazieren</i> не используют,\n      только вместе с <i>gehen</i>. Переводится «идти гулять».<br><br>\n      <b>Urlaub machen</b> — дословно «делать отпуск», а по-русски «ездить в отпуск».\n      Даша рассказала, что видела в Вене табличку на двери врачебного кабинета: <i>Wir machen Urlaub</i>.","текст":"spazieren gehen — два глагола, которые ходят парой. Отдельно spazieren не используют, только вместе с gehen. Переводится «идти гулять». Urlaub machen — дословно «делать отпуск», а по-русски «ездить в отпуск». Даша рассказала, что видела в Вене табличку на двери врачебного кабинета: Wir machen Urlaub."},{"id":"1b6f043eef","тема":"Устойчивые выражения","знак":"🔗","вид":"ловушка","раздел":"Устойчивые выражения","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"<span class=\"big\">На поезде = «с поездом»</span>\n      Мы говорим «<b>на</b> поезде, <b>на</b> машине, <b>на</b> автобусе».<br>\n      Немцы говорят дословно «<b>с</b> поездом» — <b>mit dem Zug</b>. Всегда предлог <b>mit</b>, для любого транспорта.","текст":"На поезде = «с поездом» Мы говорим «на поезде, на машине, на автобусе». Немцы говорят дословно «с поездом» — mit dem Zug. Всегда предлог mit, для любого транспорта."},{"id":"e0f6ff8e6b","тема":"Устойчивые выражения","знак":"🔗","вид":"правило","раздел":"Совет мамы","урок":"polya7","урокИмя":"Занятие 7 Полины","html":"<b class=\"hl\">am besten</b> = «лучше всего». Это <b>превосходная степень</b> прилагательного — целая тема, до которой Даша обещала дойти отдельно. Пока просто запомни выражение целиком: <i>So geht es am besten</i> — «так оно лучше всего идёт».","текст":"am besten = «лучше всего». Это превосходная степень прилагательного — целая тема, до которой Даша обещала дойти отдельно. Пока просто запомни выражение целиком: So geht es am besten — «так оно лучше всего идёт»."},{"id":"30ad19d196","тема":"Устойчивые выражения","знак":"🔗","вид":"правило","раздел":"⭐ Spaß machen — Даша велела записать","урок":"polya7","урокИмя":"Занятие 7 Полины","html":"<b class=\"hl\">der Spaß</b> — удовольствие, развлечение, веселье. Но переводить это слово по отдельности не надо — оно живёт в выражении:<br><br>\n      <b class=\"hl\">Das macht mir Spaß.</b> — буквально «это делает мне удовольствие», по-русски «мне это в радость, мне это нравится делать».<br><br>\n      Это одно из тех выражений, которые немцы употребляют постоянно. Выучи целиком, не разбирая на части.","текст":"der Spaß — удовольствие, развлечение, веселье. Но переводить это слово по отдельности не надо — оно живёт в выражении: Das macht mir Spaß. — буквально «это делает мне удовольствие», по-русски «мне это в радость, мне это нравится делать». Это одно из тех выражений, которые немцы употребляют постоянно. Выучи целиком, не разбирая на части."},{"id":"24c2da8e13","тема":"Разное","знак":"📎","вид":"правило","раздел":"⭐⭐ Упражнение: 25 предложений","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"<b>Как этим пользоваться.</b> Сначала прочитайте немецкую строчку и попробуйте перевести сами.\n      Только потом смотрите на перевод под ней. Так упражнение работает второй раз.","текст":"Как этим пользоваться. Сначала прочитайте немецкую строчку и попробуйте перевести сами. Только потом смотрите на перевод под ней. Так упражнение работает второй раз."},{"id":"38473b7519","тема":"Разное","знак":"📎","вид":"правило","раздел":"⭐ Глаголы, меняющие гласную","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"<b>Что делать.</b> Правила простые, а вот <b>какие именно глаголы</b> так себя ведут — надо просто знать.\n      Это и есть те самые ~50 карточек, которые Даша обещала прислать. Правило бесплатное, список — учить.","текст":"Что делать. Правила простые, а вот какие именно глаголы так себя ведут — надо просто знать. Это и есть те самые ~50 карточек, которые Даша обещала прислать. Правило бесплатное, список — учить."},{"id":"9c3e1b0858","тема":"Разное","знак":"📎","вид":"правило","раздел":"Какой человек? — прилагательные","урок":"polya5","урокИмя":"Занятие 5 Полины","html":"<b>hilfsbereit</b> разбирается на части: <i>Hilfe</i> (помощь, от глагола <i>helfen</i>) + <i>bereit</i> (готовый) = «готовый помочь». <i>bereit</i> = <i>fertig</i> — оба «готовый».","текст":"hilfsbereit разбирается на части: Hilfe (помощь, от глагола helfen) + bereit (готовый) = «готовый помочь». bereit = fertig — оба «готовый»."},{"id":"f3b6d9088d","тема":"Разное","знак":"📎","вид":"правило","раздел":"Полезные слова с урока","урок":"polya5","урокИмя":"Занятие 5 Полины","html":"<b>Хоть где-то логика:</b> <i>die Frage</i> (вопрос) → <i>fragen</i> (спрашивать), <i>die Antwort</i> (ответ) → <i>antworten</i> (отвечать). Существительное и глагол — одного корня.","текст":"Хоть где-то логика: die Frage (вопрос) → fragen (спрашивать), die Antwort (ответ) → antworten (отвечать). Существительное и глагол — одного корня."},{"id":"ba449ee552","тема":"Разное","знак":"📎","вид":"ловушка","раздел":"⚠️ leben или wohnen","урок":"polya6","урокИмя":"Занятие 6 Полины","html":"<span class=\"big\">Ошибкой не будет ни то, ни другое — но оттенок разный</span>\n      <b>wohnen</b> — жить физически, по адресу. Это основное слово для «я живу в…».<br>\n      <b>leben</b> — больше про <b>образ жизни</b>, про то, как человек живёт.<br><br>\n      Даша: «Можно и то, и то использовать синонимично, ошибки не будет».","текст":"Ошибкой не будет ни то, ни другое — но оттенок разный wohnen — жить физически, по адресу. Это основное слово для «я живу в…». leben — больше про образ жизни, про то, как человек живёт. Даша: «Можно и то, и то использовать синонимично, ошибки не будет»."},{"id":"039ae050a0","тема":"Разное","знак":"📎","вид":"ловушка","раздел":"⚠️ wie или welche — здесь Полина споткнулась","урок":"polya6","урокИмя":"Занятие 6 Полины","html":"<span class=\"big\">wie — «каков», welche — «который из»</span>\n      <b>wie</b> спрашивает про <b>качество</b>: какая она — добрая, строгая, весёлая?<br>\n      <b>welche</b> спрашивает про <b>выбор из группы</b>: которая из этих бабушек твоя?<br><br>\n      Полина сказала <i>Welche ist deine Großmutter?</i>, имея в виду качество. Даша объяснила: если бы стояла группа бабушек и надо было показать свою — тогда <i>welche</i>. А про характер — <i>wie</i>.","текст":"wie — «каков», welche — «который из» wie спрашивает про качество: какая она — добрая, строгая, весёлая? welche спрашивает про выбор из группы: которая из этих бабушек твоя? Полина сказала Welche ist deine Großmutter?, имея в виду качество. Даша объяснила: если бы стояла группа бабушек и надо было показать свою — тогда welche. А про характер — wie."},{"id":"a889d7a04e","тема":"Разное","знак":"📎","вид":"правило","раздел":"Текст: зачем она учит языки","урок":"polya7","урокИмя":"Занятие 7 Полины","html":"<b class=\"hl\">schön</b> — это не только «красиво» про предмет. Про ситуацию это «классно, здорово»: <i>Das ist so schön…</i> — «это так здорово…».<br><br>\n      <b class=\"hl\">wenn</b> = «когда» и «если» одновременно. <b class=\"hl\">verstehen</b> = понимать. <b class=\"hl\">vor allem</b> = прежде всего.","текст":"schön — это не только «красиво» про предмет. Про ситуацию это «классно, здорово»: Das ist so schön… — «это так здорово…». wenn = «когда» и «если» одновременно. verstehen = понимать. vor allem = прежде всего."},{"id":"367e4300f9","тема":"Разное","знак":"📎","вид":"ловушка","раздел":"Книги от друга","урок":"polya7","урокИмя":"Занятие 7 Полины","html":"<span class=\"big\">Ловушка чтения: lese — это не «Лиза»</span>\n      Полина честно призналась, что читала <i>lese</i> как имя «Лиза» и не могла понять, при чём тут какая-то Лиза. Это глагол <b>lesen</b> — читать. <i>Nun <b>lese</b> ich sehr gerne</i> — «теперь я читаю с большим удовольствием».","текст":"Ловушка чтения: lese — это не «Лиза» Полина честно призналась, что читала lese как имя «Лиза» и не могла понять, при чём тут какая-то Лиза. Это глагол lesen — читать. Nun lese ich sehr gerne — «теперь я читаю с большим удовольствием»."},{"id":"57f7bcf43e","тема":"Разное","знак":"📎","вид":"правило","раздел":"⭐ Наречия времени — как часто что-то происходит","урок":"polya7","урокИмя":"Занятие 7 Полины","html":"Я расставил их <b>по убыванию частоты</b> — от «всегда» до «никогда». Так их запоминать проще, чем вразнобой: получается шкала.","текст":"Я расставил их по убыванию частоты — от «всегда» до «никогда». Так их запоминать проще, чем вразнобой: получается шкала."},{"id":"d42818c9ef","тема":"Разное","знак":"📎","вид":"правило","раздел":"⭐ Наречия времени — как часто что-то происходит","урок":"polya7","урокИмя":"Занятие 7 Полины","html":"<b>Куда ставить наречие в предложении?</b> Проще всего — <b class=\"hl\">сразу после глагола</b>:<br>\n      <i>Ich lerne <b>immer</b> am Abend</i> · <i>Ich gehe <b>manchmal</b> ins Kino</i> · <i>Er kommt <b>selten</b> zu spät</i>.<br><br>\n      Можно и в начало предложения, но тогда глагол по-прежнему остаётся на втором месте: <i><b>Manchmal</b> gehe ich ins Kino</i> — обрати внимание, <i>ich</i> и <i>gehe</i> поменялись местами.","текст":"Куда ставить наречие в предложении? Проще всего — сразу после глагола: Ich lerne immer am Abend · Ich gehe manchmal ins Kino · Er kommt selten zu spät. Можно и в начало предложения, но тогда глагол по-прежнему остаётся на втором месте: Manchmal gehe ich ins Kino — обрати внимание, ich и gehe поменялись местами."},{"id":"6725e672da","тема":"Разное","знак":"📎","вид":"правило","раздел":"Слова из разговора","урок":"polya8","урокИмя":"Занятие 8 Полины","html":"<b>manchmal</b> и <b>ab und zu</b> — это одно и то же: «иногда», «время от времени».\n      Даша напомнила: можно говорить и так, и так, они взаимозаменяемы.","текст":"manchmal и ab und zu — это одно и то же: «иногда», «время от времени». Даша напомнила: можно говорить и так, и так, они взаимозаменяемы."},{"id":"daf915b35b","тема":"Разное","знак":"📎","вид":"правило","раздел":"⚠️ aufräumen или putzen","урок":"polya8","урокИмя":"Занятие 8 Полины","html":"<b>aufräumen</b> — навести порядок: разложить вещи по местам. Ребёнок раскидал игрушки, вы за ним убрали — это <b>aufräumen</b>.<br><br>\n      <b>putzen</b> — почистить, помыть. Помыли пол, пропылесосили, надраили ванну — это <b>putzen</b>.\n      Даша назвала это «генеральной уборкой».","текст":"aufräumen — навести порядок: разложить вещи по местам. Ребёнок раскидал игрушки, вы за ним убрали — это aufräumen. putzen — почистить, помыть. Помыли пол, пропылесосили, надраили ванну — это putzen. Даша назвала это «генеральной уборкой»."},{"id":"1386c95898","тема":"Разное","знак":"📎","вид":"ловушка","раздел":"⚠️ aufräumen или putzen","урок":"polya8","урокИмя":"Занятие 8 Полины","html":"<span class=\"big\">Два разных вида уборки</span>\n      Полина спросила: «А убирать и прибираться — это не мыть?» Оказалось, у немцев это два глагола.","текст":"Два разных вида уборки Полина спросила: «А убирать и прибираться — это не мыть?» Оказалось, у немцев это два глагола."},{"id":"69d598e477","тема":"Разное","знак":"📎","вид":"правило","раздел":"Долгие и краткие гласные","урок":"urok0","урокИмя":"Урок 0","html":"<b>Долгая</b>, если: удвоена (Staat), после неё h (Bahn), открытый слог. <b>Краткая</b>, если после неё 2+ согласные (Kopf). Меняет смысл: <i>Staat</i> (государство) ≠ <i>Stadt</i> (город)!","текст":"Долгая, если: удвоена (Staat), после неё h (Bahn), открытый слог. Краткая, если после неё 2+ согласные (Kopf). Меняет смысл: Staat (государство) ≠ Stadt (город)!"},{"id":"13bcd44411","тема":"Разное","знак":"📎","вид":"правило","раздел":"⚠️ Разговорное время — ЛОВУШКА halb","урок":"urok10","урокИмя":"Урок 10","html":"Ещё разговорные: <b class=\"hl\">Viertel nach</b> (четверть после) = :15, <b class=\"hl\">Viertel vor</b> (четверть до) = :45. <i>Viertel nach neun</i> = 9:15, <i>Viertel vor zehn</i> = 9:45. <b>nach</b> = после, <b>vor</b> = до.","текст":"Ещё разговорные: Viertel nach (четверть после) = :15, Viertel vor (четверть до) = :45. Viertel nach neun = 9:15, Viertel vor zehn = 9:45. nach = после, vor = до."},{"id":"58f06dab61","тема":"Разное","знак":"📎","вид":"ловушка","раздел":"Сильные глаголы: ge + … + en","урок":"urok12","урокИмя":"Урок 12","html":"<span class=\"big\">Эти учат наизусть — как в английском go/went/gone</span>\n      Оканчиваются на <b>-en</b>, и часто меняется гласная в корне (<i>trinken → getr<b>u</b>nken</i>, <i>sprechen → gespr<b>o</b>chen</i>). Логики нет, но список частых — небольшой. Начни с этих двенадцати.","текст":"Эти учат наизусть — как в английском go/went/gone Оканчиваются на -en, и часто меняется гласная в корне (trinken → getrunken, sprechen → gesprochen). Логики нет, но список частых — небольшой. Начни с этих двенадцати."},{"id":"e7283007fa","тема":"Разное","знак":"📎","вид":"ловушка","раздел":"⚠️ Форма на Sie — формула из двух слов","урок":"urok13","урокИмя":"Урок 13","html":"<span class=\"big\">Ловушка: приказ и вопрос выглядят ОДИНАКОВО</span>\n      <i>Kommen Sie?</i> и <i>Kommen Sie!</i> — те же два слова в том же порядке. Различает только <b>интонация</b>: в вопросе голос идёт вверх, в команде — вниз. Послушай обе кнопки подряд и поймай разницу.","текст":"Ловушка: приказ и вопрос выглядят ОДИНАКОВО Kommen Sie? и Kommen Sie! — те же два слова в том же порядке. Различает только интонация: в вопросе голос идёт вверх, в команде — вниз. Послушай обе кнопки подряд и поймай разницу."},{"id":"0780c98457","тема":"Разное","знак":"📎","вид":"ловушка","раздел":"Форма на du — для дома","урок":"urok13","урокИмя":"Урок 13","html":"<span class=\"big\">Главное правило этого раздела: с умляутом расстаёмся, с i остаёмся</span>\n      У глаголов-хамелеонов (урок 8) в форме du меняется гласная. В приказе судьба у изменений разная:<br><br>\n      1️⃣ <b>e → i остаётся:</b> du spr<b>i</b>chst → Spr<b>i</b>ch! · du n<b>i</b>mmst → N<b>i</b>mm!<br>\n      2️⃣ <b>a → ä ИСЧЕЗАЕТ:</b> du f<b>ä</b>hrst → F<b>a</b>hr! (не «Fähr»!) · du schl<b>ä</b>fst → Schl<b>a</b>f!","текст":"Главное правило этого раздела: с умляутом расстаёмся, с i остаёмся У глаголов-хамелеонов (урок 8) в форме du меняется гласная. В приказе судьба у изменений разная: 1️⃣ e → i остаётся: du sprichst → Sprich! · du nimmst → Nimm! 2️⃣ a → ä ИСЧЕЗАЕТ: du fährst → Fahr! (не «Fähr»!) · du schläfst → Schlaf!"},{"id":"cbc4d386a1","тема":"Разное","знак":"📎","вид":"правило","раздел":"Форма на ihr — самая простая","урок":"urok13","урокИмя":"Урок 13","html":"Совпадает с обычным настоящим временем для <i>ihr</i>, просто выбрасываем само слово <i>ihr</i>: <i>ihr kommt → <b class=\"hl\">Kommt!</b></i>. Учить отдельно нечего.","текст":"Совпадает с обычным настоящим временем для ihr, просто выбрасываем само слово ihr: ihr kommt → Kommt!. Учить отдельно нечего."},{"id":"075b94fcf6","тема":"Разное","знак":"📎","вид":"ловушка","раздел":"Напитки — и главный вопрос в немецком ресторане","урок":"urok14","урокИмя":"Урок 14","html":"<span class=\"big\">Попросишь «воду» — принесут газированную</
