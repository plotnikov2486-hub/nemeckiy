 способ — попросить пересказать. И открытый вопрос в конце: не «есть вопросы?», а какие у вас вопросы?","ти":13,"пи":5,"подтема":"Трудный разговор с пациентом"},{"id":"6eeee07ced","тема":"Порядок слов","знак":"📐","вид":"правило","раздел":"⭐ Что такое трудный разговор и пять правил","урок":"urok53","урокИмя":"Урок 54","html":"Учебник приводит определение датского врача Буки-Лассен: это разговор, в котором врач <b>сознательно</b> сообщает пациенту о тяжёлой, неизлечимой болезни с вероятно плохим прогнозом. Шире — любая плохая новость: опасный диагноз, неудачная операция, смерть близкого. Из цитат в главе главная — слова Эйнштейна: <i>«Mache die Dinge so einfach wie möglich – aber nicht einfacher»</i>: проще, но не приукрашивая.","текст":"Учебник приводит определение датского врача Буки-Лассен: это разговор, в котором врач сознательно сообщает пациенту о тяжёлой, неизлечимой болезни с вероятно плохим прогнозом. Шире — любая плохая новость: опасный диагноз, неудачная операция, смерть близкого. Из цитат в главе главная — слова Эйнштейна: «Mache die Dinge so einfach wie möglich – aber nicht einfacher»: проще, но не приукрашивая.","ти":13,"пи":5,"подтема":"Трудный разговор с пациентом"},{"id":"f1b137fd81","тема":"Слова, которые путают","знак":"⚠️","вид":"правило","раздел":"Надежда без обмана","урок":"urok53","урокИмя":"Урок 54","html":"На «сколько мне осталось?» до результатов честный ответ — «пока не могу сказать» и почему. Не обещайте выздоровления, но и не отнимайте надежду: лечение есть, вы не одни.","текст":"На «сколько мне осталось?» до результатов честный ответ — «пока не могу сказать» и почему. Не обещайте выздоровления, но и не отнимайте надежду: лечение есть, вы не одни.","ти":13,"пи":5,"подтема":"Трудный разговор с пациентом"},{"id":"2aeae7ed7a","тема":"Разное","знак":"📎","вид":"правило","раздел":"⭐⭐ Выслушать: эмпатия","урок":"urok53","урокИмя":"Урок 54","html":"Назовите то, что видите (<b>Ich sehe, Sie sind …</b>), предложите время (<b>einen Moment Ruhe</b>), спросите о чувствах открытым вопросом. Не торопитесь к плану лечения — пока пациент в шоке, он его не услышит.","текст":"Назовите то, что видите (Ich sehe, Sie sind …), предложите время (einen Moment Ruhe), спросите о чувствах открытым вопросом. Не торопитесь к плану лечения — пока пациент в шоке, он его не услышит.","ти":13,"пи":5,"подтема":"Трудный разговор с пациентом"},{"id":"1d824b8f12","тема":"Модальные глаголы","знак":"🔑","вид":"правило","раздел":"🇦🇹 Для врача в Австрии","урок":"urok55","урокИмя":"Урок 56","html":"Межкультурная коммуникация касается и вас: русский врач в австрийской клинике — тоже «другая культура». Несколько вещей, которые отличают Австрию даже от Германии:<br>\n      • <b>Grüß Gott!</b> — обычное «здравствуйте» (особенно вне Вены); <b>Servus!</b> — «привет/пока» между своими, на du.<br>\n      • <b>Титулы любят.</b> К врачу — <i>Frau Doktor, Herr Doktor</i>; заведующий отделением — <b>der Primar</b> (женщина — <i>die Primaria</i>).<br>\n      • Больница по-австрийски часто <b>das Spital</b>, амбулаторный приём при больнице — <b>die Ambulanz</b>.<br>\n      • <b>Sie</b> — пока вам не предложат <i>du</i>. Предлагает обычно старший по возрасту или должности: <i>Wollen wir uns duzen?</i><br>\n      • Тенденция, не правило: в Австрии просят и отказывают чуть мягче и обходительнее, чем в Германии — больше <i>würden, könnten, vielleicht</i>.","текст":"Межкультурная коммуникация касается и вас: русский врач в австрийской клинике — тоже «другая культура». Несколько вещей, которые отличают Австрию даже от Германии: • Grüß Gott! — обычное «здравствуйте» (особенно вне Вены); Servus! — «привет/пока» между своими, на du. • Титулы любят. К врачу — Frau Doktor, Herr Doktor; заведующий отделением — der Primar (женщина — die Primaria). • Больница по-австрийски часто das Spital, амбулаторный приём при больнице — die Ambulanz. • Sie — пока вам не предложат du. Предлагает обычно старший по возрасту или должности: Wollen wir uns duzen? • Тенденция, не правило: в Австрии просят и отказывают чуть мягче и обходительнее, чем в Германии — больше würden, könnten, vielleicht.","ти":13,"пи":6,"подтема":"В работе врача"},{"id":"e30a1ba3ad","тема":"Числа, время, даты","знак":"🔢","вид":"правило","раздел":"Глаголы для врача","урок":"urok3","урокИмя":"Урок 4","html":"Все глаголы на <b>-ieren</b> правильные, и ударение у них на <b>-ie-</b>: <i>operíeren, kontrollíeren</i>. В медицине таких десятки: <i>diagnostizieren, informieren, telefonieren</i>.","текст":"Все глаголы на -ieren правильные, и ударение у них на -ie-: operíeren, kontrollíeren. В медицине таких десятки: diagnostizieren, informieren, telefonieren.","ти":13,"пи":6,"подтема":"В работе врача"},{"id":"b333a09928","тема":"Местоимения","знак":"🧩","вид":"правило","раздел":"Врачебный блок — здесь тема окупается сразу","урок":"urok18","урокИмя":"Урок 19","html":"Первая фраза списка — <b class=\"hl\">Wie fühlen Sie sich?</b> — это вопрос, которым начинается почти любой приём и почти любая станция на Fachsprachprüfung. Выучи её до автоматизма.<br><br>\n      Дальше идёт весь осмотр: разденьтесь, сядьте, лягте, расслабьтесь, не двигайтесь — все эти команды возвратные.","текст":"Первая фраза списка — Wie fühlen Sie sich? — это вопрос, которым начинается почти любой приём и почти любая станция на Fachsprachprüfung. Выучи её до автоматизма. Дальше идёт весь осмотр: разденьтесь, сядьте, лягте, расслабьтесь, не двигайтесь — все эти команды возвратные.","ти":13,"пи":6,"подтема":"В работе врача"},{"id":"75194df954","тема":"Местоимения","знак":"🧩","вид":"правило","раздел":"⭐ Три способа пересказать","урок":"urok43","урокИмя":"Урок 44","html":"Одна фраза пациента — и три пересказа, от разговорного к официальному. Не забывайте менять местоимение: <b>ich → er / sie</b>.","текст":"Одна фраза пациента — и три пересказа, от разговорного к официальному. Не забывайте менять местоимение: ich → er / sie.","ти":13,"пи":6,"подтема":"В работе врача"},{"id":"ee7d3da75d","тема":"Общение и обращение","знак":"💬","вид":"правило","раздел":"В работе врача","урок":"urok33","урокИмя":"Урок 34","html":"Разбор случая на обходе или конференции, разговор с пациентом, который опоздал с обращением: везде нужны фразы «следовало бы» и «могло бы».","текст":"Разбор случая на обходе или конференции, разговор с пациентом, который опоздал с обращением: везде нужны фразы «следовало бы» и «могло бы».","ти":13,"пи":6,"подтема":"В работе врача"},{"id":"e9b8490168","тема":"Общение и обращение","знак":"💬","вид":"правило","раздел":"🩺 В работе врача","урок":"urok36","урокИмя":"Урок 37","html":"Перевод к специалисту, разговор с коллегой, родственники пациента, обращение <b>Herr + фамилия</b>: во всех этих фразах нужна n-Deklination. Обратите внимание на <b>Herrn Müller</b>: форма меняется и при фамилии.","текст":"Перевод к специалисту, разговор с коллегой, родственники пациента, обращение Herr + фамилия: во всех этих фразах нужна n-Deklination. Обратите внимание на Herrn Müller: форма меняется и при фамилии.","ти":13,"пи":6,"подтема":"В работе врача"},{"id":"20b7e1c4d5","тема":"Общение и обращение","знак":"💬","вид":"правило","раздел":"🏥 Иерархия в клинике","урок":"urok59","урокИмя":"Урок 60","html":"По книге Farhan (гл. 6): <b>Chefarzt</b> отвечает за отделение — медицину, людей и деньги (в Австрии — <b>Primar / Primaria</b>); <b>Oberarzt</b> — обычно специалист, ведёт ассистентов, проводит обходы (<i>Oberarztvisite</i>) и стоит «на подхвате» ночью и в выходные (<i>Hintergrunddienst</i>); <b>Facharzt</b> — врач после многолетней Weiterbildung и экзамена; <b>Assistenzarzt</b> — врач в обучении.<br>\n      Советы книги для общения с медсёстрами и другими специалистами: формальное приветствие, уважение и вежливость, объяснять термины, <b>спрашивать мнение команды</b> и включать его в план лечения.","текст":"По книге Farhan (гл. 6): Chefarzt отвечает за отделение — медицину, людей и деньги (в Австрии — Primar / Primaria); Oberarzt — обычно специалист, ведёт ассистентов, проводит обходы (Oberarztvisite) и стоит «на подхвате» ночью и в выходные (Hintergrunddienst); Facharzt — врач после многолетней Weiterbildung и экзамена; Assistenzarzt — врач в обучении. Советы книги для общения с медсёстрами и другими специалистами: формальное приветствие, уважение и вежливость, объяснять термины, спрашивать мнение команды и включать его в план лечения.","ти":13,"пи":6,"подтема":"В работе врача"},{"id":"3aec24474e","тема":"Слова, которые путают","знак":"⚠️","вид":"правило","раздел":"Small talk — вход в любой разговор","урок":"urok16","урокИмя":"Урок 17","html":"Погода в Германии — это социальный ритуал, а не метеорология. Фраза о погоде в лифте, в очереди, перед началом приёма — <b>нормальный способ начать разговор</b> и снять неловкость с пациентом.","текст":"Погода в Германии — это социальный ритуал, а не метеорология. Фраза о погоде в лифте, в очереди, перед началом приёма — нормальный способ начать разговор и снять неловкость с пациентом.","ти":13,"пи":6,"подтема":"В работе врача"},{"id":"ac7c8f97ce","тема":"Слова, которые путают","знак":"⚠️","вид":"правило","раздел":"⭐⭐ Фразы врача: спросить, а не решить","урок":"urok55","урокИмя":"Урок 56","html":"<b>Грамматика.</b> Вежливость — через Konjunktiv II: <i>möchten, könnten, sollten</i>. И косвенный вопрос: после <i>Was glauben Sie, …</i> глагол уходит <b>в конец</b> — <i>woher Ihre Beschwerden <b>kommen</b></i> (урок 31).","текст":"Грамматика. Вежливость — через Konjunktiv II: möchten, könnten, sollten. И косвенный вопрос: после Was glauben Sie, … глагол уходит в конец — woher Ihre Beschwerden kommen (урок 31).","ти":13,"пи":6,"подтема":"В работе врача"},{"id":"01f700809f","тема":"Разное","знак":"📎","вид":"правило","раздел":"Форма на ihr и «давайте…» (wir)","урок":"urok13","урокИмя":"Урок 14","html":"<b>«Давайте…»</b> строится как форма на Sie, только вместо Sie — <b class=\"hl\">wir</b>: глагол вперёд, потом <i>wir</i>. <i>Gehen <b>wir</b>!</i> — пойдём(те)! Врач так говорит, когда делает что-то вместе с пациентом.","текст":"«Давайте…» строится как форма на Sie, только вместо Sie — wir: глагол вперёд, потом wir. Gehen wir! — пойдём(те)! Врач так говорит, когда делает что-то вместе с пациентом.","ти":13,"пи":6,"подтема":"В работе врача"},{"id":"75ded0069a","тема":"Разное","знак":"📎","вид":"правило","раздел":"В работе врача","урок":"urok34","урокИмя":"Урок 35","html":"Прогноз, ход операции, план обследования: везде, где врач говорит о том, что будет дальше.","текст":"Прогноз, ход операции, план обследования: везде, где врач говорит о том, что будет дальше.","ти":13,"пи":6,"подтема":"В работе врача"},{"id":"d3720edf0b","тема":"Разное","знак":"📎","вид":"правило","раздел":"🩺 В работе врача","урок":"urok38","урокИмя":"Урок 39","html":"Вопросы анамнеза («лекарства, которые вы принимаете»), передача дежурства, объяснение пациенту. Придаточное может быть и в пассиве: <i>der gestern aufgenommen <b>wurde</b></i>.","текст":"Вопросы анамнеза («лекарства, которые вы принимаете»), передача дежурства, объяснение пациенту. Придаточное может быть и в пассиве: der gestern aufgenommen wurde.","ти":13,"пи":6,"подтема":"В работе врача"},{"id":"84e0ef0d7b","тема":"Разное","знак":"📎","вид":"правило","раздел":"🩺 В работе врача","урок":"urok40","урокИмя":"Урок 41","html":"Объяснить решение, предупредить о риске, дать инструкцию «если…, то…».","текст":"Объяснить решение, предупредить о риске, дать инструкцию «если…, то…».","ти":13,"пи":6,"подтема":"В работе врача"},{"id":"27e537198c","тема":"Разное","знак":"📎","вид":"правило","раздел":"🩺 В работе врача","урок":"urok41","урокИмя":"Урок 42","html":"Анамнез («ни аллергий, ни…»), варианты лечения («либо … либо»), объяснение прогноза («чем раньше …, тем …»), факторы риска («не только …, но и …»).","текст":"Анамнез («ни аллергий, ни…»), варианты лечения («либо … либо»), объяснение прогноза («чем раньше …, тем …»), факторы риска («не только …, но и …»).","ти":13,"пи":6,"подтема":"В работе врача"},{"id":"d3e530a0c4","тема":"Разное","знак":"📎","вид":"правило","раздел":"Начало: представиться","урок":"urok47","урокИмя":"Урок 48","html":"Представьтесь и назовите свою роль. То, что вы иностранец, не стыдно сказать прямо — это даже помогает: пациент начинает говорить медленнее. И сразу попросите его переспрашивать.","текст":"Представьтесь и назовите свою роль. То, что вы иностранец, не стыдно сказать прямо — это даже помогает: пациент начинает говорить медленнее. И сразу попросите его переспрашивать.","ти":13,"пи":6,"подтема":"В работе врача"},{"id":"e9783ed2a8","тема":"Разное","знак":"📎","вид":"правило","раздел":"Когда пациенту страшно","урок":"urok49","урокИмя":"Урок 50","html":"Сначала назвать чувство, потом информация. Не обесценивать («это ерунда») и не пугать. Предложить объяснить ещё раз — учебник считает это знаком уважения к пациенту.","текст":"Сначала назвать чувство, потом информация. Не обесценивать («это ерунда») и не пугать. Предложить объяснить ещё раз — учебник считает это знаком уважения к пациенту.","ти":13,"пи":6,"подтема":"В работе врача"},{"id":"b09ffa637f","тема":"Разное","знак":"📎","вид":"правило","раздел":"Звонок старшему врачу","урок":"urok50","урокИмя":"Урок 51","html":"По телефону сначала представиться и откуда вы, потом — зачем звоните. И сразу первая фраза SOAP. В учебнике доклад по телефону идёт ещё короче: только то, что старшему нужно для решения.","текст":"По телефону сначала представиться и откуда вы, потом — зачем звоните. И сразу первая фраза SOAP. В учебнике доклад по телефону идёт ещё короче: только то, что старшему нужно для решения.","ти":13,"пи":6,"подтема":"В работе врача"},{"id":"9de4db12bb","тема":"Разное","знак":"📎","вид":"правило","раздел":"⭐ Тромбоэмболия лёгочной артерии","урок":"urok58","урокИмя":"Урок 59","html":"Для флеболога — главное осложнение тромбоза. Пациент скажет: «вдруг не хватает воздуха», «колет в груди на вдохе». Herold: оценить вероятность по <b>шкале Уэллса</b> (Wells-Score); при невысокой — <b>D-Dimere</b> (отрицательные — ТЭЛА исключена), при высокой — сразу <b>CT-Angiographie</b>. Важное «Merke» книги: отсутствие видимого тромбоза ног <b>не исключает</b> эмболию.","текст":"Для флеболога — главное осложнение тромбоза. Пациент скажет: «вдруг не хватает воздуха», «колет в груди на вдохе». Herold: оценить вероятность по шкале Уэллса (Wells-Score); при невысокой — D-Dimere (отрицательные — ТЭЛА исключена), при высокой — сразу CT-Angiographie. Важное «Merke» книги: отсутствие видимого тромбоза ног не исключает эмболию.","ти":13,"пи":6,"подтема":"В работе врача"},{"id":"4583e84f9c","тема":"Разное","знак":"📎","вид":"правило","раздел":"Цвета в работе врача","урок":"urok7","урокИмя":"Урок 8","html":"Цвет кожи, слизистых, выделений — часть диагноза. Бледность — не цвет, а отдельное слово: <b>blass</b>.","текст":"Цвет кожи, слизистых, выделений — часть диагноза. Бледность — не цвет, а отдельное слово: blass.","ти":13,"пи":6,"подтема":"В работе врача"},{"id":"54428b9580","тема":"Множественное число","знак":"➕","вид":"правило","раздел":"Вся семья","урок":"polya5","урокИмя":"Занятие 5 Полины","html":"<b>Обрати внимание:</b> <i>die Geschwister</i> — это «братья и сёстры» одним словом, всегда во множественном. Такого слова в русском нет.<br>\n      Не путать: <b>Enkel/Enkelin</b> — внук/внучка, а <b>Neffe/Nichte</b> — племянник/племянница.","текст":"Обрати внимание: die Geschwister — это «братья и сёстры» одним словом, всегда во множественном. Такого слова в русском нет. Не путать: Enkel/Enkelin — внук/внучка, а Neffe/Nichte — племянник/племянница.","ти":14,"пи":0,"подтема":"Семья"},{"id":"73fdb3e933","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"Как выбрать, какой глагол ставить","урок":"dasha5","урокИмя":"Занятие 5 с Дашей","html":"Когда в предложении пропущен глагол и нужно выбрать <b>sein</b> или <b>haben</b> — сначала\n      переводим предложение на русский. Если по смыслу «<b>у меня есть</b> что-то» — это <b>haben</b>.\n      Если по смыслу «<b>я нахожусь</b> где-то» или «<b>я какой-то</b>» — это <b>sein</b>.","текст":"Когда в предложении пропущен глагол и нужно выбрать sein или haben — сначала переводим предложение на русский. Если по смыслу «у меня есть что-то» — это haben. Если по смыслу «я нахожусь где-то» или «я какой-то» — это sein.","ти":14,"пи":0,"подтема":"Семья"},{"id":"cafa65f92b","тема":"Глагол: спряжение","знак":"🔤","вид":"ловушка","раздел":"Как выбрать, какой глагол ставить","урок":"dasha5","урокИмя":"Занятие 5 с Дашей","html":"<span class=\"big\">Ловушка: «нет времени» — это haben, а не sein</span>\n      По-русски мы говорим «у меня <b>нет</b> времени» — кажется, что тут должно быть отрицание\n      через sein. На самом деле логика та же, что и с «есть»: «я <b>имею</b> ноль времени» —\n      поэтому <b>haben</b>, просто с отрицательным артиклем <b>kein</b> (см. раздел 3).","текст":"Ловушка: «нет времени» — это haben, а не sein По-русски мы говорим «у меня нет времени» — кажется, что тут должно быть отрицание через sein. На самом деле логика та же, что и с «есть»: «я имею ноль времени» — поэтому haben, просто с отрицательным артиклем kein (см. раздел 3).","ти":14,"пи":0,"подтема":"Семья"},{"id":"0ae60feea9","тема":"Разное","знак":"📎","вид":"правило","раздел":"Самочувствие, семья, работа","урок":"urok47","урокИмя":"Урок 48","html":"Вегетатика и вредные привычки — коротко. Наследственность для варикоза — ключевой вопрос. Работа — тоже: долгое стояние или сидение прямо связано с жалобами на вены.","текст":"Вегетатика и вредные привычки — коротко. Наследственность для варикоза — ключевой вопрос. Работа — тоже: долгое стояние или сидение прямо связано с жалобами на вены.","ти":14,"пи":0,"подтема":"Семья"},{"id":"66a51b1389","тема":"Разное","знак":"📎","вид":"правило","раздел":"⭐⭐ Семь техник активного слушания","урок":"urok49","урокИмя":"Урок 50","html":"Учебник называет семь приёмов «активного эмпатического слушания» — пациент чувствует, что его услышали, а врач проверяет, что понял правильно. Их отрабатывают на экзамене. Примеры — флебологические.","текст":"Учебник называет семь приёмов «активного эмпатического слушания» — пациент чувствует, что его услышали, а врач проверяет, что понял правильно. Их отрабатывают на экзамене. Примеры — флебологические.","ти":14,"пи":0,"подтема":"Семья"},{"id":"cc841d379e","тема":"Приставки","знак":"🔗","вид":"правило","раздел":"⭐⭐ Профессии: кто что делает","урок":"dasha9","урокИмя":"Занятие 9 с Дашей","html":"<b>aufräumen или putzen?</b> <i>aufräumen</i> — прибраться: разложить вещи по местам. <i>putzen</i> — убирать «по-настоящему»: мыть, чистить. <i>die Putzhilfe</i> — уборщица (die Hilfe — помощь).<br>\n      <b>kaufen — покупать, verkaufen — продавать</b>: приставка <i>ver-</i> меняет смысл, но не отделяется.<br>\n      <b>Феминитивы обязательны.</b> Гриша: «по-русски звучит дико — врачиха». Даша: в немецком женский род для профессии — норма, а мужской про женщину — <b>ошибка и невежливо</b>.","текст":"aufräumen или putzen? aufräumen — прибраться: разложить вещи по местам. putzen — убирать «по-настоящему»: мыть, чистить. die Putzhilfe — уборщица (die Hilfe — помощь). kaufen — покупать, verkaufen — продавать: приставка ver- меняет смысл, но не отделяется. Феминитивы обязательны. Гриша: «по-русски звучит дико — врачиха». Даша: в немецком женский род для профессии — норма, а мужской про женщину — ошибка и невежливо.","ти":14,"пи":1,"подтема":"Профессии"},{"id":"62d3c8dfb6","тема":"Приставки","знак":"🔗","вид":"ловушка","раздел":"⭐⭐ Профессии: кто что делает","урок":"dasha9","урокИмя":"Занятие 9 с Дашей","html":"<span class=\"big\">3. Отделяемые приставки — «всё предложение поломалось»</span>\n      У <i>auf|räumen</i> (прибираться) и <i>an|rufen</i> (звонить) приставка <b>уезжает в конец</b>: <i>Die Hausfrau <b>räumt</b> zu Hause <b>auf</b>. Die Sekretärin <b>ruft</b> viel <b>an</b>.</i> Даша: это будем проходить отдельно — пока просто запомни, что так бывает.","текст":"3. Отделяемые приставки — «всё предложение поломалось» У auf|räumen (прибираться) и an|rufen (звонить) приставка уезжает в конец: Die Hausfrau räumt zu Hause auf. Die Sekretärin ruft viel an. Даша: это будем проходить отдельно — пока просто запомни, что так бывает.","ти":14,"пи":1,"подтема":"Профессии"},{"id":"43a469606b","тема":"Глагол: спряжение","знак":"🔤","вид":"ловушка","раздел":"⭐⭐ Карта: три вида глаголов","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"<span class=\"big\">Хорошая новость</span>\n      Кучка №1 — это почти все глаголы. Кучки №2 и №3 вместе занимают 5–10%.\n      То есть выучить надо два правила и пять слов, а всё остальное работает само.","текст":"Хорошая новость Кучка №1 — это почти все глаголы. Кучки №2 и №3 вместе занимают 5–10%. То есть выучить надо два правила и пять слов, а всё остальное работает само.","ти":14,"пи":1,"подтема":"Профессии"},{"id":"993c6226d3","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"⭐⭐ Профессии: кто что делает","урок":"dasha9","урокИмя":"Занятие 9 с Дашей","html":"<b>2. arbeiten → er arbeit<u>e</u>t.</b> Если основа кончается на <b>-t</b> или <b>-d</b>, перед окончанием вставляем <b>e</b> — иначе «arbeitt» не выговорить: <i>du arbeit<b>e</b>st, er arbeit<b>e</b>t, er unterricht<b>e</b>t</i>.","текст":"2. arbeiten → er arbeitet. Если основа кончается на -t или -d, перед окончанием вставляем e — иначе «arbeitt» не выговорить: du arbeitest, er arbeitet, er unterrichtet.","ти":14,"пи":1,"подтема":"Профессии"},{"id":"859055d55a","тема":"Падежи","знак":"📦","вид":"правило","раздел":"⭐⭐ Профессии: кто что делает","урок":"dasha9","урокИмя":"Занятие 9 с Дашей","html":"<b>1. helfen меняет e → i</b> (как sprechen → spricht): <i>ich helfe, du <b>hilfst</b>, er <b>hilft</b></i>. Даша: «сначала ставим окончание, потом вспоминаем, что гласная меняется». И <b>helfen + Dativ</b> — «помогать <i>кому</i>»: <i>hilft <b>dem</b> Arzt</i> — помогает врач<b>у</b>.","текст":"1. helfen меняет e → i (как sprechen → spricht): ich helfe, du hilfst, er hilft. Даша: «сначала ставим окончание, потом вспоминаем, что гласная меняется». И helfen + Dativ — «помогать кому»: hilft dem Arzt — помогает врачу.","ти":14,"пи":1,"подтема":"Профессии"},{"id":"d3bc133fd2","тема":"Предлоги","знак":"🧭","вид":"правило","раздел":"Кто по профессии — два способа спросить","урок":"dasha5","урокИмя":"Занятие 5 с Дашей","html":"Профессию по-немецки называют через предлог <b>als</b> («как»): <i>Sie arbeitet <b>als</b> Lehrerin</i>\n      — дословно «она работает <b>как</b> учительница». Спросить об этом можно двумя способами:","текст":"Профессию по-немецки называют через предлог als («как»): Sie arbeitet als Lehrerin — дословно «она работает как учительница». Спросить об этом можно двумя способами:","ти":14,"пи":1,"подтема":"Профессии"},{"id":"6346d1d771","тема":"Разное","знак":"📎","вид":"правило","раздел":"⭐⭐ Аудирование «Beruf raten» — кто говорит?","урок":"dasha11","урокИмя":"Занятие 11 с Дашей","html":"<b>zahlen</b> — платить: <i>Kann ich gleich zahlen?</i> — можно я сразу заплачу? Даша: «хорошее слово, пригодится».<br>\n      <b>kosten</b> — стоить: <i>Die Bluse kostet 30 Euro.</i> <b>wie oft</b> — как часто, <b>täglich</b> — ежедневно, <i>dreimal täglich</i> — три раза в день.<br>\n      <b>die Reise</b> — путешествие → <b>das Reisebüro</b> — турагентство. <b>das Frühstück</b> — завтрак: внутри <i>früh</i>, «рано».<br>\n      <b>Schneider</b> — это фамилия, хотя слово значит «портной». Гриша сначала решил, что в турагентстве говорят про портного.","текст":"zahlen — платить: Kann ich gleich zahlen? — можно я сразу заплачу? Даша: «хорошее слово, пригодится». kosten — стоить: Die Bluse kostet 30 Euro. wie oft — как часто, täglich — ежедневно, dreimal täglich — три раза в день. die Reise — путешествие → das Reisebüro — турагентство. das Frühstück — завтрак: внутри früh, «рано». Schneider — это фамилия, хотя слово значит «портной». Гриша сначала решил, что в турагентстве говорят про портного.","ти":14,"пи":1,"подтема":"Профессии"},{"id":"b4d4c72ada","тема":"Разное","знак":"📎","вид":"ловушка","раздел":"Профессии из учебника (стр. 14–15)","урок":"dasha8","урокИмя":"Занятие 8 с Дашей","html":"<span class=\"big\">der Kellner — официант, не повар</span>\n      Гриша перевёл <i>Kellner</i> как «повар» — Даша поправила: <i>der Kellner</i> работает в ресторане и приносит еду, это <b>официант</b>. Повар — <b>der Koch, die Köchin</b> (последняя карточка выше).","текст":"der Kellner — официант, не повар Гриша перевёл Kellner как «повар» — Даша поправила: der Kellner работает в ресторане и приносит еду, это официант. Повар — der Koch, die Köchin (последняя карточка выше).","ти":14,"пи":1,"подтема":"Профессии"},{"id":"b48122254b","тема":"Разное","знак":"📎","вид":"правило","раздел":"🎧 Кристиану звонят","урок":"polya17","урокИмя":"Занятие 17 Полины","html":"b) Они хотят говорить не с фрау Эзебек — она сегодня во Франкфурте, — а <b>с Кристианом</b>: ключ есть и у него.<br>\n      d) Прямо в тексте не сказано, но Кристиан в конце вздыхает — работать у озера неудобно.","текст":"b) Они хотят говорить не с фрау Эзебек — она сегодня во Франкфурте, — а с Кристианом: ключ есть и у него. d) Прямо в тексте не сказано, но Кристиан в конце вздыхает — работать у озера неудобно.","ти":14,"пи":1,"подтема":"Профессии"},{"id":"972d22ad33","тема":"Множественное число","знак":"➕","вид":"ловушка","раздел":"🛋 В мебельном магазине","урок":"polya12","урокИмя":"Занятие 12 Полины","html":"<span class=\"big\">die Möbel — всегда множественное</span>\n      По-русски «мебель» — одно слово в единственном числе. По-немецки <b>die Möbel</b> — множественное: <i>Die Möbel <b>sind</b> neu</i> — «мебель новая», глагол во множественном. Один предмет мебели — <i>das Möbelstück</i>.","текст":"die Möbel — всегда множественное По-русски «мебель» — одно слово в единственном числе. По-немецки die Möbel — множественное: Die Möbel sind neu — «мебель новая», глагол во множественном. Один предмет мебели — das Möbelstück.","ти":14,"пи":2,"подтема":"Еда, напитки, кафе"},{"id":"6f7368d269","тема":"Артикли и род","знак":"🎨","вид":"ловушка","раздел":"🖼 Описание картинки: кафе","урок":"polya11","урокИмя":"Занятие 11 Полины","html":"<span class=\"big\">die Wand — женского рода</span>\n      Полина сказала «auf dem Wand» — Даша поправила: стена <b>die Wand</b>, женский род. Поэтому «на стене» — <b>an der Wand</b>. И предлог другой: на вертикальной поверхности (стена) — <b>an</b>, на горизонтальной (стол) — <b>auf</b>.","текст":"die Wand — женского рода Полина сказала «auf dem Wand» — Даша поправила: стена die Wand, женский род. Поэтому «на стене» — an der Wand. И предлог другой: на вертикальной поверхности (стена) — an, на горизонтальной (стол) — auf.","ти":14,"пи":2,"подтема":"Еда, напитки, кафе"},{"id":"583f08cd7f","тема":"Артикли и род","знак":"🎨","вид":"ловушка","раздел":"🥖 Еда и напитки","урок":"polya14","урокИмя":"Занятие 14 Полины","html":"<span class=\"big\">Три рода, которые перепутались</span>\n      • <s>der Wasser</s> → <b>das Wasser</b> (вода — средний род)<br>\n      • <s>das Tee</s> → <b>der Tee</b> (чай — мужской, «как и в русском: он, чай»)<br>\n      • <b>der Kaffee</b> — кофе тоже мужской. Даша сама сказала «дер кафе».","текст":"Три рода, которые перепутались • der Wasser → das Wasser (вода — средний род) • das Tee → der Tee (чай — мужской, «как и в русском: он, чай») • der Kaffee — кофе тоже мужской. Даша сама сказала «дер кафе».","ти":14,"пи":2,"подтема":"Еда, напитки, кафе"},{"id":"535d70098b","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"☕ Разговор про завтрак","урок":"polya14","урокИмя":"Занятие 14 Полины","html":"<b>mit Milch, ohne Zucker — без артикля.</b> Даша: «можно сказать mit Milch без артикля. Если с артиклем, то женский род — <i>mit der Milch</i>. Но мы можем опустить артикль, потому что просто говорим». Так же <i>ohne Zucker</i>.<br>\n      <b>Ich liebe frühstücken</b> — так по-немецки не говорят. Даша: «можно сказать <i>Ich esse zum Frühstück gern …</i>». Вместо «люблю» — <b>gern</b>.","текст":"mit Milch, ohne Zucker — без артикля. Даша: «можно сказать mit Milch без артикля. Если с артиклем, то женский род — mit der Milch. Но мы можем опустить артикль, потому что просто говорим». Так же ohne Zucker. Ich liebe frühstücken — так по-немецки не говорят. Даша: «можно сказать Ich esse zum Frühstück gern …». Вместо «люблю» — gern.","ти":14,"пи":2,"подтема":"Еда, напитки, кафе"},{"id":"e26667197e","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"⭐ Текст: каждое утро в том же кафе","урок":"polya20","урокИмя":"Занятие 20 Полины","html":"• <b>das Café</b> (кафе, место) ≠ <b>der Kaffee</b> (напиток). Поэтому <i>in <b>dasselbe</b> Café</i>, но <i>ich trinke <b>denselben</b> Kaffee</i>: пью что? — Akkusativ мужского рода → <i>den</i>selbe<i>n</i>.<br>\n      • <i>das Brötchen</i> — средний род, а в Akkusativ средний не меняется: <b>dasselbe</b> Brötchen, без <i>-n</i>.<br>\n      • <i>Es ist <b>dieselbe</b> Frau, die ich gestern gesehen habe</i> — та же самая женщина, которую я вчера видела.<br>\n      • <b>Derjenige</b>, der ein Buch liest, ist mein Nachbar — тот, кто читает книгу, — мой сосед.<br>\n      • <i>Ich mag <b>diejenigen</b>, die höflich sind</i> — мне нравятся те, кто вежлив. Полина сначала поставила <i>dieselbe</i>, но это «те же самые», а нужны просто «те». <b>höflich</b> — вежливый, «хорошее слово».<br>\n      • <b>letzte Woche</b> — на прошлой неделе; <b>diese Woche</b> — на этой.","текст":"• das Café (кафе, место) ≠ der Kaffee (напиток). Поэтому in dasselbe Café, но ich trinke denselben Kaffee: пью что? — Akkusativ мужского рода → denselben. • das Brötchen — средний род, а в Akkusativ средний не меняется: dasselbe Brötchen, без -n. • Es ist dieselbe Frau, die ich gestern gesehen habe — та же самая женщина, которую я вчера видела. • Derjenige, der ein Buch liest, ist mein Nachbar — тот, кто читает книгу, — мой сосед. • Ich mag diejenigen, die höflich sind — мне нравятся те, кто вежлив. Полина сначала поставила dieselbe, но это «те же самые», а нужны просто «те». höflich — вежливый, «хорошее слово». • letzte Woche — на прошлой неделе; diese Woche — на этой.","ти":14,"пи":2,"подтема":"Еда, напитки, кафе"},{"id":"73e5eed04e","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"Еда — учи сразу с артиклем","урок":"urok14","урокИмя":"Урок 15","html":"Как в уроке 9 (части тела): артикль подсвечен цветом и полоской слева, чтобы род запоминался <b>глазами</b>, а не зубрёжкой. Существительное без артикля — выученное наполовину.","текст":"Как в уроке 9 (части тела): артикль подсвечен цветом и полоской слева, чтобы род запоминался глазами, а не зубрёжкой. Существительное без артикля — выученное наполовину.","ти":14,"пи":2,"подтема":"Еда, напитки, кафе"},{"id":"faa2d2b957","тема":"Порядок слов","знак":"📐","вид":"правило","раздел":"⭐ Reisen: в отеле, завтрак, телефон","урок":"polya20","урокИмя":"Занятие 20 Полины","html":"<b>das Gespräch</b> — разговор (от <i>sprechen</i>). <b>eine Frage stellen</b> — задать вопрос («поставить вопрос»). <b>Welches Fragewort passt?</b> — какое вопросительное слово подходит?","текст":"das Gespräch — разговор (от sprechen). eine Frage stellen — задать вопрос («поставить вопрос»). Welches Fragewort passt? — какое вопросительное слово подходит?","ти":14,"пи":2,"подтема":"Еда, напитки, кафе"},{"id":"e44461fb39","тема":"Общение и обращение","знак":"💬","вид":"ловушка","раздел":"В кафе: заказать и заплатить","урок":"urok14","урокИмя":"Урок 15","html":"<span class=\"big\">Два немецких обычая</span>\n      1️⃣ Официант спросит <b>Zusammen oder getrennt?</b> — платите вместе или каждый за себя. Раздельно — совершенно нормально.<br>\n      2️⃣ <b>Чаевые</b> — 5–10%, их не оставляют на столе, а называют сумму вслух с округлением. Или просто говорят <b>Stimmt so</b> — «сдачи не надо».<br>\n      <b>Ich hätte gern…</b> — самое вежливое «мне, пожалуйста». Как <i>Könnten Sie</i> из урока 13 — запомни целиком.","текст":"Два немецких обычая 1️⃣ Официант спросит Zusammen oder getrennt? — платите вместе или каждый за себя. Раздельно — совершенно нормально. 2️⃣ Чаевые — 5–10%, их не оставляют на столе, а называют сумму вслух с округлением. Или просто говорят Stimmt so — «сдачи не надо». Ich hätte gern… — самое вежливое «мне, пожалуйста». Как Könnten Sie из урока 13 — запомни целиком.","ти":14,"пи":2,"подтема":"Еда, напитки, кафе"},{"id":"1ea671ef3d","тема":"Произношение и письмо","знак":"🗣","вид":"ловушка","раздел":"🍽 Посуда и столовые приборы","урок":"polya11","урокИмя":"Занятие 11 Полины","html":"<span class=\"big\">Ловушки и подсказки</span>\n      <b>die Schüssel</b> (миска) и <b>der Schlüssel</b> (ключ) — одна буква разницы. Даша сама сказала: «потом будете путаться».<br>\n      <b>der Wein</b> [вайн] — вино, а <b>Wien</b> [вин] — Вена. Помним правило чтения: <b>ei</b> читается [ай], <b>ie</b> — [и].<br>\n      <b>das Wischtuch</b> = <i>wischen</i> (вытирать) + <i>das Tuch</i> (ткань) — тряпка для вытирания.<br>\n      <b>der Pfannkuchen</b> = <i>die Pfanne</i> (сковорода) + <i>der Kuchen</i> (пирог) — «пирог со сковородки», то есть блин.<br>\n      Запоминалки с занятия: <b>das Messer</b> — нож, «чтобы резать мясо»; <b>der Topf</b> звучит как <i>Kopf</i> (голова); у <b>die Gabel</b> «вилочный вайб».","текст":"Ловушки и подсказки die Schüssel (миска) и der Schlüssel (ключ) — одна буква разницы. Даша сама сказала: «потом будете путаться». der Wein [вайн] — вино, а Wien [вин] — Вена. Помним правило чтения: ei читается [ай], ie — [и]. das Wischtuch = wischen (вытирать) + das Tuch (ткань) — тряпка для вытирания. der Pfannkuchen = die Pfanne (сковорода) + der Kuchen (пирог) — «пирог со сковородки», то есть блин. Запоминалки с занятия: das Messer — нож, «чтобы резать мясо»; der Topf звучит как Kopf (голова); у die Gabel «вилочный вайб».","ти":14,"пи":2,"подтема":"Еда, напитки, кафе"},{"id":"05d095f85f","тема":"Устойчивые выражения","знак":"🔗","вид":"правило","раздел":"⭐ Reisen: в отеле, завтрак, телефон","урок":"polya20","урокИмя":"Занятие 20 Полины","html":"<b>die Empfangsdame</b> — администратор на ресепшене. От глагола <b>empfangen</b> — принимать, встречать (<i>der Empfang</i> — ресепшен, приём). Дословно «принимающая дама».<br>\n      <b>Wähle richtig aus</b> — выбери правильное (<i>auswählen</i> — выбирать).<br>\n      Ответ — <b>Guten Abend</b>: в 18 часов уже вечер. <i>Warum? — Weil es Abend ist.</i>","текст":"die Empfangsdame — администратор на ресепшене. От глагола empfangen — принимать, встречать (der Empfang — ресепшен, приём). Дословно «принимающая дама». Wähle richtig aus — выбери правильное (auswählen — выбирать). Ответ — Guten Abend: в 18 часов уже вечер. Warum? — Weil es Abend ist.","ти":14,"пи":2,"подтема":"Еда, напитки, кафе"},{"id":"269409f6e7","тема":"Устойчивые выражения","знак":"🔗","вид":"правило","раздел":"⭐ Reisen: в отеле, завтрак, телефон","урок":"polya20","урокИмя":"Занятие 20 Полины","html":"<b>prüfen</b> — проверять (запишите!). <b>Bring die Wörter in die richtige Reihenfolge</b> — дословно «принеси слова в правильную последовательность», то есть расставь по порядку. <i>bringen</i> — приносить, <i>die Reihenfolge</i> — порядок.","текст":"prüfen — проверять (запишите!). Bring die Wörter in die richtige Reihenfolge — дословно «принеси слова в правильную последовательность», то есть расставь по порядку. bringen — приносить, die Reihenfolge — порядок.","ти":14,"пи":2,"подтема":"Еда, напитки, кафе"},{"id":"7b9ea809c6","тема":"Устойчивые выражения","знак":"🔗","вид":"правило","раздел":"⭐ Reisen: в отеле, завтрак, телефон","урок":"polya20","урокИмя":"Занятие 20 Полины","html":"<b>der Bekannte, die Bekannten</b> — знакомый, знакомые (от <i>kennen</i> — знать). <b>bitten um</b> — просить о чём-то. <b>in der Nähe</b> — поблизости, рядом — устойчивое выражение: <i>Balaschicha ist in der Nähe von Moskau</i>. <b>die Lücke</b> — пропуск.<br>\n      <b>Немцы диктуют номер парами:</b> <i>vierundachtzig — siebenunddreißig — null neun</i> = <b>84 37 09</b>. Полина сначала записала «00», потом «99» — <i>null neun</i> это 0 и 9.","текст":"der Bekannte, die Bekannten — знакомый, знакомые (от kennen — знать). bitten um — просить о чём-то. in der Nähe — поблизости, рядом — устойчивое выражение: Balaschicha ist in der Nähe von Moskau. die Lücke — пропуск. Немцы диктуют номер парами: vierundachtzig — siebenunddreißig — null neun = 84 37 09. Полина сначала записала «00», потом «99» — null neun это 0 и 9.","ти":14,"пи":2,"подтема":"Еда, напитки, кафе"},{"id":"27b779d33a","тема":"Разное","знак":"📎","вид":"правило","раздел":"🍽 Посуда и столовые приборы","урок":"polya11","урокИмя":"Занятие 11 Полины","html":"Два слова-зонтика. <b>das Geschirr</b> — вся посуда: тарелки, чашки, кастрюли. <b>das Besteck</b> — столовые приборы: ложки, вилки, ножи.","текст":"Два слова-зонтика. das Geschirr — вся посуда: тарелки, чашки, кастрюли. das Besteck — столовые приборы: ложки, вилки, ножи.","ти":14,"пи":2,"подтема":"Еда, напитки, кафе"},{"id":"9bd9fcc17f","тема":"Разное","знак":"📎","вид":"правило","раздел":"⭐ Reisen: в отеле, завтрак, телефон","урок":"polya20","урокИмя":"Занятие 20 Полины","html":"Даша: немцы говорят про половину <b>так же, как мы</b>: <i>halb sieben</i> — «пол-седьмого» = 6:30, <i>halb zehn</i> — пол-десятого = 9:30. Не «половина после семи»!","текст":"Даша: немцы говорят про половину так же, как мы: halb sieben — «пол-седьмого» = 6:30, halb zehn — пол-десятого = 9:30. Не «половина после семи»!","ти":14,"пи":2,"подтема":"Еда, напитки, кафе"},{"id":"6acd1b3e00","тема":"Множественное число","знак":"➕","вид":"ловушка","раздел":"🗂 Мебель и комната","урок":"polya10","урокИмя":"Занятие 10 Полины","html":"<span class=\"big\">das Kissen не меняется во множественном числе</span>\n      <b>das Kissen → die Kissen</b> — слово остаётся тем же самым, меняется только артикль. Как и <b>das Zimmer</b> с занятия 8.","текст":"das Kissen не меняется во множественном числе das Kissen → die Kissen — слово остаётся тем же самым, меняется только артикль. Как и das Zimmer с занятия 8.","ти":14,"пи":3,"подтема":"Дом и квартира"},{"id":"f6d7354288","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"Дом и квартира","урок":"urok15","урокИмя":"Урок 16","html":"Как всегда — <b>сразу с артиклем</b>, род подсвечен цветом и полоской слева. Обрати внимание на пару <i>der Stock</i> / <i>die Etage</i>: это одно и то же (этаж), просто первое немецкое, второе из французского. В объявлениях встретишь оба.","текст":"Как всегда — сразу с артиклем, род подсвечен цветом и полоской слева. Обрати внимание на пару der Stock / die Etage: это одно и то же (этаж), просто первое немецкое, второе из французского. В объявлениях встретишь оба.","ти":14,"пи":3,"подтема":"Дом и квартира"},{"id":"54347451cf","тема":"Разное","знак":"📎","вид":"правило","раздел":"🗂 Мебель и комната","урок":"polya10","урокИмя":"Занятие 10 Полины","html":"<b>der Schreibtisch</b> — «письменный стол», буквально «стол для письма»: <b>schreiben</b> (писать) + <b>Tisch</b> (стол). Так в немецком часто устроены сложные слова — последнее слово в цепочке главное, оно и определяет род.","текст":"der Schreibtisch — «письменный стол», буквально «стол для письма»: schreiben (писать) + Tisch (стол). Так в немецком часто устроены сложные слова — последнее слово в цепочке главное, оно и определяет род.","ти":14,"пи":3,"подтема":"Дом и квартира"},{"id":"a4f1d19416","тема":"Разное","знак":"📎","вид":"правило","раздел":"Комнаты","урок":"urok15","урокИмя":"Урок 16","html":"Здесь работает конструктор: <b class=\"hl\">Zimmer</b> = комната, и почти все названия — это «что-делать-комната». <i>wohnen</i> (жить) + Zimmer = <b>Wohnzimmer</b> (гостиная), <i>schlafen</i> (спать) + Zimmer = <b>Schlafzimmer</b> (спальня), <i>Arbeit</i> (работа) → <b>Arbeitszimmer</b> (кабинет). Все они <b class=\"hl\">das</b>, потому что род даёт последнее слово — <i>das Zimmer</i>.","текст":"Здесь работает конструктор: Zimmer = комната, и почти все названия — это «что-делать-комната». wohnen (жить) + Zimmer = Wohnzimmer (гостиная), schlafen (спать) + Zimmer = Schlafzimmer (спальня), Arbeit (работа) → Arbeitszimmer (кабинет). Все они das, потому что род даёт последнее слово — das Zimmer.","ти":14,"пи":3,"подтема":"Дом и квартира"},{"id":"d2a8b14612","тема":"Разное","знак":"📎","вид":"ловушка","раздел":"Мебель и техника","урок":"urok15","урокИмя":"Урок 16","html":"<span class=\"big\">Ловушка: в квартире может не быть кухни ВООБЩЕ</span>\n      В Германии квартиру часто сдают с голыми стенами на кухне — ни плиты, ни шкафов, ни раковины: прежний жилец увёз свою кухню с собой. Ищи в объявлении <b>Einbauküche</b> (сокращённо <b>EBK</b>) — «встроенная кухня». Нет этого слова — готовься покупать кухню сам.","текст":"Ловушка: в квартире может не быть кухни ВООБЩЕ В Германии квартиру часто сдают с голыми стенами на кухне — ни плиты, ни шкафов, ни раковины: прежний жилец увёз свою кухню с собой. Ищи в объявлении Einbauküche (сокращённо EBK) — «встроенная кухня». Нет этого слова — готовься покупать кухню сам.","ти":14,"пи":3,"подтема":"Дом и квартира"},{"id":"c8771765fc","тема":"Приставки","знак":"🔗","вид":"правило","раздел":"⭐ Ситуации к фото: S-Bahn, Gleis, abholen","урок":"polya19","урокИмя":"Занятие 19 Полины","html":"<b>abfahren</b> — отъезжать, отправляться: <i>Wo fährt der Zug nach München <b>ab</b>?</i> Приставка <i>ab-</i> уходит в конец — это <b>отделяемая приставка</b>, следующая большая тема. Полина: «я только сегодня думала, когда же мы их будем проходить — какой кошмар!»<br>\n      <b>abholen</b> — забирать (кого-то или что-то): посылку с почты, человека из аэропорта.<br>\n      <b>das Gleis</b> — путь (рельсы): <i>Gleis zehn</i> — десятый путь.<br>\n      Фото 3 — <b>die Touristeninformation</b>, туристическая справочная со «шальтером».","текст":"abfahren — отъезжать, отправляться: Wo fährt der Zug nach München ab? Приставка ab- уходит в конец — это отделяемая приставка, следующая большая тема. Полина: «я только сегодня думала, когда же мы их будем проходить — какой кошмар!» abholen — забирать (кого-то или что-то): посылку с почты, человека из аэропорта. das Gleis — путь (рельсы): Gleis zehn — десятый путь. Фото 3 — die Touristeninformation, туристическая справочная со «шальтером».","ти":14,"пи":4,"подтема":"Транспорт и поездки"},{"id":"6084f8567f","тема":"Падежи","знак":"📦","вид":"правило","раздел":"Как пройти: направления","урок":"urok17","урокИмя":"Урок 18","html":"В огромной немецкой клинике тебя будут спрашивать дорогу с первого дня. Здесь <b>nach</b> значит «в сторону»: <i>nach links, nach rechts, nach oben</i>. А этаж — это «куда», значит Akkusativ: <i>in <b>den</b> dritten Stock</i> (и помни сдвиг этажей из урока 15).","текст":"В огромной немецкой клинике тебя будут спрашивать дорогу с первого дня. Здесь nach значит «в сторону»: nach links, nach rechts, nach oben. А этаж — это «куда», значит Akkusativ: in den dritten Stock (и помни сдвиг этажей из урока 15).","ти":14,"пи":4,"подтема":"Транспорт и поездки"},{"id":"0a2b943eee","тема":"Разное","знак":"📎","вид":"правило","раздел":"Транспорт и путешествия","урок":"polya18","урокИмя":"Занятие 18 Полины","html":"<b>das Gepäck</b> — багаж, от <i>packen</i> — паковать.<br>\n      <b>die U-Bahn</b> — метро: <i>die Bahn</i> — путь, дорога; <b>U</b> — <i>Untergrund</i>, под землёй.<br>\n      <b>die Straßenbahn</b> — трамвай: «дорога по улице» (Полина сначала подумала «электричка»).<br>\n      <b>der Bahnsteig</b> — платформа: <i>Bahn</i> + <i>steigen</i> — подниматься.<br>\n      <b>die Haltestelle</b> — остановка. Даша: «очень полезное слово для жизни в Австрии и Германии».","текст":"das Gepäck — багаж, от packen — паковать. die U-Bahn — метро: die Bahn — путь, дорога; U — Untergrund, под землёй. die Straßenbahn — трамвай: «дорога по улице» (Полина сначала подумала «электричка»). der Bahnsteig — платформа: Bahn + steigen — подниматься. die Haltestelle — остановка. Даша: «очень полезное слово для жизни в Австрии и Германии».","ти":14,"пи":4,"подтема":"Транспорт и поездки"},{"id":"20d5e020fc","тема":"Разное","знак":"📎","вид":"правило","раздел":"Транспорт и путешествия","урок":"polya18","урокИмя":"Занятие 18 Полины","html":"Оба — «расти», но по-разному. <b>wachsen</b> — расти, становиться больше (ребёнок, дерево). <b>steigen</b> — подниматься вверх: <i>Die Preise steigen</i> — цены растут (поднимаются).","текст":"Оба — «расти», но по-разному. wachsen — расти, становиться больше (ребёнок, дерево). steigen — подниматься вверх: Die Preise steigen — цены растут (поднимаются).","ти":14,"пи":4,"подтема":"Транспорт и поездки"},{"id":"26146a1c9b","тема":"Артикли и род","знак":"🎨","вид":"ловушка","раздел":"Национальности","урок":"dasha8","урокИмя":"Занятие 8 с Дашей","html":"<span class=\"big\">Немец — исключение</span>\n      <i>der Deutsche → die Deutsche</i> — меняется только артикль, никакого -in. Даша: «все, кроме Deutsche, подчиняются правилу».","текст":"Немец — исключение der Deutsche → die Deutsche — меняется только артикль, никакого -in. Даша: «все, кроме Deutsche, подчиняются правилу».","ти":14,"пи":5,"подтема":"Страны и национальности"},{"id":"f22a6db45f","тема":"Разное","знак":"📎","вид":"правило","раздел":"Национальности","урок":"dasha8","урокИмя":"Занятие 8 с Дашей","html":"Тот же суффикс <b>-in</b>. На <b>-er</b> — просто добавляем: <i>der Italiener → die Italiener<b>in</b></i>. На <b>-e</b> — <i>e</i> выпадает: <i>der Russ<b>e</b> → die Russ<b>in</b></i>, <i>der Franzos<b>e</b> → die Franz<b>ö</b>sin</i> (ещё и умляут).","текст":"Тот же суффикс -in. На -er — просто добавляем: der Italiener → die Italienerin. На -e — e выпадает: der Russe → die Russin, der Franzose → die Französin (ещё и умляут).","ти":14,"пи":5,"подтема":"Страны и национальности"},{"id":"a889d7a04e","тема":"Разное","знак":"📎","вид":"правило","раздел":"Текст: зачем она учит языки","урок":"polya7","урокИмя":"Занятие 7 Полины","html":"<b class=\"hl\">schön</b> — это не только «красиво» про предмет. Про ситуацию это «классно, здорово»: <i>Das ist so schön…</i> — «это так здорово…».<br><br>\n      <b class=\"hl\">wenn</b> = «когда» и «если» одновременно. <b class=\"hl\">verstehen</b> = понимать. <b class=\"hl\">vor allem</b> = прежде всего.","текст":"schön — это не только «красиво» про предмет. Про ситуацию это «классно, здорово»: Das ist so schön… — «это так здорово…». wenn = «когда» и «если» одновременно. verstehen = понимать. vor allem = прежде всего.","ти":14,"пи":5,"подтема":"Страны и национальности"},{"id":"f3ef84ccf2","тема":"Множественное число","знак":"➕","вид":"правило","раздел":"Цвета (die Farbe)","урок":"dasha1","урокИмя":"Занятие 1 с Дашей","html":"Слово «цвет» — <b class=\"hl\">die Farbe</b> (женский род), множественное <b class=\"hl\">die Farben</b>. Но это <b>не</b> общее правило: множественное число в немецком — отдельная сложная тема с кучей окончаний.<br><br>\n      <b>Не путать:</b> <i>gelb</i> (жёлтый) ≠ <i>Geld</i> (деньги).<br>\n      <b>Мнемоника:</b> Schwarzkopf = <i>schwarz</i> + <i>Kopf</i> = «чёрная голова» (отсюда и эмблема).","текст":"Слово «цвет» — die Farbe (женский род), множественное die Farben. Но это не общее правило: множественное число в немецком — отдельная сложная тема с кучей окончаний. Не путать: gelb (жёлтый) ≠ Geld (деньги). Мнемоника: Schwarzkopf = schwarz + Kopf = «чёрная голова» (отсюда и эмблема).","ти":14,"пи":6,"подтема":"Погода, цвета, внешность, характер"},{"id":"31db510393","тема":"Прошедшее время","знак":"⏮","вид":"правило","раздел":"Какая была погода","урок":"urok16","урокИмя":"Урок 17","html":"Погодные глаголы в Perfekt (урок 12) — всегда с <b class=\"hl\">haben</b>: <i>es <b>hat</b> geregnet</i>, <i>es <b>hat</b> geschneit</i>. А «было жарко / холодно» — короче, через <b class=\"hl\">war</b>: <i>Es <b>war</b> heiß</i>.","текст":"Погодные глаголы в Perfekt (урок 12) — всегда с haben: es hat geregnet, es hat geschneit. А «было жарко / холодно» — короче, через war: Es war heiß.","ти":14,"пи":6,"подтема":"Погода, цвета, внешность, характер"},{"id":"868db8df2b","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"Явления — с артиклями","урок":"urok16","урокИмя":"Урок 17","html":"Полезная закономерность: почти вся «мужская» погода — <b class=\"hl\">der</b> (Regen, Schnee, Wind, Nebel, Sturm). Из женского — <i>die Sonne</i>, <i>die Wolke</i>, и две важные для тебя: <b>die Hitze</b> (жара) и <b>die Kälte</b> (холод).","текст":"Полезная закономерность: почти вся «мужская» погода — der (Regen, Schnee, Wind, Nebel, Sturm). Из женского — die Sonne, die Wolke, и две важные для тебя: die Hitze (жара) и die Kälte (холод).","ти":14,"пи":6,"подтема":"Погода, цвета, внешность, характер"},{"id":"bad1b4f8d0","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"Артикль = цвет","урок":"urok9","урокИмя":"Урок 10","html":"Каждое существительное учи <b>сразу с артиклем</b> — это его род. Здесь артикль подсвечен цветом и полоской слева у карточки, чтобы запоминалось глазами:","текст":"Каждое существительное учи сразу с артиклем — это его род. Здесь артикль подсвечен цветом и полоской слева у карточки, чтобы запоминалось глазами:","ти":14,"пи":6,"подтема":"Погода, цвета, внешность, характер"},{"id":"0fd3b67fb0","тема":"Произношение и письмо","знак":"🗣","вид":"правило","раздел":"«Какого цвета?» — Welche Farbe?","урок":"urok7","урокИмя":"Урок 8","html":"Вопрос: <b>Welche Farbe ist das?</b> — какого это цвета? или <b>Welche Farbe hat …?</b> — какого цвета …? Ответ: <i>Das ist rot · Der Apfel ist grün</i>. После <i>ist</i> цвет <b>не меняется</b>.<br><br>\n      Цвет как название — с большой буквы: <i>Meine Lieblingsfarbe ist <b>Blau</b></i>.","текст":"Вопрос: Welche Farbe ist das? — какого это цвета? или Welche Farbe hat …? — какого цвета …? Ответ: Das ist rot · Der Apfel ist grün. После ist цвет не меняется. Цвет как название — с большой буквы: Meine Lieblingsfarbe ist Blau.","ти":14,"пи":6,"подтема":"Погода, цвета, внешность, характер"},{"id":"6a03a0e7a0","тема":"Слова, которые путают","знак":"⚠️","вид":"правило","раздел":"Основные цвета","урок":"urok7","урокИмя":"Урок 8","html":"Одиннадцать цветов, которых хватит почти на всё. <b>lila</b> (фиолетовый) и <b>rosa</b> (розовый) никогда не меняются — даже перед словом.","текст":"Одиннадцать цветов, которых хватит почти на всё. lila (фиолетовый) и rosa (розовый) никогда не меняются — даже перед словом.","ти":14,"пи":6,"подтема":"Погода, цвета, внешность, характер"},{"id":"1d7b864c66","тема":"Устойчивые выражения","знак":"🔗","вид":"правило","раздел":"Выражения с цветами","урок":"urok7","урокИмя":"Урок 8","html":"Здесь цвет значит совсем не то, что по-русски. <b class=\"hl\">blau sein</b> — не «грустить», а <b>быть пьяным</b>. <i>schwarz fahren</i> — ехать зайцем.","текст":"Здесь цвет значит совсем не то, что по-русски. blau sein — не «грустить», а быть пьяным. schwarz fahren — ехать зайцем.","ти":14,"пи":6,"подтема":"Погода, цвета, внешность, характер"},{"id":"8a4947602d","тема":"Разное","знак":"📎","вид":"правило","раздел":"⚠️ Главное: у погоды всегда есть подлежащее «es»","урок":"urok16","урокИмя":"Урок 17","html":"Спросить погоду — двумя способами: <b>Wie ist das Wetter?</b> (какая сейчас) и <b>Wie wird das Wetter?</b> (какая будет). Разницу между <i>ist</i> и <i>wird</i> разберём в разделе 8.","текст":"Спросить погоду — двумя способами: Wie ist das Wetter? (какая сейчас) и Wie wird das Wetter? (какая будет). Разницу между ist и wird разберём в разделе 8.","ти":14,"пи":6,"подтема":"Погода, цвета, внешность, характер"},{"id":"b5a90bf7ed","тема":"Разное","знак":"📎","вид":"ловушка","раздел":"⚠️ Главное: у погоды всегда есть подлежащее «es»","урок":"urok16","урокИмя":"Урок 17","html":"<span class=\"big\">По-русски «холодно» — одно слово. По-немецки так нельзя</span>\n      В немецком предложении <b>обязано быть подлежащее</b>, даже когда действующего лица нет. Эту пустую роль занимает <b class=\"hl\">es</b> (буквально «оно»):<br><br>\n      Холодно → <b>Es ist kalt.</b> &nbsp;·&nbsp; Идёт дождь → <b>Es regnet.</b> &nbsp;·&nbsp; Идёт снег → <b>Es schneit.</b><br><br>\n      Сказать просто «Ist kalt» — грубая ошибка, сразу выдаёт иностранца. Запомни как формулу: <b>погода = es + глагол</b>.","текст":"По-русски «холодно» — одно слово. По-немецки так нельзя В немецком предложении обязано быть подлежащее, даже когда действующего лица нет. Эту пустую роль занимает es (буквально «оно»): Холодно → Es ist kalt. &nbsp;·&nbsp; Идёт дождь → Es regnet. &nbsp;·&nbsp; Идёт снег → Es schneit. Сказать просто «Ist kalt» — грубая ошибка, сразу выдаёт иностранца. Запомни как формулу: погода = es + глагол.","ти":14,"пи":6,"подтема":"Погода, цвета, внешность, характер"},{"id":"0252b488fe","тема":"Разное","знак":"📎","вид":"правило","раздел":"Три погодных глагола","урок":"urok16","урокИмя":"Урок 17","html":"Особенность: они <b class=\"hl\">спрягаются только в одном лице</b> — с <i>es</i>. Никаких «я дождю» не бывает, поэтому учить надо ровно одну форму каждого. Самые лёгкие глаголы за весь курс.","текст":"Особенность: они спрягаются только в одном лице — с es. Никаких «я дождю» не бывает, поэтому учить надо ровно одну форму каждого. Самые лёгкие глаголы за весь курс.","ти":14,"пи":6,"подтема":"Погода, цвета, внешность, характер"},{"id":"c31810415d","тема":"Разное","знак":"📎","вид":"правило","раздел":"Оттенки: hell- (светлый) и dunkel- (тёмный)","урок":"urok7","урокИмя":"Урок 8","html":"Приставь <b>hell-</b> или <b>dunkel-</b> прямо к цвету, <b class=\"hl\">одним словом</b>: <i>hellblau</i> — светло-синий, <i>dunkelgrün</i> — тёмно-зелёный.","текст":"Приставь hell- или dunkel- прямо к цвету, одним словом: hellblau — светло-синий, dunkelgrün — тёмно-зелёный.","ти":14,"пи":6,"подтема":"Погода, цвета, внешность, характер"},{"id":"5c3cda1b37","тема":"Разное","знак":"📎","вид":"правило","раздел":"Цвет перед словом","урок":"urok7","урокИмя":"Урок 8","html":"После <i>ist</i> — без окончания: <i>Die Tablette ist weiß</i>. А <b class=\"hl\">перед существительным</b> цвет получает окончание: <i>die weiß<b>e</b> Tablette, ein rot<b>es</b> Auto</i>. Окончания прилагательных — большая тема, она будет позже; пока просто узнавай на слух.","текст":"После ist — без окончания: Die Tablette ist weiß. А перед существительным цвет получает окончание: die weiße Tablette, ein rotes Auto. Окончания прилагательных — большая тема, она будет позже; пока просто узнавай на слух.","ти":14,"пи":6,"подтема":"Погода, цвета, внешность, характер"},{"id":"f040275db7","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"Прогноз: что будет завтра","урок":"urok16","урокИмя":"Урок 17","html":"Будущее время в разговорной погоде делается глаголом <b class=\"hl\">werden</b> = «становиться»: <i>Morgen <b>wird</b> es kalt</i> — «завтра станет холодно».<br><br>\n      Это тот самый <i>werden</i>, который Полина проходила у Даши в списке глаголов-исключений. Пока достаточно запомнить одну форму — <b>wird</b> (для es), её хватает на всю погоду.<br><br>\n      А «обещают», «по прогнозу» — это <b class=\"hl\">soll</b>: <i>Morgen <b>soll</b> es regnen</i> — «завтра, говорят, будет дождь».","текст":"Будущее время в разговорной погоде делается глаголом werden = «становиться»: Morgen wird es kalt — «завтра станет холодно». Это тот самый werden, который Полина проходила у Даши в списке глаголов-исключений. Пока достаточно запомнить одну форму — wird (для es), её хватает на всю погоду. А «обещают», «по прогнозу» — это soll: Morgen soll es regnen — «завтра, говорят, будет дождь».","ти":14,"пи":7,"подтема":"Время и распорядок дня"},{"id":"9a8b89d28c","тема":"Местоимения","знак":"🧩","вид":"правило","раздел":"Утро: распорядок дня","урок":"urok18","урокИмя":"Урок 19","html":"Классическая тема для возвратных — и лучшая тренировка ловушки из раздела 5. Смотри: <i>Ich rasiere <b>mich</b></i> (бреюсь — больше ничего), но <i>Ich putze <b>mir</b> die Zähne</i> (чищу себе <b>зубы</b> — появилось второе дополнение).","текст":"Классическая тема для возвратных — и лучшая тренировка ловушки из раздела 5. Смотри: Ich rasiere mich (бреюсь — больше ничего), но Ich putze mir die Zähne (чищу себе зубы — появилось второе дополнение).","ти":14,"пи":7,"подтема":"Время и распорядок дня"},{"id":"c554c21dca","тема":"Разное","знак":"📎","вид":"правило","раздел":"Сегодня, завтра, вчера — и вокруг","урок":"urok10","урокИмя":"Урок 11","html":"<b>übermorgen</b> — послезавтра, <b>vorgestern</b> — позавчера. «По понедельникам» — одно слово с -s на конце: <b>montags</b>. «В выходные» — <i>am Wochenende</i>.","текст":"übermorgen — послезавтра, vorgestern — позавчера. «По понедельникам» — одно слово с -s на конце: montags. «В выходные» — am Wochenende.","ти":14,"пи":7,"подтема":"Время и распорядок дня"},{"id":"4d0041bdee","тема":"Множественное число","знак":"➕","вид":"правило","раздел":"🩺 Wien, Wein и Vene — три слова, которые тебе точно нужны","урок":"dasha3","урокИмя":"Занятие 3 с Дашей","html":"Итог: <b>Wien</b> — город (пишется с большой буквы, как все города). <b>der Wein</b> — вино. <b>die Vene</b> — вена, а во множественном <b>die Venen</b> с <b>-n</b> на конце. Последние два — твои рабочие слова.","текст":"Итог: Wien — город (пишется с большой буквы, как все города). der Wein — вино. die Vene — вена, а во множественном die Venen с -n на конце. Последние два — твои рабочие слова.","ти":14,"пи":8,"подтема":"Слова занятия"},{"id":"9b7fd0f015","тема":"Множественное число","знак":"➕","вид":"ловушка","раздел":"Новые слова из игры","урок":"dasha6","урокИмя":"Занятие 6 с Дашей","html":"<span class=\"big\">schon или schön — одна точка меняет всё</span>\n      <b>schon</b> [шон] — «уже»: <i>Ich bin schon fertig</i> — я уже закончил. <b>schön</b> [шён] — «красивый». Даша: «шон со смешной о — это красивый».<br><br>\n      И ещё одна ловушка: Гриша перевёл <b>die Geschwister</b> как «двоюродные». Нет — это <b>родные братья и сёстры</b> вместе, одним словом. Двоюродные — die Cousins und Cousinen.<br>\n      <b>die Ferien</b> — каникулы — бывают только во множественном, как по-русски.","текст":"schon или schön — одна точка меняет всё schon [шон] — «уже»: Ich bin schon fertig — я уже закончил. schön [шён] — «красивый». Даша: «шон со смешной о — это красивый». И ещё одна ловушка: Гриша перевёл die Geschwister как «двоюродные». Нет — это родные братья и сёстры вместе, одним словом. Двоюродные — die Cousins und Cousinen. die Ferien — каникулы — бывают только во множественном, как по-русски.","ти":14,"пи":8,"подтема":"Слова занятия"},{"id":"a6330c5f09","тема":"Множественное число","знак":"➕","вид":"ловушка","раздел":"⚠️ Что поправила Даша","урок":"polya13","урокИмя":"Занятие 13 Полины","html":"<span class=\"big\">dem или den — главная путаница занятия</span>\n      Полина сказала прямо: «я dem и den между собой путаю». Разложим по полочкам:<br><br>\n      <b>dem</b> — это <span class=\"hl\">Dativ</span>, вопрос <b>кому? чему?</b> — мужской и средний род: <i>Der Ball gehört <b>dem</b> Kind</i>, <i>Zeig <b>dem</b> Freund die Küche</i>.<br>\n      <b>den</b> — это <span class=\"hl\">Akkusativ</span> мужского рода, вопрос <b>кого? что?</b>: <i>Ich lade <b>den</b> David ein</i>, <i>Ich bringe <b>den</b> Kuchen</i>.<br><br>\n      Хитрость: <b>den</b> — это ещё и Dativ <span class=\"hl\">множественного</span> числа (<i>mit den Kindern</i>). Но в единственном числе правило простое: <b>кому → dem, кого → den</b>.","текст":"dem или den — главная путаница занятия Полина сказала прямо: «я dem и den между собой путаю». Разложим по полочкам: dem — это Dativ, вопрос кому? чему? — мужской и средний род: Der Ball gehört dem Kind, Zeig dem Freund die Küche. den — это Akkusativ мужского рода, вопрос кого? что?: Ich lade den David ein, Ich bringe den Kuchen. Хитрость: den — это ещё и Dativ множественного числа (mit den Kindern). Но в единственном числе правило простое: кому → dem, кого → den.","ти":14,"пи":8,"подтема":"Слова занятия"},{"id":"4149f5531a","тема":"Множественное число","знак":"➕","вид":"ловушка","раздел":"⚠️ Что поправила Даша","урок":"polya14","урокИмя":"Занятие 14 Полины","html":"<span class=\"big\">Ошибки и поправки занятия</span>\n      • <s>Mein Frühstück ist in Mittag</s> → <b>am Mittag</b> (или <b>am Nachmittag</b>): с временем суток — <b>am</b>.<br>\n      • <s>das Bus</s> → <b>der Bus</b> (мужской род).<br>\n      • <s>Das Auto ist mehr gut</s> → <b>Das Auto ist besser</b> (у gut своя форма).<br>\n      • <s>teuerer, am teuersten</s> в предложении со «чем» → <b>teurer als</b>: сравниваем двух — Komparativ, а не Superlativ.<br>\n      • <s>der Wasser / das Tee</s> → <b>das Wasser / der Tee</b>.<br>\n      • «Ich liebe frühstücken» → <b>Ich esse zum Frühstück gern …</b><br>\n      • Слово <b>интеллигентная</b> Полина перевела как <i>intelligent</i>, Даша: по смыслу «умная» — лучше <b>klug</b>.<br>\n      • <b>Bananen ist süß</b> → <b>Bananen sind süß</b> — <b>моя поправка</b> (множественное число), Даша на записи её не делала.<br>\n      • <b>Ich esse Obstsalat in der Schule</b> — Полина сказала это про далёкое прошлое; строго <b>Ich habe … gegessen</b> — тоже <b>моя поправка</b>.","текст":"Ошибки и поправки занятия • Mein Frühstück ist in Mittag → am Mittag (или am Nachmittag): с временем суток — am. • das Bus → der Bus (мужской род). • Das Auto ist mehr gut → Das Auto ist besser (у gut своя форма). • teuerer, am teuersten в предложении со «чем» → teurer als: сравниваем двух — Komparativ, а не Superlativ. • der Wasser / das Tee → das Wasser / der Tee. • «Ich liebe frühstücken» → Ich esse zum Frühstück gern … • Слово интеллигентная Полина перевела как intelligent, Даша: по смыслу «умная» — лучше klug. • Bananen ist süß → Bananen sind süß — моя поправка (множественное число), Даша на записи её не делала. • Ich esse Obstsalat in der Schule — Полина сказала это про далёкое прошлое; строго Ich habe … gegessen — тоже моя поправка.","ти":14,"пи":8,"подтема":"Слова занятия"},{"id":"45810f4fb0","тема":"Множественное число","знак":"➕","вид":"правило","раздел":"⚠️ Ошибки и мелочи","урок":"polya17","урокИмя":"Занятие 17 Полины","html":"1. <i>Diese Kinder</i> — <b>эти</b> дети, не «те» (те — <i>jene</i>).<br>\n      2. Коллега <b>кого</b> — <i>eine Kollegin <b>von</b> Christian</i>, не «für».<br>\n      3. <i>Ich danke solchem Kolleg<b>en</b></i> — это не множественное! <i>der Kollege</i> — «слабое» существительное (n-Deklination): во всех падежах, кроме Nominativ, получает <b>-n</b>.<br>\n      4. <b>kaufen или einkaufen?</b> <i>kaufen</i> — купить что-то конкретное: <i>Wir kaufen solche Bücher</i>. <i>einkaufen</i> — делать покупки, закупаться: <i>Ich kaufe im Supermarkt ein</i>.<br>\n      5. <b>zustimmen + Dativ</b> без предлога: соглашаться <i>чему-то</i> — <i>Ich stimme solchem Verhalten nie zu</i>. Так же <b>vertrauen + Dativ</b>: доверять кому/чему.<br>\n      6. <b>hell</b> — светлый, <b>dunkel</b> — тёмный; <b>wertvoll</b> — ценный (der Wert — ценность + voll — полный).","текст":"1. Diese Kinder — эти дети, не «те» (те — jene). 2. Коллега кого — eine Kollegin von Christian, не «für». 3. Ich danke solchem Kollegen — это не множественное! der Kollege — «слабое» существительное (n-Deklination): во всех падежах, кроме Nominativ, получает -n. 4. kaufen или einkaufen? kaufen — купить что-то конкретное: Wir kaufen solche Bücher. einkaufen — делать покупки, закупаться: Ich kaufe im Supermarkt ein. 5. zustimmen + Dativ без предлога: соглашаться чему-то — Ich stimme solchem Verhalten nie zu. Так же vertrauen + Dativ: доверять кому/чему. 6. hell — светлый, dunkel — тёмный; wertvoll — ценный (der Wert — ценность + voll — полный).","ти":14,"пи":8,"подтема":"Слова занятия"},{"id":"3cc3089fbf","тема":"Множественное число","знак":"➕","вид":"правило","раздел":"⭐⭐ Текст «Wandern»","урок":"polya19","урокИмя":"Занятие 19 Полины","html":"<b>Что разобрали в тексте:</b><br>\n      • <b>wandern</b> — ходить в поход, «прогулка, но сложная». <i>Wander-</i> перед словом — «походный»: <i>Wanderweg</i> — походная тропа, <i>Wanderstiefel</i> — походные ботинки, <i>Wanderer</i> — турист-походник.<br>\n      • <b>länger und anstrengender als</b> — длиннее и тяжелее, чем: <i>-er</i> у прилагательного = «более» (<i>lang → länger</i>, <i>anstrengend → anstrengender</i>), «чем» — <i>als</i>.<br>\n      • <b>gleichzeitig</b> — одновременно: <i>gleich</i> (одинаковый) + <i>die Zeit</i> (время).<br>\n      • <b>sich entspannen</b> — расслабляться, отдыхать. Возвратный глагол (с <i>sich</i>) — их пройдём после приставок.<br>\n      • <b>200.000</b> — <i>zweihunderttausend</i> (Полина сначала сказала «2000» — это <i>zweitausend</i>).<br>\n      • <b>viele</b> требует множественного: <i>viele Wanderwege, viele schöne Landschaften</i> — поэтому <i>Wald</i> (один лес) в пропуск после <i>viele</i> не подходит.<br>\n      • <b>die Deutschen</b> — немцы (все). <i>der Deutsche</i> — немец, <i>die Deutsche</i> — немка.<br>\n      • <b>ausgeben</b> — тратить; <b>einkehren</b> — заглянуть, зайти (поесть). Обе приставки в конце: <i>geben … <b>aus</b></i>, <i>kehren … <b>ein</b></i>.<br>\n      • <b>Essen und Trinken</b> с большой буквы — здесь это существительные: еда и питьё.","текст":"Что разобрали в тексте: • wandern — ходить в поход, «прогулка, но сложная». Wander- перед словом — «походный»: Wanderweg — походная тропа, Wanderstiefel — походные ботинки, Wanderer — турист-походник. • länger und anstrengender als — длиннее и тяжелее, чем: -er у прилагательного = «более» (lang → länger, anstrengend → anstrengender), «чем» — als. • gleichzeitig — одновременно: gleich (одинаковый) + die Zeit (время). • sich entspannen — расслабляться, отдыхать. Возвратный глагол (с sich) — их пройдём после приставок. • 200.000 — zweihunderttausend (Полина сначала сказала «2000» — это zweitausend). • viele требует множественного: viele Wanderwege, viele schöne Landschaften — поэтому Wald (один лес) в пропуск после viele не подходит. • die Deutschen — немцы (все). der Deutsche — немец, die Deutsche — немка. • ausgeben — тратить; einkehren — заглянуть, зайти (поесть). Обе приставки в конце: geben … aus, kehren … ein. • Essen und Trinken с большой буквы — здесь это существительные: еда и питьё.","ти":14,"пи":8,"подтема":"Слова занятия"},{"id":"6037745e8a","тема":"Множественное число","знак":"➕","вид":"правило","раздел":"⚠️ Ошибки и мелочи","урок":"polya19","урокИмя":"Занятие 19 Полины","html":"1. <i>Der Mann geht in dem Flughafen</i> → <b>Der Mann ist am Flughafen.</b> С вокзалом и аэропортом — <i>am</i>.<br>\n      2. <i>Wo sitzt diese Frau? — Sie sitzt <s>in den Zug</s></i> — на записи это прошло, но по правилу: <b>wo?</b> → Dativ → <b>Sie sitzt im Zug.</b> <i>in den Zug</i> — это «в поезд», куда? (<i>Sie steigt in den Zug ein</i>).<br>\n      3. <i>einen Tasche</i> → <b>eine Tasche</b>: <i>die Tasche</i> — женский род, в Akkusativ остаётся <i>eine</i>. Даша добавила: <i>und einen Koffer</i> (<i>der Koffer</i> → <i>einen</i>).<br>\n      4. 200.000 — <b>zweihunderttausend</b>, не «2000».<br>\n      5. После <b>viele</b> — множественное: <i>viele Wanderwege</i>, не <i>viele Wald</i>.<br>\n      6. <b>anstrengend</b> — «очень трудное слово, даже написать не могу» (Полина). По слогам: <i>an-stren-gend</i>.","текст":"1. Der Mann geht in dem Flughafen → Der Mann ist am Flughafen. С вокзалом и аэропортом — am. 2. Wo sitzt diese Frau? — Sie sitzt in den Zug — на записи это прошло, но по правилу: wo? → Dativ → Sie sitzt im Zug. in den Zug — это «в поезд», куда? (Sie steigt in den Zug ein). 3. einen Tasche → eine Tasche: die Tasche — женский род, в Akkusativ остаётся eine. Даша добавила: und einen Koffer (der Koffer → einen). 4. 200.000 — zweihunderttausend, не «2000». 5. После viele — множественное: viele Wanderwege, не viele Wald. 6. anstrengend — «очень трудное слово, даже написать не могу» (Полина). По слогам: an-stren-gend.","ти":14,"пи":8,"подтема":"Слова занятия"},{"id":"44f352458d","тема":"Прошедшее время","знак":"⏮","вид":"правило","раздел":"Диалоги","урок":"urok12","урокИмя":"Урок 13","html":"<i>ich bin noch nie operiert worden</i> — «меня ещё ни разу не оперировали». Это Perfekt страдательного залога (<i>worden</i>) — пока просто запомни фразу целиком, она частая.","текст":"ich bin noch nie operiert worden — «меня ещё ни разу не оперировали». Это Perfekt страдательного залога (worden) — пока просто запомни фразу целиком, она частая.","ти":14,"пи":8,"подтема":"Слова занятия"},{"id":"71fe9419d0","тема":"Приставки","знак":"🔗","вид":"правило","раздел":"⚠️ Ошибки занятия","урок":"dasha9","урокИмя":"Занятие 9 с Дашей","html":"1. <b>hilft</b>, не helft — гласная e → i; и <b>dem</b> Arzt — кому?<br>\n      2. Отделяемая приставка — в конец: räumt … <b>auf</b>.<br>\n      3. arbeit<b>e</b>t — основа на -t.<br>\n      4. Без глагола нельзя: Sie <b>ist</b> nicht verheiratet.<br>\n      5. Существительное отрицаем через <b>kein</b>, не nicht: <i>keine Kinder</i>.<br>\n      6. Ещё по мелочи: <i>schreiben</i> — «шрайбэн», без «к»; <i>anrufen</i> — звонить, не «отправлять».","текст":"1. hilft, не helft — гласная e → i; и dem Arzt — кому? 2. Отделяемая приставка — в конец: räumt … auf. 3. arbeitet — основа на -t. 4. Без глагола нельзя: Sie ist nicht verheiratet. 5. Существительное отрицаем через kein, не nicht: keine Kinder. 6. Ещё по мелочи: schreiben — «шрайбэн», без «к»; anrufen — звонить, не «отправлять».","ти":14,"пи":8,"подтема":"Слова занятия"},{"id":"6a0f325475","тема":"Глагол: спряжение","знак":"🔤","вид":"правило","раздел":"⚠️ Ошибки занятия","урок":"dasha8","урокИмя":"Занятие 8 с Дашей","html":"1. <b>Без глагола нельзя</b>: Даша — «глагол sein нам всегда нужен»: <i>Heidi Klum <b>ist</b> verheiratet</i>.<br>\n      2. <b>spricht</b> (e → i), <b>nicht</b> вместо «nein», язык без предлога: <i>Sie spricht nicht gut Deutsch</i>.<br>\n      3. После <b>heißt</b> никакого <i>ist</i>.<br>\n      4. <b>von Beruf</b> или <b>arbeitet als</b> — что-то одно.","текст":"1. Без глагола нельзя: Даша — «глагол sein нам всегда нужен»: Heidi Klum ist verheiratet. 2. spricht (e → i), nicht вместо «nein», язык без предлога: Sie spricht nicht gut Deutsch. 3. После heißt никакого ist. 4. von Beruf или arbeitet als — что-то одно.","ти":14,"пи":8,"подтема":"Слова занятия"},{"id":"b4ebaa01e6","тема":"Артикли и род","знак":"🎨","вид":"ловушка","раздел":"Новые слова занятия","урок":"dasha4","урокИмя":"Занятие 4 с Дашей","html":"<span class=\"big\">der See или die See?</span>\n      Одно и то же слово, но артикль меняет смысл целиком.\n      <b>der See</b> — озеро, <b>die See</b> — море. Даша сказала: чаще всего это слово\n      используют всё-таки для <b>озера</b>, а для моря есть отдельное слово <b>das Meer</b>.","текст":"der See или die See? Одно и то же слово, но артикль меняет смысл целиком. der See — озеро, die See — море. Даша сказала: чаще всего это слово используют всё-таки для озера, а для моря есть отдельное слово das Meer.","ти":14,"пи":8,"подтема":"Слова занятия"},{"id":"777e220fe7","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"Диалог Анны и Петера","урок":"dasha6","урокИмя":"Занятие 6 с Дашей","html":"<b>das Mädchen</b> — девочка, но средний род. Всё из-за суффикса <b>-chen</b>: он всегда даёт <b>das</b>, даже если речь о девочке.<br>\n      <b>wohnen</b> — жить где-то: <i>Wir wohnen in Hamburg</i>. «Моя семья <b>из</b> Гамбурга» было бы <i>aus Hamburg</i>, а «живём <b>в</b> Гамбурге» — <i>in Hamburg</i>.<br>\n      <b>nur</b> — «только»: <i>Ich habe nur eine Schwester</i>.","текст":"das Mädchen — девочка, но средний род. Всё из-за суффикса -chen: он всегда даёт das, даже если речь о девочке. wohnen — жить где-то: Wir wohnen in Hamburg. «Моя семья из Гамбурга» было бы aus Hamburg, а «живём в Гамбурге» — in Hamburg. nur — «только»: Ich habe nur eine Schwester.","ти":14,"пи":8,"подтема":"Слова занятия"},{"id":"e2e7b34495","тема":"Артикли и род","знак":"🎨","вид":"ловушка","раздел":"⚠️ Что поправила Даша","урок":"polya13","урокИмя":"Занятие 13 Полины","html":"<span class=\"big\">Роды, которые перепутались</span>\n      • <s>der Messer</s> → <b>das Messer</b> (нож — средний род)<br>\n      • <s>der Salz</s> → <b>das Salz</b> (соль — средний)<br>\n      • <s>die Servette</s> → <b>die Serviette</b> (произносится «зэрвьéтэ», французское слово)<br>\n      • <s>Zessel</s> → <b>die Schüssel</b> (миска)<br>\n      • <s>der Gelb</s> → <b>die Gabel</b> (вилка; «gelb» — это жёлтый)<br>\n      • <s>aus dem Metall</s> → <b>aus Metall</b> (материал — без артикля)","текст":"Роды, которые перепутались • der Messer → das Messer (нож — средний род) • der Salz → das Salz (соль — средний) • die Servette → die Serviette (произносится «зэрвьéтэ», французское слово) • Zessel → die Schüssel (миска) • der Gelb → die Gabel (вилка; «gelb» — это жёлтый) • aus dem Metall → aus Metall (материал — без артикля)","ти":14,"пи":8,"подтема":"Слова занятия"},{"id":"0623c11de8","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"📝 Текст: какой артикль поставить","урок":"polya15","урокИмя":"Занятие 15 Полины","html":"Даша: «здесь может стоять определённый, неопределённый или нулевой артикль». Правило простое:<br>\n      • предмет упоминается <b>впервые</b>, «какой-то» — <b>ein / eine</b>: <i>Ich habe <b>eine</b> Katze</i>;<br>\n      • о нём <b>уже говорили</b>, он конкретный — <b>der / die / das</b>: <i><b>Die</b> Katze ist schwarz</i>;<br>\n      • вещество, «вообще», множественное без уточнения — <b>без артикля</b>: <i>Ich esse gern Obst</i>, <i>wir lesen Bücher</i>.<br>\n      <b>Город:</b> слово <i>die Stadt</i> — с артиклем; конкретный город по названию (Berlin, Wien) — без артикля.","текст":"Даша: «здесь может стоять определённый, неопределённый или нулевой артикль». Правило простое: • предмет упоминается впервые, «какой-то» — ein / eine: Ich habe eine Katze; • о нём уже говорили, он конкретный — der / die / das: Die Katze ist schwarz; • вещество, «вообще», множественное без уточнения — без артикля: Ich esse gern Obst, wir lesen Bücher. Город: слово die Stadt — с артиклем; конкретный город по названию (Berlin, Wien) — без артикля.","ти":14,"пи":8,"подтема":"Слова занятия"},{"id":"a679e77fe4","тема":"Артикли и род","знак":"🎨","вид":"ловушка","раздел":"⚠️ Что поправила Даша","урок":"polya15","урокИмя":"Занятие 15 Полины","html":"<span class=\"big\">Ошибки и поправки занятия</span>\n      • <s>Du brauchst einem Arzt</s> (Полина рассуждала: «нуждаться в ком — дательный») → <b>Du brauchst einen Arzt</b>: после brauchen всегда Akkusativ.<br>\n      • <s>Sie helfen eine Frau</s> → <b>Sie helfen einer Frau</b>: Даша переспросила «какой ещё раз?» — helfen требует Dativ, die Frau → einer.<br>\n      • <s>Ihr helft einen Kind</s> → <b>einem Kind</b>: helfen требует Dativ, das Kind — средний род. На записи тут неразборчиво, даю правильную форму.<br>\n      • <s>heute kaufe ich den Apfel und die Banane</s> → <b>einen Apfel und eine Banane</b>: «покупаем какие-то, не конкретные».<br>\n      • <s>ein Stadt</s> → <b>eine Stadt</b>: die Stadt — женский род.<br>\n      • <s>Ich rufe ihm an</s> → <b>Ich rufe ihn an</b>: anrufen + Akkusativ.<br>\n      • <i>Wir treffen sie morgen</i> Полина перевела «встречаем её утром». <b>Моя поправка:</b> <i>morgen</i> (с маленькой) — «завтра», а «утром» — <i>am Morgen</i>.","текст":"Ошибки и поправки занятия • Du brauchst einem Arzt (Полина рассуждала: «нуждаться в ком — дательный») → Du brauchst einen Arzt: после brauchen всегда Akkusativ. • Sie helfen eine Frau → Sie helfen einer Frau: Даша переспросила «какой ещё раз?» — helfen требует Dativ, die Frau → einer. • Ihr helft einen Kind → einem Kind: helfen требует Dativ, das Kind — средний род. На записи тут неразборчиво, даю правильную форму. • heute kaufe ich den Apfel und die Banane → einen Apfel und eine Banane: «покупаем какие-то, не конкретные». • ein Stadt → eine Stadt: die Stadt — женский род. • Ich rufe ihm an → Ich rufe ihn an: anrufen + Akkusativ. • Wir treffen sie morgen Полина перевела «встречаем её утром». Моя поправка: morgen (с маленькой) — «завтра», а «утром» — am Morgen.","ти":14,"пи":8,"подтема":"Слова занятия"},{"id":"d8624752f6","тема":"Артикли и род","знак":"🎨","вид":"правило","раздел":"⚠️ Ошибки и мелочи","урок":"polya20","урокИмя":"Занятие 20 Полины","html":"1. <i>auf <s>diese</s> Stuhl</i> → <b>auf diesen Stuhl</b>: класть куда? → Akkusativ, <i>der Stuhl</i> → <i>diesen</i>.<br>\n      2. <i>sehr schlecht</i> — «очень <b>плохо</b>», а не «очень хорошо» (Полина сначала перевела наоборот).<br>\n      3. <i><s>Dieser</s> Spiegel gibt es im Flur</i> → <b>Diesen Spiegel gibt es im Flur.</b> После <i>es gibt</i> — всегда Akkusativ.<br>\n      4. <i>Diese Leute brauchen <s>diesen</s> Zeitungen</i> → <b>diese Zeitungen</b>: <i>brauchen</i> + Akkusativ (Полина думала — Dativ: «в чём нуждаются?»).<br>\n      5. <i>Dieser Mann will dieses Auto nicht <s>dieser Farbe</s> mieten</i> → <b>nicht in dieser Farbe</b> — предлог <i>in</i> не терять.<br>\n      6. <i>Ich trinke immer <s>derselbe</s> Kaffee</i> → <b>denselben Kaffee</b> (пью что? — Akkusativ, мужской).<br>\n      7. <i><s>dasselben</s> Brötchen</i> → <b>dasselbe Brötchen</b>: средний род в Akkusativ = Nominativ.<br>\n      8. <i>Ich mag <s>dieselbe</s>, die höflich sind</i> → <b>diejenigen</b>: «те, кто», а не «те же самые».<br>\n      9. Телефон: <b>84 37 09</b> — <i>null neun</i>, не «00» и не «99».","текст":"1. auf diese Stuhl → auf diesen Stuhl: класть куда? → Akkusativ, der Stuhl → diesen. 2. sehr schlecht — «очень плохо», а не «очень хорошо» (Полина сначала перевела наоборот). 3. Dieser Spiegel gibt es im Flur → Diesen Spiegel gibt es im Flur. После es gibt — всегда Akkusativ. 4. Diese Leute brauchen diesen Zeitungen → diese Zeitungen: brauchen + Akkusativ (Полина думала — Dativ: «в чём нуждаются?»). 5. Dieser Mann will dieses Auto nicht dieser Farbe mieten → nicht in dieser Farbe — предлог in не терять. 6. Ich trinke immer derselbe Kaffee → denselben Kaffee (пью что? — Akkusativ, мужской). 7. dasselben Brötchen → dasselbe Brötchen: средний род в Akkusativ = Nominativ. 8. Ich mag dieselbe, die höflich sind → diejenigen: «те, кто», а не «те же самые». 9. Телефон: 84 37 09 — null neun, не «00» и не «99».","ти":14,"пи":8,"подтема":"Слова занятия"},{"id":"7bc49da122","тема":"Падежи","знак":"📦","вид":"правило","раздел":"⚠️ Ошибки и мелочи","урок":"polya18","урокИмя":"Занятие 18 Полины","html":"1. <b>die Haltestelle</b> — с <i>-e-</i> посередине (не «Haltstelle»): <i>halten</i> + <i>die Stelle</i>.<br>\n      2. <i>sich interessieren <b>für</b></i> — интересоваться чем-то: <i>Sie interessiert sich für Mode</i> (на занятии прозвучало «interessant» — это «интересный»).<br>\n      3. <i>gefallen</i> — «нравиться» (Полина вспомнила, что <i>fallen</i> — падать): <i>Das Buch gefällt <b>mir</b></i> — мне нравится, кому? — Dativ.<br>\n      4. <b>В задании Даши</b> написано «in Deutschland, <b>Österreichisch</b>, in der Schweiz…». <i>Österreichisch</i> — «австрийский» (язык, прилагательное), а страна — <b>Österreich</b>: <i>in Österreich</i>.","текст":"1. die Haltestelle — с -e- посередине (не «Haltstelle»): halten + die Stelle. 2. sich interessieren für — интересоваться чем-то: Sie interessiert sich für Mode (на занятии прозвучало «interessant» — это «интересный»). 3. gefallen — «нравиться» (Полина вспомнила, что fallen — падать): Das Buch gefällt mir — мне нравится, кому? — Dativ. 4. В задании Даши написано «in Deutschland, Österreichisch, in der Schweiz…». Österreichisch — «австрийский» (язык, прилагательное), а страна — Österreich: in Österreich.","ти":14,"пи":8,"подтема":"Слова занятия"},{"id":"0167f34b2a","тема":"Порядок слов","знак":"📐","вид":"правило","раздел":"⭐⭐ Термин → простыми словами","урок":"urok49","урокИмя":"Урок 50","html":"Формула одна: <b>термин + связка + простое объяснение</b>. Связки: <b>also</b> — то есть; <b>das heißt</b> (d. h.) — это значит; <b>mit anderen Worten</b> — другими словами; <b>das bedeutet, dass …</b> — после dass глагол уходит в конец (урок 25). Порядок слов после also и das heißt не меняется: <i>Das heißt, <b>ein Blutgerinnsel verschließt</b> eine Vene.</i>","текст":"Формула одна: термин + связка + простое объяснение. Связки: also — то есть; das heißt (d. h.) — это значит; mit anderen Worten — другими словами; das bedeutet, dass … — после dass глагол уходит в конец (урок 25). Порядок слов после also и das h
