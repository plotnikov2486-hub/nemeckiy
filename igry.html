<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Учи слова, играя</title>
<meta name="description" content="Игры по словам уроков немецкого для врачей: выбери игры, уровень и уроки.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7a1f2b">
<style>

  :root { --bg:#eff1ec; --surface:#fbfaf7; --surface-2:#ffffff; --ink:#202422; --ink-muted:#5b615c; --ink-faint:#8b918a;
    --accent:#1f5f5b; --accent-ink:#ffffff; --play:#c97a2b; --play-ink:#ffffff; --line:#dde0d9; --bubble-a:#e7ede9; --bubble-m:#fbeadb;
    --warn:#b3402a; --warn-bg:#fbeae6; --hb:#1f6f8b; --hb-bg:#e3f0f4; --sn:#7b3fb5; --sn-bg:#f2ebfa; --tr:#8a2be2;
    --der:#1f6f8b; --die:#a03060; --das:#8a6d1a;
    --shadow:0 1px 2px rgba(32,36,34,0.06),0 6px 16px rgba(32,36,34,0.05); --radius:10px; }
  :root[data-theme="dark"] { --bg:#14181a; --surface:#1c2224; --surface-2:#202729; --ink:#edefea; --ink-muted:#9ba39c; --ink-faint:#6d746e;
    --accent:#4fb3a9; --accent-ink:#0d1413; --play:#e29a4e; --play-ink:#241407; --line:#2a3234; --bubble-a:#212a29; --bubble-m:#2a2420;
    --warn:#e8836b; --warn-bg:#2b1a16; --hb:#6db6d6; --hb-bg:#17282e; --sn:#b98ce0; --sn-bg:#241a30; --tr:#c9a4f0;
    --der:#6db6d6; --die:#e08bb0; --das:#e0c06a;
    --shadow:0 1px 2px rgba(0,0,0,0.3),0 8px 24px rgba(0,0,0,0.35); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#14181a; --surface:#1c2224; --surface-2:#202729; --ink:#edefea; --ink-muted:#9ba39c; --ink-faint:#6d746e;
    --accent:#4fb3a9; --accent-ink:#0d1413; --play:#e29a4e; --play-ink:#241407; --line:#2a3234; --bubble-a:#212a29; --bubble-m:#2a2420;
    --warn:#e8836b; --warn-bg:#2b1a16; --hb:#6db6d6; --hb-bg:#17282e; --sn:#b98ce0; --sn-bg:#241a30; --tr:#c9a4f0;
    --der:#6db6d6; --die:#e08bb0; --das:#e0c06a;
    --shadow:0 1px 2px rgba(0,0,0,0.3),0 8px 24px rgba(0,0,0,0.35); } }
  * { box-sizing:border-box; } body { margin:0; }
  .lp { background:var(--bg); color:var(--ink); font-family:-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif; max-width:800px; margin:0 auto; padding:24px 18px 64px; line-height:1.5; }
  .lp h1,.lp h2 { font-family:Georgia,"Iowan Old Style","Palatino Linotype","Times New Roman",serif; text-wrap:balance; margin:0; }
  
  .bb-top{ display:block; text-align:center; margin:34px auto 0; max-width:760px; padding:12px 18px;
    border-radius:12px; text-decoration:none; font-family:-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
    font-size:14.5px; font-weight:600; background:#1f5f5b; color:#fff; }
  @media (prefers-color-scheme: dark){ .bb-top{ background:#4fb3a9; color:#0d1413; } }
/* 05.11.2026 врач: страница игр заново — «Учи слова, играя»: сначала игры (все / несколько / одна),
   потом откуда слова (A1…C1 или уроки с репетитором своего профиля), потом уроки (все / несколько / один).
   Оформление — «Стекло» с бордовым, как главная (css/glass.css). */
:root{
  --ст-шрифт:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  --ст-фон:oklch(96.5% 0.008 255); --ст-стекло:oklch(100% 0 0 / .62); --ст-текст:oklch(22% 0.02 260); --ст-тихий:oklch(48% 0.02 260);
  --ст-линия:oklch(85% 0.015 255 / .7); --ст-свой:oklch(42% 0.14 15); --ст-свой-текст:oklch(99% 0 0);
  --ст-свет1:oklch(80% 0.09 15 / .45); --ст-свет2:oklch(86% 0.06 260 / .5);
  --ст-тень:0 1px 1px oklch(22% 0.02 260 / .04), 0 10px 30px -12px oklch(22% 0.02 260 / .18);
  --ст-размытие:saturate(180%) blur(22px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ст-фон:oklch(16% 0.02 262); --ст-стекло:oklch(26% 0.02 262 / .55); --ст-текст:oklch(96% 0.006 255); --ст-тихий:oklch(74% 0.015 255);
  --ст-линия:oklch(40% 0.02 262 / .6); --ст-свой:oklch(72% 0.12 12); --ст-свой-текст:oklch(16% 0.02 262);
  --ст-свет1:oklch(40% 0.12 15 / .5); --ст-свет2:oklch(36% 0.08 260 / .4);
} }
:root[data-theme="dark"]{
  --ст-фон:oklch(16% 0.02 262); --ст-стекло:oklch(26% 0.02 262 / .55); --ст-текст:oklch(96% 0.006 255); --ст-тихий:oklch(74% 0.015 255);
  --ст-линия:oklch(40% 0.02 262 / .6); --ст-свой:oklch(72% 0.12 12); --ст-свой-текст:oklch(16% 0.02 262);
  --ст-свет1:oklch(40% 0.12 15 / .5); --ст-свет2:oklch(36% 0.08 260 / .4);
}
html, body{ overflow-x:clip; }
body{ margin:0; font-family:var(--ст-шрифт); color:var(--ст-текст); letter-spacing:-.01em;
  background:radial-gradient(60vw 50vh at 12% 8%, var(--ст-свет1), transparent 70%), radial-gradient(55vw 45vh at 92% 30%, var(--ст-свет2), transparent 70%), var(--ст-фон);
  background-attachment:fixed; min-height:100vh; }
:where(button, a):focus-visible{ outline:2px solid var(--ст-свой); outline-offset:2px; }
@media (prefers-reduced-motion: reduce){ *, *::before, *::after{ animation-duration:.01ms !important; transition-duration:.01ms !important; } }

.экран{ max-width:560px; margin:0 auto; padding:16px 16px 120px; min-height:100vh; box-sizing:border-box; }
.экран[hidden]{ display:none; }
.верх{ display:flex; align-items:center; gap:10px; min-height:44px; }
.назад{ font:inherit; font-size:15px; font-weight:600; color:var(--ст-текст); text-decoration:none; background:var(--ст-стекло);
  -webkit-backdrop-filter:var(--ст-размытие); backdrop-filter:var(--ст-размытие); box-shadow:inset 0 0 0 1px var(--ст-линия);
  border:0; border-radius:999px; padding:10px 16px; cursor:pointer; }
.шапка{ text-align:center; margin:10px 0 18px; }
.шапка img{ width:min(46vw, 210px); height:auto; aspect-ratio:1; object-fit:contain; display:block; margin:0 auto -6px;
  filter:drop-shadow(0 18px 24px oklch(22% 0.02 260 / .25)); }
.шапка h1{ font-size:clamp(30px, 8.5vw, 40px); line-height:1.05; margin:6px 0 0; font-weight:700; letter-spacing:-.03em; overflow-wrap:break-word; min-width:0; }
.шапка p{ margin:8px 0 0; color:var(--ст-тихий); font-size:16px; }
h2.вопрос{ font-size:clamp(24px, 7vw, 32px); line-height:1.1; letter-spacing:-.025em; margin:18px 0 6px; font-weight:700; }
p.пояс{ margin:0 0 16px; color:var(--ст-тихий); font-size:15.5px; }

.список{ display:grid; gap:10px; }
.ряд{ display:flex; align-items:center; gap:14px; width:100%; text-align:left; font:inherit; color:inherit; text-decoration:none; cursor:pointer;
  padding:12px 14px; border:0; border-radius:20px; background:var(--ст-стекло); -webkit-backdrop-filter:var(--ст-размытие); backdrop-filter:var(--ст-размытие);
  box-shadow:inset 0 0 0 1px var(--ст-линия), var(--ст-тень); transition:translate .12s ease, box-shadow .12s ease; }
.ряд:active{ translate:0 1px; }
.ряд .зн{ width:56px; height:56px; flex:none; display:flex; align-items:center; justify-content:center; font-size:30px; }
.ряд .зн img{ width:56px; height:56px; object-fit:contain; border-radius:0; }
.ряд .тх{ flex:1; min-width:0; }
.ряд b{ display:block; font-size:17px; font-weight:650; line-height:1.2; }
.ряд small{ display:block; font-size:14px; color:var(--ст-тихий); margin-top:3px; line-height:1.3; }
.ряд .галка{ width:26px; height:26px; flex:none; border-radius:50%; box-shadow:inset 0 0 0 2px var(--ст-линия); display:none; }
.несколько .ряд .галка{ display:block; }
.ряд.вкл .галка{ background:var(--ст-свой); box-shadow:none; }
.ряд.вкл .галка::after{ content:""; display:block; width:7px; height:12px; margin:5px 0 0 9px; border:solid var(--ст-свой-текст); border-width:0 2.5px 2.5px 0; rotate:45deg; }
.несколько .ряд.вкл{ box-shadow:inset 0 0 0 2px var(--ст-свой), var(--ст-тень); }
.ряд .ур{ width:56px; height:56px; flex:none; border-radius:16px; background:var(--ст-свой); color:var(--ст-свой-текст);
  display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:700; }
.ряд.большой{ padding:16px; } .ряд.большой b{ font-size:19px; }
.ряд.тихо{ opacity:.45; pointer-events:none; }

.низ{ position:fixed; left:0; right:0; bottom:0; z-index:20; padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent, var(--ст-фон) 38%); }
.низ div{ max-width:560px; margin:0 auto; display:flex; gap:10px; }
.кн{ flex:1; font:inherit; font-size:16px; font-weight:650; min-height:52px; border-radius:16px; border:0; cursor:pointer; padding:0 12px;
  background:var(--ст-стекло); color:var(--ст-текст); -webkit-backdrop-filter:var(--ст-размытие); backdrop-filter:var(--ст-размытие);
  box-shadow:inset 0 0 0 1px var(--ст-линия), var(--ст-тень); }
.кн.гл{ background:var(--ст-свой); color:var(--ст-свой-текст); box-shadow:0 8px 20px -8px var(--ст-свой); }
.кн:disabled{ opacity:.45; cursor:default; }

#поле{ max-width:640px; margin:0 auto; padding:10px 12px 40px; }
/* сама игра: палитра ядра → стекло с бордовым */
#поле{ --accent:var(--ст-свой); --accent-ink:var(--ст-свой-текст); --surface:var(--ст-стекло); --surface-2:var(--ст-стекло);
  --ink:var(--ст-текст); --ink-muted:var(--ст-тихий); --line:var(--ст-линия); }
#поле, #поле *{ font-family:var(--ст-шрифт) !important; }
#поле .иг-карта{ background:var(--ст-стекло) !important; -webkit-backdrop-filter:var(--ст-размытие); backdrop-filter:var(--ст-размытие);
  box-shadow:inset 0 0 0 1px var(--ст-линия), var(--ст-тень) !important; border:0 !important; border-radius:24px !important; }
.низ div{ padding-right:56px; }   /* круглая кнопка темы справа внизу не налезает */
.пусто{ text-align:center; color:var(--ст-тихий); padding:40px 10px; font-size:16px; }
</style>
</head>
<body>

<!-- 1. какие игры -->
<section class="экран" id="э1">
  <div class="верх"><a class="назад" href="index.html">‹ Главная</a></div>
  <div class="шапка">
    <img src="img/igry/мед/джойстик.webp" alt="" onerror="this.style.display='none'">
    <h1>Учи слова, играя</h1>
    <p>Выбери игры, потом уровень и уроки</p>
  </div>
  <div class="список" id="игрыСписок"></div>
</section>

<!-- 2. откуда слова -->
<section class="экран" id="э2" hidden>
  <div class="верх"><button class="назад" data-назад="э1">‹ Игры</button></div>
  <h2 class="вопрос">Откуда брать слова?</h2>
  <p class="пояс" id="выбраноИгр"></p>
  <div class="список" id="уровни"></div>
</section>

<!-- 3. какие уроки -->
<section class="экран" id="э3" hidden>
  <div class="верх"><button class="назад" data-назад="э2">‹ Уровни</button></div>
  <h2 class="вопрос" id="урокиЗаг">Какие уроки?</h2>
  <p class="пояс">Нажми на урок — сразу начнём. Или возьми все слова уровня.</p>
  <div class="список" id="уроки"></div>
</section>

<!-- 4. игра -->
<section class="экран" id="э4" hidden style="padding:0 0 40px">
  <section class="игры" id="поле"></section>
</section>

<div class="низ" id="низ"><div id="низКн"></div></div>

<script src="tema.js"></script>
<script src="igry.js?v=202611111607"></script>
<script>
(function () {
  var профиль = 'grigoriy';
  try { профиль = localStorage.getItem('nemeckiy_profile') || 'grigoriy'; } catch (e) {}
  var РЕПЕТИТОР = профиль === 'polina'
    ? { код: 'polya', имя: 'Из уроков с репетитором', под: 'Занятия Полины с Дашей', подпись: 'Занятие ' }
    : { код: 'dasha', имя: 'Из уроков с репетитором', под: 'Занятия Гриши с Дашей', подпись: 'Занятие ' };
  var УРОВНИ = [
    { код: 'A1', имя: 'Начальный' }, { код: 'A2', имя: 'Элементарный' }, { код: 'B1', имя: 'Средний' },
    { код: 'B2', имя: 'Выше среднего' }, { код: 'C1', имя: 'Продвинутый' }
  ];
  var ПРЕДЕЛ = 80;   // столько строк словаря в одну игру, если уроков взято много: иначе викторина на тысячу вопросов

  var уроки = { claude: [], dasha: [], polya: [] };
  var выбор = { игры: [], откуда: null };
  var несколько = false, отмечено = {};

  function $(ид) { return document.getElementById(ид); }
  function экр(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  function показать(ид) {
    ['э1', 'э2', 'э3', 'э4'].forEach(function (э) { $(э).hidden = э !== ид; });
    несколько = false; отмечено = {};
    window.scrollTo(0, 0);
  }
  Array.prototype.forEach.call(document.querySelectorAll('[data-назад]'), function (к) {
    к.onclick = function () { var куда = к.getAttribute('data-назад'); показать(куда); if (куда === 'э1') экран1(); if (куда === 'э2') экран2(); };
  });

  function низ(кнопки) {
    $('низ').hidden = !кнопки.length;
    $('низКн').innerHTML = кнопки.map(function (к, i) {
      return '<button class="кн' + (к.гл ? ' гл' : '') + '" data-i="' + i + '"' + (к.нельзя ? ' disabled' : '') + '>' + экр(к.т) + '</button>';
    }).join('');
    Array.prototype.forEach.call($('низКн').querySelectorAll('button'), function (б) { б.onclick = кнопки[+б.getAttribute('data-i')].д; });
  }

  /* строит список с режимом «выбрать несколько»; элементы: {к, зн, имя, под, ссылка} */
  function список(куда, элементы, одно, много, подписьВсе) {
    var у = $(куда);
    function нарисовать() {
      у.classList.toggle('несколько', несколько);
      у.innerHTML = элементы.map(function (э) {
        var внутри = '<span class="зн">' + (э.зн || '') + '</span><span class="тх"><b>' + экр(э.имя) + '</b>' +
          (э.под ? '<small>' + экр(э.под) + '</small>' : '') + '</span><span class="галка"></span>';
        if (э.ссылка) return '<a class="ряд' + (несколько ? ' тихо' : '') + '" href="' + э.ссылка + '">' + внутри + '</a>';
        return '<button class="ряд' + (отмечено[э.к] ? ' вкл' : '') + '" data-к="' + экр(э.к) + '">' + внутри + '</button>';
      }).join('');
      Array.prototype.forEach.call(у.querySelectorAll('button.ряд'), function (б) {
        б.onclick = function () {
          var к = б.getAttribute('data-к');
          if (!несколько) { одно(к); return; }
          отмечено[к] = !отмечено[к]; б.classList.toggle('вкл', !!отмечено[к]); кнопки();
        };
      });
      кнопки();
    }
    function сколько() { return Object.keys(отмечено).filter(function (к) { return отмечено[к]; }); }
    function кнопки() {
      if (несколько) {
        var н = сколько();
        низ([{ т: 'Отмена', д: function () { несколько = false; отмечено = {}; нарисовать(); } },
             { т: н.length ? 'Дальше (' + н.length + ')' : 'Отметь галочками', гл: true, нельзя: !н.length, д: function () { много(сколько()); } }]);
      } else {
        низ([{ т: подписьВсе, гл: true, д: function () { много(элементы.filter(function (э) { return !э.ссылка; }).map(function (э) { return э.к; })); } },
             { т: 'Выбрать несколько', д: function () { несколько = true; отмечено = {}; нарисовать(); } }]);
      }
    }
    нарисовать();
  }

  /* ---------- 1. игры ---------- */
  function экран1() {
    var все = ИГРЫ.все().filter(function (и) { return и.код !== 'картинка'; });   // сцены «кухня/комната» заменила podpishi.html
    var э = все.map(function (и) { return { к: и.код, зн: и.значок, имя: и.имя, под: и.под }; });
    э.push({ к: 'подпиши', зн: '<img alt="" src="img/igry/мед/картинка.webp" onerror="this.replaceWith(\'🏷\')">', имя: 'Подпиши картинку',
      под: 'Человек, органы, кости, дом, улица, больница', ссылка: 'podpishi.html' });
    список('игрыСписок', э,
      function (к) { выбор.игры = [к]; показать('э2'); экран2(); },
      function (кк) { выбор.игры = кк; показать('э2'); экран2(); },
      'Все игры подряд');
  }

  /* ---------- 2. откуда слова ---------- */
  function экран2() {
    var имена = ИГРЫ.все().filter(function (и) { return выбор.игры.indexOf(и.код) >= 0; }).map(function (и) { return и.имя; });
    $('выбраноИгр').textContent = имена.length === 1 ? 'Игра: ' + имена[0] : 'Игр выбрано: ' + имена.length;
    var э = УРОВНИ.map(function (у) {
      var н = уроки.claude.filter(function (x) { return x.ур === у.код; }).length;
      return { код: у.код, имя: у.код + ' · ' + у.имя, под: н + ' ' + склон(н, 'урок', 'урока', 'уроков') };
    });
    var р = уроки[РЕПЕТИТОР.код] || [];
    э.push({ код: 'реп', имя: РЕПЕТИТОР.имя, под: РЕПЕТИТОР.под + ', ' + р.length + ' ' + склон(р.length, 'занятие', 'занятия', 'занятий') });
    $('уровни').innerHTML = э.map(function (x) {
      return '<button class="ряд большой" data-к="' + x.код + '"><span class="ур">' + (x.код === 'реп' ? 'Д' : x.код) + '</span>' +
        '<span class="тх"><b>' + экр(x.имя) + '</b><small>' + экр(x.под) + '</small></span></button>';
    }).join('');
    Array.prototype.forEach.call($('уровни').querySelectorAll('button'), function (б) {
      б.onclick = function () { выбор.откуда = б.getAttribute('data-к'); показать('э3'); экран3(); };
    });
    низ([]);
  }
  function склон(н, а, б, в) { var д = н % 10, с = н % 100; return д === 1 && с !== 11 ? а : д >= 2 && д <= 4 && (с < 12 || с > 14) ? б : в; }

  /* ---------- 3. уроки ---------- */
  function экран3() {
    var э;
    if (выбор.откуда === 'реп') {
      $('урокиЗаг').textContent = РЕПЕТИТОР.под;
      э = (уроки[РЕПЕТИТОР.код] || []).slice().reverse().map(function (x) {
        return { к: РЕПЕТИТОР.код + x.н, зн: '<span class="ур">' + x.н + '</span>', имя: РЕПЕТИТОР.подпись + x.н, под: x.имя };
      });
    } else {
      $('урокиЗаг').textContent = 'Уроки ' + выбор.откуда;
      э = уроки.claude.filter(function (x) { return x.ур === выбор.откуда; }).map(function (x) {
        return { к: 'urok' + x.н, зн: '<span class="ур">' + (x.н + 1) + '</span>', имя: 'Урок ' + (x.н + 1), под: x.имя };   // на сайте уроки с 1
      });
    }
    список('уроки', э, function (к) { играть([к]); }, играть, 'Все уроки');
    Array.prototype.forEach.call($('уроки').querySelectorAll('.зн .ур'), function (с) { с.parentNode.replaceWith(с); });
  }

  /* ---------- 4. игра ---------- */
  function перемешать(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function играть(файлы) {
    показать('э4'); низ([]);
    var поле = $('поле');
    поле.innerHTML = '<p class="пусто">Загружаю слова…</p>';
    Promise.all(файлы.map(function (ф) {
      return fetch('words/' + ф + '.json?v=202611111607').then(function (r) { return r.ok ? r.json() : []; })
        .then(function (строки) { return строки.map(function (с) { с = с.slice(); с[0] = ф + '/' + с[0]; return с; }); })   // звук: zvuk/<урок>/<ид>.mp3
        .catch(function () { return []; });
    })).then(function (части) {
      var слова = [].concat.apply([], части);
      if (слова.length > ПРЕДЕЛ) {
        // берём целыми кусками (диалог, рассказ, блок слов), иначе «Текст по порядку» и «Диалог» разваливаются
        var куски = {}, ключи = [];
        слова.forEach(function (с) { var к = String(с[0]).replace(/\d+$/, ''); if (!куски[к]) { куски[к] = []; ключи.push(к); } куски[к].push(с); });
        слова = [];
        перемешать(ключи).some(function (к) { слова = слова.concat(куски[к]); return слова.length >= ПРЕДЕЛ; });
      }
      var набор = файлы.length === 1 ? файлы[0] : (выбор.откуда || 'набор');
      var вышло = ИГРЫ.старт({
        корень: поле, слова: слова, урок: набор, база: '', сюжеты: true,   // 05.11: сюжетные кадры во весь экран
        звук: function (ид) { return ид && ид.indexOf('/') > 0 ? 'zvuk/' + ид + '.mp3' : ''; },
        меню: function (карта, есть, запуск) {
          var коды = выбор.игры.filter(function (к) { return есть.some(function (и) { return и.код === к; }); });
          if (!карта.dataset.былоМеню) { карта.dataset.былоМеню = '1'; if (коды.length) запуск(коды); return; }   // пусто — ниже скажем почему
          показать('э1'); экран1();   // «‹ Игры» и «К списку игр» из итога — на первый экран
        }
      });
      if (!вышло || !поле.querySelector('.иг-шапка')) {
        поле.innerHTML = '<p class="пусто">В этих уроках не хватает слов для выбранной игры. Возьми больше уроков или другую игру.</p>' +
          '<p style="text-align:center"><button class="кн гл" style="max-width:300px" id="кДругим">К выбору игр</button></p>';
        $('кДругим').onclick = function () { показать('э1'); экран1(); };
      }
    });
  }

  fetch('words/уроки.json?v=202611111607').then(function (r) { return r.json(); })
    .then(function (д) { уроки = д; }).catch(function () {})
    .then(function () { экран1(); });
})();
</script>
