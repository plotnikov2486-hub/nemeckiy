<style>

    --warn:#e8836b; --warn-bg:#2b1a16; --hb:#6db6d6; --hb-bg:#17282e; --sn:#b98ce0; --sn-bg:#241a30; --tr:#c9a4f0;
    --der:#6db6d6; --die:#e08bb0; --das:#e0c06a;
    --shadow:0 1px 2px rgba(0,0,0,0.3),0 8px 24px rgba(0,0,0,0.35); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#14181a; --surface:#1c2224; --surface-2:#202729; --ink:#edefea; --ink-muted:#9ba39c; --ink-faint:#6d746e;
    --accent:#4fb3a9; --accent-ink:#0d1413; --play:#e29a4e; --play-ink:#241407; --line:#2a3234; --bubble-a:#212a29; --bubble-m:#2a2420;
    --warn:#e8836b; --warn-bg:#2b1a16; --hb:#6db6d6; --hb-bg:#17282e; --sn:#b98ce0; --sn-bg:#241a30; --tr:#c9a4f0;
    --der:#6db6d6; --die:#e08bb0; --das:#e0c06a;
    --shadow:0 1px 2px rgba(0,0,0,0.3),0 8px 24px rgba(0,0,0,0.35); } }
  * { box-sizing:border-box; } body { margin:0; }
  .lp { background:var(--bg); color:var(--ink); font-family:-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif; max-width:800px; margin:0 auto; padding:24px 18px 64px; line-height:1.5; }
  .lp h1,.lp h2 { font-family:Georgia,"Iowan Old Style","Palatino Linotype","Times New Roman",serif; text-wrap:balance; margin:0; }
  .eyebrow { font-size:12px; letter-spacing:0.09em; text-transform:uppercase; color:var(--accent); font-weight:600; margin-bottom:6px; }
  .lp h1 { font-size:clamp(23px,5vw,31px); font-weight:600; }
  .lp .lede { color:var(--ink-muted); font-size:14.5px; margin-top:8px; max-width:64ch; }
  .hint { display:inline-flex; align-items:center; gap:6px; margin-top:12px; font-size:13px; color:var(--ink-muted); background:var(--surface); border:1px solid var(--line); padding:7px 12px; border-radius:999px; }
  .toc { background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:14px 18px; margin-top:22px; }
  .toc b { font-size:13px; color:var(--ink-muted); display:block; margin-bottom:8px; }
  .toc ol { margin:0; padding-left:20px; columns:2; column-gap:24px; font-size:13.5px; }
  .toc li { margin:3px 0; break-inside:avoid; }
  .toc a { color:var(--accent); text-decoration:none; } .toc a:hover { text-decoration:underline; }
  section.block { margin-top:36px; scroll-margin-top:62px; }

  .grammar-box b { color:var(--ink); } .grammar-box .hl { color:var(--play); font-weight:700; }

  .warn-box b { color:var(--warn); } .warn-box .big { font-size:15px; color:var(--ink); font-weight:700; display:block; margin-bottom:4px; }
  .link-box { background:var(--sn-bg); border:1px solid var(--line); border-left:4px solid var(--sn); border-radius:8px; padding:12px 14px; font-size:13.5px; color:var(--ink-muted); margin-bottom:14px; }
  .link-box b { color:var(--sn); }

  .pcard.hb { border-left:4px solid var(--hb); } .pcard.sn { border-left:4px solid var(--sn); } .pcard.wn { border-left:4px solid var(--warn); }
  .pcard .txt { flex:1; min-width:0; }
  .pcard .de { font-family:Georgia,serif; font-size:15.5px; font-weight:600; }
  .pcard .de b { color:var(--play); }
  .pcard .tr { font-size:11.5px; color:var(--tr); font-weight:600; margin-top:2px; }
  .pcard .ru { font-size:12.5px; color:var(--ink-muted); margin-top:1px; }
  .dialogue { display:flex; flex-direction:column; gap:10px; }

  .avatar { flex-shrink:0; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:Georgia,serif; font-weight:700; font-size:11px; color:var(--accent-ink); background:var(--accent); }

<style>
/* Вид ЗУБРа для страниц уроков. Переопределяем только переменные —
   разметка и классы остаются прежними, поэтому ничего не разъезжается. */
:root{
  --bg:#E9EBF6; --surface:#FFFFFF; --surface-2:#F3F4FA;
  --ink:#1C2242; --ink-muted:#6C7291; --ink-faint:#9AA0BE;
  --accent:#4A63D6; --accent-ink:#FFFFFF;
  --play:#EC6A86; --play-ink:#FFFFFF;
  --line:#DCE0F0;
  --warn:#E0455E; --warn-bg:#FBE6EA;
  --hb:#4A63D6; --hb-bg:#EAEDFA;
  --sn:#8E6AD6; --sn-bg:#F0EBFA;
  --tr:#8E6AD6;
  --der:#4A63D6; --die:#EC6A86; --das:#E8A33D;
  --bubble-a:#F3F4FA; --bubble-m:#FBF1DE;
  --shadow:0 12px 30px rgba(40,50,110,.12);
  --radius:18px;
}
:root[data-theme="dark"]{
  --bg:#12142A; --surface:#1E2140; --surface-2:#191C36;
  --ink:#EDEFF8; --ink-muted:#9AA0BE; --ink-faint:#6C7291;
  --accent:#8798EC; --accent-ink:#0D1020;
  --play:#EC6A86; --play-ink:#FFFFFF;
  --line:#2A2E52;
  --warn:#F08098; --warn-bg:#3A1620;
  --hb:#8798EC; --hb-bg:#1F2445;
  --sn:#B08CE8; --sn-bg:#2A2145;
  --tr:#B08CE8;
  --bubble-a:#232748; --bubble-m:#2E2718;
  --shadow:0 12px 30px rgba(0,0,0,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12142A; --surface:#1E2140; --surface-2:#191C36;
    --ink:#EDEFF8; --ink-muted:#9AA0BE; --ink-faint:#6C7291;
    --accent:#8798EC; --accent-ink:#0D1020;
    --play:#EC6A86; --play-ink:#FFFFFF;
    --line:#2A2E52;
    --warn:#F08098; --warn-bg:#3A1620;
    --hb:#8798EC; --hb-bg:#1F2445;
    --sn:#B08CE8; --sn-bg:#2A2145;
    --tr:#B08CE8;
    --bubble-a:#232748; --bubble-m:#2E2718;
    --shadow:0 12px 30px rgba(0,0,0,.35);
  }
}

/* Фон в уроках задан на .lp, а он не шире 800px — на большом экране
   по бокам оставался белый фон браузера, и в тёмной теме это резало глаз.
   Красим сам body тем же цветом. */
body{ background:var(--bg); color:var(--ink); }

/* Шрифт интерфейса — как в ЗУБРе. Немецкие слова намеренно оставляем
   Georgia: так иностранное слово видно с первого взгляда и не сливается
   с русским пояснением. */
body, .lp, .block, .desc, .lede, .eyebrow, .hint, .toc, .backbar{
  font-family:Figtree,-apple-system,system-ui,"Segoe UI",sans-serif;
}

/* Профиль: у Гриши синий, у Полины розовый. Атрибут data-кто ставит
   tema.js — здесь только меняем акцент под него. Градиенты трогаем
   тоже, иначе розовая страница осталась бы с синими кнопками. */
:root[data-кто="polina"]{
  --accent:#EC6A86; --hb:#EC6A86; --hb-bg:#FBE9EE;
}
:root[data-кто="polina"] .block h2 .num,
:root[data-кто="polina"] .play,
:root[data-кто="polina"] .bb-top{
  background:linear-gradient(135deg,#EC6A86,#F0A03C) !important;
  box-shadow:0 6px 16px rgba(236,106,134,.32);
}
:root[data-кто="polina"] .lp h1{
  background:linear-gradient(135deg,#EC6A86,#F0A03C);
  -webkit-background-clip:text; background-clip:text;
}
:root[data-кто="polina"][data-theme="dark"]{ --accent:#F5A0B4; --hb:#F5A0B4; --hb-bg:#3A2029; }
@media (prefers-color-scheme: dark){
  :root[data-кто="polina"]:not([data-theme="light"]){ --accent:#F5A0B4; --hb:#F5A0B4; --hb-bg:#3A2029; }
}

/* ── Главное отличие от прошлой попытки ──
   Раньше я поменял только цвета, и врач справедливо сказал, что разницы
   не видно: блоки уроков прозрачные и без отступов, так что ни тень,
   ни скругление на них не читались. Теперь каждый раздел урока —
   настоящая белая плитка, как карточки на сайте-визитке. */
.block{
  background:var(--surface);
  border-radius:22px;
  padding:20px 18px;
  margin-bottom:16px;
  box-shadow:0 12px 30px rgba(40,50,110,.12);
  border:none;
}
:root[data-theme="dark"] .block{ box-shadow:0 12px 30px rgba(0,0,0,.35); }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .block{
  box-shadow:0 12px 30px rgba(0,0,0,.35); } }

/* Номер раздела — кружок с фирменным градиентом, как иконки на визитке */
.block h2 .num{
  display:inline-flex; align-items:center; justify-content:center;
  width:34px; height:34px; border-radius:12px; margin-right:9px;
  background:linear-gradient(135deg,#4A63D6,#EC6A86);
  color:#fff; font-size:16px; font-weight:800;
  box-shadow:0 6px 14px rgba(74,99,214,.3);
}
.block h2{ display:flex; align-items:center; gap:2px; flex-wrap:wrap; }

/* Оглавление и врезки — тоже плитки, с мягкой тенью */
.toc, .grammar-box, .warn-box, .link-box{
  border-radius:18px; box-shadow:0 6px 18px rgba(40,50,110,.08);
}
:root[data-theme="dark"] .toc,
:root[data-theme="dark"] .grammar-box,
:root[data-theme="dark"] .warn-box{ box-shadow:0 6px 18px rgba(0,0,0,.3); }

/* Карточки слов — приподнимаются, как плитки в приложении */
.wcard, .pcard{
  border-radius:16px;
  box-shadow:0 6px 16px rgba(40,50,110,.10);
  transition:transform .14s ease, box-shadow .14s ease;
}
.wcard:active, .pcard:active{ transform:scale(.99); }

/* Кнопка звука — круглая, с градиентом и объёмной тенью */
.play{
  background:linear-gradient(135deg,#4A63D6,#EC6A86) !important;
  color:#fff !important; border:none !important;
  box-shadow:0 6px 16px rgba(74,99,214,.32);
}

/* Шапка — «стекло» как в айфоне: полупрозрачная, с размытием */
.backbar{
  position:sticky; top:0; z-index:50;
  background:color-mix(in srgb, var(--surface) 72%, transparent);
  -webkit-backdrop-filter:saturate(180%) blur(18px);
  backdrop-filter:saturate(180%) blur(18px);
  border-bottom:1px solid color-mix(in srgb, var(--line) 60%, transparent);
  box-shadow:0 1px 0 rgba(255,255,255,.35) inset;
}
.bb-link{ color:var(--accent); font-weight:700; }

/* Нижняя ссылка возврата — кнопка-таблетка, как призыв к действию на визитке */
.bb-top{
  display:block; text-align:center; margin:22px auto 30px; max-width:520px;
  padding:15px 22px; border-radius:999px; text-decoration:none;
  background:linear-gradient(135deg,#4A63D6,#EC6A86); color:#fff !important;
  font-weight:700; box-shadow:0 12px 26px rgba(74,99,214,.3);
}

/* Заголовок страницы — фирменный градиент */
.lp h1{
  background:linear-gradient(135deg,#4A63D6,#EC6A86);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  letter-spacing:-.02em;
}
.eyebrow{ letter-spacing:.1em; }

</style>
<!--ТЕМА-ЗУБРА-END-->
</head>
<body>

<div class="backbar">
  <a class="bb-link" href="index.html">&#8592; На главную</a>
  <span class="bb-title">Итоговый тест</span>
</div>

<div class="lp">
  <div class="eyebrow">Проверка уровня целиком</div>
  <h1>Итоговый тест</h1>
  <p class="lede">В конце каждого урока есть своя проверка. Здесь — проверка <b>всего уровня сразу</b>: слова берутся из всех уроков, поэтому забытое из третьего урока всплывёт, когда вы уже на шестнадцатом. 30 заданий, проверка строгая.</p>
  <div id="итЭкран"></div>
</div>

<script>
const УРОВНИ = {"A1": ["urok0", "urok1", "urok2", "urok3", "urok4", "urok5", "urok6", "urok7", "urok8", "urok9", "urok10", "urok11", "urok12", "urok13", "urok14", "urok15", "urok16"], "A2": ["urok17", "urok18", "urok19"]};
const ЗАНЯТИЯ = ["dasha1", "dasha2", "dasha3", "dasha4", "polya5", "polya6", "polya7", "polya8"];
const ВСЕГО = 30;
const $ = id => document.getElementById(id);
const ПРОФИЛЬ = localStorage.getItem('nemeckiy_profile') || 'grigoriy';

/* ── проверка ответа: один в один как в ЗУБРе ── */
function норм(s){
  return (s||'').toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue')
    .replace(/ß/g,'ss').replace(/ё/g,'е').replace(/[.,!?;:()«»"'’\-–—/]/g,' ')
    .replace(/\s+/g,' ').trim();
}
function чисто(s){
  return (s||'').split(/\s+[—–→]\s+/)[0].replace(/\([^)]*\)/g,'').replace(/\s+/g,' ').trim();
}
function сверить(ответ, правильно){
  const u = норм(ответ); if (!u) return false;
  let вар = String(правильно||'').split(/\s*[,/]\s*|\s+или\s+/).map(норм).filter(Boolean);
  if (!вар.length) вар = [норм(правильно)];
  return вар.includes(u);
}
function безТегов(s){ return (s||'').replace(/<[^>]+>/g,''); }
function перемешать(a){
  a = a.slice();
  for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function имяУрока(код){
  const м = код.match(/^([a-z]+)(\d+)$/); if (!м) return код;
  return {urok:'Урок ', dasha:'Занятие ', polya:'Занятие '}[м[1]] + м[2] +
         (м[1]==='dasha' ? ' с Дашей' : м[1]==='polya' ? ' Полины' : '');
}
function ссылкаУрока(код){
  return (код.startsWith('urok') ? 'lessons/' : 'dasha/') + код + '_interactive.html';
}

/* ── экран выбора уровня ── */
function выбор(){
  const карточки = Object.entries(УРОВНИ).map(([ур, уроки]) => {
    let л = null;
    try{ л = JSON.parse(localStorage.getItem(`nemeckiy_itog_${ПРОФИЛЬ}_${ур}`) || 'null'); }catch(e){}
    return `<button class="ит-ур ${ур.toLowerCase()}" data-ур="${ур}">
      <span class="знак">${ур}</span>
      <span class="текст"><b>Уровень ${ур}</b>
        <small>${уроки.length} ${скл(уроки.length,'урок','урока','уроков')} · ${ВСЕГО} заданий</small></span>
      ${л ? `<span class="балл">${л.процент}%</span>` : ''}
    </button>`;
  }).join('');

  let лз = null;
  try{ лз = JSON.parse(localStorage.getItem(`nemeckiy_itog_${ПРОФИЛЬ}_дaша`) || 'null'); }catch(e){}

  $('итЭкран').innerHTML = `<div class="ит-выбор">${карточки}
    <button class="ит-ур a2" data-ур="дaша">
      <span class="знак">Д</span>
      <span class="текст"><b>Занятия с Дашей</b>
        <small>${ЗАНЯТИЯ.length} ${скл(ЗАНЯТИЯ.length,'занятие','занятия','занятий')} · всё вместе</small></span>
      ${лз ? `<span class="балл">${лз.процент}%</span>` : ''}
    </button></div>`;

  $('итЭкран').querySelectorAll('[data-ур]').forEach(b => {
    b.onclick = () => запустить(b.dataset.ур);
  });
}

/* ── сбор словарей уровня ── */
async function запустить(ключ){
  const уроки = ключ === 'дaша' ? ЗАНЯТИЯ : УРОВНИ[ключ];
  $('итЭкран').innerHTML = '<div style="text-align:center;padding:40px">Собираю слова…</div>';

  const части = await Promise.all(уроки.map(async у => {
    try{
      const r = await fetch(`words/${у}.json`);
      if (!r.ok) return [];
      return (await r.json()).map(с => ({
        id: у + '_' + с[0], урок: у,
        de: безТегов(с[1]), тр: с[2], ru: чисто(с[3]),
        фраза: !!с[4], html: с[5] || с[1]
      }));
    }catch(e){ return []; }
  }));

  const было = new Set(), все = [];
  части.flat().forEach(к => {
    const кл = к.de.toLowerCase();
    if (!к.de || !к.ru || было.has(кл)) return;
    было.add(кл); все.push(к);
  });

  if (все.length < 10){
    $('итЭкран').innerHTML = '<div class="пусто">Слов пока мало — тест не собрать.</div>';
    return;
  }
  тест(ключ, все);
}

/* ── сам тест ── */
function тест(ключ, слова){
  const задания = собрать(слова);
  let шаг = 0, верных = 0, ошибки = [];

  показать();

  function собрать(слова){
    const простые = слова.filter(к => !к.фраза);
    const спропуском = слова.filter(к => /<b>[^<]{2,}<\/b>/.test(к.html));
    const артикльные = простые.filter(к => /^(der|die|das)\s+\S/i.test(к.de));
    const з = [];

    function варианты(верный, поле){
      const чужие = перемешать(простые.filter(к => к.id !== верный.id
        && норм(к[поле]) !== норм(верный[поле]))).slice(0,3);
      return чужие.length === 3 ? перемешать(чужие.concat([верный])) : null;
    }
    perem: {
      перемешать(простые).slice(0, 40).forEach(к => {
        if (з.length >= 12) return;
        const в = варианты(к, 'ru'); if (в) з.push({тип:'выбор-ru', к, вар:в});
      });
      перемешать(простые).slice(0, 40).forEach(к => {
        if (з.length >= 20) return;
        const в = варианты(к, 'de'); if (в) з.push({тип:'выбор-de', к, вар:в});
      });
      перемешать(артикльные).slice(0,4).forEach(к => з.push({тип:'артикль', к}));
      перемешать(простые).slice(0,4).forEach(к => з.push({тип:'вписать', к}));
      перемешать(спропуском).slice(0,4).forEach(к => з.push({тип:'пропуск', к}));
    }
    const видели = new Set(), итог = [];
    перемешать(з).forEach(x => {
      const кл = x.тип + '|' + x.к.id;
      if (видели.has(кл)) return; видели.add(кл); итог.push(x);
    });
    return итог.slice(0, ВСЕГО);
  }

  function показать(){
    if (шаг >= задания.length) return итог();
    const з = задания[шаг];
    const проц = Math.round(шаг / задания.length * 100);
    let тело = '';

    if (з.тип === 'выбор-ru' || з.тип === 'выбор-de'){
      const вопрос = з.тип === 'выбор-ru' ? з.к.de : з.к.ru;
      const поле = з.тип === 'выбор-ru' ? 'ru' : 'de';
      тело = `<div class="ит-тип">${з.тип==='выбор-ru'?'Что это значит?':'Как это по-немецки?'}</div>
        <div class="ит-вопрос">${вопрос}</div>
        <div class="ит-подпись">${з.тип==='выбор-ru' && з.к.тр ? '['+з.к.тр+']' : ''}</div>
        <div class="ит-вар">${з.вар.map(в=>`<button data-id="${в.id}">${в[поле]}</button>`).join('')}</div>`;
    } else if (з.тип === 'артикль'){
      тело = `<div class="ит-тип">Какой артикль?</div>
        <div class="ит-вопрос">… ${з.к.de.replace(/^(der|die|das)\s+/i,'')}</div>
        <div class="ит-подпись">${з.к.ru}</div>
        <div class="ит-вар">${['der','die','das'].map(а=>`<button data-арт="${а}">${а}</button>`).join('')}</div>`;
    } else if (з.тип === 'вписать'){
      тело = `<div class="ит-тип">Напиши по-немецки</div>
        <div class="ит-вопрос">${з.к.ru}</div>
        <div class="ит-подпись">артикль тоже нужен, если он есть</div>
        <input class="ит-поле" id="итПоле" autocomplete="off" autocorrect="off"
               autocapitalize="off" spellcheck="false" placeholder="по-немецки">${умляуты()}`;
    } else {
      const спрятано = з.к.html.match(/<b>([^<]+)<\/b>/)[1];
      з.ответ = спрятано;
      тело = `<div class="ит-тип">Вставь пропущенное</div>
        <div class="ит-вопрос">${з.к.html.replace(/<b>[^<]+<\/b>/, '<b>____</b>')}</div>
        <div class="ит-подпись">${з.к.ru}</div>
        <input class="ит-поле" id="итПоле" autocomplete="off" autocorrect="off"
               autocapitalize="off" spellcheck="false" placeholder="одно слово">${умляуты()}`;
    }

    $('итЭкран').innerHTML =
      `<div class="ит-шкала"><i style="width:${проц}%"></i></div>
       <div class="ит-счёт"><span>Задание ${шаг+1} из ${задания.length}</span>
       <span>верно: ${верных}</span></div>${тело}
       <div class="ит-отклик" id="итОтклик"></div>
       <div class="ит-низ" id="итНиз"></div>`;

    if (з.тип === 'выбор-ru' || з.тип === 'выбор-de'){
      $('итЭкран').querySelectorAll('.ит-вар button').forEach(b => {
        b.onclick = () => выбран(b, b.dataset.id === з.к.id, з.к[з.тип==='выбор-ru'?'ru':'de']);
      });
    } else if (з.тип === 'артикль'){
      const верный = (з.к.de.match(/^(der|die|das)/i)||[''])[0].toLowerCase();
      $('итЭкран').querySelectorAll('.ит-вар button').forEach(b => {
        b.onclick = () => выбран(b, b.dataset.арт === верный, з.к.de, верный);
      });
    } else {
      const поле = $('итПоле');
      подключитьУмляуты(поле);
      поле.onkeydown = e => { if (e.key === 'Enter') проверить(з); };
      $('итНиз').innerHTML = '<button id="итОК">Проверить</button>';
      $('итОК').onclick = () => проверить(з);
      поле.focus();
    }
  }

  function выбран(кнопка, верно, правильный, верныйАрт){
    const з = задания[шаг];
    $('итЭкран').querySelectorAll('.ит-вар button').forEach(b => {
      b.disabled = true;
      const это = верныйАрт ? b.dataset.арт === верныйАрт : b.dataset.id === з.к.id;
      if (это) b.classList.add('верно');
    });
    if (!верно) кнопка.classList.add('мимо');
    засчитать(верно, правильный);
  }

  function проверить(з){
    const поле = $('итПоле'); if (!поле || поле.disabled) return;
    const правильно = з.тип === 'пропуск' ? з.ответ : з.к.de;
    const верно = сверить(поле.value, правильно);
    поле.disabled = true; поле.classList.add(верно ? 'верно' : 'мимо');
    $('итОК').disabled = true;
    засчитать(верно, правильно);
  }

  function засчитать(верно, правильный){
    const з = задания[шаг];
    if (верно) верных++; else ошибки.push({...з.к, надо: правильный});
    try{
      if (localStorage.getItem('nemeckiy_zvuk_выкл') !== '1'){
        const имя = верно ? (localStorage.getItem('nemeckiy_zvuk_верно')||'верно2')
                          : (localStorage.getItem('nemeckiy_zvuk_мимо')||'мимо2');
        new Audio(`zvuk/otvet/${имя}.mp3`).play().catch(()=>{});
      }
    }catch(e){}
    $('итОтклик').innerHTML = верно
      ? `<span class="ок">✓ Верно.</span> ${з.к.тр ? '['+з.к.тр+']' : ''}`
      : `<span class="нет">✗ Мимо.</span> Правильно: <b>${правильный}</b>${з.к.тр ? ' ['+з.к.тр+']' : ''}`;
    $('итНиз').innerHTML = `<button id="итДальше">${
      шаг + 1 >= задания.length ? 'Показать результат' : 'Дальше'}</button>`;
    $('итДальше').onclick = () => { шаг++; показать(); };
  }

  function итог(){
    const проц = Math.round(верных / задания.length * 100);
    const слово = проц >= 90 ? 'Уровень уверенно закрыт.'
                : проц >= 75 ? 'Хорошо. Пара слабых мест — ниже.'
                : проц >= 50 ? 'Половина есть. Стоит вернуться к урокам ниже.'
                : 'Рано. Пройдите уроки заново — список ниже.';

    // считаем, из каких уроков ошибки — это и есть слабые места
    const по = {};
    ошибки.forEach(о => { по[о.урок] = (по[о.урок]||0)+1; });
    const слабые = Object.entries(по).sort((a,b)=>b[1]-a[1]).slice(0,5);

    let л = null;
    try{ л = JSON.parse(localStorage.getItem(`nemeckiy_itog_${ПРОФИЛЬ}_${ключ}`)||'null'); }catch(e){}
    if (!л || проц > л.процент){
      try{ localStorage.setItem(`nemeckiy_itog_${ПРОФИЛЬ}_${ключ}`,
        JSON.stringify({процент:проц, верных, всего:задания.length, когда:Date.now()})); }catch(e){}
    }

    $('итЭкран').innerHTML =
      `<div class="ит-итог"><div class="число">${проц}%</div>
        <div class="слово">${верных} из ${задания.length} · ${слово}</div></div>` +
      (слабые.length ? `<div class="ит-слабые"><h3>Куда вернуться:</h3>` +
        слабые.map(([у,н]) => `<a href="${ссылкаУрока(у)}">
          <span>${имяУрока(у)} — ${н} ${скл(н,'ошибка','ошибки','ошибок')}</span>
          <b>открыть →</b></a>`).join('') + '</div>' : '') +
      (ошибки.length ? `<div class="ит-ошибки">` + ошибки.map(о =>
        `<div><span class="де">${о.надо}</span> — ${о.ru}</div>`).join('') + '</div>' : '') +
      `<div class="ит-низ"><button id="итЕщё">Пройти ещё раз</button>
       <button class="тихая" id="итНазад">К выбору уровня</button></div>`;
    $('итЕщё').onclick = () => запустить(ключ);
    $('итНазад').onclick = выбор;
  }
}

function умляуты(){
  return '<div class="ит-умл">' + ['ä','ö','ü','ß'].map(ч =>
    `<button type="button" data-ч="${ч}">${ч}</button>`).join('') + '</div>';
}
function подключитьУмляуты(поле){
  $('итЭкран').querySelectorAll('.ит-умл button').forEach(b => {
    b.onclick = () => {
      const s = поле.selectionStart ?? поле.value.length;
      const e = поле.selectionEnd ?? s;
      поле.value = поле.value.slice(0,s) + b.dataset.ч + поле.value.slice(e);
      поле.focus(); поле.selectionStart = поле.selectionEnd = s + 1;
    };
  });
}
function скл(n, од, дв, мн){
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return мн;
  if (b > 1 && b < 5) return дв;
  if (b === 1) return од;
  return мн;
}
