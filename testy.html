<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тесты — медицинский немецкий</title>
<style>
  :root { --bg:#eff1ec; --surface:#fbfaf7; --surface-2:#ffffff; --ink:#202422; --ink-muted:#5b615c; --ink-faint:#8b918a;
    --accent:#1f5f5b; --accent-ink:#ffffff; --play:#c97a2b; --play-ink:#ffffff; --line:#dde0d9;
    --ok:#1f7a4d; --ok-bg:#e6f3ec; --bad:#b3402a; --bad-bg:#fbeae6; --star:#d99b1c;
    --shadow:0 1px 2px rgba(32,36,34,0.06),0 6px 16px rgba(32,36,34,0.05); --radius:12px; }
  :root[data-theme="dark"] { --bg:#14181a; --surface:#1c2224; --surface-2:#202729; --ink:#edefea; --ink-muted:#9ba39c; --ink-faint:#6d746e;
    --accent:#4fb3a9; --accent-ink:#0d1413; --play:#e29a4e; --play-ink:#241407; --line:#2a3234;
    --ok:#5fc48c; --ok-bg:#16291f; --bad:#e8836b; --bad-bg:#2b1a16; --star:#e3b754;
    --shadow:0 1px 2px rgba(0,0,0,0.3),0 8px 24px rgba(0,0,0,0.35); }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) {
    --bg:#14181a; --surface:#1c2224; --surface-2:#202729; --ink:#edefea; --ink-muted:#9ba39c; --ink-faint:#6d746e;
    --accent:#4fb3a9; --accent-ink:#0d1413; --play:#e29a4e; --play-ink:#241407; --line:#2a3234;
    --ok:#5fc48c; --ok-bg:#16291f; --bad:#e8836b; --bad-bg:#2b1a16; --star:#e3b754;
    --shadow:0 1px 2px rgba(0,0,0,0.3),0 8px 24px rgba(0,0,0,0.35); } }
  *{box-sizing:border-box;} [hidden]{display:none!important;} body{margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif; line-height:1.45;}

  .backbar{ position:sticky; top:0; z-index:99; display:flex; align-items:center; gap:10px;
    padding:10px 14px; background:rgba(31,95,91,0.96); backdrop-filter:blur(8px); box-shadow:0 1px 8px rgba(0,0,0,0.18); }
  @media (prefers-color-scheme: dark){ .backbar{ background:rgba(20,26,28,0.96); border-bottom:1px solid #2a3234; } }
  .backbar a.bb-link,.backbar button.bb-link{ display:inline-flex; align-items:center; gap:7px; color:#fff;
    text-decoration:none; font-weight:600; font-size:14.5px; font-family:inherit; cursor:pointer;
    padding:7px 14px; border-radius:999px; border:1px solid rgba(255,255,255,0.32); background:rgba(255,255,255,0.10); }
  .backbar .bb-title{ color:rgba(255,255,255,0.72); font-size:12.5px; margin-left:auto; white-space:nowrap; }
  .ogon{ display:inline-flex; align-items:center; gap:4px; color:#fff; font-size:13px; font-weight:600;
    background:rgba(255,255,255,0.12); border-radius:999px; padding:6px 11px; }

  .wrap{ max-width:760px; margin:0 auto; padding:16px 14px 80px; }
  h1{ font-family:Georgia,"Times New Roman",serif; font-size:clamp(21px,5vw,27px); font-weight:600; margin:6px 0 2px; }
  .lede{ color:var(--ink-muted); font-size:13.5px; margin:0 0 14px; }

  .tabs{ display:flex; gap:6px; background:var(--surface); border:1px solid var(--line);
    border-radius:999px; padding:4px; margin:14px 0 16px; overflow-x:auto; }
  .tabs button{ flex:1; white-space:nowrap; border:none; background:none; color:var(--ink-muted);
    font-family:inherit; font-size:13.5px; font-weight:600; padding:8px 12px; border-radius:999px; cursor:pointer; }
  .tabs button.on{ background:var(--accent); color:var(--accent-ink); }

  .svodka{ display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .svodka div{ flex:1; min-width:98px; background:var(--surface-2); border:1px solid var(--line);
    border-radius:var(--radius); padding:10px 12px; }
  .svodka b{ display:block; font-size:19px; font-variant-numeric:tabular-nums; }
  .svodka span{ font-size:11.5px; color:var(--ink-muted); }

  .poisk{ width:100%; padding:11px 14px; border:1px solid var(--line); border-radius:999px;
    background:var(--surface-2); color:var(--ink); font-family:inherit; font-size:14px; margin-bottom:14px; }

  .blok{ display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--surface-2);
    border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; margin-bottom:8px;
    cursor:pointer; font-family:inherit; color:inherit; box-shadow:var(--shadow); }
  .blok:hover{ border-color:var(--accent); }
  .blok .nm{ display:block; font-weight:600; font-size:14.5px; }
  .blok .po{ display:block; font-size:11.5px; color:var(--ink-muted); margin-top:2px; }
  .blok .tx{ flex:1; min-width:0; }
  .krug{ position:relative; width:42px; height:42px; flex-shrink:0; }
  .krug svg{ transform:rotate(-90deg); }
  .krug span{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:600; font-variant-numeric:tabular-nums; }
  .gotov{ color:var(--ok); font-weight:600; }

  .nomera{ display:flex; flex-wrap:wrap; gap:5px; margin:12px 0 16px; }
  .nomera button{ width:27px; height:27px; border-radius:8px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--ink-muted); font-family:inherit; font-size:11px; cursor:pointer;
    font-variant-numeric:tabular-nums; padding:0; }
  .nomera button.verno{ background:var(--ok-bg); border-color:var(--ok); color:var(--ok); }
  .nomera button.mimo{ background:var(--bad-bg); border-color:var(--bad); color:var(--bad); }
  .nomera button.tut{ outline:2px solid var(--accent); outline-offset:1px; }

  .vopros{ background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 16px 14px; box-shadow:var(--shadow); }
  .vopros .verh{ display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--ink-faint); margin-bottom:8px; }
  .vopros .tema{ background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:2px 9px; }
  .zvezda{ margin-left:auto; border:none; background:none; font-size:19px; cursor:pointer; color:var(--ink-faint); padding:0 2px; }
  .zvezda.on{ color:var(--star); }
  .vopros h2{ font-size:17px; font-weight:600; margin:0 0 14px; font-family:inherit; line-height:1.35; }
  .otvety{ display:flex; flex-direction:column; gap:8px; }
  .otvety button{ text-align:left; padding:12px 14px; border:1px solid var(--line); border-radius:10px;
    background:var(--surface); color:var(--ink); font-family:inherit; font-size:14.5px; cursor:pointer; }
  .otvety button:hover:not(:disabled){ border-color:var(--accent); }
  .otvety button:disabled{ cursor:default; }
  .otvety button.verno{ background:var(--ok-bg); border-color:var(--ok); color:var(--ok); font-weight:600; }
  .otvety button.mimo{ background:var(--bad-bg); border-color:var(--bad); color:var(--bad); }
  .poyasn{ margin-top:12px; padding:11px 13px; background:var(--surface); border:1px solid var(--line);
    border-radius:10px; font-size:13.5px; color:var(--ink-muted); }
  .dalshe{ margin-top:14px; width:100%; padding:13px; border:none; border-radius:10px; background:var(--accent);
    color:var(--accent-ink); font-family:inherit; font-size:15px; font-weight:600; cursor:pointer; }
  .pusto{ text-align:center; color:var(--ink-muted); font-size:14px; padding:40px 10px; }
  .itog{ text-align:center; background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius); padding:26px 18px; }
  .itog .bal{ font-size:40px; font-weight:600; font-variant-numeric:tabular-nums; }
  .knopki{ display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; }
  .knopki button{ flex:1; min-width:130px; padding:12px; border-radius:10px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); font-family:inherit; font-size:14px; font-weight:600; cursor:pointer; }
  .knopki button.glav{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .rezhim{ display:flex; gap:12px; align-items:center; width:100%; text-align:left; background:var(--surface-2);
    border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:8px; cursor:pointer;
    font-family:inherit; color:inherit; }
  .rezhim:hover{ border-color:var(--accent); }
  .rezhim .zn{ font-size:23px; } .rezhim .nm{ display:block; font-weight:600; font-size:15px; }
  .rezhim .po{ display:block; font-size:12px; color:var(--ink-muted); margin-top:2px; }
  .chasy{ font-variant-numeric:tabular-nums; font-weight:600; color:var(--play); }
</style>
</head>
<body>
<div class="backbar">
  <a class="bb-link" href="index.html">‹ Немецкий</a>
  <button class="bb-link" id="knNazad" hidden>‹ К списку</button>
  <span class="ogon" id="ogon" title="дней подряд">🔥 0</span>
</div>

<div class="wrap" id="korn"><p class="pusto">Загружаю вопросы…</p></div>

<script>
(function(){
"use strict";
var ПУТЬ = 'testy/';
var огл = null, блокКэш = {}, экран = 'Блоки', сеанс = null;

/* ---------- память ---------- */
function взять(ключ, поум){ try{ var с = localStorage.getItem(ключ); return с ? JSON.parse(с) : поум; }catch(e){ return поум; } }
function класть(ключ, зн){ try{ localStorage.setItem(ключ, JSON.stringify(зн)); }catch(e){} }
var прогресс = взять('mt_прогресс', {});      // {"3": {"7": 1, "8": 0}}  1 — верно, 0 — мимо
var избранное = взять('mt_избранное', []);    // массив вопросов целиком
var ошибки = взять('mt_ошибки', []);          // массив вопросов целиком
var дни = взять('mt_дни', {последний:'', подряд:0});

function сегодня(){ var д = new Date(); return д.getFullYear()+'-'+(д.getMonth()+1)+'-'+д.getDate(); }
function отметитьДень(){
  var с = сегодня(); if (дни.последний === с) return;
  var вчера = new Date(Date.now() - 864e5);
  var вч = вчера.getFullYear()+'-'+(вчера.getMonth()+1)+'-'+вчера.getDate();
  дни.подряд = (дни.последний === вч) ? (дни.подряд||0)+1 : 1;
  дни.последний = с; класть('mt_дни', дни); рисоватьОгонь();
}
function рисоватьОгонь(){ document.getElementById('ogon').textContent = '🔥 ' + (дни.подряд||0); }

/* ---------- загрузка ---------- */
function взятьБлок(н){
  if (блокКэш[н]) return Promise.resolve(блокКэш[н]);
  var имя = ПУТЬ + 'b' + String(н).padStart(3,'0') + '.json';
  return fetch(имя).then(function(о){ return о.json(); }).then(function(д){ блокКэш[н] = д; return д; });
}

/* ---------- общее ---------- */
function эк(с){ return String(с).replace(/[&<>"]/g, function(з){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[з]; }); }
var корн = document.getElementById('korn');
var кнНазад = document.getElementById('knNazad');
кнНазад.addEventListener('click', function(){ сеанс = null; кнНазад.hidden = true; рисовать(); });

function кольцо(доля, подпись){
  var r = 17, длина = 2*Math.PI*r, залито = длина*доля;
  return '<div class="krug"><svg width="42" height="42">'+
    '<circle cx="21" cy="21" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="4"/>'+
    (доля > 0 ? '<circle cx="21" cy="21" r="'+r+'" fill="none" stroke="'+(доля>=1?'var(--ok)':'var(--accent)')+'" stroke-width="4"'+
      ' stroke-dasharray="'+залито.toFixed(1)+' '+длина.toFixed(1)+'" stroke-linecap="round"/>' : '')+'</svg>'+
    '<span>'+подпись+'</span></div>';
}
function решеноВБлоке(н){ var п = прогресс[н]||{}; return Object.keys(п).length; }
function верноВБлоке(н){ var п = прогресс[н]||{}, к=0; for (var i in п) if (п[i]===1) к++; return к; }

/* ---------- экраны списка ---------- */
function рисовать(){
  кнНазад.hidden = !сеанс;
  if (сеанс) return рисоватьСеанс();
  var ч = '<h1>Тесты</h1><p class="lede">Медицинский немецкий из '+огл.всего.toLocaleString('ru')+
    ' вопросов · '+огл.блоков+' блоков по '+огл.в_блоке+'</p>';
  ч += '<div class="tabs">' + ['Блоки','Темы','Избранное','Ошибки','Режимы'].map(function(н){
        return '<button data-эк="'+н+'"'+(экран===н?' class="on"':'')+'>'+н+'</button>'; }).join('') + '</div>';

  var готовых = 0, решено = 0, верных = 0;
  огл.блоки.forEach(function(б){ var р = решеноВБлоке(б.н); решено += р; верных += верноВБлоке(б.н); if (р >= б.n) готовых++; });
  ч += '<div class="svodka"><div><b>'+готовых+' из '+огл.блоков+'</b><span>блоков пройдено</span></div>'+
       '<div><b>'+решено+'</b><span>вопросов решено</span></div>'+
       '<div><b>'+(решено ? Math.round(верных/решено*100) : 0)+'%</b><span>верных ответов</span></div></div>';

  if (экран === 'Блоки')      ч += списокБлоков();
  else if (экран === 'Темы')  ч += списокТем();
  else if (экран === 'Избранное') ч += списокПодборки(избранное, 'Звёздочкой отмечайте вопросы, к которым хотите вернуться.');
  else if (экран === 'Ошибки')    ч += списокПодборки(ошибки, 'Сюда сами падают вопросы, где вы ошиблись.');
  else                        ч += списокРежимов();
  корн.innerHTML = ч;

  корн.querySelectorAll('.tabs button').forEach(function(к){
    к.addEventListener('click', function(){ экран = к.dataset.эк; рисовать(); window.scrollTo(0,0); }); });
  корн.querySelectorAll('[data-блок]').forEach(function(к){
    к.addEventListener('click', function(){ открытьБлок(+к.dataset.блок); }); });
  корн.querySelectorAll('[data-режим]').forEach(function(к){
    к.addEventListener('click', function(){ запуститьРежим(к.dataset.режим); }); });
  var п = корн.querySelector('#poisk');
  if (п) п.addEventListener('input', function(){ фильтрБлоков(п.value.trim().toLowerCase()); });
}

function списокБлоков(){
  var ч = '<input class="poisk" id="poisk" placeholder="Найти блок или тему…">';
  ч += '<div id="спБлоков">';
  огл.блоки.forEach(function(б){
    var р = решеноВБлоке(б.н), доля = р / б.n;
    ч += '<button class="blok" data-блок="'+б.н+'" data-искать="'+эк((б.тема+' блок '+б.н).toLowerCase())+'">'+
         кольцо(доля, р ? Math.round(доля*100)+'%' : '')+
         '<span class="tx"><span class="nm">Блок '+б.н+' · вопросы '+б.от+'–'+б.до+'</span>'+
         '<span class="po">'+эк(б.тема)+' · '+(р ? р+' из '+б.n+' решено'+(р>=б.n?' ✓':'') : 'ещё не начат')+'</span></span></button>';
  });
  return ч + '</div>';
}
function фильтрБлоков(что){
  корн.querySelectorAll('#спБлоков .blok').forEach(function(к){
    к.style.display = (!что || к.dataset.искать.indexOf(что) >= 0) ? '' : 'none'; });
}
function списокТем(){
  var ч = '';
  огл.разделы.forEach(function(р){
    var первый = Math.floor((р.от-1)/огл.в_блоке)+1, последний = Math.floor((р.до-1)/огл.в_блоке)+1;
    var решено = 0, всего = 0;
    for (var н = первый; н <= последний; н++){ решено += решеноВБлоке(н); всего += огл.в_блоке; }
    ч += '<button class="blok" data-блок="'+первый+'">'+кольцо(Math.min(1, решено/Math.max(1,р.n)), '')+
         '<span class="tx"><span class="nm">'+эк(р.имя)+'</span>'+
         '<span class="po">'+р.n+' вопрос'+окончание(р.n)+' · блоки '+первый+'–'+последний+'</span></span></button>';
  });
  return ч;
}
function списокПодборки(массив, подсказка){
  if (!массив.length) return '<p class="pusto">'+подсказка+'</p>';
  return '<button class="blok" data-режим="'+(массив===избранное?'избранное':'ошибки')+'">'+
    кольцо(0, массив.length)+'<span class="tx"><span class="nm">Прорешать '+массив.length+' вопрос'+окончание(массив.length)+'</span>'+
    '<span class="po">подряд, вперемешку</span></span></button>';
}
function окончание(н){ var х = н%10, с = н%100;
  if (х===1 && с!==11) return ''; if (х>=2 && х<=4 && (с<12||с>14)) return 'а'; return 'ов'; }

function списокРежимов(){
  var р = [['экзамен','🎓','Экзамен','60 вопросов вперемешку, час времени, в конце оценка'],
           ['спринт','⚡','Спринт','20 вопросов подряд — быстрая проверка'],
           ['марафон','🏃','Марафон','без конца и без счёта, пока не надоест'],
           ['ошибки','🔁','Работа над ошибками','только то, где вы ошиблись ('+ошибки.length+')'],
           ['редкие','💎','Что давно не встречалось','вопросы из блоков, куда вы ещё не заходили']];
  return р.map(function(м){
    return '<button class="rezhim" data-режим="'+м[0]+'"><span class="zn">'+м[1]+'</span>'+
      '<span class="tx"><span class="nm">'+м[2]+'</span><span class="po">'+м[3]+'</span></span></button>';
  }).join('');
}

/* ---------- сеанс решения ---------- */
function открытьБлок(н){
  корн.innerHTML = '<p class="pusto">Загружаю блок '+н+'…</p>';
  взятьБлок(н).then(function(вопросы){
    var п = прогресс[н]||{};
    var первый = 0;
    for (var i = 0; i < вопросы.length; i++){ if (п[i] === undefined){ первый = i; break; } }
    сеанс = { вид:'блок', блок:н, вопросы:вопросы, номер:первый, имя:'Блок '+н,
              ответы:Object.assign({}, п), верно:0, всего:0 };
    рисовать(); window.scrollTo(0,0);
  }).catch(function(){ корн.innerHTML = '<p class="pusto">Не получилось загрузить блок. Проверьте связь.</p>'; });
}

function собратьСлучайные(сколько, толькоНовые){
  var номера = огл.блоки.map(function(б){ return б.н; });
  if (толькоНовые){ var н2 = номера.filter(function(н){ return !решеноВБлоке(н); }); if (н2.length) номера = н2; }
  перемешать(номера);
  var надо = Math.ceil(сколько / 12) + 1;
  return Promise.all(номера.slice(0, надо).map(взятьБлок)).then(function(куски){
    var все = [].concat.apply([], куски); перемешать(все); return все.slice(0, сколько);
  });
}
function перемешать(м){ for (var i = м.length-1; i > 0; i--){ var j = Math.floor(Math.random()*(i+1)); var т = м[i]; м[i] = м[j]; м[j] = т; } return м; }

function запуститьРежим(режим){
  if (режим === 'избранное' || режим === 'ошибки'){
    var список = (режим === 'избранное' ? избранное : ошибки).slice();
    if (!список.length) return;
    перемешать(список);
    сеанс = { вид:режим, вопросы:список, номер:0, имя:(режим==='избранное'?'Избранное':'Работа над ошибками'),
              ответы:{}, верно:0, всего:0 };
    return рисовать();
  }
  корн.innerHTML = '<p class="pusto">Собираю вопросы…</p>';
  var сколько = режим === 'экзамен' ? 60 : режим === 'спринт' ? 20 : 300;
  собратьСлучайные(сколько, режим === 'редкие').then(function(вопросы){
    сеанс = { вид:режим, вопросы:вопросы, номер:0, ответы:{}, верно:0, всего:0,
              имя: режим==='экзамен'?'Экзамен':режим==='спринт'?'Спринт':режим==='марафон'?'Марафон':'Редкие вопросы' };
    if (режим === 'экзамен'){ сеанс.конец = Date.now() + 3600e3; тикать(); }
    рисовать(); window.scrollTo(0,0);
  });
}
function тикать(){
  if (!сеанс || !сеанс.конец) return;
  var э = document.getElementById('chasy');
  if (э){
    var о = Math.max(0, сеанс.конец - Date.now());
    э.textContent = Math.floor(о/60000) + ':' + String(Math.floor(о/1000)%60).padStart(2,'0');
    if (о <= 0){ сеанс.номер = сеанс.вопросы.length; return рисовать(); }
  }
  setTimeout(тикать, 1000);
}

function рисоватьСеанс(){
  var с = сеанс;
  if (с.номер >= с.вопросы.length) return рисоватьИтог();
  var в = с.вопросы[с.номер];
  var ч = '<div class="vopros"><div class="verh"><span class="tema">'+эк(в.т||'')+'</span>'+
    '<span>'+с.имя+' · вопрос '+(с.номер+1)+' из '+с.вопросы.length+'</span>'+
    (с.конец ? '<span class="chasy" id="chasy">60:00</span>' : '')+
    '<button class="zvezda'+(вИзбранном(в)?' on':'')+'" id="zv" title="в избранное">★</button></div>';
  if (с.вид === 'блок'){
    ч += '<div class="nomera">';
    for (var i = 0; i < с.вопросы.length; i++){
      var о = с.ответы[i];
      ч += '<button data-иди="'+i+'" class="'+(о===1?'verno':о===0?'mimo':'')+(i===с.номер?' tut':'')+'">'+(i+1)+'</button>';
    }
    ч += '</div>';
  }
  ч += '<h2>'+эк(в.в)+'</h2><div class="otvety">';
  в.вар.forEach(function(т, i){ ч += '<button data-вар="'+i+'">'+эк(т)+'</button>'; });
  ч += '</div><div id="posle"></div></div>';
  корн.innerHTML = ч;

  корн.querySelectorAll('[data-вар]').forEach(function(к){
    к.addEventListener('click', function(){ ответить(+к.dataset.вар); }); });
  корн.querySelectorAll('[data-иди]').forEach(function(к){
    к.addEventListener('click', function(){ с.номер = +к.dataset.иди; рисовать(); }); });
  document.getElementById('zv').addEventListener('click', function(){ переключитьЗвезду(в, this); });
  if (с.конец) тикать();
  // если на вопрос уже отвечали — сразу показать, что было
  if (с.ответы[с.номер] !== undefined && с.вид === 'блок') показатьРазбор(в, -1, true);
}

function ответить(выбор){
  var с = сеанс, в = с.вопросы[с.номер];
  if (с.ответы[с.номер] !== undefined && с.вид === 'блок') return;
  var верно = выбор === в.о;
  с.ответы[с.номер] = верно ? 1 : 0;
  с.всего++; if (верно) с.верно++;
  if (с.вид === 'блок'){
    прогресс[с.блок] = прогресс[с.блок] || {};
    прогресс[с.блок][с.номер] = верно ? 1 : 0;
    класть('mt_прогресс', прогресс);
  }
  if (!верно) добавитьВОшибки(в); else убратьИзОшибок(в);
  отметитьДень();
  показатьРазбор(в, выбор, false);
}

function показатьРазбор(в, выбор, тихо){
  корн.querySelectorAll('[data-вар]').forEach(function(к){
    var i = +к.dataset.вар; к.disabled = true;
    if (i === в.о) к.classList.add('verno');
    else if (i === выбор) к.classList.add('mimo');
  });
  var п = document.getElementById('posle'); if (!п) return;
  var ч = '';
  if (в.п) ч += '<div class="poyasn">'+эк(в.п)+'</div>';
  ч += '<button class="dalshe" id="dalshe">'+(сеанс.номер+1 >= сеанс.вопросы.length ? 'Показать итог' : 'Дальше →')+'</button>';
  п.innerHTML = ч;
  document.getElementById('dalshe').addEventListener('click', function(){
    сеанс.номер++; рисовать(); window.scrollTo(0,0); });
  if (!тихо){
    var кр = корн.querySelector('[data-иди="'+сеанс.номер+'"]');
    if (кр) кр.className = (сеанс.ответы[сеанс.номер] === 1 ? 'verno' : 'mimo') + ' tut';
  }
}

function рисоватьИтог(){
  var с = сеанс, доля = с.всего ? с.верно/с.всего : 0;
  var оценка = доля >= 0.9 ? 'отлично' : доля >= 0.7 ? 'сдано' : доля >= 0.5 ? 'почти' : 'надо повторить';
  корн.innerHTML = '<div class="itog"><div class="bal">'+Math.round(доля*100)+'%</div>'+
    '<p>'+с.верно+' из '+с.всего+' — '+оценка+'</p>'+
    '<div class="knopki"><button class="glav" id="ещё">Ещё раз</button>'+
    '<button id="кСписку">К списку</button></div></div>';
  document.getElementById('кСписку').addEventListener('click', function(){ сеанс = null; рисовать(); });
  document.getElementById('ещё').addEventListener('click', function(){
    if (с.вид === 'блок'){ delete прогресс[с.блок]; класть('mt_прогресс', прогресс); открытьБлок(с.блок); }
    else запуститьРежим(с.вид);
  });
}

/* ---------- избранное и ошибки ---------- */
function ключВопроса(в){ return в.в + '|' + в.вар[в.о]; }
function вИзбранном(в){ return избранное.some(function(x){ return ключВопроса(x) === ключВопроса(в); }); }
function переключитьЗвезду(в, кн){
  if (вИзбранном(в)) избранное = избранное.filter(function(x){ return ключВопроса(x) !== ключВопроса(в); });
  else избранное.push(в);
  класть('mt_избранное', избранное); кн.classList.toggle('on');
}
function добавитьВОшибки(в){
  if (ошибки.some(function(x){ return ключВопроса(x) === ключВопроса(в); })) return;
  ошибки.push(в); if (ошибки.length > 2000) ошибки = ошибки.slice(-2000);
  класть('mt_ошибки', ошибки);
}
function убратьИзОшибок(в){
  var было = ошибки.length;
  ошибки = ошибки.filter(function(x){ return ключВопроса(x) !== ключВопроса(в); });
  if (ошибки.length !== было) класть('mt_ошибки', ошибки);
}

/* ---------- старт ---------- */
рисоватьОгонь();
fetch(ПУТЬ + 'оглавление.json').then(function(о){ return о.json(); }).then(function(д){
  огл = д; рисовать();
}).catch(function(){ корн.innerHTML = '<p class="pusto">Не нашёл банк вопросов. Похоже, страница ещё не выложена целиком.</p>'; });
})();
</script>
